<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1650" viewBox="0 0 3200 1650" role="img" aria-labelledby="title desc">
  <title id="title">Interactions across optimization execution, persistence, and approval boundaries</title>
  <desc id="desc">A card-and-connector map of an operator, optimization API, job service, SolverManager, Solver, candidate solution store, job store, approval service, and business data.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.58" stop-color="#0c1730"/>
      <stop offset="1" stop-color="#10142a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.52"/>
    </filter>
    <marker id="arrow-blue" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#66a8cf" stroke="none" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#8db475" stroke="none" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-amber" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#d2a15e" stroke="none" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-red" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L18 9 L0 18 Z" fill="#c97976" stroke="none" stroke-dasharray="none"/>
    </marker>
    <style>
      .title{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:54px;font-weight:700;fill:#f8fafc}
      .subtitle{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:20px;fill:#a9b8d4}
      .frame{fill:none;stroke:#2b4168;stroke-width:2.5}
      .zone{fill:#0f1b31;fill-opacity:.72;stroke:#344e75;stroke-width:2}
      .zoneTitle{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:21px;font-weight:700;fill:#b7c8e1}
      .zoneHint{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:15px;fill:#7890b1}
      .card{fill:#162740;stroke:#6685aa;stroke-width:2.5;filter:url(#shadow)}
      .cardBlue{stroke:#66a8cf}.cardGreen{stroke:#8db475}.cardAmber{stroke:#d2a15e}.cardTeal{stroke:#59b0aa}
      .cardEyebrow{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:15px;font-weight:700;letter-spacing:1px;fill:#8ea4c3}
      .cardTitle{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:27px;font-weight:700;fill:#f8fafc}
      .cardBody{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:18px;fill:#b9c7db}
      .code{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:16px;fill:#9fcbe3}
      .connector{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
      .request{stroke:#66a8cf}.persist{stroke:#8db475}.event{stroke:#d2a15e;stroke-dasharray:14 11}.conflict{stroke:#c97976;stroke-dasharray:12 10}
      .labelBg{fill:#101b30;stroke-width:1.7}
      .label{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:16px;font-weight:700}
      .legend{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:16px;fill:#bdc9da}
      .legendLine{stroke-width:4.5;stroke-linecap:round}
      .noteStrong{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:20px;font-weight:700;fill:#f1d6a7}
      .note{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:17px;fill:#b9c7db}
    </style>
  </defs>

  <rect width="3200" height="1650" rx="34" fill="url(#canvas)"/>
  <rect class="frame" x="28" y="28" width="3144" height="1594" rx="30"/>
  <text class="title" x="1600" y="86" text-anchor="middle">An Optimization Service Connects Execution, Persistence, and Approval</text>
  <text class="subtitle" x="1600" y="124" text-anchor="middle">Connectors show requests, data, and callbacks crossing component responsibility boundaries.</text>

  <rect class="zone" x="70" y="165" width="3060" height="410" rx="26"/>
  <text class="zoneTitle" x="105" y="204">REQUEST AND OPTIMIZATION EXECUTION</text>
  <text class="zoneHint" x="3090" y="204" text-anchor="end">application boundary / asynchronous solving runtime</text>

  <rect class="zone" x="70" y="620" width="3060" height="360" rx="26"/>
  <text class="zoneTitle" x="105" y="659">PERSISTENCE BOUNDARY</text>
  <text class="zoneHint" x="3090" y="659" text-anchor="end">Exposed persistence / reproducible optimization job</text>

  <rect class="zone" x="70" y="1020" width="3060" height="360" rx="26"/>
  <text class="zoneTitle" x="105" y="1059">APPROVAL AND BUSINESS APPLICATION</text>
  <text class="zoneHint" x="3090" y="1059" text-anchor="end">snapshot version check / transactional apply</text>

  <!-- Request and execution cards -->
  <g id="client-card">
    <rect class="card cardBlue" x="100" y="260" width="390" height="180" rx="22"/>
    <text class="cardEyebrow" x="135" y="302">CLIENT</text>
    <text class="cardTitle" x="135" y="348">Operator / API client</text>
    <text class="cardBody" x="135" y="392">Submit / query / approve</text>
  </g>
  <g id="api-card">
    <rect class="card cardBlue" x="650" y="260" width="400" height="180" rx="22"/>
    <text class="cardEyebrow" x="685" y="302">APPLICATION BOUNDARY</text>
    <text class="cardTitle" x="685" y="348">Optimization API</text>
    <text class="code" x="685" y="392">submit / query / approve</text>
  </g>
  <g id="job-service-card">
    <rect class="card cardTeal" x="1210" y="260" width="580" height="180" rx="22"/>
    <text class="cardEyebrow" x="1245" y="302">OPTIMIZATION APPLICATION</text>
    <text class="cardTitle" x="1245" y="348">OptimizationJobService</text>
    <text class="cardBody" x="1245" y="392">Job state / persistence / Solver callbacks</text>
  </g>
  <g id="solver-manager-card">
    <rect class="card cardBlue" x="1960" y="260" width="500" height="180" rx="22"/>
    <text class="cardEyebrow" x="1995" y="302">TIMEFOLD RUNTIME</text>
    <text class="cardTitle" x="1995" y="348">SolverManager</text>
    <text class="cardBody" x="1995" y="392">Asynchronous job lifecycle</text>
  </g>
  <g id="solver-card">
    <rect class="card cardAmber" x="2680" y="260" width="420" height="180" rx="22"/>
    <text class="cardEyebrow" x="2715" y="302">CONSTRAINT SOLVER</text>
    <text class="cardTitle" x="2715" y="348">Solver</text>
    <text class="cardBody" x="2715" y="392">Evaluate constraints / search</text>
  </g>

  <!-- Persistence cards -->
  <g id="candidate-store-card">
    <rect class="card cardGreen" x="920" y="720" width="600" height="180" rx="22"/>
    <text class="cardEyebrow" x="955" y="762">EXPOSED CANDIDATE STORE</text>
    <text class="cardTitle" x="955" y="808">Candidate Solution Store</text>
    <text class="cardBody" x="955" y="852">Best solution / Score / creation time</text>
  </g>
  <g id="job-store-card">
    <rect class="card cardGreen" x="1770" y="720" width="600" height="180" rx="22"/>
    <text class="cardEyebrow" x="1805" y="762">EXPOSED JOB STORE</text>
    <text class="cardTitle" x="1805" y="808">Optimization Job Store</text>
    <text class="cardBody" x="1805" y="852">Problem snapshot / job state / base version</text>
  </g>

  <!-- Approval and business cards -->
  <g id="approval-card">
    <rect class="card cardAmber" x="1360" y="1120" width="650" height="180" rx="22"/>
    <text class="cardEyebrow" x="1395" y="1162">BUSINESS SERVICE</text>
    <text class="cardTitle" x="1395" y="1208">Approval Service</text>
    <text class="cardBody" x="1395" y="1252">Validate base version / apply candidate</text>
  </g>
  <g id="business-data-card">
    <rect class="card cardTeal" x="2420" y="1120" width="560" height="180" rx="22"/>
    <text class="cardEyebrow" x="2455" y="1162">SOURCE OF TRUTH</text>
    <text class="cardTitle" x="2455" y="1208">Business Data</text>
    <text class="cardBody" x="2455" y="1252">Reservations / beds / timetables / version</text>
  </g>

  <!-- Request and execution relationships -->
  <g data-from="client" data-to="api">
    <path data-connector="client-to-api" class="connector request" d="M490 330 H650" marker-end="url(#arrow-blue)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="496" y="294" width="148" height="34" rx="17" stroke="#66a8cf"/>
      <text class="label" x="570" y="317" text-anchor="middle" fill="#a8d6ee">Request / result</text>
    </g>
  </g>
  <g data-from="api" data-to="client">
    <path data-connector="api-to-client" class="connector request" d="M650 370 H490" marker-end="url(#arrow-blue)"/>
  </g>
  <g data-from="api" data-to="job-service">
    <path data-connector="api-to-job-service" class="connector request" d="M1050 330 H1210" marker-end="url(#arrow-blue)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="1052" y="294" width="156" height="34" rx="17" stroke="#66a8cf"/>
      <text class="label" x="1130" y="317" text-anchor="middle" fill="#a8d6ee">Command / query</text>
    </g>
  </g>
  <g data-from="job-service" data-to="api">
    <path data-connector="job-service-to-api" class="connector request" d="M1210 370 H1050" marker-end="url(#arrow-blue)"/>
  </g>
  <g data-from="job-service" data-to="solver-manager">
    <path data-connector="job-service-to-solver-manager" class="connector request" d="M1790 310 H1960" marker-end="url(#arrow-blue)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="1811" y="258" width="128" height="34" rx="17" stroke="#66a8cf"/>
      <text class="label" x="1875" y="281" text-anchor="middle" fill="#a8d6ee">Run / cancel</text>
    </g>
  </g>
  <g data-from="solver-manager" data-to="solver">
    <path data-connector="solver-manager-to-solver" class="connector request" d="M2460 310 H2680" marker-end="url(#arrow-blue)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="2480" y="258" width="180" height="34" rx="17" stroke="#66a8cf"/>
      <text class="label" x="2570" y="281" text-anchor="middle" fill="#a8d6ee">Load problem / solve</text>
    </g>
  </g>

  <!-- Asynchronous solution relationships -->
  <g data-from="solver" data-to="solver-manager">
    <path data-connector="solver-to-solver-manager" class="connector event" d="M2680 390 H2460" marker-end="url(#arrow-amber)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="2470" y="458" width="200" height="34" rx="17" stroke="#d2a15e"/>
      <text class="label" x="2570" y="481" text-anchor="middle" fill="#f1d6a7">Best-solution event</text>
    </g>
  </g>
  <g data-from="solver-manager" data-to="job-service">
    <path data-connector="solver-manager-to-job-service" class="connector event" d="M1960 390 H1790" marker-end="url(#arrow-amber)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="1787" y="458" width="176" height="34" rx="17" stroke="#d2a15e"/>
      <text class="label" x="1875" y="481" text-anchor="middle" fill="#f1d6a7">Solution callback</text>
    </g>
  </g>

  <!-- Persistence relationships -->
  <g data-from="job-service" data-to="candidate-store">
    <path data-connector="job-service-to-candidate-store" class="connector persist" d="M1300 440 V720" marker-end="url(#arrow-green)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="1325" y="555" width="240" height="34" rx="17" stroke="#8db475"/>
      <text class="label" x="1445" y="578" text-anchor="middle" fill="#c9dda8">Persist candidate / Score</text>
    </g>
  </g>
  <g data-from="solver-manager" data-to="job-store">
    <path data-connector="solver-manager-to-job-store" class="connector persist" d="M2090 440 V720" marker-end="url(#arrow-green)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="2115" y="555" width="210" height="34" rx="17" stroke="#8db475"/>
      <text class="label" x="2220" y="578" text-anchor="middle" fill="#c9dda8">problemFinder(jobId)</text>
    </g>
  </g>
  <g data-from="job-service" data-to="job-store">
    <path data-connector="job-service-to-job-store" class="connector persist" d="M1600 440 V660 Q1600 680 1620 680 H1780 Q1800 680 1800 700 V720" marker-end="url(#arrow-green)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="1615" y="610" width="270" height="34" rx="17" stroke="#8db475"/>
      <text class="label" x="1750" y="633" text-anchor="middle" fill="#c9dda8">Problem snapshot / job state</text>
    </g>
  </g>

  <!-- Approval and business relationships -->
  <g data-from="api" data-to="approval">
    <path data-connector="api-to-approval" class="connector request" d="M790 440 V1180 Q790 1200 810 1200 H1360" marker-end="url(#arrow-blue)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="1045" y="1145" width="210" height="34" rx="17" stroke="#66a8cf"/>
      <text class="label" x="1150" y="1168" text-anchor="middle" fill="#a8d6ee">approve(jobId)</text>
    </g>
  </g>
  <g data-from="job-store" data-to="approval">
    <path data-connector="job-store-to-approval" class="connector persist" d="M1900 900 V1120" marker-end="url(#arrow-green)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="1925" y="990" width="164" height="34" rx="17" stroke="#8db475"/>
      <text class="label" x="2007" y="1013" text-anchor="middle" fill="#c9dda8">Base version</text>
    </g>
  </g>
  <g data-from="candidate-store" data-to="approval">
    <path data-connector="candidate-store-to-approval" class="connector persist" d="M1400 900 V1120" marker-end="url(#arrow-green)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="1425" y="990" width="190" height="34" rx="17" stroke="#8db475"/>
      <text class="label" x="1520" y="1013" text-anchor="middle" fill="#c9dda8">Candidate / Score</text>
    </g>
  </g>
  <g data-from="approval" data-to="business-data">
    <path data-connector="approval-to-business-data" class="connector persist" d="M2010 1175 H2420" marker-end="url(#arrow-green)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="2095" y="1126" width="240" height="34" rx="17" stroke="#8db475"/>
      <text class="label" x="2215" y="1149" text-anchor="middle" fill="#c9dda8">Validate version / apply</text>
    </g>
  </g>
  <g data-from="business-data" data-to="approval">
    <path data-connector="business-data-to-approval" class="connector conflict" d="M2700 1300 V1340 Q2700 1360 2680 1360 H1680 Q1660 1360 1660 1340 V1300" marker-end="url(#arrow-red)"/>
    <g class="relationshipLabel">
      <rect class="labelBg" x="2040" y="1318" width="290" height="34" rx="17" stroke="#c97976"/>
      <text class="label" x="2185" y="1341" text-anchor="middle" fill="#e9a4a1">Version conflict / re-optimize</text>
    </g>
  </g>

  <!-- Legend -->
  <g transform="translate(310,1430)">
    <line class="legendLine" x1="0" y1="0" x2="72" y2="0" stroke="#66a8cf"/>
    <polygon points="72,-9 90,0 72,9" fill="#66a8cf"/>
    <text class="legend" x="112" y="6">Request / control</text>

    <line class="legendLine" x1="430" y1="0" x2="502" y2="0" stroke="#8db475"/>
    <polygon points="502,-9 520,0 502,9" fill="#8db475"/>
    <text class="legend" x="542" y="6">Persistence / business apply</text>

    <line class="legendLine" x1="950" y1="0" x2="1022" y2="0" stroke="#d2a15e" stroke-dasharray="14 11"/>
    <polygon points="1022,-9 1040,0 1022,9" fill="#d2a15e"/>
    <text class="legend" x="1062" y="6">Asynchronous callback</text>

    <line class="legendLine" x1="1390" y1="0" x2="1462" y2="0" stroke="#c97976" stroke-dasharray="12 10"/>
    <polygon points="1462,-9 1480,0 1462,9" fill="#c97976"/>
    <text class="legend" x="1502" y="6">Version conflict</text>
  </g>

  <rect x="360" y="1500" width="2480" height="92" rx="24" fill="#1d2939" stroke="#d2a15e" stroke-width="2"/>
  <text class="noteStrong" x="1600" y="1538" text-anchor="middle">A Solver result is a candidate. Approval checks the current business version before applying it.</text>
  <text class="note" x="1600" y="1572" text-anchor="middle">Timefold owns search, the two Exposed stores make jobs reproducible, and the business service owns the final decision.</text>
</svg>
