<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img">
<title>Utilities and Adoption Path</title>
<desc>Pick the smallest utility for the job, then validate the same pattern in an example.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1D3148" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#4D6F9F"/></marker>
  <style>
    .bg{fill:#F7F9FC}.frame{fill:#fff;stroke:#D6E2ED;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS";font-size:42px;fill:#21334A;font-weight:700}
    .subtitle,.body,.small{font-family:"Comic Mono","Courier New";fill:#34465B}
    .subtitle{font-size:16px}.body{font-size:14px}.small{font-size:12px;fill:#657386}
    .label{font-family:"Architects Daughter","Comic Sans MS";font-size:22px;fill:#21334A;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.line{fill:none;stroke:#4D6F9F;stroke-width:2.8;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="bg" width="1500" height="760"/>
<rect class="frame" x="34" y="28" width="1432" height="704" rx="26"/>
<text class="title" x="70" y="82">Utilities and Adoption Path</text>
<text class="subtitle" x="72" y="114">Pick the smallest utility for the job, then validate the same pattern in an example.</text>
<g transform="translate(80 166)">
  <g>
  <rect class="card" x="0" y="78" width="230" height="108" rx="16" fill="#FFF3D8" stroke="#D6A441"/>
  <text class="label" x="115" y="116" text-anchor="middle" dominant-baseline="middle">Identity</text>
  <text class="body" x="115" y="146" text-anchor="middle">UUID v7 · ULID · KSUID</text>
<text class="body" x="115" y="166" text-anchor="middle">Snowflake · Hashids</text>
</g>
  <g>
  <rect class="card" x="0" y="248" width="230" height="108" rx="16" fill="#EAF7ED" stroke="#58A978"/>
  <text class="label" x="115" y="286" text-anchor="middle" dominant-baseline="middle">Domain Math</text>
  <text class="body" x="115" y="316" text-anchor="middle">money · measured</text>
<text class="body" x="115" y="336" text-anchor="middle">geo · science</text>
</g>
  <g>
  <rect class="card" x="0" y="418" width="230" height="108" rx="16" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="115" y="456" text-anchor="middle" dominant-baseline="middle">Decision Tools</text>
  <text class="body" x="115" y="486" text-anchor="middle">rule engine · FSM</text>
<text class="body" x="115" y="506" text-anchor="middle">workflow · probabilistic</text>
</g>
  <g>
  <rect class="card" x="360" y="248" width="260" height="124" rx="16" fill="#E7F1FF" stroke="#5A85D6"/>
  <text class="label" x="490" y="294" text-anchor="middle" dominant-baseline="middle">Minimal Module</text>
  <text class="body" x="490" y="324" text-anchor="middle">BOM first</text>
<text class="body" x="490" y="344" text-anchor="middle">one dependency at a time</text>
</g>
  <g>
  <rect class="card" x="760" y="78" width="260" height="108" rx="16" fill="#E7F7F5" stroke="#3CA7A0"/>
  <text class="label" x="890" y="116" text-anchor="middle" dominant-baseline="middle">Examples</text>
  <text class="body" x="890" y="146" text-anchor="middle">coroutines · redisson</text>
<text class="body" x="890" y="166" text-anchor="middle">virtual threads</text>
</g>
  <g>
  <rect class="card" x="760" y="248" width="260" height="108" rx="16" fill="#FCECEF" stroke="#DC6B82"/>
  <text class="label" x="890" y="286" text-anchor="middle" dominant-baseline="middle">Workshops</text>
  <text class="body" x="890" y="316" text-anchor="middle">cache · Redis · messaging</text>
<text class="body" x="890" y="336" text-anchor="middle">Spring Data patterns</text>
</g>
  <g>
  <rect class="card" x="760" y="418" width="260" height="108" rx="16" fill="#F5F7FA" stroke="#8FA1B3"/>
  <text class="label" x="890" y="456" text-anchor="middle" dominant-baseline="middle">Benchmark Notes</text>
  <text class="body" x="890" y="486" text-anchor="middle">read before claiming speed</text>
<text class="body" x="890" y="506" text-anchor="middle">rerun on your workload</text>
</g>
  <g>
  <rect class="card" x="1120" y="248" width="230" height="124" rx="16" fill="#EAF7ED" stroke="#58A978"/>
  <text class="label" x="1235" y="294" text-anchor="middle" dominant-baseline="middle">Service Adoption</text>
  <text class="body" x="1235" y="324" text-anchor="middle">small surface</text>
<text class="body" x="1235" y="344" text-anchor="middle">verified behavior</text>
</g>
