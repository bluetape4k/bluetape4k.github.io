<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="780" viewBox="0 0 1700 780">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1700" height="780"/>
<rect class="frame" x="34" y="28" width="1632" height="724" rx="24"/>
<text class="title" x="850" y="82" text-anchor="middle">Recommendation Example Flow</text>
<text class="subtitle" x="850" y="118" text-anchor="middle">Find co-buyers and friends-of-friends, then sort candidates by graph evidence</text>
<path class="edge" data-connector="user-to-purchased" d="M390 346 L401 346 Q412 346 412 328 L412 264 Q412 246 429 246 L445 246"/>
<path class="edge" data-connector="purchased-to-cobuyers" d="M765 246 L820 246"/>
<path class="edge" data-connector="cobuyers-to-products" d="M1140 246 L1195 246"/>
<path class="edge" data-connector="user-to-follows" d="M390 382 L407 382 Q424 382 424 400 L424 508 Q424 526 435 526 L445 526"/>
<path class="edge" data-connector="follows-to-people" d="M765 526 L820 526"/>
<g id="user">
  <rect x="90" y="305" width="300" height="118" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="240" y="361.5" text-anchor="middle">Seed User</text>
  <text class="nodeBody" x="240" y="395.5" text-anchor="middle">Alice or current viewer</text>
</g>
<g id="purchased">
  <rect x="445" y="175" width="320" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="605" y="232.5" text-anchor="middle">Purchased Products</text>
  <text class="nodeBody" x="605" y="266.5" text-anchor="middle">products already bought</text>
  <text class="nodeBody" x="605" y="289.5" text-anchor="middle">exclude from candidates</text>
</g>
<g id="cobuyers">
  <rect x="820" y="175" width="320" height="142" rx="12" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="980" y="232.5" text-anchor="middle">Co-buyers</text>
  <text class="nodeBody" x="980" y="266.5" text-anchor="middle">other users who bought</text>
  <text class="nodeBody" x="980" y="289.5" text-anchor="middle">seed products</text>
</g>
<g id="products">
  <rect x="1195" y="175" width="320" height="142" rx="12" fill="#134E4A" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1355" y="232.5" text-anchor="middle">Product Candidates</text>
  <text class="nodeBody" x="1355" y="266.5" text-anchor="middle">score by distinct co-buyers</text>
  <text class="nodeBody" x="1355" y="289.5" text-anchor="middle">sort score desc</text>
</g>
<g id="follows">
  <rect x="445" y="455" width="320" height="142" rx="12" fill="#4C1D95" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="605" y="512.5" text-anchor="middle">Follow Graph</text>
  <text class="nodeBody" x="605" y="546.5" text-anchor="middle">direct follows</text>
  <text class="nodeBody" x="605" y="569.5" text-anchor="middle">2-hop candidates</text>
</g>
<g id="people">
  <rect x="820" y="455" width="360" height="142" rx="12" fill="#7C2D12" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1000" y="512.5" text-anchor="middle">Follow Candidates</text>
  <text class="nodeBody" x="1000" y="546.5" text-anchor="middle">mutual follow count</text>
  <text class="nodeBody" x="1000" y="569.5" text-anchor="middle">exclude self and existing follows</text>
</g>
<rect x="88" y="684" width="1524" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="850" y="709" text-anchor="middle">The service code is intentionally explicit so the traversal can be read and tested.</text>
<text class="footer" x="850" y="733" text-anchor="middle">For large graphs, replace the N+1 traversal shape with native Cypher or Gremlin queries.</text>
</svg>
