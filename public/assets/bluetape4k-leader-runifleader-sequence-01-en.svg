<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc">
  <title id="title">runIfLeader Sequence</title><desc id="desc">One path executes the body; the contention path skips without side effects.</desc><defs>
