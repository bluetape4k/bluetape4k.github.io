<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1300" viewBox="0 0 2200 1300" role="img" aria-labelledby="bom-en-title bom-en-desc">
  <title id="bom-en-title">Patient A's product BOM structure and reservation translation</title>
  <desc id="bom-en-desc">The package components are frozen in a PackageExecutionSnapshot at purchase time, then translated into an AppointmentPlan revision, PlannedTreatment records, AppointmentItems, and a visit.</desc>
  <defs>
    <linearGradient id="bom-en-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.56" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <linearGradient id="bom-en-product" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#162b45"/><stop offset="1" stop-color="#202049"/></linearGradient>
    <linearGradient id="bom-en-reservation" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b4a"/><stop offset="1" stop-color="#192b4d"/></linearGradient>
    <filter id="bom-en-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.58"/></filter>
    <marker id="bom-en-primary-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M 1 1 L 14 7 L 1 13 Z" fill="#67e8f9" data-arrowhead="true" data-solid-head="true" data-role="primary" data-size="14x14"/></marker>
    <marker id="bom-en-secondary-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="secondary" data-size="10x10" data-visible-size="20x20" data-tip-direction="positive-x"><path d="M -10 -5 L 10 5 L -10 15 Z" fill="#fbbf24" data-arrowhead="true" data-solid-head="true" data-role="secondary" data-size="10x10" data-visible-size="20x20"/></marker>
    <style>
      .title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:40px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:17px;fill:#aebed2}.frame-title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}.card-title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:21px;font-weight:700;fill:#f8fafc}.body{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:15px;fill:#d7e3f3}.small{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:13px;fill:#aebed2}.code{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:13px;font-weight:700;fill:#f8fafc}.pill{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:12px;font-weight:700;fill:#f8fafc}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round}.primary-line{stroke:#67e8f9;stroke-width:4}.constraint-line{stroke:#fbbf24;stroke-width:3;stroke-dasharray:10 8}.bom-frame{fill:#0b1628;stroke:#345276;stroke-width:2}.product-card{fill:url(#bom-en-product);stroke:#60a5fa;stroke-width:3;filter:url(#bom-en-shadow)}.reservation-card{fill:url(#bom-en-reservation);stroke:#67e8f9;stroke-width:3;filter:url(#bom-en-shadow)}.component-card{fill:#172a43;stroke:#4f83c4;stroke-width:2}.bus{fill:none;stroke:#67e8f9;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="2200" height="1300" fill="url(#bom-en-bg)"/><rect x="28" y="28" width="2144" height="1244" rx="30" fill="none" stroke="#263a5e" stroke-width="2"/>
  <circle cx="2040" cy="120" r="230" fill="#7c3aed" opacity=".08"/><circle cx="120" cy="1160" r="250" fill="#0891b2" opacity=".07"/>
  <text class="title" x="70" y="82">Patient A: a product BOM translated into reservation units</text>
  <text class="subtitle" x="72" y="118">The product composition freezes at purchase time; the reservation service expands items, dependencies, and visit-grouping constraints into a plan and visit items.</text>
  <g transform="translate(1550 62)"><rect x="0" y="0" width="18" height="18" rx="5" fill="#162b45" stroke="#60a5fa" stroke-width="2"/><text class="small" x="28" y="15">Product BOM</text><rect x="150" y="0" width="18" height="18" rx="5" fill="#123b4a" stroke="#67e8f9" stroke-width="2"/><text class="small" x="178" y="15">Reservation translation</text><rect x="378" y="0" width="18" height="18" rx="5" fill="#3a2816" stroke="#fbbf24" stroke-width="2"/><text class="small" x="406" y="15">Grouping constraint</text></g>

  <rect class="bom-frame" x="70" y="190" width="910" height="990" rx="30"/><text class="frame-title" x="105" y="242">1. Product BOM composition</text><text class="small" x="105" y="274">Product-management facts plus the choices made at purchase</text>
  <g><rect class="product-card" x="125" y="490" width="325" height="190" rx="24"/><rect x="148" y="515" width="96" height="28" rx="14" fill="#60a5fa" opacity=".22"/><text class="pill" x="196" y="535" text-anchor="middle">Catalog source</text><text class="card-title" x="287" y="580" text-anchor="middle">Package product</text><text class="body" x="287" y="613" text-anchor="middle">Consultation · examination · treatment</text><text class="body" x="287" y="639" text-anchor="middle">Soothing care · follow-up</text></g>
  <path class="bus" data-bus="bom-component-radial" data-fanout="radial" data-fanout-id="package-components" d="M 450 585 H 481 M 481 585 Q 505 585 505 561 V 362 M 481 585 Q 505 585 505 609 V 967"/><text class="small" x="462" y="565" text-anchor="end">composition</text>
  <g><rect class="component-card" x="550" y="285" width="350" height="108" rx="18"/><text class="card-title" x="725" y="325" text-anchor="middle">Pre-treatment consultation</text><text class="code" x="725" y="357" text-anchor="middle">REQUIRED · 1 session</text><path class="connector primary-line" data-connector="bom-consultation" data-fanout-branch="package-components" data-source="package-product" data-target="consultation" d="M 505 362 Q 505 350 517 350 H 550" marker-end="url(#bom-en-primary-arrow)"/></g>
  <g><rect class="component-card" x="550" y="445" width="350" height="108" rx="18"/><text class="card-title" x="725" y="485" text-anchor="middle">Pre-treatment examination</text><text class="code" x="725" y="517" text-anchor="middle">REQUIRED · MAY_SAME_VISIT</text><path class="connector primary-line" data-connector="bom-examination" data-fanout-branch="package-components" data-source="package-product" data-target="examination" d="M 505 517 Q 505 505 517 505 H 550" marker-end="url(#bom-en-primary-arrow)"/></g>
  <g><rect class="component-card" x="550" y="605" width="350" height="108" rx="18"/><text class="card-title" x="725" y="645" text-anchor="middle">Main treatment</text><text class="code" x="725" y="677" text-anchor="middle">REQUIRED · MUST_SEPARATE_VISIT</text><path class="connector primary-line" data-connector="bom-treatment" data-fanout-branch="package-components" data-source="package-product" data-target="main-treatment" d="M 505 648 Q 505 660 517 660 H 550" marker-end="url(#bom-en-primary-arrow)"/></g>
  <g><rect class="component-card" x="550" y="765" width="350" height="108" rx="18"/><text class="card-title" x="725" y="805" text-anchor="middle">Soothing care</text><text class="code" x="725" y="837" text-anchor="middle">OPTIONAL · MAY_SAME_VISIT</text><path class="connector primary-line" data-connector="bom-soothing" data-fanout-branch="package-components" data-source="package-product" data-target="soothing-care" d="M 505 803 Q 505 815 517 815 H 550" marker-end="url(#bom-en-primary-arrow)"/></g>
  <g><rect class="component-card" x="550" y="925" width="350" height="108" rx="18"/><text class="card-title" x="725" y="965" text-anchor="middle">Follow-up check</text><text class="code" x="725" y="997" text-anchor="middle">REQUIRED · BLOCKING</text><path class="connector primary-line" data-connector="bom-follow-up" data-fanout-branch="package-components" data-source="package-product" data-target="follow-up" d="M 505 967 Q 505 979 517 979 H 550" marker-end="url(#bom-en-primary-arrow)"/></g>
  <rect x="120" y="805" width="350" height="230" rx="18" fill="#101f37" stroke="#345276" stroke-width="2" opacity=".9"/><text class="small" x="145" y="845">Axes frozen in the product BOM</text><text class="body" x="145" y="882">• choices and repetition counts</text><text class="body" x="145" y="914">• component product versions</text><text class="body" x="145" y="946">• dependency direction and interval</text><text class="body" x="145" y="978">• resource, time, and visit grouping</text>

  <rect class="bom-frame" x="1050" y="190" width="1080" height="990" rx="30"/><text class="frame-title" x="1085" y="242">2. From purchase snapshot to reservation units</text><text class="small" x="1085" y="274">The reservation service translates the validated contract; it does not redefine product meaning.</text>
  <g><rect class="product-card" x="1110" y="320" width="410" height="205" rx="24"/><rect x="1135" y="345" width="86" height="28" rx="14" fill="#60a5fa" opacity=".22"/><text class="pill" x="1178" y="365" text-anchor="middle">Frozen at purchase</text><text class="card-title" x="1315" y="416" text-anchor="middle">PackageExecutionSnapshot</text><text class="body" x="1315" y="454" text-anchor="middle">choices · repetition · versions · dependencies</text><text class="code" x="1315" y="493" text-anchor="middle">snapshotHash</text></g>
  <g><rect class="reservation-card" x="1650" y="320" width="410" height="205" rx="24"/><rect x="1675" y="345" width="78" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="1714" y="365" text-anchor="middle">Plan</text><text class="card-title" x="1855" y="416" text-anchor="middle">AppointmentPlan revision</text><text class="body" x="1855" y="454" text-anchor="middle">Fulfillment scope of one purchase</text><text class="code" x="1855" y="493" text-anchor="middle">revision + provenance</text></g>
  <path class="connector primary-line" data-connector="snapshot-plan" data-source="bom-snapshot" data-target="plan-revision" d="M 1520 422 H 1650" marker-end="url(#bom-en-primary-arrow)"/>
  <g><rect class="reservation-card" x="1110" y="665" width="410" height="190" rx="24"/><rect x="1135" y="690" width="78" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="1174" y="710" text-anchor="middle">Expanded</text><text class="card-title" x="1315" y="765" text-anchor="middle">PlannedTreatment 1..N</text><text class="body" x="1315" y="803" text-anchor="middle">Treatment items and predecessor edges</text><text class="code" x="1315" y="837" text-anchor="middle">BLOCKING · NON_BLOCKING</text></g>
  <g><rect class="reservation-card" x="1650" y="665" width="410" height="190" rx="24"/><rect x="1675" y="690" width="78" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="1714" y="710" text-anchor="middle">Visit</text><text class="card-title" x="1855" y="765" text-anchor="middle">AppointmentItem + Appointment</text><text class="body" x="1855" y="803" text-anchor="middle">Items grouped into one physical visit</text><text class="code" x="1855" y="837" text-anchor="middle">resource allocation · consent</text></g>
  <path class="connector primary-line" data-connector="snapshot-treatment" data-source="bom-snapshot" data-target="planned-treatment" d="M 1315 525 V 665" marker-end="url(#bom-en-primary-arrow)"/>
  <path class="connector primary-line" data-connector="plan-items" data-source="plan-revision" data-target="appointment-items" d="M 1855 525 V 665" marker-end="url(#bom-en-primary-arrow)"/>
  <path class="connector primary-line" data-connector="treatment-items" data-source="planned-treatment" data-target="appointment-items" d="M 1520 760 H 1650" marker-end="url(#bom-en-primary-arrow)"/>
  <path class="connector constraint-line" data-connector="snapshot-constraints" data-source="bom-snapshot" data-target="appointment-items" d="M 1520 480 H 1580 Q 1600 480 1600 500 V 670 Q 1600 700 1620 700 H 1650" marker-end="url(#bom-en-secondary-arrow)"/>
  <rect x="1455" y="548" width="150" height="34" rx="17" fill="#3a2816" stroke="#fbbf24" stroke-width="1.5"/><text class="pill" x="1530" y="570" text-anchor="middle">MUST / MAY grouping</text>
  <g><rect class="appointment-card" x="1370" y="930" width="430" height="145" rx="22" fill="#0f2d3b" stroke="#2dd4bf" stroke-width="2.5"/><text class="card-title" x="1585" y="980" text-anchor="middle">Physical visit and completion facts</text><text class="body" x="1585" y="1018" text-anchor="middle">Appointment is one physical visit;</text><text class="body" x="1585" y="1046" text-anchor="middle">completion provenance stays item-level.</text></g>
  <path class="connector primary-line" data-connector="items-appointment" data-source="appointment-items" data-target="appointment" d="M 1855 855 V 880 Q 1855 900 1835 900 H 1750 Q 1730 900 1730 915 V 930" marker-end="url(#bom-en-primary-arrow)"/>
  <path class="connector primary-line" data-connector="treatment-appointment" data-source="planned-treatment" data-target="appointment" d="M 1315 855 V 880 Q 1315 900 1335 900 H 1450 Q 1470 900 1470 915 V 930" marker-end="url(#bom-en-primary-arrow)"/>

  <text class="small" x="1085" y="1125">Reading rule</text><text class="body" x="1085" y="1154">The product BOM is the fulfillment contract. Time, capacity, and consent turn it into AppointmentItems,</text><text class="body" x="1085" y="1177">which make up a physical Appointment.</text>
</svg>
