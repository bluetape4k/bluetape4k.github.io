<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">The Central BOM Publishes a Compatible Version Set</title><desc id="desc">Repository BOMs own module lists; the central BOM owns the compatible version set.</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#36C5F0"/></marker></defs>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0D1B2D;stroke:#36536F;stroke-width:2}.card{fill:#10243A;stroke:#36536F;stroke-width:2}
    .focus{fill:#0C3044;stroke:#5EEAD4;stroke-width:2.5}.warn{fill:#332B18;stroke:#FBBF24;stroke-width:2}
    .title{font:700 40px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}.subtitle{font:500 20px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}
    .card-title{font:700 24px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}.body{font:600 18px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}
    .chip{font:700 16px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#5EEAD4}.label{font:700 16px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#36C5F0}
    .connector{fill:none;stroke:#36C5F0;stroke-width:4;marker-end:url(#arrow)}.divider{stroke:#36536F;stroke-width:2}
    .footer{font:600 18px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}
  </style>
  <rect width="1600" height="980" class="canvas"/><rect x="32" y="32" width="1536" height="916" rx="32" class="frame"/>
  <text x="80" y="98" class="title">The Central BOM Publishes a Compatible Version Set</text><text x="80" y="138" class="subtitle">The central BOM composes repository BOMs and external compatibility lines; consumers omit module versions.</text>

    <rect x="80" y="270" width="400" height="220" rx="24" class="card"/>
  <text x="108" y="322" class="card-title">Repository BOMs</text>
  <text x="108" y="368" class="body">projects / exposed / aws / image</text>
<text x="108" y="406" class="body">text / graph / leader / javers</text>
    <rect x="600" y="240" width="400" height="280" rx="24" class="focus"/>
  <text x="628" y="292" class="card-title">bluetape4k-dependencies</text>
  <text x="628" y="338" class="body">Compose sub-BOMs</text>
<text x="628" y="376" class="body">Align external dependencies</text>
    <rect x="1120" y="270" width="400" height="220" rx="24" class="card"/>
  <text x="1148" y="322" class="card-title">Consumer projects</text>
  <text x="1148" y="368" class="body">Applications / workshops</text>
<text x="1148" y="406" class="body">Declare only needed modules</text>
    <path d="M480 380 H580" class="connector"/><text x="530" y="350" text-anchor="middle" class="label">import published BOMs</text>
    <path d="M1000 380 H1100" class="connector"/><text x="1050" y="350" text-anchor="middle" class="label">apply central BOM</text>
    <rect x="600" y="600" width="400" height="94" rx="20" class="card"/>
    <text x="800" y="640" text-anchor="middle" class="chip">api(platform(...))</text>
    <text x="800" y="674" text-anchor="middle" class="body">Maven POM dependencyManagement</text><line x1="80" y1="830" x2="1520" y2="830" class="divider"/>
  <text x="800" y="884" text-anchor="middle" class="footer">Repository BOMs own module lists; the central BOM owns the compatible version set.</text>
</svg>