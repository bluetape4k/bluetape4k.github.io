<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k Dependencies BOM flow</title>
  <desc id="desc">Upstream repository BOMs and external dependency lines feed into the bluetape4k-dependencies BOM, which consumers import as one platform dependency.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: "Comic Mono", "SFMono-Regular", "Menlo", "Consolas", monospace;
      fill: #24364f;
    }
    .title {
      font-family: "Architects Daughter", "Comic Sans MS", "Comic Mono", cursive;
      font-size: 46px;
      fill: #17253f;
    }
    .subtitle {
      font-size: 18px;
      fill: #5d6f88;
    }
    .lane-title {
      font-family: "Architects Daughter", "Comic Sans MS", "Comic Mono", cursive;
      font-size: 24px;
      fill: #24364f;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      fill: #17253f;
    }
    .card-subtitle {
      font-size: 14px;
      fill: #5d6f88;
    }
    .small {
      font-size: 13px;
      fill: #5d6f88;
    }
    .chip {
      font-size: 14px;
      font-weight: 700;
      fill: #24364f;
    }
    .flow-label {
      font-size: 15px;
      font-weight: 700;
      fill: #2563eb;
    }
    .footer {
      font-family: "Architects Daughter", "Comic Sans MS", "Comic Mono", cursive;
      font-size: 20px;
      fill: #334155;
    }
  </style>

  <rect x="0" y="0" width="1400" height="760" fill="#f6f9fc"/>
  <rect x="34" y="28" width="1332" height="704" rx="26" fill="#ffffff" stroke="#cbdbea" stroke-width="2"/>

  <text class="title" x="72" y="86">Bluetape4k Dependencies BOM Flow</text>
  <text class="subtitle" x="74" y="124">Publish repo BOMs first, then publish one central BOM that consumers can import without per-module versions.</text>

  <rect x="76" y="166" width="430" height="452" rx="18" fill="#eef6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text class="lane-title" x="106" y="210">Upstream repo BOMs</text>
  <text class="small" x="108" y="236">Each repository owns its module line.</text>

  <g>
    <rect x="108" y="270" width="168" height="48" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text class="chip" x="192" y="300" text-anchor="middle">projects BOM</text>
    <rect x="306" y="270" width="168" height="48" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text class="chip" x="390" y="300" text-anchor="middle">exposed BOM</text>

    <rect x="108" y="338" width="168" height="48" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text class="chip" x="192" y="368" text-anchor="middle">aws BOM</text>
    <rect x="306" y="338" width="168" height="48" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text class="chip" x="390" y="368" text-anchor="middle">image BOM</text>

    <rect x="108" y="406" width="168" height="48" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text class="chip" x="192" y="436" text-anchor="middle">text BOM</text>
    <rect x="306" y="406" width="168" height="48" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text class="chip" x="390" y="436" text-anchor="middle">graph BOM</text>

    <rect x="108" y="474" width="168" height="48" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text class="chip" x="192" y="504" text-anchor="middle">leader BOM</text>
    <rect x="306" y="474" width="168" height="48" rx="12" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text class="chip" x="390" y="504" text-anchor="middle">javers BOM</text>
  </g>

  <rect x="558" y="166" width="332" height="452" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
  <rect x="600" y="272" width="248" height="172" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text class="card-title" x="724" y="318" text-anchor="middle">bluetape4k-dependencies</text>
  <text class="card-subtitle" x="724" y="346" text-anchor="middle">Maven Central BOM</text>
  <text class="small" x="724" y="382" text-anchor="middle">imports sub-BOMs</text>
  <text class="small" x="724" y="408" text-anchor="middle">aligns external lines</text>

  <rect x="600" y="484" width="248" height="74" rx="14" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="1.5"/>
  <text class="card-title" x="724" y="514" text-anchor="middle">one BOM version</text>
  <text class="card-subtitle" x="724" y="540" text-anchor="middle">no module versions in consumers</text>

  <rect x="582" y="138" width="284" height="56" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text class="card-title" x="724" y="164" text-anchor="middle">external dependency lines</text>
  <text class="card-subtitle" x="724" y="185" text-anchor="middle">Spring Boot, Ktor, Netty, AWS SDK</text>

  <rect x="942" y="166" width="382" height="452" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2" filter="url(#shadow)"/>
  <text class="lane-title" x="976" y="210">Consumers</text>
  <text class="small" x="978" y="236">They import one platform dependency.</text>

  <rect x="992" y="286" width="282" height="70" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text class="card-title" x="1133" y="316" text-anchor="middle">applications</text>
  <text class="card-subtitle" x="1133" y="340" text-anchor="middle">versionless bluetape4k modules</text>

  <rect x="992" y="386" width="282" height="70" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text class="card-title" x="1133" y="416" text-anchor="middle">workshops / examples</text>
  <text class="card-subtitle" x="1133" y="440" text-anchor="middle">same dependency graph as docs</text>

  <rect x="992" y="486" width="282" height="70" rx="14" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text class="card-title" x="1133" y="516" text-anchor="middle">library repos</text>
  <text class="card-subtitle" x="1133" y="540" text-anchor="middle">shared governed versions</text>

  <path d="M 506 392 H 600" fill="none" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <text class="flow-label" x="528" y="374">compose</text>

  <path d="M 724 194 V 258" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
  <text class="small" x="742" y="238">managed lines</text>

  <path d="M 848 321 H 992" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path d="M 848 421 H 992" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path d="M 848 521 H 992" fill="none" stroke="#16a34a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <text class="flow-label" x="876" y="302" fill="#16a34a">platform import</text>

  <rect x="86" y="656" width="1228" height="42" rx="14" fill="#f8fafc" stroke="#dbeafe" stroke-width="1.5"/>
  <text class="footer" x="700" y="684" text-anchor="middle">Consumers choose one BOM version; bluetape4k module dependencies stay versionless.</text>
</svg>
