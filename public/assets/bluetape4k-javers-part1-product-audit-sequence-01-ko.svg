<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="680" viewBox="0 0 1290 680">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"goorm Sans";font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer{font-family:"goorm Sans Code";font-size:17px;fill:#CBD5E1;font-weight:400}
    .participant{font-family:"goorm Sans";font-size:21px;fill:#F8FAFC;font-weight:400}
    .detail,.num{font-family:"goorm Sans Code";font-size:16px;fill:#CBD5E1;font-weight:400}
    .num{font-weight:700}
    .call{fill:none;stroke:#60A5FA;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="1290" height="680"/>
<rect class="frame" x="34" y="28" width="1222" height="624" rx="24"/>
<text class="title" x="645" y="82" text-anchor="middle">작은 상품 감사 동작 순서</text>
<text class="subtitle" x="645" y="116" text-anchor="middle">워크숍 예제는 현재 행을 갱신하기 전에 감사 이력을 커밋합니다</text>
<g>
  <rect class="header" x="45" y="135" width="210" height="64" rx="10" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="participant" x="150" y="175" text-anchor="middle">호출자</text>
  <line class="lifeline" x1="150" y1="218" x2="150" y2="545"/>
</g>
<g>
  <rect class="header" x="315" y="135" width="210" height="64" rx="10" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="participant" x="420" y="175" text-anchor="middle">감사 서비스</text>
  <line class="lifeline" x1="420" y1="218" x2="420" y2="545"/>
</g>
<g>
  <rect class="header" x="555" y="135" width="210" height="64" rx="10" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="participant" x="660" y="175" text-anchor="middle">JaVers</text>
  <line class="lifeline" x1="660" y1="218" x2="660" y2="545"/>
</g>
<g>
  <rect class="header" x="825" y="135" width="210" height="64" rx="10" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="participant" x="930" y="175" text-anchor="middle">스냅숏 저장소</text>
  <line class="lifeline" x1="930" y1="218" x2="930" y2="545"/>
</g>
<g>
  <rect class="header" x="1035" y="135" width="210" height="64" rx="10" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="participant" x="1140" y="175" text-anchor="middle">상품 테이블</text>
  <line class="lifeline" x1="1140" y1="218" x2="1140" y2="545"/>
</g>
<rect class="activation" x="412" y="245" width="16" height="300" rx="6" fill="#0C4A6E" stroke="#75A9E8"/>
<g>
  <rect class="label" x="167" y="205" width="236" height="30" rx="9" fill="#0C4A6E" stroke="#334155"/>
  <text class="num" x="187" y="225" text-anchor="middle">1</text>
  <text class="detail" x="295" y="225" text-anchor="middle">save(author, product)</text>
  <path class="call" d="M188 245 H382"/>
</g>
<g>
  <rect class="label" x="410" y="270" width="260" height="30" rx="9" fill="#78350F" stroke="#334155"/>
  <text class="num" x="430" y="290" text-anchor="middle">2</text>
  <text class="detail" x="550" y="290" text-anchor="middle">작성자와 객체 커밋</text>
  <path class="call" d="M458 310 H622"/>
</g>
<g>
  <rect class="label" x="680" y="335" width="230" height="30" rx="9" fill="#14532D" stroke="#334155"/>
  <text class="num" x="700" y="355" text-anchor="middle">3</text>
  <text class="detail" x="805" y="355" text-anchor="middle">CDO 스냅숏 저장</text>
  <path class="call" d="M698 375 H892"/>
</g>
<g>
  <rect class="label" x="665" y="400" width="230" height="30" rx="9" fill="#4C1D95" stroke="#334155"/>
  <text class="num" x="685" y="420" text-anchor="middle">4</text>
  <text class="detail" x="790" y="420" text-anchor="middle">현재 행 저장 또는 갱신</text>
  <path class="call" d="M458 440 H1102"/>
</g>
<g>
  <rect class="label" x="139" y="465" width="292" height="30" rx="9" fill="#7C2D12" stroke="#334155"/>
  <text class="num" x="159" y="485" text-anchor="middle">5</text>
  <text class="detail" x="295" y="485" text-anchor="middle">이후 이력 또는 차이 조회</text>
  <path class="call" d="M188 505 H382"/>
</g>
<rect x="88" y="590" width="1114" height="56" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="645" y="613" text-anchor="middle">현재 행과 감사 이력은 서로 다른 책임을 가집니다.</text>
<text class="footer" x="645" y="636" text-anchor="middle">작은 예제만으로도 커밋 순서가 중요한 이유를 확인할 수 있습니다.</text>
</svg>
