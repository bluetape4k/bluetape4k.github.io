<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360" role="img" aria-labelledby="title desc">
<title id="title">Kafka-first fallback publication sequence</title>
<desc id="desc">Sequence for orders-only transaction, direct Kafka publish, fallback row persistence, relay publish, and reconciliation signal.</desc>
<defs>
<style>
  .title { font-family: "Architects Daughter"; font-size: 40px; fill: #263238; }
  .subtitle, .msg, .note, .footer { font-family: "Comic Mono"; fill: #36464f; }
  .subtitle { font-size: 18px; }
  .participant { font-family: "Architects Daughter"; font-size: 19px; fill: #1f3138; }
  .role { font-family: "Comic Mono"; font-size: 13px; fill: #546a73; }
  .msg { font-size: 14px; }
  .note { font-size: 13px; }
  .footer { font-size: 14px; fill: #60727d; }
  .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
  .header { fill: #ffffff; stroke: #546e7a; stroke-width: 2; }
  .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
  .activation { fill: #f3ecdf; stroke: #8f784e; stroke-width: 1.5; }
  .call, .slot, .state, .skip { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .call { stroke: #3f7d9c; }
  .slot { stroke: #a2743d; }
  .state { stroke: #6e8f4f; }
  .skip { stroke: #b86868; }
  .return { fill: none; stroke: #9b7d54; stroke-width: 2.5; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; }
  .alt { fill: none; stroke: #78909c; stroke-width: 3; stroke-dasharray: 12 7; }
  .branchDivider { stroke: #78909c; stroke-width: 3; stroke-dasharray: 12 8; }
  .label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; }
  .label.callLabel { stroke: #9cc2d1; }
  .label.slotLabel { stroke: #d0b078; }
  .label.stateLabel { stroke: #b6c9a4; }
  .label.returnLabel { stroke: #c8b38f; }
  .label.skipLabel { stroke: #d9abab; }
  .branchOk { fill: #f8f1e6; stroke: #a2743d; stroke-width: 1.8; }
  .branchSkip { fill: #fff5f5; stroke: #b86868; stroke-width: 3; }
  .badge { stroke-width: 1.8; }
  .badge.callBadge { fill: #eaf4f8; stroke: #3f7d9c; }
  .badge.slotBadge { fill: #fff4df; stroke: #a2743d; }
  .badge.stateBadge { fill: #eef7f0; stroke: #6e8f4f; }
  .badge.returnBadge { fill: #fff7e8; stroke: #9b7d54; }
  .badge.skipBadge { fill: #fff0f0; stroke: #b86868; }
  .badgeText { font-family: "Comic Mono"; font-size: 12px; font-weight: 700; }
  .msg.callText, .badgeText.callText { fill: #2f6f8e; }
  .msg.slotText, .badgeText.slotText { fill: #855a29; }
  .msg.stateText, .badgeText.stateText { fill: #55783f; }
  .msg.returnText, .badgeText.returnText { fill: #7f6038; }
  .msg.skipText, .badgeText.skipText { fill: #9d4f4f; }
  text { letter-spacing: 0; }
</style>
<marker viewBox="0 0 10 10" markerUnits="userSpaceOnUse" id="arrowCall" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker viewBox="0 0 10 10" markerUnits="userSpaceOnUse" id="arrowSlot" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker viewBox="0 0 10 10" markerUnits="userSpaceOnUse" id="arrowState" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker viewBox="0 0 10 10" markerUnits="userSpaceOnUse" id="arrowReturn" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
<marker viewBox="0 0 10 10" markerUnits="userSpaceOnUse" id="arrowSkip" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b86868" stroke="#b86868" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
</defs>
<rect x="24" y="24" width="1552" height="1312" rx="20" class="frame"/>
<text x="800" y="78" text-anchor="middle" class="title">Kafka-first Fallback Publication Flow</text>
<text x="800" y="108" text-anchor="middle" class="subtitle">The order transaction writes only orders; fallback rows exist only after direct Kafka publish fails.</text>
<rect x="60" y="150" width="140" height="68" rx="10" class="header"/>
<text x="130.0" y="179" text-anchor="middle" class="participant">Client</text>
<text x="130.0" y="201" text-anchor="middle" class="role">HTTP caller</text>
<rect x="260" y="150" width="190" height="68" rx="10" class="header"/>
<text x="355.0" y="179" text-anchor="middle" class="participant">Order API</text>
<text x="355.0" y="201" text-anchor="middle" class="role">placeOrder</text>
<rect x="510" y="150" width="205" height="68" rx="10" class="header"/>
<text x="612.5" y="179" text-anchor="middle" class="participant">Order Tx</text>
<text x="612.5" y="201" text-anchor="middle" class="role">orders only</text>
<rect x="782" y="150" width="170" height="68" rx="10" class="header"/>
<text x="867.0" y="179" text-anchor="middle" class="participant">Publisher</text>
<text x="867.0" y="201" text-anchor="middle" class="role">direct or fallback</text>
<rect x="1032" y="150" width="190" height="68" rx="10" class="header"/>
<text x="1127.0" y="179" text-anchor="middle" class="participant">Kafka Topic</text>
<text x="1127.0" y="201" text-anchor="middle" class="role">order events</text>
<rect x="1288" y="150" width="130" height="68" rx="10" class="header"/>
<text x="1353.0" y="179" text-anchor="middle" class="participant">Outbox DB</text>
<text x="1353.0" y="201" text-anchor="middle" class="role">fallback rows</text>
<rect x="1460" y="150" width="110" height="68" rx="10" class="header"/>
<text x="1515.0" y="179" text-anchor="middle" class="participant">Relay</text>
<text x="1515.0" y="201" text-anchor="middle" class="role">scheduled</text>
<line x1="130" y1="218" x2="130" y2="1226" class="lifeline"/>
<line x1="355" y1="218" x2="355" y2="1226" class="lifeline"/>
<line x1="612" y1="218" x2="612" y2="1226" class="lifeline"/>
<line x1="867" y1="218" x2="867" y2="1226" class="lifeline"/>
<line x1="1127" y1="218" x2="1127" y2="1226" class="lifeline"/>
<line x1="1353" y1="218" x2="1353" y2="1226" class="lifeline"/>
<line x1="1515" y1="218" x2="1515" y2="1226" class="lifeline"/>
<rect x="348" y="318" width="14" height="186" rx="6" class="activation"/>
<rect x="605" y="382" width="14" height="70" rx="6" class="activation"/>
<rect x="860" y="502" width="14" height="390" rx="6" class="activation"/>
<rect x="1120" y="604" width="14" height="90" rx="6" class="activation"/>
<rect x="1346" y="780" width="14" height="336" rx="6" class="activation"/>
<rect x="1508" y="826" width="14" height="342" rx="6" class="activation"/>
<rect x="70" y="260" width="330" height="34" rx="17" class="label callLabel"/>
<circle cx="94" cy="277" r="13" class="badge callBadge"/>
<text x="94" y="282" text-anchor="middle" class="badgeText callText">1</text>
<text x="118" y="282" class="msg callText">POST /api/orders</text>
<path data-connector="client-to-api" d="M 130 318 L 355 318" class="call" marker-end="url(#arrowCall)"/>
<rect x="330" y="326" width="330" height="34" rx="17" class="label slotLabel"/>
<circle cx="354" cy="343" r="13" class="badge slotBadge"/>
<text x="354" y="348" text-anchor="middle" class="badgeText slotText">2</text>
<text x="378" y="348" class="msg slotText">save order inside TransactionalOrderWriter</text>
<path data-connector="api-to-order-tx" d="M 355 382 L 612 382" class="slot" marker-end="url(#arrowSlot)"/>
<rect x="490" y="392" width="292" height="34" rx="17" class="label returnLabel"/>
<circle cx="514" cy="409" r="13" class="badge returnBadge"/>
<text x="514" y="414" text-anchor="middle" class="badgeText returnText">3</text>
<text x="538" y="414" class="msg returnText">orders row committed; no publication row</text>
<path data-connector="order-tx-to-api" d="M 612 448 L 355 448" class="return" marker-end="url(#arrowReturn)"/>
<rect x="70" y="482" width="1478" height="704" rx="14" class="alt"/>
<rect x="96" y="500" width="318" height="30" rx="15" class="branchOk"/>
<text x="118" y="520" text-anchor="start" class="note">alt direct Kafka publish succeeds</text>
<line x1="70" y1="720" x2="1548" y2="720" class="branchDivider"/>
<rect x="96" y="738" width="392" height="30" rx="15" class="branchSkip"/>
<text x="118" y="758" text-anchor="start" class="note">else publish fails or times out after 3 attempts</text>
<rect x="600" y="514" width="364" height="34" rx="17" class="label callLabel"/>
<circle cx="624" cy="531" r="13" class="badge callBadge"/>
<text x="624" y="536" text-anchor="middle" class="badgeText callText">4</text>
<text x="648" y="536" class="msg callText">publishDirectOrFallback(event)</text>
<path data-connector="api-to-publisher" d="M 355 572 L 867 572" class="call" marker-end="url(#arrowCall)"/>
<rect x="900" y="604" width="290" height="34" rx="17" class="label stateLabel"/>
<circle cx="924" cy="621" r="13" class="badge stateBadge"/>
<text x="924" y="626" text-anchor="middle" class="badgeText stateText">5</text>
<text x="948" y="626" class="msg stateText">send event to Kafka topic</text>
<path data-connector="publisher-to-kafka" d="M 867 662 L 1127 662" class="state" marker-end="url(#arrowState)"/>
<rect x="520" y="636" width="262" height="34" rx="17" class="label returnLabel"/>
<circle cx="544" cy="653" r="13" class="badge returnBadge"/>
<text x="544" y="658" text-anchor="middle" class="badgeText returnText">6</text>
<text x="568" y="658" class="msg returnText">PUBLISHED_DIRECT response</text>
<path data-connector="publisher-to-api-published" d="M 867 700 L 355 700" class="return" marker-end="url(#arrowReturn)"/>
<rect x="815" y="762" width="326" height="34" rx="17" class="label slotLabel"/>
<circle cx="839" cy="779" r="13" class="badge slotBadge"/>
<text x="839" y="784" text-anchor="middle" class="badgeText slotText">7</text>
<text x="863" y="784" class="msg slotText">upsert NOT_PUBLISHED fallback row</text>
<path data-connector="publisher-to-outbox-fallback" d="M 867 820 L 1353 820" class="slot" marker-end="url(#arrowSlot)"/>
<rect x="480" y="842" width="324" height="34" rx="17" class="label returnLabel"/>
<circle cx="504" cy="859" r="13" class="badge returnBadge"/>
<text x="504" y="864" text-anchor="middle" class="badgeText returnText">8</text>
<text x="528" y="864" class="msg returnText">FALLBACK_STORED response</text>
<path data-connector="publisher-to-api-fallback" d="M 867 884 L 355 884" class="return" marker-end="url(#arrowReturn)"/>
<rect x="920" y="920" width="600" height="250" rx="14" class="alt"/>
<rect x="944" y="938" width="262" height="30" rx="15" class="branchOk"/>
<text x="966" y="958" text-anchor="start" class="note">loop scheduled relay claim</text>
<rect x="1110" y="982" width="250" height="34" rx="17" class="label slotLabel"/>
<circle cx="1134" cy="999" r="13" class="badge slotBadge"/>
<text x="1134" y="1004" text-anchor="middle" class="badgeText slotText">9</text>
<text x="1158" y="1004" class="msg slotText">claim eligible rows</text>
<path data-connector="relay-to-outbox-claim" d="M 1515 1024 L 1353 1024" class="slot" marker-end="url(#arrowSlot)"/>
<rect x="1020" y="1054" width="238" height="34" rx="17" class="label returnLabel"/>
<circle cx="1044" cy="1071" r="13" class="badge returnBadge"/>
<text x="1044" y="1076" text-anchor="middle" class="badgeText returnText">10</text>
<text x="1068" y="1076" class="msg returnText">payload batch</text>
<path data-connector="outbox-to-relay-payload" d="M 1353 1094 L 1515 1094" class="return" marker-end="url(#arrowReturn)"/>
<rect x="1010" y="1126" width="320" height="34" rx="17" class="label stateLabel"/>
<circle cx="1034" cy="1143" r="13" class="badge stateBadge"/>
<text x="1034" y="1148" text-anchor="middle" class="badgeText stateText">11</text>
<text x="1058" y="1148" class="msg stateText">send to Kafka and mark PUBLISHED</text>
<path data-connector="relay-to-kafka-publish" d="M 1515 1168 L 1127 1168" class="state" marker-end="url(#arrowState)"/>
<rect x="98" y="1220" width="1404" height="44" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="2"/>
<text x="118" y="1248" text-anchor="start" class="note">Reconciler scans old orders without publication rows and rebuilds deterministic fallback rows only for the repair gap.</text>
<text x="800" y="1288" text-anchor="middle" class="footer">Source: bluetape4k-workshop messaging/kafka-outbox-fallback, PR #349</text>
</svg>
