<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-label="LeaderGroupElector slot-token semaphore diagram">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#426b8f"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#2f855a"/>
    </marker>
    <style>
      .bg { fill: #fbfdff; }
      .frame { fill: #ffffff; stroke: #c8d6e5; stroke-width: 1.6; }
      .title { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #1f2a37; }
      .subtitle { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #52677c; }
      .panel { fill: #f8fbff; stroke: #d4e1ef; stroke-width: 1.2; }
      .node { fill: #ffffff; stroke: #aec1d5; stroke-width: 1.4; }
      .elector { fill: #eef6ff; stroke: #80aee0; }
      .slot-ok { fill: #e8f8ee; stroke: #6dbb87; }
      .slot-wait { fill: #fff7e6; stroke: #d8a84f; }
      .release { fill: #f2fae8; stroke: #91bb5b; }
      .state { fill: #f4f6f8; stroke: #aeb9c5; }
      .label { font-family: 'Architects Daughter', cursive; font-size: 17px; fill: #26384a; }
      .detail { font-family: 'Comic Mono', monospace; font-size: 12px; fill: #43566a; }
      .small { font-family: 'Comic Mono', monospace; font-size: 10.5px; fill: #53677b; }
      .green { fill: #2f855a; }
      .amber { fill: #b7791f; }
      .link { stroke: #426b8f; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
      .return { stroke: #2f855a; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .rail { stroke: #8fb3d1; stroke-width: 5; stroke-linecap: round; }
      .token { fill: #3fbf7f; stroke: #1f7a4c; stroke-width: 1.4; }
      .wait-token { fill: #f4b14e; stroke: #9a641a; stroke-width: 1.4; }
    </style>
  </defs>

  <rect class="bg" width="1040" height="620"/>
  <rect class="frame" x="18" y="18" width="1004" height="584" rx="18"/>

  <text class="title" x="520" y="58" text-anchor="middle">LeaderGroupElector Slot Semaphore</text>
  <text class="subtitle" x="520" y="82" text-anchor="middle">maxLeaders turns one lock name into a bounded set of renewable slot tokens</text>

  <rect class="panel" x="54" y="118" width="244" height="398" rx="14"/>
  <text class="label" x="176" y="148" text-anchor="middle">service nodes</text>

  <rect class="node" x="84" y="176" width="184" height="48" rx="10"/>
  <text class="label" x="176" y="196" text-anchor="middle">node-a</text>
  <text class="detail" x="176" y="214" text-anchor="middle">runIfLeader("job")</text>

  <rect class="node" x="84" y="246" width="184" height="48" rx="10"/>
  <text class="label" x="176" y="266" text-anchor="middle">node-b</text>
  <text class="detail" x="176" y="284" text-anchor="middle">runIfLeader("job")</text>

  <rect class="node" x="84" y="316" width="184" height="48" rx="10"/>
  <text class="label" x="176" y="336" text-anchor="middle">node-c</text>
  <text class="detail" x="176" y="354" text-anchor="middle">runIfLeader("job")</text>

  <rect class="node" x="84" y="386" width="184" height="48" rx="10"/>
  <text class="label" x="176" y="406" text-anchor="middle">node-d</text>
  <text class="detail" x="176" y="424" text-anchor="middle">waits or skips</text>

  <rect class="elector" x="388" y="216" width="232" height="108" rx="14"/>
  <text class="label" x="504" y="249" text-anchor="middle">LeaderGroupElector</text>
  <text class="detail" x="504" y="273" text-anchor="middle">LeaderGroupElectionOptions</text>
  <text class="detail" x="504" y="293" text-anchor="middle">maxLeaders = 3</text>

  <path class="link" d="M 268 200 H 332 V 238 H 388"/>
  <path class="link" d="M 268 270 H 388"/>
  <path class="link" d="M 268 340 H 332 V 294 H 388"/>
  <path class="link" d="M 268 410 H 334 V 298 H 388"/>

  <rect class="panel" x="700" y="122" width="268" height="390" rx="14"/>
  <text class="label" x="834" y="151" text-anchor="middle">slot-token semaphore</text>
  <text class="small" x="834" y="172" text-anchor="middle">tokens expire by leaseTime unless released first</text>

  <line class="rail" x1="736" y1="230" x2="930" y2="230"/>
  <line class="rail" x1="736" y1="310" x2="930" y2="310"/>
  <line class="rail" x1="736" y1="390" x2="930" y2="390"/>

  <rect class="slot-ok" x="738" y="194" width="192" height="72" rx="12"/>
  <circle class="token" cx="764" cy="230" r="14"/>
  <text class="label" x="838" y="223" text-anchor="middle">slot 1 occupied</text>
  <text class="detail" x="838" y="243" text-anchor="middle">TTL lease token</text>

  <rect class="slot-ok" x="738" y="274" width="192" height="72" rx="12"/>
  <circle class="token" cx="764" cy="310" r="14"/>
  <text class="label" x="838" y="303" text-anchor="middle">slot 2 occupied</text>
  <text class="detail" x="838" y="323" text-anchor="middle">action is running</text>

  <rect class="slot-ok" x="738" y="354" width="192" height="72" rx="12"/>
  <circle class="token" cx="764" cy="390" r="14"/>
  <text class="label" x="838" y="383" text-anchor="middle">slot 3 occupied</text>
  <text class="detail" x="838" y="403" text-anchor="middle">activeCount = 3</text>

  <rect class="slot-wait" x="738" y="442" width="192" height="40" rx="12"/>
  <circle class="wait-token" cx="764" cy="462" r="12"/>
  <text class="detail" x="844" y="466" text-anchor="middle">no token left: waitTime decides skip</text>

  <path class="link" d="M 620 270 H 700"/>
  <rect class="release" x="378" y="398" width="254" height="74" rx="14"/>
  <text class="label" x="505" y="425" text-anchor="middle">release or expiry</text>
  <text class="detail" x="505" y="448" text-anchor="middle">finally block releases token;</text>
  <text class="detail" x="505" y="466" text-anchor="middle">TTL protects abandoned work</text>

  <path class="return" d="M 738 390 H 654 V 435 H 632"/>
  <path class="return" d="M 505 398 V 324"/>

  <rect class="state" x="370" y="118" width="272" height="62" rx="12"/>
  <text class="label" x="506" y="142" text-anchor="middle">state snapshot</text>
  <text class="detail" x="506" y="163" text-anchor="middle">maxLeaders, activeCount, availableSlots</text>
  <path class="link" d="M 700 172 H 642"/>

  <text class="small" x="520" y="558" text-anchor="middle">Use group election when N nodes may work concurrently but the cluster still needs a hard upper bound.</text>
</svg>
