<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">JdbcCacheRepository Cache Strategy Map</title>
<desc id="desc">Redisson map loader handles read-through; map writer handles write-through or write-behind.</desc>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/></filter>

  <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#60a5fa"/></marker>
  <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#86efac"/></marker>
  <marker id="arrow-amber" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#fbbf24"/></marker>
  <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#f87171"/></marker>
  <marker id="arrow-purple" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#c4b5fd"/></marker>
  <marker id="arrow-cyan" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#67e8f9"/></marker>
  <style>
    .title{font-family:"Architects Daughter","Comic Sans MS",Arial,sans-serif;font-size:44px;font-weight:700;fill:#f8fafc}
    .subtitle{font-family:"Comic Mono","Comic Sans MS",Arial,sans-serif;font-size:18px;fill:#cbd5e1}
    .lane-title{font-family:"Architects Daughter","Comic Sans MS",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-title{font-family:"Architects Daughter","Comic Sans MS",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-body{font-family:"Comic Mono","Comic Sans MS",Arial,sans-serif;font-size:16px;fill:#cbd5e1}
    .small{font-family:"Comic Mono","Comic Sans MS",Arial,sans-serif;font-size:14px;fill:#94a3b8}
    .mono{font-family:"Comic Mono","Comic Sans MS",Arial,sans-serif;font-size:15px;fill:#cbd5e1}
    .panel{fill:#111827;stroke:#334155;stroke-width:2}
    .row{fill:#0f172a;stroke:#334155;stroke-width:2}
    .row-alt{fill:#111c2f;stroke:#334155;stroke-width:2}
    .card{filter:url(#shadow);stroke-width:2}

    .connector{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
    .line-blue{stroke:#60a5fa;marker-end:url(#arrow-blue)}
    .line-green{stroke:#86efac;marker-end:url(#arrow-green)}
    .line-amber{stroke:#fbbf24;marker-end:url(#arrow-amber)}
    .line-red{stroke:#f87171;marker-end:url(#arrow-red)}
    .line-purple{stroke:#c4b5fd;marker-end:url(#arrow-purple)}
    .line-cyan{stroke:#67e8f9;marker-end:url(#arrow-cyan)}
    .dash-blue{stroke:#60a5fa;stroke-dasharray:11 10;marker-end:url(#arrow-blue)}
    .dash-green{stroke:#86efac;stroke-dasharray:11 10;marker-end:url(#arrow-green)}
    .dash-purple{stroke:#c4b5fd;stroke-dasharray:11 10;marker-end:url(#arrow-purple)}
    .label-bg{fill:#0f172a;stroke:#475569;stroke-width:1.5}
  </style>
</defs>
<rect width="1600" height="1000" fill="#0b1220"/>
<rect x="34" y="30" width="1532" height="940" rx="28" class="panel"/>
<text x="70" y="86" class="title">JdbcCacheRepository Cache Strategy Map</text>
<text x="72" y="122" class="subtitle">Redisson map loader handles read-through; map writer handles write-through or write-behind.</text>
<g>
  <rect x="72" y="172" width="1456" height="690" rx="24" fill="#172033" stroke="#26364f" stroke-width="2"/>
  <text x="96" y="210" class="lane-title">The repository call shape stays stable; loader and writer contracts change behavior</text>
</g>
<g>
  <rect x="110" y="400" width="296" height="132" rx="18" fill="#172554" stroke="#60a5fa" class="card"/>
  <text x="258" y="427" text-anchor="middle" dominant-baseline="middle" class="mono">JdbcCacheRepository</text>
<text x="258" y="461" text-anchor="middle" dominant-baseline="middle" class="mono">get · getAll</text>
<text x="258" y="483" text-anchor="middle" dominant-baseline="middle" class="mono">put · putAll</text>
<text x="258" y="505" text-anchor="middle" dominant-baseline="middle" class="mono">invalidate · clear</text>
</g>
<g>
  <rect x="548" y="360" width="350" height="164" rx="18" fill="#14351f" stroke="#86efac" class="card"/>
  <text x="723" y="400" text-anchor="middle" dominant-baseline="middle" class="mono">RMap</text>
<text x="723" y="428" text-anchor="middle" dominant-baseline="middle" class="mono">RLocalCachedMap</text>
<text x="723" y="462" text-anchor="middle" dominant-baseline="middle" class="mono">loader + optional writer</text>
<text x="723" y="484" text-anchor="middle" dominant-baseline="middle" class="mono">Near Cache when enabled</text>
</g>
<g>
  <rect x="1000" y="242" width="300" height="124" rx="18" fill="#12333b" stroke="#67e8f9" class="card"/>
  <text x="1150" y="276" text-anchor="middle" dominant-baseline="middle" class="mono">EntityMapLoader</text>
<text x="1150" y="310" text-anchor="middle" dominant-baseline="middle" class="mono">ExposedEntityMapLoader</text>
<text x="1150" y="332" text-anchor="middle" dominant-baseline="middle" class="mono">cache miss -&gt; DB read</text>
</g>
<g>
  <rect x="1000" y="574" width="300" height="124" rx="18" fill="#3b2a08" stroke="#fbbf24" class="card"/>
  <text x="1150" y="608" text-anchor="middle" dominant-baseline="middle" class="mono">EntityMapWriter</text>
<text x="1150" y="642" text-anchor="middle" dominant-baseline="middle" class="mono">ExposedEntityMapWriter</text>
<text x="1150" y="664" text-anchor="middle" dominant-baseline="middle" class="mono">put / putAll -&gt; DB write</text>
</g>
<g>
  <rect x="1304" y="392" width="204" height="168" rx="18" fill="#261943" stroke="#c4b5fd" class="card"/>
  <text x="1406" y="448" text-anchor="middle" dominant-baseline="middle" class="mono">Exposed DB</text>
<text x="1406" y="482" text-anchor="middle" dominant-baseline="middle" class="mono">IdTable</text>
<text x="1406" y="504" text-anchor="middle" dominant-baseline="middle" class="mono">transaction boundary</text>
</g>
<g>
  <rect x="128" y="696" width="308" height="104" rx="18" fill="#1e293b" stroke="#64748b" class="card"/>
  <text x="282" y="720" text-anchor="middle" dominant-baseline="middle" class="mono">READ_ONLY</text>
<text x="282" y="754" text-anchor="middle" dominant-baseline="middle" class="mono">UserCredentials</text>
<text x="282" y="776" text-anchor="middle" dominant-baseline="middle" class="mono">WITH_NEAR_CACHE · loader only</text>
</g>
<g>
  <rect x="520" y="696" width="368" height="104" rx="18" fill="#172554" stroke="#60a5fa" class="card"/>
  <text x="704" y="720" text-anchor="middle" dominant-baseline="middle" class="mono">READ_WRITE_THROUGH</text>
<text x="704" y="754" text-anchor="middle" dominant-baseline="middle" class="mono">User</text>
<text x="704" y="776" text-anchor="middle" dominant-baseline="middle" class="mono">WITH_NEAR_CACHE · loader + writer</text>
</g>
<g>
  <rect x="958" y="758" width="358" height="104" rx="18" fill="#3b1217" stroke="#f87171" class="card"/>
  <text x="1137" y="782" text-anchor="middle" dominant-baseline="middle" class="mono">WRITE_BEHIND</text>
<text x="1137" y="816" text-anchor="middle" dominant-baseline="middle" class="mono">UserEvent</text>
<text x="1137" y="838" text-anchor="middle" dominant-baseline="middle" class="mono">WITH_NEAR_CACHE · async flush</text>
</g>
<path class="connector line-blue" data-connector="repository-to-map" d="M406 464 H548"/><rect class="label-bg" x="435" y="427" width="86" height="30" rx="15"/><text class="small" x="478" y="446" text-anchor="middle">get / put</text>
<path class="connector line-green" data-connector="map-to-repository-hit" d="M548 492 H406"/><rect class="label-bg" x="436" y="501" width="84" height="30" rx="15"/><text class="small" x="478" y="520" text-anchor="middle">cache hit</text>
<path class="connector line-blue" data-connector="map-to-loader" d="M898 412 H940 Q960 412 960 392 V304 Q960 284 980 284 H1000"/><rect class="label-bg" x="900" y="253" width="104" height="30" rx="15"/><text class="small" x="952" y="272" text-anchor="middle">cache miss</text>
<path class="connector line-cyan" data-connector="loader-to-db" d="M1300 304 H1366 Q1386 304 1386 324 V392"/><rect class="label-bg" x="1339" y="337" width="110" height="30" rx="15"/><text class="small" x="1394" y="356" text-anchor="middle">read from DB</text>
<path class="connector line-amber" data-connector="map-to-writer" d="M898 472 H942 Q962 472 962 492 V636 Q962 656 982 656 H1000"/><rect class="label-bg" x="908" y="535" width="108" height="30" rx="15"/><text class="small" x="962" y="554" text-anchor="middle">put / putAll</text>
<path class="connector line-amber" data-connector="writer-to-db" d="M1300 636 H1366 Q1386 636 1386 616 V560"/><rect class="label-bg" x="1330" y="581" width="136" height="30" rx="15"/><text class="small" x="1398" y="600" text-anchor="middle">write now / async</text>
<path class="connector dash-green" data-connector="readonly-to-map" d="M282 696 V552 Q282 532 302 532 H588 Q608 532 608 524"/><rect class="label-bg" x="399" y="663" width="98" height="30" rx="15"/><text class="small" x="448" y="682" text-anchor="middle">loader only</text>
<path class="connector dash-blue" data-connector="readwrite-to-map" d="M704 696 V524"/><rect class="label-bg" x="716" y="663" width="128" height="30" rx="15"/><text class="small" x="780" y="682" text-anchor="middle">loader + writer</text>
<path class="connector dash-purple" data-connector="writebehind-to-writer" d="M1137 758 V698"/><rect class="label-bg" x="1145" y="725" width="158" height="30" rx="15"/><text class="small" x="1224" y="744" text-anchor="middle">write-behind queue</text>
<text x="800" y="924" text-anchor="middle" class="small">Key point: cache is not just a fast Map; it is a repository contract with read/write failure policy.</text>
</svg>