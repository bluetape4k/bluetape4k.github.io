    <text x="175" y="320" class="detail" text-anchor="middle">조정 주기</text></g><g><rect x="330" y="260" width="190" height="92" rx="8" class="card" fill="#fff" stroke="#6e8f4f"/>
    <text x="425" y="294" class="cardTitle" text-anchor="middle">Leader API</text>
    <text x="425" y="320" class="detail" text-anchor="middle">runIfLeaderResult</text></g><g><rect x="580" y="260" width="190" height="92" rx="8" class="card" fill="#fff" stroke="#6e8f4f"/>
    <text x="675" y="294" class="cardTitle" text-anchor="middle">Kubernetes Lease</text>
    <text x="675" y="320" class="detail" text-anchor="middle">Kubernetes Lease</text></g><g><rect x="830" y="260" width="190" height="92" rx="8" class="card" fill="#fff" stroke="#6e8f4f"/>
    <text x="925" y="294" class="cardTitle" text-anchor="middle">보호 대상 작업</text>
    <text x="925" y="320" class="detail" text-anchor="middle">활성 조정기</text></g><g><rect x="1080" y="260" width="190" height="92" rx="8" class="card" fill="#fff5f5" stroke="#b86868"/>
    <text x="1175" y="294" class="cardTitle" text-anchor="middle">관측</text>
    <text x="1175" y="320" class="detail" text-anchor="middle">메트릭 / 로그</text></g>
  <path d="M 270 306 L 330 306" class="call"/>
  <path d="M 520 306 L 580 306" class="state"/>
  <path d="M 770 306 L 830 306" class="state"/>
  <path d="M 1020 306 L 1080 306" class="return"/>
  <path d="M 925 352 L 925 430 Q 925 452 947 452 L 1175 452 Q 1198 452 1198 430 L 1198 352" class="skip"/>
  <g><rect x="286" y="218" width="132" height="30" rx="15" class="pill" stroke="#78909c"/><circle cx="304" cy="233" r="11" class="badgeCircle" stroke="#78909c" stroke-width="1.4"/><text x="304" y="237" text-anchor="middle" class="badgeText">1</text><text x="322" y="238" class="labelText">후보</text></g><g><rect x="536" y="218" width="132" height="30" rx="15" class="pill" stroke="#78909c"/><circle cx="554" cy="233" r="11" class="badgeCircle" stroke="#78909c" stroke-width="1.4"/><text x="554" y="237" text-anchor="middle" class="badgeText">2</text><text x="572" y="238" class="labelText">리스</text></g><g><rect x="786" y="218" width="132" height="30" rx="15" class="pill" stroke="#78909c"/><circle cx="804" cy="233" r="11" class="badgeCircle" stroke="#78909c" stroke-width="1.4"/><text x="804" y="237" text-anchor="middle" class="badgeText">3</text><text x="822" y="238" class="labelText">실행</text></g><g><rect x="1036" y="218" width="132" height="30" rx="15" class="pill" stroke="#78909c"/><circle cx="1054" cy="233" r="11" class="badgeCircle" stroke="#78909c" stroke-width="1.4"/><text x="1054" y="237" text-anchor="middle" class="badgeText">4</text><text x="1072" y="238" class="labelText">결과</text></g>
  <text x="640" y="520" class="footer" text-anchor="middle">LeaderRunResult: Elected | Skipped | ActionFailed</text>
  </svg>