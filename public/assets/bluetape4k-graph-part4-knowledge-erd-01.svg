<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#496A8F"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#22344A;font-weight:400}
    .subtitle,.footer,.axis{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:17px;fill:#536476;font-weight:400}
    .nodeTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .nodeBody{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:16px;fill:#3F5269;font-weight:400}
    .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .tableField,.edgeLabel{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;fill:#3F5269;font-weight:400}
    .edge{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#91A6BD;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1600" height="780"/>
<rect class="frame" x="34" y="28" width="1532" height="724" rx="24"/>
<text class="title" x="800" y="82" text-anchor="middle">Knowledge Graph Entity Graph</text>
<text class="subtitle" x="800" y="118" text-anchor="middle">Documents mention entities; entities relate to concepts and to each other</text>
<g>
  <path class="edge" d="M420 388 H515 V278 H610"/>
  <rect x="455" y="306" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="515" y="325" text-anchor="middle">MENTIONS</text>
</g>
<g>
  <path class="edge" d="M900 278 H995 V263 H1090"/>
  <rect x="935" y="244" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="995" y="263" text-anchor="middle">IS_A</text>
</g>
<g>
  <path class="edge" d="M900 278 H995 V488 H1090"/>
  <rect x="935" y="356" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="995" y="375" text-anchor="middle">RELATED_TO</text>
</g>
<g id="document">
  <rect x="130" y="300" width="290" height="176" rx="8" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="130" y="300" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="130" y1="348" x2="420" y2="348" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="275" y="331" text-anchor="middle">Document</text>
  <line x1="130" y1="348" x2="420" y2="348" stroke="#D7E2EC"/>
  <text class="tableField" x="148" y="369">documentId</text>
  <line x1="130" y1="378" x2="420" y2="378" stroke="#D7E2EC"/>
  <text class="tableField" x="148" y="399">title</text>
  <line x1="130" y1="408" x2="420" y2="408" stroke="#D7E2EC"/>
  <text class="tableField" x="148" y="429">source</text>
</g>
<g id="entity">
  <rect x="610" y="190" width="290" height="176" rx="8" fill="#EAF8EF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="610" y="190" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="610" y1="238" x2="900" y2="238" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="755" y="221" text-anchor="middle">Entity</text>
  <line x1="610" y1="238" x2="900" y2="238" stroke="#D7E2EC"/>
  <text class="tableField" x="628" y="259">entityId</text>
  <line x1="610" y1="268" x2="900" y2="268" stroke="#D7E2EC"/>
  <text class="tableField" x="628" y="289">name</text>
  <line x1="610" y1="298" x2="900" y2="298" stroke="#D7E2EC"/>
  <text class="tableField" x="628" y="319">type</text>
</g>
<g id="concept">
  <rect x="1090" y="190" width="290" height="146" rx="8" fill="#FFF4D9" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="1090" y="190" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="1090" y1="238" x2="1380" y2="238" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="1235" y="221" text-anchor="middle">Concept</text>
  <line x1="1090" y1="238" x2="1380" y2="238" stroke="#D7E2EC"/>
  <text class="tableField" x="1108" y="259">conceptId</text>
  <line x1="1090" y1="268" x2="1380" y2="268" stroke="#D7E2EC"/>
  <text class="tableField" x="1108" y="289">name</text>
</g>
<g id="related">
  <rect x="1090" y="430" width="290" height="116" rx="8" fill="#F3ECFF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="1090" y="430" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="1090" y1="478" x2="1380" y2="478" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="1235" y="461" text-anchor="middle">Entity</text>
  <line x1="1090" y1="478" x2="1380" y2="478" stroke="#D7E2EC"/>
  <text class="tableField" x="1108" y="499">related entity</text>
</g>
<rect x="88" y="684" width="1424" height="62" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="800" y="709" text-anchor="middle">Full-text or vector search finds candidates; graph paths explain why entities are connected.</text>
<text class="footer" x="800" y="733" text-anchor="middle">Depth limits keep semantic traversal useful instead of turning it into an unbounded crawl.</text>
</svg>
