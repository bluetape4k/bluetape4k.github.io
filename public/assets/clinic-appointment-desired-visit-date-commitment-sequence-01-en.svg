<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1420" viewBox="0 0 2200 1420" role="img" aria-labelledby="title desc">
  <title id="title">How Patient A's Preferred Visit Date Becomes an Appointment Confirmation</title>
  <desc id="desc">Patient A submits a preferred visit date. The appointment service validates the plan and policy, then holds resources. If the clinic approves the same terms, exact consent and allocation produce an appointment confirmation. Changed terms require a new proposal and fresh consent, while an existing confirmed appointment remains protected.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset=".58" stop-color="#0c1730"/><stop offset="1" stop-color="#10142a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity=".55"/></filter>
    <marker id="blue-arrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="sequence" data-size="16x16" data-visible-size="32x32" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" transform="translate(9 5) scale(2) translate(-9 -5)" fill="#60a5fa" data-arrowhead="true" data-solid-head="true"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="sequence" data-size="16x16" data-visible-size="32x32" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" transform="translate(9 5) scale(2) translate(-9 -5)" fill="#5eead4" data-arrowhead="true" data-solid-head="true"/></marker>
    <marker id="green-arrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="sequence" data-size="16x16" data-visible-size="32x32" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" transform="translate(9 5) scale(2) translate(-9 -5)" fill="#a3e635" data-arrowhead="true" data-solid-head="true"/></marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="sequence" data-size="16x16" data-visible-size="32x32" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" transform="translate(9 5) scale(2) translate(-9 -5)" fill="#fbbf24" data-arrowhead="true" data-solid-head="true"/></marker>
    <marker id="rose-arrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="sequence" data-size="16x16" data-visible-size="32x32" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" transform="translate(9 5) scale(2) translate(-9 -5)" fill="#fb7185" data-arrowhead="true" data-solid-head="true"/></marker>
    <style>
      .title{font-family:"goorm Sans",sans-serif;font-size:42px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"goorm Sans",sans-serif;font-size:19px;fill:#a9b8d4}.frame{fill:none;stroke:#2b4168;stroke-width:2}.participant-card{fill:#13233b;stroke:#5b789d;stroke-width:2;filter:url(#shadow)}.participant-title{font-family:"goorm Sans",sans-serif;font-size:21px;font-weight:700;fill:#f8fafc}.role{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:14px;fill:#9fb0ca}.lifeline{stroke:#52647f;stroke-width:2;stroke-dasharray:8 9}.activation{fill:#203b4d;stroke:#73a5bd;stroke-width:1.6}.seq{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.return{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 8}.pill{fill:#101b30;stroke-width:1.6}.label{font-family:"goorm Sans",sans-serif;font-size:16px;font-weight:700}.badge{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:14px;font-weight:700}.alt{fill:#0b1628;fill-opacity:.65;stroke:#fbbf24;stroke-width:2.2;stroke-dasharray:12 8}.alt-label{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:16px;font-weight:700;fill:#fde68a}.note-title{font-family:"goorm Sans",sans-serif;font-size:19px;font-weight:700;fill:#d9f99d}.note{font-family:"goorm Sans",sans-serif;font-size:16px;fill:#c7d3e7}
    </style>
  </defs>
  <rect width="2200" height="1420" fill="url(#bg)"/><rect class="frame" x="28" y="28" width="2144" height="1364" rx="30"/>
  <text class="title" x="1100" y="76" text-anchor="middle">A Preferred Visit Date Becomes an Appointment Confirmation After Validation and Consent</text>
  <text class="subtitle" x="1100" y="112" text-anchor="middle">Scheduling intent → PROPOSED or HELD → clinic approval → exact consent → CONFIRMED</text>

  <g><rect class="participant-card" x="55" y="150" width="240" height="92" rx="16"/><text class="participant-title" x="175" y="188" text-anchor="middle">Patient A</text><text class="role" x="175" y="218" text-anchor="middle">date choice · consent</text><line class="lifeline" x1="175" y1="242" x2="175" y2="1260"/></g>
  <g><rect class="participant-card" x="400" y="150" width="270" height="92" rx="16"/><text class="participant-title" x="535" y="188" text-anchor="middle">Customer Channel</text><text class="role" x="535" y="218" text-anchor="middle">intent · evidence handoff</text><line class="lifeline" x1="535" y1="242" x2="535" y2="1260"/></g>
  <g><rect class="participant-card" x="860" y="150" width="300" height="92" rx="16"/><text class="participant-title" x="1010" y="188" text-anchor="middle">Appointment Service</text><text class="role" x="1010" y="218" text-anchor="middle">proposal · commitment</text><line class="lifeline" x1="1010" y1="242" x2="1010" y2="1260"/></g>
  <g><rect class="participant-card" x="1350" y="150" width="270" height="92" rx="16"/><text class="participant-title" x="1485" y="188" text-anchor="middle">Clinic Operations</text><text class="role" x="1485" y="218" text-anchor="middle">approval · alternative</text><line class="lifeline" x1="1485" y1="242" x2="1485" y2="1260"/></g>
  <g><rect class="participant-card" x="1830" y="150" width="300" height="92" rx="16"/><text class="participant-title" x="1980" y="188" text-anchor="middle">Resource Ledger</text><text class="role" x="1980" y="218" text-anchor="middle">staff · equipment · space</text><line class="lifeline" x1="1980" y1="242" x2="1980" y2="1260"/></g>

  <rect class="activation" x="1001" y="370" width="18" height="870" rx="5"/><rect class="activation" x="1476" y="650" width="18" height="160" rx="5"/><rect class="activation" x="1971" y="530" width="18" height="600" rx="5"/>

  <g id="m1"><rect class="pill" x="185" y="270" width="340" height="40" rx="20" stroke="#60a5fa"/><circle cx="208" cy="290" r="14" fill="#173148" stroke="#60a5fa"/><text class="badge" x="208" y="295" text-anchor="middle" fill="#bfdbfe">1</text><text class="label" x="360" y="296" text-anchor="middle" fill="#bfdbfe">Submit preferred visit date</text><path class="seq" d="M 175 330 H 535" stroke="#60a5fa" marker-end="url(#blue-arrow)"/></g>
  <g id="m2"><rect class="pill" x="545" y="350" width="455" height="40" rx="20" stroke="#60a5fa"/><circle cx="568" cy="370" r="14" fill="#173148" stroke="#60a5fa"/><text class="badge" x="568" y="375" text-anchor="middle" fill="#bfdbfe">2</text><text class="label" x="780" y="376" text-anchor="middle" fill="#bfdbfe">Plan + preferred window + consent reference</text><path class="seq" d="M 535 410 H 1010" stroke="#60a5fa" marker-end="url(#blue-arrow)"/></g>
  <g id="validation"><rect x="820" y="445" width="380" height="72" rx="18" fill="#12233c" stroke="#60a5fa" stroke-width="1.8"/><text class="label" x="1010" y="474" text-anchor="middle" fill="#dbeafe">Plan revision · catalog hash</text><text class="label" x="1010" y="500" text-anchor="middle" fill="#dbeafe">policy snapshot · per-request processing limits</text></g>
  <g id="m3"><rect class="pill" x="1370" y="470" width="370" height="40" rx="20" stroke="#fbbf24"/><circle cx="1393" cy="490" r="14" fill="#423324" stroke="#fbbf24"/><text class="badge" x="1393" y="495" text-anchor="middle" fill="#fde68a">3</text><text class="label" x="1570" y="496" text-anchor="middle" fill="#fde68a">HELD when policy allows</text><path class="seq" d="M 1010 550 H 1980" stroke="#fbbf24" marker-end="url(#amber-arrow)"/></g>
  <g id="m4"><rect class="pill" x="1370" y="570" width="370" height="40" rx="20" stroke="#5eead4"/><circle cx="1393" cy="590" r="14" fill="#173d3e" stroke="#5eead4"/><text class="badge" x="1393" y="595" text-anchor="middle" fill="#ccfbf1">4</text><text class="label" x="1570" y="596" text-anchor="middle" fill="#ccfbf1">allocation result + expiry</text><path class="return" d="M 1980 630 H 1010" stroke="#5eead4" marker-end="url(#teal-arrow)"/></g>
  <g id="m5"><rect class="pill" x="1090" y="650" width="350" height="40" rx="20" stroke="#60a5fa"/><circle cx="1113" cy="670" r="14" fill="#173148" stroke="#60a5fa"/><text class="badge" x="1113" y="675" text-anchor="middle" fill="#bfdbfe">5</text><text class="label" x="1280" y="676" text-anchor="middle" fill="#bfdbfe">Request approval for exact proposal</text><path class="seq" d="M 1010 710 H 1485" stroke="#60a5fa" marker-end="url(#blue-arrow)"/></g>

  <g id="same-terms"><rect class="alt" x="760" y="750" width="920" height="215" rx="22"/><rect class="pill" x="790" y="730" width="340" height="40" rx="20" stroke="#a3e635"/><text class="alt-label" x="960" y="756" text-anchor="middle" fill="#d9f99d">Clinic approves the same terms</text>
    <g id="m6"><rect class="pill" x="1110" y="785" width="330" height="40" rx="20" stroke="#a3e635"/><circle cx="1133" cy="805" r="14" fill="#2c3b32" stroke="#a3e635"/><text class="badge" x="1133" y="810" text-anchor="middle" fill="#d9f99d">6</text><text class="label" x="1290" y="811" text-anchor="middle" fill="#d9f99d">Approve the same proposal</text><path class="return" d="M 1485 845 H 1010" stroke="#a3e635" marker-end="url(#green-arrow)"/></g>
    <g id="m7"><rect class="pill" x="1370" y="850" width="385" height="40" rx="20" stroke="#a3e635"/><circle cx="1393" cy="870" r="14" fill="#2c3b32" stroke="#a3e635"/><text class="badge" x="1393" y="875" text-anchor="middle" fill="#d9f99d">7</text><text class="label" x="1580" y="876" text-anchor="middle" fill="#d9f99d">Bind consent and allocation atomically</text><path class="seq" d="M 1010 910 H 1980" stroke="#a3e635" marker-end="url(#green-arrow)"/></g>
  </g>

  <g id="changed-terms"><rect class="alt" x="370" y="1010" width="1310" height="180" rx="22"/><rect class="pill" x="400" y="990" width="390" height="40" rx="20" stroke="#fbbf24"/><text class="alt-label" x="595" y="1016" text-anchor="middle">Time, items, or resources change</text>
    <g id="m8"><rect class="pill" x="620" y="1040" width="370" height="40" rx="20" stroke="#fb7185"/><circle cx="643" cy="1060" r="14" fill="#44242f" stroke="#fb7185"/><text class="badge" x="643" y="1065" text-anchor="middle" fill="#fecdd3">8</text><text class="label" x="820" y="1066" text-anchor="middle" fill="#fecdd3">Send a new proposal revision</text><path class="return" d="M 1485 1100 H 535" stroke="#fb7185" marker-end="url(#rose-arrow)"/></g>
    <g id="m9"><rect class="pill" x="550" y="1110" width="440" height="40" rx="20" stroke="#fb7185"/><circle cx="573" cy="1130" r="14" fill="#44242f" stroke="#fb7185"/><text class="badge" x="573" y="1135" text-anchor="middle" fill="#fecdd3">9</text><text class="label" x="780" y="1136" text-anchor="middle" fill="#fecdd3">Consent to the exact new proposal</text><path class="seq" d="M 535 1170 H 1010" stroke="#fb7185" marker-end="url(#rose-arrow)"/></g>
  </g>

  <g id="confirmed-result"><path class="return" d="M 1010 1260 H 535" stroke="#5eead4" marker-end="url(#teal-arrow)"/><path class="return" d="M 535 1300 H 175" stroke="#5eead4" marker-end="url(#teal-arrow)"/><rect class="pill" x="450" y="1215" width="390" height="40" rx="20" stroke="#5eead4"/><text class="label" x="645" y="1241" text-anchor="middle" fill="#ccfbf1">CONFIRMED appointment</text></g>
  <g><rect x="260" y="1330" width="1680" height="54" rx="17" fill="#16243a" stroke="#a3e635" stroke-width="1.8"/><text class="note-title" x="1100" y="1355" text-anchor="middle">A change proposal does not release the existing appointment first</text><text class="note" x="1100" y="1378" text-anchor="middle">Decline, expiry, or resource conflict preserves the current confirmedProposalId and allocation.</text></g>
</svg>
