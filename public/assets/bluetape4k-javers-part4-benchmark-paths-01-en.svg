<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Mean time by audit persistence path</title>
  <desc id="desc">Compares insert, update, and audit-query mean time in milliseconds for Hibernate Envers, JaVers in-memory, JaVers Exposed repository, and JaVers Exposed DDD paths.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f" />
      <stop offset="0.56" stop-color="#0c1730" />
      <stop offset="1" stop-color="#11152b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.48" />
    </filter>
    <style>
      .title { font-family: 'Architects Daughter', cursive; font-size: 42px; fill: #f8fafc; }
      .subtitle { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #a9b8d4; }
      .panel-title { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #f8fafc; }
      .label { font-family: 'Comic Mono', monospace; font-size: 16px; fill: #c7d3e7; }
      .value { font-family: 'Comic Mono', monospace; font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .tick { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #8fa3c0; }
      .note { font-family: 'Comic Mono', monospace; font-size: 16px; fill: #c7d3e7; }
      .grid { stroke: #263a5e; stroke-width: 1; stroke-dasharray: 5 7; }
    </style>
  </defs>

  <rect width="1600" height="1040" rx="32" fill="url(#canvas)" />
  <rect x="28" y="28" width="1544" height="984" rx="28" fill="none" stroke="#263a5e" stroke-width="2" />
  <text class="title" x="800" y="72" text-anchor="middle">The same operation name can cover different work</text>
  <text class="subtitle" x="800" y="108" text-anchor="middle">Mean ms/op | lower is better | JDK 21.0.11 | PostgreSQL 18 Testcontainers | 5 warmup, 40 measured</text>

  <g aria-label="Legend">
    <rect x="95" y="145" width="18" height="18" rx="5" fill="#58a6c9" /><text class="label" x="124" y="160">Hibernate Envers</text>
    <rect x="425" y="145" width="18" height="18" rx="5" fill="#82b366" /><text class="label" x="454" y="160">JaVers in-memory</text>
    <rect x="755" y="145" width="18" height="18" rx="5" fill="#a78bfa" /><text class="label" x="784" y="160">JaVers + Exposed repository</text>
    <rect x="1175" y="145" width="18" height="18" rx="5" fill="#f59e6b" /><text class="label" x="1204" y="160">JaVers + Exposed DDD</text>
  </g>

  <g filter="url(#shadow)" aria-label="insert mean time">
    <rect x="45" y="210" width="490" height="660" rx="24" fill="#101d33" stroke="#2b4168" stroke-width="2" />
    <text class="panel-title" x="290" y="258" text-anchor="middle">insert</text>
    <text class="subtitle" x="290" y="288" text-anchor="middle">mean operation time</text>
    <line class="grid" x1="190" y1="320" x2="190" y2="770" />
    <line class="grid" x1="290" y1="320" x2="290" y2="770" />
    <line class="grid" x1="390" y1="320" x2="390" y2="770" />
    <line class="grid" x1="470" y1="320" x2="470" y2="770" />
    <text class="label" x="80" y="382">Envers</text><rect x="190" y="355" width="90" height="38" rx="10" fill="#58a6c9" /><text class="value" x="291" y="380">4.486</text>
    <text class="label" x="80" y="482">in-memory</text><rect x="190" y="455" width="10" height="38" rx="5" fill="#82b366" /><text class="value" x="211" y="480">0.510</text>
    <text class="label" x="80" y="582">repository</text><rect x="190" y="555" width="170" height="38" rx="10" fill="#a78bfa" /><text class="value" x="371" y="580">8.499</text>
    <text class="label" x="80" y="682">DDD path</text><rect x="190" y="655" width="128" height="38" rx="10" fill="#f59e6b" /><text class="value" x="329" y="680">6.397</text>
    <line x1="190" y1="770" x2="470" y2="770" stroke="#587092" stroke-width="2" />
    <text class="tick" x="190" y="798" text-anchor="middle">0</text><text class="tick" x="290" y="798" text-anchor="middle">5</text><text class="tick" x="390" y="798" text-anchor="middle">10</text><text class="tick" x="470" y="798" text-anchor="middle">14 ms</text>
  </g>

  <g filter="url(#shadow)" aria-label="update mean time">
    <rect x="555" y="210" width="490" height="660" rx="24" fill="#101d33" stroke="#2b4168" stroke-width="2" />
    <text class="panel-title" x="800" y="258" text-anchor="middle">update</text>
    <text class="subtitle" x="800" y="288" text-anchor="middle">mean operation time</text>
    <line class="grid" x1="700" y1="320" x2="700" y2="770" />
    <line class="grid" x1="800" y1="320" x2="800" y2="770" />
    <line class="grid" x1="900" y1="320" x2="900" y2="770" />
    <line class="grid" x1="980" y1="320" x2="980" y2="770" />
    <text class="label" x="590" y="382">Envers</text><rect x="700" y="355" width="138" height="38" rx="10" fill="#58a6c9" /><text class="value" x="849" y="380">6.917</text>
    <text class="label" x="590" y="482">in-memory</text><rect x="700" y="455" width="20" height="38" rx="7" fill="#82b366" /><text class="value" x="731" y="480">0.978</text>
    <text class="label" x="590" y="582">repository</text><rect x="700" y="555" width="119" height="38" rx="10" fill="#a78bfa" /><text class="value" x="830" y="580">5.945</text>
    <text class="label" x="590" y="682">DDD path</text><rect x="700" y="655" width="145" height="38" rx="10" fill="#f59e6b" /><text class="value" x="856" y="680">7.257</text>
    <line x1="700" y1="770" x2="980" y2="770" stroke="#587092" stroke-width="2" />
    <text class="tick" x="700" y="798" text-anchor="middle">0</text><text class="tick" x="800" y="798" text-anchor="middle">5</text><text class="tick" x="900" y="798" text-anchor="middle">10</text><text class="tick" x="980" y="798" text-anchor="middle">14 ms</text>
  </g>

  <g filter="url(#shadow)" aria-label="audit query mean time">
    <rect x="1065" y="210" width="490" height="660" rx="24" fill="#101d33" stroke="#2b4168" stroke-width="2" />
    <text class="panel-title" x="1310" y="258" text-anchor="middle">audit query</text>
    <text class="subtitle" x="1310" y="288" text-anchor="middle">mean operation time</text>
    <line class="grid" x1="1210" y1="320" x2="1210" y2="770" />
    <line class="grid" x1="1310" y1="320" x2="1310" y2="770" />
    <line class="grid" x1="1410" y1="320" x2="1410" y2="770" />
    <line class="grid" x1="1490" y1="320" x2="1490" y2="770" />
    <text class="label" x="1100" y="382">Envers</text><rect x="1210" y="355" width="250" height="38" rx="10" fill="#58a6c9" /><text class="value" x="1471" y="380">12.483</text>
    <text class="label" x="1100" y="482">in-memory</text><rect x="1210" y="455" width="251" height="38" rx="10" fill="#82b366" /><text class="value" x="1472" y="480">12.559</text>
    <text class="label" x="1100" y="582">repository</text><rect x="1210" y="555" width="15" height="38" rx="6" fill="#a78bfa" /><text class="value" x="1236" y="580">0.763</text>
    <text class="label" x="1100" y="682">DDD path</text><rect x="1210" y="655" width="14" height="38" rx="6" fill="#f59e6b" /><text class="value" x="1235" y="680">0.704</text>
    <line x1="1210" y1="770" x2="1490" y2="770" stroke="#587092" stroke-width="2" />
    <text class="tick" x="1210" y="798" text-anchor="middle">0</text><text class="tick" x="1310" y="798" text-anchor="middle">5</text><text class="tick" x="1410" y="798" text-anchor="middle">10</text><text class="tick" x="1490" y="798" text-anchor="middle">14 ms</text>
  </g>

  <rect x="120" y="910" width="1360" height="76" rx="20" fill="#121f35" stroke="#4f6f91" stroke-width="2" />
  <text class="note" x="800" y="941" text-anchor="middle">This is not a product ranking. In-memory, SQL repository, and DDD paths complete different work.</text>
  <text class="subtitle" x="800" y="969" text-anchor="middle">Production decisions need p95, p99, throughput, and DB resource use from representative objects and data.</text>
</svg>
