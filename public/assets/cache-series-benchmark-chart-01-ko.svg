<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="900" viewBox="0 0 1420 900" role="img" aria-labelledby="title desc">
<title id="title">Lettuce Near Cache 벤치마크 요약</title>
<desc id="desc">처리량 단위는 ops/ms입니다. 높을수록 좋고, L1 read는 별도 scale로 표시했습니다.</desc>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/></filter>

  <style>
    .title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:44px;font-weight:700;fill:#f8fafc}
    .subtitle{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:18px;fill:#cbd5e1}
    .lane-title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-body{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:16px;fill:#cbd5e1}
    .small{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:14px;fill:#94a3b8}
    .code{font-family:"goorm Sans Code","goorm Sans","Apple SD Gothic Neo",monospace;font-size:15px;fill:#cbd5e1}
    .panel{fill:#111827;stroke:#334155;stroke-width:2}
    .card{filter:url(#shadow);stroke-width:2}

    .label-bg{fill:#0f172a;stroke:#475569;stroke-width:1.5}
  </style>
</defs>
<rect width="1420" height="900" fill="#0b1220"/>
<rect x="34" y="30" width="1352" height="840" rx="28" class="panel"/>
<text x="70" y="86" class="title">Lettuce Near Cache 벤치마크 요약</text>
<text x="72" y="122" class="subtitle">처리량 단위는 ops/ms입니다. 높을수록 좋고, L1 read는 별도 scale로 표시했습니다.</text>
<g>
  <rect x="86" y="208" width="264" height="96" rx="18" fill="#14351f" stroke="#86efac" class="card"/>
  <text x="218" y="239" text-anchor="middle" dominant-baseline="middle" class="small">L1 hit</text>
<text x="218" y="273" text-anchor="middle" dominant-baseline="middle" class="small">~64,000 ops/ms</text>
</g>
<g>
  <rect x="86" y="344" width="264" height="96" rx="18" fill="#172554" stroke="#60a5fa" class="card"/>
  <text x="218" y="375" text-anchor="middle" dominant-baseline="middle" class="small">L2 hit / miss</text>
<text x="218" y="409" text-anchor="middle" dominant-baseline="middle" class="small">~4 ops/ms</text>
</g>
<g>
  <rect x="86" y="480" width="264" height="96" rx="18" fill="#3b2a08" stroke="#fbbf24" class="card"/>
  <text x="218" y="511" text-anchor="middle" dominant-baseline="middle" class="small">putSingle</text>
<text x="218" y="545" text-anchor="middle" dominant-baseline="middle" class="small">~2 ops/ms</text>
</g>
<g>
  <rect x="86" y="616" width="264" height="96" rx="18" fill="#3b1217" stroke="#f87171" class="card"/>
  <text x="218" y="647" text-anchor="middle" dominant-baseline="middle" class="small">putAll 16KB</text>
<text x="218" y="681" text-anchor="middle" dominant-baseline="middle" class="small">~0.4 ops/ms</text>
</g>
<g>
  <rect x="434" y="230" width="742" height="56" rx="16" fill="#0f172a" stroke="#86efac" stroke-width="2"/>
  <rect x="434" y="230" width="708" height="56" rx="16" fill="#14351f" stroke="none"/>
</g>
<g>
  <rect x="434" y="366" width="230" height="56" rx="16" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
  <rect x="434" y="366" width="92" height="56" rx="16" fill="#172554" stroke="none"/>
</g>
<g>
  <rect x="434" y="502" width="230" height="56" rx="16" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
  <rect x="434" y="502" width="52" height="56" rx="16" fill="#3b2a08" stroke="none"/>
</g>
<g>
  <rect x="434" y="638" width="230" height="56" rx="16" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
  <rect x="434" y="638" width="22" height="56" rx="16" fill="#3b1217" stroke="none"/>
</g>
<g>
  <rect x="820" y="428" width="350" height="132" rx="18" fill="#261943" stroke="#c4b5fd" class="card"/>
  <text x="995" y="455" text-anchor="middle" dominant-baseline="middle" class="card-title">실전 해석</text>
<text x="995" y="489" text-anchor="middle" dominant-baseline="middle" class="card-body">L1 hit ratio 극대화</text>
<text x="995" y="511" text-anchor="middle" dominant-baseline="middle" class="card-body">write cost 관찰</text>
<text x="995" y="533" text-anchor="middle" dominant-baseline="middle" class="card-body">큰 payload batch 분리</text>
</g>
<text x="710" y="806" text-anchor="middle" class="small">소스: cache-lettuce/Benchmark.ko.md · Apple M4 Pro, GraalVM 21, Redis 7 Testcontainers, JMH 1.37</text>
</svg>
