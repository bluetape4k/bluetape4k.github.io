<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Embarrassing bug fix loop</title>
  <desc id="desc">bluetape4k-projects 버그 사례에서 실수, 신호, 수정, 보호 장치가 어떻게 반복되는지 보여주는 dark flow입니다.</desc>
  <defs>
    <style>
      .canvas{fill:#0b1220}.frame{fill:#12213a;stroke:#314868;stroke-width:2}.title{font-family:"goorm Sans";font-size:44px;fill:#e6edf7;font-weight:400}.subtitle,.small{font-family:"goorm Sans Code";fill:#9fb2cc}.subtitle{font-size:17px}.small{font-size:14px}.card-title{font-family:"goorm Sans";font-size:28px;fill:#e6edf7;font-weight:400}.card-text{font-family:"goorm Sans Code";font-size:14px;fill:#d7e2f0}.arrow{stroke:#8fb3d9;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.num{font-family:"goorm Sans Code";font-size:14px;font-weight:700;fill:#e6edf7}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#8fb3d9"/></marker>
  </defs>
  <rect class="canvas" width="1200" height="630"/>
  <rect class="frame" x="28" y="24" width="1144" height="582" rx="22" filter="url(#shadow)"/>
  <text class="title" x="70" y="92">부끄러운 실수는 더 나은 보호 장치를 남깁니다</text>
  <text class="subtitle" x="72" y="126">bluetape4k-projects · 실수 → 신호 → 수정 → 보호 장치</text>

  <g transform="translate(72,182)">
    <rect class="card" x="0" y="0" width="188" height="250" rx="18" fill="#17375e" stroke="#6aa9ff"/>
    <circle cx="28" cy="30" r="14" fill="#23486f" stroke="#6aa9ff"/>
    <text class="num" x="24" y="35">1</text>
    <text class="card-title" x="22" y="78">실수</text>
    <text class="card-text" x="22" y="112">작은 가정이</text>
    <text class="card-text" x="22" y="134">해 없어 보여도</text>
    <text class="card-text" x="22" y="156">null이 0이 되거나</text>
    <text class="card-text" x="22" y="178">취소가</text>
    <text class="card-text" x="22" y="200">실패로 바뀝니다.</text>
  </g>
  <path class="arrow" marker-end="url(#arrow)" d="M274 306 H330"/>
  <g transform="translate(342,182)">
    <rect class="card" x="0" y="0" width="188" height="250" rx="18" fill="#173c37" stroke="#53d6b7"/>
    <circle cx="28" cy="30" r="14" fill="#1f554c" stroke="#53d6b7"/>
    <text class="num" x="24" y="35">2</text>
    <text class="card-title" x="22" y="78">신호</text>
    <text class="card-text" x="22" y="112">왕복 변환 오차,</text>
    <text class="card-text" x="22" y="134">야간 타임아웃,</text>
    <text class="card-text" x="22" y="156">숨겨진</text>
    <text class="card-text" x="22" y="178">비활성 테스트가</text>
    <text class="card-text" x="22" y="200">이야기를 깨뜨립니다.</text>
  </g>
  <path class="arrow" marker-end="url(#arrow)" d="M544 306 H600"/>
  <g transform="translate(612,182)">
    <rect class="card" x="0" y="0" width="188" height="250" rx="18" fill="#3f3217" stroke="#f5c15c"/>
    <circle cx="28" cy="30" r="14" fill="#5b4317" stroke="#f5c15c"/>
    <text class="num" x="24" y="35">3</text>
    <text class="card-title" x="22" y="78">수정</text>
    <text class="card-text" x="22" y="112">작은 계약을</text>
    <text class="card-text" x="22" y="134">명시합니다:</text>
    <text class="card-text" x="22" y="156">강제 변환 범위,</text>
    <text class="card-text" x="22" y="178">제한된 종료,</text>
    <text class="card-text" x="22" y="200">첫 예외 재던지기.</text>
  </g>
  <path class="arrow" marker-end="url(#arrow)" d="M814 306 H870"/>
  <g transform="translate(882,182)">
    <rect class="card" x="0" y="0" width="188" height="250" rx="18" fill="#40202b" stroke="#ef7892"/>
    <circle cx="28" cy="30" r="14" fill="#5a293a" stroke="#ef7892"/>
    <text class="num" x="24" y="35">4</text>
    <text class="card-title" x="22" y="78">보호 장치</text>
    <text class="card-text" x="22" y="112">회귀 테스트,</text>
    <text class="card-text" x="22" y="134">릴리스 게이트,</text>
    <text class="card-text" x="22" y="156">교훈 기록이</text>
    <text class="card-text" x="22" y="178">부끄러움을</text>
    <text class="card-text" x="22" y="200">재사용 경보로 바꿉니다.</text>
  </g>

  <text class="small" x="72" y="548">원칙: 수정이 뒤늦게 너무 당연해 보인다면, 더 일찍 부끄럽게 만들었을 테스트를 작성하세요.</text>
</svg>
