<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Threads 운영 규칙</title>
  <desc id="desc">blocking 동기 코드, 작업별 thread, semaphore 제한, ScopedValue와 lock 범위를 정리한 virtual thread 사용 규칙.</desc>
  <defs>
    <marker id="arrow-vt2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="64" y="62" width="1072" height="506" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="122" font-family="goorm Sans, sans-serif" font-size="40" font-weight="700" fill="#f8fafc">Virtual Threads 운영 규칙</text>
  <text x="98" y="162" font-family="goorm Sans Code, monospace" font-size="21" fill="#cbd5e1">bluetape4k-workshop/virtualthreads/rules에서 검증한 원칙</text>

  <g font-family="goorm Sans Code, monospace" font-size="17" fill="#f8fafc">
    <rect class="card" x="80" y="246" width="220" height="112" rx="16" fill="#12372f" stroke="#2dd4bf"/>
    <text x="190" y="284" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">Blocking 동기 코드</text>
    <text x="190" y="316" text-anchor="middle">I/O 대기에는 적합</text>

    <rect class="card" x="338" y="246" width="188" height="112" rx="16" fill="#102a43" stroke="#60a5fa"/>
    <text x="432" y="284" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">작업별 thread</text>
    <text x="432" y="316" text-anchor="middle">VT를 pool에 넣지 않음</text>

    <rect class="card" x="586" y="246" width="188" height="112" rx="16" fill="#3b2814" stroke="#f59e0b"/>
    <text x="680" y="284" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">Semaphore</text>
    <text x="680" y="316" text-anchor="middle">자원 수를 제한</text>

    <rect class="card" x="834" y="210" width="188" height="104" rx="16" fill="#2d2147" stroke="#a78bfa"/>
    <text x="928" y="248" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">ScopedValue</text>
    <text x="928" y="280" text-anchor="middle">context 범위</text>

    <rect class="card" x="834" y="382" width="188" height="104" rx="16" fill="#123047" stroke="#38bdf8"/>
    <text x="928" y="420" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">Lock</text>
    <text x="928" y="452" text-anchor="middle">짧은 범위</text>
  </g>

  <g fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-vt2)">
    <path class="connector" d="M300 302 H338"/>
    <path class="connector" d="M526 302 H586"/>
    <path class="connector" d="M774 286 H796 Q810 286 810 272 V262 Q810 248 824 248 H834"/>
    <path class="connector" d="M774 318 H796 Q810 318 810 332 V420 Q810 434 824 434 H834"/>
  </g>

  <g font-family="goorm Sans Code, monospace" font-size="17" fill="#cbd5e1">
    <rect class="card" x="126" y="408" width="592" height="108" rx="16" fill="#172033" stroke="#334155"/>
    <text x="154" y="440" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">실전 원칙</text>
    <text x="154" y="472">virtual thread는 thread 압력을 줄일 뿐</text>
    <text x="154" y="500">downstream 한계를 없애지 않습니다.</text>
  </g>
</svg>
