<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Threads 운영 규칙</title>
  <desc id="desc">blocking 동기 코드, 작업별 thread, semaphore 제한, ScopedValue와 lock 범위를 정리한 virtual thread 사용 규칙.</desc>
  <defs>
    <marker id="arrow-vt2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5c7d70"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f8fbf9"/>
  <rect x="64" y="62" width="1072" height="506" rx="24" fill="#ffffff" stroke="#c8d7cf" stroke-width="2"/>
  <text x="96" y="122" font-family="goorm Sans, sans-serif" font-size="40" font-weight="700" fill="#17342b">Virtual Threads 운영 규칙</text>
  <text x="98" y="162" font-family="goorm Sans Code, monospace" font-size="21" fill="#526056">bluetape4k-workshop/virtualthreads/rules에서 검증한 원칙</text>

  <g font-family="goorm Sans Code, monospace" font-size="17" fill="#17342b">
    <rect x="96" y="246" width="182" height="112" rx="16" fill="#e3f2ec" stroke="#b9d8c8"/>
    <text x="187" y="284" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">Blocking 동기 코드</text>
    <text x="187" y="316" text-anchor="middle">I/O 대기에는 적합</text>

    <rect x="338" y="246" width="188" height="112" rx="16" fill="#eaf4ff" stroke="#b9cde0"/>
    <text x="432" y="284" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">작업별 thread</text>
    <text x="432" y="316" text-anchor="middle">VT를 pool에 넣지 않음</text>

    <rect x="586" y="246" width="188" height="112" rx="16" fill="#fff1df" stroke="#dfc6a6"/>
    <text x="680" y="284" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">Semaphore</text>
    <text x="680" y="316" text-anchor="middle">자원 수를 제한</text>

    <rect x="834" y="210" width="188" height="104" rx="16" fill="#f4f0ff" stroke="#c9bee6"/>
    <text x="928" y="248" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">ScopedValue</text>
    <text x="928" y="280" text-anchor="middle">context 범위</text>

    <rect x="834" y="382" width="188" height="104" rx="16" fill="#e6f4ff" stroke="#b6d3e8"/>
    <text x="928" y="420" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">Lock</text>
    <text x="928" y="452" text-anchor="middle">짧은 범위</text>
  </g>

  <g fill="none" stroke="#5c7d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-vt2)">
    <path class="connector" d="M278 302 H338"/>
    <path class="connector" d="M526 302 H586"/>
    <path class="connector" d="M774 286 H796 Q810 286 810 272 V262 Q810 248 824 248 H834"/>
    <path class="connector" d="M774 318 H796 Q810 318 810 332 V420 Q810 434 824 434 H834"/>
  </g>

  <g font-family="goorm Sans Code, monospace" font-size="17" fill="#25493d">
    <rect x="126" y="408" width="592" height="108" rx="16" fill="#f8fbfa" stroke="#d6e2dc"/>
    <text x="154" y="440" font-family="goorm Sans, sans-serif" font-size="22" font-weight="700">실전 원칙</text>
    <text x="154" y="472">virtual thread는 thread 압력을 줄일 뿐</text>
    <text x="154" y="500">downstream 한계를 없애지 않습니다.</text>
  </g>
</svg>
