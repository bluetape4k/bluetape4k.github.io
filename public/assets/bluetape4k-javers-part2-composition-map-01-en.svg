<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#F8FAFC" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer{font-family:"Comic Mono";font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle{font-family:"Architects Daughter";font-size:25px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.edgeLabel{font-family:"Comic Mono";font-size:16px;fill:#CBD5E1;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1500" height="760"/>
<rect class="frame" x="34" y="28" width="1432" height="704" rx="24"/>
<text class="title" x="750" y="82" text-anchor="middle">Persistence Composition Map</text>
<text class="subtitle" x="750" y="116" text-anchor="middle">One composite repository reads from a primary and fans out writes to ordered secondaries</text>
<path class="edge" d="M415 344 H548"/>
<path class="edge" d="M930 318 H981 Q999 318 999 300 V247 Q999 229 1017 229 H1068"/>
<path class="edge" d="M930 370 H981 Q999 370 999 388 V476 Q999 494 1017 494 H1068"/>
<g id="app">
  <rect x="95" y="285" width="320" height="118" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="255" y="327" text-anchor="middle">Application Commit</text>
  <text class="nodeBody" x="255" y="360" text-anchor="middle">register one repository</text>
</g>
<g id="composite">
  <rect x="560" y="285" width="370" height="142" rx="12" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="745" y="327" text-anchor="middle">Composite Repository</text>
  <text class="nodeBody" x="745" y="351" text-anchor="middle">primary-first write</text>
  <text class="nodeBody" x="745" y="377" text-anchor="middle">read from primary</text>
</g>
<g id="primary">
  <rect x="1080" y="170" width="340" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1250" y="212" text-anchor="middle">Primary Store</text>
  <text class="nodeBody" x="1250" y="236" text-anchor="middle">Exposed or Redis</text>
  <text class="nodeBody" x="1250" y="262" text-anchor="middle">read/query source of truth</text>
</g>
<g id="secondary">
  <rect x="1080" y="435" width="340" height="142" rx="12" fill="#7C2D12" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1250" y="477" text-anchor="middle">Secondary Targets</text>
  <text class="nodeBody" x="1250" y="501" text-anchor="middle">Kafka or Redis</text>
  <text class="nodeBody" x="1250" y="527" text-anchor="middle">ordered write fan-out</text>
</g>
<rect x="88" y="670" width="1324" height="56" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="750" y="693" text-anchor="middle">Reads delegate to the primary; writes persist there first and then fan out in order.</text>
<text class="footer" x="750" y="716" text-anchor="middle">This is not a distributed transaction: a secondary can fail after the primary succeeds.</text>
</svg>
