<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#496A8F"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#22344A;font-weight:400}
    .subtitle,.footer{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}
    .nodeTitle{font-family:"Architects Daughter";font-size:25px;fill:#22344A;font-weight:400}
    .nodeBody,.edgeLabel{font-family:"Comic Mono";font-size:16px;fill:#3F5269;font-weight:400}
    .edge{fill:none;stroke:#496A8F;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1500" height="760"/>
<rect class="frame" x="34" y="28" width="1432" height="704" rx="24"/>
<text class="title" x="750" y="82" text-anchor="middle">Persistence Composition Map</text>
<text class="subtitle" x="750" y="116" text-anchor="middle">Current adapters are role-specific; composite fan-out is planned</text>
<path class="edge" d="M255 285 V260 Q255 250 265 250 H488"/>
<path class="edge" d="M415 344 H448 Q458 344 458 354 V484 Q458 494 468 494 H488"/>
<path class="edge" d="M840 229 H1175 Q1185 229 1185 239 V273"/>
<path class="edge" d="M840 494 H910 Q920 494 920 484 V354 Q920 344 930 344 H988"/>
<g id="app">
  <rect x="95" y="285" width="320" height="142" rx="12" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="255" y="327" text-anchor="middle">Application Commit</text>
  <text class="nodeBody" x="255" y="351" text-anchor="middle">current API</text>
  <text class="nodeBody" x="255" y="377" text-anchor="middle">register one repository</text>
</g>
<g id="primary">
  <rect x="500" y="170" width="340" height="142" rx="12" fill="#EAF8EF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="670" y="212" text-anchor="middle">Primary Store</text>
  <text class="nodeBody" x="670" y="236" text-anchor="middle">Exposed or Redis</text>
  <text class="nodeBody" x="670" y="262" text-anchor="middle">query snapshots and diffs</text>
</g>
<g id="stream">
  <rect x="500" y="435" width="340" height="142" rx="12" fill="#FFF0E8" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="670" y="477" text-anchor="middle">Event Stream</text>
  <text class="nodeBody" x="670" y="501" text-anchor="middle">Kafka</text>
  <text class="nodeBody" x="670" y="527" text-anchor="middle">write-only snapshot events</text>
</g>
<g id="future">
  <rect x="1000" y="285" width="370" height="142" rx="12" fill="#FFF4D9" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="1185" y="327" text-anchor="middle">Planned Composite</text>
  <text class="nodeBody" x="1185" y="351" text-anchor="middle">read from primary store</text>
  <text class="nodeBody" x="1185" y="377" text-anchor="middle">fan out writes to streams</text>
</g>
<rect x="88" y="670" width="1324" height="56" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="750" y="693" text-anchor="middle">Exposed + Kafka is a useful production shape, but not a first-class adapter yet.</text>
<text class="footer" x="750" y="716" text-anchor="middle">Until then, keep the article honest: planned capability, not current API.</text>
</svg>
