<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#496A8F"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#22344A;font-weight:400}
    .subtitle,.footer,.axis{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:17px;fill:#536476;font-weight:400}
    .nodeTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .nodeBody{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:16px;fill:#3F5269;font-weight:400}
    .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .tableField,.edgeLabel{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;fill:#3F5269;font-weight:400}
    .edge{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#91A6BD;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1600" height="780"/>
<rect class="frame" x="34" y="28" width="1532" height="724" rx="24"/>
<text class="title" x="800" y="82" text-anchor="middle">Recommendation Entity Graph</text>
<text class="subtitle" x="800" y="118" text-anchor="middle">Product candidates and follow candidates come from two simple edge families</text>
<g>
  <path class="edge" d="M430 333 H545 V248 H660"/>
  <rect x="485" y="264" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="545" y="283" text-anchor="middle">PURCHASED</text>
</g>
<g>
  <path class="edge" d="M430 333 H545 V478 H660"/>
  <rect x="485" y="379" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="545" y="398" text-anchor="middle">FOLLOWS</text>
</g>
<g>
  <path class="edge" d="M940 248 H1040 V363 H1140"/>
  <rect x="967" y="279" width="146" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="1040" y="298" text-anchor="middle">co-buyer score</text>
</g>
<g>
  <path class="edge" d="M940 478 H1040 V363 H1140"/>
  <rect x="967" y="394" width="146" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="1040" y="413" text-anchor="middle">mutual follows</text>
</g>
<g id="user">
  <rect x="150" y="260" width="280" height="146" rx="8" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="150" y="260" width="280" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="150" y1="308" x2="430" y2="308" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="290" y="291" text-anchor="middle">User</text>
  <line x1="150" y1="308" x2="430" y2="308" stroke="#D7E2EC"/>
  <text class="tableField" x="168" y="329">userId</text>
  <line x1="150" y1="338" x2="430" y2="338" stroke="#D7E2EC"/>
  <text class="tableField" x="168" y="359">name</text>
</g>
<g id="product">
  <rect x="660" y="160" width="280" height="176" rx="8" fill="#EAF8EF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="660" y="160" width="280" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="660" y1="208" x2="940" y2="208" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="800" y="191" text-anchor="middle">Product</text>
  <line x1="660" y1="208" x2="940" y2="208" stroke="#D7E2EC"/>
  <text class="tableField" x="678" y="229">productId</text>
  <line x1="660" y1="238" x2="940" y2="238" stroke="#D7E2EC"/>
  <text class="tableField" x="678" y="259">name</text>
  <line x1="660" y1="268" x2="940" y2="268" stroke="#D7E2EC"/>
  <text class="tableField" x="678" y="289">category</text>
</g>
<g id="followee">
  <rect x="660" y="420" width="280" height="116" rx="8" fill="#F3ECFF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="660" y="420" width="280" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="660" y1="468" x2="940" y2="468" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="800" y="451" text-anchor="middle">User</text>
  <line x1="660" y1="468" x2="940" y2="468" stroke="#D7E2EC"/>
  <text class="tableField" x="678" y="489">followee user</text>
</g>
<g id="candidate">
  <rect x="1140" y="290" width="280" height="146" rx="8" fill="#FFF4D9" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="1140" y="290" width="280" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="1140" y1="338" x2="1420" y2="338" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="1280" y="321" text-anchor="middle">Candidate</text>
  <line x1="1140" y1="338" x2="1420" y2="338" stroke="#D7E2EC"/>
  <text class="tableField" x="1158" y="359">score</text>
  <line x1="1140" y1="368" x2="1420" y2="368" stroke="#D7E2EC"/>
  <text class="tableField" x="1158" y="389">reason</text>
</g>
<rect x="88" y="684" width="1424" height="62" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="800" y="709" text-anchor="middle">The example separates candidate generation from scoring so service rules remain readable.</text>
<text class="footer" x="800" y="733" text-anchor="middle">Large production graphs should replace repeated traversal with native Cypher or Gremlin.</text>
</svg>
