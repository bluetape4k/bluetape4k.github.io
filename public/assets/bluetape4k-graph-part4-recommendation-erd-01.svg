<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#496A8F"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#22344A;font-weight:400}
    .subtitle,.footer,.axis{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:17px;fill:#536476;font-weight:400}
    .nodeTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .nodeBody{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:16px;fill:#3F5269;font-weight:400}
    .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .tableField,.edgeLabel{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;fill:#3F5269;font-weight:400}
    .edge{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#91A6BD;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1600" height="780"/>
<rect class="frame" x="34" y="28" width="1532" height="724" rx="24"/>
<text class="title" x="800" y="82" text-anchor="middle">Recommendation Entity Graph</text>
<text class="subtitle" x="800" y="118" text-anchor="middle">Product candidates and follow candidates come from two simple edge families</text>
<g>
  <path class="edge" d="M430 402 H545 V317 H660"/>
  <rect x="485" y="333" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="545" y="352" text-anchor="middle">PURCHASED</text>
</g>
<g>
  <path class="edge" d="M430 402 H545 V547 H660"/>
  <rect x="485" y="448" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="545" y="467" text-anchor="middle">FOLLOWS</text>
</g>
<g>
  <path class="edge" d="M940 317 H1040 V432 H1140"/>
  <rect x="967" y="348" width="146" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="1040" y="367" text-anchor="middle">co-buyer score</text>
</g>
<g>
  <path class="edge" d="M940 547 H1040 V432 H1140"/>
  <rect x="967" y="463" width="146" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="1040" y="482" text-anchor="middle">mutual follows</text>
</g>
<g id="user">
  <rect x="150" y="329" width="280" height="146" rx="8" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="150" y="329" width="280" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="150" y1="377" x2="430" y2="377" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="290" y="360" text-anchor="middle">User</text>
  <line x1="150" y1="377" x2="430" y2="377" stroke="#D7E2EC"/>
  <text class="tableField" x="168" y="398">userId</text>
  <line x1="150" y1="407" x2="430" y2="407" stroke="#D7E2EC"/>
  <text class="tableField" x="168" y="428">name</text>
</g>
<g id="product">
  <rect x="660" y="229" width="280" height="176" rx="8" fill="#EAF8EF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="660" y="229" width="280" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="660" y1="277" x2="940" y2="277" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="800" y="260" text-anchor="middle">Product</text>
  <line x1="660" y1="277" x2="940" y2="277" stroke="#D7E2EC"/>
  <text class="tableField" x="678" y="298">productId</text>
  <line x1="660" y1="307" x2="940" y2="307" stroke="#D7E2EC"/>
  <text class="tableField" x="678" y="328">name</text>
  <line x1="660" y1="337" x2="940" y2="337" stroke="#D7E2EC"/>
  <text class="tableField" x="678" y="358">category</text>
</g>
<g id="followee">
  <rect x="660" y="489" width="280" height="116" rx="8" fill="#F3ECFF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="660" y="489" width="280" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="660" y1="537" x2="940" y2="537" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="800" y="520" text-anchor="middle">User</text>
  <line x1="660" y1="537" x2="940" y2="537" stroke="#D7E2EC"/>
  <text class="tableField" x="678" y="558">followee user</text>
</g>
<g id="candidate">
  <rect x="1140" y="359" width="280" height="146" rx="8" fill="#FFF4D9" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="1140" y="359" width="280" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="1140" y1="407" x2="1420" y2="407" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="1280" y="390" text-anchor="middle">Candidate</text>
  <line x1="1140" y1="407" x2="1420" y2="407" stroke="#D7E2EC"/>
  <text class="tableField" x="1158" y="428">score</text>
  <line x1="1140" y1="437" x2="1420" y2="437" stroke="#D7E2EC"/>
  <text class="tableField" x="1158" y="458">reason</text>
</g>
<rect x="88" y="684" width="1424" height="62" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="800" y="709" text-anchor="middle">The example separates candidate generation from scoring so service rules remain readable.</text>
<text class="footer" x="800" y="733" text-anchor="middle">Large production graphs should replace repeated traversal with native Cypher or Gremlin.</text>
</svg>
