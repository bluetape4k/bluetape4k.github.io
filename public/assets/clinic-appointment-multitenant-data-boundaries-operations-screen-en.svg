<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1210" viewBox="0 0 2200 1210" role="img" aria-labelledby="title desc" data-locale="en">
  <title id="title">Data boundaries · STAFF operations screen mockup</title><desc id="desc">Show the selected scope and the next action first. Every value and ID is synthetic.</desc>
  <style>
    .eyebrow,.table-head,.detail-key,.bottom-code{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:14px;font-weight:800;fill:#7fc9ff;letter-spacing:.4px}
    .screen-title{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:34px;font-weight:800;fill:#f4f8ff}.screen-subtitle{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:16px;fill:#a9bad0}
    .metric-label{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:17px;font-weight:800;fill:#e7f0fb}.metric-value{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:50px;font-weight:800;fill:#f4f8ff}.metric-note{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:13px;fill:#91a8c3}
    .table-head{font-size:13px;fill:#b9cbe0}.table-cell{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:15px;fill:#e7f0fb}.table-code{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:14px;fill:#d5e2f1}
    .screen-section{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:22px;font-weight:800;fill:#f4f8ff}.detail-key{font-size:12px;fill:#91a8c3}.detail-value{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:16px;font-weight:800;fill:#f4f8ff}
    .bottom-title{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:20px;font-weight:800;fill:#f4f8ff}.bottom-body{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:14px;fill:#b9cbe0}.muted{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:13px;fill:#91a8c3}.divider{stroke:#263d59;stroke-width:1}
  </style>
  <rect width="2200" height="1210" fill="#071323"/><rect x="24" y="24" width="2152" height="1162" rx="30" fill="#0c1b2e" stroke="#2d4665" stroke-width="2"/>
  <text class="eyebrow" x="70" y="72" >OPERATIONS / TENANT SCOPE</text><text class="screen-title" x="70" y="116" >Data boundaries · STAFF operations screen mockup</text><text class="screen-subtitle" x="70" y="148" >Show the selected scope and the next action first. Every value and ID is synthetic.</text>
  <rect x="1690" y="72" width="410" height="34" rx="17" fill="#12243a" stroke="#3a5877"/><text class="eyebrow" x="1895" y="95" text-anchor="middle">SCOPE · tenant-blue / clinic-02</text>
  <g><rect x="70" y="175" width="470" height="150" rx="22" fill="#112139" stroke="#60a5fa" stroke-width="2"/><rect x="90" y="195" width="8" height="110" rx="4" fill="#60a5fa"/><text class="metric-label" x="118" y="215" >Appointments waiting</text><text class="metric-value" x="118" y="272" >18</text><text class="metric-note" x="260" y="268" >selected clinic scope</text></g><g><rect x="580" y="175" width="470" height="150" rx="22" fill="#112139" stroke="#2dd4bf" stroke-width="2"/><rect x="600" y="195" width="8" height="110" rx="4" fill="#2dd4bf"/><text class="metric-label" x="628" y="215" >Today's appointments</text><text class="metric-value" x="628" y="272" >42</text><text class="metric-note" x="770" y="268" >source-of-truth data</text></g><g><rect x="1090" y="175" width="470" height="150" rx="22" fill="#112139" stroke="#fb7185" stroke-width="2"/><rect x="1110" y="195" width="8" height="110" rx="4" fill="#fb7185"/><text class="metric-label" x="1138" y="215" >Scope warnings</text><text class="metric-value" x="1138" y="272" >2</text><text class="metric-note" x="1280" y="268" >blocked or recheck</text></g><g><rect x="1600" y="175" width="470" height="150" rx="22" fill="#112139" stroke="#fbbf24" stroke-width="2"/><rect x="1620" y="195" width="8" height="110" rx="4" fill="#fbbf24"/><text class="metric-label" x="1648" y="215" >Needs review</text><text class="metric-value" x="1648" y="272" >5</text><text class="metric-note" x="1790" y="268" >next STAFF action</text></g>
  <rect x="70" y="365" width="1660" height="500" rx="22" fill="#0a1728" stroke="#263d59"/><rect x="1760" y="365" width="380" height="500" rx="18" fill="#101f34" stroke="#a78bfa"/><text class="screen-section" x="94" y="418">Action queue · items to inspect now</text><rect x="94" y="445" width="1610" height="1" class="divider"/><text class="table-head" x="100" y="455" >Target</text><text class="table-head" x="350" y="455" >Scope</text><text class="table-head" x="690" y="455" >Status</text><text class="table-head" x="1210" y="455" >Reason</text><text class="table-head" x="1510" y="455" >Next action</text><g><rect x="84" y="479" width="1635" height="64" rx="12" fill="#102139" stroke="#253d59"/><rect x="84" y="479" width="8" height="64" rx="4" fill="#2dd4bf"/><text class="table-code" x="100" y="514" >apt_•••31</text><text class="table-cell" x="350" y="514" >tenant-blue / clinic-02</text><text class="table-code" x="690" y="514" >ALLOW</text><text class="table-code" x="1210" y="514" >SCOPE_OK</text><text class="table-cell" x="1510" y="514" >read appointment</text></g><g><rect x="84" y="561" width="1635" height="64" rx="12" fill="#0d1b2f" stroke="#253d59"/><rect x="84" y="561" width="8" height="64" rx="4" fill="#fb7185"/><text class="table-code" x="100" y="596" >evt_•••28</text><text class="table-cell" x="350" y="596" >tenant-blue / clinic-03</text><text class="table-code" x="690" y="596" >BLOCKED</text><text class="table-code" x="1210" y="596" >CLINIC_MISMATCH</text><text class="table-cell" x="1510" y="596" >recheck selected clinic</text></g><g><rect x="84" y="643" width="1635" height="64" rx="12" fill="#102139" stroke="#253d59"/><rect x="84" y="643" width="8" height="64" rx="4" fill="#fb7185"/><text class="table-code" x="100" y="678" >apt_•••11</text><text class="table-cell" x="350" y="678" >tenant-green / clinic-02</text><text class="table-code" x="690" y="678" >BLOCKED</text><text class="table-code" x="1210" y="678" >TENANT_FORBIDDEN</text><text class="table-cell" x="1510" y="678" >record the 403 result</text></g><g><rect x="84" y="725" width="1635" height="64" rx="12" fill="#0d1b2f" stroke="#253d59"/><rect x="84" y="725" width="8" height="64" rx="4" fill="#fbbf24"/><text class="table-code" x="100" y="760" >cache_•••7</text><text class="table-cell" x="350" y="760" >tenant-blue / clinic-02</text><text class="table-code" x="690" y="760" >REVIEW</text><text class="table-code" x="1210" y="760" >KEY_SCOPE_MISSING</text><text class="table-cell" x="1510" y="760" >inspect the cache key</text></g><text class="eyebrow" x="1950" y="418" text-anchor="middle">DETAIL</text><text class="detail-key" x="1840" y="490" >tenantCode</text><text class="detail-value" x="1840" y="518" >tenant-blue</text><text class="detail-key" x="1840" y="556" >clinicId</text><text class="detail-value" x="1840" y="584" >clinic-02</text><text class="detail-key" x="1840" y="622" >appointmentId</text><text class="detail-value" x="1840" y="650" >apt_•••31</text><text class="detail-key" x="1840" y="688" >query scope</text><text class="detail-value" x="1840" y="716" >tenant + clinic</text><text class="detail-key" x="1840" y="754" >cache key</text><text class="detail-value" x="1840" y="782" >tenant:clinic</text><text class="detail-key" x="1840" y="820" >authorization</text><text class="detail-value" x="1840" y="848" >ALLOW · STAFF</text>
  <g><rect x="70" y="925" width="520" height="182" rx="20" fill="#112139" stroke="#60a5fa" stroke-width="2"/><text class="bottom-title" x="98" y="966" >Query authority</text><text class="bottom-code" x="98" y="1002" >TenantClinicScope</text><text class="bottom-body" x="98" y="1042" text-anchor="start"><tspan x="98" dy="0">read only data in the selected tenant and clinic</tspan></text></g><g><rect x="625" y="925" width="520" height="182" rx="20" fill="#112139" stroke="#a78bfa" stroke-width="2"/><text class="bottom-title" x="653" y="966" >Async boundary</text><text class="bottom-code" x="653" y="1002" >event · SSE · notification</text><text class="bottom-body" x="653" y="1042" text-anchor="start"><tspan x="653" dy="0">recheck captured scope and provenance</tspan></text></g><g><rect x="1180" y="925" width="520" height="182" rx="20" fill="#112139" stroke="#fbbf24" stroke-width="2"/><text class="bottom-title" x="1208" y="966" >Next action</text><text class="bottom-code" x="1208" y="1002" >read · recheck · record block</text><text class="bottom-body" x="1208" y="1042" text-anchor="start"><tspan x="1208" dy="0">let STAFF judge result and scope together</tspan></text></g><text class="muted" x="70" y="1148" >The screen never shows real clinic names, patient data, or internal identifiers. An operations screen should provide clearer information, not simply more information.</text>
</svg>