<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1760" viewBox="0 0 2400 1760" role="img" aria-labelledby="title desc">
  <title id="title">마지막 자리 경합, timeout, PostgreSQL replay</title>
  <desc id="desc">Alice와 Bob이 마지막 자리를 동시에 요청한다. Redis를 사용할 수 없어도 local gate는 PostgreSQL 검사로 진행한다. PostgreSQL은 Alice의 조건부 capacity 갱신만 허용하고 Bob의 갱신은 거부한다. commit된 응답을 받지 못한 Alice가 같은 idempotency key로 재시도하면 PostgreSQL은 capacity를 다시 올리지 않고 저장된 응답을 replay한다.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/><stop offset="0.58" stop-color="#0c1730"/><stop offset="1" stop-color="#10142a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/></filter>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f9fc4" stroke="#5f9fc4" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#88a86b" stroke="#88a86b" stroke-dasharray="none"/></marker>
    <marker id="arrow-amber" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c99a58" stroke="#c99a58" stroke-dasharray="none"/></marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b96b73" stroke="#b96b73" stroke-dasharray="none"/></marker>
    <style>
      .title{font-family:'goorm Sans','Noto Sans KR',sans-serif;font-size:48px;font-weight:700;fill:#f8fafc}.subtitle{font-family:'goorm Sans Code','goorm Sans',monospace;font-size:20px;fill:#a9b8d4}.frame{fill:none;stroke:#2b4168;stroke-width:2}.participantCard{fill:#13233b;stroke:#5b789d;stroke-width:2;filter:url(#shadow)}.participant{font-family:'goorm Sans Code','goorm Sans',monospace;font-size:22px;font-weight:700;fill:#f8fafc}.role{font-family:'goorm Sans Code','goorm Sans',monospace;font-size:14px;fill:#9fb0ca}.lifeline{stroke:#52647f;stroke-width:2;stroke-dasharray:8 9}.activation{fill:#203b4d;stroke:#73a5bd;stroke-width:1.6}.activationGreen{fill:#30483f;stroke:#88a86b;stroke-width:1.6}.activationAmber{fill:#493a27;stroke:#c99a58;stroke-width:1.6}.seq{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 7}.labelPill{fill:#101b30;stroke-width:1.5}.labelText{font-family:'goorm Sans Code','goorm Sans',monospace;font-size:16px;font-weight:700}.badgeText{font-family:'goorm Sans Code',monospace;font-size:14px;font-weight:700}.altBox{fill:none;stroke:#c99a58;stroke-width:2.2;stroke-dasharray:12 8}.frameLabel{fill:#101b30;stroke:#c99a58;stroke-width:1.5}.frameText{font-family:'goorm Sans Code','goorm Sans',monospace;font-size:16px;font-weight:700;fill:#f1d6a7}.note{font-family:'goorm Sans Code','goorm Sans',monospace;font-size:17px;fill:#c7d3e7}.noteStrong{font-family:'goorm Sans','Noto Sans KR',sans-serif;font-size:21px;font-weight:700;fill:#c9dda8}
      .participantCard{fill:#13233b!important}
    </style>
  </defs>

  <rect width="2400" height="1760" rx="34" fill="url(#canvas)"/>
  <rect class="frame" x="30" y="28" width="2340" height="1704" rx="30"/>
  <text class="title" x="1200" y="76" text-anchor="middle">timeout은 지식만 잃고, commit된 자리는 잃지 않는다</text>
  <text class="subtitle" x="1200" y="114" text-anchor="middle">capacity = 1 · example revision = 42 · 같은 idempotency key는 durable outcome을 replay한다</text>

  <g id="participant-alice"><rect class="participantCard participant" x="40" y="150" width="280" height="92" rx="16" fill="#13233b"/><text class="participant" x="180" y="188" text-anchor="middle">Alice</text><text class="role" x="180" y="217" text-anchor="middle">key A · owner A</text><line class="lifeline" x1="180" y1="242" x2="180" y2="1635"/></g>
  <g id="participant-bob"><rect class="participantCard participant" x="540" y="150" width="280" height="92" rx="16" fill="#13233b"/><text class="participant" x="680" y="188" text-anchor="middle">Bob</text><text class="role" x="680" y="217" text-anchor="middle">key B · owner B</text><line class="lifeline" x1="680" y1="242" x2="680" y2="1635"/></g>
  <g id="participant-api"><rect class="participantCard participant" x="1000" y="150" width="360" height="92" rx="16" fill="#13233b"/><text class="participant" x="1180" y="188" text-anchor="middle">Reservation API</text><text class="role" x="1180" y="217" text-anchor="middle">HTTP command 경계</text><line class="lifeline" x1="1180" y1="242" x2="1180" y2="1635"/></g>
  <g id="participant-gate"><rect class="participantCard participant" x="1500" y="150" width="360" height="92" rx="16" fill="#13233b"/><text class="participant" x="1680" y="188" text-anchor="middle">Local / Redis Gate</text><text class="role" x="1680" y="217" text-anchor="middle">admission + suppression</text><line class="lifeline" x1="1680" y1="242" x2="1680" y2="1635"/></g>
  <g id="participant-postgresql"><rect class="participantCard participant" x="2000" y="150" width="360" height="92" rx="16" fill="#13233b"/><text class="participant" x="2180" y="188" text-anchor="middle">PostgreSQL</text><text class="role" x="2180" y="217" text-anchor="middle">idempotency + capacity</text><line class="lifeline" x1="2180" y1="242" x2="2180" y2="1635"/></g>

  <rect class="activation" x="1172" y="330" width="16" height="1150" rx="5"/>
  <rect class="activationAmber" x="1672" y="485" width="16" height="280" rx="5"/>
  <rect class="activationGreen" x="2172" y="770" width="16" height="760" rx="5"/>

  <g id="redis-fallback-frame"><rect class="altBox" x="1040" y="430" width="820" height="350" rx="22"/><rect class="frameLabel" x="1070" y="410" width="430" height="40" rx="20"/><text class="frameText" x="1285" y="436" text-anchor="middle">Redis unavailable · local fallback</text></g>

  <g id="m1"><rect class="labelPill" x="360" y="280" width="640" height="40" rx="20" stroke="#5f9fc4"/><circle cx="384" cy="300" r="14" fill="#173148" stroke="#5f9fc4"/><text class="badgeText" x="384" y="305" text-anchor="middle" fill="#a8d6ee">1</text><text class="labelText" x="680" y="306" text-anchor="middle" fill="#a8d6ee">동시 hold 요청 · revision 42</text><path class="seq" data-connector="alice-hold" d="M 180 350 H 1180" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/><path class="seq" data-connector="bob-hold" d="M 680 390 H 1180" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/></g>
  <g id="m2"><rect class="labelPill" x="1270" y="450" width="320" height="40" rx="20" stroke="#5f9fc4"/><circle cx="1294" cy="470" r="14" fill="#173148" stroke="#5f9fc4"/><text class="badgeText" x="1294" y="475" text-anchor="middle" fill="#a8d6ee">2</text><text class="labelText" x="1440" y="476" text-anchor="middle" fill="#a8d6ee">node-local admission 통과</text><path class="seq" data-connector="api-to-local-gate" d="M 1180 520 H 1680" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/></g>
  <g id="m3"><rect class="labelPill" x="1240" y="560" width="380" height="40" rx="20" stroke="#c99a58"/><circle cx="1264" cy="580" r="14" fill="#423324" stroke="#c99a58"/><text class="badgeText" x="1264" y="585" text-anchor="middle" fill="#f1d6a7">3</text><text class="labelText" x="1435" y="586" text-anchor="middle" fill="#f1d6a7">Redis error · local fallback 진행</text><path class="seqReturn" data-connector="redis-fallback" d="M 1680 630 H 1180" stroke="#c99a58"/><polygon points="1194,622 1180,630 1194,638" fill="#c99a58" stroke="#c99a58" stroke-dasharray="none" data-direct-solid-head="true"/></g>
  <g id="m4"><rect class="labelPill" x="1550" y="680" width="430" height="40" rx="20" stroke="#5f9fc4"/><circle cx="1574" cy="700" r="14" fill="#173148" stroke="#5f9fc4"/><text class="badgeText" x="1574" y="705" text-anchor="middle" fill="#a8d6ee">4</text><text class="labelText" x="1770" y="706" text-anchor="middle" fill="#a8d6ee">idempotency record 확보</text><path class="seq" data-connector="idempotency-acquire" d="M 1180 750 H 2180" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/></g>
  <g id="m5"><rect class="labelPill" x="1570" y="820" width="390" height="40" rx="20" stroke="#88a86b"/><circle cx="1594" cy="840" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="1594" y="845" text-anchor="middle" fill="#c9dda8">5</text><text class="labelText" x="1775" y="846" text-anchor="middle" fill="#c9dda8">Alice CAS 성공 · hold 생성</text><path class="seq" data-connector="alice-cas" d="M 1180 890 H 2180" stroke="#88a86b" marker-end="url(#arrow-green)"/></g>
  <g id="m6"><rect class="labelPill" x="1570" y="960" width="390" height="40" rx="20" stroke="#b96b73"/><circle cx="1594" cy="980" r="14" fill="#402832" stroke="#b96b73"/><text class="badgeText" x="1594" y="985" text-anchor="middle" fill="#e5a5ac">6</text><text class="labelText" x="1775" y="986" text-anchor="middle" fill="#e5a5ac">Bob CAS 갱신 0 rows</text><path class="seq" data-connector="bob-cas-fails" d="M 1180 1030 H 2180" stroke="#b96b73" marker-end="url(#arrow-red)"/></g>
  <g id="m7"><rect class="labelPill" x="1530" y="1100" width="470" height="40" rx="20" stroke="#5ab3aa"/><circle cx="1554" cy="1120" r="14" fill="#173d3e" stroke="#5ab3aa"/><text class="badgeText" x="1554" y="1125" text-anchor="middle" fill="#a9e4df">7</text><text class="labelText" x="1765" y="1126" text-anchor="middle" fill="#a9e4df">outcome commit + replay body 저장</text><path class="seqReturn" data-connector="commit-to-api" d="M 2180 1170 H 1180" stroke="#5ab3aa"/><polygon points="1194,1162 1180,1170 1194,1178" fill="#5ab3aa" stroke="#5ab3aa" stroke-dasharray="none" data-direct-solid-head="true"/><path class="seqReturn" data-connector="lost-response" d="M 1180 1205 H 260" stroke="#b96b73"/><path d="M 222 1193 L 246 1217 M 246 1193 L 222 1217" stroke="#b96b73" stroke-width="4" stroke-linecap="round"/></g>
  <g id="m8"><rect class="labelPill" x="420" y="1270" width="520" height="40" rx="20" stroke="#5f9fc4"/><circle cx="444" cy="1290" r="14" fill="#173148" stroke="#5f9fc4"/><text class="badgeText" x="444" y="1295" text-anchor="middle" fill="#a8d6ee">8</text><text class="labelText" x="690" y="1296" text-anchor="middle" fill="#a8d6ee">client timeout 후 같은 key A</text><path class="seq" data-connector="same-key-retry" d="M 180 1340 H 1180" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/></g>
  <g id="m9"><rect class="labelPill" x="1480" y="1400" width="570" height="40" rx="20" stroke="#88a86b"/><circle cx="1504" cy="1420" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="1504" y="1425" text-anchor="middle" fill="#c9dda8">9</text><text class="labelText" x="1775" y="1426" text-anchor="middle" fill="#c9dda8">Replay · capacity 두 번 증가 없음</text><path class="seq" data-connector="replay-request" d="M 1180 1470 H 2180" stroke="#88a86b" marker-end="url(#arrow-green)"/><path class="seqReturn" data-connector="replay-response" d="M 2180 1515 H 1180" stroke="#5ab3aa"/><polygon points="1194,1507 1180,1515 1194,1523" fill="#5ab3aa" stroke="#5ab3aa" stroke-dasharray="none" data-direct-solid-head="true"/></g>

  <rect x="390" y="1580" width="1620" height="90" rx="20" fill="#102038" stroke="#88a86b" stroke-width="2"/>
  <text class="noteStrong" x="1200" y="1618" text-anchor="middle">PostgreSQL은 occupiedCount = 1을 유지한다</text>
  <text class="note" x="1200" y="1650" text-anchor="middle">timeout은 Alice의 지식만 바꾸고, commit된 transaction은 되돌리지 않는다</text>
</svg>
