<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-label="Spring Boot S3 예제 흐름">
  <defs>
    <style>
      .title{font-family:'goorm Sans',cursive;font-size:34px;fill:#f8fafc}
      .subtitle,.body,.small{font-family:'goorm Sans Code',monospace;fill:#cbd5e1}
      .subtitle{font-size:15px}.label{font-family:'goorm Sans',cursive;font-size:22px;fill:#f8fafc}
      .body{font-size:14px}.small{font-size:12px}
      .panel{fill:#111827;stroke:#334155;stroke-width:1.4;rx:18}.card{stroke-width:1.6;rx:16}
      .arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .muted{fill:none;stroke:#64748b;stroke-width:1.9;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowMuted)}
      .chip{fill:#111827;stroke:#94a3b8;stroke-width:1;rx:10}.footer{fill:#0f172a;stroke:#102033;stroke-width:1.2;rx:10}
      .footerText{font-family:'goorm Sans Code',monospace;font-size:12px;fill:#ffffff}
    </style>
    <marker id="arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#94a3b8"/></marker>
    <marker id="arrowMuted" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1160" height="760" fill="#0b1220"/>
  <text class="title" x="54" y="70">Spring Boot S3 예제 흐름</text>
  <text class="subtitle" x="56" y="104">WebFlux 경로는 객체 API용 S3Operations와 KMS 메타데이터 기반 선택적 클라이언트 측 암호화를 사용합니다.</text>
  <rect class="panel" x="54" y="136" width="1052" height="560"/>

  <rect class="card" x="86" y="214" width="226" height="92" fill="#123a43" stroke="#22d3ee"/>
  <text class="label" x="199" y="250" text-anchor="middle">HTTP 클라이언트 / 테스트</text>
  <text class="body" x="199" y="278" text-anchor="middle">문서 경로 호출</text>

  <rect class="card" x="390" y="184" width="290" height="112" fill="#163a2d" stroke="#4ade80"/>
  <text class="label" x="535" y="224" text-anchor="middle">S3DocumentController</text>
  <text class="body" x="535" y="252" text-anchor="middle">업로드, 다운로드, 목록 조회,</text>
  <text class="body" x="535" y="274" text-anchor="middle">사전 서명 URL, 삭제</text>

  <rect class="card" x="764" y="184" width="276" height="112" fill="#453511" stroke="#fbbf24"/>
  <text class="label" x="902" y="224" text-anchor="middle">S3Operations</text>
  <text class="body" x="902" y="252" text-anchor="middle">S3CoroutinesTemplate</text>
  <text class="body" x="902" y="274" text-anchor="middle">전송과 사전 서명</text>

  <rect class="card" x="390" y="406" width="290" height="108" fill="#35234d" stroke="#c084fc"/>
  <text class="label" x="535" y="444" text-anchor="middle">암호화 경로</text>
  <text class="body" x="535" y="472" text-anchor="middle">클라이언트 측 봉투 암호화</text>
  <text class="body" x="535" y="494" text-anchor="middle">테넌트 컨텍스트</text>

  <rect class="card" x="764" y="406" width="276" height="108" fill="#4a2430" stroke="#fb7185"/>
  <text class="label" x="902" y="444" text-anchor="middle">KmsOperations</text>
  <text class="body" x="902" y="472" text-anchor="middle">데이터 키 메타데이터</text>
  <text class="body" x="902" y="494" text-anchor="middle">암호화 컨텍스트</text>

  <rect class="card" x="596" y="576" width="284" height="70" fill="#4a2d18" stroke="#fb923c"/>
  <text class="label" x="738" y="606" text-anchor="middle">S3 엔드포인트</text>
  <text class="body" x="738" y="630" text-anchor="middle">LocalStack, Floci, 또는 AWS</text>

  <polyline class="arrow" points="312,260 350,260 350,240 390,240"/>
  <polyline class="arrow" points="680,240 764,240"/>
  <rect class="chip" x="704" y="204" width="48" height="24"/>
  <text class="small" x="728" y="221" text-anchor="middle">객체</text>

  <polyline class="arrow" points="535,296 535,406"/>
  <rect class="chip" x="556" y="340" width="74" height="24"/>
  <text class="small" x="593" y="357" text-anchor="middle">선택 경로</text>

  <polyline class="arrow" points="680,460 764,460"/>
  <rect class="chip" x="704" y="424" width="48" height="24"/>
  <text class="small" x="728" y="441" text-anchor="middle">KMS</text>

  <polyline class="arrow" points="902,296 902,336 738,336 738,576"/>
  <polyline class="muted" points="535,514 535,546 738,546 738,576"/>
  <polyline class="muted" points="902,514 902,546 738,546"/>

  <rect class="footer" x="86" y="670" width="988" height="36"/>
  <text class="footerText" x="580" y="693" text-anchor="middle">예제 역할: 객체 API, 사전 서명 URL, 객체 목록, 봉투 암호화 확장 지점을 보여 줍니다.</text>
  <path class="connector" d="M2 2 L3 2" fill="none" stroke="transparent"/>
</svg>