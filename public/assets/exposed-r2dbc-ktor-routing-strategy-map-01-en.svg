<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1040" viewBox="0 0 1700 1040" role="img" aria-labelledby="title desc">
  <title id="title">Same Routing Problem, Different Runtime Boundary</title><desc id="desc">Validate once, pass explicit values, and prove isolation.</desc><defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#28343b" flood-opacity="0.13"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#608a55" stroke="#608a55" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a27848" stroke="#a27848" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b75f5f" stroke="#b75f5f" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#fbfcf8}.frame{fill:#fff;stroke:#41545d;stroke-width:2.2}
      .title{font-family:"Architects Daughter";font-size:40px;fill:#263238;font-weight:700}
      .subtitle,.detail,.body,.cellText,.labelText,.footer,.role{font-family:"Comic Mono";fill:#4e6069}
      .subtitle{font-size:18px}.detail,.body{font-size:15px}.cellText{font-size:16px}.footer{font-size:14px}
      .role{font-family:"Comic Mono";font-size:13px}.mono,.code,.badgeText{font-family:"Comic Mono";fill:#33454e}
      .participant,.cardTitle,.bandTitle,.cellTitle{font-family:"Architects Daughter";fill:#1f3138;font-weight:700}
      .participant{font-size:21px}.cardTitle{font-size:25px}.bandTitle{font-size:23px}.cellTitle{font-size:18px}
      .header{fill:#fff;stroke:#546e7a;stroke-width:2;filter:url(#shadow)}
      .headerAlt{fill:#f4fbf6;stroke:#6f9b7a;stroke-width:2;filter:url(#shadow)}
      .lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#e7f2ec;stroke:#5b7e67;stroke-width:1.7}
      .call,.state,.return,.skip,.edge{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
      .call{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.state{stroke:#608a55;marker-end:url(#arrow-green)}
      .return{stroke:#a27848;marker-end:url(#arrow-amber);stroke-dasharray:8 7}.skip{stroke:#b75f5f;marker-end:url(#arrow-red)}
      .pill,.label{fill:#fff;stroke:#78909c;stroke-width:1.4}.labelText{font-size:13px}
      .badge{fill:#263238}.badgeText{font-size:12px;font-weight:700;fill:#fff}
      .branch{fill:none;stroke:#78909c;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#78909c;stroke-width:1.4;stroke-dasharray:8 7}
      .note{fill:#fff7e8;stroke:#d4a95f;stroke-width:2}
      .problem{fill:#eef3ff;stroke:#95a7d8;stroke-width:2;filter:url(#shadow)}
      .spring{fill:#fff8eb;stroke:#d2a96c;stroke-width:2;filter:url(#shadow)}
      .ktor{fill:#eafafa;stroke:#62aeb3;stroke-width:2;filter:url(#shadow)}
      .shared{fill:#f1f9ef;stroke:#82ad7a;stroke-width:2;filter:url(#shadow)}
      .row{fill:#fff;stroke:#d7e2e8;stroke-width:1.4}.rowAlt{fill:#f8fbfc;stroke:#d7e2e8;stroke-width:1.4}
      .chip{fill:#fff;stroke:#cad8de;stroke-width:1.4}.chipAlt{fill:#f8fbfc;stroke:#cad8de;stroke-width:1.4}
    </style>
  </defs>
  <rect class="canvas" width="1700" height="1040"/><rect class="frame" x="42" y="34" width="1616" height="962" rx="8"/>
  <text x="850" y="90" class="title" text-anchor="middle">Same Routing Problem, Different Runtime Boundary</text><text x="850" y="124" class="subtitle" text-anchor="middle">Validate once, pass explicit values, and prove isolation.</text>
  <g>
    <rect x="380" y="162" width="940" height="116" rx="8" class="problem"/>
    <text x="850" y="206" class="cardTitle" text-anchor="middle">Reader problem</text>
    <text x="850" y="238" class="body" text-anchor="middle">Select the right tenant schema or R2DBC target.</text>
    <text x="850" y="260" class="body" text-anchor="middle">Do it without leaking state to the next request.</text>
  </g>
  <path d="M 500 278 L 500 346" class="call"/><path d="M 1200 278 L 1200 346" class="state"/>
  <text x="500" y="325" class="labelText" text-anchor="middle">blocking path</text><text x="1200" y="325" class="labelText" text-anchor="middle">coroutine path</text>
  <g>
    <rect x="110" y="350" width="650" height="452" rx="8" class="spring"/>
    <text x="435" y="397" class="cardTitle" text-anchor="middle">Spring / JDBC workshop</text>
    <g>
    <rect x="150" y="430" width="570" height="78" rx="8" class="row"/>
    <text x="174" y="459" class="cellTitle" >Carrier</text>
    <text x="174" y="483" class="cellText" >ThreadLocal, ScopedValue, ReactorContext</text>
    <text x="174" y="502" class="cellText" >chosen by runtime model</text>
  </g>
    <g>
    <rect x="150" y="516" width="570" height="78" rx="8" class="rowAlt"/>
    <text x="174" y="545" class="cellTitle" >Boundary</text>
    <text x="174" y="569" class="cellText" >filter / AOP / transaction template</text>
    <text x="174" y="588" class="cellText" >bind state before JDBC work</text>
  </g>
    <g>
    <rect x="150" y="602" width="570" height="78" rx="8" class="row"/>
    <text x="174" y="631" class="cellTitle" >Target choice</text>
    <text x="174" y="655" class="cellText" >schema or DataSource selection</text>
    <text x="174" y="674" class="cellText" >inside JDBC transaction</text>
  </g>
    <g>
    <rect x="150" y="688" width="570" height="78" rx="8" class="rowAlt"/>
    <text x="174" y="717" class="cellTitle" >Watch out</text>
    <text x="174" y="741" class="cellText" >Thread affinity and cleanup rules</text>
    <text x="174" y="760" class="cellText" >are correctness rules</text>
  </g>
  </g>
  <g>
    <rect x="940" y="350" width="650" height="452" rx="8" class="ktor"/>
    <text x="1265" y="397" class="cardTitle" text-anchor="middle">Ktor / Exposed R2DBC workshop</text>
    <g>
    <rect x="980" y="430" width="570" height="78" rx="8" class="row"/>
    <text x="1004" y="459" class="cellTitle" >Carrier</text>
    <text x="1004" y="483" class="cellText" >ApplicationCall.attributes</text>
    <text x="1004" y="502" class="cellText" >stores RoutingRequest or enum</text>
  </g>
    <g>
    <rect x="980" y="516" width="570" height="78" rx="8" class="rowAlt"/>
    <text x="1004" y="545" class="cellTitle" >Boundary</text>
    <text x="1004" y="569" class="cellText" >plugin resolves headers</text>
    <text x="1004" y="588" class="cellText" >repository receives explicit route</text>
  </g>
    <g>
    <rect x="980" y="602" width="570" height="78" rx="8" class="row"/>
    <text x="1004" y="631" class="cellTitle" >Target choice</text>
    <text x="1004" y="655" class="cellText" >SET SCHEMA for tenant</text>
    <text x="1004" y="674" class="cellText" >registry.database(route.key)</text>
  </g>
    <g>
    <rect x="980" y="688" width="570" height="78" rx="8" class="rowAlt"/>
    <text x="1004" y="717" class="cellTitle" >Watch out</text>
    <text x="1004" y="741" class="cellText" >Headers are routing hints</text>
    <text x="1004" y="760" class="cellText" >not authentication or policy</text>
  </g>
  </g>
  <path d="M 760 578 L 940 578" class="edge"/>
  <g>
    <rect x="250" y="840" width="1200" height="116" rx="8" class="shared"/>
    <text x="292" y="880" class="cardTitle" >Shared invariant</text>
    <text x="292" y="912" class="body" >Tests prove isolation, invalid input rejection, write target separation,</text>
    <text x="292" y="936" class="body" >and concurrent request state isolation.</text>
    <rect x="1060" y="864" width="300" height="30" rx="8" class="chip"/>
    <text x="1080" y="885" class="mono" >korean != english</text>
    <rect x="1060" y="906" width="300" height="30" rx="8" class="chipAlt"/>
    <text x="1080" y="927" class="mono" >acme:rw != acme:ro</text>
  </g>
  </svg>
