<rect width="1600" height="1000" class="bg"/><rect x="32" y="32" width="1536" height="936" rx="30" class="panel frame"/>
<text x="78" y="98" class="title">Tenant State Carriers by Runtime Model</text><text x="80" y="138" class="sub subtitle">Carriers differ; validation, explicit transfer, transaction-bound selection, and isolation proof stay the same.</text><rect x="100" y="220" width="620" height="370" rx="20" class="card"/>
<text x="124" y="264" class="h">Spring / JDBC</text><text x="124" y="302" class="body">Filter or interceptor</text><text x="124" y="332" class="body">ThreadLocal or ScopedValue</text><text x="124" y="362" class="body">JDBC transaction</text><text x="124" y="392" class="body">Cleanup is mandatory</text><rect x="880" y="220" width="620" height="370" rx="20" class="card2"/>
<text x="904" y="264" class="h">Ktor / R2DBC</text><text x="904" y="302" class="body">Application plugin</text><text x="904" y="332" class="body">ApplicationCall.attributes</text><text x="904" y="362" class="body">suspendTransaction</text><text x="904" y="392" class="body">Pass typed values</text><rect x="150" y="700" width="250" height="92" rx="20" class="card"/><text x="275" y="754" text-anchor="middle" class="mono">1. extract identity</text><path d="M400 746 H438" class="call"/><rect x="440" y="700" width="250" height="92" rx="20" class="card2"/><text x="565" y="754" text-anchor="middle" class="mono">2. authorize + check readiness</text><path d="M690 746 H728" class="call"/><rect x="730" y="700" width="250" height="92" rx="20" class="card"/><text x="855" y="754" text-anchor="middle" class="mono">3. pass routing value</text><path d="M980 746 H1018" class="call"/><rect x="1020" y="700" width="250" height="92" rx="20" class="card"/><text x="1145" y="754" text-anchor="middle" class="mono">4. select schema or target</text><path d="M1270 746 H1308" class="call"/><rect x="1310" y="700" width="250" height="92" rx="20" class="card"/><text x="1435" y="754" text-anchor="middle" class="mono">5. prove isolation</text><rect x="130" y="870" width="1340" height="76" rx="20" class="footer"/><text x="800" y="916" text-anchor="middle" class="body">A header is routing input, not authentication policy. Prove korean ≠ english and acme:rw ≠ acme:ro with real data.</text></svg>
