<title id="title">Tenant State Carriers by Runtime Model</title><desc id="desc">A header is routing input, not authentication policy. Prove korean ≠ english and acme:rw ≠ acme:ro with real data.</desc><defs><marker id="arrow-cyan" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#36C5F0"/></marker><marker id="arrow-mint" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5EEAD4"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FBBF24"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FB7185"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A78BFA"/></marker></defs>
  <style>
  .bg{fill:#07111F}.panel{fill:#0D1B2D;stroke:#36536F;stroke-width:2}.card{fill:#10243A;stroke:#36536F;stroke-width:2}.card2{fill:#132B43;stroke:#36536F;stroke-width:2}
  .title{font:700 42px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}.sub{font:600 19px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}.h{font:700 24px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
  .body{font:600 17px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}.mono{font:700 16px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#E6F2FF}.small{font:600 14px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}
  .life{stroke:#36536F;stroke-width:2;stroke-dasharray:8 9}.act{fill:#123252;stroke:#36C5F0;stroke-width:2}
