<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">서비스 경계가 모듈 조합을 결정한다</title>
  <desc id="desc">BOM은 버전을 정렬하고, 애플리케이션은 서비스 경계와 자원 소유권을 설계합니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L15,8 L1,15 Z" fill="#36C5F0"/>
    </marker>
  </defs>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0D1B2D;stroke:#36536F;stroke-width:2}
    .card{fill:#10243A;stroke:#36536F;stroke-width:2}.focus{fill:#0C3044;stroke:#5EEAD4;stroke-width:2.5}
    .warn{fill:#332B18;stroke:#FBBF24;stroke-width:2}.title{font:700 40px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
    .subtitle{font:500 20px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}.card-title{font:700 25px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
    .body{font:600 18px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}.chip{font:700 16px "goorm Sans Code","goorm Sans",monospace;fill:#5EEAD4}
    .label{font:700 16px "goorm Sans Code","goorm Sans",monospace;fill:#36C5F0}.connector{fill:none;stroke:#36C5F0;stroke-width:4;marker-end:url(#arrow)}
    .divider{stroke:#36536F;stroke-width:2}.footer{font:600 18px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
  </style>
  <rect width="1600" height="940" class="canvas"/>
  <rect x="32" y="32" width="1536" height="876" rx="32" class="frame"/>
  <text x="80" y="98" class="title">서비스 경계가 모듈 조합을 결정한다</text>
  <text x="80" y="138" class="subtitle">같은 BOM을 사용해도 서비스의 책임과 수명 주기에 따라 선택하는 모듈은 달라집니다.</text>
  
      <rect x="80" y="200" width="1440" height="80" rx="22" class="focus"/>
      <text x="800" y="250" text-anchor="middle" class="card-title">공통 버전 경계 · bluetape4k-dependencies 1.3.0</text>
      
        <path d="M300 280 V348" class="connector"/>
        <rect x="80" y="370" width="440" height="330" rx="26" class="card"/>
        <text x="110" y="430" class="card-title">Spring Boot 워커</text>
        <line x1="110" y1="458" x2="490" y2="458" class="divider"/>
        <text x="110" y="510" class="body">DB 작업 · S3 결과</text>
        <text x="110" y="554" class="body">단일 실행 · 상태 점검</text>
        <rect x="108" y="610" width="384" height="58" rx="16" fill="#12364A"/>
        <text x="300" y="646" text-anchor="middle" class="chip">Exposed · AWS · Leader</text>

        <path d="M810 280 V348" class="connector"/>
        <rect x="590" y="370" width="440" height="330" rx="26" class="card"/>
        <text x="620" y="430" class="card-title">Ktor 검색 API</text>
        <line x1="620" y1="458" x2="1000" y2="458" class="divider"/>
        <text x="620" y="510" class="body">HTTP · 입력 검증</text>
        <text x="620" y="554" class="body">관측성 · 클라이언트 수명 주기</text>
        <rect x="618" y="610" width="384" height="58" rx="16" fill="#12364A"/>
        <text x="810" y="646" text-anchor="middle" class="chip">Ktor · Text · AWS</text>

        <path d="M1320 280 V348" class="connector"/>
        <rect x="1100" y="370" width="440" height="330" rx="26" class="card"/>
        <text x="1130" y="430" class="card-title">이미지 업로드 API</text>
        <line x1="1130" y1="458" x2="1510" y2="458" class="divider"/>
        <text x="1130" y="510" class="body">크기 제한 · 스트리밍</text>
        <text x="1130" y="554" class="body">디코딩 · OCR</text>
        <rect x="1128" y="610" width="384" height="58" rx="16" fill="#12364A"/>
        <text x="1320" y="646" text-anchor="middle" class="chip">Image · OCR · Okio</text>
      <line x1="80" y1="790" x2="1520" y2="790" class="divider"/>
      <text x="800" y="836" text-anchor="middle" class="footer">BOM은 버전을 정렬하고, 애플리케이션은 서비스 경계와 자원 소유권을 설계합니다.</text>
</svg>