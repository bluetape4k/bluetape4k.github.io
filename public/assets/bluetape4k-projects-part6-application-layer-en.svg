<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="780" viewBox="0 0 1580 780" role="img">
<title>Spring Boot 4 and Ktor Application Layer</title>
<desc>Application modules sit above the shared foundation and keep wiring explicit.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020712" flood-opacity="0.45"/></filter>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#78AFFF"/></marker>
  <style>
    .bg{fill:#07111F}.frame{fill:#0D1B2D;stroke:#213B5E;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#F7FAFF;font-weight:700}
    .subtitle,.body,.small{font-family:"Comic Mono","Courier New",monospace;fill:#C9D6E8}
    .subtitle{font-size:17px}.body{font-size:14px}.small{font-size:12px;fill:#8DA2BC}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;fill:#F7FAFF;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke:#78AFFF;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bar-label{font-family:"Comic Mono","Courier New",monospace;font-size:15px;fill:#F7FAFF}.axis{stroke:#47627F;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1580" height="780"/>
<rect class="frame" x="34" y="28" width="1512" height="724" rx="24"/>
<text class="title" x="70" y="82">Spring Boot 4 and Ktor Application Layer</text>
<text class="subtitle" x="72" y="114">Application modules sit above the shared foundation and keep wiring explicit.</text>
<g data-card="Shared Foundation">
  <rect class="card" x="60" y="210" width="260" height="126" rx="14" fill="#132D55" stroke="#68A7FF"/>
  <text class="label" x="190" y="244" text-anchor="middle"><tspan x="190" dy="0">Shared Foundation</tspan></text>
  <text class="body" x="190" y="278" text-anchor="middle"><tspan x="190" dy="0">BOM · core · coroutines</tspan><tspan x="190" dy="20">I/O · data · infra · utils</tspan></text>
</g>
<g data-card="Spring Boot 4">
  <rect class="card" x="420" y="210" width="300" height="126" rx="14" fill="#173B2A" stroke="#66D58D"/>
  <text class="label" x="570" y="244" text-anchor="middle"><tspan x="570" dy="0">Spring Boot 4</tspan></text>
  <text class="body" x="570" y="278" text-anchor="middle"><tspan x="570" dy="0">WebFlux + coroutines</tspan><tspan x="570" dy="20">Redis · R2DBC · MongoDB</tspan><tspan x="570" dy="20">Hibernate Lettuce</tspan></text>
</g>
<g data-card="Configuration">
  <rect class="card" x="820" y="210" width="300" height="126" rx="14" fill="#123D43" stroke="#4ED7C7"/>
  <text class="label" x="970" y="244" text-anchor="middle"><tspan x="970" dy="0">Configuration</tspan></text>
  <text class="body" x="970" y="278" text-anchor="middle"><tspan x="970" dy="0">BOM platform import</tspan><tspan x="970" dy="20">explicit beans/plugins</tspan></text>
</g>
<g data-card="Running Service">
  <rect class="card" x="1220" y="210" width="250" height="126" rx="14" fill="#443215" stroke="#F6C55F"/>
  <text class="label" x="1345" y="244" text-anchor="middle"><tspan x="1345" dy="0">Running Service</tspan></text>
  <text class="body" x="1345" y="278" text-anchor="middle"><tspan x="1345" dy="0">API boundary</tspan><tspan x="1345" dy="20">observed and tested</tspan></text>
</g>
<g data-card="Shared Foundation">
  <rect class="card" x="60" y="470" width="260" height="126" rx="14" fill="#132D55" stroke="#68A7FF"/>
  <text class="label" x="190" y="504" text-anchor="middle"><tspan x="190" dy="0">Shared Foundation</tspan></text>
  <text class="body" x="190" y="538" text-anchor="middle"><tspan x="190" dy="0">BOM · core · coroutines</tspan><tspan x="190" dy="20">I/O · data · infra · utils</tspan></text>
</g>
<g data-card="Ktor 3">
  <rect class="card" x="420" y="470" width="300" height="126" rx="14" fill="#2D255C" stroke="#B29DFF"/>
  <text class="label" x="570" y="504" text-anchor="middle"><tspan x="570" dy="0">Ktor 3</tspan></text>
  <text class="body" x="570" y="538" text-anchor="middle"><tspan x="570" dy="0">core · observability</tspan><tspan x="570" dy="20">OpenAPI · resilience4j</tspan><tspan x="570" dy="20">testing helpers</tspan></text>
</g>
<g data-card="Tests">
  <rect class="card" x="820" y="470" width="300" height="126" rx="14" fill="#4B1F32" stroke="#F285A8"/>
  <text class="label" x="970" y="504" text-anchor="middle"><tspan x="970" dy="0">Tests</tspan></text>
  <text class="body" x="970" y="538" text-anchor="middle"><tspan x="970" dy="0">WebTestClient</tspan><tspan x="970" dy="20">testApplication</tspan><tspan x="970" dy="20">Testcontainers</tspan></text>
</g>
<g data-card="Running Service">
  <rect class="card" x="1220" y="470" width="250" height="126" rx="14" fill="#443215" stroke="#F6C55F"/>
  <text class="label" x="1345" y="504" text-anchor="middle"><tspan x="1345" dy="0">Running Service</tspan></text>
  <text class="body" x="1345" y="538" text-anchor="middle"><tspan x="1345" dy="0">API boundary</tspan><tspan x="1345" dy="20">observed and tested</tspan></text>
</g>
<path class="connector" data-connector="foundation-to-spring-boot-4" d="M320 273 H420"/>
<path class="connector" data-connector="spring-boot-4-to-configuration" d="M720 273 H820"/>
<path class="connector" data-connector="configuration-to-running-service" d="M1120 273 H1220"/>
<path class="connector" data-connector="foundation-to-ktor-3" d="M320 533 H420"/>
<path class="connector" data-connector="ktor-3-to-tests" d="M720 533 H820"/>
<path class="connector" data-connector="tests-to-running-service" d="M1120 533 H1220"/>
</svg>