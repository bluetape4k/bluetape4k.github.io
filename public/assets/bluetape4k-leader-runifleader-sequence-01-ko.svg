  <g><rect class="label" x="203" y="240" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="221" cy="254" r="10.5" fill="#fff" stroke="#78909c" stroke-width="1.3"/><text x="221" y="258" text-anchor="middle" class="badgeText">1</text><text x="239" y="259" class="labelText">runIfLeader(&quot;job&quot;)</text><path d="M 150 268 L 408 268" class="call"/></g><g><rect class="label" x="473" y="304" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="491" cy="318" r="10.5" fill="#fff" stroke="#78909c" stroke-width="1.3"/><text x="491" y="322" text-anchor="middle" class="badgeText">2</text><text x="509" y="323" class="labelText">tryAcquire(lock, wait)</text><path d="M 420 332 L 678 332" class="call"/></g><g><rect class="label" x="473" y="368" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="491" cy="382" r="10.5" fill="#fff" stroke="#78909c" stroke-width="1.3"/><text x="491" y="386" text-anchor="middle" class="badgeText">3</text><text x="509" y="387" class="labelText">lock acquired</text><path d="M 690 396 L 432 396" class="return"/></g><g><rect class="label" x="608" y="432" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="626" cy="446" r="10.5" fill="#fff" stroke="#78909c" stroke-width="1.3"/><text x="626" y="450" text-anchor="middle" class="badgeText">4</text><text x="644" y="451" class="labelText">action()</text><path d="M 420 460 L 948 460" class="state"/></g><g><rect class="label" x="203" y="496" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="221" cy="510" r="10.5" fill="#fff" stroke="#78909c" stroke-width="1.3"/><text x="221" y="514" text-anchor="middle" class="badgeText">5</text><text x="239" y="515" class="labelText">release + result</text><path d="M 420 524 L 162 524" class="return"/></g><g><rect class="label" x="338" y="560" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="356" cy="574" r="10.5" fill="#fff" stroke="#78909c" stroke-width="1.3"/><text x="356" y="578" text-anchor="middle" class="badgeText">6</text><text x="374" y="579" class="labelText">contention returns null</text><path d="M 690 588 L 162 588" class="skip"/></g>
  </svg>