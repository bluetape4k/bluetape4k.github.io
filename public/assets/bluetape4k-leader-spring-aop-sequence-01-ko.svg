<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Spring @LeaderElection AOP 시퀀스</title><desc id="desc">어드바이스가 메타데이터를 해석하고 elector를 선택한 뒤, 메서드 본문 실행과 결과 기록을 처리합니다.</desc><defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#02050a" flood-opacity="0.42"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6fb6e8" stroke="#6fb6e8" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#80d99b" stroke="#80d99b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e2b35c" stroke="#e2b35c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ef8292" stroke="#ef8292" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#87a8c2" stroke="#87a8c2" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#050914}.frame{fill:#0c1628;stroke:#315a7a;stroke-width:2.2}
      .title{font-family:"goorm Sans";font-size:38px;fill:#f0f5ff}
      .subtitle,.detail,.labelText,.footer,.axis,.tick,.legend,.role{font-family:"goorm Sans";fill:#b4c5d8}
      .subtitle{font-size:16px}.detail{font-size:14px}.footer{font-size:13px}.axis,.tick,.legend{font-size:13px}
      .role{font-family:"goorm Sans Code";font-size:12.5px}
      .bandTitle,.cardTitle,.participant{font-family:"goorm Sans";fill:#edf4ff}
      .bandTitle{font-size:23px}.cardTitle{font-size:22px}.participant{font-size:19px}
      .mono,.code,.badgeText{font-family:"goorm Sans Code";fill:#d7e3f2}
      .band{fill:#101d30;stroke:#294c69;stroke-width:1.6}.bandAlt{fill:#10231f;stroke:#2f6257;stroke-width:1.6}
      .card{filter:url(#shadow);fill:#111d2f!important;stroke-width:2}.header{fill:#111d2f;stroke:#537a99;stroke-width:2}
      .surfaceWarm{fill:#211c16;stroke:#8b6a34;stroke-width:2}.surfacePurple{fill:#1c1930;stroke:#7058a2;stroke-width:2}
      .footerBar{fill:#0e1b2e;stroke:#294c69;stroke-width:2}.tableHeader{fill:#142b46;stroke:#537a99;stroke-width:2}
      .edge,.call,.return,.skip,.state{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .call{stroke:#6fb6e8;marker-end:url(#arrow-blue)}.state{stroke:#80d99b;marker-end:url(#arrow-green)}
      .return{stroke:#e2b35c;marker-end:url(#arrow-amber);stroke-dasharray:8 7}.skip{stroke:#ef8292;marker-end:url(#arrow-red)}
      .pill,.label{fill:#0e1a2b;stroke-width:1.5}.badgeCircle{fill:#0e1a2b}.labelText{font-size:12.5px}.badgeText{font-size:12px;font-weight:700}
      .lifeline{stroke:#52718a;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#193c32;stroke:#71bf8b;stroke-width:1.7}
      .branch{fill:none;stroke:#7194ae;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#7194ae;stroke-width:1.4;stroke-dasharray:8 7}
    </style>
  </defs>
  <rect class="canvas" width="1280" height="860"/><rect class="frame" x="28" y="26" width="1224" height="808" rx="14"/>
  <text x="640" y="80" class="title" text-anchor="middle">Spring @LeaderElection AOP 시퀀스</text><text x="640" y="112" class="subtitle" text-anchor="middle">어드바이스가 메타데이터를 해석하고 elector를 선택한 뒤, 메서드 본문 실행과 결과 기록을 처리합니다.</text>
  <rect class="header" x="28" y="152" width="164" height="54" rx="8"/><text x="110" y="180" class="participant" text-anchor="middle">호출자</text><text x="110" y="200" class="role" text-anchor="middle">요청자</text><line class="lifeline" x1="110" y1="206" x2="110" y2="770"/><rect class="activation" x="102" y="250" width="16" height="470" rx="5"/><rect class="header" x="283" y="152" width="164" height="54" rx="8"/><text x="365" y="180" class="participant" text-anchor="middle">Spring 프록시</text><text x="365" y="200" class="role" text-anchor="middle">런타임</text><line class="lifeline" x1="365" y1="206" x2="365" y2="770"/><rect class="activation" x="357" y="250" width="16" height="470" rx="5"/><rect class="header" x="538" y="152" width="164" height="54" rx="8"/><text x="620" y="180" class="participant" text-anchor="middle">리더 선출 애스펙트</text><text x="620" y="200" class="role" text-anchor="middle">LeaderElectionAspect</text><line class="lifeline" x1="620" y1="206" x2="620" y2="770"/><rect class="activation" x="612" y="250" width="16" height="470" rx="5"/><rect class="header" x="793" y="152" width="164" height="54" rx="8"/><text x="875" y="180" class="participant" text-anchor="middle">백엔드 선출기</text><text x="875" y="200" class="role" text-anchor="middle">런타임</text><line class="lifeline" x1="875" y1="206" x2="875" y2="770"/><rect class="activation" x="867" y="250" width="16" height="470" rx="5"/><rect class="header" x="1048" y="152" width="164" height="54" rx="8"/><text x="1130" y="180" class="participant" text-anchor="middle">메서드 본문</text><text x="1130" y="200" class="role" text-anchor="middle">작업</text><line class="lifeline" x1="1130" y1="206" x2="1130" y2="770"/><rect class="activation" x="1122" y="250" width="16" height="470" rx="5"/>
  <rect x="70" y="642" width="1140" height="94" rx="8" class="branch"/><line x1="70" y1="690" x2="1210" y2="690" class="divider"/><text x="90" y="664" class="labelText" >alt 백엔드 실패</text><text x="90" y="712" class="labelText" >FAIL_OPEN_RUN / SKIP / RETHROW</text>
  <g><rect class="label" x="155.5" y="240" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="173.5" cy="254" r="10.5" class="badgeCircle" stroke="#78909c" stroke-width="1.3"/><text x="173.5" y="258" text-anchor="middle" class="badgeText">1</text><text x="191.5" y="259" class="labelText">애너테이션 메서드 호출</text><path d="M 110 268 L 353 268" class="call"/></g><g><rect class="label" x="410.5" y="304" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="428.5" cy="318" r="10.5" class="badgeCircle" stroke="#78909c" stroke-width="1.3"/><text x="428.5" y="322" text-anchor="middle" class="badgeText">2</text><text x="446.5" y="323" class="labelText">Around 어드바이스 + SpEL</text><path d="M 365 332 L 608 332" class="call"/></g><g><rect class="label" x="665.5" y="368" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="683.5" cy="382" r="10.5" class="badgeCircle" stroke="#78909c" stroke-width="1.3"/><text x="683.5" y="386" text-anchor="middle" class="badgeText">3</text><text x="701.5" y="387" class="labelText">runIfLeaderResult(lockName)</text><path d="M 620 396 L 863 396" class="state"/></g><g><rect class="label" x="920.5" y="432" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="938.5" cy="446" r="10.5" class="badgeCircle" stroke="#78909c" stroke-width="1.3"/><text x="938.5" y="450" text-anchor="middle" class="badgeText">4</text><text x="956.5" y="451" class="labelText">선출: 메서드 본문 호출</text><path d="M 875 460 L 1118 460" class="state"/></g><g><rect class="label" x="920.5" y="496" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="938.5" cy="510" r="10.5" class="badgeCircle" stroke="#78909c" stroke-width="1.3"/><text x="938.5" y="514" text-anchor="middle" class="badgeText">5</text><text x="956.5" y="515" class="labelText">반환값 또는 본문 오류</text><path d="M 1130 524 L 887 524" class="return"/></g><g><rect class="label" x="665.5" y="560" width="164" height="28" rx="14" stroke="#78909c"/><circle cx="683.5" cy="574" r="10.5" class="badgeCircle" stroke="#78909c" stroke-width="1.3"/><text x="683.5" y="578" text-anchor="middle" class="badgeText">6</text><text x="701.5" y="579" class="labelText">Elected / Skipped / ActionFailed</text><path d="M 875 588 L 632 588" class="return"/></g>
  </svg>