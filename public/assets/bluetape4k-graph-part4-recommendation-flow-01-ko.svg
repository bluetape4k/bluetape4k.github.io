<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="780" viewBox="0 0 1700 780">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1700" height="780"/>
<rect class="frame" x="34" y="28" width="1632" height="724" rx="24"/>
<text class="title" x="850" y="82" text-anchor="middle">추천 후보 생성 흐름</text>
<text class="subtitle" x="850" y="118" text-anchor="middle">공동 구매자와 2단계 연결을 찾고 그래프 근거로 후보를 정렬한다</text>
<path class="edge" data-connector="user-to-purchased" d="M390 346 L401 346 Q412 346 412 328 L412 264 Q412 246 429 246 L445 246"/>
<path class="edge" data-connector="purchased-to-cobuyers" d="M765 246 L820 246"/>
<path class="edge" data-connector="cobuyers-to-products" d="M1140 246 L1195 246"/>
<path class="edge" data-connector="user-to-follows" d="M390 382 L407 382 Q424 382 424 400 L424 508 Q424 526 435 526 L445 526"/>
<path class="edge" data-connector="follows-to-people" d="M765 526 L820 526"/>
<g id="user">
  <rect x="90" y="305" width="300" height="118" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="240" y="361.5" text-anchor="middle">기준 사용자</text>
  <text class="nodeBody" x="240" y="395.5" text-anchor="middle">현재 추천을 조회하는 사용자</text>
</g>
<g id="purchased">
  <rect x="445" y="175" width="320" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="605" y="232.5" text-anchor="middle">구매 상품</text>
  <text class="nodeBody" x="605" y="266.5" text-anchor="middle">이미 구매한 상품</text>
  <text class="nodeBody" x="605" y="289.5" text-anchor="middle">후보에서 제외</text>
</g>
<g id="cobuyers">
  <rect x="820" y="175" width="320" height="142" rx="12" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="980" y="232.5" text-anchor="middle">공동 구매자</text>
  <text class="nodeBody" x="980" y="266.5" text-anchor="middle">기준 상품을 구매한</text>
  <text class="nodeBody" x="980" y="289.5" text-anchor="middle">다른 사용자</text>
</g>
<g id="products">
  <rect x="1195" y="175" width="320" height="142" rx="12" fill="#134E4A" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1355" y="232.5" text-anchor="middle">상품 후보</text>
  <text class="nodeBody" x="1355" y="266.5" text-anchor="middle">서로 다른 공동 구매자 수</text>
  <text class="nodeBody" x="1355" y="289.5" text-anchor="middle">점수 내림차순 정렬</text>
</g>
<g id="follows">
  <rect x="445" y="455" width="320" height="142" rx="12" fill="#4C1D95" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="605" y="512.5" text-anchor="middle">팔로우 그래프</text>
  <text class="nodeBody" x="605" y="546.5" text-anchor="middle">직접 팔로우</text>
  <text class="nodeBody" x="605" y="569.5" text-anchor="middle">2단계 후보</text>
</g>
<g id="people">
  <rect x="820" y="455" width="360" height="142" rx="12" fill="#7C2D12" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1000" y="512.5" text-anchor="middle">팔로우 후보</text>
  <text class="nodeBody" x="1000" y="546.5" text-anchor="middle">공통 팔로우 수</text>
  <text class="nodeBody" x="1000" y="569.5" text-anchor="middle">자기 자신·기존 팔로우 제외</text>
</g>
<rect x="88" y="684" width="1524" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="850" y="709" text-anchor="middle">서비스 코드는 탐색 순서를 읽고 테스트할 수 있도록 각 단계를 명시한다.</text>
<text class="footer" x="850" y="733" text-anchor="middle">큰 그래프에서는 N+1 탐색을 네이티브 Cypher나 Gremlin 질의로 대체한다.</text>
</svg>
