<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="2300" viewBox="0 0 1880 2300" role="img" aria-labelledby="title desc" data-locale="ko">
<title id="title">재시도와 replay가 있어도 예약은 한 번만 바꾼다</title><desc id="desc">HTTP 멱등성, inbox 중복 방지, quarantine 재처리를 하나의 상태 결정으로 연결합니다.</desc>
<defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#111c32"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091321"/><stop offset="1" stop-color="#101b2e"/></linearGradient>
    <marker id="sequence-blue-arrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60a5fa" data-solid-head="true"/>
    </marker><marker id="sequence-cyan-arrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2dd4bf" data-solid-head="true"/>
    </marker><marker id="sequence-amber-arrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#fbbf24" data-solid-head="true"/>
    </marker><marker id="sequence-purple-arrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a78bfa" data-solid-head="true"/>
    </marker><marker id="sequence-red-arrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#fb7185" data-solid-head="true"/>
    </marker>
    <style>
      .title{font-family:"goorm Sans", "Apple SD Gothic Neo", sans-serif;font-size:38px;font-weight:800;fill:#f4f8ff}
      .subtitle{font-family:"goorm Sans Code", "goorm Sans", monospace;font-size:17px;fill:#a9bad0}
      .badge{font-family:"goorm Sans Code", "goorm Sans", monospace;font-size:13px;font-weight:800;fill:#c9dcf3}
      .participant{font-family:"goorm Sans", "Apple SD Gothic Neo", sans-serif;font-size:19px;font-weight:800;fill:#f4f8ff}
      .role{font-family:"goorm Sans Code", "goorm Sans", monospace;font-size:13px;fill:#9fb3cb}
      .lifeline{stroke:#304964;stroke-width:2;stroke-dasharray:7 9}
      .activation{fill:#182c43;stroke:#50708e;stroke-width:1.5}
      .phase{fill:#0b192c;stroke:#263d59;stroke-width:1.5}
      .phase-label{font-family:"goorm Sans Code", "goorm Sans", monospace;font-size:13px;font-weight:800;fill:#7fc9ff}
      .call{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .outcome-call{stroke-linecap:butt;stroke-linejoin:miter}
      .call-label{font-family:"goorm Sans Code", "goorm Sans", monospace;font-size:13px;fill:#e7f0fb}
      .pill{fill:#0d1b2f;stroke-width:1.5}
      .pill-number{font-family:"goorm Sans Code", "goorm Sans", monospace;font-size:12px;font-weight:800;fill:#f8fbff}
      .decision{fill:#171b36;stroke:#a78bfa;stroke-width:2}
      .decision-title{font-family:"goorm Sans", "Apple SD Gothic Neo", sans-serif;font-size:23px;font-weight:800;fill:#e5d9ff}
      .decision-body{font-family:"goorm Sans Code", "goorm Sans", monospace;font-size:14px;fill:#d2c4f4}
      .outcome-code{font-family:"goorm Sans Code", "goorm Sans", monospace;font-size:17px;font-weight:800;fill:#f8fbff}
      .outcome-body{font-family:"goorm Sans", "Apple SD Gothic Neo", sans-serif;font-size:14px;fill:#b7c7da}
      .ui-eyebrow,.ui-label,.ui-mono,.ui-button{font-family:"goorm Sans Code", "goorm Sans", monospace}
      .ui-title,.ui-section,.ui-value,.ui-card-title{font-family:"goorm Sans", "Apple SD Gothic Neo", sans-serif;font-weight:800;fill:#f4f8ff}
      .ui-eyebrow{font-size:12px;font-weight:800;fill:#7fc9ff}
      .ui-title{font-size:34px}.ui-section{font-size:20px}.ui-card-title{font-size:21px}
      .ui-label,.ui-mono{font-size:13px;fill:#dce8f5}.ui-mono{font-size:12px}.ui-value{font-size:40px}
      .ui-button{font-size:13px;font-weight:800}.ui-muted{font-family:"goorm Sans Code", "goorm Sans", monospace;font-size:12px;fill:#91a8c3}
      .divider{stroke:#263d59;stroke-width:1}
    </style>
  </defs>
<rect width="1880" height="2300" fill="url(#canvas)"/><rect class="frame" x="24" y="24" width="1832" height="2252" rx="32" fill="none" stroke="#2d4665" stroke-width="2"/>
<text class="title" x="64" y="76" >재시도와 replay가 있어도 예약은 한 번만 바꾼다</text><text class="subtitle" x="66" y="108" >HTTP 멱등성, inbox 중복 방지, quarantine 재처리를 하나의 상태 결정으로 연결합니다.</text><rect x="72" y="126" width="350" height="36" rx="18" fill="#12243a" stroke="#3a5877"/><text class="badge" x="247" y="150" text-anchor="middle">SCOPE · tenant + clinic</text>
<rect x="452" y="126" width="350" height="36" rx="18" fill="#12243a" stroke="#3a5877"/><text class="badge" x="627" y="150" text-anchor="middle">IDENTITY · commandId + requestId</text>
<rect x="832" y="126" width="350" height="36" rx="18" fill="#12243a" stroke="#3a5877"/><text class="badge" x="1007" y="150" text-anchor="middle">DATA · 합성 시안</text><rect class="phase" x="42" y="328" width="1796" height="540" rx="24"/><rect x="1380" y="342" width="420" height="30" rx="15" fill="#102239" stroke="#38506d"/><text class="phase-label" x="1590" y="363" text-anchor="middle">첫 요청과 HTTP 재시도</text>
<rect class="phase" x="42" y="908" width="1796" height="520" rx="24"/><rect x="1380" y="922" width="420" height="30" rx="15" fill="#102239" stroke="#38506d"/><text class="phase-label" x="1590" y="943" text-anchor="middle">relay redelivery와 consumer 중복</text>
<rect class="phase" x="42" y="1468" width="1796" height="430" rx="24"/><rect x="1380" y="1482" width="420" height="30" rx="15" fill="#102239" stroke="#38506d"/><text class="phase-label" x="1590" y="1503" text-anchor="middle">quarantine replay와 최종 상태</text><g id="caller" data-node="true"><rect id="caller-card" x="25" y="190" width="290" height="104" rx="20" fill="#112139" stroke="#60a5fa" stroke-width="2"/><text class="participant" x="170" y="232" text-anchor="middle">호출자</text><text class="role" x="170" y="262" text-anchor="middle">client / retry</text></g>
<g id="api" data-node="true"><rect id="api-card" x="405" y="190" width="290" height="104" rx="20" fill="#112139" stroke="#2dd4bf" stroke-width="2"/><text class="participant" x="550" y="232" text-anchor="middle">예약 API</text><text class="role" x="550" y="262" text-anchor="middle">HTTP boundary</text></g>
<g id="transaction" data-node="true"><rect id="transaction-card" x="785" y="190" width="290" height="104" rx="20" fill="#112139" stroke="#a78bfa" stroke-width="2"/><text class="participant" x="930" y="232" text-anchor="middle">예약 트랜잭션</text><text class="role" x="930" y="262" text-anchor="middle">aggregate + outbox</text></g>
<g id="consumer" data-node="true"><rect id="consumer-card" x="1165" y="190" width="290" height="104" rx="20" fill="#112139" stroke="#fbbf24" stroke-width="2"/><text class="participant" x="1310" y="232" text-anchor="middle">소비 런타임</text><text class="role" x="1310" y="262" text-anchor="middle">inbox + handler</text></g>
<g id="replay" data-node="true"><rect id="replay-card" x="1545" y="190" width="290" height="104" rx="20" fill="#112139" stroke="#fb7185" stroke-width="2"/><text class="participant" x="1690" y="232" text-anchor="middle">STAFF replay</text><text class="role" x="1690" y="262" text-anchor="middle">approval + audit</text></g><path class="lifeline" d="M170 294 V1810"/>
<path class="lifeline" d="M550 294 V1810"/>
<path class="lifeline" d="M930 294 V1810"/>
<path class="lifeline" d="M1310 294 V1810"/>
<path class="lifeline" d="M1690 294 V1810"/><rect class="activation" x="920" y="390" width="20" height="1410" rx="8"/><rect class="activation" x="1300" y="950" width="20" height="470" rx="8"/><g class="sequence-message"><rect class="pill" x="210" y="370" width="300" height="42" rx="21" stroke="#60a5fa"/><circle cx="231" cy="391" r="14" fill="#60a5fa" fill-opacity=".18" stroke="#60a5fa"/><text class="pill-number num" x="231" y="395" text-anchor="middle">1</text><text class="call-label" x="255" y="396">commandId와 요청 본문 전송</text></g><g data-from="caller" data-to="api"><path class="call" d="M170 430 H550" stroke="#60a5fa" marker-end="url(#sequence-blue-arrow)" data-connector="message-1" data-source-node="caller" data-target-node="api"/></g>
<g class="sequence-message"><rect class="pill" x="534.25" y="510" width="411.5" height="42" rx="21" stroke="#2dd4bf"/><circle cx="555.25" cy="531" r="14" fill="#2dd4bf" fill-opacity=".18" stroke="#2dd4bf"/><text class="pill-number num" x="555.25" y="535" text-anchor="middle">2</text><text class="call-label" x="579.25" y="536">fingerprint 확인 · bounded wait</text></g><g data-from="api" data-to="transaction"><path class="call" d="M550 570 H930" stroke="#2dd4bf" marker-end="url(#sequence-cyan-arrow)" data-connector="message-2" data-source-node="api" data-target-node="transaction"/></g>
<g class="sequence-message"><rect class="pill" x="885.5" y="650" width="469" height="42" rx="21" stroke="#60a5fa"/><circle cx="906.5" cy="671" r="14" fill="#60a5fa" fill-opacity=".18" stroke="#60a5fa"/><text class="pill-number num" x="906.5" y="675" text-anchor="middle">3</text><text class="call-label" x="930.5" y="676">예약 변경 + outbox를 같은 transaction에 커밋</text></g><g data-from="transaction" data-to="consumer"><path class="call" d="M930 710 H1310" stroke="#60a5fa" marker-end="url(#sequence-blue-arrow)" data-connector="message-3" data-source-node="transaction" data-target-node="consumer"/></g>
<g class="sequence-message"><rect class="pill" x="517" y="790" width="446" height="42" rx="21" stroke="#fbbf24"/><circle cx="538" cy="811" r="14" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/><text class="pill-number num" x="538" y="815" text-anchor="middle">4</text><text class="call-label" x="562" y="816">같은 commandId 재시도 → 저장된 결과 replay</text></g><g data-from="api" data-to="transaction"><path class="call" d="M550 850 H930" stroke="#fbbf24" marker-end="url(#sequence-amber-arrow)" data-connector="message-4" data-source-node="api" data-target-node="transaction"/></g>
<g class="sequence-message"><rect class="pill" x="820" y="930" width="600" height="42" rx="21" stroke="#a78bfa"/><circle cx="841" cy="951" r="14" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa"/><text class="pill-number num" x="841" y="955" text-anchor="middle">5</text><text class="call-label" x="865" y="956">event redelivery · logicalConsumerId로 inbox 시작</text></g><g data-from="transaction" data-to="consumer"><path class="call" d="M930 990 H1310" stroke="#a78bfa" marker-end="url(#sequence-purple-arrow)" data-connector="message-5" data-source-node="transaction" data-target-node="consumer"/></g>
<g class="sequence-message"><rect class="pill" x="1236.75" y="1070" width="526.5" height="42" rx="21" stroke="#2dd4bf"/><circle cx="1257.75" cy="1091" r="14" fill="#2dd4bf" fill-opacity=".18" stroke="#2dd4bf"/><text class="pill-number num" x="1257.75" y="1095" text-anchor="middle">6</text><text class="call-label" x="1281.75" y="1096">이미 PROCESSED면 handler와 side effect를 건너뜀</text></g><g data-from="consumer" data-to="replay"><path class="call" d="M1310 1130 H1690" stroke="#2dd4bf" marker-end="url(#sequence-cyan-arrow)" data-connector="message-6" data-source-node="consumer" data-target-node="replay"/></g>
<g class="sequence-message"><rect class="pill" x="1242.5" y="1210" width="515" height="42" rx="21" stroke="#fb7185"/><circle cx="1263.5" cy="1231" r="14" fill="#fb7185" fill-opacity=".18" stroke="#fb7185"/><text class="pill-number num" x="1263.5" y="1235" text-anchor="middle">7</text><text class="call-label" x="1287.5" y="1236">실패 시 RETRYABLE → 시도 한도 초과면 QUARANTINED</text></g><g data-from="consumer" data-to="replay"><path class="call" d="M1310 1270 H1690" stroke="#fb7185" marker-end="url(#sequence-red-arrow)" data-connector="message-7" data-source-node="consumer" data-target-node="replay"/></g>
<g class="sequence-message"><rect class="pill" x="1202.25" y="1350" width="595.5" height="42" rx="21" stroke="#fbbf24"/><circle cx="1223.25" cy="1371" r="14" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/><text class="pill-number num" x="1223.25" y="1375" text-anchor="middle">8</text><text class="call-label" x="1247.25" y="1376">requestId · scope · provenance를 확인한 replay 승인</text></g><g data-from="replay" data-to="consumer"><path class="call" d="M1690 1410 H1730 Q1748 1410 1748 1428 V1442 Q1748 1458 1732 1458 H1268 Q1252 1458 1252 1442 V1428 Q1252 1410 1270 1410 H1310" stroke="#fbbf24" marker-end="url(#sequence-amber-arrow)" data-connector="message-8" data-source-node="replay" data-target-node="consumer"/></g>
<g class="sequence-message"><rect class="pill" x="1231" y="1490" width="538" height="42" rx="21" stroke="#a78bfa"/><circle cx="1252" cy="1511" r="14" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa"/><text class="pill-number num" x="1252" y="1515" text-anchor="middle">9</text><text class="call-label" x="1276" y="1516">같은 logical identity로 quarantine row를 재처리</text></g><g data-from="replay" data-to="consumer"><path class="call" d="M1690 1550 H1730 Q1748 1550 1748 1568 V1582 Q1748 1598 1732 1598 H1268 Q1252 1598 1252 1582 V1568 Q1252 1550 1270 1550 H1310" stroke="#a78bfa" marker-end="url(#sequence-purple-arrow)" data-connector="message-9" data-source-node="replay" data-target-node="consumer"/></g>
<g class="sequence-message"><rect class="pill" x="1200" y="1630" width="600" height="42" rx="21" stroke="#2dd4bf"/><circle cx="1221" cy="1651" r="14" fill="#2dd4bf" fill-opacity=".18" stroke="#2dd4bf"/><text class="pill-number num" x="1221" y="1655" text-anchor="middle">10</text><text class="call-label" x="1245" y="1656">PROCESSED · DUPLICATE · RETRYABLE · QUARANTINED 결정 기록</text></g><g data-from="consumer" data-to="replay"><path class="call" d="M1310 1690 H1690" stroke="#2dd4bf" marker-end="url(#sequence-cyan-arrow)" data-connector="message-10" data-source-node="consumer" data-target-node="replay"/></g>
<g id="final-decision" data-node="true"><rect id="final-decision-card" class="decision" x="560" y="1750" width="740" height="150" rx="24"/><text class="decision-title" x="930" y="1800" text-anchor="middle">최종 상태 결정</text><text class="decision-body" x="930" y="1835" text-anchor="middle"><tspan x="930" dy="0">한 요청·한 논리 소비자·한 replay 범위마다</tspan><tspan x="930" dy="23">상태와 다음 작업을 하나의 결과로 남긴다</tspan></text></g><path class="call outcome-call" d="M846 1910 V1930 H268 V2080" stroke="#2dd4bf" marker-end="url(#sequence-cyan-arrow)" data-connector="decision-outcome-0" data-source-node="final-decision" data-target-node="outcome-0" data-corner-style="orthogonal"/>
<path class="call outcome-call" d="M930 1910 V1946 H710 V2080" stroke="#60a5fa" marker-end="url(#sequence-blue-arrow)" data-connector="decision-outcome-1" data-source-node="final-decision" data-target-node="outcome-1" data-corner-style="orthogonal"/>
<path class="call outcome-call" d="M1014 1910 V1962 H1152 V2080" stroke="#fbbf24" marker-end="url(#sequence-amber-arrow)" data-connector="decision-outcome-2" data-source-node="final-decision" data-target-node="outcome-2" data-corner-style="orthogonal"/><g id="outcome-0" data-node="true"><rect id="outcome-0-card" x="68" y="2080" width="400" height="132" rx="20" fill="#101f34" stroke="#2dd4bf" stroke-width="2"/><text class="outcome-code" x="268" y="2123" text-anchor="middle">PROCESSED</text><text class="outcome-body" x="268" y="2157" text-anchor="middle">예약 변경과 side effect 완료</text><text class="role" x="268" y="2185" text-anchor="middle">조치 큐에서 확인</text></g>
<g id="outcome-1" data-node="true"><rect id="outcome-1-card" x="510" y="2080" width="400" height="132" rx="20" fill="#101f34" stroke="#60a5fa" stroke-width="2"/><text class="outcome-code" x="710" y="2123" text-anchor="middle">DUPLICATE</text><text class="outcome-body" x="710" y="2157" text-anchor="middle">기존 결과 재사용 · 재변경 없음</text><text class="role" x="710" y="2185" text-anchor="middle">조치 큐에서 확인</text></g>
<g id="outcome-2" data-node="true"><rect id="outcome-2-card" x="952" y="2080" width="400" height="132" rx="20" fill="#101f34" stroke="#fbbf24" stroke-width="2"/><text class="outcome-code" x="1152" y="2123" text-anchor="middle">RETRYABLE / QUARANTINED</text><text class="outcome-body" x="1152" y="2157" text-anchor="middle">다음 시도 또는 STAFF 검토</text><text class="role" x="1152" y="2185" text-anchor="middle">조치 큐에서 확인</text></g>
<text class="role" x="64" y="2240" >실선은 실제 기록·호출 경로입니다. 각 결과 분기는 종료 상태 결정에서 독립적으로 뻗습니다.</text>
</svg>
