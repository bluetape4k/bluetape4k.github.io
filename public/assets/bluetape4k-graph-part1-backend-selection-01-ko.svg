<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="840" viewBox="0 0 2280 840">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="2280" height="840"/>
<rect class="frame" x="34" y="28" width="2212" height="784" rx="24"/>
<text class="title" x="1140" y="82" text-anchor="middle">그래프 저장소 선택 지도</text>
<text class="subtitle" x="1140" y="118" text-anchor="middle">작업 부하의 특성, 연산 적합성, 테스트 전략에 따라 그래프 저장소를 선택한다</text>
<path class="bus" d="M1140 307 V365"/>
<path class="bus" d="M275 365 H1915"/>
<path class="edge" d="M275 365 V457"/>
<path class="edge" d="M685 365 V457"/>
<path class="edge" d="M1095 365 V457"/>
<path class="edge" d="M1505 365 V457"/>
<path class="edge" d="M1915 365 V457"/>
<g id="app">
  <rect x="910" y="165" width="460" height="142" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1140" y="222.5" text-anchor="middle">애플리케이션 그래프 작업 부하</text>
  <text class="nodeBody" x="1140" y="256.5" text-anchor="middle">경로, 이웃, 순위 계산</text>
  <text class="nodeBody" x="1140" y="279.5" text-anchor="middle">일괄 쓰기 또는 테스트 데이터</text>
</g>
<g id="neo4j">
  <rect x="110" y="465" width="330" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="275" y="511.5" text-anchor="middle">Neo4j</text>
  <text class="nodeBody" x="275" y="545.5" text-anchor="middle">운영 환경의 기본 후보</text>
  <text class="nodeBody" x="275" y="568.5" text-anchor="middle">성숙한 운영 기능</text>
  <text class="nodeBody" x="275" y="591.5" text-anchor="middle">Cypher 드라이버</text>
</g>
<g id="memgraph">
  <rect x="520" y="465" width="330" height="142" rx="12" fill="#134E4A" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="685" y="511.5" text-anchor="middle">Memgraph</text>
  <text class="nodeBody" x="685" y="545.5" text-anchor="middle">짧은 지연 시간의 로컬 그래프</text>
  <text class="nodeBody" x="685" y="568.5" text-anchor="middle">쓰기 중심 작업 후보</text>
  <text class="nodeBody" x="685" y="591.5" text-anchor="middle">Neo4j 프로토콜</text>
</g>
<g id="age">
  <rect x="930" y="465" width="330" height="142" rx="12" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1095" y="511.5" text-anchor="middle">Apache AGE</text>
  <text class="nodeBody" x="1095" y="545.5" text-anchor="middle">PostgreSQL 중심 팀</text>
  <text class="nodeBody" x="1095" y="568.5" text-anchor="middle">SQL 위에서 Cypher 사용</text>
  <text class="nodeBody" x="1095" y="591.5" text-anchor="middle">속도보다 통합 우선</text>
</g>
<g id="tinker">
  <rect x="1340" y="465" width="330" height="142" rx="12" fill="#4C1D95" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1505" y="511.5" text-anchor="middle">TinkerGraph</text>
  <text class="nodeBody" x="1505" y="545.5" text-anchor="middle">단위 테스트와 예제</text>
  <text class="nodeBody" x="1505" y="568.5" text-anchor="middle">메모리 내 테스트 데이터</text>
  <text class="nodeBody" x="1505" y="591.5" text-anchor="middle">Docker 불필요</text>
</g>
<g id="falkor">
  <rect x="1750" y="465" width="330" height="142" rx="12" fill="#7C2D12" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1915" y="511.5" text-anchor="middle">FalkorDB</text>
  <text class="nodeBody" x="1915" y="545.5" text-anchor="middle">Redis 계열 그래프 서비스</text>
  <text class="nodeBody" x="1915" y="568.5" text-anchor="middle">단순한 읽기 중심 작업</text>
  <text class="nodeBody" x="1915" y="591.5" text-anchor="middle">쓰기 비용 검증 필요</text>
</g>
<rect x="88" y="744" width="2104" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="1140" y="769" text-anchor="middle">bluetape4k-graph는 하나의 Kotlin API를 유지하면서 그래프 저장소별 장단점을 보존한다.</text>
<text class="footer" x="1140" y="793" text-anchor="middle">테스트는 TinkerGraph로 시작하고 운영 후보는 실제 작업 부하로 측정한다.</text>
</svg>
