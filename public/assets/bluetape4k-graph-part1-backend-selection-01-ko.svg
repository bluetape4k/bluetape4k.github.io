<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="840" viewBox="0 0 2280 840">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 14 7 L 0 14 Z" fill="#496A8F" stroke="#496A8F"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:42px;fill:#22344A;font-weight:400}
    .subtitle,.footer,.axis{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:17px;fill:#536476;font-weight:400}
    .nodeTitle,.participant{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#22344A;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:16px;fill:#3F5269;font-weight:400}
    .tableTitle{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#22344A;font-weight:400}
    .tableField,.edgeLabel{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:15px;fill:#3F5269;font-weight:400}
    .edge{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#91A6BD;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="2280" height="840"/>
<rect class="frame" x="34" y="28" width="2212" height="784" rx="24"/>
<text class="title" x="1140" y="82" text-anchor="middle">그래프 저장소 선택 지도</text>
<text class="subtitle" x="1140" y="118" text-anchor="middle">workload 모양, operation 적합성, 테스트 전략으로 graph storage를 고른다</text>
<path class="bus" d="M1140 307 V365"/>
<path class="bus" d="M275 365 H1915"/>
<path class="edge" d="M275 365 V457"/>
<path class="edge" d="M685 365 V457"/>
<path class="edge" d="M1095 365 V457"/>
<path class="edge" d="M1505 365 V457"/>
<path class="edge" d="M1915 365 V457"/>
<g id="app">
  <rect x="910" y="165" width="460" height="142" rx="12" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="1140" y="222.5" text-anchor="middle">애플리케이션 Graph Workload</text>
  <text class="nodeBody" x="1140" y="256.5" text-anchor="middle">path, neighbor, ranking</text>
  <text class="nodeBody" x="1140" y="279.5" text-anchor="middle">bulk write 또는 test fixture</text>
</g>
<g id="neo4j">
  <rect x="110" y="465" width="330" height="142" rx="12" fill="#EAF8EF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="275" y="511.5" text-anchor="middle">Neo4j</text>
  <text class="nodeBody" x="275" y="545.5" text-anchor="middle">운영 기본 후보</text>
  <text class="nodeBody" x="275" y="568.5" text-anchor="middle">성숙한 운영 기능</text>
  <text class="nodeBody" x="275" y="591.5" text-anchor="middle">Cypher driver</text>
</g>
<g id="memgraph">
  <rect x="520" y="465" width="330" height="142" rx="12" fill="#E9F7F5" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="685" y="511.5" text-anchor="middle">Memgraph</text>
  <text class="nodeBody" x="685" y="545.5" text-anchor="middle">낮은 latency 로컬 graph</text>
  <text class="nodeBody" x="685" y="568.5" text-anchor="middle">write-heavy 후보</text>
  <text class="nodeBody" x="685" y="591.5" text-anchor="middle">Neo4j protocol</text>
</g>
<g id="age">
  <rect x="930" y="465" width="330" height="142" rx="12" fill="#FFF4D9" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="1095" y="511.5" text-anchor="middle">Apache AGE</text>
  <text class="nodeBody" x="1095" y="545.5" text-anchor="middle">PostgreSQL 중심 팀</text>
  <text class="nodeBody" x="1095" y="568.5" text-anchor="middle">SQL 위의 Cypher</text>
  <text class="nodeBody" x="1095" y="591.5" text-anchor="middle">속도보다 통합 우선</text>
</g>
<g id="tinker">
  <rect x="1340" y="465" width="330" height="142" rx="12" fill="#F3ECFF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="1505" y="511.5" text-anchor="middle">TinkerGraph</text>
  <text class="nodeBody" x="1505" y="545.5" text-anchor="middle">unit test와 예제</text>
  <text class="nodeBody" x="1505" y="568.5" text-anchor="middle">in-memory fixture</text>
  <text class="nodeBody" x="1505" y="591.5" text-anchor="middle">Docker 불필요</text>
</g>
<g id="falkor">
  <rect x="1750" y="465" width="330" height="142" rx="12" fill="#FFF0E8" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="1915" y="511.5" text-anchor="middle">FalkorDB</text>
  <text class="nodeBody" x="1915" y="545.5" text-anchor="middle">Redis 계열 graph service</text>
  <text class="nodeBody" x="1915" y="568.5" text-anchor="middle">단순 read-mostly workload</text>
  <text class="nodeBody" x="1915" y="591.5" text-anchor="middle">쓰기 비용 검증 필요</text>
</g>
<rect x="88" y="744" width="2104" height="62" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="1140" y="769" text-anchor="middle">bluetape4k-graph는 하나의 Kotlin API를 유지하면서 graph storage tradeoff를 보존한다.</text>
<text class="footer" x="1140" y="793" text-anchor="middle">테스트는 TinkerGraph로 시작하고 운영 후보는 Neo4j, Memgraph, AGE, FalkorDB로 측정한다.</text>
</svg>
