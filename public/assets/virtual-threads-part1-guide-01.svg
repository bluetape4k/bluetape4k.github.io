<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Threads guide flow</title>
  <desc id="desc">A Graphviz-derived flow showing request tasks, virtual-thread execution, blocking I/O, resource limits, diagnostics, and cleanup.</desc>
  <defs>
    <marker id="arrow-vt1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5c7d70"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f7faf8"/>
  <rect x="66" y="66" width="1068" height="498" rx="24" fill="#ffffff" stroke="#c8d7cf" stroke-width="2"/>
  <text x="100" y="126" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="42" fill="#17342b">Virtual Threads Overview</text>
  <text x="102" y="166" font-family="Comic Mono, monospace" font-size="23" fill="#426056">cheap threads, not magic threads</text>

  <g font-family="Comic Mono, monospace" font-size="18" fill="#17342b">
    <rect x="100" y="240" width="166" height="104" rx="16" fill="#e3f2ec" stroke="#b9d8c8"/>
    <text x="183" y="280" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="24">Request task</text>
    <text x="183" y="315" text-anchor="middle">one job</text>

    <rect x="324" y="240" width="190" height="104" rx="16" fill="#eaf4ff" stroke="#b9cde0"/>
    <text x="419" y="274" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Virtual-thread</text>
    <text x="419" y="307" text-anchor="middle">per task executor</text>

    <rect x="572" y="240" width="184" height="104" rx="16" fill="#fff1df" stroke="#dfc6a6"/>
    <text x="664" y="274" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Blocking I/O</text>
    <text x="664" y="307" text-anchor="middle">JDBC / HTTP calls</text>

    <rect x="814" y="240" width="206" height="104" rx="16" fill="#f4f0ff" stroke="#c9bee6"/>
    <text x="917" y="274" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Resource limits</text>
    <text x="917" y="307" text-anchor="middle">pool / semaphore</text>
    <text x="917" y="330" text-anchor="middle">timeout</text>

    <rect x="688" y="420" width="184" height="94" rx="16" fill="#e6f4ff" stroke="#b6d3e8"/>
    <text x="780" y="456" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Diagnostics</text>
    <text x="780" y="488" text-anchor="middle">JFR / metrics</text>

    <rect x="934" y="420" width="170" height="94" rx="16" fill="#fff6dc" stroke="#dbc990"/>
    <text x="1019" y="456" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Lifecycle</text>
    <text x="1019" y="488" text-anchor="middle">interrupt / cleanup</text>
  </g>

  <g fill="none" stroke="#5c7d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-vt1)">
    <path d="M266 292 H324"/>
    <path d="M514 292 H572"/>
    <path d="M756 292 H814"/>
    <path d="M917 344 V384 H780 V420"/>
    <path d="M1020 292 H1060 V420"/>
  </g>

  <g font-family="Comic Mono, monospace" font-size="16" fill="#25493d">
    <rect x="100" y="420" width="504" height="94" rx="16" fill="#f8fbfa" stroke="#d6e2dc"/>
    <text x="126" y="454" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="24">Production rule</text>
    <text x="126" y="486">Do not pool virtual threads. Limit downstream resources.</text>
  </g>
</svg>
