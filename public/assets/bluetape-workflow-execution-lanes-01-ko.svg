<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" role="img" aria-labelledby="title desc">
  <title id="title">일곱 작업 유형의 실행 경로</title>
  <desc id="desc">일곱 작업 유형이 서로 다른 증거, 검토, 복구, 종료 조건을 따르는 비교 구조도입니다.</desc>
  <style>
    .title { font-family: 'goorm Sans', 'Apple SD Gothic Neo', cursive; fill: #f1f5f9; font-size: 36px; }
    .subtitle, .lane-label, .step, .legend { font-family: 'goorm Sans Code', 'SFMono-Regular', Consolas, monospace; }
    .subtitle { fill: #c2cede; font-size: 15px; }
    .lane-label { fill: #f1f5f9; font-size: 17px; font-weight: 700; }
    .step { fill: #e2e8f0; font-size: 13px; }
    .legend { fill: #c2cede; font-size: 12px; }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#94a3b8" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 11 6 L 0 11 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 11 6 L 0 11 Z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="1600" height="1040" fill="#0b1220"/>
  <rect x="24" y="24" width="1552" height="992" rx="28" fill="#111c2e" stroke="#33475f" stroke-width="2"/>
  <text x="58" y="78" class="title">일곱 작업 유형과 일곱 증거 경로</text>
  <text x="60" y="110" class="subtitle">작업 경로 분류기가 실행 경로를 고르고, 각 경로는 고유한 순서와 증거 및 종료 조건을 가집니다.</text>

  <!-- lane backgrounds -->
  <g>
    <rect x="48" y="142" width="1504" height="106" rx="18" fill="#14243a" stroke="#19304a"/>
    <rect x="48" y="260" width="1504" height="106" rx="18" fill="#162b22" stroke="#183126"/>
    <rect x="48" y="378" width="1504" height="106" rx="18" fill="#30231c" stroke="#352719"/>
    <rect x="48" y="496" width="1504" height="106" rx="18" fill="#172236" stroke="#263445"/>
    <rect x="48" y="614" width="1504" height="106" rx="18" fill="#142c29" stroke="#17312d"/>
    <rect x="48" y="732" width="1504" height="106" rx="18" fill="#321d25" stroke="#3a2027"/>
    <rect x="48" y="850" width="1504" height="106" rx="18" fill="#292039" stroke="#30264a"/>
  </g>

  <!-- lane labels -->
  <text x="78" y="184" class="lane-label">A / Full Feature</text>
  <text x="78" y="210" class="legend">구현 전 설계</text>
  <text x="78" y="302" class="lane-label">B / Fast Track</text>
  <text x="78" y="328" class="legend">제한된 기능 추가</text>
  <text x="78" y="420" class="lane-label">C / Bug Fix</text>
  <text x="78" y="446" class="legend">수정 전 재현</text>
  <text x="78" y="538" class="lane-label">D / 코드 검토</text>
  <text x="78" y="564" class="legend">읽기 전용 검토</text>
  <text x="78" y="656" class="lane-label">E / Maintenance</text>
  <text x="78" y="682" class="legend">소유권 보존</text>
  <text x="78" y="774" class="lane-label">P / 배포</text>
