<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-label="runIfLeader — Elected vs Skipped sequence diagram">

<defs>
  <marker id="arr-g" markerWidth="3.9" markerHeight="3.9" refX="3" refY="1.95" orient="auto">
    <path d="M 0.3 0.3 L 3.3 1.95 L 0.3 3.6 Z" fill="#3a7a52"/>
  </marker>
  <marker id="arr-a" markerWidth="3.9" markerHeight="3.9" refX="3" refY="1.95" orient="auto">
    <path d="M 0.3 0.3 L 3.3 1.95 L 0.3 3.6 Z" fill="#9a6a20"/>
  </marker>
  <marker id="arr-gd" markerWidth="3.9" markerHeight="3.9" refX="3" refY="1.95" orient="auto">
    <path d="M 0.3 0.3 L 3.3 1.95 L 0.3 3.6 Z" fill="#3a7a52"/>
  </marker>
  <marker id="arr-ad" markerWidth="3.9" markerHeight="3.9" refX="3" refY="1.95" orient="auto">
    <path d="M 0.3 0.3 L 3.3 1.95 L 0.3 3.6 Z" fill="#9a6a20"/>
  </marker>
  <style>
    .bg       { fill: #FAFAFA; }
    .frame    { fill: #ffffff; stroke: #c4d0de; stroke-width: 1.5; }
    .panG     { fill: #EEF9F2; stroke: #aacfb8; stroke-width: 1.2; }
    .panA     { fill: #FFFBEE; stroke: #dcc870; stroke-width: 1.2; }
    .divline  { stroke: #c4d0de; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .ttl      { font-family: 'Architects Daughter', cursive; font-size: 16px; fill: #1a2836; }
    .plblG    { font-family: 'Architects Daughter', cursive; font-size: 11.5px; fill: #1f6840; }
    .plblA    { font-family: 'Architects Daughter', cursive; font-size: 11.5px; fill: #7a5208; }
    .pname    { font-family: 'Architects Daughter', cursive; font-size: 10.5px; fill: #1a2836; }
    .stepG    { fill: #dff2e5; stroke: #68a878; stroke-width: 1.1; }
    .stepA    { fill: #fef5cc; stroke: #c8a030; stroke-width: 1.1; }
    .msgG     { font-family: 'Comic Mono', monospace; font-size: 9px; fill: #1a3a28; }
    .msgA     { font-family: 'Comic Mono', monospace; font-size: 9px; fill: #4a3208; }
    .note     { font-family: 'Comic Mono', monospace; font-size: 8px; fill: #536273; font-style: italic; }
    .lnG      { stroke: #3a7a52; stroke-width: 1.4; fill: none; marker-end: url(#arr-g); }
    .lnA      { stroke: #9a6a20; stroke-width: 1.4; fill: none; marker-end: url(#arr-a); }
    .rlnG     { stroke: #3a7a52; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#arr-gd); }
    .rlnA     { stroke: #9a6a20; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; marker-end: url(#arr-ad); }
    .llG      { stroke: #80ba90; stroke-width: 1.3; stroke-dasharray: 6 5; }
    .llA      { stroke: #c8a040; stroke-width: 1.3; stroke-dasharray: 6 5; }
    .phG      { fill: #C8EDD4; stroke: #58a870; stroke-width: 1.5; }
    .phA      { fill: #FDEAA8; stroke: #c8a030; stroke-width: 1.5; }
    .bdgG     { fill: #bae8c8; stroke: #48a060; stroke-width: 1; }
    .bdgA     { fill: #fde8a0; stroke: #c09020; stroke-width: 1; }
    .bdgTG    { font-family: 'Architects Daughter', cursive; font-size: 8.5px; fill: #145a28; }
    .bdgTA    { font-family: 'Architects Daughter', cursive; font-size: 8.5px; fill: #6a4008; }
    .noexec   { fill: #fff5c0; stroke: #c8a030; stroke-width: 1; stroke-dasharray: 4 3; }
    .stepnum  { font-family: 'Comic Mono', monospace; font-size: 7.5px; font-weight: 700; }
    .snumG    { fill: #1a5a32; }
    .snumA    { fill: #6a4008; }
  </style>
</defs>

<!-- Canvas -->
<rect class="bg" width="820" height="500"/>
<rect class="frame" x="14" y="14" width="792" height="472" rx="14"/>

<!-- Title -->
<text class="ttl" x="410" y="44" text-anchor="middle">runIfLeader — Elected vs Skipped</text>

<!-- ===== LEFT PANEL: Elected ===== -->
<!--
  Left panel x: 24..404 (width 380)
  Participants (centers):
    Caller:        x=80
    LeaderElector: x=205
    BackendLock:   x=340
  Participant box: width=78, centered on x above
-->
<rect class="panG" x="24" y="54" width="380" height="428" rx="10"/>
<text class="plblG" x="214" y="73" text-anchor="middle">Elected (Leader Acquired)</text>

<!-- LEFT participants -->
<!-- Caller -->
<rect class="phG" x="41" y="82" width="78" height="30" rx="8"/>
<text class="pname" x="80" y="97" text-anchor="middle" dominant-baseline="middle">Caller</text>
<!-- LeaderElector -->
<rect class="phG" x="166" y="82" width="78" height="30" rx="8"/>
<text class="pname" x="205" y="97" text-anchor="middle" dominant-baseline="middle">LeaderElector</text>
<!-- Backend Lock -->
<rect class="phG" x="301" y="82" width="78" height="30" rx="8"/>
<text class="pname" x="340" y="97" text-anchor="middle" dominant-baseline="middle">Backend Lock</text>

<!-- LEFT lifelines (start below participant boxes at y=112) -->
<line class="llG" x1="80" y1="112" x2="80" y2="462"/>
<line class="llG" x1="205" y1="112" x2="205" y2="462"/>
<line class="llG" x1="340" y1="112" x2="340" y2="462"/>

<!-- Step 1: runIfLeader("job") { action }  Caller → LeaderElector -->
<!-- Arrow: 80→205. Step label floats above arrow -->
<rect class="stepG" x="86" y="124" width="112" height="20" rx="4"/>
<text class="stepnum snumG" x="91" y="134" dominant-baseline="middle">1</text>
<text class="msgG" x="103" y="134" dominant-baseline="middle">runIfLeader("job")</text>
<line class="lnG" x1="80" y1="144" x2="202" y2="144"/>

<!-- Step 2: tryAcquire(lockName, waitTime)  LeaderElector → Backend -->
<rect class="stepG" x="211" y="155" width="118" height="20" rx="4"/>
<text class="stepnum snumG" x="216" y="165" dominant-baseline="middle">2</text>
<text class="msgG" x="228" y="165" dominant-baseline="middle">tryAcquire(lock,wait)</text>
<line class="lnG" x1="205" y1="175" x2="337" y2="175"/>

<!-- Step 3: lock acquired ✓  Backend → LeaderElector (return) -->
<rect class="stepG" x="211" y="186" width="108" height="20" rx="4"/>
<text class="stepnum snumG" x="216" y="196" dominant-baseline="middle">3</text>
<text class="msgG" x="228" y="196" dominant-baseline="middle">lock acquired ✓</text>
<line class="rlnG" x1="340" y1="206" x2="208" y2="206"/>

<!-- Step 4: action() executes -->
<rect class="stepG" x="166" y="218" width="108" height="32" rx="4"/>
<text class="stepnum snumG" x="171" y="228" dominant-baseline="middle">4</text>
<text class="msgG" x="183" y="226" dominant-baseline="middle">action()</text>
<text class="note" x="172" y="240" dominant-baseline="middle">↳ task body executes</text>

<!-- Step 5: releaseLock()  LeaderElector → Backend -->
<rect class="stepG" x="211" y="262" width="114" height="20" rx="4"/>
<text class="stepnum snumG" x="216" y="272" dominant-baseline="middle">5</text>
<text class="msgG" x="228" y="272" dominant-baseline="middle">releaseLock()</text>
<line class="lnG" x1="205" y1="282" x2="337" y2="282"/>

<!-- Step 6: return result  LeaderElector → Caller -->
<rect class="stepG" x="86" y="294" width="108" height="20" rx="4"/>
<text class="stepnum snumG" x="91" y="304" dominant-baseline="middle">6</text>
<text class="msgG" x="103" y="304" dominant-baseline="middle">return result</text>
<line class="rlnG" x1="205" y1="314" x2="83" y2="314"/>

<!-- Success badge -->
<rect class="bdgG" x="68" y="340" width="224" height="22" rx="10"/>
<text class="bdgTG" x="180" y="351" text-anchor="middle" dominant-baseline="middle">action executed — result returned to caller</text>

<!-- ===== RIGHT PANEL: Skipped ===== -->
<!--
  Right panel x: 412..792 (width 380)
  Participants (centers):
    Caller:        x=466
    LeaderElector: x=591
    BackendLock:   x=726
-->
<rect class="panA" x="412" y="54" width="380" height="428" rx="10"/>
<text class="plblA" x="602" y="73" text-anchor="middle">Skipped (Not Elected)</text>

<!-- RIGHT participants -->
<!-- Caller -->
<rect class="phA" x="427" y="82" width="78" height="30" rx="8"/>
<text class="pname" x="466" y="97" text-anchor="middle" dominant-baseline="middle">Caller</text>
<!-- LeaderElector -->
<rect class="phA" x="552" y="82" width="78" height="30" rx="8"/>
<text class="pname" x="591" y="97" text-anchor="middle" dominant-baseline="middle">LeaderElector</text>
<!-- Backend Lock -->
<rect class="phA" x="687" y="82" width="78" height="30" rx="8"/>
<text class="pname" x="726" y="97" text-anchor="middle" dominant-baseline="middle">Backend Lock</text>

<!-- RIGHT lifelines -->
<line class="llA" x1="466" y1="112" x2="466" y2="462"/>
<line class="llA" x1="591" y1="112" x2="591" y2="462"/>
<line class="llA" x1="726" y1="112" x2="726" y2="462"/>

<!-- Step 1: runIfLeader("job") { action }  Caller → LeaderElector -->
<rect class="stepA" x="472" y="124" width="112" height="20" rx="4"/>
<text class="stepnum snumA" x="477" y="134" dominant-baseline="middle">1</text>
<text class="msgA" x="489" y="134" dominant-baseline="middle">runIfLeader("job")</text>
<line class="lnA" x1="466" y1="144" x2="588" y2="144"/>

<!-- Step 2: tryAcquire(lockName, waitTime)  LeaderElector → Backend -->
<rect class="stepA" x="597" y="155" width="118" height="20" rx="4"/>
<text class="stepnum snumA" x="602" y="165" dominant-baseline="middle">2</text>
<text class="msgA" x="614" y="165" dominant-baseline="middle">tryAcquire(lock,wait)</text>
<line class="lnA" x1="591" y1="175" x2="723" y2="175"/>

<!-- Step 3: lock held by another node  Backend → LeaderElector (return, label above arrow) -->
<rect class="stepA" x="555" y="184" width="160" height="24" rx="4"/>
<text class="stepnum snumA" x="560" y="196" dominant-baseline="middle">3</text>
<text class="msgA" x="572" y="190" dominant-baseline="middle">lock held by another</text>
<text class="msgA" x="572" y="202" dominant-baseline="middle">node</text>
<line class="rlnA" x1="726" y1="212" x2="594" y2="212"/>

<!-- Step 4: return null  LeaderElector → Caller -->
<rect class="stepA" x="472" y="230" width="112" height="20" rx="4"/>
<text class="stepnum snumA" x="477" y="240" dominant-baseline="middle">4</text>
<text class="msgA" x="489" y="240" dominant-baseline="middle">return null</text>
<line class="rlnA" x1="591" y1="250" x2="469" y2="250"/>

<!-- Note: no action executed -->
<rect class="noexec" x="440" y="272" width="296" height="26" rx="6"/>
<text class="note" x="588" y="285" text-anchor="middle" dominant-baseline="middle">no action executed — job skipped on this node</text>

<!-- Skip badge -->
<rect class="bdgA" x="468" y="340" width="248" height="22" rx="10"/>
<text class="bdgTA" x="592" y="351" text-anchor="middle" dominant-baseline="middle">null returned, no side effects on this node</text>

<!-- Center divider -->
<line class="divline" x1="408" y1="56" x2="408" y2="480"/>

</svg>
