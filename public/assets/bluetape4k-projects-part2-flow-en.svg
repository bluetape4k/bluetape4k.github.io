<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="760" viewBox="0 0 1540 760" role="img">
<title>Core, Coroutines, Logging, Tests</title>
<desc>Request code and proof code reuse the same small service foundation.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1D3148" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#4D6F9F"/></marker>
  <style>
    .bg{fill:#F7F9FC}.frame{fill:#fff;stroke:#D6E2ED;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#21334A;font-weight:700}
    .subtitle,.body,.small{font-family:"Comic Mono","Courier New",monospace;fill:#34465B}
    .subtitle{font-size:17px}.body{font-size:14px}.small{font-size:12px;fill:#657386}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;fill:#21334A;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke:#4D6F9F;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bar-label{font-family:"Comic Mono","Courier New",monospace;font-size:15px;fill:#26384F}.axis{stroke:#B8C7D9;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1540" height="760"/>
<rect class="frame" x="34" y="28" width="1472" height="704" rx="24"/>
<text class="title" x="70" y="82">Core, Coroutines, Logging, Tests</text>
<text class="subtitle" x="72" y="114">Request code and proof code reuse the same small service foundation.</text>
<g data-card="Service Code">
  <rect class="card" x="60" y="315" width="220" height="116" rx="14" fill="#E8F1FF" stroke="#5A85D6"/>
  <text class="label" x="170" y="349" text-anchor="middle"><tspan x="170" dy="0">Service Code</tspan></text>
  <text class="body" x="170" y="383" text-anchor="middle"><tspan x="170" dy="0">input · request</tspan><tspan x="170" dy="20">worker</tspan></text>
</g>
<g data-card="Core Validation">
  <rect class="card" x="340" y="315" width="250" height="116" rx="14" fill="#EAF7ED" stroke="#58A978"/>
  <text class="label" x="465" y="349" text-anchor="middle"><tspan x="465" dy="0">Core Validation</tspan></text>
  <text class="body" x="465" y="383" text-anchor="middle"><tspan x="465" dy="0">require* helpers</tspan><tspan x="465" dy="20">non-null invariants</tspan></text>
</g>
<g data-card="Coroutines">
  <rect class="card" x="650" y="315" width="250" height="116" rx="14" fill="#E7F7F5" stroke="#3CA7A0"/>
  <text class="label" x="775" y="349" text-anchor="middle"><tspan x="775" dy="0">Coroutines</tspan></text>
  <text class="body" x="775" y="383" text-anchor="middle"><tspan x="775" dy="0">Deferred · Flow</tspan><tspan x="775" dy="20">cancellation policy</tspan></text>
</g>
<g data-card="Logging">
  <rect class="card" x="960" y="315" width="250" height="116" rx="14" fill="#FFF3D8" stroke="#D6A441"/>
  <text class="label" x="1085" y="349" text-anchor="middle"><tspan x="1085" dy="0">Logging</tspan></text>
  <text class="body" x="1085" y="383" text-anchor="middle"><tspan x="1085" dy="0">lazy messages</tspan><tspan x="1085" dy="20">MDC across suspension</tspan></text>
</g>
<g data-card="Tests">
  <rect class="card" x="1270" y="315" width="250" height="116" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="1395" y="349" text-anchor="middle"><tspan x="1395" dy="0">Tests</tspan></text>
  <text class="body" x="1395" y="383" text-anchor="middle"><tspan x="1395" dy="0">assertions · junit5</tspan><tspan x="1395" dy="20">Testcontainers fixtures</tspan></text>
</g>
<path class="connector" data-connector="service-to-core-validation" d="M280 373 H340"/>
<path class="connector" data-connector="core-validation-to-coroutines" d="M590 373 H650"/>
<path class="connector" data-connector="coroutines-to-logging" d="M900 373 H960"/>
<path class="connector" data-connector="logging-to-tests" d="M1210 373 H1270"/>
</svg>