<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1200" viewBox="0 0 2200 1200" role="img" aria-labelledby="service-en-title service-en-desc">
  <title id="service-en-title">Service responsibility boundaries around a product BOM and a visit</title>
  <desc id="service-en-desc">Product management, commerce, appointment, clinical, CRM, notification, and statistics services own different facts and hand off or consume them at the appointment boundary.</desc>
  <defs>
    <linearGradient id="service-en-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.56" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <linearGradient id="service-en-source" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#162b45"/><stop offset="1" stop-color="#202049"/></linearGradient>
    <linearGradient id="service-en-reservation" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b4a"/><stop offset="1" stop-color="#192b4d"/></linearGradient>
    <linearGradient id="service-en-policy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2816"/><stop offset="1" stop-color="#282034"/></linearGradient>
    <filter id="service-en-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.58"/></filter>
    <marker id="service-en-primary-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#67e8f9" data-arrowhead="true" data-solid-head="true" data-role="primary" data-size="14x14"/></marker>
    <marker id="service-en-secondary-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="secondary" data-size="10x10" data-visible-size="20x20" data-tip-direction="positive-x"><path d="M -10 -5 L 10 5 L -10 15 Z" fill="#fbbf24" data-arrowhead="true" data-solid-head="true" data-role="secondary" data-size="10x10" data-visible-size="20x20"/></marker>
    <style>
      .title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:37px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:16px;fill:#aebed2}.frame-title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:23px;font-weight:700;fill:#f8fafc}.card-title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:20px;font-weight:700;fill:#f8fafc}.body{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:14px;fill:#d7e3f3}.small{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:12px;fill:#aebed2}.code{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:12px;font-weight:700;fill:#f8fafc}.pill{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:11px;font-weight:700;fill:#f8fafc}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round}.primary-line{stroke:#67e8f9;stroke-width:4}.handoff-line{stroke:#fbbf24;stroke-width:3;stroke-dasharray:10 8}.service-frame{fill:#0b1628;stroke:#345276;stroke-width:2}.source-card{fill:url(#service-en-source);stroke:#60a5fa;stroke-width:3;filter:url(#service-en-shadow)}.reservation-card{fill:url(#service-en-reservation);stroke:#67e8f9;stroke-width:3;filter:url(#service-en-shadow)}.policy-card{fill:url(#service-en-policy);stroke:#fbbf24;stroke-width:3;filter:url(#service-en-shadow)}.consumer-card{fill:#202044;stroke:#a78bfa;stroke-width:3;filter:url(#service-en-shadow)}
    .syntax-type{fill:#0F766E}.syntax-operator{fill:#BE123C}</style>
  </defs>
  <rect width="2200" height="1200" fill="url(#service-en-bg)"/><rect x="28" y="28" width="2144" height="1144" rx="30" fill="none" stroke="#263a5e" stroke-width="2"/>
  <circle cx="2050" cy="120" r="240" fill="#7c3aed" opacity=".08"/><circle cx="130" cy="1080" r="230" fill="#0891b2" opacity=".07"/>
  <text class="title" x="70" y="82">Service responsibility: the product BOM-to-visit boundary</text>
  <text class="subtitle" x="72" y="118">Each service owns its source-of-record facts; the appointment service turns the validated product contract and objective visit facts into plans and commitments.</text>
  <g transform="translate(1440 62)"><rect x="0" y="0" width="18" height="18" rx="5" fill="#162b45" stroke="#60a5fa" stroke-width="2"/><text class="small" x="28" y="15">Source / input service</text><rect x="184" y="0" width="18" height="18" rx="5" fill="#123b4a" stroke="#67e8f9" stroke-width="2"/><text class="small" x="212" y="15">Appointment ownership</text><rect x="392" y="0" width="18" height="18" rx="5" fill="#3a2816" stroke="#fbbf24" stroke-width="2"/><text class="small" x="420" y="15">Policy consumer</text></g>

  <g><rect class="source-card" x="80" y="240" width="500" height="225" rx="24"/><rect x="108" y="266" width="92" height="28" rx="14" fill="#60a5fa" opacity=".22"/><text class="pill" x="154" y="286" text-anchor="middle">Source</text><text class="card-title" x="330" y="335" text-anchor="middle">Product management</text><text class="body" x="330" y="373" text-anchor="middle">Product versions · product BOM</text><text class="body" x="330" y="401" text-anchor="middle">Choice, repetition, dependency rules</text><text class="code" x="330" y="440" text-anchor="middle">authority <tspan class="syntax-operator">=</tspan> <tspan class="syntax-type">PRODUCT</tspan></text></g>
  <g><rect class="source-card" x="80" y="580" width="500" height="225" rx="24"/><rect x="108" y="606" width="92" height="28" rx="14" fill="#60a5fa" opacity=".22"/><text class="pill" x="154" y="626" text-anchor="middle">Source</text><text class="card-title" x="330" y="675" text-anchor="middle">Commerce and purchasing</text><text class="body" x="330" y="713" text-anchor="middle">purchaseId · purchase contract</text><text class="body" x="330" y="741" text-anchor="middle">Choices · cancellation scope</text><text class="code" x="330" y="780" text-anchor="middle">PurchaseCompleted</text></g>

  <rect class="service-frame" x="700" y="170" width="760" height="850" rx="30"/><text class="frame-title" x="735" y="222">Information owned by the appointment service</text><text class="small" x="735" y="252">Time, capacity, consent, state, and history are committed here.</text>
  <g><rect class="reservation-card" x="760" y="285" width="300" height="190" rx="24"/><rect x="785" y="311" width="74" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="822" y="331" text-anchor="middle">Plan</text><text class="card-title" x="910" y="380" text-anchor="middle">AppointmentPlan</text><text class="body" x="910" y="418" text-anchor="middle">revision · provenance</text><text class="code" x="910" y="451" text-anchor="middle">PlannedTreatment</text></g>
  <g><rect class="reservation-card" x="1100" y="285" width="300" height="190" rx="24"/><rect x="1125" y="311" width="74" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="1162" y="331" text-anchor="middle">Promise</text><text class="card-title" x="1250" y="380" text-anchor="middle">Proposal + commitment</text><text class="body" x="1250" y="418" text-anchor="middle">PROPOSED · HELD</text><text class="code" x="1250" y="451" text-anchor="middle">CONFIRMED + consent</text></g>
  <g><rect class="reservation-card" x="900" y="610" width="380" height="210" rx="24"/><rect x="927" y="636" width="74" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="964" y="656" text-anchor="middle">Visit</text><text class="card-title" x="1090" y="709" text-anchor="middle">AppointmentItem + Appointment</text><text class="body" x="1090" y="747" text-anchor="middle">Per-item capacity and agreed time</text><text class="code" x="1090" y="787" text-anchor="middle">ResourceAllocation</text></g>
  <path class="connector primary-line" data-connector="plan-commitment" data-source="plan-service" data-target="commitment-service" d="M 1060 380 H 1100" marker-end="url(#service-en-primary-arrow)"/>
  <path class="connector primary-line" data-connector="commitment-item" data-source="commitment-service" data-target="visit-service" d="M 1250 475 V 535 Q 1250 565 1220 565 H 1120 Q 1090 565 1090 595 V 610" marker-end="url(#service-en-primary-arrow)"/>

  <g><rect class="source-card" x="1530" y="240" width="560" height="225" rx="24"/><rect x="1558" y="266" width="92" height="28" rx="14" fill="#60a5fa" opacity=".22"/><text class="pill" x="1604" y="286" text-anchor="middle">Source</text><text class="card-title" x="1810" y="335" text-anchor="middle">Clinical service</text><text class="body" x="1810" y="373" text-anchor="middle">Actual start, completion, and partial completion</text><text class="body" x="1810" y="401" text-anchor="middle">Item-level clinical provenance</text><text class="code" x="1810" y="440" text-anchor="middle">completion evidence</text></g>
  <g><rect class="policy-card" x="1530" y="580" width="560" height="225" rx="24"/><rect x="1558" y="606" width="92" height="28" rx="14" fill="#fbbf24" opacity=".22"/><text class="pill" x="1604" y="626" text-anchor="middle">Consume</text><text class="card-title" x="1810" y="675" text-anchor="middle">Customer counseling + CRM</text><text class="body" x="1810" y="713" text-anchor="middle">Objective no-show, delay, rescheduling facts</text><text class="body" x="1810" y="741" text-anchor="middle">Counseling, compensation, VIP policy</text><text class="code" x="1810" y="780" text-anchor="middle">not decided automatically by appointments</text></g>
  <g><rect class="consumer-card" x="1530" y="920" width="560" height="170" rx="24"/><rect x="1558" y="946" width="92" height="28" rx="14" fill="#a78bfa" opacity=".22"/><text class="pill" x="1604" y="966" text-anchor="middle">Consume</text><text class="card-title" x="1810" y="1015" text-anchor="middle">Notification + statistics consumers</text><text class="body" x="1810" y="1053" text-anchor="middle">outbox · read model · metrics</text></g>

  <path class="connector primary-line" data-connector="product-plan" data-source="product-service" data-target="plan-service" d="M 580 352 H 760" marker-end="url(#service-en-primary-arrow)"/>
  <path class="connector primary-line" data-connector="commerce-plan" data-source="commerce-service" data-target="plan-service" d="M 580 692 H 660 Q 710 692 710 642 V 465 Q 710 435 740 435 H 760" marker-end="url(#service-en-primary-arrow)"/>
  <path class="connector handoff-line" data-connector="visit-clinical" data-source="visit-service" data-target="clinical-service" d="M 1280 680 H 1430 Q 1470 680 1470 640 V 385 Q 1470 355 1500 355 H 1530" marker-end="url(#service-en-secondary-arrow)"/>
  <path class="connector handoff-line" data-connector="visit-crm" data-source="visit-service" data-target="crm-service" d="M 1280 720 H 1530" marker-end="url(#service-en-secondary-arrow)"/>
  <path class="connector handoff-line" data-connector="visit-notification" data-source="visit-service" data-target="notification-consumers" d="M 1280 790 H 1310 Q 1340 790 1340 820 V 850 Q 1340 880 1370 880 H 1480 Q 1500 880 1500 900 V 975 Q 1498 1005 1518 1005 H 1530" marker-end="url(#service-en-secondary-arrow)"/>

  <rect x="80" y="930" width="500" height="160" rx="20" fill="#101f37" stroke="#345276" stroke-width="2"/><text class="small" x="108" y="970">Boundary reading rule</text><text class="body" x="108" y="1008">Product and commerce create the contract; appointments own time and promise.</text><text class="body" x="108" y="1042">Clinical owns completion facts; CRM owns policy decisions.</text>
  <text class="small" x="735" y="930">Appointment-service responsibility</text><text class="body" x="735" y="965">Translate the validated product BOM snapshot into a plan and protect</text><text class="body" x="735" y="990">confirmed AppointmentItems and allocations.</text><text class="body" x="735" y="1015">Policy services decide no-show, VIP, and compensation after facts arrive.</text>
</svg>
