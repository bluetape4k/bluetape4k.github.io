<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-label="bluetape4k AWS 실제 예제 도입 흐름">
  <defs>
    <style>
      .title{font-family:'goorm Sans',cursive;font-size:34px;fill:#f8fafc}
      .subtitle,.body,.small{font-family:'goorm Sans Code',monospace;fill:#cbd5e1}
      .subtitle{font-size:15px}.label{font-family:'goorm Sans',cursive;font-size:22px;fill:#f8fafc}
      .body{font-size:14px}.small{font-size:12px}
      .panel{fill:#111827;stroke:#334155;stroke-width:1.4;rx:18}.card{stroke-width:1.6;rx:16}
      .arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .muted{fill:none;stroke:#64748b;stroke-width:1.9;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowMuted)}
    </style>
    <marker id="arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#94a3b8"/></marker>
    <marker id="arrowMuted" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1160" height="720" fill="#0b1220"/>
  <text class="title" x="54" y="70">예제 코드에서 검증된 AWS 동작까지</text>
  <text class="subtitle" x="56" y="104">예제는 프레임워크 코드와 도우미 코드의 경계, 로컬 AWS 검증 지점을 보여 줍니다.</text>
  <rect class="panel" x="54" y="136" width="1052" height="520"/>

  <rect class="card" x="96" y="302" width="214" height="118" fill="#123a43" stroke="#22d3ee"/>
  <text class="label" x="203" y="340" text-anchor="middle">예제 애플리케이션</text>
  <text class="body" x="203" y="370" text-anchor="middle">컨트롤러, 경로,</text>
  <text class="body" x="203" y="393" text-anchor="middle">작업자, 저장소</text>

  <rect class="card" x="390" y="196" width="252" height="124" fill="#12344a" stroke="#38bdf8"/>
  <text class="label" x="516" y="234" text-anchor="middle">Spring Boot 경로</text>
  <text class="body" x="516" y="264" text-anchor="middle">S3Operations, @SqsListener,</text>
  <text class="body" x="516" y="287" text-anchor="middle">DynamoDB 저장소</text>

  <rect class="card" x="390" y="406" width="252" height="124" fill="#163a2d" stroke="#4ade80"/>
  <text class="label" x="516" y="444" text-anchor="middle">Ktor 경로</text>
  <text class="body" x="516" y="474" text-anchor="middle">S3KtorClient, 경로,</text>
  <text class="body" x="516" y="497" text-anchor="middle">플러그인과 생명주기</text>

  <rect class="card" x="720" y="302" width="270" height="118" fill="#453511" stroke="#fbbf24"/>
  <text class="label" x="855" y="340" text-anchor="middle">bluetape4k-aws 도우미</text>
  <text class="body" x="855" y="370" text-anchor="middle">코루틴 연결, 명시적 SDK,</text>
  <text class="body" x="855" y="393" text-anchor="middle">CRT와 전송 방식 선택</text>

  <rect class="card" x="650" y="536" width="232" height="82" fill="#35234d" stroke="#c084fc"/>
  <text class="label" x="766" y="568" text-anchor="middle">로컬 검증</text>
  <text class="body" x="766" y="594" text-anchor="middle">Floci 또는 LocalStack 테스트</text>

  <rect class="card" x="900" y="536" width="170" height="82" fill="#4a2d18" stroke="#fb923c"/>
  <text class="label" x="985" y="568" text-anchor="middle">AWS</text>
  <text class="body" x="985" y="594" text-anchor="middle">S3, SQS, DynamoDB</text>

  <polyline class="arrow" points="310,361 350,361 350,258 390,258"/>
  <polyline class="arrow" points="310,361 350,361 350,468 390,468"/>
  <polyline class="arrow" points="642,258 680,258 680,361 720,361"/>
  <polyline class="arrow" points="642,468 680,468 680,361 720,361"/>
  <polyline class="arrow" points="855,420 855,478 766,478 766,536"/>
  <polyline class="muted" points="985,420 985,536"/>
  <text class="small" x="948" y="476" text-anchor="middle">실제 클라우드는 이후</text>
  <path class="connector" d="M2 2 L3 2" fill="none" stroke="transparent"/>
</svg>