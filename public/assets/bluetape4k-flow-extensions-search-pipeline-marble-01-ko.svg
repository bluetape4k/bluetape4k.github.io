<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">Search pipeline Flow marble diagram</title>
  <desc id="desc">A marble diagram showing debounce keeping the last query in a burst, attaching the latest 설정, cancelling stale searches, and emitting one result.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ed8ff" stroke="#9ed8ff"/></marker>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <linearGradient id="operatorGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#26384f"/><stop offset="100%" stop-color="#172033"/></linearGradient>
    <radialGradient id="marbleTeal" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#d5fff8"/><stop offset="34%" stop-color="#62d6cb"/><stop offset="100%" stop-color="#0b766f"/></radialGradient>
    <radialGradient id="marbleBlue" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#d8efff"/><stop offset="34%" stop-color="#67b7ee"/><stop offset="100%" stop-color="#1f5f99"/></radialGradient>
    <radialGradient id="marbleAmber" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#fff0c2"/><stop offset="36%" stop-color="#dfac3f"/><stop offset="100%" stop-color="#9b6a12"/></radialGradient>
    <radialGradient id="marbleGreen" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#dff8c7"/><stop offset="36%" stop-color="#83c95a"/><stop offset="100%" stop-color="#3f7b2a"/></radialGradient>
    <radialGradient id="marblePurple" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#f0e7ff"/><stop offset="36%" stop-color="#a98be9"/><stop offset="100%" stop-color="#6840a8"/></radialGradient>
    <filter id="panelShadow" x="-8%" y="-12%" width="116%" height="124%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
    <filter id="marbleShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#020617" flood-opacity="0.42"/></filter>
    <filter id="laneGlow" x="-4%" y="-120%" width="108%" height="340%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.35"/></filter>
    <style>
      .bg { fill: url(#bgGradient); }
      .panel { fill: url(#panelGradient); stroke: #536377; stroke-width: 2; rx: 18; filter: url(#panelShadow); }
      .title { font: 24px "goorm Sans"; fill: #f8fafc; }
      .sub { font: 14px "goorm Sans Code"; fill: #b6c4d6; }
      .label { font: 15px "goorm Sans Code"; fill: #e5edf7; }
      .small { font: 13px "goorm Sans Code"; fill: #b6c4d6; }
      .tiny { font: 11px "goorm Sans Code"; fill: #f8fafc; text-anchor: middle; dominant-baseline: middle; font-weight: 700; }
      .edge { stroke: #9ed8ff; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); filter: url(#laneGlow); }
      .shape { stroke: #e8f7ff; stroke-width: 1.8; filter: url(#marbleShadow); }
      .box { fill: #172033; stroke-width: 2.5; rx: 14; }
      .op { fill: url(#operatorGradient); stroke: #7dd3fc; }
      .guide { fill: #0f172a; fill-opacity: 0.18; stroke-width: 2; stroke-dasharray: 7 7; }
      .result { font: 12px "goorm Sans Code"; fill: #d8e5f2; text-anchor: middle; }
      .teal { fill: url(#marbleTeal); } .blue { fill: url(#marbleBlue); } .amber { fill: url(#marbleAmber); } .green { fill: url(#marbleGreen); } .purple { fill: url(#marblePurple); }
    </style>
  </defs>
  <rect class="bg" width="920" height="470"/>
  <rect class="panel" x="24" y="22" width="872" height="426"/>
  <text class="title" x="52" y="58">검색 파이프라인: 연속 입력 → 최신 요청 → 취소 가능한 결과</text>
  <text class="sub" x="52" y="84">debounce는 마지막 검색어를 남기고, withLatestFrom은 설정을 결합하며, flatMapLatest는 오래된 작업을 취소합니다</text>

  <text class="small" x="52" y="149">검색어</text>
  <path class="edge" d="M150 145 L806 145"/>
  <circle class="shape teal" cx="220" cy="145" r="13"/><text class="tiny" x="220" y="145">r</text>
  <path class="shape blue" d="M 292 128 L 309 145 L 292 162 L 275 145 Z"/><text class="tiny" x="292" y="145">re</text>
  <rect class="shape amber" x="352" y="132" width="34" height="26" rx="7"/><text class="tiny" x="369" y="145">red</text>
  <rect class="guide" x="198" y="126" width="204" height="184" rx="18" stroke="#c58b2a"/>
  <text class="result" x="302" y="286">연속 입력</text>

  <text class="small" x="52" y="229">설정</text>
  <path class="edge" d="M150 225 L806 225"/>
  <circle class="shape purple" cx="250" cy="225" r="12"/><text class="tiny" x="250" y="225">A</text>
  <circle class="shape green" cx="520" cy="225" r="12"/><text class="tiny" x="520" y="225">B</text>
  <text class="result" x="250" y="249">tenant-a</text>
  <text class="result" x="520" y="249">요청 뒤 새 설정</text>

  <rect class="box op" x="440" y="158" width="210" height="82"/>
  <text class="label" x="545" y="188" text-anchor="middle">bufferingDebounce</text>
  <text class="label" x="545" y="214" text-anchor="middle">withLatestFrom</text>

  <path d="M 369 159 V 300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M 250 237 V 300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <text class="small" x="52" y="319">요청</text>
  <path class="edge" d="M150 315 L806 315"/>
  <rect class="box" x="326" y="293" width="150" height="44" stroke="#159c92"/>
  <rect class="shape amber" x="344" y="304" width="34" height="22" rx="6"/><text class="tiny" x="361" y="315">red</text>
  <circle class="shape purple" cx="406" cy="315" r="10"/><text class="tiny" x="406" y="315">A</text>
  <text class="result" x="401" y="355">SearchRequest(red, tenant-a)</text>

  <text class="small" x="52" y="409">결과</text>
  <path class="edge" d="M150 405 L806 405"/>
  <rect class="box" x="586" y="383" width="106" height="44" stroke="#62984d"/>
  <text class="tiny" x="639" y="405">results(red)</text>
  <text class="result" x="704" y="438">takeUntil(session)</text>
</svg>
