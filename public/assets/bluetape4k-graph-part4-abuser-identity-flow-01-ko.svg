<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1500" height="780"/>
<rect class="frame" x="34" y="28" width="1432" height="724" rx="24"/>
<text class="title" x="750" y="82" text-anchor="middle">어뷰저 탐지 식별자 흐름</text>
<text class="subtitle" x="750" y="118" text-anchor="middle">기준 사용자에서 공유 식별자를 순회하고 의심 클러스터의 순위를 계산한다</text>
<path class="edge" data-connector="seed-to-ids" d="M410 363 L427 363 Q444 363 444 345 L444 274 Q444 256 462 256 L490 256"/>
<path class="edge" data-connector="ids-to-users" d="M830 256 L900 256"/>
<path class="edge" data-connector="seed-to-paths" d="M410 399 L438 399 Q456 399 456 417 L456 508 Q456 526 473 526 L490 526"/>
<path class="edge" data-connector="paths-to-rank" d="M830 526 L848 526 Q865 526 865 517 L865 517 Q865 508 883 508 L900 508"/>
<path class="edge" data-connector="users-to-rank" d="M1070 327 L1070 373 Q1070 391 1079 391 L1079 391 Q1088 391 1088 409 L1088 455"/>
<g id="seed">
  <rect x="90" y="310" width="320" height="142" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="250" y="367.5" text-anchor="middle">기준 사용자</text>
  <text class="nodeBody" x="250" y="401.5" text-anchor="middle">로그인·주문·검토 이벤트의</text>
  <text class="nodeBody" x="250" y="424.5" text-anchor="middle">userId</text>
</g>
<g id="ids">
  <rect x="490" y="185" width="340" height="142" rx="12" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="660" y="242.5" text-anchor="middle">공유 식별자</text>
  <text class="nodeBody" x="660" y="276.5" text-anchor="middle">기기·IP·전화번호 해시</text>
  <text class="nodeBody" x="660" y="299.5" text-anchor="middle">결제 토큰·추천인</text>
</g>
<g id="users">
  <rect x="900" y="185" width="340" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1070" y="242.5" text-anchor="middle">관련 사용자</text>
  <text class="nodeBody" x="1070" y="276.5" text-anchor="middle">식별자에서 역방향 탐색</text>
  <text class="nodeBody" x="1070" y="299.5" text-anchor="middle">기준 사용자 제외</text>
</g>
<g id="paths">
  <rect x="490" y="455" width="340" height="142" rx="12" fill="#4C1D95" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="660" y="512.5" text-anchor="middle">의심 근거</text>
  <text class="nodeBody" x="660" y="546.5" text-anchor="middle">간선 경로 설명</text>
  <text class="nodeBody" x="660" y="569.5" text-anchor="middle">순환 탐지</text>
</g>
<g id="rank">
  <rect x="900" y="455" width="340" height="142" rx="12" fill="#134E4A" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1070" y="512.5" text-anchor="middle">위험 순위</text>
  <text class="nodeBody" x="1070" y="546.5" text-anchor="middle">PageRank 상위 K개</text>
  <text class="nodeBody" x="1070" y="569.5" text-anchor="middle">클러스터 검토 대기열</text>
</g>
<rect x="88" y="684" width="1324" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="750" y="709" text-anchor="middle">워크숍은 원문 전화번호와 카드 정보를 저장하지 않고 해시와 PCI 안전 결제 토큰을 사용한다.</text>
<text class="footer" x="750" y="733" text-anchor="middle">예제는 탐색 구조를 보여주며 운영 환경에는 점수 정책과 운영 안전장치가 추가로 필요하다.</text>
</svg>
