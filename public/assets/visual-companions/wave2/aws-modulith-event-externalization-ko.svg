<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1420" viewBox="0 0 1440 1420" role="img" aria-labelledby="title desc"><title id="title">Spring Modulith 이벤트 처리 경계</title><desc id="desc">버전이 있는 이벤트가 논리 대상에서 출발해 입력 검증, fencing claim, 로컬 dispatch, SQS acknowledgement에 도달하는 과정을 살펴봅니다.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#08776a"/></marker></defs><style>text{font-family:'goorm Sans',sans-serif;fill:#1c2925}.title{font-family:'goorm Sans',sans-serif;font-size:44px;font-weight:bold}.heading{font-family:'goorm Sans',sans-serif;font-size:29px;font-weight:bold}.body{font-size:19px}.small{font-size:17px}.tag{font-size:17px;fill:#08776a;font-weight:bold}.muted{fill:#52645b}.callout{font-size:22px;font-weight:bold}.card{fill:#fff;stroke:#cbd6cf;stroke-width:2}.connector{fill:none;stroke:#08776a;stroke-width:3;stroke-linecap:round}</style><rect width="1440" height="1420" fill="#f5f6f3"/>
<text class="tag" x="60" y="55">SPRING MODULITH / AWS</text>
<text class="title" x="60" y="116">하나의 이벤트, 분리된 처리 경계</text>
<text class="callout" x="60" y="174">발행 성공은 수신 처리 완료를 보장하지 않습니다</text>
<rect id="producer" class="card" x="60" y="220" width="400" height="620" rx="12"/>
<text class="tag" x="86" y="261">SNS / SQS</text>
<text class="heading" x="86" y="306">발행 경계</text>
<text class="tag" x="86" y="356">01</text>
<text class="callout" x="86" y="390">대상 해석과 encode</text>
<text class="body" x="86" y="423">논리 대상과 routing key를</text>
<text class="body" x="86" y="450">해석합니다. 등록된</text>
<text class="body" x="86" y="477">type/version, 안정적인 ID와</text>
<text class="body" x="86" y="504">허용 header를 encode합니다.</text>
<text class="tag" x="86" y="563">02</text>
<text class="callout" x="86" y="597">AWS로 발행</text>
<text class="body" x="86" y="630">SNS 또는 SQS publisher 완료 뒤</text>
<text class="body" x="86" y="657">publication future를</text>
<text class="body" x="86" y="684">완료합니다. 동시 발행 수를</text>
<text class="body" x="86" y="711">제한합니다.</text>
<rect id="source" class="card" x="520" y="220" width="400" height="620" rx="12"/>
<text class="tag" x="546" y="261">DIRECT / SNS</text>
<text class="heading" x="546" y="306">SQS 입력 경계</text>
<text class="tag" x="546" y="356">A</text>
<text class="callout" x="546" y="390">DIRECT</text>
<text class="body" x="546" y="423">SQS body의 envelope를 직접</text>
<text class="body" x="546" y="450">읽습니다. SNS 형태는</text>
<text class="body" x="546" y="477">거부합니다. DIRECT는 발행</text>
<text class="body" x="546" y="504">서비스가 아닌 입력 모드입니다.</text>
<text class="tag" x="546" y="563">B</text>
<text class="callout" x="546" y="597">SNS</text>
<text class="body" x="546" y="630">SQS의 SNS Notification을</text>
<text class="body" x="546" y="657">읽습니다. 허용 topic과 서명을</text>
<text class="body" x="546" y="684">검증한 뒤 Message를</text>
<text class="body" x="546" y="711">decode합니다.</text>
<rect id="consumer" class="card" x="980" y="220" width="400" height="620" rx="12"/>
<text class="tag" x="1006" y="261">CLAIM / DISPATCH / ACK</text>
<text class="heading" x="1006" y="306">Consumer 경계</text>
<text class="tag" x="1006" y="356">01</text>
<text class="callout" x="1006" y="390">이벤트 claim</text>
<text class="body" x="1006" y="423">type과 안정적인 ID로</text>
<text class="body" x="1006" y="450">claim합니다. Completed는</text>
<text class="body" x="1006" y="477">dispatch를 생략하고</text>
<text class="body" x="1006" y="504">InProgress는 실패합니다.</text>
<text class="body" x="1006" y="531">Acquired는 fencing token을</text>
<text class="body" x="1006" y="558">부여합니다.</text>
<text class="tag" x="1006" y="617">02</text>
<text class="callout" x="1006" y="651">Claim 완료</text>
<text class="body" x="1006" y="684">동기 dispatch 뒤 현재</text>
<text class="body" x="1006" y="711">token으로 완료합니다. APPLIED</text>
<text class="body" x="1006" y="738">또는 ALREADY_APPLIED만 ack를</text>
<text class="body" x="1006" y="765">허용합니다.</text>
<path id="published-body" class="connector" data-connector="true" data-source="producer" data-target="source" d="M 460 510 H 520" marker-end="url(#arrow)"/>
<path id="verified-event" class="connector" data-connector="true" data-source="source" data-target="consumer" d="M 920 510 H 980" marker-end="url(#arrow)"/>
<rect x="60" y="870" width="1320" height="120" rx="10" fill="#e1f1eb" stroke="#cbd6cf"/>
<text class="callout" x="86" y="912">입력 검증 / decode / claim / dispatch / complete / ack</text>
<text class="body" x="86" y="951">완료된 중복은 dispatch와 complete를 생략합니다. Consume 실패 뒤에는 acknowledgement를 수행하지</text>
<text class="body" x="86" y="977">않습니다.</text>
<rect x="60" y="1020" width="640" height="230" rx="10" fill="#fff" stroke="#cbd6cf"/><rect x="730" y="1020" width="650" height="230" rx="10" fill="#fff" stroke="#cbd6cf"/>
<text class="heading" x="86" y="1065">완료 보장의 범위</text>
<text class="body" x="86" y="1110">publishEvent 실행 중 claim heartbeat를</text>
<text class="body" x="86" y="1137">유지합니다. 반환 시점은 비동기 listener나 그</text>
<text class="body" x="86" y="1164">최종 업무 결과의 완료를 보장하지 않습니다.</text>
<text class="heading" x="756" y="1065">호출자 소유 정책</text>
<text class="body" x="756" y="1110">AWS client와 자격 증명, IAM, topic, queue,</text>
<text class="body" x="756" y="1137">subscription, 재시도/DLQ 정책, 영속 idempotency</text>
<text class="body" x="756" y="1164">저장소와 업무 결과의 안전성을 관리합니다.</text>
<text class="small muted" x="60" y="1300">이 탐색기는 실행 중인 broker가 아니라 제어 흐름의 경계를 설명합니다. 메모리 idempotency는 프로세스 간</text>
<text class="small muted" x="60" y="1326">공유나 재시작 후 영속성을 제공하지 않습니다. 비동기 handler와 부분 업무 결과에는 애플리케이션 수준의</text>
<text class="small muted" x="60" y="1352">안전장치가 필요합니다.</text>
</svg>
