<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="4220" viewBox="0 0 1800 4220" role="img" aria-labelledby="title desc" data-intent="source-backed AWS SQS Extended Client payload lifecycle" data-source-read="30a28f80dbf995ca08bf86e64d3b60a93f1e2094">
<title id="title">AWS SQS Extended Client: SQS 삭제 후 payload를 정리합니다</title><desc id="desc">inline 또는 S3 offload를 선택하고 정확한 payload를 복원한 뒤 SQS를 먼저 삭제하고 marker 검증과 payload cleanup을 수행합니다.</desc><defs>
