<text class="title" x="900" y="84" text-anchor="middle">AWS SNS: handler 진입 전에 신뢰를 검증합니다</text>
<text class="subtitle" x="900" y="119" text-anchor="middle">구조를 파싱하고 unknown TopicArn을 network 접근 전에 거부한 뒤 certificate chain과 SignatureVersion 1/2를 검증합니다.</text>
<rect id="overview" class="frame" x="80" y="165" width="1640" height="310" rx="24" fill="#213a54" stroke="#78a9d8" />
<text class="section" x="120" y="215" text-anchor="start">두 개의 거부 구간이 하나의 verified handler 경계를 보호합니다</text>
<text class="hint" x="120" y="248" text-anchor="start">parse ≠ trust · exact allowlist before network · verified action only</text>
<rect id="overview-1" class="card" x="120" y="285" width="470" height="165" rx="16" fill="#213a54" stroke="#78a9d8" />
<text class="mono" x="144" y="319" text-anchor="start">UNTRUSTED</text>
<text class="cardTitle" x="144" y="354" text-anchor="start">구조와 신뢰는 다릅니다</text>
<text class="small" x="144" y="389" text-anchor="start">필드를 파싱해도 topic, 인증서, 서명 검사가 끝날</text>
<text class="small" x="144" y="412" text-anchor="start">때까지 신뢰하지 않습니다.</text>
<rect id="overview-2" class="card" x="665" y="285" width="470" height="165" rx="16" fill="#493722" stroke="#cda36c" />
<text class="mono" x="689" y="319" text-anchor="start">EARLY REJECT</text>
<text class="cardTitle" x="689" y="354" text-anchor="start">Topic과 인증서 URL 우선</text>
<text class="small" x="689" y="389" text-anchor="start">Unknown topic과 비허용 SNS certificate host는</text>
<text class="small" x="689" y="412" text-anchor="start">인증서 요청 없이 거부합니다.</text>
<rect id="overview-3" class="card" x="1210" y="285" width="470" height="165" rx="16" fill="#2b432c" stroke="#9ab873" />
<text class="mono" x="1234" y="319" text-anchor="start">VERIFIED</text>
<text class="cardTitle" x="1234" y="354" text-anchor="start">Handler 진입은 마지막</text>
<text class="small" x="1234" y="389" text-anchor="start">Notification dispatch와 subscription</text>
<text class="small" x="1234" y="412" text-anchor="start">confirmation은 검증 성공 뒤에만 도달합니다.</text>
<rect id="sequence-frame" class="frame" x="80" y="520" width="1640" height="3090" rx="24" fill="#213a54" stroke="#78a9d8" />
<text class="section" x="120" y="570" text-anchor="start">신뢰하지 않는 요청 → 조기 정책 → 암호학적 검증 → 명시적 action</text>
<text class="hint" x="120" y="603" text-anchor="start">Numbered message lanes · lifelines · activation bars · chronological fail-closed frames</text>
