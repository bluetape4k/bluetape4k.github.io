<text class="body" x="215" y="3228" text-anchor="start">업무 처리는 caller가 소유합니다. Subscription confirmation은 handler가 명시적으로 호출합니다.</text>
<text class="small" x="215" y="3281" text-anchor="start">Guardrail · 검증 성공이 업무 완료를 뜻하지 않습니다.</text>
