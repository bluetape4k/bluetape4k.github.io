<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">General Exposed JDBC benchmark throughput chart</title>
  <desc id="desc">Bar chart showing total throughput improvement from baseline to tuned Exposed JDBC benchmark settings.</desc>
  <rect width="1200" height="700" fill="#0f172a"/>
  <rect x="64" y="62" width="1072" height="584" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="122" font-family="Architects Daughter" font-size="42" fill="#f8fafc">General Exposed JDBC Benchmark</text>
  <text x="98" y="162" font-family="Comic Mono" font-size="22" fill="#cbd5e1">PostgreSQL Testcontainers, total ops/sec across CRUD/JOIN methods</text>
  <g font-family="Comic Mono" font-size="15" fill="#cbd5e1">
    <line x1="122" y1="468" x2="1068" y2="468" stroke="#64748b" stroke-width="2"/>
    <line x1="122" y1="218" x2="122" y2="468" stroke="#64748b" stroke-width="2"/>
    <line x1="122" y1="343" x2="1068" y2="343" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="122" y1="218" x2="1068" y2="218" stroke="#1f2937" stroke-width="1.5"/>
    <text x="104" y="473" text-anchor="end">0</text>
    <text x="104" y="348" text-anchor="end">25k</text>
    <text x="104" y="223" text-anchor="end">50k</text>
  </g>
  <g font-family="Comic Mono" font-size="16" fill="#e2e8f0">
    <rect x="170" y="341" width="92" height="127" rx="12" fill="#f59e0b" stroke="#fbbf24"/>
    <text x="216" y="329" text-anchor="middle">25,400</text>
    <text x="216" y="500" text-anchor="middle">Baseline</text>
    <rect x="392" y="251" width="92" height="217" rx="12" fill="#60a5fa" stroke="#93c5fd"/>
    <text x="438" y="239" text-anchor="middle">43,487</text>
    <text x="438" y="500" text-anchor="middle">Pool</text>
    <text x="438" y="520" text-anchor="middle">+ threads</text>
    <rect x="614" y="247" width="92" height="221" rx="12" fill="#34d399" stroke="#86efac"/>
    <text x="660" y="235" text-anchor="middle">44,161</text>
    <text x="660" y="500" text-anchor="middle">Add</text>
    <text x="660" y="520" text-anchor="middle">index</text>
    <rect x="836" y="241" width="92" height="227" rx="12" fill="#8bb7f0" stroke="#5f94cf"/>
    <text x="882" y="229" text-anchor="middle">45,431</text>
    <text x="882" y="500" text-anchor="middle">Stronger</text>
    <text x="882" y="520" text-anchor="middle">settings</text>
  </g>
  <text x="96" y="586" font-family="Comic Mono" font-size="18" fill="#cbd5e1">Tuning pool/thread balance and JOIN indexes moved the ordinary JDBC path</text>
  <text x="96" y="610" font-family="Comic Mono" font-size="18" fill="#cbd5e1">from 25.4k to 45.4k ops/sec.</text>
</svg>
