oke-width="1.3"/><text x="683.5" y="578" text-anchor="middle" class="badgeText">6</text><text x="701.5" y="579" class="labelText">Elected / Skipped / ActionFailed</text><path d="M 875 588 L 632 588" class="return"/></g>
