  <text class="smallLabel" x="1303" y="228" text-anchor="middle" dominant-baseline="middle">RESP3 Tracking</text>
<text class="body" x="1303" y="256" text-anchor="middle" dominant-baseline="middle">server push</text>
<text class="body" x="1303" y="274" text-anchor="middle" dominant-baseline="middle">key invalidation</text>
</g>
