<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">HTTP client high-latency throughput</title>
  <desc id="desc">Horizontal bar chart for GET /httpbin/delay/0.05. WebFlux fixture, 100 JMH threads, ops per second where higher is better. OkHttp3 virtual threads lead at 1902.171 ops/s and Ktor CIO coroutines record 1515.026 ops/s.</desc>
  <defs>
    <style>
      .canvas { fill: #0b1220; }
      .frame { fill: #12213a; stroke: #314868; stroke-width: 2; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Comic Sans", cursive; font-size: 38px; font-weight: 400; fill: #e6edf7; }
      .subtitle { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 16px; fill: #9fb2cc; }
      .axis { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; fill: #9fb2cc; }
      .label { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; fill: #e6edf7; }
      .value { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #e6edf7; }
      .chip { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #d7e2f0; }
      .note { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; fill: #9fb2cc; }
      .grid { stroke: #263954; stroke-width: 1; }
      .zero { stroke: #536b8f; stroke-width: 2; }
    </style>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect class="canvas" width="1180" height="760"/>
  <rect class="frame" x="26" y="24" width="1128" height="710" rx="18" filter="url(#softShadow)"/>

  <text class="title" id="chart-title" x="62" y="82">HTTP client high-latency throughput</text>
  <text class="subtitle" x="64" y="114">GET /httpbin/delay/0.05 · WebFlux fixture · @Threads(100) · ops/s, higher is better</text>

  <rect x="64" y="134" width="156" height="28" rx="14" fill="#17375e" stroke="#6aa9ff"/>
  <circle cx="82" cy="148" r="6" fill="#6aa9ff"/>
  <text class="chip" x="96" y="153">virtual thread</text>
  <rect x="232" y="134" width="122" height="28" rx="14" fill="#3f3217" stroke="#f5c15c"/>
  <circle cx="250" cy="148" r="6" fill="#f5c15c"/>
  <text class="chip" x="264" y="153">sync</text>
  <rect x="366" y="134" width="164" height="28" rx="14" fill="#173c37" stroke="#53d6b7"/>
  <circle cx="384" cy="148" r="6" fill="#53d6b7"/>
  <text class="chip" x="398" y="153">coroutine/async</text>
  <rect x="542" y="134" width="154" height="28" rx="14" fill="#40202b" stroke="#ef7892"/>
  <circle cx="560" cy="148" r="6" fill="#ef7892"/>
  <text class="chip" x="574" y="153">Ktor CIO row</text>

  <text class="note" x="860" y="147">Equal-thread local snapshot</text>
  <text class="note" x="860" y="165">Source table remains canonical</text>

  <line class="grid" x1="345" y1="178" x2="345" y2="660"/>
  <line class="grid" x1="520" y1="178" x2="520" y2="660"/>
  <line class="grid" x1="695" y1="178" x2="695" y2="660"/>
  <line class="grid" x1="870" y1="178" x2="870" y2="660"/>
  <line class="grid" x1="1045" y1="178" x2="1045" y2="660"/>
  <line class="zero" x1="345" y1="178" x2="345" y2="660"/>

  <g>
    <text class="label" x="64" y="197">OkHttp3 VirtualThread</text>
    <rect x="345" y="178" width="666" height="24" rx="6" fill="#17375e" stroke="#6aa9ff"/>
    <text class="value" x="1022" y="196">1,902.171</text>

    <text class="label" x="64" y="239">HC5 Classic VirtualThread</text>
    <rect x="345" y="220" width="661" height="24" rx="6" fill="#17375e" stroke="#6aa9ff"/>
    <text class="value" x="1017" y="238">1,888.018</text>

    <text class="label" x="64" y="281">JDK VirtualThread</text>
    <rect x="345" y="262" width="659" height="24" rx="6" fill="#17375e" stroke="#6aa9ff"/>
    <text class="value" x="1015" y="280">1,883.634</text>

    <text class="label" x="64" y="323">HC5 Classic</text>
    <rect x="345" y="304" width="658" height="24" rx="6" fill="#3f3217" stroke="#f5c15c"/>
    <text class="value" x="1014" y="322">1,880.023</text>

    <text class="label" x="64" y="365">OkHttp3 Sync</text>
    <rect x="345" y="346" width="655" height="24" rx="6" fill="#3f3217" stroke="#f5c15c"/>
    <text class="value" x="1011" y="364">1,870.124</text>

    <text class="label" x="64" y="407">JDK Sync</text>
    <rect x="345" y="388" width="653" height="24" rx="6" fill="#3f3217" stroke="#f5c15c"/>
    <text class="value" x="1009" y="406">1,865.997</text>

    <text class="label" x="64" y="449">JDK Coroutines</text>
    <rect x="345" y="430" width="652" height="24" rx="6" fill="#173c37" stroke="#53d6b7"/>
    <text class="value" x="1008" y="448">1,863.948</text>

    <text class="label" x="64" y="491">HC5 Async Coroutines</text>
    <rect x="345" y="472" width="651" height="24" rx="6" fill="#173c37" stroke="#53d6b7"/>
    <text class="value" x="1007" y="490">1,860.655</text>

    <text class="label" x="64" y="533">Vert.x WebClient Coroutines</text>
    <rect x="345" y="514" width="651" height="24" rx="6" fill="#173c37" stroke="#53d6b7"/>
    <text class="value" x="1007" y="532">1,859.003</text>

    <text class="label" x="64" y="575">OkHttp3 Coroutines</text>
    <rect x="345" y="556" width="650" height="24" rx="6" fill="#173c37" stroke="#53d6b7"/>
    <text class="value" x="1006" y="574">1,856.895</text>

    <text class="label" x="64" y="617">Ktor CIO Coroutines</text>
    <rect x="345" y="598" width="530" height="24" rx="6" fill="#40202b" stroke="#ef7892"/>
    <text class="value" x="886" y="616">1,515.026</text>

    <text class="label" x="64" y="659">HC5 Classic Coroutines</text>
    <rect x="345" y="640" width="426" height="24" rx="6" fill="#2c2550" stroke="#b49cff"/>
    <text class="value" x="782" y="658">1,216.306</text>
  </g>

  <line class="grid" x1="345" y1="678" x2="1045" y2="678"/>
  <text class="axis" x="340" y="702">0</text>
  <text class="axis" x="500" y="702">500</text>
  <text class="axis" x="668" y="702">1,000</text>
  <text class="axis" x="842" y="702">1,500</text>
  <text class="axis" x="1012" y="702">2,000</text>
  <text class="note" x="64" y="704">Report snapshot: 2026-05-21</text>
</svg>
