<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#496A8F"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#22344A;font-weight:400}
    .subtitle,.footer,.axis{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:17px;fill:#536476;font-weight:400}
    .nodeTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .nodeBody{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:16px;fill:#3F5269;font-weight:400}
    .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .tableField,.edgeLabel{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;fill:#3F5269;font-weight:400}
    .edge{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#91A6BD;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1500" height="780"/>
<rect class="frame" x="34" y="28" width="1432" height="724" rx="24"/>
<text class="title" x="750" y="82" text-anchor="middle">Abuser Detection Identity Flow</text>
<text class="subtitle" x="750" y="118" text-anchor="middle">Start from one user, traverse shared identifiers, then rank suspicious clusters</text>
<path class="edge" d="M410 381 H450 V256 H482"/>
<path class="edge" d="M830 256 H865 V256 H892"/>
<path class="edge" d="M410 381 H450 V526 H482"/>
<path class="edge" d="M830 526 H865 V526 H892"/>
<path class="edge" d="M1070 327 V391 H1070 V447"/>
<g id="seed">
  <rect x="90" y="310" width="320" height="142" rx="12" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="250" y="367.5" text-anchor="middle">Seed User</text>
  <text class="nodeBody" x="250" y="401.5" text-anchor="middle">userId from login, order,</text>
  <text class="nodeBody" x="250" y="424.5" text-anchor="middle">or moderation event</text>
</g>
<g id="ids">
  <rect x="490" y="185" width="340" height="142" rx="12" fill="#FFF4D9" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="660" y="242.5" text-anchor="middle">Shared Identifiers</text>
  <text class="nodeBody" x="660" y="276.5" text-anchor="middle">device, IP, phone hash</text>
  <text class="nodeBody" x="660" y="299.5" text-anchor="middle">payment token, referral</text>
</g>
<g id="users">
  <rect x="900" y="185" width="340" height="142" rx="12" fill="#EAF8EF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="1070" y="242.5" text-anchor="middle">Related Users</text>
  <text class="nodeBody" x="1070" y="276.5" text-anchor="middle">reverse traversal from identifiers</text>
  <text class="nodeBody" x="1070" y="299.5" text-anchor="middle">exclude seed user</text>
</g>
<g id="paths">
  <rect x="490" y="455" width="340" height="142" rx="12" fill="#F3ECFF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="660" y="512.5" text-anchor="middle">Suspicion Evidence</text>
  <text class="nodeBody" x="660" y="546.5" text-anchor="middle">explain edge paths</text>
  <text class="nodeBody" x="660" y="569.5" text-anchor="middle">cycle detection</text>
</g>
<g id="rank">
  <rect x="900" y="455" width="340" height="142" rx="12" fill="#E9F7F5" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="1070" y="512.5" text-anchor="middle">Risk Ranking</text>
  <text class="nodeBody" x="1070" y="546.5" text-anchor="middle">PageRank topK</text>
  <text class="nodeBody" x="1070" y="569.5" text-anchor="middle">cluster review queue</text>
</g>
<rect x="88" y="684" width="1324" height="62" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="750" y="709" text-anchor="middle">The workshop keeps raw phone and card data out of the graph: use hashes and PCI-safe payment tokens.</text>
<text class="footer" x="750" y="733" text-anchor="middle">The example teaches traversal shape first; production systems still need scoring and operational guardrails.</text>
</svg>
