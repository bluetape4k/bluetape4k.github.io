<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc" data-locale="en">
  <title id="title">Protect Patient A's Plan when Product Changes</title>
  <desc id="desc">A time axis that protects Patient A's v1 purchase snapshot and Plan while branching product v2 into new purchases and explicit migration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset=".58" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/>
    </linearGradient>
    <linearGradient id="v1Fill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102b49"/><stop offset="1" stop-color="#17214a"/></linearGradient>
    <linearGradient id="protectFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#103b45"/><stop offset="1" stop-color="#15364d"/></linearGradient>
    <linearGradient id="branchFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2b18"/><stop offset="1" stop-color="#2a2138"/></linearGradient>
    <linearGradient id="revisionFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#28214c"/><stop offset="1" stop-color="#182d4a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#020617" flood-opacity=".56"/></filter>
    <marker id="cyanArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#67e8f9" data-solid-head="true"/>
    </marker>
    <marker id="amberArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#fbbf24" data-solid-head="true"/>
    </marker>
    <style>
      .title{font-family:"goorm Sans",sans-serif;font-size:46px;font-weight:700;fill:#f8fafc}
      .subtitle{font-family:"goorm Sans",sans-serif;font-size:21px;fill:#aebed2}
      .lane{font-family:"goorm Sans",sans-serif;font-size:25px;font-weight:700;fill:#f8fafc}
      .lane-note{font-family:"goorm Sans",sans-serif;font-size:16px;fill:#aebed2}
      .step{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:18px;font-weight:700;fill:#dbeafe}
      .card-title{font-family:"goorm Sans",sans-serif;font-size:25px;font-weight:700;fill:#f8fafc}
      .body{font-family:"goorm Sans",sans-serif;font-size:18px;fill:#d7e3f3}
      .code-small{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:14px;font-weight:700;fill:#f8fafc}
      .role{font-family:"goorm Sans",sans-serif;font-size:14px;font-weight:700;fill:#f8fafc}
      .small{font-family:"goorm Sans",sans-serif;font-size:16px;fill:#aebed2}
      .footer-title{font-family:"goorm Sans",sans-serif;font-size:18px;font-weight:700;fill:#f8fafc}
      .footer-body{font-family:"goorm Sans",sans-serif;font-size:17px;fill:#d7e3f3}
      .connector{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:4.5}
      .primary-line{stroke:#67e8f9;marker-end:url(#cyanArrow)}
      .branch-line{stroke:#fbbf24;marker-end:url(#amberArrow)}
    </style>
  </defs>

  <rect id="background" width="2000" height="1200" fill="url(#bg)"/>
  <rect x="40" y="32" width="1920" height="1136" rx="32" fill="none" stroke="#263a5e" stroke-width="2"/>
  <circle cx="1830" cy="150" r="250" fill="#7c3aed" opacity=".08"/>
  <circle cx="170" cy="1040" r="250" fill="#0891b2" opacity=".07"/>

  <text class="title" x="90" y="86">Protect Patient A's Plan when Product Changes</text>
  <text class="subtitle" x="92" y="126">Pin the v1 purchase as a snapshot, then separate v2 new purchases from approved future-obligation migration.</text>
  <g transform="translate(1180 88)">
    <rect x="0" y="-18" width="22" height="22" rx="7" fill="#102b49" stroke="#60a5fa" stroke-width="2"/>
    <text class="small" x="32" y="0">v1 snapshot · past promise protected</text>
    <rect x="350" y="-18" width="22" height="22" rx="7" fill="#3b2b18" stroke="#fbbf24" stroke-width="2"/>
    <text class="small" x="382" y="0">v2 branch · new contract or explicit migration</text>
  </g>

  <text class="lane" x="90" y="210">v1 purchase and promise</text>
  <text class="lane-note" x="90" y="236">The purchase-time contract and facts already confirmed</text>
  <path d="M 90 250 H 1830" fill="none" stroke="#2b4168" stroke-width="2" stroke-dasharray="10 12"/>
  <text class="lane" x="90" y="660">Branches after v2 is published</text>
  <text class="lane-note" x="90" y="686">A new contract and an exceptional existing-purchase migration</text>
  <path d="M 90 700 H 1830" fill="none" stroke="#2b4168" stroke-width="2" stroke-dasharray="10 12"/>

  <g filter="url(#shadow)">
    <g class="node-card">
    <rect id="catalog-v1" x="90" y="260" width="300" height="230" rx="26" fill="url(#v1Fill)" stroke="#60a5fa" stroke-width="3"/>
    <rect x="110" y="278" width="180" height="28" rx="14" fill="#60a5fa" opacity=".22"/>
    <text class="role" x="200" y="298" text-anchor="middle">Product authority</text>
    <text class="card-title" x="240" y="352" text-anchor="middle">Product catalog v1</text>
    <text class="body" x="240" y="392" text-anchor="middle">Definition · BOM · policy</text>
    <text class="body" x="240" y="424" text-anchor="middle">Pinned at purchase time</text>
  </g>
    <g class="node-card">
    <rect id="purchase-a-v1" x="450" y="260" width="300" height="230" rx="26" fill="url(#v1Fill)" stroke="#60a5fa" stroke-width="3"/>
    <rect x="470" y="278" width="180" height="28" rx="14" fill="#60a5fa" opacity=".22"/>
    <text class="role" x="560" y="298" text-anchor="middle">Commercial fact</text>
    <text class="card-title" x="600" y="352" text-anchor="middle">Patient A purchase</text>
    <text class="body" x="600" y="392" text-anchor="middle">v1 purchase snapshot</text>
    <text class="body" x="600" y="424" text-anchor="middle">sourcePurchaseId · payload hash</text>
  </g>
    <g class="node-card">
    <rect id="plan-v1" x="810" y="260" width="300" height="230" rx="26" fill="url(#v1Fill)" stroke="#60a5fa" stroke-width="3"/>
    <rect x="830" y="278" width="180" height="28" rx="14" fill="#60a5fa" opacity=".22"/>
    <text class="role" x="920" y="298" text-anchor="middle">Scheduling obligation</text>
    <text class="card-title" x="960" y="352" text-anchor="middle">AppointmentPlan</text>
    <text class="body" x="960" y="392" text-anchor="middle">v1 revision</text>
    <text class="body" x="960" y="424" text-anchor="middle">PlannedTreatment 1..N</text>
  </g>
    <g class="node-card">
    <rect id="completed-protected" x="1170" y="260" width="300" height="230" rx="26" fill="url(#protectFill)" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="1190" y="278" width="180" height="28" rx="14" fill="#2dd4bf" opacity=".22"/>
    <text class="role" x="1280" y="298" text-anchor="middle">Protected fact</text>
    <text class="card-title" x="1320" y="352" text-anchor="middle">Completed · in progress</text>
    <text class="body" x="1320" y="392" text-anchor="middle">Retained in old revision</text>
    <text class="body" x="1320" y="424" text-anchor="middle">No silent migration or delete</text>
  </g>
    <g class="node-card">
    <rect id="confirmed-protected" x="1530" y="260" width="300" height="230" rx="26" fill="url(#protectFill)" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="1550" y="278" width="240" height="28" rx="14" fill="#2dd4bf" opacity=".22"/>
    <text class="role" x="1670" y="298" text-anchor="middle">Separate proposal needed</text>
    <text class="card-title" x="1680" y="352" text-anchor="middle">Confirmed visit promise</text>
    <text class="body" x="1680" y="392" text-anchor="middle">Time · items · resources</text>
    <text class="body" x="1680" y="424" text-anchor="middle">Consent snapshot protected</text>
  </g>
    <g class="node-card">
    <rect id="catalog-v2" x="90" y="710" width="300" height="230" rx="26" fill="url(#branchFill)" stroke="#fbbf24" stroke-width="3"/>
    <rect x="110" y="728" width="180" height="28" rx="14" fill="#fbbf24" opacity=".22"/>
    <text class="role" x="200" y="748" text-anchor="middle">Product authority</text>
    <text class="card-title" x="240" y="802" text-anchor="middle">Product catalog v2</text>
    <text class="body" x="240" y="842" text-anchor="middle">New version published</text>
    <text class="body" x="240" y="874" text-anchor="middle">No automatic Plan change</text>
  </g>
    <g class="node-card">
    <rect id="new-purchase-v2" x="450" y="710" width="300" height="230" rx="26" fill="url(#branchFill)" stroke="#fbbf24" stroke-width="3"/>
    <rect x="470" y="728" width="180" height="28" rx="14" fill="#fbbf24" opacity=".22"/>
    <text class="role" x="560" y="748" text-anchor="middle">New purchase</text>
    <text class="card-title" x="600" y="802" text-anchor="middle">New purchase</text>
    <text class="body" x="600" y="842" text-anchor="middle">New Plan on v2</text>
    <text class="body" x="600" y="874" text-anchor="middle">Applies only to new contract</text>
  </g>
    <g class="node-card">
    <rect id="migration-approved" x="810" y="710" width="300" height="230" rx="26" fill="url(#branchFill)" stroke="#fbbf24" stroke-width="3"/>
    <rect x="830" y="728" width="180" height="28" rx="14" fill="#fbbf24" opacity=".22"/>
    <text class="role" x="920" y="748" text-anchor="middle">Exception boundary</text>
    <text class="card-title" x="960" y="802" text-anchor="middle">Migration approved</text>
    <text class="body" x="960" y="842" text-anchor="middle">Mapping + consent</text>
    <text class="code-small" x="960" y="874" text-anchor="middle">ProductVersionMigrationApproved</text>
  </g>
    <g class="node-card">
    <rect id="plan-revision-v2" x="1170" y="710" width="300" height="230" rx="26" fill="url(#revisionFill)" stroke="#a78bfa" stroke-width="3"/>
    <rect x="1190" y="728" width="180" height="28" rx="14" fill="#a78bfa" opacity=".22"/>
    <text class="role" x="1280" y="748" text-anchor="middle">Reservation service</text>
    <text class="card-title" x="1320" y="802" text-anchor="middle">Plan revision v2</text>
    <text class="body" x="1320" y="842" text-anchor="middle">Future items only</text>
    <text class="body" x="1320" y="874" text-anchor="middle">Same Plan · immutable</text>
  </g>
    <g class="node-card">
    <rect id="crm-handoff" x="1530" y="710" width="300" height="230" rx="26" fill="url(#revisionFill)" stroke="#a78bfa" stroke-width="3"/>
    <rect x="1550" y="728" width="180" height="28" rx="14" fill="#a78bfa" opacity=".22"/>
    <text class="role" x="1640" y="748" text-anchor="middle">Counseling decides</text>
    <text class="card-title" x="1680" y="802" text-anchor="middle">CRM · counseling handoff</text>
    <text class="body" x="1680" y="842" text-anchor="middle">Decline · reschedule result</text>
    <text class="body" x="1680" y="874" text-anchor="middle">Pass objective facts</text>
  </g>
  </g>

  <g id="edges">
    <path class="connector primary-line" data-connector="catalog-v1-purchase-a-v1" data-source-node="catalog-v1" data-target-node="purchase-a-v1" d="M 390 375 H 450"/>
    <path class="connector primary-line" data-connector="purchase-a-v1-plan-v1" data-source-node="purchase-a-v1" data-target-node="plan-v1" d="M 750 375 H 810"/>
    <path class="connector primary-line" data-connector="plan-v1-completed-protected" data-source-node="plan-v1" data-target-node="completed-protected" d="M 1110 375 H 1170"/>
    <path class="connector primary-line" data-connector="plan-v1-confirmed-protected" data-source-node="plan-v1" data-target-node="confirmed-protected" d="M 960 260 V 190 Q 960 170 980 170 H 1660 Q 1680 170 1680 190 V 260"/>
    <path class="connector branch-line" data-connector="catalog-v2-new-purchase-v2" data-source-node="catalog-v2" data-target-node="new-purchase-v2" d="M 390 825 H 450"/>
    <path class="connector branch-line" data-connector="new-purchase-v2-migration-approved" data-source-node="new-purchase-v2" data-target-node="migration-approved" d="M 750 825 H 810"/>
    <path class="connector branch-line" data-connector="catalog-v2-migration-approved" data-source-node="catalog-v2" data-target-node="migration-approved" d="M 240 940 V 970 Q 240 990 260 990 H 880 Q 900 990 900 970 V 940"/>
    <path class="connector primary-line" data-connector="migration-approved-plan-revision-v2" data-source-node="migration-approved" data-target-node="plan-revision-v2" d="M 1110 825 H 1170"/>
    <path class="connector primary-line" data-connector="migration-approved-crm-handoff" data-source-node="migration-approved" data-target-node="crm-handoff" d="M 980 940 V 1000 Q 980 1020 1000 1020 H 1480 Q 1500 1020 1500 1000 V 845 Q 1500 825 1510 825 H 1530"/>
    <path class="connector primary-line" data-connector="migration-approved-confirmed-protected" data-source-node="migration-approved" data-target-node="confirmed-protected" d="M 900 710 V 650 Q 900 630 920 630 H 1660 Q 1680 630 1680 610 V 490"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="1090" width="1740" height="62" rx="20" fill="#0b1628" stroke="#2b4168" stroke-width="2"/>
    <text class="footer-title" x="118" y="1118">Reading rule</text>
    <text class="footer-body" x="300" y="1118">Publishing catalog v2 does not redeploy an existing Plan. Completed, in-progress, and confirmed visits remain intact.</text>
    <text class="footer-body" x="118" y="1143">Only pending future items may enter a new revision after mapping and patient consent; a decline is handed to CRM and counseling.</text>
  </g>
</svg>
