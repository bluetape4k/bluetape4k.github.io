<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc" data-locale="ko">
  <title id="title">환자 A의 5회 구매 권리가 한 번씩 방문이 되는 흐름</title>
  <desc id="desc">환자 A의 5회 구매가 다섯 개의 PlannedTreatment를 가진 하나의 AppointmentPlan이 된다. 다음 후보 하나가 한 번의 확정 방문이 되고, 완료 근거가 used를 1로 바꾸며 잔여 의무는 4개가 된다. 일정 변경·취소, 노쇼, 부분 완료는 별도 예외로 남는다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset=".58" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/>
    </linearGradient>
    <linearGradient id="mainFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#102b49"/><stop offset="1" stop-color="#17214a"/></linearGradient>
    <linearGradient id="serviceFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#103b45"/><stop offset="1" stop-color="#15364d"/></linearGradient>
    <linearGradient id="exceptionFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b2b18"/><stop offset="1" stop-color="#2a2138"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#020617" flood-opacity=".56"/></filter>
    <marker id="cyanArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#67e8f9" data-solid-head="true"/>
    </marker>
    <marker id="amberArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#fbbf24" data-solid-head="true"/>
    </marker>
    <style>
      .title{font-family:"goorm Sans",sans-serif;font-size:42px;font-weight:700;fill:#f8fafc}
      .subtitle{font-family:"goorm Sans",sans-serif;font-size:20px;fill:#aebed2}
      .statement{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:23px;font-weight:700;fill:#67e8f9}
      .lane{font-family:"goorm Sans",sans-serif;font-size:25px;font-weight:700;fill:#f8fafc}
      .lane-note{font-family:"goorm Sans",sans-serif;font-size:15px;fill:#aebed2}
      .step{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:16px;font-weight:700;fill:#dbeafe}
      .card-title{font-family:"goorm Sans",sans-serif;font-size:20px;font-weight:700;fill:#f8fafc}
      .body{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:13px;fill:#d7e3f3}
      .role{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:11px;font-weight:700;fill:#f8fafc}
      .small{font-family:"goorm Sans",sans-serif;font-size:14px;fill:#aebed2}
      .footer-title{font-family:"goorm Sans",sans-serif;font-size:18px;font-weight:700;fill:#f8fafc}
      .footer-body{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:13px;fill:#d7e3f3}
      .connector{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:5}
      .primary-line{stroke:#67e8f9;marker-end:url(#cyanArrow)}
      .branch-line{stroke:#fbbf24;marker-end:url(#amberArrow)}
    </style>
  </defs>

  <rect id="background" width="2000" height="1200" fill="url(#bg)"/>
  <rect x="40" y="32" width="1920" height="1136" rx="32" fill="none" stroke="#263a5e" stroke-width="2"/>
  <circle cx="1830" cy="150" r="250" fill="#7c3aed" opacity=".08"/>
  <circle cx="170" cy="1040" r="250" fill="#0891b2" opacity=".07"/>

  <text class="title" x="90" y="86">5회 구매 권리가 한 번씩 방문이 되는 흐름</text>
  <text class="subtitle" x="92" y="124">환자 A의 구매 권리, 확정 슬롯, 실제 진료 완료는 서로 다른 사실입니다.</text>
  <text class="statement" x="90" y="170">구매 권리 != 확정 방문 != 실제 완료</text>

  <g transform="translate(1290 88)">
    <rect x="0" y="-18" width="22" height="22" rx="7" fill="#102b49" stroke="#60a5fa" stroke-width="2"/>
    <text class="small" x="32" y="0">본 흐름</text>
    <rect x="116" y="-18" width="22" height="22" rx="7" fill="#3b2b18" stroke="#fbbf24" stroke-width="2"/>
    <text class="small" x="148" y="0">업무 예외</text>
    <rect x="228" y="-18" width="22" height="22" rx="7" fill="#103b45" stroke="#2dd4bf" stroke-width="2"/>
    <text class="small" x="260" y="0">완료 근거</text>
  </g>

  <text class="lane" x="90" y="222">환자 A의 한 번의 방문 주기</text>
  <text class="lane-note" x="90" y="248">계획에는 다섯 의무가 있지만, 다음 대상이 고객 동의를 얻은 뒤 한 번씩 달력에 들어갑니다.</text>
  <path d="M 90 264 H 1860" fill="none" stroke="#2b4168" stroke-width="2" stroke-dasharray="10 12"/>

  <g filter="url(#shadow)">
    <g class="node-card">
      <rect id="purchase-completed" x="70" y="300" width="240" height="220" rx="24" fill="url(#mainFill)" stroke="#60a5fa" stroke-width="3"/>
      <rect x="88" y="318" width="72" height="26" rx="13" fill="#60a5fa" opacity=".22"/>
      <text class="step" x="124" y="337" text-anchor="middle">T1</text>
      <text class="role" x="232" y="338" text-anchor="middle">커머스 기준정보</text>
      <text class="card-title" x="190" y="386" text-anchor="middle">PurchaseCompleted</text>
      <text class="body" x="190" y="428" text-anchor="middle">N회 권리 | total = 5</text>
      <text class="body" x="190" y="458" text-anchor="middle">구매 ID | 상품 version</text>
    </g>
    <g class="node-card">
      <rect id="plan-created" x="340" y="300" width="240" height="220" rx="24" fill="url(#mainFill)" stroke="#60a5fa" stroke-width="3"/>
      <rect x="358" y="318" width="72" height="26" rx="13" fill="#60a5fa" opacity=".22"/>
      <text class="step" x="394" y="337" text-anchor="middle">T2</text>
      <text class="role" x="500" y="338" text-anchor="middle">예약서비스</text>
      <text class="card-title" x="460" y="386" text-anchor="middle">AppointmentPlan</text>
      <text class="body" x="460" y="428" text-anchor="middle">PlannedTreatment 1..5</text>
      <text class="body" x="460" y="458" text-anchor="middle">간격 | 의존 관계 | 출처</text>
    </g>
    <g class="node-card">
      <rect id="rights-ledger" x="610" y="300" width="240" height="220" rx="24" fill="url(#mainFill)" stroke="#60a5fa" stroke-width="3"/>
      <rect x="628" y="318" width="72" height="26" rx="13" fill="#60a5fa" opacity=".22"/>
      <text class="step" x="664" y="337" text-anchor="middle">T3</text>
      <text class="role" x="778" y="338" text-anchor="middle">계획 조회 모델</text>
      <text class="card-title" x="730" y="386" text-anchor="middle">권리 원장</text>
      <text class="body" x="730" y="428" text-anchor="middle">total = 5 | used = 0</text>
      <text class="body" x="730" y="458" text-anchor="middle">remaining = 5 | slot != 권리</text>
    </g>
    <g class="node-card">
      <rect id="next-candidate" x="880" y="300" width="240" height="220" rx="24" fill="url(#mainFill)" stroke="#60a5fa" stroke-width="3"/>
      <rect x="898" y="318" width="72" height="26" rx="13" fill="#60a5fa" opacity=".22"/>
      <text class="step" x="934" y="337" text-anchor="middle">T4</text>
      <text class="role" x="1042" y="338" text-anchor="middle">예약서비스</text>
      <text class="card-title" x="1000" y="386" text-anchor="middle">다음 후보</text>
      <text class="body" x="1000" y="428" text-anchor="middle">이행 가능한 항목 하나</text>
      <text class="body" x="1000" y="458" text-anchor="middle">간격 | 수용량 | 희망 일정</text>
    </g>
    <g class="node-card">
      <rect id="confirmed-visit" x="1150" y="300" width="240" height="220" rx="24" fill="url(#serviceFill)" stroke="#2dd4bf" stroke-width="3"/>
      <rect x="1168" y="318" width="72" height="26" rx="13" fill="#2dd4bf" opacity=".22"/>
      <text class="step" x="1204" y="337" text-anchor="middle">T5</text>
      <text class="role" x="1300" y="338" text-anchor="middle">고객 동의</text>
      <text class="card-title" x="1270" y="386" text-anchor="middle">CONFIRMED 방문 1</text>
      <text class="body" x="1270" y="428" text-anchor="middle">Appointment 하나 | 슬롯 하나</text>
      <text class="body" x="1270" y="458" text-anchor="middle">완료 전에는 사용 아님</text>
    </g>
    <g class="node-card">
      <rect id="completion-fact" x="1420" y="300" width="240" height="220" rx="24" fill="url(#serviceFill)" stroke="#2dd4bf" stroke-width="3"/>
      <rect x="1438" y="318" width="72" height="26" rx="13" fill="#2dd4bf" opacity=".22"/>
      <text class="step" x="1474" y="337" text-anchor="middle">T6</text>
      <text class="role" x="1572" y="338" text-anchor="middle">임상 기준정보</text>
      <text class="card-title" x="1540" y="386" text-anchor="middle">완료 근거</text>
      <text class="body" x="1540" y="428" text-anchor="middle">임상 기준정보의 완료 이벤트</text>
      <text class="body" x="1540" y="458" text-anchor="middle">완료 뒤 used += 1</text>
    </g>
    <g class="node-card">
      <rect id="remaining-rights" x="1690" y="300" width="240" height="220" rx="24" fill="url(#serviceFill)" stroke="#2dd4bf" stroke-width="3"/>
      <rect x="1708" y="318" width="72" height="26" rx="13" fill="#2dd4bf" opacity=".22"/>
      <text class="step" x="1744" y="337" text-anchor="middle">T7</text>
      <text class="role" x="1842" y="338" text-anchor="middle">다음 회차 입력</text>
      <text class="card-title" x="1810" y="386" text-anchor="middle">remaining = 4</text>
      <text class="body" x="1810" y="428" text-anchor="middle">다음 항목은 아직 계획 상태</text>
      <text class="body" x="1810" y="458" text-anchor="middle">후보를 다시 계산 | 슬롯 아님</text>
    </g>
  </g>

  <g id="main-edges">
    <path class="connector primary-line" data-connector="purchase-completed-plan-created" data-source-node="purchase-completed" data-target-node="plan-created" d="M 310 410 H 340"/>
    <path class="connector primary-line" data-connector="plan-created-rights-ledger" data-source-node="plan-created" data-target-node="rights-ledger" d="M 580 410 H 610"/>
    <path class="connector primary-line" data-connector="rights-ledger-next-candidate" data-source-node="rights-ledger" data-target-node="next-candidate" d="M 850 410 H 880"/>
    <path class="connector primary-line" data-connector="next-candidate-confirmed-visit" data-source-node="next-candidate" data-target-node="confirmed-visit" d="M 1120 410 H 1150"/>
    <path class="connector primary-line" data-connector="confirmed-visit-completion-fact" data-source-node="confirmed-visit" data-target-node="completion-fact" d="M 1390 410 H 1420"/>
    <path class="connector primary-line" data-connector="completion-fact-remaining-rights" data-source-node="completion-fact" data-target-node="remaining-rights" d="M 1660 410 H 1690"/>
  </g>

  <text class="lane-note" x="90" y="585">남은 PlannedTreatment마다 선행 완료 시각을 기준으로 다음 후보 주기를 새로 시작합니다.</text>
  <text class="lane" x="90" y="640">업무 예외 레일</text>
  <text class="lane-note" x="90" y="666">일정 변경, 노쇼, 부분 진료는 권리 소진과 같은 사실이 아닙니다.</text>
  <path d="M 90 682 H 1860" fill="none" stroke="#5a4520" stroke-width="2" stroke-dasharray="10 12"/>

  <g filter="url(#shadow)">
    <g class="node-card">
      <rect id="reschedule-cancel" x="70" y="800" width="560" height="220" rx="24" fill="url(#exceptionFill)" stroke="#fbbf24" stroke-width="3"/>
      <rect x="92" y="818" width="152" height="26" rx="13" fill="#fbbf24" opacity=".22"/>
      <text class="role" x="168" y="837" text-anchor="middle">환자 | 커머스 | 운영</text>
      <text class="card-title" x="350" y="886" text-anchor="middle">일정 변경 또는 취소</text>
      <text class="body" x="350" y="928" text-anchor="middle">구매 권리와 상태 이력을 보존</text>
      <text class="body" x="350" y="958" text-anchor="middle">새 제안 | 외부 취소 판단</text>
    </g>
    <g class="node-card">
      <rect id="no-show" x="720" y="800" width="560" height="220" rx="24" fill="url(#exceptionFill)" stroke="#fbbf24" stroke-width="3"/>
      <rect x="742" y="818" width="128" height="26" rx="13" fill="#fbbf24" opacity=".22"/>
      <text class="role" x="806" y="837" text-anchor="middle">내원 | CRM 정책</text>
      <text class="card-title" x="1000" y="886" text-anchor="middle">NO_SHOW</text>
      <text class="body" x="1000" y="928" text-anchor="middle">내원 사실이며 자동 소진은 아님</text>
      <text class="body" x="1000" y="958" text-anchor="middle">정책 검토 | 상담 handoff</text>
    </g>
    <g class="node-card">
      <rect id="partial-completion" x="1370" y="800" width="560" height="220" rx="24" fill="url(#exceptionFill)" stroke="#fbbf24" stroke-width="3"/>
      <rect x="1392" y="818" width="142" height="26" rx="13" fill="#fbbf24" opacity=".22"/>
      <text class="role" x="1463" y="837" text-anchor="middle">임상 기준정보 | 예약</text>
      <text class="card-title" x="1650" y="886" text-anchor="middle">부분 완료</text>
      <text class="body" x="1650" y="928" text-anchor="middle">완료 항목은 완료 상태로 유지</text>
      <text class="body" x="1650" y="958" text-anchor="middle">미완료 업무는 연결된 재시도로 이연</text>
    </g>
  </g>

  <g id="exception-edges">
    <path class="connector branch-line" data-connector="next-candidate-reschedule-cancel" data-source-node="next-candidate" data-target-node="reschedule-cancel" d="M 1000 520 V 600 Q 1000 630 970 630 H 380 Q 350 630 350 660 V 800"/>
    <path class="connector branch-line" data-connector="confirmed-visit-no-show" data-source-node="confirmed-visit" data-target-node="no-show" d="M 1270 520 V 660 Q 1270 700 1230 700 H 1030 Q 1000 700 1000 730 V 800"/>
    <path class="connector branch-line" data-connector="completion-fact-partial-completion" data-source-node="completion-fact" data-target-node="partial-completion" d="M 1540 520 V 720 Q 1540 750 1570 750 H 1620 Q 1650 750 1650 780 V 800"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="1080" width="1860" height="70" rx="20" fill="#0b1628" stroke="#2b4168" stroke-width="2"/>
    <text class="footer-title" x="98" y="1110">읽는 규칙</text>
    <text class="footer-body" x="230" y="1110">CONFIRMED 슬롯은 소진된 권리가 아닙니다. 완료와 기준정보 원천의 취소 판단이 원장을 바꿉니다.</text>
    <text class="footer-body" x="98" y="1136">일정 변경·노쇼·부분 완료는 각자의 사실로 남기고, 잔여 의무에 대해서만 다음 후보를 다시 계산합니다.</text>
  </g>
</svg>
