<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Parallel enrichment Flow rail diagram</title>
  <desc id="desc">A Flow diagram showing one order split into independent customer, inventory, and discount rails, then folded back with sequential.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ed8ff" stroke="#9ed8ff"/></marker>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <linearGradient id="operatorGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#26384f"/><stop offset="100%" stop-color="#172033"/></linearGradient>
    <filter id="panelShadow" x="-8%" y="-12%" width="116%" height="124%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
    <filter id="laneGlow" x="-4%" y="-120%" width="108%" height="340%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.35"/></filter>
    <style>
      .bg { fill: url(#bgGradient); } .panel { fill: url(#panelGradient); stroke: #536377; stroke-width: 2; rx: 18; filter: url(#panelShadow); }
      .title { font: 24px "Architects Daughter", "Comic Mono", system-ui, sans-serif; fill: #f8fafc; }
      .sub,.small { font: 13px "Comic Mono", ui-monospace, monospace; fill: #b6c4d6; }
      .label { font: 15px "Comic Mono", ui-monospace, monospace; fill: #e5edf7; }
      .tiny { font: 11px "Comic Mono", ui-monospace, monospace; fill: #f8fafc; text-anchor: middle; dominant-baseline: middle; font-weight: 700; }
      .edge { stroke: #9ed8ff; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); filter: url(#laneGlow); }
      .rail { stroke: #9ed8ff; stroke-width: 3; fill: none; marker-end: url(#arrow); filter: url(#laneGlow); }
      .box { fill: #172033; stroke-width: 2.5; rx: 14; } .op { fill: url(#operatorGradient); stroke: #7dd3fc; }
    </style>
  </defs>
  <rect class="bg" width="920" height="460"/><rect class="panel" x="24" y="22" width="872" height="416"/>
  <text class="title" x="52" y="58">parallel enrichment: split independent work, then fold back</text>
  <text class="sub" x="52" y="84">parallel rails are safe only when each rail owns independent work and sequential() is explicit</text>
  <text class="small" x="52" y="184">orders</text><path class="edge" d="M150 180 L284 180"/>
  <rect class="box" x="184" y="158" width="92" height="44" stroke="#159c92"/><text class="tiny" x="230" y="180">O-1001</text>
  <rect class="box op" x="316" y="158" width="120" height="44"/><text class="label" x="376" y="185" text-anchor="middle">parallel(3)</text>
  <path class="rail" d="M 436 180 C 482 180 482 130 520 130"/>
  <path class="rail" d="M 436 180 C 482 180 482 220 520 220"/>
  <path class="rail" d="M 436 180 C 482 180 482 310 520 310"/>
  <rect class="box" x="530" y="108" width="150" height="44" stroke="#4c8cc8"/><text class="tiny" x="605" y="130">customer -> GOLD</text>
  <rect class="box" x="530" y="198" width="150" height="44" stroke="#c58b2a"/><text class="tiny" x="605" y="220">discount -> 10%</text>
  <rect class="box" x="530" y="288" width="150" height="44" stroke="#62984d"/><text class="tiny" x="605" y="310">inventory -> true</text>
  <path class="rail" d="M 680 130 C 726 130 726 220 768 220"/>
  <path class="rail" d="M 680 220 C 726 220 726 220 768 220"/>
  <path class="rail" d="M 680 310 C 726 310 726 220 768 220"/>
  <rect class="box op" x="720" y="198" width="124" height="44"/><text class="label" x="782" y="225" text-anchor="middle">sequential()</text>
  <text class="small" x="52" y="384">output</text><path class="edge" d="M150 380 L806 380"/>
  <rect class="box" x="502" y="358" width="254" height="44" stroke="#8b6bd6"/><text class="tiny" x="629" y="380">O-1001 GOLD, 10%, fulfillable</text>
</svg>
