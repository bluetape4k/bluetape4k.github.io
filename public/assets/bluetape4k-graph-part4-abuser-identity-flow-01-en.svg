<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1500" height="780"/>
<rect class="frame" x="34" y="28" width="1432" height="724" rx="24"/>
<text class="title" x="750" y="82" text-anchor="middle">Abuser Detection Identity Flow</text>
<text class="subtitle" x="750" y="118" text-anchor="middle">Start from one user, traverse shared identifiers, then rank suspicious clusters</text>
<path class="edge" data-connector="seed-to-ids" d="M410 363 L427 363 Q444 363 444 345 L444 274 Q444 256 462 256 L490 256"/>
<path class="edge" data-connector="ids-to-users" d="M830 256 L900 256"/>
<path class="edge" data-connector="seed-to-paths" d="M410 399 L438 399 Q456 399 456 417 L456 508 Q456 526 473 526 L490 526"/>
<path class="edge" data-connector="paths-to-rank" d="M830 526 L848 526 Q865 526 865 517 L865 517 Q865 508 883 508 L900 508"/>
<path class="edge" data-connector="users-to-rank" d="M1070 327 L1070 373 Q1070 391 1079 391 L1079 391 Q1088 391 1088 409 L1088 455"/>
<g id="seed">
  <rect x="90" y="310" width="320" height="142" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="250" y="367.5" text-anchor="middle">Seed User</text>
  <text class="nodeBody" x="250" y="401.5" text-anchor="middle">userId from login, order,</text>
  <text class="nodeBody" x="250" y="424.5" text-anchor="middle">or moderation event</text>
</g>
<g id="ids">
  <rect x="490" y="185" width="340" height="142" rx="12" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="660" y="242.5" text-anchor="middle">Shared Identifiers</text>
  <text class="nodeBody" x="660" y="276.5" text-anchor="middle">device, IP, phone hash</text>
  <text class="nodeBody" x="660" y="299.5" text-anchor="middle">payment token, referral</text>
</g>
<g id="users">
  <rect x="900" y="185" width="340" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1070" y="242.5" text-anchor="middle">Related Users</text>
  <text class="nodeBody" x="1070" y="276.5" text-anchor="middle">reverse traversal from identifiers</text>
  <text class="nodeBody" x="1070" y="299.5" text-anchor="middle">exclude seed user</text>
</g>
<g id="paths">
  <rect x="490" y="455" width="340" height="142" rx="12" fill="#4C1D95" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="660" y="512.5" text-anchor="middle">Suspicion Evidence</text>
  <text class="nodeBody" x="660" y="546.5" text-anchor="middle">explain edge paths</text>
  <text class="nodeBody" x="660" y="569.5" text-anchor="middle">cycle detection</text>
</g>
<g id="rank">
  <rect x="900" y="455" width="340" height="142" rx="12" fill="#134E4A" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1070" y="512.5" text-anchor="middle">Risk Ranking</text>
  <text class="nodeBody" x="1070" y="546.5" text-anchor="middle">PageRank topK</text>
  <text class="nodeBody" x="1070" y="569.5" text-anchor="middle">cluster review queue</text>
</g>
<rect x="88" y="684" width="1324" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="750" y="709" text-anchor="middle">The workshop keeps raw phone and card data out of the graph: use hashes and PCI-safe payment tokens.</text>
<text class="footer" x="750" y="733" text-anchor="middle">The example teaches traversal shape first; production systems still need scoring and operational guardrails.</text>
</svg>
