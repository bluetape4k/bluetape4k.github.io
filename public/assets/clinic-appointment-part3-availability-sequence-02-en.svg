<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1760" viewBox="0 0 2400 1760" role="img" aria-labelledby="title desc">
  <title id="title">Appointment availability query sequence</title>
  <desc id="desc">When a user requests available appointment times, the API calls the calculation service. The service reads clinic, holiday, doctor, and treatment data and checks full-day blockers. For an open date, it computes effective time ranges, checks existing appointments and equipment for each candidate, and returns only bookable times.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f" />
      <stop offset="0.58" stop-color="#0c1730" />
      <stop offset="1" stop-color="#10142a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity="0.55" />
    </filter>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f9fc4" stroke="#5f9fc4" stroke-dasharray="none" />
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#88a86b" stroke="#88a86b" stroke-dasharray="none" />
    </marker>
    <marker id="arrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c99a58" stroke="#c99a58" stroke-dasharray="none" />
    </marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c46b6b" stroke="#c46b6b" stroke-dasharray="none" />
    </marker>
    <style>
      .title { font-family: 'Architects Daughter', cursive; font-size: 44px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #a9b8d4; }
      .frame { fill: none; stroke: #2b4168; stroke-width: 2; }
      .participantCard { fill: #13233b; stroke: #5b789d; stroke-width: 2; filter: url(#shadow); }
      .participantTitle { font-family: 'Architects Daughter', cursive; font-size: 21px; font-weight: 700; fill: #f8fafc; }
      .role { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #9fb0ca; }
      .lifeline { stroke: #52647f; stroke-width: 2; stroke-dasharray: 8 9; }
      .activation { fill: #203b4d; stroke: #73a5bd; stroke-width: 1.6; }
      .activation-green { fill: #30483f; stroke: #88a86b; stroke-width: 1.6; }
      .seq { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .seqReturn { fill: none; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; }
      .labelPill { fill: #101b30; stroke-width: 1.5; }
      .labelText { font-family: 'Comic Mono', monospace; font-size: 16px; font-weight: 700; }
      .badgeText { font-family: 'Comic Mono', monospace; font-size: 14px; font-weight: 700; }
      .altBox { fill: none; stroke: #c46b6b; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .loopBox { fill: none; stroke: #c99a58; stroke-width: 2.2; stroke-dasharray: 12 8; }
      .frameLabel { fill: #101b30; stroke-width: 1.5; }
      .frameText { font-family: 'Comic Mono', monospace; font-size: 16px; font-weight: 700; }
      .note { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #c7d3e7; }
      .noteStrong { font-family: 'Architects Daughter', cursive; font-size: 18px; font-weight: 700; fill: #f1d6a7; }
    </style>
  </defs>

  <rect width="2400" height="1760" rx="34" fill="url(#canvas)" />
  <rect class="frame" x="30" y="28" width="2340" height="1704" rx="30" />
  <text class="title" x="1200" y="74" text-anchor="middle">How Appointment Availability Is Calculated</text>
  <text class="subtitle" x="1200" y="110" text-anchor="middle">query · schedule data · effective ranges · appointment and equipment checks</text>

  <!-- participants and lifelines -->
  <g id="participant-user">
    <rect class="participantCard" x="45" y="150" width="230" height="92" rx="16" />
    <text class="participant participantTitle" x="160" y="188" text-anchor="middle">User</text>
    <text class="role" x="160" y="218" text-anchor="middle">patient · clinic staff</text>
    <line class="lifeline" x1="160" y1="242" x2="160" y2="1605" />
  </g>
  <g id="participant-api">
    <rect class="participantCard" x="395" y="150" width="250" height="92" rx="16" />
    <text class="participant participantTitle" x="520" y="188" text-anchor="middle">Availability API</text>
    <text class="role" x="520" y="218" text-anchor="middle">SlotController</text>
    <line class="lifeline" x1="520" y1="242" x2="520" y2="1605" />
  </g>
  <g id="participant-service">
    <rect class="participantCard" x="720" y="150" width="280" height="92" rx="16" />
    <text class="participant participantTitle" x="860" y="188" text-anchor="middle">Availability Calculator</text>
    <text class="role" x="860" y="218" text-anchor="middle">SlotCalculationService</text>
    <line class="lifeline" x1="860" y1="242" x2="860" y2="1605" />
  </g>
  <g id="participant-range">
    <rect class="participantCard" x="1060" y="150" width="260" height="92" rx="16" />
    <text class="participant participantTitle" x="1190" y="188" text-anchor="middle">Time Range</text>
    <text class="role" x="1190" y="218" text-anchor="middle">TimeRange</text>
    <line class="lifeline" x1="1190" y1="242" x2="1190" y2="1605" />
  </g>
  <g id="participant-clinic">
    <rect class="participantCard" x="1390" y="150" width="270" height="92" rx="16" />
    <text class="participant participantTitle" x="1525" y="188" text-anchor="middle">Clinic &amp; Holiday Data</text>
    <text class="role" x="1525" y="218" text-anchor="middle">clinic · closures · hours</text>
    <line class="lifeline" x1="1525" y1="242" x2="1525" y2="1605" />
  </g>
  <g id="participant-doctor">
    <rect class="participantCard" x="1730" y="150" width="270" height="92" rx="16" />
    <text class="participant participantTitle" x="1865" y="188" text-anchor="middle">Doctor &amp; Treatment Data</text>
    <text class="role" x="1865" y="218" text-anchor="middle">hours · absence · treatment</text>
    <line class="lifeline" x1="1865" y1="242" x2="1865" y2="1605" />
  </g>
  <g id="participant-resource">
    <rect class="participantCard" x="2070" y="150" width="280" height="92" rx="16" />
    <text class="participant participantTitle" x="2210" y="188" text-anchor="middle">Appointment &amp; Equipment</text>
    <text class="role" x="2210" y="218" text-anchor="middle">overlaps · equipment status</text>
    <line class="lifeline" x1="2210" y1="242" x2="2210" y2="1605" />
  </g>

  <!-- activation bars -->
  <rect class="activation" x="512" y="320" width="16" height="1268" rx="5" />
  <rect class="activation" x="852" y="400" width="16" height="1088" rx="5" />
  <rect class="activation-green" x="1517" y="480" width="16" height="108" rx="5" />
  <rect class="activation-green" x="1857" y="640" width="16" height="108" rx="5" />
  <rect class="activation-green" x="1182" y="980" width="16" height="108" rx="5" />
  <rect class="activation-green" x="2202" y="1138" width="16" height="238" rx="5" />

  <!-- 1 -->
  <g id="m1">
    <rect class="labelPill" x="218" y="270" width="244" height="38" rx="19" stroke="#5f9fc4" />
    <circle cx="239" cy="289" r="14" fill="#173148" stroke="#5f9fc4" />
    <text class="badgeText" x="239" y="294" text-anchor="middle" fill="#a8d6ee">1</text>
    <text class="labelText" x="350" y="295" text-anchor="middle" fill="#a8d6ee">query availability</text>
    <path class="seq" d="M 160 330 H 520" stroke="#5f9fc4" marker-end="url(#arrow-blue)" />
  </g>

  <!-- 2 -->
  <g id="m2">
    <rect class="labelPill" x="555" y="350" width="270" height="38" rx="19" stroke="#5f9fc4" />
    <circle cx="576" cy="369" r="14" fill="#173148" stroke="#5f9fc4" />
    <text class="badgeText" x="576" y="374" text-anchor="middle" fill="#a8d6ee">2</text>
    <text class="labelText" x="702" y="375" text-anchor="middle" fill="#a8d6ee">pass query criteria</text>
    <path class="seq" d="M 520 410 H 860" stroke="#5f9fc4" marker-end="url(#arrow-blue)" />
  </g>

  <!-- 3 -->
  <g id="m3">
    <rect class="labelPill" x="1040" y="430" width="305" height="38" rx="19" stroke="#5f9fc4" />
    <circle cx="1061" cy="449" r="14" fill="#173148" stroke="#5f9fc4" />
    <text class="badgeText" x="1061" y="454" text-anchor="middle" fill="#a8d6ee">3</text>
    <text class="labelText" x="1204" y="455" text-anchor="middle" fill="#a8d6ee">read clinic and closures</text>
    <path class="seq" d="M 860 490 H 1525" stroke="#5f9fc4" marker-end="url(#arrow-blue)" />
  </g>

  <!-- 4 -->
  <g id="m4">
    <rect class="labelPill" x="1030" y="510" width="325" height="38" rx="19" stroke="#5ab3aa" />
    <circle cx="1051" cy="529" r="14" fill="#173d3e" stroke="#5ab3aa" />
    <text class="badgeText" x="1051" y="534" text-anchor="middle" fill="#a9e4df">4</text>
    <text class="labelText" x="1204" y="535" text-anchor="middle" fill="#a9e4df">hours and blockers</text>
    <path class="seqReturn" d="M 1525 570 H 860" stroke="#5ab3aa" />
    <polygon points="874,562 860,570 874,578" fill="#5ab3aa" stroke="#5ab3aa" stroke-dasharray="none" data-direct-solid-head="true" />
  </g>

  <!-- 5 -->
  <g id="m5">
    <rect class="labelPill" x="1200" y="590" width="325" height="38" rx="19" stroke="#5f9fc4" />
    <circle cx="1221" cy="609" r="14" fill="#173148" stroke="#5f9fc4" />
    <text class="badgeText" x="1221" y="614" text-anchor="middle" fill="#a8d6ee">5</text>
    <text class="labelText" x="1374" y="615" text-anchor="middle" fill="#a8d6ee">read doctor and treatment data</text>
    <path class="seq" d="M 860 650 H 1865" stroke="#5f9fc4" marker-end="url(#arrow-blue)" />
  </g>

  <!-- 6 -->
  <g id="m6">
    <rect class="labelPill" x="1210" y="670" width="305" height="38" rx="19" stroke="#5ab3aa" />
    <circle cx="1231" cy="689" r="14" fill="#173d3e" stroke="#5ab3aa" />
    <text class="badgeText" x="1231" y="694" text-anchor="middle" fill="#a9e4df">6</text>
    <text class="labelText" x="1374" y="695" text-anchor="middle" fill="#a9e4df">hours, absence, and treatment</text>
    <path class="seqReturn" d="M 1865 730 H 860" stroke="#5ab3aa" />
    <polygon points="874,722 860,730 874,738" fill="#5ab3aa" stroke="#5ab3aa" stroke-dasharray="none" data-direct-solid-head="true" />
  </g>

  <!-- early-exit alt -->
  <g id="alt-whole-day-blocked">
    <rect class="altBox" x="430" y="770" width="1050" height="150" rx="20" />
    <rect class="frameLabel" x="458" y="750" width="400" height="38" rx="19" stroke="#c46b6b" />
    <text class="frameText" x="658" y="775" text-anchor="middle" fill="#efb1b1">alt holiday · full-day closure · doctor absent</text>
  </g>
  <g id="m7">
    <rect class="labelPill" x="570" y="800" width="240" height="38" rx="19" stroke="#c46b6b" />
    <circle cx="591" cy="819" r="14" fill="#42262e" stroke="#c46b6b" />
    <text class="badgeText" x="591" y="824" text-anchor="middle" fill="#efb1b1">7</text>
    <text class="labelText" x="702" y="825" text-anchor="middle" fill="#efb1b1">return an empty list</text>
    <path class="seqReturn" d="M 860 860 H 520" stroke="#c46b6b" />
    <polygon points="534,852 520,860 534,868" fill="#c46b6b" stroke="#c46b6b" stroke-dasharray="none" data-direct-solid-head="true" />
  </g>

  <!-- 8 -->
  <g id="m8">
    <rect class="labelPill" x="895" y="930" width="260" height="38" rx="19" stroke="#88a86b" />
    <circle cx="916" cy="949" r="14" fill="#2c3b32" stroke="#88a86b" />
    <text class="badgeText" x="916" y="954" text-anchor="middle" fill="#c9dda8">8</text>
    <text class="labelText" x="1037" y="955" text-anchor="middle" fill="#c9dda8">compute effective ranges</text>
    <path class="seq" d="M 860 990 H 1190" stroke="#88a86b" marker-end="url(#arrow-green)" />
  </g>

  <!-- 9 -->
  <g id="m9">
    <rect class="labelPill" x="900" y="1010" width="250" height="38" rx="19" stroke="#5ab3aa" />
    <circle cx="921" cy="1029" r="14" fill="#173d3e" stroke="#5ab3aa" />
    <text class="badgeText" x="921" y="1034" text-anchor="middle" fill="#a9e4df">9</text>
    <text class="labelText" x="1037" y="1035" text-anchor="middle" fill="#a9e4df">usable ranges</text>
    <path class="seqReturn" d="M 1190 1070 H 860" stroke="#5ab3aa" />
    <polygon points="874,1062 860,1070 874,1078" fill="#5ab3aa" stroke="#5ab3aa" stroke-dasharray="none" data-direct-solid-head="true" />
  </g>

  <!-- 10 -->
  <g id="m10">
    <rect class="labelPill" x="1385" y="1090" width="330" height="38" rx="19" stroke="#c99a58" />
    <circle cx="1406" cy="1109" r="14" fill="#423324" stroke="#c99a58" />
    <text class="badgeText" x="1406" y="1114" text-anchor="middle" fill="#f1d6a7">10</text>
    <text class="labelText" x="1562" y="1115" text-anchor="middle" fill="#f1d6a7">read equipment and maintenance</text>
    <path class="seq" d="M 860 1150 H 2210" stroke="#c99a58" marker-end="url(#arrow-amber)" />
  </g>

  <!-- candidate loop -->
  <g id="loop-candidates">
    <rect class="loopBox" x="710" y="1190" width="1570" height="230" rx="20" />
    <rect class="frameLabel" x="738" y="1170" width="350" height="38" rx="19" stroke="#c99a58" />
    <text class="frameText" x="913" y="1195" text-anchor="middle" fill="#f1d6a7">loop for each candidate start time</text>
  </g>
  <g id="m11">
    <rect class="labelPill" x="1320" y="1210" width="460" height="38" rx="19" stroke="#c99a58" />
    <circle cx="1341" cy="1229" r="14" fill="#423324" stroke="#c99a58" />
    <text class="badgeText" x="1341" y="1234" text-anchor="middle" fill="#f1d6a7">11</text>
    <text class="labelText" x="1556" y="1235" text-anchor="middle" fill="#f1d6a7">check overlaps and equipment usage</text>
    <path class="seq" d="M 860 1270 H 2210" stroke="#c99a58" marker-end="url(#arrow-amber)" />
  </g>
  <g id="m12">
    <rect class="labelPill" x="1370" y="1300" width="360" height="38" rx="19" stroke="#5ab3aa" />
    <circle cx="1391" cy="1319" r="14" fill="#173d3e" stroke="#5ab3aa" />
    <text class="badgeText" x="1391" y="1324" text-anchor="middle" fill="#a9e4df">12</text>
    <text class="labelText" x="1556" y="1325" text-anchor="middle" fill="#a9e4df">remaining capacity and equipment</text>
    <path class="seqReturn" d="M 2210 1360 H 860" stroke="#5ab3aa" />
    <polygon points="874,1352 860,1360 874,1368" fill="#5ab3aa" stroke="#5ab3aa" stroke-dasharray="none" data-direct-solid-head="true" />
  </g>

  <!-- 13 -->
  <g id="m13">
    <rect class="labelPill" x="555" y="1440" width="270" height="38" rx="19" stroke="#88a86b" />
    <circle cx="576" cy="1459" r="14" fill="#2c3b32" stroke="#88a86b" />
    <text class="badgeText" x="576" y="1464" text-anchor="middle" fill="#c9dda8">13</text>
    <text class="labelText" x="702" y="1465" text-anchor="middle" fill="#c9dda8">bookable time list</text>
    <path class="seqReturn" d="M 860 1500 H 520" stroke="#88a86b" />
    <polygon points="534,1492 520,1500 534,1508" fill="#88a86b" stroke="#88a86b" stroke-dasharray="none" data-direct-solid-head="true" />
  </g>

  <!-- 14 -->
  <g id="m14">
    <rect class="labelPill" x="225" y="1520" width="230" height="38" rx="19" stroke="#88a86b" />
    <circle cx="246" cy="1539" r="14" fill="#2c3b32" stroke="#88a86b" />
    <text class="badgeText" x="246" y="1544" text-anchor="middle" fill="#c9dda8">14</text>
    <text class="labelText" x="350" y="1545" text-anchor="middle" fill="#c9dda8">selectable times</text>
    <path class="seqReturn" d="M 520 1580 H 160" stroke="#88a86b" />
    <polygon points="174,1572 160,1580 174,1588" fill="#88a86b" stroke="#88a86b" stroke-dasharray="none" data-direct-solid-head="true" />
  </g>

  <!-- solver responsibility boundary -->
  <g id="solver-boundary">
    <rect x="200" y="1640" width="2000" height="68" rx="16" fill="#1d2737" stroke="#c99a58" stroke-width="1.8" />
    <text class="noteStrong" x="1200" y="1669" text-anchor="middle">Global schedule optimization follows a separate path</text>
    <text class="note" x="1200" y="1698" text-anchor="middle">SolverService reads every appointment and resource in the date range; Timefold compares complete schedules · Part 4</text>
  </g>
</svg>
