<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Workshop cache-benchmark 전략 계약</title>
  <desc id="desc">공유 ProductCacheService API 아래 read-through, write-through, write-behind service write path를 비교합니다.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font-family: "goorm Sans", "goorm Sans Code", "Apple SD Gothic Neo", sans-serif; font-size: 46px; fill: #22314a; }
      .subtitle { font-family: "goorm Sans Code", "goorm Sans", "Apple SD Gothic Neo", monospace; font-size: 22px; fill: #52627a; }
      .card-title { font-family: "goorm Sans Code", "goorm Sans", "Apple SD Gothic Neo", monospace; font-size: 27px; font-weight: 700; fill: #253247; }
      .card-text { font-family: "goorm Sans Code", "goorm Sans", "Apple SD Gothic Neo", monospace; font-size: 21px; fill: #43536b; }
      .label { font-family: "goorm Sans Code", "goorm Sans", "Apple SD Gothic Neo", monospace; font-size: 20px; fill: #365074; }
      .tag { font-family: "goorm Sans Code", "goorm Sans", "Apple SD Gothic Neo", monospace; font-size: 18px; fill: #5d6b80; }
      .note { font-family: "goorm Sans Code", "goorm Sans", "Apple SD Gothic Neo", monospace; font-size: 19px; fill: #52627a; }
      .api { fill: #fff6dc; stroke: #d4942a; stroke-width: 3; }
      .service { fill: #e8f3ff; stroke: #86a9cf; stroke-width: 3; }
      .db { fill: #eef6e8; stroke: #91b77c; stroke-width: 3; }
      .redis { fill: #fff0ed; stroke: #ce9a8f; stroke-width: 3; }
      .worker { fill: #f1ecff; stroke: #9b8bc9; stroke-width: 3; }
      .row { fill: #ffffff; stroke: #d7e0eb; stroke-width: 2; }
      .row-alt { fill: #fbfdff; stroke: #d7e0eb; stroke-width: 2; }
      .arrow { fill: none; stroke: #4f7fc1; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .arrow-muted { fill: none; stroke: #7b90ad; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-muted); }
      .arrow-async { fill: none; stroke: #8a6fc4; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 8; marker-end: url(#arrow-purple); }
    </style>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#4f7fc1" stroke="#4f7fc1" stroke-dasharray="none" style="stroke-dasharray:none" />
    </marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 Z" fill="#7b90ad" stroke="#7b90ad" stroke-dasharray="none" style="stroke-dasharray:none" />
    </marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#8a6fc4" stroke="#8a6fc4" stroke-dasharray="none" style="stroke-dasharray:none" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1120" />
  <text class="title" x="54" y="72">Workshop cache-benchmark 전략 계약</text>
  <text class="subtitle" x="58" y="111">같은 ProductCacheService API, 다른 write semantics</text>

  <rect class="api" x="392" y="140" width="816" height="84" rx="18" />
  <text class="card-title" x="486" y="174">공유 interface</text>
  <text class="card-text" x="486" y="205">findById / save / evict / clearAll</text>

  <rect class="row" x="54" y="270" width="1492" height="210" rx="24" />
  <rect class="service" x="92" y="320" width="350" height="112" rx="22" />
  <text class="card-title" x="125" y="365">ReadThroughService</text>
  <text class="card-text" x="125" y="398">cache miss 시 DB load</text>

  <rect class="db" x="600" y="320" width="300" height="112" rx="22" />
  <text class="card-title" x="648" y="365">Product DB</text>
  <text class="card-text" x="638" y="398">먼저 save</text>

  <rect class="redis" x="1090" y="320" width="330" height="112" rx="22" />
  <text class="card-title" x="1138" y="365">Redis cache</text>
  <text class="card-text" x="1123" y="398">명시적 update</text>

  <path class="arrow" d="M 442 376 H 585" />
  <text class="label" x="474" y="354">persist</text>
  <path class="arrow-muted" d="M 900 376 H 1075" />
  <text class="label" x="943" y="354">cache 반영</text>

  <rect class="row-alt" x="54" y="510" width="1492" height="210" rx="24" />
  <rect class="service" x="92" y="560" width="350" height="112" rx="22" />
  <text class="card-title" x="124" y="605">WriteThroughService</text>
  <text class="card-text" x="125" y="638">동기 dual-write</text>

  <rect class="db" x="600" y="548" width="300" height="92" rx="22" />
  <text class="card-title" x="648" y="586">Product DB</text>
  <text class="card-text" x="638" y="616">동기 save</text>

  <rect class="redis" x="1090" y="580" width="330" height="92" rx="22" />
  <text class="card-title" x="1138" y="618">Redis cache</text>
  <text class="card-text" x="1123" y="648">동기 set</text>

  <path class="arrow" d="M 442 598 H 585" />
  <text class="label" x="474" y="576">같은 request</text>
  <path class="arrow" d="M 442 650 H 1075" />
  <text class="label" x="720" y="690">save() 반환 전 cache set</text>

  <rect class="row" x="54" y="750" width="1492" height="300" rx="24" />
  <rect class="service" x="92" y="812" width="350" height="112" rx="22" />
  <text class="card-title" x="126" y="857">WriteBehindService</text>
  <text class="card-text" x="125" y="890">cache-first update</text>

  <rect class="redis" x="580" y="812" width="330" height="112" rx="22" />
  <text class="card-title" x="628" y="857">Redis cache</text>
  <text class="card-text" x="614" y="890">즉시 update</text>

  <rect class="worker" x="1038" y="812" width="290" height="112" rx="22" />
  <text class="card-title" x="1082" y="857">Async flusher</text>
  <text class="card-text" x="1078" y="890">proxy @Async</text>

  <rect class="db" x="1038" y="952" width="290" height="78" rx="20" />
  <text class="card-title" x="1090" y="1002">Product DB</text>

  <path class="arrow" d="M 442 868 H 565" />
  <text class="label" x="462" y="846">빠른 반환</text>
  <path class="arrow-async" d="M 910 868 H 1023" />
  <text class="label" x="934" y="846">나중에</text>
  <path class="arrow-async" d="M 1183 924 V 952" />
  <text class="label" x="1212" y="948">persist</text>

  <rect x="92" y="966" width="520" height="44" rx="18" fill="#fff8df" stroke="#d9ba58" stroke-width="2" />
  <text class="note" x="120" y="995">new entity: generated ID 때문에 DB 먼저</text>
</svg>
