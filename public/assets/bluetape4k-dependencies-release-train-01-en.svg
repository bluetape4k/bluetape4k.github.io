<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Verification Order for a Maven Central Release Train</title><desc id="desc">Retry only transient snapshot 403s; fail tests, 404s, and incompatibilities immediately.</desc><defs><marker id="arrow-cyan" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#36C5F0"/></marker><marker id="arrow-mint" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5EEAD4"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FBBF24"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FB7185"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A78BFA"/></marker></defs>
  <style>
  .bg{fill:#07111F}.panel{fill:#0D1B2D;stroke:#36536F;stroke-width:2}.card{fill:#10243A;stroke:#36536F;stroke-width:2}.card2{fill:#132B43;stroke:#36536F;stroke-width:2}
  .title{font:700 42px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}.sub{font:600 19px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}.h{font:700 24px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
  .body{font:600 17px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}.mono{font:700 16px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#E6F2FF}.small{font:600 14px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}
  .life{stroke:#36536F;stroke-width:2;stroke-dasharray:8 9}.act{fill:#123252;stroke:#36C5F0;stroke-width:2}
  .call{fill:none;stroke:#36C5F0;stroke-width:4;marker-end:url(#arrow-cyan)}.ok{fill:none;stroke:#5EEAD4;stroke-width:4;marker-end:url(#arrow-mint)}
  .warn{fill:none;stroke:#FBBF24;stroke-width:4;marker-end:url(#arrow-amber)}.err{fill:none;stroke:#FB7185;stroke-width:4;marker-end:url(#arrow-red)}
  .violet{fill:none;stroke:#A78BFA;stroke-width:4;marker-end:url(#arrow-violet)}.return{stroke-dasharray:10 8}
  .pill{fill:#10243A;stroke:#36536F;stroke-width:2}.frame{fill:none;stroke:#FB7185;stroke-width:2;stroke-dasharray:10 8}
  .axis{stroke:#36536F;stroke-width:2}.grid{stroke:#233B54;stroke-width:1}.footer{fill:#0B2238;stroke:#36536F;stroke-width:2}
  </style>
<rect width="1600" height="900" class="bg"/><rect x="32" y="32" width="1536" height="836" rx="30" class="panel frame"/>
<text x="78" y="98" class="title">Verification Order for a Maven Central Release Train</text><text x="80" y="138" class="sub subtitle">Freeze development inputs into stable versions; publish the central BOM only after every upstream artifact resolves.</text><rect x="60" y="250" width="250" height="210" rx="20" class="card"/>
<text x="84" y="294" class="h">Development snapshots</text><text x="84" y="332" class="body">Validate the next line</text><text x="84" y="362" class="body">Not a public contract</text><rect x="365" y="250" width="250" height="210" rx="20" class="card"/>
<text x="389" y="294" class="h">Freeze stable versions</text><text x="389" y="332" class="body">Pin release matrix</text><text x="389" y="362" class="body">Remove SNAPSHOT refs</text><rect x="670" y="250" width="250" height="210" rx="20" class="card"/>
<text x="694" y="294" class="h">Verify upstream BOMs</text><text x="694" y="332" class="body">Resolve from Central</text><text x="694" y="362" class="body">Publish missing only</text><rect x="975" y="250" width="250" height="210" rx="20" class="card2"/>
<text x="999" y="294" class="h">Publish central BOM</text><text x="999" y="332" class="body">Inspect POM first</text><text x="999" y="362" class="body">Publish last</text><rect x="1280" y="250" width="250" height="210" rx="20" class="card"/>
<text x="1304" y="294" class="h">Verify consumers</text><text x="1304" y="332" class="body">Workshops / examples</text><text x="1304" y="362" class="body">Use verified BOM</text><path d="M310 355 H347" class="call"/><text x="328.5" y="322" text-anchor="middle" class="small">freeze</text><path d="M615 355 H652" class="call"/><text x="633.5" y="322" text-anchor="middle" class="small">HTTP resolve</text><path d="M920 355 H957" class="ok"/><text x="938.5" y="322" text-anchor="middle" class="small">public contract</text><path d="M1225 355 H1262" class="call"/><text x="1243.5" y="322" text-anchor="middle" class="small">consumer sync</text><rect x="310" y="570" width="980" height="92" rx="20" class="card2"/><text x="800" y="626" text-anchor="middle" class="h">Defect after publish → no same-version replacement → new patch version</text>
    <rect x="120" y="755" width="1360" height="80" rx="20" class="footer"/><text x="800" y="804" text-anchor="middle" class="body">Retry only transient snapshot 403s; fail tests, 404s, and incompatibilities immediately.</text></svg>
