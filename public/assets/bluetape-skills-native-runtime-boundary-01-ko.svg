<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">네이티브 런타임의 책임 경계</title>
  <desc id="desc">Codex 주 세션은 네이티브 동작을 실행하고 보호된 런타임은 제한된 증거를 기록하는 구조도입니다.</desc>
  <style>
    .title { font-family: 'goorm Sans', 'Apple SD Gothic Neo', cursive; fill: #f2f7ff; font-size: 34px; }
    .region-title { font-family: 'goorm Sans', 'Apple SD Gothic Neo', cursive; fill: #f2f7ff; font-size: 21px; }
    .subtitle, .label, .small, .route-label { font-family: 'goorm Sans Code', 'SFMono-Regular', Consolas, monospace; }
    .subtitle { fill: #9fb5cc; font-size: 14px; }
    .label { fill: #dce9f7; font-size: 14px; }
    .small { fill: #9fb5cc; font-size: 12px; }
    .route-label { fill: #c9d8e8; font-size: 11px; }
    .connector { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020817" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 13 7 L 0 13 Z" fill="#6ee7ff"/>
    </marker>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 13 7 L 0 13 Z" fill="#4f8cff"/>
    </marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 13 7 L 0 13 Z" fill="#f5b942"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#07111f"/>
  <rect x="24" y="24" width="1152" height="672" rx="28" fill="#0a1728" stroke="#203a56" stroke-width="2"/>

  <text x="50" y="70" class="title">네이티브 동작은 네이티브 도구에, 증거는 영속 저장소에 둡니다.</text>
  <text x="52" y="103" class="subtitle">주 세션이 Codex 도구를 실행하고 제한된 의도, 결과, 복구 증거를 기록합니다.</text>

  <!-- Responsibility regions -->
  <g filter="url(#shadow)">
    <rect x="50" y="160" width="230" height="410" rx="24" fill="#10243a" stroke="#6ee7ff" stroke-width="2.5"/>
    <rect x="340" y="160" width="230" height="410" rx="24" fill="#10243a" stroke="#6ee7ff" stroke-width="2.5"/>
    <rect x="630" y="160" width="250" height="410" rx="24" fill="#10243a" stroke="#4f8cff" stroke-width="2.5"/>
    <rect x="940" y="160" width="210" height="410" rx="24" fill="#10243a" stroke="#f5b942" stroke-width="2.5"/>
  </g>

  <text x="165" y="202" text-anchor="middle" class="region-title">주 세션</text>
  <text x="165" y="227" text-anchor="middle" class="small">작업 조정 책임</text>
  <text x="455" y="202" text-anchor="middle" class="region-title">Codex 네이티브 도구</text>
  <text x="455" y="227" text-anchor="middle" class="small">에이전트 동작 실행</text>
  <text x="755" y="193" text-anchor="middle" class="region-title">보호된 증거</text>
  <text x="755" y="217" text-anchor="middle" class="region-title">런타임</text>
  <text x="755" y="242" text-anchor="middle" class="small">기록만 하고 작업을 조정하지 않음</text>
  <text x="1045" y="193" text-anchor="middle" class="region-title">매니페스트 / 작업 원장</text>
  <text x="1045" y="217" text-anchor="middle" class="region-title">/ 구성</text>
  <text x="1045" y="242" text-anchor="middle" class="small">영속 작업 흐름 상태</text>

  <!-- Main session cards -->
  <g filter="url(#shadow)">
    <rect x="76" y="263" width="178" height="74" rx="14" fill="#15304b" stroke="#3e7593" stroke-width="1.5"/>
    <rect x="76" y="366" width="178" height="74" rx="14" fill="#15304b" stroke="#3e7593" stroke-width="1.5"/>
    <rect x="76" y="469" width="178" height="74" rx="14" fill="#15304b" stroke="#3e7593" stroke-width="1.5"/>
  </g>
  <text x="165" y="293" text-anchor="middle" class="label">다음 동작 결정</text>
  <text x="165" y="316" text-anchor="middle" class="small">lane + owner epoch</text>
  <text x="165" y="396" text-anchor="middle" class="label">네이티브 도구 호출</text>
  <text x="165" y="419" text-anchor="middle" class="small">주 세션 권한</text>
  <text x="165" y="499" text-anchor="middle" class="label">완료 검증</text>
  <text x="165" y="522" text-anchor="middle" class="small">가장 약한 구성 요소</text>

  <!-- Native tool cards: these actions appear nowhere else -->
  <g filter="url(#shadow)">
    <rect x="366" y="263" width="178" height="60" rx="14" fill="#15304b" stroke="#3e7593" stroke-width="1.5"/>
    <rect x="366" y="339" width="178" height="60" rx="14" fill="#15304b" stroke="#3e7593" stroke-width="1.5"/>
    <rect x="366" y="415" width="178" height="60" rx="14" fill="#15304b" stroke="#3e7593" stroke-width="1.5"/>
    <rect x="366" y="491" width="178" height="52" rx="14" fill="#15304b" stroke="#3e7593" stroke-width="1.5"/>
  </g>
  <text x="455" y="299" text-anchor="middle" class="label">spawn</text>
  <text x="455" y="375" text-anchor="middle" class="label">send</text>
  <text x="455" y="451" text-anchor="middle" class="label">wait</text>
  <text x="455" y="523" text-anchor="middle" class="label">interrupt</text>

  <!-- Guarded runtime cards -->
  <g filter="url(#shadow)">
    <rect x="658" y="275" width="194" height="68" rx="14" fill="#152b4c" stroke="#4f8cff" stroke-width="1.5"/>
    <rect x="658" y="366" width="194" height="68" rx="14" fill="#152b4c" stroke="#4f8cff" stroke-width="1.5"/>
    <rect x="658" y="457" width="194" height="68" rx="14" fill="#152b4c" stroke="#4f8cff" stroke-width="1.5"/>
  </g>
  <text x="755" y="304" text-anchor="middle" class="label">의도</text>
  <text x="755" y="326" text-anchor="middle" class="small">네이티브 동작 전</text>
  <text x="755" y="395" text-anchor="middle" class="label">관찰 증거</text>
  <text x="755" y="417" text-anchor="middle" class="small">네이티브 결과 후</text>
  <text x="755" y="486" text-anchor="middle" class="label">제한된 작업 원장</text>
  <text x="755" y="508" text-anchor="middle" class="small">보호된 CLI 기록</text>

  <!-- Durable state cards -->
  <g filter="url(#shadow)">
    <rect x="965" y="275" width="160" height="64" rx="14" fill="#253044" stroke="#f5b942" stroke-width="1.5"/>
    <rect x="965" y="359" width="160" height="64" rx="14" fill="#253044" stroke="#f5b942" stroke-width="1.5"/>
    <rect x="965" y="443" width="160" height="82" rx="14" fill="#163a35" stroke="#4fd18b" stroke-width="2"/>
  </g>
  <text x="1045" y="304" text-anchor="middle" class="label">전체 작업 + 실행 단위 상태</text>
  <text x="1045" y="326" text-anchor="middle" class="small">owner epoch</text>
  <text x="1045" y="388" text-anchor="middle" class="label">작업 원장 연결 구조</text>
  <text x="1045" y="410" text-anchor="middle" class="small">재생 + 진단</text>
  <text x="1045" y="476" text-anchor="middle" class="label">검증된 종료 상태</text>
  <text x="1045" y="498" text-anchor="middle" class="small">필수 증거 전체</text>

  <!-- Responsibility-correct routes. No runtime-to-native connector exists. -->
  <path class="connector" d="M 280 286 H 340" stroke="#6ee7ff" marker-end="url(#arrow-cyan)"/>
  <path class="connector" d="M 340 386 H 280" stroke="#4f8cff" stroke-dasharray="9 7" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 165 160 V 136 Q 165 126 175 126 H 745 Q 755 126 755 136 V 160" stroke="#6ee7ff" marker-end="url(#arrow-cyan)"/>
  <path class="connector" d="M 880 400 H 940" stroke="#4f8cff" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 1045 570 V 594 Q 1045 604 1035 604 H 175 Q 165 604 165 594 V 570" stroke="#f5b942" stroke-dasharray="9 7" marker-end="url(#arrow-amber)"/>

  <!-- Route badges -->
  <g font-family="'goorm Sans Code', 'SFMono-Regular', Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="310" cy="286" r="11" fill="#07111f" stroke="#6ee7ff"/><text x="310" y="290" fill="#6ee7ff">1</text>
    <circle cx="310" cy="386" r="11" fill="#07111f" stroke="#4f8cff"/><text x="310" y="390" fill="#4f8cff">2</text>
    <circle cx="460" cy="126" r="11" fill="#07111f" stroke="#6ee7ff"/><text x="460" y="130" fill="#6ee7ff">3</text>
    <circle cx="910" cy="400" r="11" fill="#07111f" stroke="#4f8cff"/><text x="910" y="404" fill="#4f8cff">4</text>
    <circle cx="605" cy="604" r="11" fill="#07111f" stroke="#f5b942"/><text x="605" y="608" fill="#f5b942">5</text>
  </g>

  <!-- Compact legend and route key -->
  <g transform="translate(52 636)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#6ee7ff" stroke-width="3.5" stroke-linecap="round"/>
    <text x="44" y="4" class="small">실선: 동작 / 기록</text>
    <line x1="196" y1="0" x2="230" y2="0" stroke="#4f8cff" stroke-width="3.5" stroke-dasharray="8 6" stroke-linecap="round"/>
    <text x="240" y="4" class="small">점선: 관찰 / 복구</text>
    <rect x="470" y="-10" width="24" height="20" rx="6" fill="#163a35" stroke="#4fd18b" stroke-width="2"/>
    <text x="504" y="4" class="small">검증된 완료</text>
  </g>
  <text x="52" y="677" class="route-label">1 네이티브 동작 실행</text>
  <text x="270" y="677" class="route-label">2 실행 결과 관찰</text>
  <text x="448" y="677" class="route-label">3 의도 / 증거 기록</text>
  <text x="688" y="677" class="route-label">4 보호된 상태 기록</text>
  <text x="896" y="677" class="route-label">5 재개 / 복구 증거</text>
</svg>
