<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="984" viewBox="0 0 1380 984" role="img" aria-labelledby="title desc">
<title id="title">Workshop Cache 벤치마크 profile</title>
<desc id="desc">bluetape4k-workshop cache-benchmark의 read/write throughput입니다. 높을수록 좋습니다.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#4E7FC2"/></marker>
  <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#3C9B72"/></marker>
  <marker id="arrowAmber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#C98A22"/></marker>
  <marker id="arrowRose" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#C85A73"/></marker>
  <style>
    .canvas{fill:#F7F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:42px;fill:#22344A;font-weight:700}
    .subtitle{font-family:"goorm Sans Code","goorm Sans","Apple SD Gothic Neo",monospace;font-size:16px;fill:#536476;font-weight:400}
    .label{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:24px;fill:#22344A;font-weight:700}
    .smallLabel{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:20px;fill:#22344A;font-weight:700}
    .body{font-family:"goorm Sans Code","goorm Sans","Apple SD Gothic Neo",monospace;font-size:14px;fill:#34465B;font-weight:400}
    .small{font-family:"goorm Sans Code","goorm Sans","Apple SD Gothic Neo",monospace;font-size:12px;fill:#627184;font-weight:400}
    .num{font-family:"goorm Sans Code","goorm Sans","Apple SD Gothic Neo",monospace;font-size:16px;fill:#22344A;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.soft{stroke-width:1.6}
    .lineBlue{fill:none;stroke:#4E7FC2;stroke-width:2.4;marker-end:url(#arrowBlue)}
    .lineGreen{fill:none;stroke:#3C9B72;stroke-width:2.4;marker-end:url(#arrowGreen)}
    .lineAmber{fill:none;stroke:#C98A22;stroke-width:2.4;marker-end:url(#arrowAmber)}
    .lineRose{fill:none;stroke:#C85A73;stroke-width:2.4;marker-end:url(#arrowRose)}
    .dashBlue{fill:none;stroke:#4E7FC2;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#arrowBlue)}
    .dashGreen{fill:none;stroke:#3C9B72;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#arrowGreen)}
    .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.2}
  </style>
</defs>
<rect class="canvas" width="1380" height="984"/>
<rect class="frame" x="34" y="28" width="1312" height="928" rx="26"/>
<text class="title" x="70" y="82">Workshop Cache 벤치마크 profile</text>
<text class="subtitle" x="72" y="115">bluetape4k-workshop cache-benchmark의 read/write throughput입니다. 높을수록 좋습니다.</text><g transform="translate(0 44)">
<g>
  <rect class="card" x="72" y="148" width="230" height="86" rx="16" fill="#F5F7FB" stroke="#93A4B7"/>
  <text class="smallLabel" x="187" y="168" text-anchor="middle" dominant-baseline="middle">No Cache</text>
<text class="body" x="187" y="196" text-anchor="middle" dominant-baseline="middle">read ~8.2k</text>
<text class="body" x="187" y="214" text-anchor="middle" dominant-baseline="middle">write ~8.2k ops/s</text>
</g>
<g>
  <rect class="card" x="72" y="264" width="230" height="86" rx="16" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="187" y="284" text-anchor="middle" dominant-baseline="middle">Caffeine</text>
<text class="body" x="187" y="312" text-anchor="middle" dominant-baseline="middle">read ~490k</text>
<text class="body" x="187" y="330" text-anchor="middle" dominant-baseline="middle">write ~8.1k ops/s</text>
</g>
<g>
  <rect class="card" x="72" y="380" width="230" height="86" rx="16" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="187" y="400" text-anchor="middle" dominant-baseline="middle">Near Cache</text>
<text class="body" x="187" y="428" text-anchor="middle" dominant-baseline="middle">read ~465k</text>
<text class="body" x="187" y="446" text-anchor="middle" dominant-baseline="middle">write ~7.2k ops/s</text>
</g>
<g>
  <rect class="card" x="72" y="496" width="230" height="86" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="187" y="516" text-anchor="middle" dominant-baseline="middle">Redis Cache</text>
<text class="body" x="187" y="544" text-anchor="middle" dominant-baseline="middle">read ~43k</text>
<text class="body" x="187" y="562" text-anchor="middle" dominant-baseline="middle">write ~7.3k ops/s</text>
</g>
<g>
  <rect class="card" x="72" y="612" width="230" height="86" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="187" y="632" text-anchor="middle" dominant-baseline="middle">Write-Through</text>
<text class="body" x="187" y="660" text-anchor="middle" dominant-baseline="middle">read ~41k</text>
<text class="body" x="187" y="678" text-anchor="middle" dominant-baseline="middle">write ~5.6k ops/s</text>
</g>
<g>
  <rect class="card" x="72" y="728" width="230" height="86" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="187" y="748" text-anchor="middle" dominant-baseline="middle">Write-Behind</text>
<text class="body" x="187" y="776" text-anchor="middle" dominant-baseline="middle">read ~42k</text>
<text class="body" x="187" y="794" text-anchor="middle" dominant-baseline="middle">write ~24k ops/s</text>
</g>
<g><text class="smallLabel" x="395" y="132">Read throughput</text><rect x="395" y="166" width="12" height="28" rx="10" fill="#F5F7FB" stroke="#93A4B7"/><rect x="395" y="282" width="700" height="28" rx="10" fill="#EAF7EF" stroke="#58A978"/><rect x="395" y="398" width="664" height="28" rx="10" fill="#E9F7F6" stroke="#45A7A1"/><rect x="395" y="514" width="61" height="28" rx="10" fill="#FDECEF" stroke="#DC6B82"/><rect x="395" y="630" width="59" height="28" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><rect x="395" y="746" width="60" height="28" rx="10" fill="#FFF3D9" stroke="#D6A441"/></g>
<g><text class="smallLabel" x="1142" y="132">Write throughput</text><rect x="1142" y="166" width="68" height="28" rx="10" fill="#F5F7FB" stroke="#93A4B7"/><rect x="1142" y="282" width="67" height="28" rx="10" fill="#EAF7EF" stroke="#58A978"/><rect x="1142" y="398" width="59" height="28" rx="10" fill="#E9F7F6" stroke="#45A7A1"/><rect x="1142" y="514" width="60" height="28" rx="10" fill="#FDECEF" stroke="#DC6B82"/><rect x="1142" y="630" width="46" height="28" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><rect x="1142" y="746" width="198" height="28" rx="10" fill="#FFF3D9" stroke="#D6A441"/></g>
<path class="connector lineGreen" d="M302 296 H395"/><rect class="pill" x="316" y="264" width="72" height="24" rx="12"/><text class="small" x="352" y="280" text-anchor="middle">60x read</text>
<path class="connector lineGreen" d="M302 412 H395"/><rect class="pill" x="316" y="380" width="72" height="24" rx="12"/><text class="small" x="352" y="396" text-anchor="middle">57x read</text>
<path class="connector lineAmber" d="M302 760 H395"/><rect class="pill" x="318" y="728" width="64" height="24" rx="12"/><text class="small" x="350" y="744" text-anchor="middle">5x read</text>
<path class="connector lineAmber" d="M302 793 H1092 Q1108 793 1108 777 V776 Q1108 760 1124 760 H1142"/><rect class="pill" x="684" y="761" width="72" height="24" rx="12"/><text class="small" x="720" y="777" text-anchor="middle">3x write</text>
</g></svg>
