<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">CSV writer 처리량 비교</title>
  <desc id="desc">small, medium, large CSV writer workload에서 기존 Writer 경로와 Okio BufferedSink 처리량을 ops/s 기준으로 비교한 grouped bar chart입니다. 높을수록 좋습니다.</desc>
  <defs>
    <style>
      .title { font-family: 'goorm Sans', 'Apple SD Gothic Neo', sans-serif; font-size: 38px; fill: #243447; }
      .subtitle { font-family: 'goorm Sans Code', 'goorm Sans', monospace; font-size: 18px; fill: #5b677a; }
      .label { font-family: 'goorm Sans Code', 'goorm Sans', monospace; font-size: 16px; fill: #344054; }
      .small { font-family: 'goorm Sans Code', 'goorm Sans', monospace; font-size: 13px; fill: #667085; }
      .panel-title { font-family: 'goorm Sans', 'Apple SD Gothic Neo', sans-serif; font-size: 25px; fill: #26364a; }
      .value { font-family: 'goorm Sans Code', 'goorm Sans', monospace; font-size: 15px; font-weight: 700; fill: #26364a; }
      .speed { font-family: 'goorm Sans Code', 'goorm Sans', monospace; font-size: 15px; font-weight: 700; fill: #027a48; }
      .note { font-family: 'goorm Sans Code', 'goorm Sans', monospace; font-size: 14px; fill: #667085; }
    </style>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#98a2b3" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="1288" height="728" rx="24" fill="#fbfcff" stroke="#d8e1ef"/>
  <text x="44" y="70" class="title">CSV Writer 처리량: Writer vs Okio Sink</text>
  <text x="46" y="106" class="subtitle">ops/s, 높을수록 좋음. workload별 scale을 따로 두어 medium/large 구간의 차이를 읽기 쉽게 했습니다.</text>

  <g transform="translate(48,134)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#8aa9d6"/>
    <text x="28" y="15" class="label">기존 OutputStreamWriter 경로</text>
    <rect x="344" y="0" width="18" height="18" rx="4" fill="#4cc1a5"/>
    <text x="372" y="15" class="label">Okio BufferedSink UTF-8 경로</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="58" y="190" width="388" height="328" rx="18" fill="#ffffff" stroke="#d7e2f0"/>
  </g>
  <text x="82" y="230" class="panel-title">Small rows</text>
  <text x="342" y="230" class="speed">1.39x 빠름</text>
  <text x="82" y="262" class="small">기존</text>
  <rect x="86" y="274" width="326" height="34" rx="10" fill="#edf3fb"/>
  <rect x="86" y="274" width="215.40" height="34" rx="10" fill="#8aa9d6"/>
  <text x="312" y="297" class="value">11,741 ops/s</text>
  <text x="82" y="348" class="small">Okio</text>
  <rect x="86" y="360" width="326" height="34" rx="10" fill="#eaf8f4"/>
  <rect x="86" y="360" width="300.00" height="34" rx="10" fill="#4cc1a5"/>
  <text x="300" y="383" class="value">16,356 ops/s</text>
  <line x1="86" y1="424" x2="412" y2="424" stroke="#d0d8e6" stroke-width="1"/>
  <text x="86" y="448" class="small">0</text>
  <text x="302" y="448" class="small">16,356 ops/s</text>
  <text x="86" y="482" class="note">여기서는 setup cost 영향이 아직 큽니다.</text>

  <g filter="url(#softShadow)">
    <rect x="474" y="190" width="388" height="328" rx="18" fill="#ffffff" stroke="#d7e2f0"/>
  </g>
  <text x="498" y="230" class="panel-title">Medium rows</text>
  <text x="758" y="230" class="speed">3.06x 빠름</text>
  <text x="498" y="262" class="small">기존</text>
  <rect x="502" y="274" width="326" height="34" rx="10" fill="#edf3fb"/>
  <rect x="502" y="274" width="98.05" height="34" rx="10" fill="#8aa9d6"/>
  <text x="612" y="297" class="value">676 ops/s</text>
  <text x="498" y="348" class="small">Okio</text>
  <rect x="502" y="360" width="326" height="34" rx="10" fill="#eaf8f4"/>
  <rect x="502" y="360" width="300.00" height="34" rx="10" fill="#4cc1a5"/>
  <text x="716" y="383" class="value">2,069 ops/s</text>
  <line x1="502" y1="424" x2="828" y2="424" stroke="#d0d8e6" stroke-width="1"/>
  <text x="502" y="448" class="small">0</text>
  <text x="710" y="448" class="small">2,069 ops/s</text>
  <text x="502" y="482" class="note">streaming 경로의 격차가 본격적으로 벌어집니다.</text>

  <g filter="url(#softShadow)">
    <rect x="890" y="190" width="388" height="328" rx="18" fill="#ffffff" stroke="#d7e2f0"/>
  </g>
  <text x="914" y="230" class="panel-title">Large rows</text>
  <text x="1174" y="230" class="speed">3.25x 빠름</text>
  <text x="914" y="262" class="small">기존</text>
  <rect x="918" y="274" width="326" height="34" rx="10" fill="#edf3fb"/>
  <rect x="918" y="274" width="92.38" height="34" rx="10" fill="#8aa9d6"/>
  <text x="1022" y="297" class="value">83.8 ops/s</text>
  <text x="914" y="348" class="small">Okio</text>
  <rect x="918" y="360" width="326" height="34" rx="10" fill="#eaf8f4"/>
  <rect x="918" y="360" width="300.00" height="34" rx="10" fill="#4cc1a5"/>
  <text x="1132" y="383" class="value">272.2 ops/s</text>
  <line x1="918" y1="424" x2="1244" y2="424" stroke="#d0d8e6" stroke-width="1"/>
  <text x="918" y="448" class="small">0</text>
  <text x="1134" y="448" class="small">272.2 ops/s</text>
  <text x="918" y="482" class="note">large export 경로에서 이득이 가장 선명합니다.</text>

  <rect x="58" y="574" width="1220" height="86" rx="18" fill="#fff8e7" stroke="#efd799"/>
  <text x="82" y="610" class="panel-title">차트가 말하는 것</text>
  <text x="82" y="642" class="subtitle">Flow는 이미 row를 streaming합니다. Okio는 UTF-8 file path의 문자 계층 우회를 제거합니다.</text>

  <text x="44" y="714" class="subtitle">./gradlew :bluetape4k-csv:testBenchmark로 측정했습니다. 원본 표는 본문에 유지합니다.</text>
</svg>
