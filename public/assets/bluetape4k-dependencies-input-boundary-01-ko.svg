<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">입력 경계는 메모리 적재 전에 시작된다</title><desc id="desc">입력 크기, 메모리 적재, 처리 시간, 오류 응답을 하나의 경계 계약으로 검증합니다.</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#36C5F0"/></marker></defs>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0D1B2D;stroke:#36536F;stroke-width:2}.card{fill:#10243A;stroke:#36536F;stroke-width:2}
    .focus{fill:#0C3044;stroke:#5EEAD4;stroke-width:2.5}.warn{fill:#332B18;stroke:#FBBF24;stroke-width:2}
    .title{font:700 40px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}.subtitle{font:500 20px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
    .card-title{font:700 24px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}.body{font:600 18px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
    .chip{font:700 16px "goorm Sans Code","goorm Sans",monospace;fill:#5EEAD4}.label{font:700 16px "goorm Sans Code","goorm Sans",monospace;fill:#36C5F0}
    .connector{fill:none;stroke:#36C5F0;stroke-width:4;marker-end:url(#arrow)}.divider{stroke:#36536F;stroke-width:2}
    .footer{font:600 18px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
  </style>
  <rect width="1600" height="980" class="canvas"/><rect x="32" y="32" width="1536" height="916" rx="32" class="frame"/>
  <text x="80" y="98" class="title">입력 경계는 메모리 적재 전에 시작된다</text><text x="80" y="138" class="subtitle">저비용 검사를 먼저 수행하고, 디코딩 이후의 고비용 처리는 제한된 자원 안에서 실행합니다.</text>
  <rect x="60" y="245" width="250" height="210" rx="24" class="card"/>
  <text x="88" y="297" class="card-title">요청 수신</text>
  <text x="88" y="343" class="body">스트림 / 임시 파일</text>
<text x="88" y="381" class="body">요청 ID 부여</text>
<rect x="365" y="245" width="250" height="210" rx="24" class="card"/>
  <text x="393" y="297" class="card-title">저비용 검사</text>
  <text x="393" y="343" class="body">크기 / 콘텐츠 유형</text>
<text x="393" y="381" class="body">허용 형식</text>
<rect x="670" y="245" width="250" height="210" rx="24" class="focus"/>
  <text x="698" y="297" class="card-title">제한된 디코딩</text>
  <text x="698" y="343" class="body">최대 픽셀 / 문자열 길이</text>
<text x="698" y="381" class="body">타임아웃</text>
<rect x="975" y="245" width="250" height="210" rx="24" class="card"/>
  <text x="1003" y="297" class="card-title">기능 처리</text>
  <text x="1003" y="343" class="body">OCR / 토큰화 / 금칙어</text>
<text x="1003" y="381" class="body">정규화</text>
<rect x="1280" y="245" width="250" height="210" rx="24" class="card"/>
  <text x="1308" y="297" class="card-title">안전한 결과</text>
  <text x="1308" y="343" class="body">구조화된 응답</text>
<text x="1308" y="381" class="body">원문 없는 로그</text><path d="M310 350 H345" class="connector"/><text x="327.5" y="320" text-anchor="middle" class="label">검증</text>
<path d="M615 350 H650" class="connector"/><text x="632.5" y="320" text-anchor="middle" class="label">허용</text>
<path d="M920 350 H955" class="connector"/><text x="937.5" y="320" text-anchor="middle" class="label">처리</text>
<path d="M1225 350 H1260" class="connector"/><text x="1242.5" y="320" text-anchor="middle" class="label">응답</text>
    <rect x="655" y="590" width="280" height="150" rx="24" class="warn"/>
  <text x="683" y="642" class="card-title">조기 거부</text>
  <text x="683" y="688" class="body">413 / 415</text>
<text x="683" y="726" class="body">민감 정보 미노출</text>
    <path d="M795 455 V570" class="connector"/><text x="823" y="520" class="label">조기 거부</text><line x1="80" y1="830" x2="1520" y2="830" class="divider"/>
  <text x="800" y="884" text-anchor="middle" class="footer">입력 크기, 메모리 적재, 처리 시간, 오류 응답을 하나의 경계 계약으로 검증합니다.</text>
</svg>