<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">javers-exposed-ddd command and projection sequence</title>
  <desc id="desc">Sequence diagram replacing the README Mermaid source with an SVG and PNG asset.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/></marker>
    <style>
      .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:43px;fill:#F8FAFC;font-weight:400}
      .subtitle,.note{font-family:"Comic Mono";font-size:15px;fill:#CBD5E1;font-weight:400}
      .participant{font-family:"Architects Daughter";font-size:21px;fill:#F8FAFC;font-weight:400}
      .msg{font-family:"Comic Mono";font-size:13px;fill:#CBD5E1;font-weight:400}
      .header{filter:url(#shadow);stroke-width:2}.life{stroke:#475569;stroke-width:2;stroke-dasharray:6 7}
      .call{fill:none;stroke:#60A5FA;stroke-width:2.2;marker-end:url(#arrow)}.return{fill:none;stroke:#60A5FA;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .label{fill:#0F172A;stroke:#334155;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="760"/>
  <rect class="frame" x="34" y="28" width="1532" height="704" rx="28"/>
  <text class="title" x="72" y="84">javers-exposed-ddd command and projection sequence</text>
  <text class="subtitle" x="76" y="116">Preserves the README Mermaid flow: command persistence, JaVers commit, Kafka event, Redis projection, and read lookup.</text>
  <g transform="translate(70,152)">
    <g transform="translate(0,0)"><rect class="header" width="140" height="58" rx="12" fill="#0C4A6E" stroke="#75A9E8"/><text class="participant" x="70" y="35" text-anchor="middle">Client</text></g>
    <g transform="translate(180,0)"><rect class="header" width="190" height="58" rx="12" fill="#14532D" stroke="#69B888"/><text class="participant" x="95" y="35" text-anchor="middle">OrderCommandHandler</text></g>
    <g transform="translate(420,0)"><rect class="header" width="170" height="58" rx="12" fill="#0F172A" stroke="#DB7890"/><text class="participant" x="85" y="26" text-anchor="middle">Exposed</text><text class="msg" x="85" y="45" text-anchor="middle">order table</text></g>
    <g transform="translate(640,0)"><rect class="header" width="210" height="58" rx="12" fill="#831843" stroke="#DB7890"/><text class="participant" x="105" y="26" text-anchor="middle">ExposedCdo</text><text class="msg" x="105" y="45" text-anchor="middle">SnapshotRepository</text></g>
    <g transform="translate(900,0)"><rect class="header" width="150" height="58" rx="12" fill="#78350F" stroke="#D9AA4D"/><text class="participant" x="75" y="35" text-anchor="middle">Kafka topic</text></g>
    <g transform="translate(1090,0)"><rect class="header" width="210" height="58" rx="12" fill="#134E4A" stroke="#45A7A1"/><text class="participant" x="105" y="26" text-anchor="middle">Projection</text><text class="msg" x="105" y="45" text-anchor="middle">event consumer</text></g>
    <g transform="translate(1340,0)"><rect class="header" width="120" height="58" rx="12" fill="#4C1D95" stroke="#8A72D6"/><text class="participant" x="60" y="26" text-anchor="middle">Redis</text><text class="msg" x="60" y="45" text-anchor="middle">summary</text></g>
  </g>
  <g>
    <rect class="activation" x="337" y="265" width="16" height="345" rx="6" fill="#0C4A6E" stroke="#75A9E8"/><path class="life" d="M140 210 V675"/><path class="life" d="M345 210 V675"/><path class="life" d="M575 210 V675"/><path class="life" d="M815 210 V675"/><path class="life" d="M1045 210 V675"/><path class="life" d="M1265 210 V675"/><path class="life" d="M1470 210 V675"/>
    <path class="call" d="M140 250 H345"/><rect class="label" x="168" y="230" width="168" height="24" rx="8"/><text class="num" x="186" y="247" text-anchor="middle">1</text><text class="msg" x="260" y="247" text-anchor="middle">PlaceOrderCommand</text>
    <path class="call" d="M345 310 H575"/><rect class="label" x="382" y="290" width="180" height="24" rx="8"/><text class="num" x="400" y="307" text-anchor="middle">2</text><text class="msg" x="480" y="307" text-anchor="middle">insert/update Order</text>
    <path class="call" d="M345 370 H815"/><rect class="label" x="510" y="350" width="140" height="24" rx="8"/><text class="num" x="528" y="367" text-anchor="middle">3</text><text class="msg" x="588" y="367" text-anchor="middle">JaVers commit</text>
    <path class="call" d="M345 430 H1045"/><rect class="label" x="625" y="410" width="145" height="24" rx="8"/><text class="num" x="643" y="427" text-anchor="middle">4</text><text class="msg" x="705.5" y="427" text-anchor="middle">OrderPlaced</text>
    <path class="call" d="M1265 490 H1045"/><rect class="label" x="1070" y="470" width="165" height="24" rx="8"/><text class="num" x="1088" y="487" text-anchor="middle">5</text><text class="msg" x="1160.5" y="487" text-anchor="middle">poll event</text>
    <path class="call" d="M1265 550 H1470"/><rect class="label" x="1275" y="530" width="180" height="24" rx="8"/><text class="num" x="1293" y="547" text-anchor="middle">6</text><text class="msg" x="1373" y="547" text-anchor="middle">upsert summary</text>
    <path class="call" d="M140 610 H1320 Q1330 610 1330 620 V630 Q1330 640 1340 640 H1470"/><rect class="label" x="590" y="590" width="190" height="24" rx="8"/><text class="num" x="608" y="607" text-anchor="middle">7</text><text class="msg" x="693" y="607" text-anchor="middle">findSummary(orderId)</text>
    <path class="return" d="M1470 670 H140"/><rect class="label" x="720" y="650" width="170" height="24" rx="8"/><text class="num" x="738" y="667" text-anchor="middle">8</text><text class="msg" x="813" y="667" text-anchor="middle">OrderSummary</text>
  </g>
</svg>
