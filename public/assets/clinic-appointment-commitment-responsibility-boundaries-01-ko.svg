<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1180" viewBox="0 0 2200 1180" role="img" aria-labelledby="title desc">
  <title id="title">희망 내원 날짜와 예약 확정을 둘러싼 서비스 책임 경계</title>
  <desc id="desc">고객 채널과 동의 서비스는 희망과 동의 원문을, 예약서비스는 제안과 예약 확정 상태를, 병원 운영은 승인과 대안을, 자원 원장은 의료 자원 점유를, 임상서비스는 실제 완료를 소유한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".56" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".58"/></filter>
    <marker id="primary-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="primary" data-size="14x14" data-visible-size="28x28" data-tip-direction="positive-x"><path d="M -14 -7 L 14 7 L -14 21 Z" fill="#67e8f9" data-arrowhead="true" data-solid-head="true"/></marker>
    <marker id="secondary-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="secondary" data-size="10x10" data-visible-size="30x30" data-tip-direction="positive-x"><path d="M -20 -10 L 10 5 L -20 20 Z" fill="#fbbf24" data-arrowhead="true" data-solid-head="true" data-role="secondary" data-size="10x10" data-visible-size="30x30"/></marker>
    <style>
      .title{font-family:"goorm Sans",sans-serif;font-size:39px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"goorm Sans",sans-serif;font-size:18px;fill:#aebed2}.frame-title{font-family:"goorm Sans",sans-serif;font-size:25px;font-weight:700;fill:#f8fafc}.card-title{font-family:"goorm Sans",sans-serif;font-size:22px;font-weight:700;fill:#f8fafc}.body{font-family:"goorm Sans",sans-serif;font-size:16px;fill:#d7e3f3}.small{font-family:"goorm Sans",sans-serif;font-size:14px;fill:#aebed2}.code{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:14px;font-weight:700;fill:#f8fafc}.pill{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:13px;font-weight:700;fill:#f8fafc}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round}.primary{stroke:#67e8f9;stroke-width:4}.secondary{stroke:#fbbf24;stroke-width:3;stroke-dasharray:12 9}.source-card{fill:#18294a;stroke:#60a5fa;stroke-width:3;filter:url(#shadow)}.reservation-frame{fill:#0b1628;stroke:#345276;stroke-width:2}.reservation-card{fill:#143b4b;stroke:#67e8f9;stroke-width:3;filter:url(#shadow)}.policy-card{fill:#392b1e;stroke:#fbbf24;stroke-width:3;filter:url(#shadow)}.clinical-card{fill:#242047;stroke:#a78bfa;stroke-width:3;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="2200" height="1180" fill="url(#bg)"/><rect x="28" y="28" width="2144" height="1124" rx="30" fill="none" stroke="#263a5e" stroke-width="2"/>
  <text class="title" x="70" y="82">서비스별 책임: 희망 일정과 예약 확정의 경계</text><text class="subtitle" x="72" y="118">희망과 동의 원문, 일정 합의, 운영 승인, 자원 점유, 임상 완료는 서로 다른 책임 시스템이 소유한다.</text>

  <g id="customer"><rect class="source-card" x="80" y="245" width="470" height="250" rx="24"/><rect x="108" y="273" width="112" height="28" rx="14" fill="#60a5fa" opacity=".22"/><text class="pill" x="164" y="293" text-anchor="middle">원장·입력</text><text class="card-title" x="315" y="347" text-anchor="middle">고객 채널·동의 서비스</text><text class="body" x="315" y="389" text-anchor="middle">고객 희망 내원 날짜</text><text class="body" x="315" y="421" text-anchor="middle">제시 조건 · 동의 원문</text><text class="code" x="315" y="462" text-anchor="middle">검증용 증빙 참조</text></g>
  <g id="clinic"><rect class="policy-card" x="1650" y="215" width="470" height="230" rx="24"/><rect x="1678" y="243" width="92" height="28" rx="14" fill="#fbbf24" opacity=".22"/><text class="pill" x="1724" y="263" text-anchor="middle">판단</text><text class="card-title" x="1885" y="317" text-anchor="middle">병원 운영</text><text class="body" x="1885" y="359" text-anchor="middle">고객 요청 승인 · 대안 제안</text><text class="code" x="1885" y="400" text-anchor="middle">clinic approval authority</text></g>
  <g id="resource"><rect class="source-card" x="1650" y="535" width="470" height="230" rx="24"/><rect x="1678" y="563" width="92" height="28" rx="14" fill="#60a5fa" opacity=".22"/><text class="pill" x="1724" y="583" text-anchor="middle">원장</text><text class="card-title" x="1885" y="637" text-anchor="middle">자원 원장</text><text class="body" x="1885" y="679" text-anchor="middle">의료진 · 장비 · 공간 · 수용량</text><text class="code" x="1885" y="720" text-anchor="middle">ResourceAllocation</text></g>
  <g id="clinical"><rect class="clinical-card" x="1650" y="855" width="470" height="190" rx="24"/><rect x="1678" y="883" width="92" height="28" rx="14" fill="#a78bfa" opacity=".22"/><text class="pill" x="1724" y="903" text-anchor="middle">원장</text><text class="card-title" x="1885" y="955" text-anchor="middle">임상·시술 서비스</text><text class="body" x="1885" y="997" text-anchor="middle">실제 시작 · 완료 · 부분 완료</text></g>

  <rect class="reservation-frame" x="680" y="170" width="720" height="875" rx="30"/><text class="frame-title" x="720" y="222">예약서비스가 소유하는 정보</text><text class="small" x="720" y="252">제안, 상태, 적용 정책과 자원 점유 연결을 한 트랜잭션으로 관리한다.</text>
  <g id="proposal"><rect class="reservation-card" x="750" y="300" width="580" height="210" rx="24"/><rect x="778" y="328" width="92" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="824" y="348" text-anchor="middle">제안</text><text class="card-title" x="1040" y="400" text-anchor="middle">AppointmentProposal</text><text class="body" x="1040" y="440" text-anchor="middle">시간 · 항목 · 자원 후보 · 제안 해시</text><text class="code" x="1040" y="478" text-anchor="middle">PROPOSED · HELD</text></g>
  <g id="commitment"><rect class="reservation-card" x="750" y="610" width="580" height="230" rx="24"/><rect x="778" y="638" width="112" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="834" y="658" text-anchor="middle">예약 확정</text><text class="card-title" x="1040" y="710" text-anchor="middle">AppointmentCommitment</text><text class="body" x="1040" y="752" text-anchor="middle">confirmedProposalId · consent decision</text><text class="code" x="1040" y="792" text-anchor="middle">CONFIRMED + 적용 정책 기록</text></g>
  <rect x="750" y="910" width="580" height="90" rx="20" fill="#13233b" stroke="#345276" stroke-width="2"/><text class="small" x="1040" y="946" text-anchor="middle">보호 규칙</text><text class="body" x="1040" y="978" text-anchor="middle">새 제안이 실패해도 기존의 확정된 예약일시와 자원 점유를 유지한다.</text>

  <path class="connector primary" data-connector="customer-proposal" data-source="customer" data-target="proposal" d="M 550 370 H 750" marker-end="url(#primary-arrow)"/>
  <path class="connector primary" data-connector="proposal-commitment" data-source="proposal" data-target="commitment" d="M 1040 510 V 610" marker-end="url(#primary-arrow)"/>
  <path class="connector secondary" data-connector="clinic-proposal" data-source="clinic" data-target="proposal" d="M 1650 330 H 1480 Q 1440 330 1440 370 V 405 Q 1440 435 1410 435 H 1330" marker-end="url(#secondary-arrow)"/>
  <path class="connector primary" data-connector="proposal-resource" data-source="proposal" data-target="resource" d="M 1330 470 H 1460 Q 1500 470 1500 510 V 610 Q 1500 650 1540 650 H 1650" marker-end="url(#primary-arrow)"/>
  <path class="connector primary" data-connector="resource-commitment" data-source="resource" data-target="commitment" d="M 1650 710 H 1510 Q 1470 710 1470 750 V 775 Q 1470 805 1440 805 H 1330" marker-end="url(#primary-arrow)"/>
  <path class="connector secondary" data-connector="commitment-clinical" data-source="commitment" data-target="clinical" d="M 1330 825 H 1460 Q 1500 825 1500 865 V 915 Q 1500 950 1535 950 H 1650" marker-end="url(#secondary-arrow)"/>

  <rect x="80" y="850" width="470" height="195" rx="22" fill="#101f37" stroke="#345276" stroke-width="2"/><text class="small" x="112" y="892">경계의 읽는 규칙</text><text class="body" x="112" y="934">고객 채널은 희망과 동의를 전달한다.</text><text class="body" x="112" y="968">예약서비스는 일정 합의를 확정한다.</text><text class="body" x="112" y="1002">임상서비스는 진료 완료를 판단한다.</text>
</svg>
