<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="760" viewBox="0 0 1540 760" role="img">
<title>Core, Coroutines, Logging, Tests</title>
<desc>요청 코드와 검증 코드가 같은 작은 서비스 기반을 공유합니다.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020712" flood-opacity="0.45"/></filter>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#78AFFF"/></marker>
  <style>
    .bg{fill:#07111F}.frame{fill:#0D1B2D;stroke:#213B5E;stroke-width:2}
    .title{font-family:"goorm Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:36px;fill:#F7FAFF;font-weight:700}
    .subtitle,.body,.small{font-family:"goorm Sans Code","goorm Sans","D2Coding",monospace;fill:#C9D6E8}
    .subtitle{font-size:16px}.body{font-size:15px}.small{font-size:12px;fill:#8DA2BC}
    .label{font-family:"goorm Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:20px;fill:#F7FAFF;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke:#78AFFF;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bar-label{font-family:"goorm Sans Code","goorm Sans","D2Coding",monospace;font-size:15px;fill:#F7FAFF}.axis{stroke:#47627F;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1540" height="760"/>
<rect class="frame" x="34" y="28" width="1472" height="704" rx="24"/>
<text class="title" x="70" y="82">Core, Coroutines, Logging, Tests</text>
<text class="subtitle" x="72" y="114">요청 코드와 검증 코드가 같은 작은 서비스 기반을 공유합니다.</text>
<g data-card="서비스 코드">
  <rect class="card" x="60" y="315" width="220" height="116" rx="14" fill="#132D55" stroke="#68A7FF"/>
  <text class="label" x="170" y="349" text-anchor="middle"><tspan x="170" dy="0">서비스 코드</tspan></text>
  <text class="body" x="170" y="383" text-anchor="middle"><tspan x="170" dy="0">input · request</tspan><tspan x="170" dy="20">worker</tspan></text>
</g>
<g data-card="Core 검증">
  <rect class="card" x="340" y="315" width="250" height="116" rx="14" fill="#173B2A" stroke="#66D58D"/>
  <text class="label" x="465" y="349" text-anchor="middle"><tspan x="465" dy="0">Core 검증</tspan></text>
  <text class="body" x="465" y="383" text-anchor="middle"><tspan x="465" dy="0">require* helper</tspan><tspan x="465" dy="20">non-null invariant</tspan></text>
</g>
<g data-card="Coroutines">
  <rect class="card" x="650" y="315" width="250" height="116" rx="14" fill="#123D43" stroke="#4ED7C7"/>
  <text class="label" x="775" y="349" text-anchor="middle"><tspan x="775" dy="0">Coroutines</tspan></text>
  <text class="body" x="775" y="383" text-anchor="middle"><tspan x="775" dy="0">Deferred · Flow</tspan><tspan x="775" dy="20">cancellation policy</tspan></text>
</g>
<g data-card="Logging">
  <rect class="card" x="960" y="315" width="250" height="116" rx="14" fill="#443215" stroke="#F6C55F"/>
  <text class="label" x="1085" y="349" text-anchor="middle"><tspan x="1085" dy="0">Logging</tspan></text>
  <text class="body" x="1085" y="383" text-anchor="middle"><tspan x="1085" dy="0">lazy message</tspan><tspan x="1085" dy="20">suspend 경계의 MDC</tspan></text>
</g>
<g data-card="Tests">
  <rect class="card" x="1270" y="315" width="250" height="116" rx="14" fill="#2D255C" stroke="#B29DFF"/>
  <text class="label" x="1395" y="349" text-anchor="middle"><tspan x="1395" dy="0">Tests</tspan></text>
  <text class="body" x="1395" y="383" text-anchor="middle"><tspan x="1395" dy="0">assertions · junit5</tspan><tspan x="1395" dy="20">Testcontainers fixture</tspan></text>
</g>
<path class="connector" data-connector="service-to-core-validation" d="M280 373 H340"/>
<path class="connector" data-connector="core-validation-to-coroutines" d="M590 373 H650"/>
<path class="connector" data-connector="coroutines-to-logging" d="M900 373 H960"/>
<path class="connector" data-connector="logging-to-tests" d="M1210 373 H1270"/>
</svg>