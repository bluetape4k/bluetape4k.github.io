<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="900" viewBox="0 0 1580 900">
<defs><style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style></defs>
<rect class="canvas" width="1580" height="900"/>
<rect class="frame" x="34" y="28" width="1512" height="844" rx="24"/>
<text class="title" x="790" y="82" text-anchor="middle">TinkerGraph: 동기와 가상 스레드</text>
<text class="subtitle" x="790" y="118" text-anchor="middle">JMH AverageTime, 연산당 마이크로초, 낮을수록 빠르다</text>
<text class="axis" x="350" y="145">TinkerGraph 픽스처, 낮을수록 빠름</text>
<g>
  <text class="nodeBody" x="322" y="195" text-anchor="end">findVertexById 동기</text>
  <rect x="350" y="170" width="260" height="36" rx="9" fill="#0C4A6E" stroke="#64748B"/>
  <text class="nodeBody" x="628" y="195">1.800 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="258" text-anchor="end">findVertexById 가상 스레드 join</text>
  <rect x="350" y="233" width="558" height="36" rx="9" fill="#831843" stroke="#64748B"/>
  <text class="nodeBody" x="926" y="258">8.100 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="321" text-anchor="end">neighbors 동기</text>
  <rect x="350" y="296" width="350" height="36" rx="9" fill="#0C4A6E" stroke="#64748B"/>
  <text class="nodeBody" x="718" y="321">3.000 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="384" text-anchor="end">neighbors 가상 스레드 join</text>
  <rect x="350" y="359" width="620" height="36" rx="9" fill="#831843" stroke="#64748B"/>
  <text class="nodeBody" x="988" y="384">10.6 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="447" text-anchor="end">bfs 동기</text>
  <rect x="350" y="422" width="417" height="36" rx="9" fill="#0C4A6E" stroke="#64748B"/>
  <text class="nodeBody" x="785" y="447">4.200 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="510" text-anchor="end">bfs 가상 스레드 join</text>
  <rect x="350" y="485" width="660" height="36" rx="9" fill="#831843" stroke="#64748B"/>
  <text class="nodeBody" x="1028" y="510">12.6 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="573" text-anchor="end">pageRank 동기</text>
  <rect x="350" y="548" width="535" height="36" rx="9" fill="#0C4A6E" stroke="#64748B"/>
  <text class="nodeBody" x="903" y="573">7.300 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="636" text-anchor="end">pageRank 가상 스레드 join</text>
  <rect x="350" y="611" width="706" height="36" rx="9" fill="#831843" stroke="#64748B"/>
  <text class="nodeBody" x="1074" y="636">15.3 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="699" text-anchor="end">shortestPath 동기</text>
  <rect x="350" y="674" width="793" height="36" rx="9" fill="#0C4A6E" stroke="#64748B"/>
  <text class="nodeBody" x="1161" y="699">22.0 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="762" text-anchor="end">shortestPath 가상 스레드 join</text>
  <rect x="350" y="737" width="880" height="36" rx="9" fill="#831843" stroke="#64748B"/>
  <text class="nodeBody" x="1248" y="762">31.5 us/op</text>
</g>
<rect x="88" y="804" width="1404" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="790" y="829" text-anchor="middle">2026-04-17 TinkerGraph 픽스처 결과이며 네트워크 DB 처리량이 아니라 어댑터 비용을 보여준다.</text>
<text class="footer" x="790" y="853" text-anchor="middle">운영 판단에는 목표 동시성에서 별도의 백엔드 벤치마크가 필요하다.</text>
</svg>
