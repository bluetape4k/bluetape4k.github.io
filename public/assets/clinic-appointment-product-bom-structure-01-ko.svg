<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1300" viewBox="0 0 2200 1300" role="img" aria-labelledby="bom-ko-title bom-ko-desc">
  <title id="bom-ko-title">환자 A의 상품 BOM 구조와 예약 번역</title>
  <desc id="bom-ko-desc">패키지 상품의 구성 항목이 구매 시점 PackageExecutionSnapshot으로 고정된 뒤 AppointmentPlan revision, PlannedTreatment, AppointmentItem과 방문으로 번역되는 구조를 보여 준다.</desc>
  <defs>
    <linearGradient id="bom-ko-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.56" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <linearGradient id="bom-ko-product" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#162b45"/><stop offset="1" stop-color="#202049"/></linearGradient>
    <linearGradient id="bom-ko-reservation" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b4a"/><stop offset="1" stop-color="#192b4d"/></linearGradient>
    <filter id="bom-ko-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.58"/></filter>
    <marker id="bom-ko-primary-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M 1 1 L 14 7 L 1 13 Z" fill="#67e8f9" data-arrowhead="true" data-solid-head="true" data-role="primary" data-size="14x14"/></marker>
    <marker id="bom-ko-secondary-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="secondary" data-size="10x10" data-visible-size="20x20" data-tip-direction="positive-x"><path d="M -10 -5 L 10 5 L -10 15 Z" fill="#fbbf24" data-arrowhead="true" data-solid-head="true" data-role="secondary" data-size="10x10" data-visible-size="20x20"/></marker>
    <style>
      .title{font-family:"goorm Sans",sans-serif;font-size:40px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"goorm Sans",sans-serif;font-size:19px;fill:#aebed2}.frame-title{font-family:"goorm Sans",sans-serif;font-size:25px;font-weight:700;fill:#f8fafc}.card-title{font-family:"goorm Sans",sans-serif;font-size:21px;font-weight:700;fill:#f8fafc}.body{font-family:"goorm Sans",sans-serif;font-size:16px;fill:#d7e3f3}.small{font-family:"goorm Sans",sans-serif;font-size:14px;fill:#aebed2}.code{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:14px;font-weight:700;fill:#f8fafc}.pill{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:13px;font-weight:700;fill:#f8fafc}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round}.primary-line{stroke:#67e8f9;stroke-width:4}.constraint-line{stroke:#fbbf24;stroke-width:3;stroke-dasharray:10 8}.bom-frame{fill:#0b1628;stroke:#345276;stroke-width:2}.product-card{fill:url(#bom-ko-product);stroke:#60a5fa;stroke-width:3;filter:url(#bom-ko-shadow)}.reservation-card{fill:url(#bom-ko-reservation);stroke:#67e8f9;stroke-width:3;filter:url(#bom-ko-shadow)}.component-card{fill:#172a43;stroke:#4f83c4;stroke-width:2}.bus{fill:none;stroke:#67e8f9;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="2200" height="1300" fill="url(#bom-ko-bg)"/><rect x="28" y="28" width="2144" height="1244" rx="30" fill="none" stroke="#263a5e" stroke-width="2"/>
  <circle cx="2040" cy="120" r="230" fill="#7c3aed" opacity=".08"/><circle cx="120" cy="1160" r="250" fill="#0891b2" opacity=".07"/>
  <text class="title" x="70" y="82">환자 A: 상품 BOM 구조가 예약 단위로 번역되는 경로</text>
  <text class="subtitle" x="72" y="118">상품 구성은 구매 시점 snapshot으로 고정되고, 예약서비스는 항목·의존성·방문 묶음 제약을 계획과 방문 항목으로 전개한다.</text>
  <g transform="translate(1550 62)"><rect x="0" y="0" width="18" height="18" rx="5" fill="#162b45" stroke="#60a5fa" stroke-width="2"/><text class="small" x="28" y="15">상품 BOM 구성</text><rect x="180" y="0" width="18" height="18" rx="5" fill="#123b4a" stroke="#67e8f9" stroke-width="2"/><text class="small" x="208" y="15">예약 번역</text><rect x="336" y="0" width="18" height="18" rx="5" fill="#3a2816" stroke="#fbbf24" stroke-width="2"/><text class="small" x="364" y="15">묶음 제약</text></g>

  <rect class="bom-frame" x="70" y="190" width="910" height="990" rx="30"/><text class="frame-title" x="105" y="242">1. 상품 BOM 구성</text><text class="small" x="105" y="274">상품개발·상품관리의 기준정보와 구매 시 선택 결과</text>
  <g><rect class="product-card" x="125" y="490" width="325" height="190" rx="24"/><rect x="148" y="515" width="96" height="28" rx="14" fill="#60a5fa" opacity=".22"/><text class="pill" x="196" y="535" text-anchor="middle">상품 기준정보</text><text class="card-title" x="287" y="580" text-anchor="middle">패키지 상품</text><text class="body" x="287" y="613" text-anchor="middle">상담 · 검사 · 본 시술</text><text class="body" x="287" y="639" text-anchor="middle">진정 관리 · 사후 점검</text></g>
  <path class="bus" data-bus="bom-component-radial" data-fanout="radial" data-fanout-id="package-components" d="M 450 585 H 481 M 481 585 Q 505 585 505 561 V 362 M 481 585 Q 505 585 505 609 V 967"/><text class="small" x="462" y="565" text-anchor="end">구성 관계</text>
  <g><rect class="component-card" x="550" y="285" width="350" height="108" rx="18"/><text class="card-title" x="725" y="325" text-anchor="middle">사전 상담</text><text class="code" x="725" y="357" text-anchor="middle">REQUIRED · 1회</text><path class="connector primary-line" data-connector="bom-consultation" data-fanout-branch="package-components" data-source="package-product" data-target="consultation" d="M 505 362 Q 505 350 517 350 H 550" marker-end="url(#bom-ko-primary-arrow)"/></g>
  <g><rect class="component-card" x="550" y="445" width="350" height="108" rx="18"/><text class="card-title" x="725" y="485" text-anchor="middle">사전 검사</text><text class="code" x="725" y="517" text-anchor="middle">REQUIRED · MAY_SAME_VISIT</text><path class="connector primary-line" data-connector="bom-examination" data-fanout-branch="package-components" data-source="package-product" data-target="examination" d="M 505 517 Q 505 505 517 505 H 550" marker-end="url(#bom-ko-primary-arrow)"/></g>
  <g><rect class="component-card" x="550" y="605" width="350" height="108" rx="18"/><text class="card-title" x="725" y="645" text-anchor="middle">본 시술</text><text class="code" x="725" y="677" text-anchor="middle">REQUIRED · MUST_SEPARATE_VISIT</text><path class="connector primary-line" data-connector="bom-treatment" data-fanout-branch="package-components" data-source="package-product" data-target="main-treatment" d="M 505 648 Q 505 660 517 660 H 550" marker-end="url(#bom-ko-primary-arrow)"/></g>
  <g><rect class="component-card" x="550" y="765" width="350" height="108" rx="18"/><text class="card-title" x="725" y="805" text-anchor="middle">진정 관리</text><text class="code" x="725" y="837" text-anchor="middle">OPTIONAL · MAY_SAME_VISIT</text><path class="connector primary-line" data-connector="bom-soothing" data-fanout-branch="package-components" data-source="package-product" data-target="soothing-care" d="M 505 803 Q 505 815 517 815 H 550" marker-end="url(#bom-ko-primary-arrow)"/></g>
  <g><rect class="component-card" x="550" y="925" width="350" height="108" rx="18"/><text class="card-title" x="725" y="965" text-anchor="middle">사후 점검</text><text class="code" x="725" y="997" text-anchor="middle">REQUIRED · BLOCKING</text><path class="connector primary-line" data-connector="bom-follow-up" data-fanout-branch="package-components" data-source="package-product" data-target="follow-up" d="M 505 967 Q 505 979 517 979 H 550" marker-end="url(#bom-ko-primary-arrow)"/></g>
  <rect x="120" y="805" width="350" height="230" rx="18" fill="#101f37" stroke="#345276" stroke-width="2" opacity=".9"/><text class="small" x="145" y="845">상품 BOM에서 보존할 축</text><text class="body" x="145" y="882">• 선택 결과와 반복 횟수</text><text class="body" x="145" y="914">• 구성 상품 version</text><text class="body" x="145" y="946">• dependency 방향과 간격</text><text class="body" x="145" y="978">• 자원·시간·방문 묶음 제약</text>

  <rect class="bom-frame" x="1050" y="190" width="1080" height="990" rx="30"/><text class="frame-title" x="1085" y="242">2. 구매 snapshot에서 예약 단위로</text><text class="small" x="1085" y="274">예약서비스는 상품 의미를 다시 정의하지 않고 검증된 계약을 번역한다.</text>
  <g><rect class="product-card" x="1110" y="320" width="410" height="205" rx="24"/><rect x="1135" y="345" width="86" height="28" rx="14" fill="#60a5fa" opacity=".22"/><text class="pill" x="1178" y="365" text-anchor="middle">구매 시 고정</text><text class="card-title" x="1315" y="416" text-anchor="middle">PackageExecutionSnapshot</text><text class="body" x="1315" y="454" text-anchor="middle">선택·반복·version·dependency</text><text class="code" x="1315" y="493" text-anchor="middle">snapshotHash</text></g>
  <g><rect class="reservation-card" x="1650" y="320" width="410" height="205" rx="24"/><rect x="1675" y="345" width="78" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="1714" y="365" text-anchor="middle">계획</text><text class="card-title" x="1855" y="416" text-anchor="middle">AppointmentPlan revision</text><text class="body" x="1855" y="454" text-anchor="middle">구매 한 건의 이행 범위</text><text class="code" x="1855" y="493" text-anchor="middle">revision + provenance</text></g>
  <path class="connector primary-line" data-connector="snapshot-plan" data-source="bom-snapshot" data-target="plan-revision" d="M 1520 422 H 1650" marker-end="url(#bom-ko-primary-arrow)"/>
  <g><rect class="reservation-card" x="1110" y="665" width="410" height="190" rx="24"/><rect x="1135" y="690" width="78" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="1174" y="710" text-anchor="middle">전개</text><text class="card-title" x="1315" y="765" text-anchor="middle">PlannedTreatment 1..N</text><text class="body" x="1315" y="803" text-anchor="middle">진료 항목과 선행 관계</text><text class="code" x="1315" y="837" text-anchor="middle">BLOCKING · NON_BLOCKING</text></g>
  <g><rect class="reservation-card" x="1650" y="665" width="410" height="190" rx="24"/><rect x="1675" y="690" width="78" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="1714" y="710" text-anchor="middle">방문</text><text class="card-title" x="1855" y="765" text-anchor="middle">AppointmentItem + Appointment</text><text class="body" x="1855" y="803" text-anchor="middle">한 번의 방문에 묶인 항목들</text><text class="code" x="1855" y="837" text-anchor="middle">resource allocation · consent</text></g>
  <path class="connector primary-line" data-connector="snapshot-treatment" data-source="bom-snapshot" data-target="planned-treatment" d="M 1315 525 V 665" marker-end="url(#bom-ko-primary-arrow)"/>
  <path class="connector primary-line" data-connector="plan-items" data-source="plan-revision" data-target="appointment-items" d="M 1855 525 V 665" marker-end="url(#bom-ko-primary-arrow)"/>
  <path class="connector primary-line" data-connector="treatment-items" data-source="planned-treatment" data-target="appointment-items" d="M 1520 760 H 1650" marker-end="url(#bom-ko-primary-arrow)"/>
  <path class="connector constraint-line" data-connector="snapshot-constraints" data-source="bom-snapshot" data-target="appointment-items" d="M 1520 480 H 1580 Q 1600 480 1600 500 V 670 Q 1600 700 1620 700 H 1650" marker-end="url(#bom-ko-secondary-arrow)"/>
  <rect x="1455" y="548" width="150" height="34" rx="17" fill="#3a2816" stroke="#fbbf24" stroke-width="1.5"/><text class="pill" x="1530" y="570" text-anchor="middle">MUST / MAY 묶음</text>
  <g><rect class="appointment-card" x="1370" y="930" width="430" height="145" rx="22" fill="#0f2d3b" stroke="#2dd4bf" stroke-width="2.5"/><text class="card-title" x="1585" y="980" text-anchor="middle">실제 방문과 완료 사실</text><text class="body" x="1585" y="1018" text-anchor="middle">Appointment는 물리적 방문이고</text><text class="body" x="1585" y="1046" text-anchor="middle">완료·미완료 provenance는 항목별로 남는다.</text></g>
  <path class="connector primary-line" data-connector="items-appointment" data-source="appointment-items" data-target="appointment" d="M 1855 855 V 880 Q 1855 900 1835 900 H 1750 Q 1730 900 1730 915 V 930" marker-end="url(#bom-ko-primary-arrow)"/>
  <path class="connector primary-line" data-connector="treatment-appointment" data-source="planned-treatment" data-target="appointment" d="M 1315 855 V 880 Q 1315 900 1335 900 H 1450 Q 1470 900 1470 915 V 930" marker-end="url(#bom-ko-primary-arrow)"/>

  <text class="small" x="1085" y="1125">읽는 규칙</text><text class="body" x="1085" y="1158">상품 BOM은 수행할 항목의 계약이다. 시간·자원·동의가 붙어 AppointmentItem이 되고, 그 항목들이 모여 실제 Appointment가 된다.</text>
</svg>
