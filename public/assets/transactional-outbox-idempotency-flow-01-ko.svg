<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Transactional outbox and idempotency flow</title>
  <desc id="desc">A request writes command state and outbox intent in one transaction, then the relay 발행es after commit and records retry state for later delivery.</desc>
  <defs>
    <style>
      .canvas { fill: #fbfcf8; }
      .title { font-family: "goorm Sans"; font-size: 42px; fill: #263238; font-weight: 700; }
      .subtitle, .small, .tiny, .badgeText, .legendText { font-family: "goorm Sans Code"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .lane { fill: #ffffff; stroke: #d7e0e4; stroke-width: 2; }
      .laneLabel { font-family: "goorm Sans"; font-size: 22px; fill: #41545d; font-weight: 700; }
      .card { fill: #ffffff; stroke: #546e7a; stroke-width: 2.2; rx: 14; }
      .blue { fill: #eaf4f8; stroke: #3f7d9c; }
      .green { fill: #eef7f0; stroke: #6e8f4f; }
      .amber { fill: #fff4df; stroke: #a2743d; }
      .red { fill: #fff0f0; stroke: #b86868; }
      .purple { fill: #f5effa; stroke: #7d6aa5; }
      .cardTitle { font-family: "goorm Sans"; font-size: 23px; fill: #1f3138; font-weight: 700; }
      .small { font-size: 14px; }
      .tiny { font-size: 12px; fill: #60727d; }
      .request { fill: none; stroke: #3f7d9c; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRequest); }
      .commit { fill: none; stroke: #6e8f4f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCommit); }
      .delivery { fill: none; stroke: #a2743d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowDelivery); }
      .failure { fill: none; stroke: #b86868; stroke-width: 3.5; stroke-dasharray: 9 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowFailure); }
      .retry { fill: none; stroke: #7d6aa5; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRetry); }
      .label { fill: #ffffff; stroke-width: 1.5; rx: 15; }
      .requestLabel { stroke: #9cc2d1; }
      .commitLabel { stroke: #b6c9a4; }
      .deliveryLabel { stroke: #d0b078; }
      .failureLabel { stroke: #d9abab; }
      .retryLabel { stroke: #c4b8dd; }
      .badgeText { font-size: 12px; font-weight: 700; }
      .legendText { font-size: 13px; }
      .iconStroke { stroke: #41545d; stroke-width: 2; }
    </style>
    <marker id="arrowRequest" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowCommit" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowDelivery" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a2743d" stroke="#a2743d" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowFailure" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b86868" stroke="#b86868" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowRetry" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7d6aa5" stroke="#7d6aa5" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
  </defs>
  <rect class="canvas" width="1600" height="980"/>
  <rect x="24" y="24" width="1552" height="932" rx="22" fill="#fbfcf8" stroke="#d7e0e4" stroke-width="2"/>
  <text class="title" x="800" y="78" text-anchor="middle">트랜잭셔널 아웃박스 + 멱등성</text>
  <text class="subtitle" x="800" y="110" text-anchor="middle">재시도 경계가 프로세스를 벗어나기 전에 요청 결과와 전달 의도를 저장합니다.</text>
  <rect class="lane" x="54" y="150" width="1492" height="312" rx="18"/>
  <text class="laneLabel" x="78" y="188">요청 트랜잭션</text>
  <rect class="lane" x="54" y="500" width="1492" height="350" rx="18"/>
  <text class="laneLabel" x="78" y="538">커밋 후 전달과 재시도</text>
  <g data-node="client">
    <rect class="card blue" x="140" y="236" width="184" height="108" rx="14"/>
    <rect x="162" y="264" width="46" height="34" rx="6" fill="#ffffff" class="iconStroke"/>
    <line x1="162" y1="276" x2="208" y2="276" class="iconStroke"/>
    <circle cx="174" cy="271" r="3" fill="#3f7d9c"/>
    <text class="cardTitle" x="222" y="278">Client</text>
    <text class="small" x="222" y="308">명령 + 키</text>
  </g>
  <g data-node="http-app">
    <rect class="card blue" x="458" y="224" width="204" height="132" rx="14"/>
    <polygon points="504,248 532,264 532,296 504,312 476,296 476,264" fill="#ffffff" class="iconStroke"/>
    <text class="tiny" x="504" y="284" text-anchor="middle">API</text>
    <text class="cardTitle" x="546" y="266">HTTP 앱</text>
    <text class="small" x="546" y="296">Spring or Ktor</text>
    <text class="small" x="546" y="321">입력 검증</text>
  </g>
  <g data-node="idempotency-gate">
    <rect class="card purple" x="796" y="224" width="230" height="132" rx="14"/>
    <text class="cardTitle" x="820" y="266">멱등성 가드</text>
    <text class="small" x="820" y="296">고유 키</text>
    <text class="small" x="820" y="321">기존 행 조회</text>
  </g>
  <g data-node="db-transaction">
    <rect class="card green" x="1160" y="210" width="300" height="160" rx="14"/>
    <g data-bluetape4k-icon="generic.database" transform="translate(1178 220) scale(0.46)">
      <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
      <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="none" stroke="#8c6f33" stroke-width="5"/>
      <path d="M30 58c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
      <path d="M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text class="cardTitle" x="1250" y="252">DB 트랜잭션</text>
    <text class="small" x="1250" y="282">도메인 행</text>
    <text class="small" x="1250" y="307">outbox 행</text>
    <text class="small" x="1250" y="332">한 번의 커밋</text>
  </g>
  <g data-node="중복-result">
    <rect class="card green" x="758" y="392" width="306" height="62" rx="14"/>
    <text class="cardTitle" x="782" y="428">중복 결과</text>
    <text class="small" x="782" y="448">같은 키는 저장된 결과 반환</text>
  </g>
  <g data-node="outbox-table">
    <rect class="card amber" x="670" y="540" width="260" height="120" rx="14"/>
    <g data-bluetape4k-icon="generic.database" transform="translate(686 554) scale(0.38)">
      <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
      <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="none" stroke="#8c6f33" stroke-width="5"/>
      <path d="M30 58c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
      <path d="M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text class="cardTitle" x="752" y="582">Outbox 테이블</text>
    <text class="small" x="752" y="612">PENDING 행</text>
    <text class="small" x="752" y="637">내구성 있는 전달 의도</text>
  </g>
  <g data-node="relay-worker">
    <rect class="card amber" x="670" y="720" width="260" height="120" rx="14"/>
    <circle cx="714" cy="768" r="28" fill="#ffffff" class="iconStroke"/>
    <path d="M 702 768 L 714 756 L 726 768 L 714 780 Z" fill="#fff4df" class="iconStroke"/>
    <text class="cardTitle" x="758" y="762">릴레이 작업자</text>
    <text class="small" x="758" y="792">커밋 후 폴링</text>
    <text class="small" x="758" y="817">전달 결과 기록</text>
  </g>
  <g data-node="consumer---api">
    <rect class="card green" x="1150" y="720" width="260" height="120" rx="14"/>
    <rect x="1168" y="750" width="46" height="54" rx="8" fill="#ffffff" class="iconStroke"/>
    <circle cx="1191" cy="768" r="9" fill="#eef7f0" class="iconStroke"/>
    <line x1="1180" y1="790" x2="1204" y2="790" class="iconStroke"/>
    <text class="cardTitle" x="1228" y="762">Consumer</text>
    <text class="small" x="1228" y="792">Kafka or HTTP API</text>
    <text class="small" x="1228" y="817">외부 경계</text>
  </g>
  <g data-node="retry-ledger">
    <rect class="card red" x="190" y="720" width="260" height="120" rx="14"/>
    <g data-bluetape4k-icon="generic.database" transform="translate(208 730) scale(0.46)">
      <rect x="10" y="8" width="108" height="112" rx="18" fill="#fffaf2" stroke="#28485a" stroke-width="6"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="#fff0d8" stroke="#8c6f33" stroke-width="6"/>
      <path d="M30 36v44c0 8 15 14 34 14s34-6 34-14V36" fill="#fff0d8" stroke="#8c6f33" stroke-width="6" stroke-linejoin="round"/>
      <ellipse cx="64" cy="36" rx="34" ry="13" fill="none" stroke="#8c6f33" stroke-width="5"/>
      <path d="M30 58c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
      <path d="M30 80c0 8 15 14 34 14s34-6 34-14" fill="none" stroke="#8c6f33" stroke-width="5" stroke-linecap="round"/>
    </g>
    <text class="cardTitle" x="280" y="762">재시도 원장</text>
    <text class="small" x="280" y="792">attempts + 1</text>
    <text class="small" x="280" y="817">예산 소진 시 dead letter</text>
  </g>
  <path class="request connector" d="M 324 290 L 458 290"/>
  <rect class="label requestLabel" x="350" y="257" width="80" height="28"/><text class="badgeText" x="390" y="276" text-anchor="middle">POST</text>
  <path class="request connector" d="M 662 290 L 796 290"/>
  <rect class="label requestLabel" x="683" y="257" width="92" height="28"/><text class="badgeText" x="729" y="276" text-anchor="middle">키 확인</text>
  <path class="commit connector" d="M 1026 290 L 1160 290"/>
  <rect class="label commitLabel" x="1049" y="257" width="88" height="28"/><text class="badgeText" x="1093" y="276" text-anchor="middle">TX 기록</text>
  <path class="retry connector" d="M 911 356 L 911 392"/>
  <rect class="label retryLabel" x="930" y="359" width="126" height="28"/><text class="badgeText" x="993" y="378" text-anchor="middle">중복</text>
  <path class="commit connector" d="M 1310 370 L 1310 454 Q 1310 468 1296 468 L 814 468 Q 800 468 800 482 L 800 540"/>
  <rect class="label commitLabel" x="1148" y="432" width="104" height="28"/><text class="badgeText" x="1200" y="451" text-anchor="middle">커밋 후 노출</text>
  <path class="delivery connector" d="M 800 660 L 800 720"/>
  <rect class="label deliveryLabel" x="816" y="676" width="72" height="28"/><text class="badgeText" x="852" y="695" text-anchor="middle">poll</text>
  <path class="delivery connector" d="M 930 780 L 1150 780"/>
  <rect class="label deliveryLabel" x="996" y="738" width="88" height="28"/><text class="badgeText" x="1040" y="757" text-anchor="middle">발행</text>
  <path class="failure connector" d="M 1150 818 L 930 818"/>
  <rect class="label failureLabel" x="982" y="846" width="116" height="28"/><text class="badgeText" x="1040" y="865" text-anchor="middle">전송 실패</text>
  <path class="failure connector" d="M 670 810 L 450 810"/>
  <rect class="label failureLabel" x="502" y="774" width="118" height="28"/><text class="badgeText" x="561" y="793" text-anchor="middle">재시도 저장</text>
  <path class="retry connector" d="M 320 720 L 320 612 Q 320 600 332 600 L 670 600"/>
  <rect class="label retryLabel" x="414" y="616" width="150" height="28"/><text class="badgeText" x="489" y="635" text-anchor="middle">다음 재시도 폴링</text>
  <g transform="translate(82,884)">
    <path class="request connector" d="M 0 20 L 54 20"/>
    <text class="legendText" x="68" y="25">요청 경로</text>
    <path class="commit connector" d="M 292 20 L 346 20"/>
    <text class="legendText" x="360" y="25">트랜잭션 커밋</text>
    <path class="delivery connector" d="M 584 20 L 638 20"/>
    <text class="legendText" x="652" y="25">커밋 후 전달</text>
    <path class="failure connector" d="M 876 20 L 930 20"/>
    <text class="legendText" x="944" y="25">실패 응답</text>
    <path class="retry connector" d="M 1168 20 L 1222 20"/>
    <text class="legendText" x="1236" y="25">재시도 결정</text>
  </g>
</svg>
