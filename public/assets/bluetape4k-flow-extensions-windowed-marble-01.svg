<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-labelledby="title desc" data-code-theme="dark">
  <title id="title">windowed Flow marble diagram</title>
  <desc id="desc">A marble diagram showing overlapping sliding windows with sizes three, three, and one from five input events.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ed8ff" stroke="#9ed8ff"/>
    </marker>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="58%" stop-color="#182331"/>
      <stop offset="100%" stop-color="#223047"/>
    </linearGradient>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="operatorGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26384f"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <radialGradient id="marbleTeal" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#d5fff8"/><stop offset="34%" stop-color="#62d6cb"/><stop offset="100%" stop-color="#0b766f"/></radialGradient>
    <radialGradient id="marbleBlue" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#d8efff"/><stop offset="34%" stop-color="#67b7ee"/><stop offset="100%" stop-color="#1f5f99"/></radialGradient>
    <radialGradient id="marbleAmber" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#fff0c2"/><stop offset="36%" stop-color="#dfac3f"/><stop offset="100%" stop-color="#9b6a12"/></radialGradient>
    <radialGradient id="marbleGreen" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#dff8c7"/><stop offset="36%" stop-color="#83c95a"/><stop offset="100%" stop-color="#3f7b2a"/></radialGradient>
    <radialGradient id="marbleOrange" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#ffd9bc"/><stop offset="36%" stop-color="#e28a46"/><stop offset="100%" stop-color="#9c4b1f"/></radialGradient>
    <filter id="panelShadow" x="-8%" y="-12%" width="116%" height="124%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
    <filter id="marbleShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#020617" flood-opacity="0.42"/></filter>
    <filter id="laneGlow" x="-4%" y="-120%" width="108%" height="340%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.35"/></filter>
    <style>
      .bg { fill: url(#bgGradient); }
      .panel { fill: url(#panelGradient); stroke: #536377; stroke-width: 2; rx: 18; filter: url(#panelShadow); }
      .title { font: 24px "Architects Daughter", "Comic Mono", system-ui, sans-serif; fill: #f8fafc; }
      .sub { font: 14px "Comic Mono", ui-monospace, monospace; fill: #b6c4d6; }
      .label { font: 15px "Comic Mono", ui-monospace, monospace; fill: #e5edf7; }
      .small { font: 13px "Comic Mono", ui-monospace, monospace; fill: #b6c4d6; }
      .tiny { font: 11px "Comic Mono", ui-monospace, monospace; fill: #f8fafc; text-anchor: middle; dominant-baseline: middle; font-weight: 700; }
      .line { stroke: #9ed8ff; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); filter: url(#laneGlow); }
      .event { stroke: #e8f7ff; stroke-width: 1.8; filter: url(#marbleShadow); }
      .box { fill: #172033; stroke-width: 2.5; rx: 14; }
      .op { fill: url(#operatorGradient); stroke: #7dd3fc; }
      .teal { fill: url(#marbleTeal); }
      .blue { fill: url(#marbleBlue); }
      .amber { fill: url(#marbleAmber); }
      .green { fill: url(#marbleGreen); }
      .orange { fill: url(#marbleOrange); }
      .guide { fill: #0f172a; fill-opacity: 0.18; stroke-width: 2; stroke-dasharray: 7 7; }
      .result { font: 12px "Comic Mono", ui-monospace, monospace; fill: #d8e5f2; text-anchor: middle; }
      .shape { stroke: #e8f7ff; stroke-width: 1.8; filter: url(#marbleShadow); }

    .syntax-keyword{fill:#C4B5FD}.syntax-type{fill:#5EEAD4}.syntax-function{fill:#93C5FD}.syntax-string{fill:#FCD34D}.syntax-number{fill:#FDBA74}.syntax-comment{fill:#94A3B8}.syntax-operator{fill:#FDA4AF}</style>
  </defs>
  <rect class="bg" width="920" height="340"/>
  <rect class="panel" x="24" y="22" width="872" height="296"/>
  <text class="title" x="52" y="58">windowed / sliding: emit overlapping windows</text>
  <text class="sub" x="52" y="84">top: source events; box: windowed(3, step 2); bottom: window objects</text>

  <text class="small" x="52" y="132">input Flow</text>
  <line class="line" x1="150" y1="128" x2="806" y2="128"/>
  <circle class="shape teal" cx="220" cy="128" r="13"/><text class="tiny" x="220" y="128">e1</text>
  <path class="shape blue" d="M 300 111 L 317 128 L 300 145 L 283 128 Z"/><text class="tiny" x="300" y="128">e2</text>
  <rect class="shape amber" x="367" y="115" width="26" height="26" rx="7"/><text class="tiny" x="380" y="128">e3</text>
  <path class="shape green" d="M 460 112 L 476 141 L 444 141 Z"/><text class="tiny" x="460" y="132">e4</text>
  <path class="shape orange" d="M 540 111 L 554 119 L 554 137 L 540 145 L 526 137 L 526 119 Z"/><text class="tiny" x="540" y="128">e5</text>
  <path d="M 780 113 V 143" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <rect class="guide" x="204" y="112" width="192" height="164" rx="16" stroke="#4c8cc8"/>
  <rect class="guide" x="364" y="112" width="192" height="164" rx="16" stroke="#62984d"/>
  <rect class="guide" x="516" y="112" width="94" height="164" rx="16" stroke="#c26b3d"/>
  <path d="M 300 142 V 214" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M 460 142 V 214" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M 540 142 V 214" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <rect class="box op" x="318" y="170" width="214" height="44"/>
  <text class="label" x="425" y="197" text-anchor="middle" data-code-snippet="kotlin"><tspan class="syntax-function">windowed</tspan>(size <tspan class="syntax-operator">=</tspan> <tspan class="syntax-number">3</tspan>, step <tspan class="syntax-operator">=</tspan> <tspan class="syntax-number">2</tspan>)</text>

  <text class="small" x="52" y="256">output Flow</text>
  <line class="line" x1="150" y1="252" x2="806" y2="252"/>
  <text class="small" x="204" y="235">W1</text>
  <rect class="box" x="232" y="230" width="126" height="44" stroke="#4c8cc8"/>
  <circle class="shape teal" cx="260" cy="252" r="10"/><text class="tiny" x="260" y="252">e1</text>
  <path class="shape blue" d="M 296 239 L 309 252 L 296 265 L 283 252 Z"/><text class="tiny" x="296" y="252">e2</text>
  <rect class="shape amber" x="322" y="242" width="20" height="20" rx="6"/><text class="tiny" x="332" y="252">e3</text>
  <text class="result" x="295" y="293">Window(e1..e3)</text>
  <text class="small" x="386" y="235">W2</text>
  <rect class="box" x="414" y="230" width="126" height="44" stroke="#62984d"/>
  <rect class="shape amber" x="432" y="242" width="20" height="20" rx="6"/><text class="tiny" x="442" y="252">e3</text>
  <path class="shape green" d="M 478 241 L 490 263 L 466 263 Z"/><text class="tiny" x="478" y="255">e4</text>
  <path class="shape orange" d="M 514 240 L 525 246 L 525 258 L 514 264 L 503 258 L 503 246 Z"/><text class="tiny" x="514" y="252">e5</text>
  <text class="result" x="477" y="293">Window(e3..e5)</text>
  <text class="small" x="568" y="235">W3</text>
  <rect class="box" x="596" y="230" width="58" height="44" stroke="#c26b3d"/>
  <path class="shape orange" d="M 625 240 L 636 246 L 636 258 L 625 264 L 614 258 L 614 246 Z"/><text class="tiny" x="625" y="252">e5</text>
  <text class="result" x="625" y="293">Window(e5)</text>
  <path d="M 780 237 V 267" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <text class="small" x="678" y="293">sizes = [3, 3, 1]</text>
</svg>
