<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Global Unique ID Generators · Phase 2</title>
  <desc id="desc">Benchmark chart comparing Go and Kotlin ID generation latency under single-thread and concurrent workloads</desc>
  <style>
    .canvas{fill:#07111F}.frame{fill:#10243A;stroke:#29445F;stroke-width:2}
    .panel{fill:#0D1B2D;stroke:#29445F;stroke-width:2}
    .title{font:700 42px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
    .subtitle{font:500 20px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}
    .panel-title{font:700 25px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
    .unit,.scale,.legend,.note{font:500 16px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}
    .row-label{font:600 18px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#E6F2FF}
    .value{font:700 15px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#E6F2FF;dominant-baseline:middle}
    .bar-go{fill:#36C5F0}.bar-kotlin{fill:#B794F4}
  </style>
  <rect width="1600" height="1100" class="canvas"/>
  <rect x="32" y="32" width="1536" height="1036" rx="32" class="frame"/>
  <text x="80" y="98" class="title">Global Unique ID Generators · Phase 2</text>
  <text x="80" y="136" class="subtitle">After Go entropy buffering and KSUIDMillis encoding changes · ns/id, lower is better</text>
