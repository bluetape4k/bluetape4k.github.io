<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1100" viewBox="0 0 1860 1100" role="img" aria-labelledby="package-en-title package-en-desc">
  <title id="package-en-title">How Patient A's package becomes an execution graph and visit candidates</title>
  <desc id="package-en-desc">Patient A's package purchase becomes a purchase-time execution snapshot, an AppointmentPlan revision, two or three visit candidates, item-level completion facts, and an exception-driven follow-up plan. No-show and VIP policy stays at the CRM and operations boundary.</desc>
  <defs>
    <linearGradient id="en-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.56" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <linearGradient id="en-product" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#162b45"/><stop offset="1" stop-color="#202049"/></linearGradient>
    <linearGradient id="en-reservation" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b4a"/><stop offset="1" stop-color="#192b4d"/></linearGradient>
    <linearGradient id="en-commitment" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#292147"/><stop offset="1" stop-color="#192d4a"/></linearGradient>
    <linearGradient id="en-exception" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2816"/><stop offset="1" stop-color="#282034"/></linearGradient>
    <filter id="en-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.58"/></filter>
    <marker id="en-primary-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#67e8f9" data-arrowhead="true" data-solid-head="true" data-role="primary" data-size="14x14"/></marker>
    <marker id="en-secondary-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-size="10x10" data-tip-direction="positive-x"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#fbbf24" data-arrowhead="true" data-solid-head="true" data-role="secondary" data-size="10x10"/></marker>
    <style>
      .title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:36px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:16px;fill:#aebed2}.section{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:20px;font-weight:700;fill:#f8fafc}.card-title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:19px;font-weight:700;fill:#f8fafc}.body{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:14px;fill:#d7e3f3}.small{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:13px;fill:#aebed2}.code{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:12px;font-weight:700;fill:#f8fafc}.step{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:12px;font-weight:700;fill:#f8fafc}.pill{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:12px;font-weight:700;fill:#f8fafc}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round}.primary-line{stroke:#67e8f9;stroke-width:4}.exception-line{stroke:#fbbf24;stroke-width:4;stroke-dasharray:10 8}.handoff-line{stroke:#fbbf24;stroke-width:3;stroke-dasharray:7 8}.group-frame{fill:#0b1628;stroke:#345276;stroke-width:2}.visit-card{fill:#123447;stroke:#2dd4bf;stroke-width:2}.node-card{filter:url(#en-shadow)}
    .syntax-keyword{fill:#7E22CE}.syntax-operator{fill:#BE123C}</style>
  </defs>
  <rect width="1860" height="1100" fill="url(#en-bg)"/><rect x="28" y="28" width="1804" height="1044" rx="30" fill="none" stroke="#263a5e" stroke-width="2"/>
  <circle cx="1690" cy="120" r="220" fill="#7c3aed" opacity=".08"/><circle cx="120" cy="980" r="230" fill="#0891b2" opacity=".07"/>
  <text class="title" x="70" y="78">Patient A: a package becomes an execution graph</text>
  <text class="subtitle" x="72" y="114">The purchase freezes an execution contract; the reservation service expands it into visit candidates and item-level completion facts.</text>
  <g transform="translate(1330 62)"><rect x="0" y="0" width="18" height="18" rx="5" fill="#162b45" stroke="#60a5fa" stroke-width="2"/><text class="small" x="28" y="15">Product snapshot</text><rect x="158" y="0" width="18" height="18" rx="5" fill="#123b4a" stroke="#67e8f9" stroke-width="2"/><text class="small" x="184" y="15">Reservation</text><rect x="292" y="0" width="18" height="18" rx="5" fill="#3a2816" stroke="#fbbf24" stroke-width="2"/><text class="small" x="318" y="15">Exception / policy</text></g>

  <g class="node-card">
    <rect x="70" y="240" width="320" height="210" rx="24" fill="url(#en-product)" stroke="#60a5fa" stroke-width="3"/>
    <rect x="90" y="260" width="58" height="26" rx="13" fill="#60a5fa" opacity=".22"/><text class="step" x="119" y="278" text-anchor="middle">T1</text>
    <text class="card-title" x="230" y="318" text-anchor="middle">Package purchase</text><text class="body" x="230" y="354" text-anchor="middle">Consultation + examination + treatment</text><text class="body" x="230" y="380" text-anchor="middle">Follow-up + optional item</text><text class="code" x="230" y="420" text-anchor="middle">purchaseId + productVersionId</text>
  </g>
  <g class="node-card">
    <rect x="430" y="240" width="330" height="210" rx="24" fill="url(#en-product)" stroke="#60a5fa" stroke-width="3"/>
    <rect x="450" y="260" width="58" height="26" rx="13" fill="#60a5fa" opacity=".22"/><text class="step" x="479" y="278" text-anchor="middle">T2</text>
    <text class="card-title" x="595" y="310" text-anchor="middle">PackageExecutionSnapshot</text><text class="body" x="595" y="350" text-anchor="middle">Freeze choices and repeat counts</text><text class="body" x="595" y="376" text-anchor="middle">Preserve component versions and dependencies</text><text class="code" x="595" y="418" text-anchor="middle">snapshotHash</text>
  </g>
  <g class="node-card">
    <rect x="820" y="240" width="370" height="210" rx="24" fill="url(#en-reservation)" stroke="#67e8f9" stroke-width="3"/>
    <rect x="840" y="260" width="58" height="26" rx="13" fill="#67e8f9" opacity=".22"/><text class="step" x="869" y="278" text-anchor="middle">T3</text>
    <text class="card-title" x="1005" y="310" text-anchor="middle">AppointmentPlan revision</text><text class="code" x="1005" y="350" text-anchor="middle">PlannedTreatment 1..N</text><text class="body" x="1005" y="376" text-anchor="middle">Execution, grouping, and resource constraints</text><text class="small" x="1005" y="418" text-anchor="middle">Not a confirmed time slot yet</text>
  </g>

  <path class="connector primary-line" data-connector="purchase-snapshot" data-source="package-purchase" data-target="execution-snapshot" d="M 390 345 H 430" marker-end="url(#en-primary-arrow)"/>
  <path class="connector primary-line" data-connector="snapshot-plan" data-source="execution-snapshot" data-target="appointment-plan" d="M 760 345 H 820" marker-end="url(#en-primary-arrow)"/>
  <path class="connector primary-line" data-connector="plan-visits" data-source="appointment-plan" data-target="visit-candidates" d="M 1190 345 H 1210 Q 1230 345 1230 365 Q 1230 385 1245 385 H 1260" marker-end="url(#en-primary-arrow)"/>

  <g>
    <rect class="group-frame" x="1260" y="155" width="530" height="535" rx="28"/><text class="section" x="1280" y="202">Visit candidates</text><rect x="1430" y="177" width="92" height="28" rx="14" fill="#0e7490"/><text class="pill" x="1476" y="196" text-anchor="middle">2–3 visits</text><text class="small" x="1280" y="232">Product relationships and time/resource constraints decide grouping.</text>
    <g class="node-card"><rect class="visit-card" x="1280" y="265" width="480" height="105" rx="20"/><rect x="1300" y="283" width="62" height="25" rx="12" fill="#0e7490"/><text class="step" x="1331" y="300" text-anchor="middle">Visit 1</text><text class="card-title" x="1510" y="299" text-anchor="middle"><tspan x="1510" dy="0">Pre-treatment consultation</tspan><tspan x="1510" dy="22">+ examination</tspan></text><text class="code" x="1510" y="348" text-anchor="middle">MAY_SAME_VISIT</text></g>
    <g class="node-card"><rect class="visit-card" x="1280" y="405" width="480" height="105" rx="20"/><rect x="1300" y="423" width="62" height="25" rx="12" fill="#0e7490"/><text class="step" x="1331" y="440" text-anchor="middle">Visit 2</text><text class="card-title" x="1510" y="442" text-anchor="middle">Main treatment + soothing care</text><text class="code" x="1510" y="478" text-anchor="middle">MUST_SEPARATE_VISIT + resources / recovery</text></g>
    <g class="node-card"><rect class="visit-card" x="1280" y="545" width="480" height="105" rx="20"/><rect x="1300" y="563" width="62" height="25" rx="12" fill="#0e7490"/><text class="step" x="1331" y="580" text-anchor="middle">Visit 3</text><text class="card-title" x="1510" y="582" text-anchor="middle">Follow-up check</text><text class="code" x="1510" y="618" text-anchor="middle">BLOCKING / after main treatment</text></g>
    <path class="connector primary-line" data-connector="visit-1-2" data-source="visit-1" data-target="visit-2" d="M 1520 370 V 405" marker-end="url(#en-primary-arrow)"/><path class="connector primary-line" data-connector="visit-2-3" data-source="visit-2" data-target="visit-3" d="M 1520 510 V 545" marker-end="url(#en-primary-arrow)"/>
  </g>

  <g class="node-card"><rect x="1240" y="760" width="550" height="185" rx="24" fill="url(#en-reservation)" stroke="#67e8f9" stroke-width="3"/><rect x="1260" y="780" width="58" height="26" rx="13" fill="#67e8f9" opacity=".22"/><text class="step" x="1289" y="798" text-anchor="middle">T7</text><text class="card-title" x="1515" y="825" text-anchor="middle">AppointmentItem-level completion</text><text class="body" x="1515" y="861" text-anchor="middle">Fulfilled items are used; unfinished items remain available</text><text class="code" x="1515" y="905" text-anchor="middle">used + remaining + provenance</text></g>
  <path class="connector primary-line" data-connector="visits-completion" data-source="visit-candidates" data-target="completion-fact" d="M 1520 690 V 760" marker-end="url(#en-primary-arrow)"/>

  <g class="node-card"><rect x="820" y="760" width="370" height="185" rx="24" fill="url(#en-exception)" stroke="#fbbf24" stroke-width="3"/><rect x="840" y="780" width="58" height="26" rx="13" fill="#fbbf24" opacity=".22"/><text class="step" x="869" y="798" text-anchor="middle">T8</text><text class="card-title" x="1005" y="825" text-anchor="middle">Operational exception</text><text class="body" x="1005" y="861" text-anchor="middle">NO_SHOW + reschedule + partial completion</text><text class="code" x="1005" y="905" text-anchor="middle"><tspan class="syntax-keyword">new</tspan> proposal <tspan class="syntax-operator">/</tspan> revision</text></g>
  <path class="connector exception-line" data-connector="completion-exception" data-source="completion-fact" data-target="operational-exception" d="M 1240 850 H 1190" marker-end="url(#en-secondary-arrow)"/>
  <path class="connector exception-line" data-connector="exception-plan" data-source="operational-exception" data-target="appointment-plan" d="M 1005 760 V 450" marker-end="url(#en-secondary-arrow)"/>

  <g class="node-card"><rect x="430" y="760" width="330" height="185" rx="24" fill="url(#en-exception)" stroke="#fbbf24" stroke-width="3"/><rect x="450" y="780" width="82" height="26" rx="13" fill="#fbbf24" opacity=".22"/><text class="pill" x="491" y="798" text-anchor="middle">Boundary</text><text class="card-title" x="595" y="825" text-anchor="middle">CRM / operations policy</text><text class="body" x="595" y="861" text-anchor="middle">Counseling / rescheduling / no-show / VIP</text><text class="code" x="595" y="905" text-anchor="middle">Not decided automatically by scheduling</text></g>
  <path class="connector handoff-line" data-connector="exception-crm" data-source="operational-exception" data-target="crm-policy" d="M 820 850 H 760" marker-end="url(#en-secondary-arrow)"/>

  <text class="small" x="70" y="1010">Reading rule</text><text class="body" x="70" y="1042">The purchase creates an execution contract; only consented visits become commitments. Completion and exception facts feed a new proposal/revision without overwriting confirmed history.</text>
</svg>
