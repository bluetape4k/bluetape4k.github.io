<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aho-Corasick: Separate Dictionary Build from Requests</title><desc id="desc">Two boundaries for building an immutable Aho-Corasick automaton from a dictionary and scanning validated user text once for service decisions</desc>
  <defs><marker id="arrow0" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#60A5FA"/></marker><marker id="arrow1" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#5EEAD4"/></marker><marker id="arrow2" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#F4B860"/></marker><marker id="arrow3" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#E07A7A"/></marker><marker id="arrow4" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#B794F4"/></marker></defs><style>
    .canvas{fill:#07111F}.frame{fill:#0D1B2D;stroke:#38506A;stroke-width:2}
    .lane{fill:#0A1727;stroke:#38506A;stroke-width:2}.card{fill:#10243A;stroke-width:2}
    .title{font:700 33px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
    .subtitle,.lane-title,.body,.footer{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#A9BDD1}
    .subtitle{font-size:15px}.lane-title{font-size:17px;fill:#36C5F0}
    .card-title{font:700 15px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#E6F2FF}
    .body{font-size:14px}.footer{font-size:13px}
    .connector{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1600" height="900" class="canvas"/><rect x="30" y="30" width="1540" height="840" rx="30" class="frame"/>
  <text x="70" y="100" class="title">Aho-Corasick: Separate Dictionary Build from Requests</text><text x="70" y="142" class="subtitle">Build an immutable automaton when the dictionary changes; validate and scan only on the request path</text>
  <rect x="60" y="190" width="1480" height="282" rx="26" class="lane"/><text x="90" y="222" class="lane-title">Dictionary preparation boundary</text>
  <rect x="40" y="520" width="1520" height="300" rx="26" class="lane"/><text x="70" y="552" class="lane-title">Request-processing boundary</text>
  <g data-card="Keyword dictionary">
    <rect x="90" y="238" width="380" height="190" rx="22" class="card" stroke="#60A5FA"/>
    <circle cx="116" cy="268" r="7" fill="#60A5FA"/>
    <text x="134" y="276" class="card-title">Keyword dictionary</text>
    <text x="116" y="322" class="body" text-anchor="start"><tspan x="116" dy="0">Abuse and risk phrases</tspan><tspan x="116" dy="30">Normalize blanks and duplicates</tspan></text>
  </g><g data-card="Build automaton">
    <rect x="610" y="238" width="380" height="190" rx="22" class="card" stroke="#36C5F0"/>
    <circle cx="636" cy="268" r="7" fill="#36C5F0"/>
    <text x="654" y="276" class="card-title">Build automaton</text>
    <text x="636" y="322" class="body" text-anchor="start"><tspan x="636" dy="0">Keyword trie</tspan><tspan x="636" dy="30">Failure transitions</tspan></text>
  </g><g data-card="Immutable instance">
    <rect x="1130" y="238" width="380" height="190" rx="22" class="card" stroke="#5EEAD4"/>
    <circle cx="1156" cy="268" r="7" fill="#5EEAD4"/>
    <text x="1174" y="276" class="card-title">Immutable instance</text>
    <text x="1156" y="322" class="body" text-anchor="start"><tspan x="1156" dy="0">Thread-safe sharing</tspan><tspan x="1156" dy="30">Replace by version</tspan></text>
  </g><g data-card="User text">
    <rect x="60" y="585" width="280" height="190" rx="22" class="card" stroke="#60A5FA"/>
    <circle cx="86" cy="615" r="7" fill="#60A5FA"/>
    <text x="104" y="623" class="card-title">User text</text>
    <text x="86" y="669" class="body" text-anchor="start"><tspan x="86" dy="0">Length and blank checks</tspan><tspan x="86" dy="30">Do not log raw input</tspan></text>
  </g><g data-card="Single scan">
    <rect x="440" y="585" width="280" height="190" rx="22" class="card" stroke="#36C5F0"/>
    <circle cx="466" cy="615" r="7" fill="#36C5F0"/>
    <text x="484" y="623" class="card-title">Single scan</text>
    <text x="466" y="669" class="body" text-anchor="start"><tspan x="466" dy="0">parseText</tspan><tspan x="466" dy="30">containsMatch</tspan></text>
  </g><g data-card="Matches">
    <rect x="820" y="585" width="300" height="190" rx="22" class="card" stroke="#F4B860"/>
    <circle cx="846" cy="615" r="7" fill="#F4B860"/>
    <text x="864" y="623" class="card-title">Matches</text>
    <text x="846" y="669" class="body" text-anchor="start"><tspan x="846" dy="0">Position, keyword, value</tspan><tspan x="846" dy="30">Overlap and boundary policy</tspan></text>
  </g><g data-card="Service decision">
    <rect x="1220" y="585" width="320" height="190" rx="22" class="card" stroke="#B794F4"/>
    <circle cx="1246" cy="615" r="7" fill="#B794F4"/>
    <text x="1264" y="623" class="card-title">Service decision</text>
    <text x="1246" y="669" class="body" text-anchor="start"><tspan x="1246" dy="0">Mask or alert</tspan><tspan x="1246" dy="30">Highlight or classify</tspan></text>
  </g>
  <path data-connector="dictionary-build" d="M470 333 H610" class="connector" stroke="#60A5FA" marker-end="url(#arrow0)"/>
  <path data-connector="build-instance" d="M990 333 H1130" class="connector" stroke="#5EEAD4" marker-end="url(#arrow1)"/>
  <path data-connector="instance-scan" d="M1320 428 V480 Q1320 500 1300 500 H590 Q570 500 570 520 V585" class="connector" stroke="#5EEAD4" marker-end="url(#arrow1)"/>
  <path data-connector="input-scan" d="M340 680 H440" class="connector" stroke="#60A5FA" marker-end="url(#arrow0)"/>
  <path data-connector="scan-matches" d="M720 680 H820" class="connector" stroke="#F4B860" marker-end="url(#arrow2)"/>
  <path data-connector="matches-decision" d="M1120 680 H1220" class="connector" stroke="#B794F4" marker-end="url(#arrow4)"/>
  <text x="800" y="850" text-anchor="middle" class="footer">The default Flow path emits during traversal; overlap removal or word-boundary filtering requires eager post-processing.</text>
</svg>