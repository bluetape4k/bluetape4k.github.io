<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc">
  <title id="title">CSV parser throughput comparison</title>
  <desc id="desc">Grouped bar chart comparing existing reader and Okio fast path throughput in operations per second for small, medium, and large CSV workloads. Higher is better.</desc>
  <defs>
    <style>
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 38px; fill: #243447; }
      .subtitle { font-family: 'Comic Mono', 'SFMono-Regular', Menlo, monospace; font-size: 18px; fill: #5b677a; }
      .label { font-family: 'Comic Mono', 'SFMono-Regular', Menlo, monospace; font-size: 16px; fill: #344054; }
      .small { font-family: 'Comic Mono', 'SFMono-Regular', Menlo, monospace; font-size: 13px; fill: #667085; }
      .panel-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 24px; fill: #26364a; }
      .row-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 25px; fill: #26364a; }
      .value { font-family: 'Comic Mono', 'SFMono-Regular', Menlo, monospace; font-size: 15px; font-weight: 700; fill: #26364a; }
      .speed { font-family: 'Comic Mono', 'SFMono-Regular', Menlo, monospace; font-size: 15px; font-weight: 700; fill: #027a48; }
    </style>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#98a2b3" flood-opacity="0.22"/></filter>
  </defs>
  <rect x="16" y="16" width="1288" height="868" rx="24" fill="#fbfcff" stroke="#d8e1ef"/>
  <text x="44" y="70" class="title">CSV Parser Throughput: Existing vs Okio Fast Path</text>
  <text x="46" y="106" class="subtitle">ops/s, higher is better. Each workload panel uses its own scale so medium and large results stay visible.</text>
  <g transform="translate(48,134)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#8aa9d6"/>
    <text x="28" y="15" class="label">Existing Reader/Lexer</text>
    <rect x="236" y="0" width="18" height="18" rx="4" fill="#4cc1a5"/>
    <text x="264" y="15" class="label">Okio BufferedSource + UnsafeCursor</text>
  </g>
  <text x="58" y="194" class="row-title">Public reader path</text>
  <g filter="url(#softShadow)"><rect x="58" y="214" width="388" height="216" rx="18" fill="#ffffff" stroke="#d7e2f0"/></g>
  <text x="82" y="252" class="panel-title">Small workload</text>
  <text x="352" y="252" class="speed">2.25x faster</text>
  <text x="82" y="278" class="small">Existing</text>
  <rect x="86" y="286" width="326" height="28" rx="9" fill="#edf3fb"/>
  <rect x="86" y="286" width="124.83" height="28" rx="9" fill="#8aa9d6"/>
  <text x="220.83" y="306" class="value">20,174 ops/s</text>
  <text x="82" y="334" class="small">Okio</text>
  <rect x="86" y="342" width="326" height="28" rx="9" fill="#eaf8f4"/>
  <rect x="86" y="342" width="281.03" height="28" rx="9" fill="#4cc1a5"/>
  <text x="290.00" y="362" class="value">45,417 ops/s</text>
  <line x1="86" y1="382" x2="412" y2="382" stroke="#d0d8e6" stroke-width="1"/>
  <text x="86" y="404" class="small">0</text>
  <text x="324" y="404" class="small">45,417+</text>
  <g filter="url(#softShadow)"><rect x="474" y="214" width="388" height="216" rx="18" fill="#ffffff" stroke="#d7e2f0"/></g>
  <text x="498" y="252" class="panel-title">Medium workload</text>
  <text x="768" y="252" class="speed">2.30x faster</text>
  <text x="498" y="278" class="small">Existing</text>
  <rect x="502" y="286" width="326" height="28" rx="9" fill="#edf3fb"/>
  <rect x="502" y="286" width="122.11" height="28" rx="9" fill="#8aa9d6"/>
  <text x="634.11" y="306" class="value">296.9 ops/s</text>
  <text x="498" y="334" class="small">Okio</text>
  <rect x="502" y="342" width="326" height="28" rx="9" fill="#eaf8f4"/>
  <rect x="502" y="342" width="281.03" height="28" rx="9" fill="#4cc1a5"/>
  <text x="706.00" y="362" class="value">683.4 ops/s</text>
  <line x1="502" y1="382" x2="828" y2="382" stroke="#d0d8e6" stroke-width="1"/>
  <text x="502" y="404" class="small">0</text>
  <text x="740" y="404" class="small">683.4+</text>
  <g filter="url(#softShadow)"><rect x="890" y="214" width="388" height="216" rx="18" fill="#ffffff" stroke="#d7e2f0"/></g>
  <text x="914" y="252" class="panel-title">Large workload</text>
  <text x="1184" y="252" class="speed">2.32x faster</text>
  <text x="914" y="278" class="small">Existing</text>
  <rect x="918" y="286" width="326" height="28" rx="9" fill="#edf3fb"/>
  <rect x="918" y="286" width="121.28" height="28" rx="9" fill="#8aa9d6"/>
  <text x="1049.28" y="306" class="value">17.31 ops/s</text>
  <text x="914" y="334" class="small">Okio</text>
  <rect x="918" y="342" width="326" height="28" rx="9" fill="#eaf8f4"/>
  <rect x="918" y="342" width="281.03" height="28" rx="9" fill="#4cc1a5"/>
  <text x="1122.00" y="362" class="value">40.12 ops/s</text>
  <line x1="918" y1="382" x2="1244" y2="382" stroke="#d0d8e6" stroke-width="1"/>
  <text x="918" y="404" class="small">0</text>
  <text x="1156" y="404" class="small">40.12+</text>
  <text x="58" y="454" class="row-title">Direct lexer path</text>
  <g filter="url(#softShadow)"><rect x="58" y="474" width="388" height="216" rx="18" fill="#ffffff" stroke="#d7e2f0"/></g>
  <text x="82" y="512" class="panel-title">Small workload</text>
  <text x="352" y="512" class="speed">2.14x faster</text>
  <text x="82" y="538" class="small">Existing</text>
  <rect x="86" y="546" width="326" height="28" rx="9" fill="#edf3fb"/>
  <rect x="86" y="546" width="131.24" height="28" rx="9" fill="#8aa9d6"/>
  <text x="227.24" y="566" class="value">21,044 ops/s</text>
  <text x="82" y="594" class="small">Okio</text>
  <rect x="86" y="602" width="326" height="28" rx="9" fill="#eaf8f4"/>
  <rect x="86" y="602" width="281.03" height="28" rx="9" fill="#4cc1a5"/>
  <text x="290.00" y="622" class="value">45,063 ops/s</text>
  <line x1="86" y1="642" x2="412" y2="642" stroke="#d0d8e6" stroke-width="1"/>
  <text x="86" y="664" class="small">0</text>
  <text x="324" y="664" class="small">45,063+</text>
  <g filter="url(#softShadow)"><rect x="474" y="474" width="388" height="216" rx="18" fill="#ffffff" stroke="#d7e2f0"/></g>
  <text x="498" y="512" class="panel-title">Medium workload</text>
  <text x="768" y="512" class="speed">2.32x faster</text>
  <text x="498" y="538" class="small">Existing</text>
  <rect x="502" y="546" width="326" height="28" rx="9" fill="#edf3fb"/>
  <rect x="502" y="546" width="121.13" height="28" rx="9" fill="#8aa9d6"/>
  <text x="633.13" y="566" class="value">288.1 ops/s</text>
  <text x="498" y="594" class="small">Okio</text>
  <rect x="502" y="602" width="326" height="28" rx="9" fill="#eaf8f4"/>
  <rect x="502" y="602" width="281.03" height="28" rx="9" fill="#4cc1a5"/>
  <text x="706.00" y="622" class="value">668.5 ops/s</text>
  <line x1="502" y1="642" x2="828" y2="642" stroke="#d0d8e6" stroke-width="1"/>
  <text x="502" y="664" class="small">0</text>
  <text x="740" y="664" class="small">668.5+</text>
  <g filter="url(#softShadow)"><rect x="890" y="474" width="388" height="216" rx="18" fill="#ffffff" stroke="#d7e2f0"/></g>
  <text x="914" y="512" class="panel-title">Large workload</text>
  <text x="1184" y="512" class="speed">2.31x faster</text>
  <text x="914" y="538" class="small">Existing</text>
  <rect x="918" y="546" width="326" height="28" rx="9" fill="#edf3fb"/>
  <rect x="918" y="546" width="121.91" height="28" rx="9" fill="#8aa9d6"/>
  <text x="1049.91" y="566" class="value">18.00 ops/s</text>
  <text x="914" y="594" class="small">Okio</text>
  <rect x="918" y="602" width="326" height="28" rx="9" fill="#eaf8f4"/>
  <rect x="918" y="602" width="281.03" height="28" rx="9" fill="#4cc1a5"/>
  <text x="1122.00" y="622" class="value">41.48 ops/s</text>
  <line x1="918" y1="642" x2="1244" y2="642" stroke="#d0d8e6" stroke-width="1"/>
  <text x="918" y="664" class="small">0</text>
  <text x="1156" y="664" class="small">41.48+</text>
  <text x="44" y="856" class="subtitle">Measured with ./gradlew :bluetape4k-csv:testBenchmark. Source tables remain in the post.</text>
</svg>
