<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">Tenant Schema Selection Across a Ktor Request</title><desc id="desc">Input validation is not authorization. Verify principal access and tenant readiness at separate boundaries.</desc><defs><marker id="arrow-cyan" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#36C5F0"/></marker><marker id="arrow-mint" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5EEAD4"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FBBF24"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FB7185"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A78BFA"/></marker></defs>
  <style>
  .bg{fill:#07111F}.panel{fill:#0D1B2D;stroke:#36536F;stroke-width:2}.card{fill:#10243A;stroke:#36536F;stroke-width:2}.card2{fill:#132B43;stroke:#36536F;stroke-width:2}
  .title{font:700 42px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}.sub{font:600 19px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}.h{font:700 24px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
  .body{font:600 17px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}.mono{font:700 16px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#E6F2FF}.small{font:600 14px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#9CB4CC}
  .life{stroke:#36536F;stroke-width:2;stroke-dasharray:8 9}.act{fill:#123252;stroke:#36C5F0;stroke-width:2}
  .call{fill:none;stroke:#36C5F0;stroke-width:4;marker-end:url(#arrow-cyan)}.ok{fill:none;stroke:#5EEAD4;stroke-width:4;marker-end:url(#arrow-mint)}
  .warn{fill:none;stroke:#FBBF24;stroke-width:4;marker-end:url(#arrow-amber)}.err{fill:none;stroke:#FB7185;stroke-width:4;marker-end:url(#arrow-red)}
  .violet{fill:none;stroke:#A78BFA;stroke-width:4;marker-end:url(#arrow-violet)}.return{stroke-dasharray:10 8}
  .pill{fill:#10243A;stroke:#36536F;stroke-width:2}.frame{fill:none;stroke:#FB7185;stroke-width:2;stroke-dasharray:10 8}
  .axis{stroke:#36536F;stroke-width:2}.grid{stroke:#233B54;stroke-width:1}.footer{fill:#0B2238;stroke:#36536F;stroke-width:2}
  </style>
<rect width="1800" height="1200" class="bg"/><rect x="32" y="32" width="1736" height="1136" rx="30" class="panel frame"/>
<text x="78" y="98" class="title">Tenant Schema Selection Across a Ktor Request</text><text x="80" y="138" class="sub subtitle">Validate raw headers in the plugin; pass only typed values through call attributes and the transaction boundary.</text><rect x="30" y="210" width="270" height="100" rx="20" class="card"/>
<text x="54" y="254" class="h participant">Client</text><text x="54" y="292" class="body">HTTP request</text><rect x="385" y="210" width="270" height="100" rx="20" class="card2"/>
<text x="409" y="254" class="h participant">TenantPlugin</text><text x="409" y="292" class="body">normalize + validate</text><rect x="740" y="210" width="270" height="100" rx="20" class="card"/>
<text x="764" y="254" class="h participant">Call attributes</text><text x="764" y="292" class="body">Tenants.Tenant</text><rect x="1095" y="210" width="270" height="100" rx="20" class="card"/>
<text x="1119" y="254" class="h participant">Route handler</text><text x="1119" y="292" class="body">explicit value</text><rect x="1450" y="210" width="270" height="100" rx="20" class="card"/>
<text x="1474" y="254" class="h participant">R2DBC transaction</text><text x="1474" y="292" class="body">schema + query</text><path d="M165 310 V1040" class="life"/><path d="M520 310 V1040" class="life"/><path d="M875 310 V1040" class="life"/><path d="M1230 310 V1040" class="life"/><path d="M1585 310 V1040" class="life"/><rect x="511" y="345" width="18" height="555" rx="8" class="act"/><rect x="1576" y="760" width="18" height="180" rx="8" class="act"/><rect x="185" y="302" width="330" height="42" rx="16" class="pill"/>
<circle cx="207" cy="323" r="14" fill="#0D1B2D" stroke="#36C5F0" stroke-width="2"/><text x="207" y="329" text-anchor="middle" class="mono badgeText">1</text>
<text x="233" y="329" class="mono labelText">send X-TENANT-ID</text><path d="M165 360 H508" class="call"/><rect x="552" y="392" width="330" height="42" rx="16" class="pill"/>
<circle cx="574" cy="413" r="14" fill="#0D1B2D" stroke="#5EEAD4" stroke-width="2"/><text x="574" y="419" text-anchor="middle" class="mono badgeText">2</text>
<text x="600" y="419" class="mono labelText">normalize and resolve tenant</text><path d="M532 450 H863" class="ok"/><rect x="552" y="482" width="330" height="42" rx="16" class="pill"/>
<circle cx="574" cy="503" r="14" fill="#0D1B2D" stroke="#5EEAD4" stroke-width="2"/><text x="574" y="509" text-anchor="middle" class="mono badgeText">3</text>
<text x="600" y="509" class="mono labelText">store typed tenant</text><path d="M532 540 H863" class="ok"/><rect x="907" y="572" width="330" height="42" rx="16" class="pill"/>
<circle cx="929" cy="593" r="14" fill="#0D1B2D" stroke="#A78BFA" stroke-width="2"/><text x="929" y="599" text-anchor="middle" class="mono badgeText">4</text>
<text x="955" y="599" class="mono labelText">read tenant value</text><path d="M1230 630 H887" class="call"/><rect x="1250" y="662" width="330" height="42" rx="16" class="pill"/>
<circle cx="1272" cy="683" r="14" fill="#0D1B2D" stroke="#A78BFA" stroke-width="2"/><text x="1272" y="689" text-anchor="middle" class="mono badgeText">5</text>
<text x="1298" y="689" class="mono labelText">start transaction</text><path d="M1230 720 H1573" class="violet"/><rect x="1250" y="752" width="330" height="42" rx="16" class="pill"/>
<circle cx="1272" cy="773" r="14" fill="#0D1B2D" stroke="#FBBF24" stroke-width="2"/><text x="1272" y="779" text-anchor="middle" class="mono badgeText">6</text>
<text x="1298" y="779" class="mono labelText">set current schema</text><path d="M1230 810 H1573" class="warn"/><rect x="704" y="857" width="330" height="42" rx="16" class="pill"/>
<circle cx="726" cy="878" r="14" fill="#0D1B2D" stroke="#5EEAD4" stroke-width="2"/><text x="726" y="884" text-anchor="middle" class="mono badgeText">7</text>
<text x="752" y="884" class="mono labelText">return rows</text><path d="M1573 915 H165" class="ok return"/><rect x="290" y="970" width="1180" height="72" rx="18" class="footer"/><text x="880" y="1014" text-anchor="middle" class="body">Rejection boundary: missing, blank, conflicting, or unknown tenant → 400 before DB access</text>
  <rect x="145" y="1080" width="1510" height="74" rx="20" class="footer"/><text x="900" y="1125" text-anchor="middle" class="body">Input validation is not authorization. Verify principal access and tenant readiness at separate boundaries.</text></svg>
