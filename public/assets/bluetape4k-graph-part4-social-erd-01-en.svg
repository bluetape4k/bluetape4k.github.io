<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 14 7 L 0 14 Z" fill="#496A8F" stroke="#496A8F"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#22344A;font-weight:400}
    .subtitle,.footer,.axis{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:17px;fill:#536476;font-weight:400}
    .nodeTitle,.participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:16px;fill:#3F5269;font-weight:400}
    .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .tableField,.edgeLabel{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;fill:#3F5269;font-weight:400}
    .edge{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#91A6BD;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1600" height="780"/>
<rect class="frame" x="34" y="28" width="1532" height="724" rx="24"/>
<text class="title" x="800" y="82" text-anchor="middle">Social Network Entity Graph</text>
<text class="subtitle" x="800" y="118" text-anchor="middle">People connect to people and companies through direction-aware relationships</text>
<g>
  <path class="edge" data-connector="person-to-friend" d="M450 396 L520 396 Q538 396 538 378 L538 300 Q538 282 556 282 L650 282"/>
  <rect x="478" y="312" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="538" y="331" text-anchor="middle">KNOWS</text>
</g>
<g>
  <path class="edge" data-connector="friend-to-company" d="M940 282 L1012 282 Q1030 282 1030 300 L1030 381 Q1030 399 1048 399 L1120 399"/>
  <rect x="957" y="314" width="146" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="1030" y="333" text-anchor="middle">colleague path</text>
</g>
<g>
  <path class="edge" data-connector="person-to-company" d="M450 434 L1120 434"/>
  <rect x="725" y="407" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="785" y="426" text-anchor="middle">WORKS_AT</text>
</g>
<g>
  <path class="edge" data-connector="person-to-follow" d="M450 468 L544 468 Q562 468 562 486 L562 534 Q562 552 580 552 L650 552"/>
  <rect x="502" y="483" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="562" y="502" text-anchor="middle">FOLLOWS</text>
</g>
<g id="person">
  <rect x="160" y="344" width="290" height="176" rx="8" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="160" y="344" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="160" y1="392" x2="450" y2="392" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="305" y="375" text-anchor="middle">Person</text>
  <line x1="160" y1="392" x2="450" y2="392" stroke="#D7E2EC"/>
  <text class="tableField" x="178" y="413">personId</text>
  <line x1="160" y1="422" x2="450" y2="422" stroke="#D7E2EC"/>
  <text class="tableField" x="178" y="443">name</text>
  <line x1="160" y1="452" x2="450" y2="452" stroke="#D7E2EC"/>
  <text class="tableField" x="178" y="473">location</text>
</g>
<g id="friend">
  <rect x="650" y="224" width="290" height="116" rx="8" fill="#EAF8EF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="650" y="224" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="650" y1="272" x2="940" y2="272" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="795" y="255" text-anchor="middle">Person</text>
  <line x1="650" y1="272" x2="940" y2="272" stroke="#D7E2EC"/>
  <text class="tableField" x="668" y="293">known person</text>
</g>
<g id="follow">
  <rect x="650" y="494" width="290" height="116" rx="8" fill="#F3ECFF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="650" y="494" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="650" y1="542" x2="940" y2="542" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="795" y="525" text-anchor="middle">Person</text>
  <line x1="650" y1="542" x2="940" y2="542" stroke="#D7E2EC"/>
  <text class="tableField" x="668" y="563">followee</text>
</g>
<g id="company">
  <rect x="1120" y="344" width="290" height="146" rx="8" fill="#FFF4D9" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="1120" y="344" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="1120" y1="392" x2="1410" y2="392" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="1265" y="375" text-anchor="middle">Company</text>
  <line x1="1120" y1="392" x2="1410" y2="392" stroke="#D7E2EC"/>
  <text class="tableField" x="1138" y="413">companyId</text>
  <line x1="1120" y1="422" x2="1410" y2="422" stroke="#D7E2EC"/>
  <text class="tableField" x="1138" y="443">name</text>
</g>
<rect x="88" y="684" width="1424" height="62" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="800" y="709" text-anchor="middle">Direction and depth decide whether a path becomes a recommendation or only an explanation.</text>
<text class="footer" x="800" y="733" text-anchor="middle">Exclude self and already-connected people before turning traversal results into candidates.</text>
</svg>
