<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360" role="img" aria-labelledby="title desc">
  <title id="title">CockroachDB serializable retry sequence</title>
  <desc id="desc">Sequence for the Exposed CockroachDB workshop path that connects through CockroachDatabase, wraps inventory reservation in withCockroachTransaction, and retries only CockroachDB serializable retry errors.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "goorm Sans"; font-size: 40px; font-weight: 400; fill: #F5F9FF; }
      .subtitle, .msg, .note, .footer, .role { font-family: "goorm Sans Code","goorm Sans"; fill: #D7E3F5; }
      .subtitle { font-size: 18px; }
      .participant { font-family: "goorm Sans"; font-size: 19px; font-weight: 400; fill: #F5F9FF; }
      .role { font-size: 13px; fill: #B8C7DD; }
      .msg { font-size: 14px; }
      .note { font-size: 13px; }
      .footer { font-size: 14px; fill: #8EA6C4; }
      .frame { fill: #0B1220; stroke: #284766; stroke-width: 3; }
      .header { fill: #0F1E33; stroke: #365979; stroke-width: 2; }
      .lifeline { stroke: #55718F; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #2D2415; stroke: #8f784e; stroke-width: 1.5; }
      .call { fill: none; stroke: #78AFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCall); }
      .sql { fill: none; stroke: #F2B84B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSql); }
      .state { fill: none; stroke: #6FD28C; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowState); }
      .return { fill: none; stroke: #EFC46B; stroke-width: 2.5; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowReturn); }
      .error { fill: none; stroke: #b45b5b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowError); }
      .alt { fill: none; stroke: #78AFFF; stroke-width: 3; stroke-dasharray: 12 7; }
      .label { fill: #0F1E33; stroke: #365979; stroke-width: 1.5; }
      .label.callLabel { stroke: #4F83B0; }
      .label.sqlLabel { stroke: #8F6F2C; }
      .label.stateLabel { stroke: #4D7B5E; }
      .label.returnLabel { stroke: #8F6F2C; }
      .label.errorLabel { stroke: #d7a2a2; }
      .badge { stroke-width: 1.8; }
      .badge.callBadge { fill: #102A43; stroke: #78AFFF; }
      .badge.sqlBadge { fill: #332812; stroke: #F2B84B; }
      .badge.stateBadge { fill: #142C22; stroke: #6FD28C; }
      .badge.returnBadge { fill: #332812; stroke: #EFC46B; }
      .badge.errorBadge { fill: #351923; stroke: #b45b5b; }
      .badgeText { font-family: "goorm Sans Code","goorm Sans"; font-size: 12px; font-weight: 700; }
      .msg.callText, .badgeText.callText { fill: #9DC7FF; }
      .msg.sqlText, .badgeText.sqlText { fill: #F5C76A; }
      .msg.stateText, .badgeText.stateText { fill: #8DE3A6; }
      .msg.returnText, .badgeText.returnText { fill: #F5CF7A; }
      .msg.errorText, .badgeText.errorText { fill: #934545; }
    </style>
    <marker id="arrowCall" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#78AFFF" stroke="#78AFFF" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowSql" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#F2B84B" stroke="#F2B84B" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowState" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6FD28C" stroke="#6FD28C" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowReturn" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#EFC46B" stroke="#EFC46B" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowError" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#b45b5b" stroke="#b45b5b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1312" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">CockroachDB 직렬화 충돌 재시도</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">CockroachDB 트랜잭션 재시작 오류일 때만 전체 재고 예약 트랜잭션을 재시도합니다.</text>

  <g id="participants">
    <rect x="60" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="145" y="179" text-anchor="middle" class="participant">워크숍 테스트</text>
    <text x="145" y="201" text-anchor="middle" class="role">JUnit + container</text>

    <rect x="292" y="150" width="216" height="68" rx="10" class="header"/>
    <text x="400" y="179" text-anchor="middle" class="participant">CockroachDatabase</text>
    <text x="400" y="201" text-anchor="middle" class="role">PostgreSQL wire</text>

    <rect x="578" y="150" width="222" height="68" rx="10" class="header"/>
    <text x="689" y="179" text-anchor="middle" class="participant">재고 서비스</text>
    <text x="689" y="201" text-anchor="middle" class="role">애플리케이션 경계</text>

    <rect x="870" y="150" width="210" height="68" rx="10" class="header"/>
    <text x="975" y="179" text-anchor="middle" class="participant">재시도 도우미</text>
    <text x="975" y="201" text-anchor="middle" class="role">withCockroachTransaction</text>

    <rect x="1150" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="1235" y="179" text-anchor="middle" class="participant">Exposed JDBC</text>
    <text x="1235" y="201" text-anchor="middle" class="role">단일 시도</text>

    <rect x="1380" y="150" width="160" height="68" rx="10" class="header"/>
    <text x="1460" y="179" text-anchor="middle" class="participant">CockroachDB</text>
    <text x="1460" y="201" text-anchor="middle" class="role">serializable</text>
  </g>

  <line x1="145" y1="218" x2="145" y2="1200" class="lifeline"/>
  <line x1="400" y1="218" x2="400" y2="1200" class="lifeline"/>
  <line x1="689" y1="218" x2="689" y2="1200" class="lifeline"/>
  <line x1="975" y1="218" x2="975" y2="1200" class="lifeline"/>
  <line x1="1235" y1="218" x2="1235" y2="1200" class="lifeline"/>
  <line x1="1460" y1="218" x2="1460" y2="1200" class="lifeline"/>

  <rect x="393" y="292" width="14" height="88" rx="6" class="activation"/>
  <rect x="682" y="440" width="14" height="730" rx="6" class="activation"/>
  <rect x="968" y="512" width="14" height="588" rx="6" class="activation"/>
  <rect x="1228" y="596" width="14" height="432" rx="6" class="activation"/>
  <rect x="1453" y="672" width="14" height="148" rx="6" class="activation"/>

  <rect x="72" y="258" width="482" height="34" rx="17" class="label callLabel"/>
  <circle cx="96" cy="275" r="13" class="badge callBadge"/><text x="96" y="280" text-anchor="middle" class="badgeText callText">1</text>
  <text x="120" y="280" class="msg callText">CockroachDatabase.connect(cockroach.url)</text>
  <path d="M 145 300 L 393 300" class="call" data-connector="connector"/>

  <rect x="202" y="330" width="430" height="34" rx="17" class="label returnLabel"/>
  <circle cx="226" cy="347" r="13" class="badge returnBadge"/><text x="226" y="352" text-anchor="middle" class="badgeText returnText">2</text>
  <text x="250" y="352" class="msg returnText">PostgreSQL JDBC 기반 데이터베이스</text>
  <path d="M 393 372 L 145 372" class="return" data-connector="connector"/>

  <rect x="80" y="406" width="462" height="34" rx="17" class="label stateLabel"/>
  <circle cx="104" cy="423" r="13" class="badge stateBadge"/><text x="104" y="428" text-anchor="middle" class="badgeText stateText">3</text>
  <text x="128" y="428" class="msg stateText">재고·원장 스키마 초기화</text>
  <path d="M 145 448 L 682 448" class="state" data-connector="connector"/>

  <rect x="736" y="478" width="440" height="34" rx="17" class="label callLabel"/>
  <circle cx="760" cy="495" r="13" class="badge callBadge"/><text x="760" y="500" text-anchor="middle" class="badgeText callText">4</text>
  <text x="784" y="500" class="msg callText">withCockroachTransaction(options)</text>
  <path d="M 696 520 L 968 520" class="call" data-connector="connector"/>

  <rect x="1034" y="562" width="402" height="34" rx="17" class="label sqlLabel"/>
  <circle cx="1058" cy="579" r="13" class="badge sqlBadge"/><text x="1058" y="584" text-anchor="middle" class="badgeText sqlText">5</text>
  <text x="1082" y="584" class="msg sqlText">SERIALIZABLE 시도 시작, maxAttempts=1</text>
  <path d="M 982 604 L 1228 604" class="sql" data-connector="connector"/>

  <rect x="1090" y="638" width="408" height="34" rx="17" class="label sqlLabel"/>
  <circle cx="1114" cy="655" r="13" class="badge sqlBadge"/><text x="1114" y="660" text-anchor="middle" class="badgeText sqlText">6</text>
  <text x="1138" y="660" class="msg sqlText">재고 조회·수량 갱신·원장 저장</text>
  <path d="M 1242 680 L 1453 680" class="sql" data-connector="connector"/>

  <rect x="910" y="718" width="588" height="134" rx="14" class="alt"/>
  <rect x="936" y="724" width="268" height="30" rx="15" fill="#351923" stroke="#b45b5b" stroke-width="1.8"/>
  <text x="960" y="744" class="note">재시도 가능한 충돌 경로</text>

  <rect x="1014" y="770" width="420" height="34" rx="17" class="label errorLabel"/>
  <circle cx="1038" cy="787" r="13" class="badge errorBadge"/><text x="1038" y="792" text-anchor="middle" class="badgeText errorText">7</text>
  <text x="1062" y="792" class="msg errorText">SQLSTATE 40001 restart transaction</text>
  <path d="M 1453 812 L 982 812" class="error" data-connector="connector"/>

  <rect x="724" y="870" width="510" height="34" rx="17" class="label stateLabel"/>
  <circle cx="748" cy="887" r="13" class="badge stateBadge"/><text x="748" y="892" text-anchor="middle" class="badgeText stateText">8</text>
  <text x="772" y="892" class="msg stateText">도우미가 CockroachDB 재시도 신호 분류</text>
  <path d="M 982 916 L 1100 916 Q 1112 916 1112 928 L 1112 946 Q 1112 958 1100 958 L 982 958" class="state" data-connector="connector"/>

  <rect x="790" y="978" width="456" height="34" rx="17" class="label callLabel"/>
  <circle cx="814" cy="995" r="13" class="badge callBadge"/><text x="814" y="1000" text-anchor="middle" class="badgeText callText">9</text>
  <text x="838" y="1000" class="msg callText">전체 예약 트랜잭션 재실행</text>
  <path d="M 982 1020 L 1228 1020" class="call" data-connector="connector"/>

  <rect x="742" y="1050" width="502" height="34" rx="17" class="label returnLabel"/>
  <circle cx="766" cy="1067" r="13" class="badge returnBadge"/><text x="766" y="1072" text-anchor="middle" class="badgeText returnText">10</text>
  <text x="790" y="1072" class="msg returnText">InventorySnapshot과 커밋된 원장 행 1개</text>
  <path d="M 968 1092 L 696 1092" class="return" data-connector="connector"/>
  <path d="M 682 1162 L 145 1162" class="return" data-connector="connector"/>

  <rect x="98" y="1230" width="1404" height="44" rx="12" fill="#0F1E33" stroke="#284766" stroke-width="2"/>
  <text x="118" y="1258" class="note">재시도할 수 없는 SQLSTATE, 취소, 인터럽트는 재시도 경계 밖에서 그대로 다시 던집니다.</text>
  <text x="800" y="1306" text-anchor="middle" class="footer">github.com/bluetape4k/exposed-workshop - 13-ecosystem-integrations/03-cockroachdb-retry</text>
</svg>
