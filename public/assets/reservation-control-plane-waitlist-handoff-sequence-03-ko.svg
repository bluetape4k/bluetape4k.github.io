<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1980" viewBox="0 0 2400 1980" role="img" aria-labelledby="title desc">
  <title id="title">FIFO waitlist 소유권 handoff</title>
  <desc id="desc">Bob이 Alice 취소 전에 waitlist에 먼저 들어간다. command service는 capacity resource를 먼저 잠그고 Alice의 hold를 취소한 뒤 가장 오래 기다린 대기자를 골라 ACTIVE offer와 notification outbox entry를 만들고 commit한다. Bob은 소유권과 expiry 검증 뒤 offer를 수락한다. 자리가 이전되므로 occupiedCount는 1로 유지된다. 대기자가 없는 branch에서만 capacity를 반환한다.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="0.58" stop-color="#0c1730"/><stop offset="1" stop-color="#10142a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/></filter>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f9fc4" stroke="#5f9fc4" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#88a86b" stroke="#88a86b" stroke-dasharray="none"/></marker>
    <marker id="arrow-amber" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c99a58" stroke="#c99a58" stroke-dasharray="none"/></marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b96b73" stroke="#b96b73" stroke-dasharray="none"/></marker>
    <style>
      .title{font-family:'goorm Sans',sans-serif;font-size:48px;font-weight:700;fill:#f8fafc}.subtitle{font-family:'goorm Sans Code','goorm Sans',monospace;font-size:20px;fill:#a9b8d4}.frame{fill:none;stroke:#2b4168;stroke-width:2}.participantCard{fill:#13233b;stroke:#5b789d;stroke-width:2;filter:url(#shadow)}.participant{font-family:'goorm Sans',sans-serif;font-size:22px;font-weight:700;fill:#f8fafc}.role{font-family:'goorm Sans',sans-serif;font-size:14px;fill:#9fb0ca}.lifeline{stroke:#52647f;stroke-width:2;stroke-dasharray:8 9}.activation{fill:#203b4d;stroke:#73a5bd;stroke-width:1.6}.activationGreen{fill:#30483f;stroke:#88a86b;stroke-width:1.6}.activationAmber{fill:#493a27;stroke:#c99a58;stroke-width:1.6}.seq{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 7}.labelPill{fill:#101b30;stroke-width:1.5}.labelText{font-family:'goorm Sans Code','goorm Sans',monospace;font-size:16px;font-weight:700}.badgeText{font-family:'goorm Sans Code',monospace;font-size:14px;font-weight:700}.altBox{fill:none;stroke:#71839f;stroke-width:2.2;stroke-dasharray:12 8}.branchDivider{stroke:#71839f;stroke-width:2;stroke-dasharray:12 8}.frameLabel{fill:#101b30;stroke-width:1.5}.frameText{font-family:'goorm Sans Code','goorm Sans',monospace;font-size:16px;font-weight:700}.note{font-family:'goorm Sans',sans-serif;font-size:17px;fill:#c7d3e7}.noteStrong{font-family:'goorm Sans',sans-serif;font-size:21px;font-weight:700;fill:#c9dda8}
      .participantCard{fill:#13233b!important}
    </style>
  </defs>

  <rect width="2400" height="1980" rx="34" fill="url(#canvas)"/><rect class="frame" x="30" y="28" width="2340" height="1924" rx="30"/>
  <text class="title" x="1200" y="76" text-anchor="middle">점유된 자리를 다시 열지 않고 인계한다</text>
  <text class="subtitle" x="1200" y="114" text-anchor="middle">자원 우선 잠금이 FIFO 소유권과 occupiedCount를 지킨다</text>

  <g id="participant-alice"><rect class="participantCard participant" x="40" y="150" width="280" height="92" rx="16" fill="#13233b"/><text class="participant" x="180" y="188" text-anchor="middle">Alice</text><text class="role" x="180" y="217" text-anchor="middle">현재 임시 예약 소유자</text><line class="lifeline" x1="180" y1="242" x2="180" y2="1850"/></g>
  <g id="participant-bob"><rect class="participantCard participant" x="540" y="150" width="280" height="92" rx="16" fill="#13233b"/><text class="participant" x="680" y="188" text-anchor="middle">Bob</text><text class="role" x="680" y="217" text-anchor="middle">가장 오래 기다린 대기자</text><line class="lifeline" x1="680" y1="242" x2="680" y2="1850"/></g>
  <g id="participant-api"><rect class="participantCard participant" x="1000" y="150" width="360" height="92" rx="16" fill="#13233b"/><text class="participant" x="1180" y="188" text-anchor="middle">예약 API</text><text class="role" x="1180" y="217" text-anchor="middle">HTTP 명령 경계</text><line class="lifeline" x1="1180" y1="242" x2="1180" y2="1850"/></g>
  <g id="participant-service"><rect class="participantCard participant" x="1500" y="150" width="360" height="92" rx="16" fill="#13233b"/><text class="participant" x="1680" y="188" text-anchor="middle">명령 / 인계</text><text class="role" x="1680" y="217" text-anchor="middle">자원 우선 트랜잭션</text><line class="lifeline" x1="1680" y1="242" x2="1680" y2="1850"/></g>
  <g id="participant-postgresql"><rect class="participantCard participant" x="2000" y="150" width="360" height="92" rx="16" fill="#13233b"/><text class="participant" x="2180" y="188" text-anchor="middle">PostgreSQL</text><text class="role" x="2180" y="217" text-anchor="middle">임시 예약 · 대기 목록 · 제안</text><line class="lifeline" x1="2180" y1="242" x2="2180" y2="1850"/></g>

  <rect class="activation" x="1172" y="330" width="16" height="1460" rx="5"/><rect class="activationAmber" x="1672" y="480" width="16" height="1310" rx="5"/><rect class="activationGreen" x="2172" y="610" width="16" height="1180" rx="5"/>

  <g id="m1"><rect class="labelPill" x="720" y="280" width="420" height="40" rx="20" stroke="#5f9fc4"/><circle cx="744" cy="300" r="14" fill="#173148" stroke="#5f9fc4"/><text class="badgeText" x="744" y="305" text-anchor="middle" fill="#a8d6ee">1</text><text class="labelText" x="940" y="306" text-anchor="middle" fill="#a8d6ee">Bob이 대기 목록에 등록</text><path class="seq" data-connector="bob-joins-waitlist" d="M 680 350 H 1180" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/></g>
  <g id="m2"><rect class="labelPill" x="420" y="400" width="540" height="40" rx="20" stroke="#5f9fc4"/><circle cx="444" cy="420" r="14" fill="#173148" stroke="#5f9fc4"/><text class="badgeText" x="444" y="425" text-anchor="middle" fill="#a8d6ee">2</text><text class="labelText" x="700" y="426" text-anchor="middle" fill="#a8d6ee">Alice가 현재 임시 예약 취소</text><path class="seq" data-connector="alice-cancel-api" d="M 180 470 H 1180" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/><path class="seq" data-connector="api-cancel-service" d="M 1180 505 H 1680" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/></g>
  <g id="m3"><rect class="labelPill" x="1570" y="550" width="390" height="40" rx="20" stroke="#c99a58"/><circle cx="1594" cy="570" r="14" fill="#423324" stroke="#c99a58"/><text class="badgeText" x="1594" y="575" text-anchor="middle" fill="#f1d6a7">3</text><text class="labelText" x="1775" y="576" text-anchor="middle" fill="#f1d6a7">자원 행 FOR UPDATE</text><path class="seq" data-connector="resource-lock" d="M 1680 620 H 2180" stroke="#c99a58" marker-end="url(#arrow-amber)"/></g>
  <g id="m4"><rect class="labelPill" x="1570" y="680" width="390" height="40" rx="20" stroke="#88a86b"/><circle cx="1594" cy="700" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="1594" y="705" text-anchor="middle" fill="#c9dda8">4</text><text class="labelText" x="1775" y="706" text-anchor="middle" fill="#c9dda8">Alice 임시 예약 → CANCELLED</text><path class="seq" data-connector="cancel-hold" d="M 1680 750 H 2180" stroke="#88a86b" marker-end="url(#arrow-green)"/></g>

  <g id="waiter-branch"><rect class="altBox" x="1450" y="790" width="890" height="520" rx="22"/><rect class="frameLabel" x="1480" y="770" width="300" height="40" rx="20" stroke="#88a86b"/><text class="frameText" x="1630" y="796" text-anchor="middle" fill="#c9dda8">alt 대기자 있음</text><line class="branchDivider" x1="1450" y1="1110" x2="2340" y2="1110"/><rect class="frameLabel" x="1480" y="1090" width="270" height="40" rx="20" stroke="#c99a58"/><text class="frameText" x="1615" y="1116" text-anchor="middle" fill="#f1d6a7">else 대기자 없음</text></g>
  <g id="m5"><rect class="labelPill" x="1520" y="820" width="500" height="40" rx="20" stroke="#c99a58"/><circle cx="1544" cy="840" r="14" fill="#423324" stroke="#c99a58"/><text class="badgeText" x="1544" y="845" text-anchor="middle" fill="#f1d6a7">5</text><text class="labelText" x="1775" y="846" text-anchor="middle" fill="#f1d6a7">가장 오래된 WAITING 행 선택</text><path class="seq" data-connector="oldest-waiter" d="M 1680 890 H 2180" stroke="#c99a58" marker-end="url(#arrow-amber)"/></g>
  <g id="m6"><rect class="labelPill" x="1500" y="950" width="540" height="40" rx="20" stroke="#88a86b"/><circle cx="1524" cy="970" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="1524" y="975" text-anchor="middle" fill="#c9dda8">6</text><text class="labelText" x="1770" y="976" text-anchor="middle" fill="#c9dda8">ACTIVE 제안 + 아웃박스 생성 · 커밋</text><path class="seq" data-connector="offer-and-outbox" d="M 1680 1020 H 2180" stroke="#88a86b" marker-end="url(#arrow-green)"/><path class="seqReturn" data-connector="offer-commit" d="M 2180 1060 H 1680" stroke="#5ab3aa"/><polygon points="1694,1052 1680,1060 1694,1068" fill="#5ab3aa" stroke="#5ab3aa" stroke-dasharray="none" data-direct-solid-head="true"/></g>
  <g id="no-waiter-release"><rect class="labelPill" x="1510" y="1150" width="510" height="40" rx="20" stroke="#b96b73"/><text class="labelText" x="1765" y="1176" text-anchor="middle" fill="#e5a5ac">예약 수량 반환 · occupiedCount − 1</text><path class="seq" data-connector="no-waiter-release" d="M 1680 1230 H 2180" stroke="#b96b73" marker-end="url(#arrow-red)"/></g>

  <g id="m7"><rect class="labelPill" x="740" y="1320" width="380" height="40" rx="20" stroke="#5f9fc4"/><circle cx="764" cy="1340" r="14" fill="#173148" stroke="#5f9fc4"/><text class="badgeText" x="764" y="1345" text-anchor="middle" fill="#a8d6ee">7</text><text class="labelText" x="940" y="1346" text-anchor="middle" fill="#a8d6ee">Bob이 제안 수락</text><path class="seq" data-connector="bob-accept-api" d="M 680 1390 H 1180" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/><path class="seq" data-connector="api-accept-service" d="M 1180 1425 H 1680" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/></g>
  <g id="m8"><rect class="labelPill" x="1470" y="1470" width="590" height="40" rx="20" stroke="#c99a58"/><circle cx="1494" cy="1490" r="14" fill="#423324" stroke="#c99a58"/><text class="badgeText" x="1494" y="1495" text-anchor="middle" fill="#f1d6a7">8</text><text class="labelText" x="1770" y="1496" text-anchor="middle" fill="#f1d6a7">소유자 · 상태 · 리비전 · 만료 시각 검증</text><path class="seq" data-connector="validate-offer" d="M 1680 1540 H 2180" stroke="#c99a58" marker-end="url(#arrow-amber)"/></g>
  <g id="m9"><rect class="labelPill" x="1460" y="1600" width="610" height="40" rx="20" stroke="#88a86b"/><circle cx="1484" cy="1620" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="1484" y="1625" text-anchor="middle" fill="#c9dda8">9</text><text class="labelText" x="1765" y="1626" text-anchor="middle" fill="#c9dda8">제안 + 대기 항목 수락 · 확정 예약 생성</text><path class="seq" data-connector="accept-and-confirm" d="M 1680 1670 H 2180" stroke="#88a86b" marker-end="url(#arrow-green)"/></g>
  <g id="m10"><rect class="labelPill" x="1510" y="1730" width="510" height="40" rx="20" stroke="#5ab3aa"/><circle cx="1534" cy="1750" r="14" fill="#173d3e" stroke="#5ab3aa"/><text class="badgeText" x="1534" y="1755" text-anchor="middle" fill="#a9e4df">10</text><text class="labelText" x="1770" y="1756" text-anchor="middle" fill="#a9e4df">커밋 · occupiedCount는 1 유지</text><path class="seqReturn" data-connector="handoff-commit" d="M 2180 1800 H 680" stroke="#5ab3aa"/><polygon points="694,1792 680,1800 694,1808" fill="#5ab3aa" stroke="#5ab3aa" stroke-dasharray="none" data-direct-solid-head="true"/></g>

  <rect x="390" y="1850" width="1620" height="70" rx="20" fill="#102038" stroke="#88a86b" stroke-width="2"/><text class="noteStrong" x="1200" y="1880" text-anchor="middle">점유된 자리는 소유자만 바뀐다; 해제 후 재점유가 아니다</text><text class="note" x="1200" y="1908" text-anchor="middle">대기자가 없을 때만 occupiedCount를 줄인다</text>
</svg>
