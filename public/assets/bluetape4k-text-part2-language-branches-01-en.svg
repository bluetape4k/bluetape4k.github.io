<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Validation and Processing Boundaries for Multilingual Text</title>
  <desc id="desc">Flow separating HTTP body limits, string validation, Lingua detection, Korean, Japanese, and generic processors, and application-owned routing policy</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#60A5FA"/>
    </marker>
  </defs>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0D1B2D;stroke:#38506A;stroke-width:2}
    .card{fill:#10243A;stroke:#38506A;stroke-width:2}
    .title{font:700 30px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
    .subtitle{font:500 15px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#A9BDD1}
    .card-title{font:700 18px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
    .branch-title{font:700 18px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
    .body{font:500 15px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#A9BDD1}
    .connector{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .branch{stroke:#36C5F0}
    .policy-title{font:700 18px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
    .policy{font:500 14px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#A9BDD1}
  </style>
  <rect width="1600" height="980" class="canvas"/>
  <rect x="32" y="32" width="1536" height="916" rx="32" class="frame"/>
  <text x="80" y="104" class="title">Validation and Processing Boundaries for Multilingual Text</text>
  <text x="80" y="148" class="subtitle">Cap the request body at transport, validate the materialized string, detect languages, and let application policy choose processors</text>
  <rect x="64" y="196" width="1472" height="574" rx="28" fill="#0A1727" stroke="#38506A" stroke-width="2"/>
  <path data-connector="top-1" d="M 400 325 H 460" class="connector" marker-end="url(#arrow)"/>
<path data-connector="top-2" d="M 780 325 H 840" class="connector" marker-end="url(#arrow)"/>
<path data-connector="top-3" d="M 1160 325 H 1220" class="connector" marker-end="url(#arrow)"/>
  <path data-connector="branch-1" d="M 1300 420 V 439 Q 1300 455 1284 455 H 316 Q 300 455 300 471 V 548" class="connector branch" marker-end="url(#arrow)"/>
<path data-connector="branch-2" d="M 1380 420 V 469 Q 1380 485 1364 485 H 816 Q 800 485 800 501 V 548" class="connector branch" marker-end="url(#arrow)"/>
<path data-connector="branch-3" d="M 1460 420 V 499 Q 1460 515 1444 515 H 1316 Q 1300 515 1300 531 V 548" class="connector branch" marker-end="url(#arrow)"/>
  <g data-card="stage-1">
      <rect x="80" y="230" width="320" height="190" rx="22" class="card"/>
      <rect x="80" y="230" width="320" height="7" rx="3" fill="#60A5FA"/>
      <text x="104" y="285" class="card-title">HTTP body</text>
      <text x="104" y="336" class="body"><tspan x="104" dy="0">Byte stream</tspan><tspan x="104" dy="32">Content-Type</tspan></text>
    </g>
<g data-card="stage-2">
      <rect x="460" y="230" width="320" height="190" rx="22" class="card"/>
      <rect x="460" y="230" width="320" height="7" rx="3" fill="#36C5F0"/>
      <text x="484" y="285" class="card-title">Transport</text>
      <text x="484" y="336" class="body"><tspan x="484" dy="0">Cap body size</tspan><tspan x="484" dy="32">Bounded String decode</tspan></text>
    </g>
<g data-card="stage-3">
      <rect x="840" y="230" width="320" height="190" rx="22" class="card"/>
      <rect x="840" y="230" width="320" height="7" rx="3" fill="#5EEAD4"/>
      <text x="864" y="285" class="card-title">Input validation</text>
      <text x="864" y="336" class="body"><tspan x="864" dy="0">Reject blank input</tspan><tspan x="864" dy="32">At most 100,000 chars</tspan></text>
    </g>
<g data-card="stage-4">
      <rect x="1220" y="230" width="320" height="190" rx="22" class="card"/>
      <rect x="1220" y="230" width="320" height="7" rx="3" fill="#B794F4"/>
      <text x="1244" y="285" class="card-title">Lingua detection</text>
      <text x="1244" y="336" class="body"><tspan x="1244" dy="0">Shared detector</tspan><tspan x="1244" dy="32">Set&lt;Language&gt;</tspan></text>
    </g>
  <g data-card="branch-1">
      <rect x="120" y="560" width="360" height="180" rx="22" class="card"/>
      <circle cx="148" cy="594" r="8" fill="#36C5F0"/>
      <text x="170" y="603" class="branch-title">Korean processor</text>
      <text x="148" y="656" class="body"><tspan x="148" dy="0">normalize / tokenize</tspan><tspan x="148" dy="31">tokens / phrases / stems</tspan></text>
    </g>
<g data-card="branch-2">
      <rect x="620" y="560" width="360" height="180" rx="22" class="card"/>
      <circle cx="648" cy="594" r="8" fill="#B794F4"/>
      <text x="670" y="603" class="branch-title">Japanese processor</text>
      <text x="648" y="656" class="body"><tspan x="648" dy="0">tokenize / filterNoun</tspan><tspan x="648" dy="31">nouns / blockword result</tspan></text>
    </g>
<g data-card="branch-3">
      <rect x="1120" y="560" width="360" height="180" rx="22" class="card"/>
      <circle cx="1148" cy="594" r="8" fill="#FBBF24"/>
      <text x="1170" y="603" class="branch-title">Generic processor</text>
      <text x="1148" y="656" class="body"><tspan x="1148" dy="0">TextNormalizer</tspan><tspan x="1148" dy="31">keywords / unresolved state</tspan></text>
    </g>
  <g data-card="policy">
    <rect x="80" y="790" width="1440" height="144" rx="22" fill="#0A1727" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="112" cy="824" r="8" fill="#FBBF24"/>
    <text x="134" y="832" class="policy-title">The application owns processing policy</text>
    <text x="112" y="866" class="policy"><tspan x="112" dy="0">Mixed-language input may run one or several processors, depending on purpose.</tspan><tspan x="112" dy="22">The application also maps library length exceptions to HTTP 4xx responses.</tspan><tspan x="112" dy="22">Reuse the detector; the coroutine workshop guards shared access with a Mutex.</tspan></text>
  </g>
</svg>