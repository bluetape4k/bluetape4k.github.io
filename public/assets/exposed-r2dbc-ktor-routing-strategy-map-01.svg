<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Spring JDBC and Ktor R2DBC routing strategy map</title>
  <desc id="desc">A comparison map showing how Spring JDBC and Ktor R2DBC examples solve tenant and read/write routing with different context carriers and transaction boundaries.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke="#059669" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas { fill: #f8fbff; }
      .title { font: 700 42px "Architects Daughter", "Comic Mono", Inter, sans-serif; fill: #102a43; }
      .subtitle { font: 400 22px "Comic Mono", Inter, sans-serif; fill: #475569; }
      .problem { fill: #eef2ff; stroke: #a5b4fc; stroke-width: 3; filter: url(#shadow); }
      .spring { fill: #fff7ed; stroke: #fdba74; stroke-width: 3; filter: url(#shadow); }
      .ktor { fill: #ecfeff; stroke: #67e8f9; stroke-width: 3; filter: url(#shadow); }
      .shared { fill: #f0fdf4; stroke: #86efac; stroke-width: 3; filter: url(#shadow); }
      .header { font: 700 28px "Architects Daughter", "Comic Mono", Inter, sans-serif; fill: #0f172a; text-anchor: middle; }
      .card-title { font: 700 23px "Architects Daughter", "Comic Mono", Inter, sans-serif; fill: #0f172a; }
      .body { font: 400 17px "Comic Mono", Inter, sans-serif; fill: #334155; }
      .mono { font: 700 16px "Comic Mono", Inter, sans-serif; fill: #1e40af; }
      .arrow-blue { stroke: #2563eb; stroke-width: 4.4; marker-end: url(#arrow-blue); stroke-linecap: round; stroke-linejoin: round; }
      .arrow-green { stroke: #059669; stroke-width: 4.4; marker-end: url(#arrow-green); stroke-linecap: round; stroke-linejoin: round; }
      .label { font: 700 17px "Comic Mono", Inter, sans-serif; fill: #1e293b; text-anchor: middle; }
      .row { fill: #ffffff; stroke: #dbeafe; stroke-width: 2; }
      .row-alt { fill: #f8fafc; stroke: #dbeafe; stroke-width: 2; }
      .cell-title { font: 700 18px "Comic Mono", Inter, sans-serif; fill: #0f172a; }
      .cell-text { font: 400 16px "Comic Mono", Inter, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="980"/>
  <text class="title" x="80" y="76">Same routing problem, different runtime boundary</text>
  <text class="subtitle" x="80" y="112">Do not copy the carrier. Copy the invariant: validate once, pass explicit values, prove isolation.</text>

  <g transform="translate(350 150)">
    <rect class="problem" x="0" y="0" width="900" height="108" rx="24"/>
    <text class="header" x="450" y="42">Reader problem</text>
    <text class="body" x="82" y="72">Select the right tenant schema or R2DBC target.</text>
    <text class="body" x="82" y="96">Do it without leaking state to the next request.</text>
  </g>

  <g transform="translate(100 330)">
    <rect class="spring" x="0" y="0" width="570" height="440" rx="24"/>
    <text class="header" x="285" y="48">Spring / JDBC workshop</text>
    <rect class="row" x="38" y="82" width="494" height="78" rx="14"/>
    <text class="cell-title" x="62" y="112">Carrier</text>
    <text class="cell-text" x="62" y="136">ThreadLocal, ScopedValue, ReactorContext</text>
    <text class="cell-text" x="62" y="154">chosen by runtime model</text>
    <rect class="row-alt" x="38" y="166" width="494" height="78" rx="14"/>
    <text class="cell-title" x="62" y="196">Boundary</text>
    <text class="cell-text" x="62" y="220">filter, AOP, or transaction template</text>
    <rect class="row" x="38" y="250" width="494" height="78" rx="14"/>
    <text class="cell-title" x="62" y="280">Target choice</text>
    <text class="cell-text" x="62" y="304">schema switch or datasource selection</text>
    <text class="cell-text" x="62" y="322">inside JDBC transaction</text>
    <rect class="row-alt" x="38" y="334" width="494" height="78" rx="14"/>
    <text class="cell-title" x="62" y="364">Watch out</text>
    <text class="cell-text" x="62" y="388">Thread affinity and cleanup rules</text>
    <text class="cell-text" x="62" y="406">are correctness rules</text>
  </g>

  <g transform="translate(930 330)">
    <rect class="ktor" x="0" y="0" width="570" height="440" rx="24"/>
    <text class="header" x="285" y="48">Ktor / Exposed R2DBC workshop</text>
    <rect class="row" x="38" y="82" width="494" height="78" rx="14"/>
    <text class="cell-title" x="62" y="112">Carrier</text>
    <text class="cell-text" x="62" y="136">call.attributes stores validated enum</text>
    <text class="cell-text" x="62" y="154">or RoutingRequest value</text>
    <rect class="row-alt" x="38" y="166" width="494" height="78" rx="14"/>
    <text class="cell-title" x="62" y="196">Boundary</text>
    <text class="cell-text" x="62" y="220">plugin resolves headers</text>
    <text class="cell-text" x="62" y="238">repository receives explicit route</text>
    <rect class="row" x="38" y="250" width="494" height="78" rx="14"/>
    <text class="cell-title" x="62" y="280">Target choice</text>
    <text class="cell-text" x="62" y="304">SET SCHEMA for tenant</text>
    <text class="cell-text" x="62" y="322">or registry.database(route.key)</text>
    <rect class="row-alt" x="38" y="334" width="494" height="78" rx="14"/>
    <text class="cell-title" x="62" y="364">Watch out</text>
    <text class="cell-text" x="62" y="388">Headers are routing hints</text>
    <text class="cell-text" x="62" y="406">not authentication or policy</text>
  </g>

  <line class="arrow-blue" x1="385" y1="258" x2="385" y2="324"/>
  <text class="label" x="385" y="300">blocking path</text>
  <line class="arrow-green" x1="1215" y1="258" x2="1215" y2="324"/>
  <text class="label" x="1215" y="300">coroutine path</text>

  <g transform="translate(255 815)">
    <rect class="shared" x="0" y="0" width="1090" height="120" rx="24"/>
    <text class="card-title" x="40" y="39">Shared invariant</text>
    <text class="body" x="40" y="70">Tests must prove isolation, invalid input rejection, write target separation,</text>
    <text class="body" x="40" y="92">and concurrent request state isolation.</text>
    <rect class="row" x="790" y="20" width="250" height="28" rx="10"/>
    <text class="mono" x="812" y="40">korean != english</text>
    <rect class="row-alt" x="790" y="56" width="250" height="28" rx="10"/>
    <text class="mono" x="812" y="76">acme:rw != acme:ro</text>
  </g>
</svg>
