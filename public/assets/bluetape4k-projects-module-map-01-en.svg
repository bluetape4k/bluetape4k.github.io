<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="840" viewBox="0 0 1580 840" role="img">
<title>Projects Module Map</title>
<desc>Choose a module by the boundary your service actually touches.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1D3148" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#4D6F9F"/></marker>
  <style>
    .bg{fill:#F7F9FC}.frame{fill:#fff;stroke:#D6E2ED;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#21334A;font-weight:700}
    .subtitle,.body,.small{font-family:"Comic Mono","Courier New",monospace;fill:#34465B}
    .subtitle{font-size:17px}.body{font-size:14px}.small{font-size:12px;fill:#657386}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;fill:#21334A;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke:#4D6F9F;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bar-label{font-family:"Comic Mono","Courier New",monospace;font-size:15px;fill:#26384F}.axis{stroke:#B8C7D9;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1580" height="840"/>
<rect class="frame" x="34" y="28" width="1512" height="784" rx="24"/>
<text class="title" x="70" y="82">Projects Module Map</text>
<text class="subtitle" x="72" y="114">Choose a module by the boundary your service actually touches.</text>
<g data-card="Foundation">
  <rect class="card" x="80" y="185" width="240" height="98" rx="14" fill="#E8F1FF" stroke="#5A85D6"/>
  <text class="label" x="200" y="219" text-anchor="middle"><tspan x="200" dy="0">Foundation</tspan></text>
  <text class="body" x="200" y="253" text-anchor="middle"></text>
</g>
<g data-card="Representative modules">
  <rect class="card" x="430" y="185" width="470" height="98" rx="14" fill="#F5F7FA" stroke="#8FA1B3"/>
  <text class="label" x="665" y="219" text-anchor="middle"><tspan x="665" dy="0">Representative modules</tspan></text>
  <text class="body" x="665" y="253" text-anchor="middle"><tspan x="665" dy="0">core · coroutines · logging · bom</tspan></text>
</g>
<g data-card="Adoption trigger">
  <rect class="card" x="1010" y="185" width="430" height="98" rx="14" fill="#FFF3D8" stroke="#D6A441"/>
  <text class="label" x="1225" y="219" text-anchor="middle"><tspan x="1225" dy="0">Adoption trigger</tspan></text>
  <text class="body" x="1225" y="253" text-anchor="middle"><tspan x="1225" dy="0">Kotlin style, execution, dependency alignment</tspan></text>
</g>
<path class="connector" data-connector="module-row-1-to-modules" d="M320 234 H430"/>
<path class="connector" data-connector="module-row-1-to-trigger" d="M900 234 H1010"/>
<g data-card="I/O and Wire">
  <rect class="card" x="80" y="330" width="240" height="98" rx="14" fill="#E7F7F5" stroke="#3CA7A0"/>
  <text class="label" x="200" y="364" text-anchor="middle"><tspan x="200" dy="0">I/O and Wire</tspan></text>
  <text class="body" x="200" y="398" text-anchor="middle"></text>
</g>
<g data-card="Representative modules">
  <rect class="card" x="430" y="330" width="470" height="98" rx="14" fill="#F5F7FA" stroke="#8FA1B3"/>
  <text class="label" x="665" y="364" text-anchor="middle"><tspan x="665" dy="0">Representative modules</tspan></text>
  <text class="body" x="665" y="398" text-anchor="middle"><tspan x="665" dy="0">io · okio · csv · protobuf · jackson · http · grpc</tspan></text>
</g>
<g data-card="Adoption trigger">
  <rect class="card" x="1010" y="330" width="430" height="98" rx="14" fill="#FFF3D8" stroke="#D6A441"/>
  <text class="label" x="1225" y="364" text-anchor="middle"><tspan x="1225" dy="0">Adoption trigger</tspan></text>
  <text class="body" x="1225" y="398" text-anchor="middle"><tspan x="1225" dy="0">bytes, serializers, HTTP, RPC</tspan></text>
</g>
<path class="connector" data-connector="module-row-2-to-modules" d="M320 379 H430"/>
<path class="connector" data-connector="module-row-2-to-trigger" d="M900 379 H1010"/>
<g data-card="Data and Infra">
  <rect class="card" x="80" y="475" width="240" height="98" rx="14" fill="#EAF7ED" stroke="#58A978"/>
  <text class="label" x="200" y="509" text-anchor="middle"><tspan x="200" dy="0">Data and Infra</tspan></text>
  <text class="body" x="200" y="543" text-anchor="middle"></text>
</g>
<g data-card="Representative modules">
  <rect class="card" x="430" y="475" width="470" height="98" rx="14" fill="#F5F7FA" stroke="#8FA1B3"/>
  <text class="label" x="665" y="509" text-anchor="middle"><tspan x="665" dy="0">Representative modules</tspan></text>
  <text class="body" x="665" y="543" text-anchor="middle"><tspan x="665" dy="0">jdbc · r2dbc · hibernate · redis · kafka · nats</tspan></text>
</g>
<g data-card="Adoption trigger">
  <rect class="card" x="1010" y="475" width="430" height="98" rx="14" fill="#FFF3D8" stroke="#D6A441"/>
  <text class="label" x="1225" y="509" text-anchor="middle"><tspan x="1225" dy="0">Adoption trigger</tspan></text>
  <text class="body" x="1225" y="543" text-anchor="middle"><tspan x="1225" dy="0">persistence and operational systems</tspan></text>
</g>
<path class="connector" data-connector="module-row-3-to-modules" d="M320 524 H430"/>
<path class="connector" data-connector="module-row-3-to-trigger" d="M900 524 H1010"/>
<g data-card="Application and Tests">
  <rect class="card" x="80" y="620" width="240" height="98" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="200" y="654" text-anchor="middle"><tspan x="200" dy="0">Application and Tests</tspan></text>
  <text class="body" x="200" y="688" text-anchor="middle"></text>
</g>
<g data-card="Representative modules">
  <rect class="card" x="430" y="620" width="470" height="98" rx="14" fill="#F5F7FA" stroke="#8FA1B3"/>
  <text class="label" x="665" y="654" text-anchor="middle"><tspan x="665" dy="0">Representative modules</tspan></text>
  <text class="body" x="665" y="688" text-anchor="middle"><tspan x="665" dy="0">spring-boot/* · ktor/* · assertions · junit5</tspan></text>
</g>
<g data-card="Adoption trigger">
  <rect class="card" x="1010" y="620" width="430" height="98" rx="14" fill="#FFF3D8" stroke="#D6A441"/>
  <text class="label" x="1225" y="654" text-anchor="middle"><tspan x="1225" dy="0">Adoption trigger</tspan></text>
  <text class="body" x="1225" y="688" text-anchor="middle"><tspan x="1225" dy="0">service entrypoints and reusable proof</tspan></text>
</g>
<path class="connector" data-connector="module-row-4-to-modules" d="M320 669 H430"/>
<path class="connector" data-connector="module-row-4-to-trigger" d="M900 669 H1010"/>
</svg>