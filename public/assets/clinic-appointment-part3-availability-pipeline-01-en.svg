<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1180" viewBox="0 0 2000 1180" role="img" aria-labelledby="title desc">
  <title id="title">Clinic-specific appointment availability pipeline</title>
  <desc id="desc">For the clinic's local date, the pipeline checks full-day blockers and intersects clinic hours with doctor hours. It removes breaks, partial closures, and doctor absences, then validates patient capacity and equipment availability for each candidate slot.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f" />
      <stop offset="0.55" stop-color="#0c1730" />
      <stop offset="1" stop-color="#10142a" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233d" />
      <stop offset="1" stop-color="#151a34" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.58" />
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#58a6c9" />
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#8da66b" />
    </marker>
    <style>
      .title { font-family: 'Architects Daughter', cursive; font-size: 42px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Comic Mono', monospace; font-size: 20px; fill: #a9b8d4; }
      .panel-title { font-family: 'Architects Daughter', cursive; font-size: 27px; font-weight: 700; fill: #f8fafc; }
      .card-title { font-family: 'Architects Daughter', cursive; font-size: 22px; font-weight: 700; fill: #f8fafc; }
      .body { font-family: 'Comic Mono', monospace; font-size: 17px; fill: #c7d3e7; }
      .body-tight { font-family: 'Comic Mono', monospace; font-size: 13px; fill: #c7d3e7; }
      .mono { font-family: 'Comic Mono', monospace; font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .small { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #a9b8d4; }
      .micro { font-family: 'Comic Mono', monospace; font-size: 12px; fill: #a9b8d4; }
      .tick { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #8ea0bd; }
      .connector { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 4; }
      .primary { stroke: #58a6c9; marker-end: url(#arrowBlue); }
      .accepted { stroke: #8da66b; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="2000" height="1180" rx="32" fill="url(#canvas)" />
  <rect x="28" y="28" width="1944" height="1124" rx="28" fill="none" stroke="#263a5e" stroke-width="2" />

  <text class="title" x="1000" y="70" text-anchor="middle">Availability Is the Intersection of Many Constraints</text>
  <text class="subtitle" x="1000" y="106" text-anchor="middle">full-day blockers · effective time ranges · per-candidate resource checks</text>

  <g>
    <rect x="60" y="140" width="1880" height="390" rx="28" fill="url(#panel)" stroke="#2b4168" stroke-width="2" />
    <text class="panel-title" x="96" y="184">Appointment availability pipeline</text>

    <path class="connector primary" data-connector="blockers-effective" d="M 600 340 H 700" />
    <path class="connector accepted" data-connector="effective-candidates" d="M 1300 340 H 1400" />

    <g filter="url(#shadow)">
      <rect class="card" x="90" y="220" width="510" height="240" rx="24" fill="#2d2432" stroke="#c46b6b" stroke-width="2" />
      <text class="card-title" x="345" y="264" text-anchor="middle">1. Check full-day blockers first</text>
      <rect x="122" y="292" width="210" height="48" rx="13" fill="#3d2931" stroke="#c46b6b" />
      <text class="body-tight" x="227" y="323" text-anchor="middle">holiday · full-day closure</text>
      <rect x="358" y="292" width="210" height="48" rx="13" fill="#3d2931" stroke="#c46b6b" />
      <text class="body" x="463" y="323" text-anchor="middle">no clinic hours</text>
      <rect x="122" y="356" width="210" height="48" rx="13" fill="#3d2931" stroke="#c46b6b" />
      <text class="body" x="227" y="387" text-anchor="middle">no doctor hours</text>
      <rect x="358" y="356" width="210" height="48" rx="13" fill="#3d2931" stroke="#c46b6b" />
      <text class="body-tight" x="463" y="387" text-anchor="middle">doctor absent all day</text>
      <text class="small" x="345" y="438" text-anchor="middle">Any match returns an empty list immediately</text>
    </g>

    <g filter="url(#shadow)">
      <rect class="card" x="700" y="220" width="600" height="240" rx="24" fill="#172f43" stroke="#58a6c9" stroke-width="2" />
      <text class="card-title" x="1000" y="264" text-anchor="middle">2. Compute the effective time ranges</text>
      <rect x="744" y="296" width="220" height="52" rx="14" fill="#15344b" stroke="#58a6c9" />
      <text class="body" x="854" y="328" text-anchor="middle">clinic hours</text>
      <text class="micro" x="1000" y="329" text-anchor="middle">intersect</text>
      <rect x="1036" y="296" width="220" height="52" rx="14" fill="#15344b" stroke="#58a6c9" />
      <text class="body" x="1146" y="328" text-anchor="middle">doctor hours</text>
      <text class="small" x="1000" y="378" text-anchor="middle">subtract</text>
      <rect x="748" y="392" width="504" height="46" rx="13" fill="#302b34" stroke="#c79a58" />
      <text class="body-tight" x="1000" y="422" text-anchor="middle">breaks · partial closures · partial doctor absences</text>
    </g>

    <g filter="url(#shadow)">
      <rect class="card" x="1400" y="220" width="510" height="240" rx="24" fill="#203744" stroke="#8da66b" stroke-width="2" />
      <text class="card-title" x="1655" y="264" text-anchor="middle">3. Validate resources per candidate</text>
      <rect x="1432" y="292" width="210" height="48" rx="13" fill="#223c45" stroke="#8da66b" />
      <text class="body" x="1537" y="323" text-anchor="middle">staff type</text>
      <rect x="1668" y="292" width="210" height="48" rx="13" fill="#223c45" stroke="#8da66b" />
      <text class="body-tight" x="1773" y="323" text-anchor="middle">concurrent patients</text>
      <rect x="1432" y="356" width="210" height="48" rx="13" fill="#223c45" stroke="#8da66b" />
      <text class="body-tight" x="1537" y="387" text-anchor="middle">equipment quantity</text>
      <rect x="1668" y="356" width="210" height="48" rx="13" fill="#223c45" stroke="#8da66b" />
      <text class="body-tight" x="1773" y="387" text-anchor="middle">maintenance · downtime</text>
      <text class="small" x="1655" y="438" text-anchor="middle">Return only candidates that pass every check</text>
    </g>
  </g>

  <g>
    <rect x="60" y="562" width="1880" height="510" rx="28" fill="#0f1d32" stroke="#2b4168" stroke-width="2" />
    <text class="panel-title" x="96" y="606">Example: a 60-minute treatment starting every 30 minutes</text>

    <text class="body" x="110" y="666">Clinic</text>
    <rect x="250" y="638" width="1530" height="38" rx="12" fill="#1c4562" stroke="#58a6c9" />
    <text class="small" x="1015" y="663" text-anchor="middle">09:00–18:00</text>

    <text class="body" x="110" y="726">Doctor</text>
    <rect x="420" y="698" width="1020" height="38" rx="12" fill="#244a5e" stroke="#73b3c7" />
    <text class="small" x="930" y="723" text-anchor="middle">10:00–16:00</text>

    <text class="body" x="110" y="786">Intersection</text>
    <rect x="420" y="758" width="1020" height="38" rx="12" fill="#214353" stroke="#8da66b" />
    <rect x="760" y="758" width="170" height="38" fill="#5a3038" stroke="#c46b6b" />
    <rect x="1100" y="758" width="170" height="38" fill="#5a3038" stroke="#c46b6b" />
    <rect x="1355" y="758" width="85" height="38" rx="12" fill="#5a3038" stroke="#c46b6b" />
    <text class="small" x="845" y="784" text-anchor="middle">lunch 12–13</text>
    <text class="small" x="1185" y="784" text-anchor="middle">closure 14–15</text>
    <text class="small" x="1397" y="784" text-anchor="middle">absent</text>

    <text class="body" x="110" y="846">Remaining</text>
    <rect x="420" y="818" width="340" height="38" rx="12" fill="#304c45" stroke="#8da66b" />
    <rect x="930" y="818" width="170" height="38" rx="12" fill="#304c45" stroke="#8da66b" />
    <rect x="1270" y="818" width="85" height="38" rx="12" fill="#304c45" stroke="#8da66b" />
    <text class="small" x="590" y="844" text-anchor="middle">10:00–12:00</text>
    <text class="small" x="1015" y="844" text-anchor="middle">13:00–14:00</text>
    <text class="small" x="1312" y="844" text-anchor="middle">15:00–15:30</text>

    <g>
      <line x1="250" y1="886" x2="1780" y2="886" stroke="#31496d" stroke-width="2" />
      <g class="tick">
        <text x="250" y="910" text-anchor="middle">09</text><text x="420" y="910" text-anchor="middle">10</text>
        <text x="590" y="910" text-anchor="middle">11</text><text x="760" y="910" text-anchor="middle">12</text>
        <text x="930" y="910" text-anchor="middle">13</text><text x="1100" y="910" text-anchor="middle">14</text>
        <text x="1270" y="910" text-anchor="middle">15</text><text x="1440" y="910" text-anchor="middle">16</text>
        <text x="1610" y="910" text-anchor="middle">17</text><text x="1780" y="910" text-anchor="middle">18</text>
      </g>
    </g>

    <text class="body" x="110" y="962">Candidates</text>
    <g filter="url(#shadow)">
      <rect class="card" x="420" y="932" width="150" height="78" rx="16" fill="#263f3f" stroke="#8da66b" stroke-width="2" />
      <text class="mono" x="495" y="965" text-anchor="middle">10:00</text><text class="small" x="495" y="990" text-anchor="middle">10:00–11:00</text>
      <rect class="card" x="590" y="932" width="150" height="78" rx="16" fill="#3d2d35" stroke="#c46b6b" stroke-width="2" />
      <text class="mono" x="665" y="965" text-anchor="middle">10:30</text><text class="small" x="665" y="990" text-anchor="middle">capacity exceeded</text>
      <rect class="card" x="760" y="932" width="150" height="78" rx="16" fill="#263f3f" stroke="#8da66b" stroke-width="2" />
      <text class="mono" x="835" y="965" text-anchor="middle">11:00</text><text class="small" x="835" y="990" text-anchor="middle">11:00–12:00</text>
      <rect class="card" x="930" y="932" width="150" height="78" rx="16" fill="#3d332d" stroke="#c79a58" stroke-width="2" />
      <text class="mono" x="1005" y="965" text-anchor="middle">13:00</text><text class="small" x="1005" y="990" text-anchor="middle">equipment check</text>
    </g>

    <rect x="1180" y="930" width="620" height="82" rx="18" fill="#14283a" stroke="#31496d" />
    <text class="body" x="1212" y="962">Slot interval</text><text class="mono" x="1450" y="962">30 min</text>
    <text class="body" x="1212" y="995">Treatment duration</text><text class="mono" x="1560" y="995">60 min</text>

    <circle cx="630" cy="1044" r="7" fill="#58a6c9" /><text class="small" x="647" y="1050">clinic · doctor hours</text>
    <circle cx="875" cy="1044" r="7" fill="#c46b6b" /><text class="small" x="892" y="1050">pre-excluded time</text>
    <circle cx="1140" cy="1044" r="7" fill="#8da66b" /><text class="small" x="1157" y="1050">bookable</text>
    <circle cx="1350" cy="1044" r="7" fill="#c79a58" /><text class="small" x="1367" y="1050">per-candidate resource conflict</text>
  </g>

  <text class="subtitle" x="1000" y="1125" text-anchor="middle">Free time ≠ bookable time · every calculation uses the clinic's local date and time</text>
</svg>
