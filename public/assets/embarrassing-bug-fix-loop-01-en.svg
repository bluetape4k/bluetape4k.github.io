<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Embarrassing bug fix loop</title>
  <desc id="desc">Dark flow showing mistake, signal, fix, evaluation, and guard for bluetape4k-projects bug stories.</desc>
  <defs>
    <style>
      .canvas{fill:#0b1220}.frame{fill:#12213a;stroke:#314868;stroke-width:2}.title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:44px;fill:#e6edf7;font-weight:400}.subtitle,.small{font-family:"Comic Mono","SFMono-Regular",Menlo,Consolas,monospace;fill:#9fb2cc}.subtitle{font-size:17px}.small{font-size:14px}.card-title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:28px;fill:#e6edf7;font-weight:400}.card-text{font-family:"Comic Mono","SFMono-Regular",Menlo,Consolas,monospace;font-size:14px;fill:#d7e2f0}.arrow{stroke:#8fb3d9;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.num{font-family:"Comic Mono","SFMono-Regular",Menlo,Consolas,monospace;font-size:14px;font-weight:700;fill:#e6edf7}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000814" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#8fb3d9"/></marker>
  </defs>
  <rect class="canvas" width="1200" height="630"/>
  <rect class="frame" x="28" y="24" width="1144" height="582" rx="22" filter="url(#shadow)"/>
  <text class="title" x="70" y="92">Five embarrassing fixes that made better guards</text>
  <text class="subtitle" x="72" y="126">bluetape4k-projects · mistake → signal → fix → evaluation → guard</text>

  <g transform="translate(72,182)">
    <rect x="0" y="0" width="188" height="250" rx="18" fill="#17375e" stroke="#6aa9ff"/>
    <circle cx="28" cy="30" r="14" fill="#23486f" stroke="#6aa9ff"/>
    <text class="num" x="24" y="35">1</text>
    <text class="card-title" x="22" y="78">Mistake</text>
    <text class="card-text" x="22" y="112">A tiny assumption</text>
    <text class="card-text" x="22" y="134">looks harmless</text>
    <text class="card-text" x="22" y="156">until null becomes 0</text>
    <text class="card-text" x="22" y="178">or cancellation</text>
    <text class="card-text" x="22" y="200">becomes a failure.</text>
  </g>
  <path class="arrow" marker-end="url(#arrow)" d="M274 306 H330"/>
  <g transform="translate(342,182)">
    <rect x="0" y="0" width="188" height="250" rx="18" fill="#173c37" stroke="#53d6b7"/>
    <circle cx="28" cy="30" r="14" fill="#1f554c" stroke="#53d6b7"/>
    <text class="num" x="24" y="35">2</text>
    <text class="card-title" x="22" y="78">Signal</text>
    <text class="card-text" x="22" y="112">Round-trip drift,</text>
    <text class="card-text" x="22" y="134">Nightly timeout,</text>
    <text class="card-text" x="22" y="156">or a hidden</text>
    <text class="card-text" x="22" y="178">disabled test</text>
    <text class="card-text" x="22" y="200">breaks the story.</text>
  </g>
  <path class="arrow" marker-end="url(#arrow)" d="M544 306 H600"/>
  <g transform="translate(612,182)">
    <rect x="0" y="0" width="188" height="250" rx="18" fill="#3f3217" stroke="#f5c15c"/>
    <circle cx="28" cy="30" r="14" fill="#5b4317" stroke="#f5c15c"/>
    <text class="num" x="24" y="35">3</text>
    <text class="card-title" x="22" y="78">Fix</text>
    <text class="card-text" x="22" y="112">Make the small</text>
    <text class="card-text" x="22" y="134">contract explicit:</text>
    <text class="card-text" x="22" y="156">coercion scope,</text>
    <text class="card-text" x="22" y="178">bounded close,</text>
    <text class="card-text" x="22" y="200">rethrow first.</text>
  </g>
  <path class="arrow" marker-end="url(#arrow)" d="M814 306 H870"/>
  <g transform="translate(882,182)">
    <rect x="0" y="0" width="188" height="250" rx="18" fill="#40202b" stroke="#ef7892"/>
    <circle cx="28" cy="30" r="14" fill="#5a293a" stroke="#ef7892"/>
    <text class="num" x="24" y="35">4</text>
    <text class="card-title" x="22" y="78">Guard</text>
    <text class="card-text" x="22" y="112">Regression tests,</text>
    <text class="card-text" x="22" y="134">release gates,</text>
    <text class="card-text" x="22" y="156">and lesson notes</text>
    <text class="card-text" x="22" y="178">turn shame into</text>
    <text class="card-text" x="22" y="200">a reusable alarm.</text>
  </g>

  <text class="small" x="72" y="548">Rule of thumb: if the fix feels too obvious afterward, write the test that would have embarrassed you sooner.</text>
</svg>