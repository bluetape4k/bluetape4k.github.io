<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="680" viewBox="0 0 1290 680">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#496A8F"/>
  </marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#22344A;font-weight:400}
    .subtitle,.footer{font-family:"Comic Sans MS","Comic Sans",sans-serif;font-size:17px;fill:#536476;font-weight:400}
    .nodeTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:21px;fill:#22344A;font-weight:400}
    .nodeBody{font-family:"Comic Sans MS","Comic Sans",sans-serif;font-size:16px;fill:#3F5269;font-weight:400}
    .edge{fill:none;stroke:#496A8F;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .lifeline{stroke:#91A6BD;stroke-width:2;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="1290" height="680"/>
<rect class="frame" x="34" y="28" width="1222" height="624" rx="24"/>
<text class="title" x="645" y="82" text-anchor="middle">Small Product Audit Sequence</text>
<text class="subtitle" x="645" y="116" text-anchor="middle">The workshop example commits audit history before updating the current row</text>
<g>
  <rect x="45" y="135" width="210" height="64" rx="10" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="150" y="175" text-anchor="middle">Caller</text>
  <line class="lifeline" x1="150" y1="218" x2="150" y2="545"/>
</g>
<g>
  <rect x="315" y="135" width="210" height="64" rx="10" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="420" y="175" text-anchor="middle">Audit Service</text>
  <line class="lifeline" x1="420" y1="218" x2="420" y2="545"/>
</g>
<g>
  <rect x="555" y="135" width="210" height="64" rx="10" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="660" y="175" text-anchor="middle">JaVers</text>
  <line class="lifeline" x1="660" y1="218" x2="660" y2="545"/>
</g>
<g>
  <rect x="825" y="135" width="210" height="64" rx="10" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="930" y="175" text-anchor="middle">Snapshot Repo</text>
  <line class="lifeline" x1="930" y1="218" x2="930" y2="545"/>
</g>
<g>
  <rect x="1035" y="135" width="210" height="64" rx="10" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="1140" y="175" text-anchor="middle">ProductTable</text>
  <line class="lifeline" x1="1140" y1="218" x2="1140" y2="545"/>
</g>
<g>
  <rect x="169" y="205" width="232" height="30" rx="9" fill="#EAF4FF" stroke="#D7E2EC"/>
  <text class="nodeBody" x="285" y="225" text-anchor="middle">1. save(author, product)</text>
  <path class="edge" d="M188 245 H382"/>
</g>
<g>
  <rect x="412" y="270" width="256" height="30" rx="9" fill="#FFF4D9" stroke="#D7E2EC"/>
  <text class="nodeBody" x="540" y="290" text-anchor="middle">2. commit author and object</text>
  <path class="edge" d="M458 310 H622"/>
</g>
<g>
  <rect x="680" y="335" width="230" height="30" rx="9" fill="#EAF8EF" stroke="#D7E2EC"/>
  <text class="nodeBody" x="795" y="355" text-anchor="middle">3. persist CDO snapshot</text>
  <path class="edge" d="M698 375 H892"/>
</g>
<g>
  <rect x="665" y="400" width="230" height="30" rx="9" fill="#F3ECFF" stroke="#D7E2EC"/>
  <text class="nodeBody" x="780" y="420" text-anchor="middle">4. upsert current row</text>
  <path class="edge" d="M458 440 H1102"/>
</g>
<g>
  <rect x="141" y="465" width="288" height="30" rx="9" fill="#FFF0E8" stroke="#D7E2EC"/>
  <text class="nodeBody" x="285" y="485" text-anchor="middle">5. later: history or diff query</text>
  <path class="edge" d="M188 505 H382"/>
</g>
<rect x="88" y="590" width="1114" height="56" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="645" y="613" text-anchor="middle">The current row and the audit history have different responsibilities.</text>
<text class="footer" x="645" y="636" text-anchor="middle">A small example is enough to see why commit order matters.</text>
</svg>
