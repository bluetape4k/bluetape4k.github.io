<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img">
<title>Cache Write Throughput</title>
<desc>Spring Boot cache benchmark, save path, representative ops/sec.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1D3148" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#4D6F9F"/></marker>
  <style>
    .bg{fill:#F7F9FC}.frame{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#21334A;font-weight:700}
    .subtitle,.body,.small,.tiny,.axisLabel{font-family:"Comic Mono";fill:#34465B}
    .subtitle{font-size:16px}.body{font-size:14px}.small{font-size:12px;fill:#657386}.tiny{font-size:11px;fill:#657386}
    .label{font-family:"Architects Daughter";font-size:23px;fill:#21334A;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.line{fill:none;stroke:#4D6F9F;stroke-width:2.8;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .axis{stroke:#B9C7D8;stroke-width:1.4}.grid{stroke:#CAD6E4;stroke-width:1;stroke-dasharray:4 6}
  </style>
</defs>
<rect class="bg" width="1280" height="680"/>
<rect class="frame" x="34" y="28" width="1212" height="624" rx="26"/>
<text class="title" x="70" y="82">Cache Write Throughput</text>
<text class="subtitle" x="72" y="114">Spring Boot cache benchmark, save path, representative ops/sec.</text>
<g>
  <line class="axis" x1="360" y1="644" x2="1140" y2="644"/>
  <line class="grid" x1="360" y1="156" x2="360" y2="644"/>
  <line class="grid" x1="750" y1="156" x2="750" y2="644"/>
  <line class="grid" x1="1140" y1="156" x2="1140" y2="644"/>
  <text class="body" x="92" y="184" dominant-baseline="middle">No Cache</text>
<rect x="360" y="166" width="780" height="36" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
<rect class="card" x="360" y="166" width="255.84" height="36" rx="10" fill="#8FA1B3" stroke="#8FA1B3"/>
<text class="body" x="629.84" y="184" dominant-baseline="middle">~8,200 ops/s</text>
<text class="body" x="92" y="262" dominant-baseline="middle">Caffeine</text>
<rect x="360" y="244" width="780" height="36" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
<rect class="card" x="360" y="244" width="252.72" height="36" rx="10" fill="#75A9E8" stroke="#75A9E8"/>
<text class="body" x="626.72" y="262" dominant-baseline="middle">~8,100 ops/s</text>
<text class="body" x="92" y="340" dominant-baseline="middle">Redis Cache</text>
<rect x="360" y="322" width="780" height="36" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
<rect class="card" x="360" y="322" width="227.76" height="36" rx="10" fill="#69B888" stroke="#69B888"/>
<text class="body" x="601.76" y="340" dominant-baseline="middle">~7,300 ops/s</text>
<text class="body" x="92" y="418" dominant-baseline="middle">Near Cache</text>
<rect x="360" y="400" width="780" height="36" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
<rect class="card" x="360" y="400" width="224.64" height="36" rx="10" fill="#D9AA4D" stroke="#D9AA4D"/>
<text class="body" x="598.64" y="418" dominant-baseline="middle">~7,200 ops/s</text>
<text class="body" x="92" y="496" dominant-baseline="middle">Write-Through</text>
<rect x="360" y="478" width="780" height="36" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
<rect class="card" x="360" y="478" width="174.72" height="36" rx="10" fill="#8A72D6" stroke="#8A72D6"/>
<text class="body" x="548.72" y="496" dominant-baseline="middle">~5,600 ops/s</text>
<text class="body" x="92" y="574" dominant-baseline="middle">Write-Behind</text>
<rect x="360" y="556" width="780" height="36" rx="10" fill="#EEF4F9" stroke="#D7E2EC"/>
<rect class="card" x="360" y="556" width="748.8" height="36" rx="10" fill="#DB7890" stroke="#DB7890"/>
<text class="body" x="1122.8" y="574" dominant-baseline="middle">~24,000 ops/s</text>
  <text class="tiny" x="360" y="670" text-anchor="middle">0</text>
  <text class="tiny" x="750" y="670" text-anchor="middle">12500</text>
  <text class="tiny" x="1140" y="670" text-anchor="middle">25000</text>
</g>
</svg>