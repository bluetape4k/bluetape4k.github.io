  .phase-label{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:12px;font-weight:700;fill:#83a0bf}
  .decision{fill:#151f38;stroke:#a78bfa;stroke-width:2}
  .decision-title{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:18px;font-weight:800;fill:#e5d9ff}
</style>
</defs>
