<text class="title" x="62" y="76">Recover Disrupted Appointments through Separate Validation and Confirmation</text><text class="subtitle" x="64" y="108">Calculate candidates outside the transaction, then recheck state and version before writes.</text>
<rect x="62" y="126" width="230" height="34" rx="17" fill="#12243a" stroke="#3a5877"/><text class="badge" x="177" y="148" text-anchor="middle">SCOPE / STAFF RECOVERY</text>
