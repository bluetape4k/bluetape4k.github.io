<g><rect class="pill" x="388.75" y="415" width="352.5" height="38" rx="19" stroke="#60a5fa"/><circle cx="408.75" cy="434" r="13" fill="#60a5fa" fill-opacity=".2" stroke="#60a5fa"/><text class="num" x="408.75" y="439" text-anchor="middle">2</text><text class="labelText" x="431.75" y="439">request affected-booking recovery</text></g><path class="call blue-line" data-source-node="api" data-target-node="service" d="M420 465 H710"/>
<g><rect class="pill" x="649" y="525" width="412" height="38" rx="19" stroke="#2dd4bf"/><circle cx="669" cy="544" r="13" fill="#2dd4bf" fill-opacity=".2" stroke="#2dd4bf"/><text class="num" x="669" y="549" text-anchor="middle">3</text><text class="labelText" x="692" y="549">read active booking snapshot and version</text></g><path class="call cyan-line" data-source-node="service" data-target-node="store" d="M710 575 H1000"/>
<g><rect class="pill" x="598" y="635" width="514" height="38" rx="19" stroke="#fbbf24"/><circle cx="618" cy="654" r="13" fill="#fbbf24" fill-opacity=".2" stroke="#fbbf24"/><text class="num" x="618" y="659" text-anchor="middle">4</text><text class="labelText" x="641" y="659">calculate replacement candidates outside transaction</text></g><path class="call amber-line" data-source-node="service" data-target-node="store" d="M710 685 H1000"/>
<g><rect class="pill" x="678.75" y="745" width="352.5" height="38" rx="19" stroke="#2dd4bf"/><circle cx="698.75" cy="764" r="13" fill="#2dd4bf" fill-opacity=".2" stroke="#2dd4bf"/><text class="num" x="698.75" y="769" text-anchor="middle">5</text><text class="labelText" x="721.75" y="769">recheck current state and version</text></g><path class="call cyan-line" data-source-node="service" data-target-node="store" d="M710 795 H1000"/>
<g><rect class="pill" x="720" y="855" width="560" height="38" rx="19" stroke="#a78bfa"/><circle cx="740" cy="874" r="13" fill="#a78bfa" fill-opacity=".2" stroke="#a78bfa"/><text class="num" x="740" y="879" text-anchor="middle">6</text><text class="labelText" x="763" y="879">store PENDING_RESCHEDULE, history, status event, candidates</text></g><path class="call purple-line" data-source-node="service" data-target-node="outbox" d="M710 905 H1290"/>
