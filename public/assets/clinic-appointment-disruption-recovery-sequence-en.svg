<rect x="732" y="1572" width="306" height="92" rx="20" fill="#101f34" stroke="#a78bfa" stroke-width="2"/><text class="outcome" x="885" y="1609" text-anchor="middle">Stream item failed</text><text class="role" x="885" y="1639" text-anchor="middle">reconcile committed items</text>
