<rect class="phase" x="42" y="1084" width="1356" height="332" rx="24"/><rect x="1038" y="1096" width="330" height="28" rx="14" fill="#102239" stroke="#38506d"/><text class="phase-label" x="1203" y="1115" text-anchor="middle">STAFF confirmation and final write</text><g><rect id="staff" class="header card" x="10" y="190" width="240" height="92" rx="20"/><text class="participant" x="130" y="228" text-anchor="middle">STAFF</text><text class="role" x="130" y="256" text-anchor="middle">operator</text></g>
