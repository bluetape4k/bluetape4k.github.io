<g><rect class="pill" x="720" y="1295" width="560" height="38" rx="19" stroke="#2dd4bf"/><circle cx="740" cy="1314" r="13" fill="#2dd4bf" fill-opacity=".2" stroke="#2dd4bf"/><text class="num" x="740" y="1319" text-anchor="middle">10</text><text class="labelText" x="763" y="1319">store replacement CONFIRMED, original RESCHEDULED, candidate, outbox</text></g><path class="call cyan-line" data-source-node="service" data-target-node="outbox" d="M710 1345 H1290"/>
<rect class="decision" x="44" y="1480" width="1352" height="218" rx="26"/><rect x="510" y="1458" width="420" height="42" rx="21" fill="#19223a" stroke="#a78bfa" stroke-width="2"/><text class="decision-title" x="720" y="1486" text-anchor="middle">Terminal Outcome Decision</text><rect x="72" y="1572" width="306" height="92" rx="20" fill="#101f34" stroke="#fbbf24" stroke-width="2"/><text class="outcome" x="225" y="1609" text-anchor="middle">No candidate</text><text class="role" x="225" y="1639" text-anchor="middle">separate STAFF task</text>
