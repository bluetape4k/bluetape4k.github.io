<g><rect class="pill" x="52" y="1075" width="446" height="38" rx="19" stroke="#fbbf24"/><circle cx="72" cy="1094" r="13" fill="#fbbf24" fill-opacity=".2" stroke="#fbbf24"/><text class="num" x="72" y="1099" text-anchor="middle">8</text><text class="labelText" x="95" y="1099">select candidate or run automatic reschedule</text></g><path class="call amber-line" data-source-node="staff" data-target-node="api" d="M130 1125 H420"/>
