<rect x="300" y="764" width="320.8" height="22" rx="11" class="bar-go"/>
<rect x="300" y="796" width="270.8" height="22" rx="11" class="bar-kotlin"/>
<text x="630.7601453424217" y="780" class="value">389.70</text>
<text x="580.8306684078002" y="812" class="value">187.93</text>
<text x="98" y="854" class="scale">막대 길이는 로그 척도이며 값 표시는 실제 ns/id입니다.</text>
  <rect x="812" y="200" width="724" height="690" rx="24" class="panel"/>
<text x="846" y="250" class="panel-title">동시 실행</text>
<text x="1502" y="250" text-anchor="end" class="unit">ns/id ↓</text>
<text x="846" y="304" class="row-label">Snowflake*</text>
