<text x="1378.5842421792945" y="812" class="value">388.70</text>
<text x="846" y="854" class="scale">막대 길이는 로그 척도이며 값 표시는 실제 ns/id입니다.</text>
  <rect x="64" y="930" width="1472" height="88" rx="18" fill="#122B3D" stroke="#5EEAD4" stroke-width="1.5"/>
  <circle cx="94" cy="974" r="8" fill="#FBBF24"/>
  <text x="116" y="980" class="note">Snowflake는 시계 모델이 달라 운영 성능의 직접 비교값으로 사용할 수 없습니다.</text>
</svg>