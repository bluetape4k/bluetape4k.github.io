<rect x="300" y="476" width="283.4" height="22" rx="11" class="bar-go"/>
<rect x="300" y="508" width="224.2" height="22" rx="11" class="bar-kotlin"/>
<text x="593.3988324527945" y="492" class="value">225.80</text>
<text x="534.1915811786198" y="524" class="value">95.09</text>
<text x="98" y="592" class="row-label">UUID v7 reused</text>
<rect x="300" y="572" width="290.7" height="22" rx="11" class="bar-go"/>
<rect x="300" y="604" width="128.8" height="22" rx="11" class="bar-kotlin"/>
<text x="600.6968106555046" y="588" class="value">251.20</text>
<text x="438.7562243666789" y="620" class="value">23.59</text>
<text x="98" y="688" class="row-label">KSUID millis</text>
<rect x="300" y="668" width="307.4" height="22" rx="11" class="bar-go"/>
<rect x="300" y="700" width="263.1" height="22" rx="11" class="bar-kotlin"/>
<text x="617.3976314801295" y="684" class="value">320.60</text>
<text x="573.0742053498914" y="716" class="value">167.80</text>
