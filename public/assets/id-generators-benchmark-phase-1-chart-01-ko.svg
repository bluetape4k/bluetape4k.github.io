<rect x="1048" y="668" width="353.9" height="22" rx="11" class="bar-go"/>
<rect x="1048" y="700" width="321.9" height="22" rx="11" class="bar-kotlin"/>
<text x="1411.894591552098" y="684" class="value">632.30</text>
<text x="1379.944448645831" y="716" class="value">396.50</text>
