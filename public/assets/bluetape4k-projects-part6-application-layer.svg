<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img">
<title>Spring Boot 4 and Ktor Application Layer</title>
<desc>Application modules sit above the shared foundation and keep wiring explicit.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1D3148" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 4 L 1 7 Z" fill="#4D6F9F"/></marker>
  <style>
    .bg{fill:#F7F9FC}.frame{fill:#fff;stroke:#D6E2ED;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS";font-size:42px;fill:#21334A;font-weight:700}
    .subtitle,.body,.small{font-family:"Comic Mono","Courier New";fill:#34465B}
    .subtitle{font-size:16px}.body{font-size:14px}.small{font-size:12px;fill:#657386}
    .label{font-family:"Architects Daughter","Comic Sans MS";font-size:22px;fill:#21334A;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.line{fill:none;stroke:#4D6F9F;stroke-width:2.8;marker-end:url(#arrow)}
  </style>
</defs>
<rect class="bg" width="1500" height="760"/>
<rect class="frame" x="34" y="28" width="1432" height="704" rx="26"/>
<text class="title" x="70" y="82">Spring Boot 4 and Ktor Application Layer</text>
<text class="subtitle" x="72" y="114">Application modules sit above the shared foundation and keep wiring explicit.</text>
<g transform="translate(84 170)">
  <g>
  <rect class="card" x="0" y="242" width="232" height="118" rx="16" fill="#E7F1FF" stroke="#5A85D6"/>
  <text class="label" x="116" y="285" text-anchor="middle" dominant-baseline="middle">Shared Foundation</text>
  <text class="body" x="116" y="315" text-anchor="middle">BOM · core · coroutines</text>
<text class="body" x="116" y="335" text-anchor="middle">I/O · data · infra · utils</text>
</g>
  <g>
  <rect class="card" x="360" y="112" width="272" height="136" rx="16" fill="#EAF7ED" stroke="#58A978"/>
  <text class="label" x="496" y="164" text-anchor="middle" dominant-baseline="middle">Spring Boot 4</text>
  <text class="body" x="496" y="194" text-anchor="middle">WebFlux + coroutines</text>
<text class="body" x="496" y="214" text-anchor="middle">Redis · R2DBC · MongoDB</text>
<text class="body" x="496" y="234" text-anchor="middle">Hibernate Lettuce</text>
</g>
  <g>
  <rect class="card" x="360" y="400" width="272" height="136" rx="16" fill="#F1ECFF" stroke="#8A72D6"/>
