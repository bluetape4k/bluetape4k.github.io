<text class="body" x="496" y="502" text-anchor="middle">OpenAPI · resilience4j</text>
<text class="body" x="496" y="522" text-anchor="middle">testing helpers</text>
</g>
  <g>
  <rect class="card" x="760" y="112" width="260" height="136" rx="16" fill="#E7F7F5" stroke="#3CA7A0"/>
