  <g><rect x="70" y="1000" width="520" height="180" rx="20" fill="#112139" stroke="#60a5fa" stroke-width="2"/><text class="footer-title" x="98" y="1040">현재 예약 집계</text><text class="footer-code" x="98" y="1074">Appointments repository</text><text class="footer-body" x="98" y="1120">예약 상태를 확인하는 기준 데이터 원본</text></g><g><rect x="625" y="1000" width="520" height="180" rx="20" fill="#112139" stroke="#a78bfa" stroke-width="2"/><text class="footer-title" x="653" y="1040">통계 projection</text><text class="footer-code" x="653" y="1074">latest eventVersion</text><text class="footer-body" x="653" y="1120">완전할 때만 대시보드 보조 지표로 사용</text></g><g><rect x="1180" y="1000" width="520" height="180" rx="20" fill="#112139" stroke="#fbbf24" stroke-width="2"/><text class="footer-title" x="1208" y="1040">재처리·백필</text><text class="footer-code" x="1208" y="1074">dry-run → 승인 → 실행</text><text class="footer-body" x="1208" y="1120">운영자가 감사 경계를 확인한 뒤 진행</text></g><text class="muted" x="70" y="1220">화면의 수치와 식별자는 설명을 위한 합성 값이며, 원본 payload나 개인정보를 표시하지 않습니다.</text>
