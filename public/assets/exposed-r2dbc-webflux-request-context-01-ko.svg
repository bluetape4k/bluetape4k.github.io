<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1500" viewBox="0 0 2400 1500" role="img" aria-labelledby="title desc">
  <title id="title">Reactor Context에서 tenant별 Repository까지</title>
  <desc id="desc">클라이언트, 권한 검증 filter, Reactor Context, Kotlin Coroutine service, tenant 연결 registry가 카드와 lifeline으로 배치되어 tenant 식별, 인증, 권한 검증, context 공개, transaction bridge, tenant별 connection factory 선택의 순서를 보여 준다.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset=".58" stop-color="#0c1730"/><stop offset="1" stop-color="#10142a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".52"/></filter>
    <marker id="arrow-blue" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L18 9 L0 18 Z" fill="#66a8cf"/></marker>
    <marker id="arrow-green" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L18 9 L0 18 Z" fill="#8db475"/></marker>
    <marker id="arrow-amber" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L18 9 L0 18 Z" fill="#d2a15e"/></marker>
    <marker id="arrow-red" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L18 9 L0 18 Z" fill="#c97976"/></marker>
    <style>
      .title{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:52px;font-weight:700;fill:#f8fafc}.subtitle{font-family:'goorm Sans Code','Comic Mono',monospace;font-size:19px;fill:#a9b8d4}.frame{fill:none;stroke:#2b4168;stroke-width:2.5}.lane{fill:#0f1b31;fill-opacity:.72;stroke:#344e75;stroke-width:2}.laneTitle{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:21px;font-weight:700;fill:#b7c8e1}.card{fill:#162740;stroke:#6685aa;stroke-width:2.5;filter:url(#shadow)}.blue{stroke:#66a8cf}.green{stroke:#8db475}.amber{stroke:#d2a15e}.teal{stroke:#59b0aa}.eyebrow{font-family:'goorm Sans Code','Comic Mono',monospace;font-size:15px;font-weight:700;letter-spacing:1px;fill:#8ea4c3}.cardTitle{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:25px;font-weight:700;fill:#f8fafc}.cardBody{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:17px;fill:#b9c7db}.lifeline{stroke:#7d93a8;stroke-width:3;stroke-dasharray:14 12}.activation{fill:#20394d;stroke:#8db475;stroke-width:2}.connector{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.request{stroke:#66a8cf}.state{stroke:#8db475}.metadata{stroke:#d2a15e;stroke-dasharray:14 11}.denied{stroke:#c97976;stroke-dasharray:12 10}.pill{fill:#101b30;stroke-width:1.8}.pillText{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:16px;font-weight:700}.badge{fill:#17293e;stroke-width:2}.badgeText{font-family:'goorm Sans Code','Comic Mono',monospace;font-size:15px;font-weight:700}.alt{fill:none;stroke:#c97976;stroke-width:2.5;stroke-dasharray:12 9}.altHead{font-family:'goorm Sans Code','Comic Mono',monospace;font-size:17px;font-weight:700;fill:#e9a4a1}.note{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:18px;fill:#b9c7db}.noteStrong{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:20px;font-weight:700;fill:#f1d6a7}
    </style>
  </defs>
  <rect width="2400" height="1500" rx="34" fill="url(#canvas)"/><rect class="frame" x="28" y="28" width="2344" height="1444" rx="30"/>
  <text class="title" x="1200" y="86" text-anchor="middle">tenant는 권한을 통과한 뒤에만 요청 context가 된다</text><text class="subtitle" x="1200" y="124" text-anchor="middle">컴포넌트를 연결하는 선은 입력 검증, context 전달, transaction bridge, DB 선택의 책임 경계를 나타냅니다.</text>
  <rect class="lane" x="70" y="166" width="2260" height="1090" rx="26"/><text class="laneTitle" x="108" y="210">요청 context와 DB 선택</text><text class="subtitle" x="2290" y="210" text-anchor="end">Spring WebFlux · Reactor Context · Kotlin Coroutines · Exposed R2DBC</text>
  <g id="client"><rect class="card blue" x="100" y="270" width="340" height="150" rx="22"/><text class="eyebrow" x="132" y="308">HTTP CLIENT</text><text class="cardTitle" x="132" y="350">API 사용자</text><text class="cardBody" x="132" y="388">X-TENANT-ID · 인증 정보</text></g>
  <g id="auth"><rect class="card amber" x="530" y="270" width="365" height="150" rx="22"/><text class="eyebrow" x="562" y="308">SECURITY BOUNDARY</text><text class="cardTitle" x="562" y="350">권한 검증 Filter</text><text class="cardBody" x="562" y="388">tenant 해석 · principal 확인</text></g>
  <g id="context"><rect class="card teal" x="985" y="270" width="365" height="150" rx="22"/><text class="eyebrow" x="1017" y="308">REQUEST CARRIER</text><text class="cardTitle" x="1017" y="350">Reactor Context</text><text class="cardBody" x="1017" y="388">검증된 TenantId</text></g>
  <g id="service"><rect class="card blue" x="1440" y="270" width="365" height="150" rx="22"/><text class="eyebrow" x="1472" y="308">COROUTINE BOUNDARY</text><text class="cardTitle" x="1472" y="350">Coroutine Service</text><text class="cardBody" x="1472" y="388">tenant 읽기 · transaction 시작</text></g>
  <g id="registry"><rect class="card green" x="1895" y="270" width="365" height="150" rx="22"/><text class="eyebrow" x="1927" y="308">RUNTIME REGISTRY</text><text class="cardTitle" x="1927" y="350">tenant DB 연결</text><text class="cardBody" x="1927" y="388">ConnectionFactory · Repository</text></g>
  <path class="lifeline" d="M270 420 V1190"/><path class="lifeline" d="M712 420 V1190"/><path class="lifeline" d="M1167 420 V1190"/><path class="lifeline" d="M1622 420 V1190"/><path class="lifeline" d="M2077 420 V1190"/>
  <rect class="activation" x="700" y="505" width="24" height="330" rx="12"/><rect class="activation" x="1610" y="815" width="24" height="405" rx="12"/><rect class="activation" x="2065" y="1060" width="24" height="180" rx="12"/>
  <g data-from="client" data-to="auth"><path data-connector="request-to-auth" class="connector request" d="M270 520 H700" marker-end="url(#arrow-blue)"/><rect class="pill" x="404" y="454" width="160" height="40" rx="20" stroke="#66a8cf"/><circle class="badge" cx="428" cy="474" r="16" stroke="#66a8cf"/><text class="badgeText" x="428" y="480" text-anchor="middle" fill="#a8d6ee">1</text><text class="pillText" x="458" y="480" fill="#a8d6ee">요청 전달</text></g>
  <g data-from="auth" data-to="context"><path data-connector="authorized-tenant-to-context" class="connector state" d="M724 730 H1167" marker-end="url(#arrow-green)"/><rect class="pill" x="826" y="664" width="242" height="40" rx="20" stroke="#8db475"/><circle class="badge" cx="850" cy="684" r="16" stroke="#8db475"/><text class="badgeText" x="850" y="690" text-anchor="middle" fill="#c9dda8">2</text><text class="pillText" x="880" y="690" fill="#c9dda8">권한 확인 후 context 공개</text></g>
  <g data-from="context" data-to="service"><path data-connector="reactor-to-coroutine" class="connector request" d="M1167 850 H1610" marker-end="url(#arrow-blue)"/><rect class="pill" x="1280" y="784" width="214" height="40" rx="20" stroke="#66a8cf"/><circle class="badge" cx="1304" cy="804" r="16" stroke="#66a8cf"/><text class="badgeText" x="1304" y="810" text-anchor="middle" fill="#a8d6ee">3</text><text class="pillText" x="1334" y="810" fill="#a8d6ee">ReactorContext로 읽기</text></g>
  <g data-from="service" data-to="registry"><path data-connector="transaction-to-registry" class="connector metadata" d="M1634 1080 H2065" marker-end="url(#arrow-amber)"/><rect class="pill" x="1733" y="1014" width="252" height="40" rx="20" stroke="#d2a15e"/><circle class="badge" cx="1757" cy="1034" r="16" stroke="#d2a15e"/><text class="badgeText" x="1757" y="1040" text-anchor="middle" fill="#f1d6a7">4</text><text class="pillText" x="1787" y="1040" fill="#f1d6a7">transaction context bridge</text></g>
  <g data-from="registry" data-to="service"><path data-connector="connection-to-service" class="connector state" d="M2065 1190 H1634" marker-end="url(#arrow-green)"/><rect class="pill" x="1742" y="1124" width="234" height="40" rx="20" stroke="#8db475"/><circle class="badge" cx="1766" cy="1144" r="16" stroke="#8db475"/><text class="badgeText" x="1766" y="1150" text-anchor="middle" fill="#c9dda8">5</text><text class="pillText" x="1796" y="1150" fill="#c9dda8">tenant별 DB 연결 선택</text></g>
  <rect class="alt" x="520" y="550" width="390" height="120" rx="20"/><text class="altHead" x="546" y="581">alt · 권한 불일치</text><path class="connector denied" d="M700 640 H270" marker-end="url(#arrow-red)"/><rect class="pill" x="403" y="595" width="154" height="32" rx="16" stroke="#c97976"/><text class="pillText" x="480" y="617" text-anchor="middle" fill="#e9a4a1">403 · context 미공개</text>
  <rect x="220" y="1320" width="1960" height="100" rx="24" fill="#1d2939" stroke="#d2a15e" stroke-width="2"/><text class="noteStrong" x="1200" y="1360" text-anchor="middle">권한을 확인하기 전에는 tenant를 Reactor Context에 넣지 않습니다.</text><text class="note" x="1200" y="1394" text-anchor="middle">DB 선택은 context에서 꺼낸 검증 tenant와 registry의 준비된 연결만으로 결정합니다.</text>
</svg>
