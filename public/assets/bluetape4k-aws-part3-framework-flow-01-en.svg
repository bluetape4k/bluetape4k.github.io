<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-label="bluetape4k AWS Part 3 framework integration flow">
  <defs>
    <style>
      .title{font-family:'Architects Daughter',cursive;font-size:34px;fill:#e8eefc}
      .subtitle,.body{font-family:'Comic Mono',monospace;fill:#b8c7dc}
      .subtitle{font-size:15px}.label{font-family:'Architects Daughter',cursive;font-size:22px;fill:#e8eefc}
      .footerLabel{font-family:'Architects Daughter',cursive;font-size:22px;fill:#ffffff}.footerText{font-family:'Comic Mono',monospace;font-size:15px;fill:#d8e4f5}
      .body{font-size:14px}.small{font-family:'Comic Mono',monospace;font-size:12px;fill:#b8c7dc}
      .arrow{fill:none;stroke:#6fb6e8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .panel{fill:#111d2f;stroke:#315270;stroke-width:1.4;rx:18}.band{fill:#12243a;stroke:#315270;stroke-width:1.2;rx:14}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6fb6e8" stroke="#6fb6e8" stroke-width="0" stroke-dasharray="none"/></marker>
  </defs>
  <rect width="1160" height="720" fill="#0b1220"/>
  <text class="title" x="54" y="70">Framework adapters over shared AWS contracts</text>
  <text class="subtitle" x="56" y="104">Spring Boot owns auto-configuration; Ktor owns plugins and lifecycle. Both meet the same core AWS helpers below.</text>

  <rect class="panel" x="54" y="136" width="1052" height="464"/>
  <rect class="band" x="90" y="176" width="980" height="84"/>
  <text class="label" x="580" y="210" text-anchor="middle">Application code</text>
  <text class="body" x="580" y="237" text-anchor="middle">controllers, routes, scheduled jobs, queue handlers</text>

  <rect x="112" y="318" width="420" height="132" rx="14" fill="#11283f" stroke="#38bdf8" stroke-width="1.6"/>
  <text class="label" x="322" y="356" text-anchor="middle">Spring Boot 4 adapter</text>
  <text class="body" x="322" y="386" text-anchor="middle">auto-configured clients and templates</text>
  <text class="body" x="322" y="409" text-anchor="middle">@SqsListener, Environment sources</text>
  <text class="body" x="322" y="432" text-anchor="middle">S3, SNS, SES, DynamoDB, KMS, Exposed</text>

  <rect x="628" y="318" width="420" height="132" rx="14" fill="#102a24" stroke="#22c55e" stroke-width="1.6"/>
  <text class="label" x="838" y="356" text-anchor="middle">Ktor 3 adapter</text>
  <text class="body" x="838" y="386" text-anchor="middle">application plugins and lifecycle runtimes</text>
  <text class="body" x="838" y="409" text-anchor="middle">SigV4 client, SQS consumer, DynamoDB plugin</text>
  <text class="body" x="838" y="432" text-anchor="middle">S3 REST client, AwsExposedPlugin</text>

  <rect x="250" y="500" width="660" height="70" rx="14" fill="#2a2615" stroke="#f59e0b" stroke-width="1.6"/>
  <text class="label" x="580" y="528" text-anchor="middle">Shared AWS contracts</text>
  <text class="body" x="580" y="554" text-anchor="middle">aws-java, aws-kotlin, aws-exposed, BOM, explicit runtime dependencies</text>

  <polyline class="arrow" points="420,260 420,318"/>
  <polyline class="arrow" points="740,260 740,318"/>
  <polyline class="arrow" points="322,450 322,475 510,475 510,500"/>
  <polyline class="arrow" points="838,450 838,475 650,475 650,500"/>

  <rect x="96" y="632" width="210" height="46" rx="23" fill="#12243a" stroke="#6d87a8"/>
  <text class="small" x="201" y="660" text-anchor="middle">AWS SDK clients</text>
  <rect x="380" y="632" width="230" height="46" rx="23" fill="#12243a" stroke="#6d87a8"/>
  <text class="small" x="495" y="660" text-anchor="middle">Floci / LocalStack tests</text>
  <rect x="684" y="632" width="210" height="46" rx="23" fill="#12243a" stroke="#6d87a8"/>
  <text class="small" x="789" y="660" text-anchor="middle">AWS services</text>
  <polyline class="arrow" points="320,570 320,606 201,606 201,632"/>
  <polyline class="arrow" points="495,570 495,632"/>
  <polyline class="arrow" points="790,570 790,632"/>
  <path class="connector" d="M2 2 L3 2" fill="none" stroke="transparent"/>
</svg>