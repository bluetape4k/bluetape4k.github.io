<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780">
<defs><style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style></defs>
<rect class="canvas" width="1500" height="780"/>
<rect class="frame" x="34" y="28" width="1432" height="724" rx="24"/>
<text class="title" x="750" y="82" text-anchor="middle">API 모델 벤치마크 결과</text>
<text class="subtitle" x="750" y="118" text-anchor="middle">TinkerGraph BFS 지연 시간, 연산당 마이크로초, 낮을수록 좋다</text>
<text class="axis" x="350" y="145">로그 눈금, 낮을수록 좋음</text>
<g>
  <text class="nodeBody" x="322" y="195" text-anchor="end">BFS depth=5 Sync</text>
  <rect x="350" y="170" width="272" height="36" rx="9" fill="#0C4A6E" stroke="#64748B"/>
  <text class="nodeBody" x="640" y="195">4.724 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="265" text-anchor="end">BFS depth=5 VT</text>
  <rect x="350" y="240" width="465" height="36" rx="9" fill="#14532D" stroke="#64748B"/>
  <text class="nodeBody" x="833" y="265">18.7 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="335" text-anchor="end">BFS depth=5 Coroutine</text>
  <rect x="350" y="310" width="477" height="36" rx="9" fill="#78350F" stroke="#64748B"/>
  <text class="nodeBody" x="845" y="335">20.2 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="405" text-anchor="end">100-way launch Coroutine</text>
  <rect x="350" y="380" width="302" height="36" rx="9" fill="#7C2D12" stroke="#64748B"/>
  <text class="nodeBody" x="670" y="405">5.916 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="475" text-anchor="end">100-way launch VT</text>
  <rect x="350" y="450" width="617" height="36" rx="9" fill="#4C1D95" stroke="#64748B"/>
  <text class="nodeBody" x="985" y="475">51.0 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="545" text-anchor="end">BFS 100-way VT</text>
  <rect x="350" y="520" width="857" height="36" rx="9" fill="#134E4A" stroke="#64748B"/>
  <text class="nodeBody" x="1225" y="545">240.9 us/op</text>
</g>
<g>
  <text class="nodeBody" x="322" y="615" text-anchor="end">BFS 100-way Coroutine</text>
  <rect x="350" y="590" width="880" height="36" rx="9" fill="#831843" stroke="#64748B"/>
  <text class="nodeBody" x="1248" y="615">279.8 us/op</text>
</g>
<rect x="88" y="684" width="1324" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="750" y="709" text-anchor="middle">출처: docs/benchmark/2026-05-21-api-model-results.md, TinkerGraph JMH 단기 실행.</text>
<text class="footer" x="750" y="733" text-anchor="middle">제품 수준의 순위로 해석하기 전에 본문의 오차 범위와 측정 조건을 함께 확인한다.</text>
</svg>
