<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Maven Central 릴리스 트레인의 검증 순서</title><desc id="desc">일시적 스냅샷 403만 제한적으로 재시도하고, 테스트 실패·404·비호환은 즉시 실패시킵니다.</desc><defs><marker id="arrow-cyan" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#36C5F0"/></marker><marker id="arrow-mint" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5EEAD4"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FBBF24"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FB7185"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A78BFA"/></marker></defs>
  <style>
  .bg{fill:#07111F}.panel{fill:#0D1B2D;stroke:#36536F;stroke-width:2}.card{fill:#10243A;stroke:#36536F;stroke-width:2}.card2{fill:#132B43;stroke:#36536F;stroke-width:2}
  .title{font:700 42px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}.sub{font:600 19px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}.h{font:700 24px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
  .body{font:600 17px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}.mono{font:700 16px "goorm Sans Code","goorm Sans",monospace;fill:#E6F2FF}.small{font:600 14px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
  .life{stroke:#36536F;stroke-width:2;stroke-dasharray:8 9}.act{fill:#123252;stroke:#36C5F0;stroke-width:2}
  .call{fill:none;stroke:#36C5F0;stroke-width:4;marker-end:url(#arrow-cyan)}.ok{fill:none;stroke:#5EEAD4;stroke-width:4;marker-end:url(#arrow-mint)}
  .warn{fill:none;stroke:#FBBF24;stroke-width:4;marker-end:url(#arrow-amber)}.err{fill:none;stroke:#FB7185;stroke-width:4;marker-end:url(#arrow-red)}
  .violet{fill:none;stroke:#A78BFA;stroke-width:4;marker-end:url(#arrow-violet)}.return{stroke-dasharray:10 8}
  .pill{fill:#10243A;stroke:#36536F;stroke-width:2}.frame{fill:none;stroke:#FB7185;stroke-width:2;stroke-dasharray:10 8}
  .axis{stroke:#36536F;stroke-width:2}.grid{stroke:#233B54;stroke-width:1}.footer{fill:#0B2238;stroke:#36536F;stroke-width:2}
  </style>
<rect width="1600" height="900" class="bg"/><rect x="32" y="32" width="1536" height="836" rx="30" class="panel frame"/>
<text x="78" y="98" class="title">Maven Central 릴리스 트레인의 검증 순서</text><text x="80" y="138" class="sub subtitle">개발용 버전 행렬을 안정 버전으로 고정하고, 중앙 BOM은 모든 상위 아티팩트가 조회된 뒤 게시합니다.</text><rect x="60" y="250" width="250" height="210" rx="20" class="card"/>
<text x="84" y="294" class="h">개발용 스냅샷</text><text x="84" y="332" class="body">다음 개발선 검증</text><text x="84" y="362" class="body">게시 계약이 아님</text><rect x="365" y="250" width="250" height="210" rx="20" class="card"/>
<text x="389" y="294" class="h">안정 버전 고정</text><text x="389" y="332" class="body">릴리스 행렬 확정</text><text x="389" y="362" class="body">SNAPSHOT 제거</text><rect x="670" y="250" width="250" height="210" rx="20" class="card"/>
<text x="694" y="294" class="h">상위 BOM 확인</text><text x="694" y="332" class="body">Maven Central 조회</text><text x="694" y="362" class="body">미게시 항목만 게시</text><rect x="975" y="250" width="250" height="210" rx="20" class="card2"/>
<text x="999" y="294" class="h">중앙 BOM 게시</text><text x="999" y="332" class="body">POM 사전 검증</text><text x="999" y="362" class="body">가장 마지막에 게시</text><rect x="1280" y="250" width="250" height="210" rx="20" class="card"/>
<text x="1304" y="294" class="h">하위 소비자 검증</text><text x="1304" y="332" class="body">워크숍 / 예제</text><text x="1304" y="362" class="body">검증된 BOM 적용</text><path d="M310 355 H347" class="call"/><text x="328.5" y="322" text-anchor="middle" class="small">버전 고정</text><path d="M615 355 H652" class="call"/><text x="633.5" y="322" text-anchor="middle" class="small">HTTP 조회</text><path d="M920 355 H957" class="ok"/><text x="938.5" y="322" text-anchor="middle" class="small">공개 계약</text><path d="M1225 355 H1262" class="call"/><text x="1243.5" y="322" text-anchor="middle" class="small">소비자 동기화</text><rect x="310" y="570" width="980" height="92" rx="20" class="card2"/><text x="800" y="626" text-anchor="middle" class="h">게시 후 결함 → 같은 버전 교체 불가 → 새 패치 버전</text>
    <rect x="120" y="755" width="1360" height="80" rx="20" class="footer"/><text x="800" y="804" text-anchor="middle" class="body">일시적 스냅샷 403만 제한적으로 재시도하고, 테스트 실패·404·비호환은 즉시 실패시킵니다.</text></svg>
