<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc" data-locale="en">
<title id="title">Purchase Completion and Package Planning Use Separate Events</title><desc id="desc">Look up the existing Plan, validate and store, then converge on an explicit terminal outcome.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#111932"/></linearGradient>
 <marker id="blueArrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#60a5fa" data-solid-head="true"/></marker>
<marker id="greenArrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2dd4bf" data-solid-head="true"/></marker>
<marker id="amberArrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fbbf24" data-solid-head="true"/></marker>
<marker id="redArrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fb7185" data-solid-head="true"/></marker>
 <style>
 .title{font-family:"Architects Daughter",cursive;font-size:37px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"Comic Mono",monospace;font-size:18px;fill:#aebed2}.card{fill:#11233e;stroke-width:3}.card.blue{stroke:#60a5fa}.card.green{stroke:#2dd4bf;fill:#10333b}.card.amber{stroke:#fbbf24;fill:#312818}.card.red{stroke:#fb7185;fill:#341b2b}.card-title{font-family:"Architects Daughter",cursive;font-size:21px;font-weight:700;fill:#f8fafc}.card-title.compact{font-family:"Comic Mono",monospace;font-size:15px}.body,.label,.note{font-family:"Comic Mono",monospace;fill:#d7e3f3}.body{font-size:16px}.note{font-size:15px;fill:#aebed2}.route{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.blue-line{stroke:#60a5fa;marker-end:url(#blueArrow)}.green-line{stroke:#2dd4bf;marker-end:url(#greenArrow)}.amber-line{stroke:#fbbf24;marker-end:url(#amberArrow)}.red-line{stroke:#fb7185;marker-end:url(#redArrow)}.lifeline{stroke:#526783;stroke-width:2;stroke-dasharray:8 10}.activation{fill:#17314e;stroke:#7091ab;stroke-width:2}.pill{fill:#0d1a2e;stroke-width:2}.label{font-size:15px}.frame{fill:none;stroke:#526783;stroke-width:2;stroke-dasharray:9 8}.badge{font-family:"Comic Mono",monospace;font-size:15px;font-weight:700}
 </style>
</defs><rect width="1440" height="1280" fill="url(#bg)"/><rect x="28" y="26" width="1384" height="1228" rx="30" fill="none" stroke="#2b4168" stroke-width="2"/>
<text class="title" x="64" y="78">Purchase Completion and Package Planning Use Separate Events</text><text class="subtitle" x="66" y="112">Look up the existing Plan, validate and store, then converge on an explicit terminal outcome.</text><g class="node-card"><rect id="purchase" x="10" y="150" width="220" height="100" rx="22" class="card blue"/><text class="card-title compact" x="120" y="195" text-anchor="middle">Purchase service</text></g><g class="node-card"><rect id="purchase-handler" x="280" y="150" width="220" height="100" rx="22" class="card blue"/><text class="card-title compact" x="390" y="195" text-anchor="middle">PurchaseCompletedHandler</text></g><g class="node-card"><rect id="visit-handler" x="580" y="150" width="220" height="100" rx="22" class="card blue"/><text class="card-title compact" x="690" y="195" text-anchor="middle">VisitPlanningEventHandler</text></g><g class="node-card"><rect id="planner" x="870" y="150" width="220" height="100" rx="22" class="card blue"/><text class="card-title compact" x="980" y="195" text-anchor="middle">PackageExecutionPlanner</text></g><g class="node-card"><rect id="store" x="1150" y="150" width="220" height="100" rx="22" class="card blue"/><text class="card-title compact" x="1260" y="195" text-anchor="middle">Plan, inbox, outbox</text></g><path class="lifeline" d="M120 250 V1000"/><path class="lifeline" d="M390 250 V1000"/><path class="lifeline" d="M690 250 V1000"/><path class="lifeline" d="M980 250 V1000"/><path class="lifeline" d="M1260 250 V1000"/><rect class="activation" x="680" y="395" width="20" height="550" rx="8"/><g><rect class="pill" x="20" y="252" width="470" height="34" rx="17" stroke="#60a5fa"/><circle cx="38" cy="269" r="12" fill="#60a5fa" opacity=".2" stroke="#60a5fa"/><text class="label" x="38" y="274" text-anchor="middle">1</text><text class="label" x="60" y="274">purchase completed: create existing Plan</text></g><path class="route seq blue-line" data-source-node="purchase" data-target-node="purchase-handler" d="M120 300 H390"/><g><rect class="pill" x="180" y="372" width="450" height="34" rx="17" stroke="#fbbf24"/><circle cx="198" cy="389" r="12" fill="#fbbf24" opacity=".2" stroke="#fbbf24"/><text class="label" x="198" y="394" text-anchor="middle">2</text><text class="label" x="220" y="394">deliver separate PackageExecutionEvent</text></g><path class="route seq amber-line" data-source-node="purchase" data-target-node="visit-handler" d="M120 420 H690"/><g><rect class="pill" x="735" y="492" width="480" height="34" rx="17" stroke="#60a5fa"/><circle cx="753" cy="509" r="12" fill="#60a5fa" opacity=".2" stroke="#60a5fa"/><text class="label" x="753" y="514" text-anchor="middle">3</text><text class="label" x="775" y="514">check Plan, product, version, hash, order</text></g><path class="route seq blue-line" data-source-node="visit-handler" data-target-node="store" d="M690 540 H1260"/><g><rect class="pill" x="665" y="612" width="340" height="34" rx="17" stroke="#60a5fa"/><circle cx="683" cy="629" r="12" fill="#60a5fa" opacity=".2" stroke="#60a5fa"/><text class="label" x="683" y="634" text-anchor="middle">4</text><text class="label" x="705" y="634">validate execution contract</text></g><path class="route seq blue-line" data-source-node="visit-handler" data-target-node="planner" d="M690 660 H980"/><g><rect class="pill" x="625" y="732" width="420" height="34" rx="17" stroke="#2dd4bf"/><circle cx="643" cy="749" r="12" fill="#2dd4bf" opacity=".2" stroke="#2dd4bf"/><text class="label" x="643" y="754" text-anchor="middle">5</text><text class="label" x="665" y="754">return AppointmentPlanRevisionDraft</text></g><path class="route seq green-line" data-source-node="planner" data-target-node="visit-handler" d="M980 780 H690"/><g><rect class="pill" x="720" y="852" width="510" height="34" rx="17" stroke="#2dd4bf"/><circle cx="738" cy="869" r="12" fill="#2dd4bf" opacity=".2" stroke="#2dd4bf"/><text class="label" x="738" y="874" text-anchor="middle">6</text><text class="label" x="760" y="874">atomically store revision, children, inbox, outbox</text></g><path class="route seq green-line" data-source-node="visit-handler" data-target-node="store" d="M690 900 H1260"/><rect class="frame" x="85" y="1030" width="1270" height="190" rx="24"/><rect x="510" y="1010" width="420" height="42" rx="21" fill="#15243d" stroke="#a78bfa" stroke-width="2"/><text class="badge" x="720" y="1037" text-anchor="middle" fill="#d8b4fe">Terminal Outcome Decision</text><rect x="190" y="1125" width="230" height="72" rx="20" class="card blue"/><text class="card-title compact" x="305" y="1168" text-anchor="middle">DUPLICATE</text><rect x="460" y="1125" width="230" height="72" rx="20" class="card amber"/><text class="card-title compact" x="575" y="1168" text-anchor="middle">WAITING_GAP</text><rect x="730" y="1125" width="230" height="72" rx="20" class="card red"/><text class="card-title compact" x="845" y="1168" text-anchor="middle">quarantine, conflict</text><rect x="1000" y="1125" width="230" height="72" rx="20" class="card green"/><text class="card-title compact" x="1115" y="1168" text-anchor="middle">revision appended</text></svg>
