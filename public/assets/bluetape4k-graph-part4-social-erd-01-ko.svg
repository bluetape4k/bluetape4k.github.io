<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1600" height="780"/>
<rect class="frame" x="34" y="28" width="1532" height="724" rx="24"/>
<text class="title" x="800" y="82" text-anchor="middle">소셜 네트워크 엔터티 관계</text>
<text class="subtitle" x="800" y="118" text-anchor="middle">사람은 방향성이 있는 관계로 다른 사람과 회사에 연결된다</text>
<g>
  <path class="edge" data-connector="person-to-friend" d="M450 396 L520 396 Q538 396 538 378 L538 300 Q538 282 556 282 L650 282"/>
  <rect x="478" y="312" width="120" height="28" rx="8" fill="#0F172A" stroke="#334155"/>
  <text class="edgeLabel" x="538" y="331" text-anchor="middle">KNOWS</text>
</g>
<g>
  <path class="edge" data-connector="friend-to-company" d="M940 282 L1012 282 Q1030 282 1030 300 L1030 381 Q1030 399 1048 399 L1120 399"/>
  <rect x="970" y="314" width="120" height="28" rx="8" fill="#0F172A" stroke="#334155"/>
  <text class="edgeLabel" x="1030" y="333" text-anchor="middle">동료 탐색 경로</text>
</g>
<g>
  <path class="edge" data-connector="person-to-company" d="M450 434 L1120 434"/>
  <rect x="725" y="407" width="120" height="28" rx="8" fill="#0F172A" stroke="#334155"/>
  <text class="edgeLabel" x="785" y="426" text-anchor="middle">WORKS_AT</text>
</g>
<g>
  <path class="edge" data-connector="person-to-follow" d="M450 468 L544 468 Q562 468 562 486 L562 534 Q562 552 580 552 L650 552"/>
  <rect x="502" y="483" width="120" height="28" rx="8" fill="#0F172A" stroke="#334155"/>
  <text class="edgeLabel" x="562" y="502" text-anchor="middle">FOLLOWS</text>
</g>
<g id="person">
  <rect x="160" y="344" width="290" height="176" rx="8" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <rect x="160" y="344" width="290" height="48" rx="8" fill="#0F172A" fill-opacity="0.58" stroke="#64748B" stroke-width="2"/>
  <line x1="160" y1="392" x2="450" y2="392" stroke="#64748B" stroke-width="2"/>
  <text class="tableTitle" x="305" y="375" text-anchor="middle">사람</text>
  <line x1="160" y1="392" x2="450" y2="392" stroke="#334155"/>
  <text class="tableField" x="178" y="413">personId</text>
  <line x1="160" y1="422" x2="450" y2="422" stroke="#334155"/>
  <text class="tableField" x="178" y="443">name</text>
  <line x1="160" y1="452" x2="450" y2="452" stroke="#334155"/>
  <text class="tableField" x="178" y="473">location</text>
</g>
<g id="friend">
  <rect x="650" y="224" width="290" height="116" rx="8" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <rect x="650" y="224" width="290" height="48" rx="8" fill="#0F172A" fill-opacity="0.58" stroke="#64748B" stroke-width="2"/>
  <line x1="650" y1="272" x2="940" y2="272" stroke="#64748B" stroke-width="2"/>
  <text class="tableTitle" x="795" y="255" text-anchor="middle">지인</text>
  <line x1="650" y1="272" x2="940" y2="272" stroke="#334155"/>
  <text class="tableField" x="668" y="293">known person</text>
</g>
<g id="follow">
  <rect x="650" y="494" width="290" height="116" rx="8" fill="#4C1D95" stroke="#64748B" stroke-width="2"/>
  <rect x="650" y="494" width="290" height="48" rx="8" fill="#0F172A" fill-opacity="0.58" stroke="#64748B" stroke-width="2"/>
  <line x1="650" y1="542" x2="940" y2="542" stroke="#64748B" stroke-width="2"/>
  <text class="tableTitle" x="795" y="525" text-anchor="middle">팔로우 대상</text>
  <line x1="650" y1="542" x2="940" y2="542" stroke="#334155"/>
  <text class="tableField" x="668" y="563">followee</text>
</g>
<g id="company">
  <rect x="1120" y="344" width="290" height="146" rx="8" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <rect x="1120" y="344" width="290" height="48" rx="8" fill="#0F172A" fill-opacity="0.58" stroke="#64748B" stroke-width="2"/>
  <line x1="1120" y1="392" x2="1410" y2="392" stroke="#64748B" stroke-width="2"/>
  <text class="tableTitle" x="1265" y="375" text-anchor="middle">회사</text>
  <line x1="1120" y1="392" x2="1410" y2="392" stroke="#334155"/>
  <text class="tableField" x="1138" y="413">companyId</text>
  <line x1="1120" y1="422" x2="1410" y2="422" stroke="#334155"/>
  <text class="tableField" x="1138" y="443">name</text>
</g>
<rect x="88" y="684" width="1424" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="800" y="709" text-anchor="middle">방향과 깊이에 따라 경로를 추천 후보로 사용할지 설명 근거로만 사용할지 결정한다.</text>
<text class="footer" x="800" y="733" text-anchor="middle">탐색 결과에서 자기 자신과 이미 연결된 사람을 제외한 뒤 추천 후보로 사용한다.</text>
</svg>
