<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">chunked Flow marble diagram</title>
  <desc id="desc">A marble diagram showing five input events emitted as three concrete chunks with sizes two, two, and one.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ed8ff" stroke="#9ed8ff"/>
    </marker>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="58%" stop-color="#182331"/>
      <stop offset="100%" stop-color="#223047"/>
    </linearGradient>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="operatorGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#26384f"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <radialGradient id="marbleTeal" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#d5fff8"/>
      <stop offset="34%" stop-color="#62d6cb"/>
      <stop offset="100%" stop-color="#0b766f"/>
    </radialGradient>
    <radialGradient id="marbleBlue" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#d8efff"/>
      <stop offset="34%" stop-color="#67b7ee"/>
      <stop offset="100%" stop-color="#1f5f99"/>
    </radialGradient>
    <radialGradient id="marbleAmber" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#fff0c2"/>
      <stop offset="36%" stop-color="#dfac3f"/>
      <stop offset="100%" stop-color="#9b6a12"/>
    </radialGradient>
    <radialGradient id="marbleGreen" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#dff8c7"/>
      <stop offset="36%" stop-color="#83c95a"/>
      <stop offset="100%" stop-color="#3f7b2a"/>
    </radialGradient>
    <radialGradient id="marbleOrange" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#ffd9bc"/>
      <stop offset="36%" stop-color="#e28a46"/>
      <stop offset="100%" stop-color="#9c4b1f"/>
    </radialGradient>
    <filter id="panelShadow" x="-8%" y="-12%" width="116%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <filter id="marbleShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <filter id="laneGlow" x="-4%" y="-120%" width="108%" height="340%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.35"/>
    </filter>
    <style>
      .bg { fill: url(#bgGradient); }
      .panel { fill: url(#panelGradient); stroke: #536377; stroke-width: 2; rx: 18; filter: url(#panelShadow); }
      .title { font: 24px "Architects Daughter", "Comic Mono", system-ui, sans-serif; fill: #f8fafc; }
      .sub { font: 14px "Comic Mono", ui-monospace, monospace; fill: #b6c4d6; }
      .label { font: 15px "Comic Mono", ui-monospace, monospace; fill: #e5edf7; }
      .small { font: 13px "Comic Mono", ui-monospace, monospace; fill: #b6c4d6; }
      .tiny { font: 11px "Comic Mono", ui-monospace, monospace; fill: #f8fafc; text-anchor: middle; dominant-baseline: middle; font-weight: 700; }
      .line { stroke: #9ed8ff; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); filter: url(#laneGlow); }
      .event { stroke: #e8f7ff; stroke-width: 1.8; filter: url(#marbleShadow); }
      .box { fill: #172033; stroke-width: 2.5; rx: 14; }
      .op { fill: url(#operatorGradient); stroke: #7dd3fc; }
      .teal { fill: url(#marbleTeal); }
      .blue { fill: url(#marbleBlue); }
      .amber { fill: url(#marbleAmber); }
      .green { fill: url(#marbleGreen); }
      .orange { fill: url(#marbleOrange); }
      .guide { fill: #0f172a; fill-opacity: 0.18; stroke-width: 2; stroke-dasharray: 7 7; }
      .result { font: 12px "Comic Mono", ui-monospace, monospace; fill: #d8e5f2; text-anchor: middle; }
      .shape { stroke: #e8f7ff; stroke-width: 1.8; filter: url(#marbleShadow); }
    </style>
  </defs>
  <rect class="bg" width="920" height="320"/>
  <rect class="panel" x="24" y="22" width="872" height="276"/>
  <text class="title" x="52" y="58">chunked / buffer: emit concrete batches</text>
  <text class="sub" x="52" y="84">top: source events over time; box: chunked(2); bottom: emitted Lists</text>

  <text class="small" x="52" y="132">input Flow</text>
  <line class="line" x1="150" y1="128" x2="806" y2="128"/>
  <circle class="shape teal" cx="220" cy="128" r="13"/><text class="tiny" x="220" y="128">e1</text>
  <path class="shape blue" d="M 300 111 L 317 128 L 300 145 L 283 128 Z"/><text class="tiny" x="300" y="128">e2</text>
  <rect class="shape amber" x="367" y="115" width="26" height="26" rx="7"/><text class="tiny" x="380" y="128">e3</text>
  <path class="shape green" d="M 460 112 L 476 141 L 444 141 Z"/><text class="tiny" x="460" y="132">e4</text>
  <path class="shape orange" d="M 540 111 L 554 119 L 554 137 L 540 145 L 526 137 L 526 119 Z"/><text class="tiny" x="540" y="128">e5</text>
  <path d="M 780 113 V 143" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <rect class="guide" x="194" y="112" width="132" height="154" rx="16" stroke="#159c92"/>
  <rect class="guide" x="354" y="112" width="132" height="154" rx="16" stroke="#c58b2a"/>
  <rect class="guide" x="514" y="112" width="60" height="154" rx="16" stroke="#c26b3d"/>
  <path d="M 260 142 V 202" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M 420 142 V 202" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M 540 142 V 202" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <rect class="box op" x="340" y="164" width="170" height="44"/>
  <text class="label" x="425" y="191" text-anchor="middle">chunked(size = 2)</text>

  <text class="small" x="52" y="248">output Flow</text>
  <line class="line" x1="150" y1="244" x2="806" y2="244"/>
  <rect class="box" x="204" y="222" width="112" height="44" stroke="#159c92"/>
  <circle class="shape teal" cx="238" cy="244" r="11"/><text class="tiny" x="238" y="244">e1</text>
  <path class="shape blue" d="M 278 230 L 292 244 L 278 258 L 264 244 Z"/><text class="tiny" x="278" y="244">e2</text>
  <text class="result" x="260" y="282">List(e1, e2)</text>
  <rect class="box" x="364" y="222" width="112" height="44" stroke="#c58b2a"/>
  <rect class="shape amber" x="389" y="233" width="22" height="22" rx="6"/><text class="tiny" x="400" y="244">e3</text>
  <path class="shape green" d="M 438 232 L 451 256 L 425 256 Z"/><text class="tiny" x="438" y="247">e4</text>
  <text class="result" x="420" y="282">List(e3, e4)</text>
  <rect class="box" x="512" y="222" width="64" height="44" stroke="#c26b3d"/>
  <path class="shape orange" d="M 544 230 L 556 237 L 556 251 L 544 258 L 532 251 L 532 237 Z"/><text class="tiny" x="544" y="244">e5</text>
  <text class="result" x="544" y="282">List(e5)</text>
  <path d="M 780 229 V 259" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <text class="small" x="660" y="282">chunk sizes = [2, 2, 1]</text>
</svg>
