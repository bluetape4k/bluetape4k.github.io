<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" role="img" aria-labelledby="title desc">
  <title id="title">Metrics sampling Flow marble diagram</title>
  <desc id="desc">A marble diagram showing throttleLeading emitting first values in each window and throttleTrailing emitting last values.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ed8ff" stroke="#9ed8ff"/></marker>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <linearGradient id="operatorGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#26384f"/><stop offset="100%" stop-color="#172033"/></linearGradient>
    <radialGradient id="marbleTeal" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#d5fff8"/><stop offset="34%" stop-color="#62d6cb"/><stop offset="100%" stop-color="#0b766f"/></radialGradient>
    <radialGradient id="marbleAmber" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#fff0c2"/><stop offset="36%" stop-color="#dfac3f"/><stop offset="100%" stop-color="#9b6a12"/></radialGradient>
    <radialGradient id="marbleGreen" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#dff8c7"/><stop offset="36%" stop-color="#83c95a"/><stop offset="100%" stop-color="#3f7b2a"/></radialGradient>
    <radialGradient id="marbleOrange" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#ffd9bc"/><stop offset="36%" stop-color="#e28a46"/><stop offset="100%" stop-color="#9c4b1f"/></radialGradient>
    <filter id="panelShadow" x="-8%" y="-12%" width="116%" height="124%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
    <filter id="marbleShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#020617" flood-opacity="0.42"/></filter>
    <filter id="laneGlow" x="-4%" y="-120%" width="108%" height="340%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.35"/></filter>
    <style>
      .bg { fill: url(#bgGradient); } .panel { fill: url(#panelGradient); stroke: #536377; stroke-width: 2; rx: 18; filter: url(#panelShadow); }
      .title { font: 24px "goorm Sans"; fill: #f8fafc; }
      .sub,.small { font: 13px "goorm Sans Code"; fill: #b6c4d6; }
      .label { font: 15px "goorm Sans Code"; fill: #e5edf7; }
      .tiny { font: 11px "goorm Sans Code"; fill: #f8fafc; text-anchor: middle; dominant-baseline: middle; font-weight: 700; }
      .result { font: 12px "goorm Sans Code"; fill: #d8e5f2; text-anchor: middle; }
      .edge { stroke: #9ed8ff; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); filter: url(#laneGlow); }
      .shape { stroke: #e8f7ff; stroke-width: 1.8; filter: url(#marbleShadow); }
      .box { fill: #172033; stroke-width: 2.5; rx: 14; } .op { fill: url(#operatorGradient); stroke: #7dd3fc; }
      .guide { fill: #0f172a; fill-opacity: 0.18; stroke-width: 2; stroke-dasharray: 7 7; }
      .teal { fill: url(#marbleTeal); } .amber { fill: url(#marbleAmber); } .green { fill: url(#marbleGreen); } .orange { fill: url(#marbleOrange); }
    </style>
  </defs>
  <rect class="bg" width="920" height="450"/><rect class="panel" x="24" y="22" width="872" height="406"/>
  <text class="title" x="52" y="58">메트릭 샘플링: 첫 값은 즉시, 마지막 값은 윈도우 뒤에</text>
  <text class="sub" x="52" y="84">입력 윈도우는 같지만 출력 계약은 다릅니다: 미리보기와 대시보드</text>
  <text class="small" x="52" y="154">입력 메트릭</text><path class="edge" d="M150 150 L806 150"/>
  <rect class="guide" x="190" y="132" width="170" height="278" rx="18" stroke="#159c92"/>
  <rect class="guide" x="382" y="132" width="170" height="278" rx="18" stroke="#c58b2a"/>
  <rect class="guide" x="574" y="132" width="170" height="278" rx="18" stroke="#62984d"/>
  <circle class="shape teal" cx="220" cy="150" r="12"/><text class="tiny" x="220" y="150">10</text>
  <circle class="shape amber" cx="280" cy="150" r="12"/><text class="tiny" x="280" y="150">20</text>
  <circle class="shape green" cx="340" cy="150" r="12"/><text class="tiny" x="340" y="150">30</text>
  <circle class="shape teal" cx="412" cy="150" r="12"/><text class="tiny" x="412" y="150">40</text>
  <circle class="shape amber" cx="472" cy="150" r="12"/><text class="tiny" x="472" y="150">50</text>
  <circle class="shape green" cx="532" cy="150" r="12"/><text class="tiny" x="532" y="150">60</text>
  <circle class="shape teal" cx="604" cy="150" r="12"/><text class="tiny" x="604" y="150">70</text>
  <circle class="shape amber" cx="664" cy="150" r="12"/><text class="tiny" x="664" y="150">80</text>
  <circle class="shape green" cx="724" cy="150" r="12"/><text class="tiny" x="724" y="150">90</text>
  <circle class="shape orange" cx="786" cy="150" r="12"/><text class="tiny" x="786" y="150">100</text>
  <rect class="box op" x="324" y="222" width="250" height="50"/><text class="label" x="449" y="253" text-anchor="middle">throttleLeading / throttleTrailing</text>
  <text class="small" x="52" y="319">선두 값</text><path class="edge" d="M150 315 L806 315"/>
  <circle class="shape teal" cx="220" cy="315" r="12"/><text class="tiny" x="220" y="315">10</text>
  <circle class="shape teal" cx="412" cy="315" r="12"/><text class="tiny" x="412" y="315">40</text>
  <circle class="shape teal" cx="604" cy="315" r="12"/><text class="tiny" x="604" y="315">70</text>
  <circle class="shape orange" cx="786" cy="315" r="12"/><text class="tiny" x="786" y="315">100</text>
  <text class="small" x="52" y="394">후미 값</text><path class="edge" d="M150 390 L806 390"/>
  <circle class="shape green" cx="340" cy="390" r="12"/><text class="tiny" x="340" y="390">30</text>
  <circle class="shape green" cx="532" cy="390" r="12"/><text class="tiny" x="532" y="390">60</text>
  <circle class="shape green" cx="724" cy="390" r="12"/><text class="tiny" x="724" y="390">90</text>
  <circle class="shape orange" cx="786" cy="390" r="12"/><text class="tiny" x="786" y="390">100</text>
</svg>
