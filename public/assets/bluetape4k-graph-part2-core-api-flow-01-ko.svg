<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="780" viewBox="0 0 1700 780">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1700" height="780"/>
<rect class="frame" x="34" y="28" width="1632" height="724" rx="24"/>
<text class="title" x="850" y="82" text-anchor="middle">핵심 API 실행 흐름</text>
<text class="subtitle" x="850" y="118" text-anchor="middle">서비스는 graph-core에 의존하고 동기, 가상 스레드, suspend 실행 모델을 선택한다</text>
<path class="edge" data-connector="service-to-ops" d="M400 348 L417 348 Q434 348 434 330 L434 274 Q434 256 452 256 L480 256"/>
<path class="edge" data-connector="service-to-schema" d="M400 384 L428 384 Q446 384 446 402 L446 458 Q446 476 463 476 L480 476"/>
<path class="edge" data-connector="ops-to-execution" d="M800 256 L822 256 Q840 256 840 274 L840 330 Q840 348 858 348 L880 348"/>
<path class="edge" data-connector="schema-to-execution" d="M800 476 L822 476 Q840 476 840 458 L840 402 Q840 384 858 384 L880 384"/>
<path class="edge" data-connector="execution-to-adapter" d="M1200 366 L1260 366"/>
<g id="service">
  <rect x="80" y="295" width="320" height="142" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="240" y="352.5" text-anchor="middle">도메인 서비스</text>
  <text class="nodeBody" x="240" y="386.5" text-anchor="middle">서비스 코드는 그래프 용어 사용</text>
  <text class="nodeBody" x="240" y="409.5" text-anchor="middle">저장소 선택은 외부로 분리</text>
</g>
<g id="ops">
  <rect x="480" y="185" width="320" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="640" y="242.5" text-anchor="middle">GraphOperations</text>
  <text class="nodeBody" x="640" y="276.5" text-anchor="middle">세션 + 정점 + 간선</text>
  <text class="nodeBody" x="640" y="299.5" text-anchor="middle">순회 + 알고리즘</text>
</g>
<g id="schema">
  <rect x="480" y="405" width="320" height="142" rx="12" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="640" y="462.5" text-anchor="middle">스키마 DSL</text>
  <text class="nodeBody" x="640" y="496.5" text-anchor="middle">VertexLabel / EdgeLabel</text>
  <text class="nodeBody" x="640" y="519.5" text-anchor="middle">속성과 제약 조건</text>
</g>
<g id="execution">
  <rect x="880" y="295" width="320" height="142" rx="12" fill="#4C1D95" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1040" y="341.5" text-anchor="middle">실행 모델</text>
  <text class="nodeBody" x="1040" y="375.5" text-anchor="middle">동기 API</text>
  <text class="nodeBody" x="1040" y="398.5" text-anchor="middle">가상 스레드 파사드</text>
  <text class="nodeBody" x="1040" y="421.5" text-anchor="middle">suspend API</text>
</g>
<g id="adapter">
  <rect x="1260" y="295" width="340" height="142" rx="12" fill="#134E4A" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1430" y="352.5" text-anchor="middle">그래프 저장소 어댑터</text>
  <text class="nodeBody" x="1430" y="386.5" text-anchor="middle">Neo4j, Memgraph, AGE</text>
  <text class="nodeBody" x="1430" y="409.5" text-anchor="middle">TinkerGraph, FalkorDB</text>
</g>
<rect x="88" y="684" width="1524" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="850" y="709" text-anchor="middle">스키마, 병합, 트랜잭션 기능은 선택한 저장소가 계약을 지킬 때만 제공된다.</text>
<text class="footer" x="850" y="733" text-anchor="middle">지원하지 않는 연산은 더 약한 의미를 감추지 않고 즉시 실패한다.</text>
</svg>
