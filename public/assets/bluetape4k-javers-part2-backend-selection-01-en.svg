<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="680" viewBox="0 0 1290 680">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#F8FAFC" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer{font-family:"Comic Mono";font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle{font-family:"Architects Daughter";font-size:25px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.edgeLabel{font-family:"Comic Mono";font-size:16px;fill:#CBD5E1;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1290" height="680"/>
<rect class="frame" x="34" y="28" width="1222" height="624" rx="24"/>
<text class="title" x="645" y="82" text-anchor="middle">Persistence Role Map</text>
<text class="subtitle" x="645" y="116" text-anchor="middle">Choose the repository by read/write role, not by module name</text>
<path class="edge" d="M480 179 H434 Q416 179 416 197 V371 Q416 389 398 389 H352"/>
<path class="edge" d="M610 238 V318"/>
<path class="edge" d="M740 179 H786 Q804 179 804 197 V371 Q804 389 822 389 H868"/>
<g id="javers">
  <rect x="480" y="120" width="260" height="118" rx="12" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="610" y="162" text-anchor="middle">JaVers Commit</text>
  <text class="nodeBody" x="610" y="195" text-anchor="middle">one audit boundary</text>
</g>
<g id="exposed">
  <rect x="80" y="330" width="260" height="142" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="210" y="372" text-anchor="middle">Exposed JDBC</text>
  <text class="nodeBody" x="210" y="396" text-anchor="middle">durable SQL snapshots</text>
  <text class="nodeBody" x="210" y="422" text-anchor="middle">transaction fit</text>
  <text class="nodeBody" x="210" y="448" text-anchor="middle">queryable history</text>
</g>
<g id="redis">
  <rect x="480" y="330" width="260" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="610" y="372" text-anchor="middle">Redis</text>
  <text class="nodeBody" x="610" y="396" text-anchor="middle">cache-friendly reads</text>
  <text class="nodeBody" x="610" y="422" text-anchor="middle">LIST / multimap storage</text>
  <text class="nodeBody" x="610" y="448" text-anchor="middle">fast latest-state lookup</text>
</g>
<g id="kafka">
  <rect x="880" y="330" width="260" height="142" rx="12" fill="#7C2D12" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1010" y="372" text-anchor="middle">Kafka</text>
  <text class="nodeBody" x="1010" y="396" text-anchor="middle">write-only stream</text>
  <text class="nodeBody" x="1010" y="422" text-anchor="middle">send snapshot events</text>
  <text class="nodeBody" x="1010" y="448" text-anchor="middle">read methods return empty</text>
</g>
<rect x="88" y="590" width="1114" height="56" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="645" y="613" text-anchor="middle">Kafka is intentionally not a query repository.</text>
<text class="footer" x="645" y="636" text-anchor="middle">Pair a stream with Exposed or Redis when readers need history.</text>
</svg>
