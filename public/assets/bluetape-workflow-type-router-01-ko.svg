<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape 작업 유형 분류</title>
  <desc id="desc">하나의 요청을 위험도와 증거 범위에 따라 일곱 작업 유형으로 분류하는 어두운 배경의 구조도입니다.</desc>
  <style>
    .title { font-family: 'goorm Sans', 'Apple SD Gothic Neo', cursive; fill: #f1f5f9; font-size: 34px; }
    .subtitle, .label, .small { font-family: 'goorm Sans Code', 'SFMono-Regular', Consolas, monospace; fill: #c2cede; }
    .subtitle { font-size: 15px; }
    .type { font-family: 'goorm Sans', 'Apple SD Gothic Neo', cursive; fill: #f1f5f9; font-size: 22px; }
    .label { font-size: 14px; }
    .small { font-size: 12px; }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#94a3b8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 13 7 L 0 13 Z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#0b1220"/>
  <rect x="24" y="24" width="1152" height="672" rx="28" fill="#111c2e" stroke="#33475f" stroke-width="2"/>

  <text x="56" y="76" class="title">작업 전에 실행 경로를 먼저 고릅니다</text>
  <text x="58" y="108" class="subtitle">하나의 요청을 위험도와 증거 범위로 분류해 가장 단순하면서 안전한 경로를 고릅니다.</text>

  <!-- Primary route connectors -->
  <path d="M 600 186 V 228" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 500 338 V 358 Q 500 370 488 370 H 130 Q 118 370 118 382 V 438" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 535 338 V 366 Q 535 378 523 378 H 291 Q 279 378 279 390 V 438" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 570 338 V 374 Q 570 386 558 386 H 452 Q 440 386 440 398 V 438" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 600 338 V 438" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 630 338 V 374 Q 630 386 642 386 H 750 Q 762 386 762 398 V 438" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 665 338 V 366 Q 665 378 677 378 H 911 Q 923 378 923 390 V 438" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 700 338 V 358 Q 700 370 712 370 H 1070 Q 1082 370 1082 382 V 438" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>

  <!-- Request and router -->
  <g filter="url(#shadow)">
    <rect x="430" y="126" width="340" height="60" rx="14" fill="#14243a" stroke="#7aa7e8" stroke-width="2"/>
    <rect x="430" y="228" width="340" height="110" rx="18" fill="#132945" stroke="#60a5fa" stroke-width="2.5"/>
  </g>
  <text x="600" y="163" text-anchor="middle" class="type">사용자 요청</text>
  <text x="600" y="270" text-anchor="middle" class="type">bluetape-workflow</text>
  <text x="600" y="298" text-anchor="middle" class="label">범위·위험·증거 분류</text>
  <text x="600" y="320" text-anchor="middle" class="small">수정 전 첫 계획 승인</text>

  <!-- Type cards -->
  <g filter="url(#shadow)">
    <rect x="48" y="450" width="140" height="176" rx="16" fill="#14243a" stroke="#60a5fa" stroke-width="2"/>
    <rect x="209" y="450" width="140" height="176" rx="16" fill="#142b22" stroke="#34d399" stroke-width="2"/>
    <rect x="370" y="450" width="140" height="176" rx="16" fill="#302317" stroke="#d89132" stroke-width="2"/>
    <rect x="531" y="450" width="140" height="176" rx="16" fill="#0b1220" stroke="#aebed2" stroke-width="2"/>
    <rect x="692" y="450" width="140" height="176" rx="16" fill="#122b29" stroke="#2b9c93" stroke-width="2"/>
    <rect x="853" y="450" width="140" height="176" rx="16" fill="#321c24" stroke="#fb7185" stroke-width="2"/>
    <rect x="1014" y="450" width="136" height="176" rx="16" fill="#291f3b" stroke="#c084fc" stroke-width="2"/>
  </g>

  <text x="118" y="487" text-anchor="middle" class="type">A</text>
  <text x="118" y="513" text-anchor="middle" class="label">Full Feature</text>
  <text x="118" y="541" text-anchor="middle" class="small">모듈 / 서비스</text>
  <text x="118" y="561" text-anchor="middle" class="small">넓은 API</text>
  <text x="118" y="597" text-anchor="middle" class="small">full-feature</text>

  <text x="279" y="487" text-anchor="middle" class="type">B</text>
  <text x="279" y="513" text-anchor="middle" class="label">Fast Track</text>
  <text x="279" y="541" text-anchor="middle" class="small">소규모 기능 추가</text>
  <text x="279" y="561" text-anchor="middle" class="small">제한된 영향 범위</text>
  <text x="279" y="597" text-anchor="middle" class="small">fast-track</text>

  <text x="440" y="487" text-anchor="middle" class="type">C</text>
  <text x="440" y="513" text-anchor="middle" class="label">Bug Fix</text>
  <text x="440" y="541" text-anchor="middle" class="small">재현 가능</text>
  <text x="440" y="561" text-anchor="middle" class="small">결함 / 회귀</text>
  <text x="440" y="597" text-anchor="middle" class="small">bugfix</text>

  <text x="601" y="487" text-anchor="middle" class="type">D</text>
  <text x="601" y="513" text-anchor="middle" class="label">코드 검토</text>
  <text x="601" y="541" text-anchor="middle" class="small">읽기 전용 검토</text>
  <text x="601" y="561" text-anchor="middle" class="small">우선순위 판정</text>
  <text x="601" y="597" text-anchor="middle" class="small">code-review</text>

  <text x="762" y="487" text-anchor="middle" class="type">E</text>
  <text x="762" y="513" text-anchor="middle" class="label">Maintenance</text>
  <text x="762" y="541" text-anchor="middle" class="small">문서 / 지침</text>
  <text x="762" y="561" text-anchor="middle" class="small">설정 / CI</text>
  <text x="762" y="597" text-anchor="middle" class="small">maintenance</text>

  <text x="923" y="487" text-anchor="middle" class="type">P</text>
  <text x="923" y="513" text-anchor="middle" class="label">배포</text>
  <text x="923" y="541" text-anchor="middle" class="small">릴리스 / 태그</text>
  <text x="923" y="561" text-anchor="middle" class="small">산출물 증거</text>
  <text x="923" y="597" text-anchor="middle" class="small">publish-jvm/go</text>

  <text x="1082" y="487" text-anchor="middle" class="type">F</text>
  <text x="1082" y="513" text-anchor="middle" class="label">Self Improve</text>
  <text x="1082" y="541" text-anchor="middle" class="small">벤치마크 반복</text>
  <text x="1082" y="561" text-anchor="middle" class="small">측정 기반 종료</text>
  <text x="1082" y="597" text-anchor="middle" class="small">self-improve</text>

  <text x="600" y="666" text-anchor="middle" class="small">분류로 실행 경로를 선택하고 증거로 완료를 판정합니다.</text>
</svg>
