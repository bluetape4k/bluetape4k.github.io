<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1000" viewBox="0 0 1840 1000">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1840" height="1000"/>
<rect class="frame" x="34" y="28" width="1772" height="944" rx="24"/>
<text class="title" x="920" y="82" text-anchor="middle">bluetape4k-graph 모듈 계층</text>
<text class="subtitle" x="920" y="118" text-anchor="middle">작은 핵심 계약을 중심으로 어댑터, I/O, 프레임워크 모듈을 조합한다</text>
<path class="edge" data-connector="apps-to-framework" d="M500 291 L725 291"/>
<path class="edge" data-connector="framework-to-core" d="M920 362 L920 401 Q920 419 911 419 L911 419 Q902 419 902 437 L902 475"/>
<path class="edge" data-connector="io-to-core" d="M1340 291 L1246 291 Q1228 291 1228 309 L1228 546 Q1228 564 1210 564 L1115 564"/>
<path class="edge" data-connector="core-to-storage" d="M920 617 L920 710"/>
<g id="apps">
  <rect x="110" y="220" width="390" height="142" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="305" y="277.5" text-anchor="middle">애플리케이션과 실전 예제</text>
  <text class="nodeBody" x="305" y="311.5" text-anchor="middle">부정 사용자 탐지, 추천</text>
  <text class="nodeBody" x="305" y="334.5" text-anchor="middle">지식 그래프, 소셜 네트워크</text>
</g>
<g id="framework">
  <rect x="725" y="220" width="390" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="920" y="277.5" text-anchor="middle">프레임워크 어댑터</text>
  <text class="nodeBody" x="920" y="311.5" text-anchor="middle">Spring Boot 4 자동 구성</text>
  <text class="nodeBody" x="920" y="334.5" text-anchor="middle">Ktor 플러그인 생명주기</text>
</g>
<g id="io">
  <rect x="1340" y="220" width="390" height="142" rx="12" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1535" y="277.5" text-anchor="middle">그래프 I/O</text>
  <text class="nodeBody" x="1535" y="311.5" text-anchor="middle">CSV, NDJSON, GraphML</text>
  <text class="nodeBody" x="1535" y="334.5" text-anchor="middle">OkIO 확장 경로</text>
</g>
<g id="core">
  <rect x="725" y="475" width="390" height="142" rx="12" fill="#4C1D95" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="920" y="532.5" text-anchor="middle">graph-core</text>
  <text class="nodeBody" x="920" y="566.5" text-anchor="middle">GraphOperations, 스키마 DSL</text>
  <text class="nodeBody" x="920" y="589.5" text-anchor="middle">병합, 트랜잭션, 알고리즘</text>
</g>
<g id="storage">
  <rect x="725" y="710" width="390" height="142" rx="12" fill="#134E4A" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="920" y="767.5" text-anchor="middle">그래프 저장소 어댑터</text>
  <text class="nodeBody" x="920" y="801.5" text-anchor="middle">AGE, Neo4j, Memgraph</text>
  <text class="nodeBody" x="920" y="824.5" text-anchor="middle">TinkerPop, FalkorDB</text>
</g>
<rect x="88" y="904" width="1664" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="920" y="929" text-anchor="middle">공통 API가 중심이며 프레임워크 모듈과 I/O 모듈은 통합을 보조한다.</text>
<text class="footer" x="920" y="953" text-anchor="middle">공통 계층에 맞지 않는 질의에서는 저장소 고유 기능을 그대로 사용할 수 있다.</text>
</svg>
