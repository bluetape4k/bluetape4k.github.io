<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1180" viewBox="0 0 2200 1180" role="img" aria-labelledby="title desc">
  <title id="title">Service Boundaries Around Preferred Visit Dates and Appointment Confirmation</title>
  <desc id="desc">The customer channel owns intent and source consent, the appointment service owns proposals and appointment confirmation, clinic operations owns approval and alternatives, the resource ledger owns availability, and the clinical service owns actual completion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset=".56" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".58"/></filter>
    <marker id="primary-arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="primary" data-size="14x14" data-visible-size="28x28" data-tip-direction="positive-x"><path d="M -14 -7 L 14 7 L -14 21 Z" fill="#67e8f9" data-arrowhead="true" data-solid-head="true"/></marker>
    <marker id="secondary-arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" data-role="secondary" data-size="10x10" data-visible-size="30x30" data-tip-direction="positive-x"><path d="M -20 -10 L 10 5 L -20 20 Z" fill="#fbbf24" data-arrowhead="true" data-solid-head="true" data-role="secondary" data-size="10x10" data-visible-size="30x30"/></marker>
    <style>
      .title{font-family:"goorm Sans",sans-serif;font-size:39px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"goorm Sans",sans-serif;font-size:18px;fill:#aebed2}.frame-title{font-family:"goorm Sans",sans-serif;font-size:25px;font-weight:700;fill:#f8fafc}.card-title{font-family:"goorm Sans",sans-serif;font-size:22px;font-weight:700;fill:#f8fafc}.body{font-family:"goorm Sans",sans-serif;font-size:16px;fill:#d7e3f3}.small{font-family:"goorm Sans",sans-serif;font-size:14px;fill:#aebed2}.code{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:14px;font-weight:700;fill:#f8fafc}.pill{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:13px;font-weight:700;fill:#f8fafc}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round}.primary{stroke:#67e8f9;stroke-width:4}.secondary{stroke:#fbbf24;stroke-width:3;stroke-dasharray:12 9}.source-card{fill:#18294a;stroke:#60a5fa;stroke-width:3;filter:url(#shadow)}.reservation-frame{fill:#0b1628;stroke:#345276;stroke-width:2}.reservation-card{fill:#143b4b;stroke:#67e8f9;stroke-width:3;filter:url(#shadow)}.policy-card{fill:#392b1e;stroke:#fbbf24;stroke-width:3;filter:url(#shadow)}.clinical-card{fill:#242047;stroke:#a78bfa;stroke-width:3;filter:url(#shadow)}
    </style>
  </defs>
  <rect width="2200" height="1180" fill="url(#bg)"/><rect x="28" y="28" width="2144" height="1124" rx="30" fill="none" stroke="#263a5e" stroke-width="2"/>
  <text class="title" x="70" y="82">Service Responsibilities: Intent and Appointment Confirmation</text><text class="subtitle" x="72" y="118">Intent, source consent, scheduling agreement, operational approval, resource allocation, and clinical completion have distinct owners.</text>

  <g id="customer"><rect class="source-card" x="80" y="245" width="470" height="250" rx="24"/><rect x="108" y="273" width="112" height="28" rx="14" fill="#60a5fa" opacity=".22"/><text class="pill" x="164" y="293" text-anchor="middle">Source</text><text class="card-title" x="315" y="347" text-anchor="middle">Customer Channel · Consent Service</text><text class="body" x="315" y="389" text-anchor="middle">preferred visit date</text><text class="body" x="315" y="421" text-anchor="middle">presented terms · source consent</text><text class="code" x="315" y="462" text-anchor="middle">opaque evidence reference</text></g>
  <g id="clinic"><rect class="policy-card" x="1650" y="215" width="470" height="230" rx="24"/><rect x="1678" y="243" width="92" height="28" rx="14" fill="#fbbf24" opacity=".22"/><text class="pill" x="1724" y="263" text-anchor="middle">Decision</text><text class="card-title" x="1885" y="317" text-anchor="middle">Clinic Operations</text><text class="body" x="1885" y="359" text-anchor="middle">approve request · propose alternative</text><text class="code" x="1885" y="400" text-anchor="middle">clinic approval authority</text></g>
  <g id="resource"><rect class="source-card" x="1650" y="535" width="470" height="230" rx="24"/><rect x="1678" y="563" width="92" height="28" rx="14" fill="#60a5fa" opacity=".22"/><text class="pill" x="1724" y="583" text-anchor="middle">Source</text><text class="card-title" x="1885" y="637" text-anchor="middle">Resource Ledger</text><text class="body" x="1885" y="679" text-anchor="middle">staff · equipment · space · capacity</text><text class="code" x="1885" y="720" text-anchor="middle">ResourceAllocation</text></g>
  <g id="clinical"><rect class="clinical-card" x="1650" y="855" width="470" height="190" rx="24"/><rect x="1678" y="883" width="92" height="28" rx="14" fill="#a78bfa" opacity=".22"/><text class="pill" x="1724" y="903" text-anchor="middle">Source</text><text class="card-title" x="1885" y="955" text-anchor="middle">Clinical Service</text><text class="body" x="1885" y="997" text-anchor="middle">actual start · completion · partial completion</text></g>

  <rect class="reservation-frame" x="680" y="170" width="720" height="875" rx="30"/><text class="frame-title" x="720" y="222">Information Owned by the Appointment Service</text><text class="small" x="720" y="252">It atomically manages proposals, state, policy snapshots, and allocation bindings.</text>
  <g id="proposal"><rect class="reservation-card" x="750" y="300" width="580" height="210" rx="24"/><rect x="778" y="328" width="92" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="824" y="348" text-anchor="middle">Proposal</text><text class="card-title" x="1040" y="400" text-anchor="middle">AppointmentProposal</text><text class="body" x="1040" y="440" text-anchor="middle">time · items · resource candidates · proposal hash</text><text class="code" x="1040" y="478" text-anchor="middle">PROPOSED · HELD</text></g>
  <g id="commitment"><rect class="reservation-card" x="750" y="610" width="580" height="230" rx="24"/><rect x="778" y="638" width="112" height="28" rx="14" fill="#67e8f9" opacity=".22"/><text class="pill" x="834" y="658" text-anchor="middle">Commitment</text><text class="card-title" x="1040" y="710" text-anchor="middle">AppointmentCommitment</text><text class="body" x="1040" y="752" text-anchor="middle">confirmedProposalId · consent decision</text><text class="code" x="1040" y="792" text-anchor="middle">CONFIRMED + policy snapshot</text></g>
  <rect x="750" y="910" width="580" height="90" rx="20" fill="#13233b" stroke="#345276" stroke-width="2"/><text class="small" x="1040" y="946" text-anchor="middle">Protection rule</text><text class="body" x="1040" y="978" text-anchor="middle">A failed new proposal preserves the existing commitment and allocation.</text>

  <path class="connector primary" data-connector="customer-proposal" data-source="customer" data-target="proposal" d="M 550 370 H 750" marker-end="url(#primary-arrow)"/>
  <path class="connector primary" data-connector="proposal-commitment" data-source="proposal" data-target="commitment" d="M 1040 510 V 610" marker-end="url(#primary-arrow)"/>
  <path class="connector secondary" data-connector="clinic-proposal" data-source="clinic" data-target="proposal" d="M 1650 330 H 1480 Q 1440 330 1440 370 V 405 Q 1440 435 1410 435 H 1330" marker-end="url(#secondary-arrow)"/>
  <path class="connector primary" data-connector="proposal-resource" data-source="proposal" data-target="resource" d="M 1330 470 H 1460 Q 1500 470 1500 510 V 610 Q 1500 650 1540 650 H 1650" marker-end="url(#primary-arrow)"/>
  <path class="connector primary" data-connector="resource-commitment" data-source="resource" data-target="commitment" d="M 1650 710 H 1510 Q 1470 710 1470 750 V 775 Q 1470 805 1440 805 H 1330" marker-end="url(#primary-arrow)"/>
  <path class="connector secondary" data-connector="commitment-clinical" data-source="commitment" data-target="clinical" d="M 1330 825 H 1460 Q 1500 825 1500 865 V 915 Q 1500 950 1535 950 H 1650" marker-end="url(#secondary-arrow)"/>

  <rect x="80" y="850" width="470" height="195" rx="22" fill="#101f37" stroke="#345276" stroke-width="2"/><text class="small" x="112" y="892">How to read the boundary</text><text class="body" x="112" y="934">The customer channel hands off intent and consent.</text><text class="body" x="112" y="968">The appointment service confirms the scheduling agreement.</text><text class="body" x="112" y="1002">The clinical service determines completion.</text>
</svg>
