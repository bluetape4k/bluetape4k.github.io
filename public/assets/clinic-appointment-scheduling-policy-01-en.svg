<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1200" viewBox="0 0 2048 1200" role="img" aria-labelledby="title desc">
  <title id="title">How clinic-specific booking rules become an effective policy snapshot</title>
  <desc id="desc">A tenant default and clinic override are composed, checked during activation, and turned into an effective policy snapshot that applies the new policy to future proposals while protecting existing confirmed commitments</desc>
  <defs>
    <style>
      text { font-family: "Arial", sans-serif; }
      text.code, text.edge-label { font-family: "Arial", sans-serif; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset="1" stop-color="#0c1f3b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020812" flood-opacity="0.42"/></filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0 0 L10 5 L0 10 Z" fill="#59a9ff" stroke="none" data-arrowhead="true" data-solid-head="true"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-size="10x10" data-tip-direction="positive-x"><path d="M0 0 L10 5 L0 10 Z" fill="#ffbf4f" stroke="none" data-arrowhead="true" data-solid-head="true"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="secondary" data-size="10x10" data-tip-direction="positive-x"><path d="M0 0 L10 5 L0 10 Z" fill="#58e3d0" stroke="none" data-arrowhead="true" data-solid-head="true"/></marker>
  </defs>

  <rect id="canvas" width="2048" height="1200" fill="url(#bg)"/>
  <rect id="frame" x="24" y="24" width="2000" height="1152" rx="32" fill="none" stroke="#294b78" stroke-width="2"/>
  <text id="diagram-title" x="92" y="88" fill="#f4f7ff" font-size="44" font-weight="700">Clinic rules compose into an effective policy snapshot</text>
  <text id="diagram-subtitle" x="96" y="132" fill="#a9bad7" font-size="22">Apply a new policy to future decisions without rewriting an already confirmed visit.</text>

  <g id="tenant-default" data-node="tenant-default" data-source="src/content/docs/blog/clinic-appointment-scheduling-policy.mdx" transform="translate(100 220)">
    <rect width="400" height="210" rx="22" fill="#132b4a" stroke="#59a9ff" stroke-width="3" filter="url(#shadow)"/>
    <text x="36" y="54" fill="#8ec5ff" font-size="28" font-weight="700">Tenant default</text>
    <text class="code" x="36" y="88" fill="#6f93bd" font-size="17">TENANT DEFAULT</text>
    <text x="36" y="132" fill="#e8effc" font-size="21">Baseline for every clinic</text>
    <text x="36" y="170" fill="#9eb5d7" font-size="18">Approval mode · safety ceilings · hours</text>
  </g>

  <g id="clinic-override" data-node="clinic-override" data-source="src/content/docs/blog/clinic-appointment-scheduling-policy.mdx" transform="translate(100 430)">
    <rect width="400" height="210" rx="22" fill="#302a20" stroke="#ffbf4f" stroke-width="3" filter="url(#shadow)"/>
    <text x="36" y="54" fill="#ffd27c" font-size="28" font-weight="700">Clinic override</text>
    <text class="code" x="36" y="88" fill="#c9a968" font-size="17">CLINIC OVERRIDE</text>
    <text x="36" y="132" fill="#fff3d6" font-size="21">An explicit local difference</text>
    <text class="code" x="36" y="170" fill="#c9bf9f" font-size="18">INHERIT · SET · DISABLE</text>
  </g>

  <g id="compose" data-node="compose" data-source="src/content/docs/blog/clinic-appointment-scheduling-policy.mdx" transform="translate(620 250)">
    <rect width="390" height="360" rx="24" fill="#142c4f" stroke="#59a9ff" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="48" cy="52" r="26" fill="#1b4775" stroke="#59a9ff" stroke-width="2"/><text x="48" y="61" text-anchor="middle" fill="#f4f7ff" font-size="24" font-weight="700">1</text>
    <text x="92" y="61" fill="#8ec5ff" font-size="29" font-weight="700">Compose policy</text>
    <text class="code" x="36" y="112" fill="#6f93bd" font-size="17">RESOLVE POLICY PATHS</text>
    <rect x="34" y="145" width="322" height="72" rx="14" fill="#10233f" stroke="#365d8b" stroke-width="2"/>
    <text x="56" y="177" fill="#e8effc" font-size="20">Resolve the default and</text>
    <text x="56" y="205" fill="#e8effc" font-size="20">override path by path.</text>
    <rect x="34" y="244" width="322" height="76" rx="14" fill="#0d1d35" stroke="#294b78" stroke-width="2"/>
    <text x="56" y="276" fill="#a9bad7" font-size="18">Retain scope information</text>
    <text x="56" y="304" fill="#a9bad7" font-size="18">so the source stays visible.</text>
  </g>

  <g id="activation-gate" data-node="activation-gate" data-source="src/content/docs/blog/clinic-appointment-scheduling-policy.mdx" transform="translate(1090 300)">
    <rect width="310" height="260" rx="24" fill="#153b45" stroke="#58e3d0" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="45" cy="48" r="24" fill="#1b5b5a" stroke="#58e3d0" stroke-width="2"/><text x="45" y="57" text-anchor="middle" fill="#eafffb" font-size="22" font-weight="700">2</text>
    <text x="84" y="57" fill="#82f2df" font-size="27" font-weight="700">Activation gate</text>
    <text class="code" x="34" y="105" fill="#78bcb4" font-size="17">CAS + GENERATION</text>
    <text x="34" y="150" fill="#e2fff9" font-size="20">Compare the expected</text>
    <text x="34" y="182" fill="#e2fff9" font-size="20">revision and generation.</text>
    <text x="34" y="224" fill="#a5d9d2" font-size="17">Keep the previous ACTIVE on conflict</text>
  </g>

  <g id="effective-snapshot" data-node="effective-snapshot" data-source="src/content/docs/blog/clinic-appointment-scheduling-policy.mdx" transform="translate(1480 300)">
    <rect width="460" height="270" rx="24" fill="#142c4f" stroke="#8ec5ff" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="46" cy="48" r="24" fill="#1b4775" stroke="#8ec5ff" stroke-width="2"/><text x="46" y="57" text-anchor="middle" fill="#f4f7ff" font-size="22" font-weight="700">3</text>
    <text x="86" y="57" fill="#b6d9ff" font-size="24" font-weight="700">Effective policy snapshot</text>
    <text class="code" x="34" y="105" fill="#6f93bd" font-size="17">EFFECTIVE SNAPSHOT</text>
    <text x="34" y="150" fill="#e8effc" font-size="20">Time · generation · value source</text>
    <text class="code" x="34" y="184" fill="#e8effc" font-size="19">snapshotHash</text>
    <text x="34" y="228" fill="#9eb5d7" font-size="17">Reproduce the same decision from the same input.</text>
  </g>

  <g id="booking-decision" data-node="booking-decision" data-source="src/content/docs/blog/clinic-appointment-scheduling-policy.mdx" transform="translate(1480 660)">
    <rect width="460" height="170" rx="22" fill="#132b4a" stroke="#59a9ff" stroke-width="3" filter="url(#shadow)"/>
    <text x="36" y="54" fill="#8ec5ff" font-size="28" font-weight="700">Booking decision</text>
    <text class="code" x="36" y="88" fill="#6f93bd" font-size="17">BOOKING DECISION</text>
    <text x="36" y="132" fill="#e8effc" font-size="20">Evaluate with the snapshot active at request time.</text>
  </g>

  <g id="future-proposal" data-node="future-proposal" data-source="src/content/docs/blog/clinic-appointment-scheduling-policy.mdx" transform="translate(1090 940)">
    <rect width="400" height="160" rx="20" fill="#302a20" stroke="#ffbf4f" stroke-width="3" filter="url(#shadow)"/>
    <text x="32" y="52" fill="#ffd27c" font-size="27" font-weight="700">New proposal · future</text>
    <text class="code" x="32" y="90" fill="#c9a968" font-size="17">PROPOSED / HELD</text>
    <text x="32" y="128" fill="#fff3d6" font-size="18">The new policy may apply.</text>
  </g>

  <g id="confirmed-protected" data-node="confirmed-protected" data-source="src/content/docs/blog/clinic-appointment-scheduling-policy.mdx" transform="translate(1540 940)">
    <rect width="400" height="160" rx="20" fill="#153b45" stroke="#58e3d0" stroke-width="3" filter="url(#shadow)"/>
    <text x="32" y="52" fill="#82f2df" font-size="27" font-weight="700">Protect confirmed visit</text>
    <text class="code" x="32" y="90" fill="#78bcb4" font-size="17">CONFIRMED</text>
    <text x="32" y="128" fill="#e2fff9" font-size="18">Do not rewrite it with the new policy.</text>
  </g>

  <path d="M500 325 H620" fill="none" stroke="#59a9ff" stroke-width="5" marker-end="url(#arrow-blue)" data-edge="tenant-default-&gt;compose" data-source="tenant-default" data-target="compose" data-role="primary"/>
  <g><rect x="510" y="278" width="100" height="32" rx="10" fill="#0d1d35" stroke="#294b78"/><text class="edge-label" x="560" y="300" text-anchor="middle" fill="#8ec5ff" font-size="15" font-weight="700">baseline</text></g>
  <path d="M500 535 H620" fill="none" stroke="#ffbf4f" stroke-width="4" marker-end="url(#arrow-amber)" data-edge="clinic-override-&gt;compose" data-source="clinic-override" data-target="compose" data-role="override"/>
  <g><rect x="506" y="554" width="108" height="32" rx="10" fill="#1e1d1a" stroke="#5a4520"/><text class="edge-label" x="560" y="576" text-anchor="middle" fill="#ffd27c" font-size="15" font-weight="700">local intent</text></g>
  <path d="M1010 430 H1090" fill="none" stroke="#59a9ff" stroke-width="5" marker-end="url(#arrow-blue)" data-edge="compose-&gt;activation-gate" data-source="compose" data-target="activation-gate" data-role="primary"/>
  <g><rect x="1017" y="382" width="66" height="32" rx="10" fill="#0d1d35" stroke="#294b78"/><text class="edge-label" x="1050" y="404" text-anchor="middle" fill="#8ec5ff" font-size="15" font-weight="700">out</text></g>
  <path d="M1400 430 H1480" fill="none" stroke="#59a9ff" stroke-width="5" marker-end="url(#arrow-blue)" data-edge="activation-gate-&gt;effective-snapshot" data-source="activation-gate" data-target="effective-snapshot" data-role="primary"/>
  <g><rect x="1407" y="382" width="66" height="32" rx="10" fill="#0d1d35" stroke="#294b78"/><text class="edge-label" x="1440" y="404" text-anchor="middle" fill="#8ec5ff" font-size="15" font-weight="700">valid</text></g>
  <path d="M1710 570 V660" fill="none" stroke="#59a9ff" stroke-width="5" marker-end="url(#arrow-blue)" data-edge="effective-snapshot-&gt;booking-decision" data-source="effective-snapshot" data-target="booking-decision" data-role="primary"/>
  <g><rect x="1730" y="594" width="110" height="32" rx="10" fill="#0d1d35" stroke="#294b78"/><text class="edge-label" x="1785" y="616" text-anchor="middle" fill="#8ec5ff" font-size="15" font-weight="700">read policy</text></g>
  <path d="M1590 830 V860 Q1590 880 1570 880 H1310 Q1290 880 1290 900 V940" fill="none" stroke="#ffbf4f" stroke-width="4" marker-end="url(#arrow-amber)" data-edge="booking-decision-&gt;future-proposal" data-source="booking-decision" data-target="future-proposal" data-role="future-branch"/>
  <g><rect x="1366" y="844" width="80" height="32" rx="10" fill="#1e1d1a" stroke="#5a4520"/><text class="edge-label" x="1406" y="866" text-anchor="middle" fill="#ffd27c" font-size="15" font-weight="700">new</text></g>
  <path d="M1820 830 V940" fill="none" stroke="#58e3d0" stroke-width="4" marker-end="url(#arrow-teal)" data-edge="booking-decision-&gt;confirmed-protected" data-source="booking-decision" data-target="confirmed-protected" data-role="protected-branch"/>
  <g><rect x="1840" y="856" width="98" height="32" rx="10" fill="#10282f" stroke="#1b5b5a"/><text class="edge-label" x="1889" y="878" text-anchor="middle" fill="#82f2df" font-size="15" font-weight="700">confirmed</text></g>

  <g id="boundary-note" transform="translate(100 760)">
    <rect width="900" height="340" rx="24" fill="#0d1d35" stroke="#3d6797" stroke-width="2"/>
    <text x="38" y="58" fill="#f4f7ff" font-size="28" font-weight="700">Boundary to preserve</text>
    <text x="38" y="104" fill="#a9bad7" font-size="20">A policy is a rule for decisions that come next.</text>
    <rect x="38" y="142" width="390" height="142" rx="18" fill="#302a20" stroke="#ffbf4f" stroke-width="2"/>
    <text x="66" y="188" fill="#ffd27c" font-size="23" font-weight="700">Future request</text>
    <text x="66" y="226" fill="#fff3d6" font-size="18">Evaluate with the active snapshot</text>
    <text x="66" y="258" fill="#c9bf9f" font-size="17">The new policy may apply.</text>
    <rect x="466" y="142" width="396" height="142" rx="18" fill="#153b45" stroke="#58e3d0" stroke-width="2"/>
    <text x="494" y="188" fill="#82f2df" font-size="23" font-weight="700">Confirmed visit</text>
    <text x="494" y="226" fill="#e2fff9" font-size="18">An outcome already promised</text>
    <text x="494" y="258" fill="#a5d9d2" font-size="17">Do not rewrite it after a policy change.</text>
    <text x="450" y="318" text-anchor="middle" fill="#b4c5df" font-size="18">Do not recalculate a rule and its committed outcome as one value.</text>
  </g>
</svg>
