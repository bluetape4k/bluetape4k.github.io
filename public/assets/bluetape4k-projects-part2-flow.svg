<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k Projects Part 2 request and test flow</title>
  <desc id="desc">A service request moves through core validation, logging, coroutine helpers, test fixtures, and deterministic proof.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#eff8ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#475569" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="10" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 11 6.5 L 1 12 Z" fill="#5b6f92"/>
    </marker>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #243044; }
      .subtitle { font-family: "Comic Mono"; font-size: 18px; fill: #64748b; }
      .card-title { font-family: "Architects Daughter"; font-size: 28px; fill: #243044; text-anchor: middle; }
      .card-body { font-family: "Comic Mono"; font-size: 15px; fill: #475569; text-anchor: middle; }
      .label { font-family: "Comic Mono"; font-size: 14px; fill: #5b6f92; text-anchor: middle; }
      .caption { font-family: "Comic Mono"; font-size: 16px; fill: #475569; text-anchor: middle; }
      .arrow { fill: none; stroke: #5b6f92; stroke-width: 4; marker-end: url(#arrow); stroke-linecap: round; }
    </style>
  </defs>

  <rect x="24" y="24" width="1552" height="572" rx="34" fill="url(#paper)" stroke="#d5e0ee" stroke-width="2"/>
  <text x="800" y="76" class="title" text-anchor="middle">Core, Coroutines, Logging, Tests</text>
  <text x="800" y="110" class="subtitle" text-anchor="middle">the small foundation that keeps request paths and test paths boring in a good way</text>

  <g filter="url(#shadow)">
    <rect x="70" y="192" width="210" height="170" rx="24" fill="#dbeafe" stroke="#5b8def" stroke-width="3"/>
    <rect x="325" y="192" width="230" height="170" rx="24" fill="#ede9fe" stroke="#8b6fe8" stroke-width="3"/>
    <rect x="600" y="192" width="230" height="170" rx="24" fill="#dcfce7" stroke="#66b876" stroke-width="3"/>
    <rect x="875" y="192" width="230" height="170" rx="24" fill="#fef3c7" stroke="#e5a832" stroke-width="3"/>
    <rect x="1150" y="192" width="230" height="170" rx="24" fill="#ffe4e6" stroke="#e87987" stroke-width="3"/>
  </g>

  <text x="175" y="252" class="card-title">Service code</text>
  <text x="175" y="290" class="card-body">request handler</text>
  <text x="175" y="316" class="card-body">domain boundary</text>

  <text x="440" y="246" class="card-title">Core</text>
  <text x="440" y="284" class="card-body">require helpers</text>
  <text x="440" y="310" class="card-body">codec, collections</text>
  <text x="440" y="336" class="card-body">small Kotlin conveniences</text>

  <text x="715" y="246" class="card-title">Logging</text>
  <text x="715" y="284" class="card-body">lazy messages</text>
  <text x="715" y="310" class="card-body">MDC context</text>
  <text x="715" y="336" class="card-body">coroutine propagation</text>

  <text x="990" y="246" class="card-title">Coroutines</text>
  <text x="990" y="284" class="card-body">DeferredValue</text>
  <text x="990" y="310" class="card-body">Flow operators</text>
  <text x="990" y="336" class="card-body">structured async paths</text>

  <text x="1265" y="246" class="card-title">Tests</text>
  <text x="1265" y="284" class="card-body">JUnit5 helpers</text>
  <text x="1265" y="310" class="card-body">Testcontainers launchers</text>
  <text x="1265" y="336" class="card-body">cleanup and proof</text>

  <path d="M 280 277 L 325 277" class="arrow"/>
  <path d="M 555 277 L 600 277" class="arrow"/>
  <path d="M 830 277 L 875 277" class="arrow"/>
  <path d="M 1105 277 L 1150 277" class="arrow"/>

  <text x="302" y="392" class="label">validate</text>
  <text x="578" y="392" class="label">explain</text>
  <text x="852" y="392" class="label">propagate</text>
  <text x="1128" y="392" class="label">exercise</text>

  <g>
    <rect x="198" y="442" width="1204" height="76" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="800" y="474" class="caption">Adoption rule: pick the smallest module that removes repeated service or test code.</text>
    <text x="800" y="500" class="caption">The win is not magic. It is fewer hand-rolled helpers quietly arguing in the corner.</text>
  </g>
</svg>
