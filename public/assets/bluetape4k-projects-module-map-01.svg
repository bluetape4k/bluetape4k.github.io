<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="820" viewBox="0 0 1520 820" role="img" aria-labelledby="root-readme-en-diagram-01-title root-readme-en-diagram-01-desc">
  <title id="root-readme-en-diagram-01-title">Repository Module Structure</title>
  <desc id="root-readme-en-diagram-01-desc">Usage modules build on aligned capability groups, and those capabilities share the Core foundation.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#758297"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans";font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue";font-size:16px;fill:#536476;font-weight:400}
      .band{fill:#F4F7FA;stroke:#D7E2EC;stroke-width:2}
      .bandTitle{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans";font-size:19px;fill:#536476;font-weight:400}
      .legend{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue";font-size:13px;fill:#627184;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .cardTitle{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans";font-size:28px;fill:#22344A;font-weight:400}
      .body{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue";font-size:15px;fill:#34465B;font-weight:400}
      .edge{stroke:#758297;stroke-width:2.5;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1520" height="820"/>
  <rect class="frame" x="32" y="28" width="1456" height="764" rx="26"/>
  <text class="title" x="66" y="82">Repository Module Structure</text>
  <text class="subtitle" x="70" y="116">Start with usage, select the capabilities you need, and rely on the shared foundation</text>
  <text class="legend" x="1440" y="116" text-anchor="end">Arrows point to the layer each group builds on</text>

  <rect class="band" x="60" y="145" width="1380" height="160" rx="22"/>
  <text class="bandTitle" x="86" y="176">USAGE</text>
  <rect class="band" x="60" y="335" width="1380" height="225" rx="22"/>
  <text class="bandTitle" x="86" y="369">CAPABILITIES</text>
  <rect class="band" x="60" y="600" width="1380" height="150" rx="22"/>
  <text class="bandTitle" x="86" y="632">FOUNDATION</text>

  <path class="edge" d="M380 232 H570"/>
  <path class="edge" d="M220 285 V400"/>
  <path class="edge" d="M650 285 V315 Q650 327 638 327 H467 Q455 327 455 339 V400"/>
  <path class="edge" d="M710 285 V400"/>
  <path class="edge" d="M1080 460 H1130"/>
  <path class="edge" d="M220 520 V645"/>
  <path class="edge" d="M455 520 V645"/>
  <path class="edge" d="M710 520 V645"/>
  <path class="edge" d="M1260 520 V645"/>

  <g>
    <rect class="card" x="100" y="180" width="280" height="105" rx="16" fill="#EEF6D9" stroke="#8BA84D"/>
    <text class="cardTitle" x="240" y="218" text-anchor="middle">Examples</text>
    <text class="body" x="240" y="252" text-anchor="middle">Ktor / Spring Boot / JPA</text>
    <text class="body" x="240" y="276" text-anchor="middle">Redis / virtual threads</text>
  </g>
  <g>
    <rect class="card" x="570" y="180" width="280" height="105" rx="16" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="710" y="218" text-anchor="middle">Server stacks</text>
    <text class="body" x="710" y="252" text-anchor="middle">Ktor 3.x / Spring Boot 4.x</text>
    <text class="body" x="710" y="276" text-anchor="middle">testing</text>
  </g>

  <g>
    <rect class="card" x="100" y="400" width="240" height="120" rx="16" fill="#F7F1E7" stroke="#B88A44"/>
    <text class="cardTitle" x="220" y="438" text-anchor="middle">Utilities</text>
    <text class="body" x="220" y="472" text-anchor="middle">id / time / money / math</text>
    <text class="body" x="220" y="496" text-anchor="middle">workflow / geo / science</text>
  </g>
  <g>
    <rect class="card" x="370" y="400" width="170" height="120" rx="16" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="455" y="438" text-anchor="middle">I/O</text>
    <text class="body" x="455" y="472" text-anchor="middle">HTTP / JSON</text>
    <text class="body" x="455" y="496" text-anchor="middle">gRPC / Protobuf</text>
  </g>
  <g>
    <rect class="card" x="600" y="400" width="220" height="120" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="cardTitle" x="710" y="438" text-anchor="middle">Data</text>
    <text class="body" x="710" y="472" text-anchor="middle">Cassandra / Hibernate</text>
    <text class="body" x="710" y="496" text-anchor="middle">MongoDB / JDBC / R2DBC</text>
  </g>
  <g>
    <rect class="card" x="900" y="400" width="180" height="120" rx="16" fill="#EAF7EF" stroke="#58A978"/>
    <text class="cardTitle" x="990" y="438" text-anchor="middle">Cache</text>
    <text class="body" x="990" y="472" text-anchor="middle">cache-core</text>
    <text class="body" x="990" y="496" text-anchor="middle">Hazelcast / Lettuce</text>
  </g>
  <g>
    <rect class="card" x="1130" y="400" width="260" height="120" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
    <text class="cardTitle" x="1260" y="438" text-anchor="middle">Infrastructure</text>
    <text class="body" x="1260" y="472" text-anchor="middle">Redis / Kafka / NATS / Pulsar</text>
    <text class="body" x="1260" y="496" text-anchor="middle">Micrometer / OTel / resilience</text>
  </g>

  <g>
    <rect class="card" x="100" y="645" width="1290" height="80" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="cardTitle" x="745" y="676" text-anchor="middle">Core</text>
    <text class="body" x="745" y="706" text-anchor="middle">annotations / core / coroutines / logging / BOM</text>
  </g>
