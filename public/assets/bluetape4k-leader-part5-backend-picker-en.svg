<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-labelledby="title desc">
  <title id="title">Choose a Leader Backend by Workload</title><desc id="desc">The API stays stable while lease storage, TTL, failure handling, and observability change.</desc><defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#02050a" flood-opacity="0.42"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6fb6e8" stroke="#6fb6e8" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#80d99b" stroke="#80d99b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e2b35c" stroke="#e2b35c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ef8292" stroke="#ef8292" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#87a8c2" stroke="#87a8c2" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#050914}.frame{fill:#0c1628;stroke:#315a7a;stroke-width:2.2}
      .title{font-family:"Architects Daughter";font-size:38px;fill:#f0f5ff}
      .subtitle,.detail,.labelText,.footer,.axis,.tick,.legend,.role{font-family:"Comic Mono";fill:#b4c5d8}
      .subtitle{font-size:16px}.detail{font-size:14px}.footer{font-size:13px}.axis,.tick,.legend{font-size:13px}
      .role{font-family:"Comic Mono";font-size:12.5px}
      .bandTitle,.cardTitle,.participant{font-family:"Architects Daughter";fill:#edf4ff}
      .bandTitle{font-size:23px}.cardTitle{font-size:22px}.participant{font-size:19px}
      .mono,.code,.badgeText{font-family:"Comic Mono";fill:#d7e3f2}
      .band{fill:#101d30;stroke:#294c69;stroke-width:1.6}.bandAlt{fill:#10231f;stroke:#2f6257;stroke-width:1.6}
      .card{filter:url(#shadow);fill:#111d2f!important;stroke-width:2}.header{fill:#111d2f;stroke:#537a99;stroke-width:2}
      .surfaceWarm{fill:#211c16;stroke:#8b6a34;stroke-width:2}.surfacePurple{fill:#1c1930;stroke:#7058a2;stroke-width:2}
      .footerBar{fill:#0e1b2e;stroke:#294c69;stroke-width:2}.tableHeader{fill:#142b46;stroke:#537a99;stroke-width:2}
      .edge,.call,.return,.skip,.state{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .call{stroke:#6fb6e8;marker-end:url(#arrow-blue)}.state{stroke:#80d99b;marker-end:url(#arrow-green)}
      .return{stroke:#e2b35c;marker-end:url(#arrow-amber);stroke-dasharray:8 7}.skip{stroke:#ef8292;marker-end:url(#arrow-red)}
      .pill,.label{fill:#0e1a2b;stroke-width:1.5}.badgeCircle{fill:#0e1a2b}.labelText{font-size:12.5px}.badgeText{font-size:12px;font-weight:700}
      .lifeline{stroke:#52718a;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#193c32;stroke:#71bf8b;stroke-width:1.7}
      .branch{fill:none;stroke:#7194ae;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#7194ae;stroke-width:1.4;stroke-dasharray:8 7}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="1080"/><rect class="frame" x="34" y="30" width="1432" height="1020" rx="18"/>
  <text x="750" y="90" class="title" text-anchor="middle">Choose a Leader Backend by Workload</text><text x="750" y="124" class="subtitle" text-anchor="middle">The API stays stable while lease storage, TTL, failure handling, and observability change.</text>
  <rect x="320" y="172" width="860" height="138" rx="16" class="band"/>
  <text x="750" y="224" class="bandTitle" text-anchor="middle">Start from infrastructure you already operate</text><text x="750" y="270" class="mono" text-anchor="middle">Redis / etcd / SQL/R2DBC / Kubernetes</text>
  <path d="M 515 310 L 515 338 Q 515 358 207 378 L 207 386" class="call"/><path d="M 671 310 L 671 338 Q 671 358 569 378 L 569 386" class="call"/><path d="M 827 310 L 827 338 Q 827 358 931 378 L 931 386" class="call"/><path d="M 983 310 L 983 338 Q 983 358 1293 378 L 1293 386" class="call"/><g><rect x="54" y="390" width="306" height="250" rx="16" fill="#111d2f" stroke="#ef8292" stroke-width="2.4"/>
      <text x="207" y="438" class="cardTitle" text-anchor="middle">Redis first</text>
      <text x="78" y="486" class="detail" >Lettuce: lean client</text><text x="78" y="524" class="detail" >Redisson: lock abstraction</text><text x="78" y="562" class="detail" >TTL + token ownership</text><text x="78" y="600" class="detail" >Fits shared Redis operations</text></g><g><rect x="416" y="390" width="306" height="250" rx="16" fill="#111d2f" stroke="#6fb6e8" stroke-width="2.4"/>
      <text x="569" y="438" class="cardTitle" text-anchor="middle">etcd leases</text>
      <text x="440" y="486" class="detail" >Control-plane native</text><text x="440" y="524" class="detail" >Lease + compare-and-write</text><text x="440" y="562" class="detail" >Fits reconciler models</text><text x="440" y="600" class="detail" >Use when etcd owns control state</text></g><g><rect x="778" y="390" width="306" height="250" rx="16" fill="#111d2f" stroke="#80d99b" stroke-width="2.4"/>
      <text x="931" y="438" class="cardTitle" text-anchor="middle">SQL rows</text>
      <text x="802" y="486" class="detail" >Exposed JDBC/R2DBC</text><text x="802" y="524" class="detail" >Row + conditional update</text><text x="802" y="562" class="detail" >Audit history is inspectable</text><text x="802" y="600" class="detail" >Fits database-owned operations</text></g><g><rect x="1140" y="390" width="306" height="250" rx="16" fill="#111d2f" stroke="#9b8cf2" stroke-width="2.4"/>
      <text x="1293" y="438" class="cardTitle" text-anchor="middle">Kubernetes Lease</text>
      <text x="1164" y="486" class="detail" >Pod and operator lifecycle</text><text x="1164" y="524" class="detail" >coordination.k8s.io/v1</text><text x="1164" y="562" class="detail" >K3s benchmark target</text><text x="1164" y="600" class="detail" >Fits Kubernetes workloads</text></g>
  <rect x="76" y="710" width="1348" height="178" rx="16" class="bandAlt"/>
  <text x="750" y="754" class="bandTitle" text-anchor="middle">Other backends share the contract but fit more specific operating conditions</text><g><rect x="142" y="785" width="214" height="52" rx="18" fill="#12243a" stroke="#537a99" stroke-width="1.8"/>
      <text x="249" y="818" class="detail" text-anchor="middle">MongoDB TTL</text></g><g><rect x="390" y="785" width="214" height="52" rx="18" fill="#12243a" stroke="#537a99" stroke-width="1.8"/>
      <text x="497" y="818" class="detail" text-anchor="middle">DynamoDB item</text></g><g><rect x="638" y="785" width="214" height="52" rx="18" fill="#12243a" stroke="#537a99" stroke-width="1.8"/>
      <text x="745" y="818" class="detail" text-anchor="middle">Consul KV</text></g><g><rect x="886" y="785" width="214" height="52" rx="18" fill="#12243a" stroke="#537a99" stroke-width="1.8"/>
      <text x="993" y="818" class="detail" text-anchor="middle">Hazelcast map</text></g><g><rect x="1134" y="785" width="214" height="52" rx="18" fill="#12243a" stroke="#537a99" stroke-width="1.8"/>
      <text x="1241" y="818" class="detail" text-anchor="middle">ZooKeeper / Curator</text></g><text x="750" y="866" class="footer" text-anchor="middle">Compare distributed backends with distributed backends. Local/H2 values validate API shape, not production rank.</text>
  <rect x="238" y="928" width="1024" height="84" rx="18" class="footerBar"/>
  <text x="750" y="966" class="bandTitle" text-anchor="middle">Operations layer</text><text x="750" y="994" class="footer" text-anchor="middle">LockExtender / LockAssert / history and audit / Micrometer / benchmark caveats</text>
  </svg>