<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Backend picker for bluetape4k-leader</title>
  <desc id="desc">Decision-oriented map for choosing Redis, etcd, SQL, Kubernetes, and other leader election storage backends.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 42px; fill: #1f2937; }
      .subtitle { font-family: "Comic Mono", "Comic Sans MS", monospace; font-size: 17px; fill: #4b5563; }
      .cardTitle { font-family: "Architects Daughter", "Comic Sans MS", cursive; font-size: 25px; fill: #111827; }
      .cardText { font-family: "Comic Mono", "Comic Sans MS", monospace; font-size: 15px; fill: #374151; }
      .small { font-family: "Comic Mono", "Comic Sans MS", monospace; font-size: 13px; fill: #4b5563; }
      .pill { font-family: "Comic Mono", "Comic Sans MS", monospace; font-size: 14px; fill: #111827; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .softLine { stroke: #cbd5e1; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrowHead" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1200" height="820" fill="#fbfaf7"/>
  <circle cx="112" cy="124" r="54" fill="#dbeafe" opacity="0.9"/>
  <circle cx="1086" cy="154" r="72" fill="#dcfce7" opacity="0.7"/>
  <circle cx="1014" cy="720" r="80" fill="#fde68a" opacity="0.45"/>

  <text x="600" y="70" text-anchor="middle" class="title">Choose the backend by operation shape</text>
  <text x="600" y="104" text-anchor="middle" class="subtitle">The API stays similar; lease storage, TTL, failure mode, and observability change.</text>

  <rect x="360" y="136" width="480" height="96" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="172" text-anchor="middle" class="cardTitle">Start from what you already run</text>
  <text x="600" y="202" text-anchor="middle" class="cardText">Redis • etcd • SQL rows • Kubernetes</text>

  <path class="arrow" d="M 510 236 L 248 284"/>
  <path class="arrow" d="M 570 236 L 462 284"/>
  <path class="arrow" d="M 630 236 L 738 284"/>
  <path class="arrow" d="M 690 236 L 952 284"/>

  <g filter="url(#shadow)">
    <rect x="60" y="292" width="244" height="170" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
    <text x="182" y="330" text-anchor="middle" class="cardTitle">Redis first</text>
    <text x="84" y="366" class="cardText">Lettuce: lean client path</text>
    <text x="84" y="394" class="cardText">Redisson: familiar locks</text>
    <text x="84" y="422" class="cardText">TTL + token ownership</text>
    <text x="84" y="450" class="small">Default when Redis is shared ops.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="340" y="292" width="244" height="170" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
    <text x="462" y="330" text-anchor="middle" class="cardTitle">etcd leases</text>
    <text x="364" y="366" class="cardText">Native control-plane fit</text>
    <text x="364" y="394" class="cardText">Lease + compare/write</text>
    <text x="364" y="422" class="cardText">Good reconciler model</text>
    <text x="364" y="450" class="small">Use when etcd owns control state.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="620" y="292" width="244" height="170" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
    <text x="742" y="330" text-anchor="middle" class="cardTitle">SQL rows</text>
    <text x="644" y="366" class="cardText">Exposed JDBC/R2DBC</text>
    <text x="644" y="394" class="cardText">Rows + conditional update</text>
    <text x="644" y="422" class="cardText">Audit is easy to inspect</text>
    <text x="644" y="450" class="small">Use when DB ops own the budget.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="292" width="244" height="170" rx="12" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="1022" y="330" text-anchor="middle" class="cardTitle">Kubernetes Lease</text>
    <text x="924" y="366" class="cardText">coordination.k8s.io/v1</text>
    <text x="924" y="394" class="cardText">Pod/operator lifecycle</text>
    <text x="924" y="422" class="cardText">K3s benchmark target</text>
    <text x="924" y="450" class="small">Best for K8s-native workloads.</text>
  </g>

  <path class="softLine" d="M 182 478 L 182 522"/>
  <path class="softLine" d="M 462 478 L 462 522"/>
  <path class="softLine" d="M 742 478 L 742 522"/>
  <path class="softLine" d="M 1022 478 L 1022 522"/>

  <g filter="url(#shadow)">
    <rect x="90" y="526" width="1020" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="600" y="563" text-anchor="middle" class="cardTitle">Remaining families are still first-class, but more situational</text>
    <rect x="128" y="594" width="148" height="42" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="202" y="620" text-anchor="middle" class="pill">MongoDB TTL</text>
    <rect x="300" y="594" width="156" height="42" rx="10" fill="#fce7f3" stroke="#f472b6"/>
    <text x="378" y="620" text-anchor="middle" class="pill">DynamoDB item</text>
    <rect x="480" y="594" width="132" height="42" rx="10" fill="#ecfccb" stroke="#84cc16"/>
    <text x="546" y="620" text-anchor="middle" class="pill">Consul KV</text>
    <rect x="636" y="594" width="156" height="42" rx="10" fill="#f3e8ff" stroke="#c084fc"/>
    <text x="714" y="620" text-anchor="middle" class="pill">Hazelcast map</text>
    <rect x="816" y="594" width="158" height="42" rx="10" fill="#cffafe" stroke="#22d3ee"/>
    <text x="895" y="620" text-anchor="middle" class="pill">ZooKeeper/Curator</text>
    <text x="600" y="654" text-anchor="middle" class="small">Compare distributed rows with distributed rows. Local/H2 rows are shape checks, not production ranking claims.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="190" y="706" width="820" height="70" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="600" y="735" text-anchor="middle" class="cardTitle">Operations layer</text>
    <text x="600" y="762" text-anchor="middle" class="cardText">LockExtender • LockAssert • history/audit • Micrometer • benchmark caveats</text>
  </g>
</svg>
