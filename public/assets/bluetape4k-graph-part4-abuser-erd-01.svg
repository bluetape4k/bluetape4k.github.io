<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="860" viewBox="0 0 1800 860">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#496A8F"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#22344A;font-weight:400}
    .subtitle,.footer,.axis{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:17px;fill:#536476;font-weight:400}
    .nodeTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .nodeBody{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:16px;fill:#3F5269;font-weight:400}
    .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#22344A;font-weight:400}
    .tableField,.edgeLabel{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;fill:#3F5269;font-weight:400}
    .edge{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#91A6BD;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1800" height="860"/>
<rect class="frame" x="34" y="28" width="1732" height="804" rx="24"/>
<text class="title" x="900" y="82" text-anchor="middle">Abuser Detection Entity Graph</text>
<text class="subtitle" x="900" y="118" text-anchor="middle">Users connect to identifiers; shared identifiers become review evidence</text>
<g>
  <path class="edge" d="M400 298 H460 V233 H520"/>
  <rect x="399" y="239" width="122" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="460" y="258" text-anchor="middle">USES_DEVICE</text>
</g>
<g>
  <path class="edge" d="M400 298 H460 V433 H520"/>
  <rect x="400" y="339" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="460" y="358" text-anchor="middle">USES_IP</text>
</g>
<g>
  <path class="edge" d="M400 298 H655 V218 H910"/>
  <rect x="595" y="231" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="655" y="250" text-anchor="middle">HAS_PHONE</text>
</g>
<g>
  <path class="edge" d="M400 298 H655 V433 H910"/>
  <rect x="590" y="339" width="130" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="655" y="358" text-anchor="middle">USES_PAYMENT</text>
</g>
<g>
  <path class="edge" d="M400 298 H850 V318 H1300"/>
  <rect x="789" y="281" width="122" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="850" y="300" text-anchor="middle">REFERRED_BY</text>
</g>
<g id="user">
  <rect x="130" y="210" width="270" height="176" rx="8" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="130" y="210" width="270" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="130" y1="258" x2="400" y2="258" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="265" y="241" text-anchor="middle">User</text>
  <line x1="130" y1="258" x2="400" y2="258" stroke="#D7E2EC"/>
  <text class="tableField" x="148" y="279">userId</text>
  <line x1="130" y1="288" x2="400" y2="288" stroke="#D7E2EC"/>
  <text class="tableField" x="148" y="309">email</text>
  <line x1="130" y1="318" x2="400" y2="318" stroke="#D7E2EC"/>
  <text class="tableField" x="148" y="339">risk fields</text>
</g>
<g id="device">
  <rect x="520" y="160" width="270" height="146" rx="8" fill="#FFF4D9" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="520" y="160" width="270" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="520" y1="208" x2="790" y2="208" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="655" y="191" text-anchor="middle">Device</text>
  <line x1="520" y1="208" x2="790" y2="208" stroke="#D7E2EC"/>
  <text class="tableField" x="538" y="229">deviceId</text>
  <line x1="520" y1="238" x2="790" y2="238" stroke="#D7E2EC"/>
  <text class="tableField" x="538" y="259">fingerprint</text>
</g>
<g id="ip">
  <rect x="520" y="360" width="270" height="146" rx="8" fill="#EAF8EF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="520" y="360" width="270" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="520" y1="408" x2="790" y2="408" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="655" y="391" text-anchor="middle">IpAddress</text>
  <line x1="520" y1="408" x2="790" y2="408" stroke="#D7E2EC"/>
  <text class="tableField" x="538" y="429">address</text>
  <line x1="520" y1="438" x2="790" y2="438" stroke="#D7E2EC"/>
  <text class="tableField" x="538" y="459">network</text>
</g>
<g id="phone">
  <rect x="910" y="160" width="270" height="116" rx="8" fill="#F3ECFF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="910" y="160" width="270" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="910" y1="208" x2="1180" y2="208" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="1045" y="191" text-anchor="middle">PhoneNumber</text>
  <line x1="910" y1="208" x2="1180" y2="208" stroke="#D7E2EC"/>
  <text class="tableField" x="928" y="229">phoneHash</text>
</g>
<g id="payment">
  <rect x="910" y="360" width="270" height="146" rx="8" fill="#FFF0E8" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="910" y="360" width="270" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="910" y1="408" x2="1180" y2="408" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="1045" y="391" text-anchor="middle">PaymentMethod</text>
  <line x1="910" y1="408" x2="1180" y2="408" stroke="#D7E2EC"/>
  <text class="tableField" x="928" y="429">paymentToken</text>
  <line x1="910" y1="438" x2="1180" y2="438" stroke="#D7E2EC"/>
  <text class="tableField" x="928" y="459">provider</text>
</g>
<g id="referral">
  <rect x="1300" y="260" width="270" height="116" rx="8" fill="#E9F7F5" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="1300" y="260" width="270" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="1300" y1="308" x2="1570" y2="308" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="1435" y="291" text-anchor="middle">User</text>
  <line x1="1300" y1="308" x2="1570" y2="308" stroke="#D7E2EC"/>
  <text class="tableField" x="1318" y="329">referrer user</text>
</g>
<rect x="88" y="764" width="1624" height="62" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="900" y="789" text-anchor="middle">The graph stores hashes and safe tokens, not raw phone numbers or card data.</text>
<text class="footer" x="900" y="813" text-anchor="middle">The same identifier vertex can point back to multiple users, which is the cluster signal.</text>
</svg>
