<rect x="300" y="524" width="280.2" height="22" rx="11" class="bar-go"/>
<rect x="300" y="556" width="266.3" height="22" rx="11" class="bar-kotlin"/>
<text x="590.2342136678501" y="540" class="value">215.60</text>
<text x="576.286104808456" y="572" class="value">175.86</text>
