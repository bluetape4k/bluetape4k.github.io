<rect x="1048" y="644" width="280.3" height="22" rx="11" class="bar-go"/>
<rect x="1048" y="676" width="280.3" height="22" rx="11" class="bar-kotlin"/>
<text x="1338.3294092429921" y="660" class="value">215.90</text>
<text x="1338.300864466649" y="692" class="value">215.81</text>
<text x="846" y="854" class="scale">막대 길이는 로그 척도이며 값 표시는 실제 ns/id입니다.</text>
  <rect x="64" y="930" width="1472" height="88" rx="18" fill="#122B3D" stroke="#5EEAD4" stroke-width="1.5"/>
  <circle cx="94" cy="974" r="8" fill="#FBBF24"/>
  <text x="116" y="980" class="note">단일 스레드와 동시 실행의 우위가 달라 보편적인 언어 순위로 해석할 수 없습니다.</text>
</svg>