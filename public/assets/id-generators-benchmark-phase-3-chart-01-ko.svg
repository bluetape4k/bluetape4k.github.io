<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">전역 고유 ID 생성기 · 3차 벤치마크</title>
  <desc id="desc">Go와 Kotlin의 ID 생성 지연 시간을 단일 스레드와 동시 실행 조건으로 비교한 벤치마크 차트</desc>
  <style>
    .canvas{fill:#07111F}.frame{fill:#10243A;stroke:#29445F;stroke-width:2}
    .panel{fill:#0D1B2D;stroke:#29445F;stroke-width:2}
    .title{font:700 42px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
    .subtitle{font:500 20px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
    .panel-title{font:700 25px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
    .unit,.scale,.legend,.note{font:500 16px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
    .row-label{font:600 18px "goorm Sans Code","goorm Sans",monospace;fill:#E6F2FF}
    .value{font:700 15px "goorm Sans Code","goorm Sans",monospace;fill:#E6F2FF;dominant-baseline:middle}
    .bar-go{fill:#36C5F0}.bar-kotlin{fill:#B794F4}
  </style>
  <rect width="1600" height="1100" class="canvas"/>
  <rect x="32" y="32" width="1536" height="1036" rx="32" class="frame"/>
  <text x="80" y="98" class="title">전역 고유 ID 생성기 · 3차 벤치마크</text>
  <text x="80" y="136" class="subtitle">최적화된 Go와 Kotlin 후보 3 · ns/id, 낮을수록 좋음</text>
  <g class="legend">
    <rect x="1260" y="158" width="22" height="16" rx="8" class="bar-go"/>
    <text x="1292" y="171">Go</text>
    <rect x="1400" y="158" width="22" height="16" rx="8" class="bar-kotlin"/>
    <text x="1432" y="171">Kotlin</text>
  </g>
  <rect x="64" y="200" width="724" height="690" rx="24" class="panel"/>
<text x="98" y="250" class="panel-title">단일 스레드</text>
<text x="754" y="250" text-anchor="end" class="unit">ns/id ↓</text>
<text x="98" y="304" class="row-label">Snowflake*</text>
<rect x="300" y="284" width="82.4" height="22" rx="11" class="bar-go"/>
<rect x="300" y="316" width="288.7" height="22" rx="11" class="bar-kotlin"/>
<text x="392.3678047684917" y="300" class="value">11.98</text>
<text x="598.7114795839822" y="332" class="value">244.02</text>
<text x="98" y="424" class="row-label">ULID monotonic</text>
<rect x="300" y="404" width="198.1" height="22" rx="11" class="bar-go"/>
<rect x="300" y="436" width="136.1" height="22" rx="11" class="bar-kotlin"/>
<text x="508.10419188599707" y="420" class="value">64.96</text>
<text x="446.1490571264594" y="452" class="value">26.28</text>
