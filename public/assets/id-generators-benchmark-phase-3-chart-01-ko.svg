<rect x="300" y="676" width="262.8" height="22" rx="11" class="bar-kotlin"/>
<text x="552.0885977632395" y="660" class="value">123.50</text>
<text x="572.7757196404079" y="692" class="value">167.07</text>
<text x="98" y="854" class="scale">막대 길이는 로그 척도이며 값 표시는 실제 ns/id입니다.</text>
