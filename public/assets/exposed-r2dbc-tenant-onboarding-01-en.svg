<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1700" viewBox="0 0 2400 1700" role="img" aria-labelledby="title desc">
  <title id="title">New tenant preparation, publication, and restart recovery</title>
  <desc id="desc">An operator, onboarding API, tenant provisioner, persistent metadata, PostgreSQL schema resource, and runtime registry show reservation, preparation, probing, activation, runtime publication, cleanup, and restart recovery.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset=".58" stop-color="#0c1730"/><stop offset="1" stop-color="#10142a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity=".52"/></filter>
    <marker id="arrow-blue" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L18 9 L0 18 Z" fill="#66a8cf"/></marker>
    <marker id="arrow-green" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L18 9 L0 18 Z" fill="#8db475"/></marker>
    <marker id="arrow-amber" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L18 9 L0 18 Z" fill="#d2a15e"/></marker>
    <marker id="arrow-red" markerWidth="28" markerHeight="28" refX="18" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L18 9 L0 18 Z" fill="#c97976"/></marker>
    <style>
      .title{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:52px;font-weight:700;fill:#f8fafc}.subtitle{font-family:'goorm Sans Code','Comic Mono',monospace;font-size:19px;fill:#a9b8d4}.frame{fill:none;stroke:#2b4168;stroke-width:2.5}.lane{fill:#0f1b31;fill-opacity:.72;stroke:#344e75;stroke-width:2}.laneTitle{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:21px;font-weight:700;fill:#b7c8e1}.card{fill:#162740;stroke:#6685aa;stroke-width:2.5;filter:url(#shadow)}.blue{stroke:#66a8cf}.green{stroke:#8db475}.amber{stroke:#d2a15e}.teal{stroke:#59b0aa}.eyebrow{font-family:'goorm Sans Code','Comic Mono',monospace;font-size:15px;font-weight:700;letter-spacing:1px;fill:#8ea4c3}.cardTitle{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:25px;font-weight:700;fill:#f8fafc}.cardBody{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:17px;fill:#b9c7db}.lifeline{stroke:#7d93a8;stroke-width:3;stroke-dasharray:14 12}.activation{fill:#20394d;stroke:#8db475;stroke-width:2}.connector{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.request{stroke:#66a8cf}.state{stroke:#8db475}.metadata{stroke:#d2a15e;stroke-dasharray:14 11}.cleanup{stroke:#c97976;stroke-dasharray:12 10}.pill{fill:#101b30;stroke-width:1.8}.pillText{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:16px;font-weight:700}.badge{fill:#17293e;stroke-width:2}.badgeText{font-family:'goorm Sans Code','Comic Mono',monospace;font-size:15px;font-weight:700}.alt{fill:none;stroke:#c97976;stroke-width:2.5;stroke-dasharray:12 9}.altHead{font-family:'goorm Sans Code','Comic Mono',monospace;font-size:17px;font-weight:700;fill:#e9a4a1}.note{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:18px;fill:#b9c7db}.noteStrong{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:20px;font-weight:700;fill:#f1d6a7}
    </style>
  </defs>
  <rect width="2400" height="1700" rx="34" fill="url(#canvas)"/><rect class="frame" x="28" y="28" width="2344" height="1644" rx="30"/>
  <text class="title" x="1200" y="86" text-anchor="middle">A new tenant enters routing only after it is ready</text><text class="subtitle" x="1200" y="124" text-anchor="middle">The connectors mark responsibility boundaries for reservation, resource preparation, runtime publication, failure cleanup, and restart recovery.</text>
  <rect class="lane" x="70" y="166" width="2260" height="1210" rx="26"/><text class="laneTitle" x="108" y="210">Tenant onboarding and recovery</text><text class="subtitle" x="2290" y="210" text-anchor="end">metadata state · pool lifecycle · runtime routing registry</text>
  <g id="operator"><rect class="card blue" x="85" y="270" width="300" height="150" rx="22"/><text class="eyebrow" x="115" y="308">OPERATOR</text><text class="cardTitle" x="115" y="350">Operator</text><text class="cardBody" x="115" y="388">New tenant request</text></g>
  <g id="api"><rect class="card blue" x="465" y="270" width="320" height="150" rx="22"/><text class="eyebrow" x="495" y="308">ADMIN API</text><text class="cardTitle" x="495" y="350">Onboarding API</text><text class="cardBody" x="495" y="388">Request shape · administrator authorization</text></g>
  <g id="provisioner"><rect class="card amber" x="865" y="270" width="360" height="150" rx="22"/><text class="eyebrow" x="895" y="308">APPLICATION SERVICE</text><text class="cardTitle" x="895" y="350">Tenant Provisioner</text><text class="cardBody" x="895" y="388">Coordinate preparation and publication</text></g>
  <g id="metadata"><rect class="card green" x="1305" y="270" width="330" height="150" rx="22"/><text class="eyebrow" x="1335" y="308">PERSISTENT METADATA</text><text class="cardTitle" x="1335" y="350">tenant Lifecycle</text><text class="cardBody" x="1335" y="388">PROVISIONING · ACTIVE · FAILED</text></g>
  <g id="database"><rect class="card teal" x="1715" y="270" width="300" height="150" rx="22"/><text class="eyebrow" x="1745" y="308">TENANT RESOURCE</text><text class="cardTitle" x="1745" y="350">PostgreSQL Schema</text><text class="cardBody" x="1745" y="388">Readiness marker · probe</text></g>
  <g id="runtime"><rect class="card green" x="2095" y="270" width="235" height="150" rx="22"/><text class="eyebrow" x="2120" y="308">RUNTIME</text><text class="cardTitle" x="2120" y="350">Registry</text><text class="cardBody" x="2120" y="388">Publish for routing</text></g>
  <path class="lifeline" d="M235 420 V1320"/><path class="lifeline" d="M625 420 V1320"/><path class="lifeline" d="M1045 420 V1320"/><path class="lifeline" d="M1470 420 V1320"/><path class="lifeline" d="M1865 420 V1320"/><path class="lifeline" d="M2212 420 V1320"/>
  <rect class="activation" x="1033" y="505" width="24" height="595" rx="12"/><rect class="activation" x="1853" y="760" width="24" height="300" rx="12"/><rect class="activation" x="2200" y="960" width="24" height="132" rx="12"/>
  <g data-from="operator" data-to="api"><path data-connector="operator-to-api" class="connector request" d="M235 520 H625" marker-end="url(#arrow-blue)"/><rect class="pill" x="437" y="454" width="125" height="40" rx="20" stroke="#66a8cf"/><circle class="badge" cx="461" cy="474" r="16" stroke="#66a8cf"/><text class="badgeText" x="461" y="480" text-anchor="middle" fill="#a8d6ee">1</text><text class="pillText" x="491" y="480" fill="#a8d6ee">Create request</text></g>
  <g data-from="api" data-to="provisioner"><path data-connector="api-to-provisioner" class="connector request" d="M625 620 H1033" marker-end="url(#arrow-blue)"/><rect class="pill" x="735" y="554" width="195" height="40" rx="20" stroke="#66a8cf"/><circle class="badge" cx="759" cy="574" r="16" stroke="#66a8cf"/><text class="badgeText" x="759" y="580" text-anchor="middle" fill="#a8d6ee">2</text><text class="pillText" x="789" y="580" fill="#a8d6ee">onboard(request)</text></g>
  <g data-from="provisioner" data-to="metadata"><path data-connector="reserve-metadata" class="connector metadata" d="M1045 730 H1470" marker-end="url(#arrow-amber)"/><rect class="pill" x="1140" y="664" width="246" height="40" rx="20" stroke="#d2a15e"/><circle class="badge" cx="1164" cy="684" r="16" stroke="#d2a15e"/><text class="badgeText" x="1164" y="690" text-anchor="middle" fill="#f1d6a7">3</text><text class="pillText" x="1194" y="690" fill="#f1d6a7">claim → PROVISIONING + lease</text></g>
  <g data-from="provisioner" data-to="database"><path data-connector="prepare-resource" class="connector state" d="M1045 845 H1853" marker-end="url(#arrow-green)"/><rect class="pill" x="1320" y="779" width="270" height="40" rx="20" stroke="#8db475"/><circle class="badge" cx="1344" cy="799" r="16" stroke="#8db475"/><text class="badgeText" x="1344" y="805" text-anchor="middle" fill="#c9dda8">4</text><text class="pillText" x="1374" y="805" fill="#c9dda8">Create schema · probe readiness marker</text></g>
  <g data-from="provisioner" data-to="metadata"><path data-connector="mark-active" class="connector state" d="M1045 990 H1470" marker-end="url(#arrow-green)"/><rect class="pill" x="1160" y="924" width="210" height="40" rx="20" stroke="#8db475"/><circle class="badge" cx="1184" cy="944" r="16" stroke="#8db475"/><text class="badgeText" x="1184" y="950" text-anchor="middle" fill="#c9dda8">5</text><text class="pillText" x="1214" y="950" fill="#c9dda8">markActive → ACTIVE</text></g>
  <g data-from="provisioner" data-to="runtime"><path data-connector="publish-runtime" class="connector state" d="M1045 1080 H2200" marker-end="url(#arrow-green)"/><rect class="pill" x="1530" y="1014" width="210" height="40" rx="20" stroke="#8db475"/><circle class="badge" cx="1554" cy="1034" r="16" stroke="#8db475"/><text class="badgeText" x="1554" y="1040" text-anchor="middle" fill="#c9dda8">6</text><text class="pillText" x="1584" y="1040" fill="#c9dda8">Publish runtime registry</text></g>
  <rect class="alt" x="840" y="1150" width="1200" height="200" rx="20"/><text class="altHead" x="870" y="1181">alt · preparation failure or cancellation in this process</text><path class="connector cleanup" d="M1045 1250 H1470" marker-end="url(#arrow-red)"/><path class="connector cleanup" d="M1045 1310 H1853" marker-end="url(#arrow-red)"/><rect class="pill" x="1168" y="1198" width="470" height="36" rx="18" stroke="#c97976"/><text class="pillText" x="1403" y="1222" text-anchor="middle" fill="#e9a4a1">Record FAILED · remove registry entry · close acquired resources</text>
  <rect class="lane" x="180" y="1400" width="2040" height="160" rx="22"/><text class="altHead" x="220" y="1442">Restart recovery</text><path class="connector metadata" d="M1470 1510 H1033" marker-end="url(#arrow-amber)"/><rect class="pill" x="800" y="1449" width="740" height="36" rx="18" stroke="#d2a15e"/><text class="pillText" x="1170" y="1473" text-anchor="middle" fill="#f1d6a7">Expired PROVISIONING → FAILED · publish ACTIVE only after restore/probe</text><text class="note" x="1510" y="1540">A probe-failed ACTIVE becomes FAILED; the next claim() reserves a new attempt.</text>
  <rect x="220" y="1590" width="1960" height="58" rx="22" fill="#1d2939" stroke="#d2a15e" stroke-width="2"/><text class="noteStrong" x="1200" y="1628" text-anchor="middle">Regular requests see only the ready runtime registry; provisioning tenants are never routing targets.</text>
</svg>
