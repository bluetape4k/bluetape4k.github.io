<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">javers-exposed-ddd CQRS flow</title>
  <desc id="desc">CQRS flow diagram replacing README Mermaid with source SVG and PNG assets.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/></marker>
    <style>
      .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:42px;fill:#F8FAFC;font-weight:400}
      .subtitle,.detail{font-family:"Comic Mono";font-size:15px;fill:#CBD5E1;font-weight:400}
      .label{font-family:"Architects Daughter";font-size:24px;fill:#F8FAFC;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}.edge{fill:none;stroke:#60A5FA;stroke-width:2.4;marker-end:url(#arrow)}
      .line-event{fill:none;stroke:#D9AA4D;stroke-width:2.4;marker-end:url(#arrow)}.line-query{fill:none;stroke:#8A72D6;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="canvas" width="1400" height="560"/>
  <rect class="frame" x="34" y="28" width="1332" height="504" rx="28"/>
  <text class="title" x="72" y="84">javers-exposed-ddd CQRS flow</text>
  <text class="subtitle" x="76" y="116">Command writes to SQL snapshots, Kafka events, and the Redis projection.</text>
  <g transform="translate(88,252)">
    <rect class="card" x="0" y="0" width="200" height="86" rx="14" fill="#14532D" stroke="#69B888"/>
    <text class="label" x="100" y="38" text-anchor="middle">Command side</text>
    <text class="detail" x="100" y="62" text-anchor="middle">OrderCommandHandler</text>
  </g>
  <g transform="translate(390,150)">
    <path class="card" d="M0 14 C0 4 240 4 240 14 L240 74 C240 88 0 88 0 74 Z" fill="#0F172A" stroke="#DB7890"/>
    <path d="M0 14 C0 26 240 26 240 14" fill="none" stroke="#DB7890" stroke-width="2"/>
    <text class="label" x="120" y="43" text-anchor="middle">Exposed order table</text>
    <text class="detail" x="120" y="66" text-anchor="middle">source of truth</text>
  </g>
  <g transform="translate(390,282)">
    <path class="card" d="M0 14 C0 4 240 4 240 14 L240 74 C240 88 0 88 0 74 Z" fill="#0F172A" stroke="#F07AA8"/>
    <path d="M0 14 C0 26 240 26 240 14" fill="none" stroke="#F07AA8" stroke-width="2"/>
    <text class="label" x="120" y="43" text-anchor="middle">JaVers snapshots</text>
    <text class="detail" x="120" y="66" text-anchor="middle">audit history</text>
  </g>
  <g transform="translate(390,414)">
    <rect class="card" x="0" y="0" width="240" height="88" rx="14" fill="#78350F" stroke="#D9AA4D"/>
    <text class="label" x="120" y="39" text-anchor="middle">Kafka order events</text>
    <text class="detail" x="120" y="63" text-anchor="middle">domain event stream</text>
  </g>
  <g transform="translate(748,414)">
    <rect class="card" x="0" y="0" width="240" height="88" rx="14" fill="#134E4A" stroke="#45A7A1"/>
    <text class="label" x="120" y="39" text-anchor="middle">Projection consumer</text>
    <text class="detail" x="120" y="63" text-anchor="middle">poll and apply</text>
  </g>
  <g transform="translate(1080,282)">
    <path class="card" d="M0 14 C0 4 230 4 230 14 L230 74 C230 88 0 88 0 74 Z" fill="#0F172A" stroke="#45A7A1"/>
    <path d="M0 14 C0 26 230 26 230 14" fill="none" stroke="#45A7A1" stroke-width="2"/>
    <text class="label" x="115" y="43" text-anchor="middle">Redis read model</text>
    <text class="detail" x="115" y="66" text-anchor="middle">OrderSummary</text>
  </g>
  <g transform="translate(748,150)">
    <rect class="card" x="0" y="0" width="240" height="88" rx="14" fill="#4C1D95" stroke="#8A72D6"/>
    <text class="label" x="120" y="39" text-anchor="middle">Read API</text>
    <text class="detail" x="120" y="63" text-anchor="middle">OrderQueryService</text>
  </g>
  <path class="edge" d="M188 252 V204 Q188 194 198 194 H390"/>
  <path class="edge" d="M288 295 H390"/>
  <path class="edge line-event" d="M188 338 V448 Q188 458 198 458 H390"/>
  <path class="edge line-event" d="M630 458 H748"/>
  <path class="edge line-event" d="M988 458 H1025 Q1035 458 1035 448 V360 Q1035 350 1045 350 H1068"/>
  <path class="edge line-query" d="M988 194 H1025 Q1035 194 1035 204 V316 Q1035 326 1045 326 H1068"/>
</svg>
