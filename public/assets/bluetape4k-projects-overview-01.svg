  <path class="edge" d="M640 429 V459"/>
  <path class="edge" d="M860 514 H1015"/>
  <path class="edge" d="M510 569 V598 Q510 610 498 610 H267 Q255 610 255 622 V650"/>
  <path class="edge" d="M770 569 V598 Q770 610 782 610 H963 Q975 610 975 622 V650"/>

  <g>
