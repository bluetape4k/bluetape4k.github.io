<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="840" viewBox="0 0 1420 840" role="img" aria-labelledby="root-readme-overview-01-title root-readme-overview-01-desc">
  <title id="root-readme-overview-01-title">Bluetape4k Projects Overview</title>
  <desc id="root-readme-overview-01-desc">The developer platform flows from BOM through foundation and runtime adapters, then supports split repositories, applications, and backend services.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 14 14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#758297"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans";font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue";font-size:16px;fill:#536476;font-weight:400}
      .platform{fill:#EFF6FF;stroke:#93B4E8;stroke-width:2;stroke-dasharray:8 7}
      .platformTitle{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans";font-size:20px;fill:#315B96;font-weight:400}
      .platformMeta{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue";font-size:13px;fill:#536476;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .cardTitle{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans";font-size:28px;fill:#22344A;font-weight:400}
      .body{font-family:"Comic Mono","Comic Sans MS","Comic Sans","Comic Neue";font-size:16px;fill:#34465B;font-weight:400}
      .edge{stroke:#758297;stroke-width:2.5;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="canvas" width="1420" height="840"/>
  <rect class="frame" x="32" y="28" width="1356" height="784" rx="26"/>
  <text class="title" x="66" y="82">Bluetape4k Projects Overview</text>
  <text class="subtitle" x="70" y="116">Shared Kotlin/JVM foundations, runtime adapters, and the services that build on them</text>

  <rect class="platform" x="330" y="142" width="620" height="448" rx="24"/>
  <text class="platformTitle" x="356" y="172">DEVELOPER PLATFORM</text>
  <text class="platformMeta" x="356" y="195">Java 21 / Kotlin 2.3 / Spring Boot 4.x / Ktor 3.x</text>

