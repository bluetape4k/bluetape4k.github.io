<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">서비스 텍스트 처리 경계와 품질 검증 흐름</title>
  <desc id="desc">HTTP 본문 제한에서 서비스 입력 검증, 정규화와 라우팅, 텍스트 분석, 서비스 판단과 품질 게이트로 이어지는 다섯 단계 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#60A5FA"/>
    </marker>
  </defs>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0D1B2D;stroke:#38506A;stroke-width:2}
    .card{fill:#10243A;stroke:#38506A;stroke-width:2}
    .title{font:700 42px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
    .subtitle{font:500 20px "goorm Sans Code","goorm Sans",monospace;fill:#A9BDD1}
    .step{font:800 16px "goorm Sans Code","goorm Sans",monospace;fill:#07111F}
    .card-title{font:700 24px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
    .body{font:500 17px "goorm Sans Code","goorm Sans",monospace;fill:#A9BDD1}
    .connector{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round}
    .note-title{font:700 20px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
    .note{font:500 16px "goorm Sans Code","goorm Sans",monospace;fill:#A9BDD1}
  </style>
  <rect width="1600" height="900" class="canvas"/>
  <rect x="32" y="32" width="1536" height="836" rx="32" class="frame"/>
  <text x="70" y="104" class="title">서비스 텍스트 처리 경계와 품질 검증 흐름</text>
  <text x="70" y="146" class="subtitle">저비용 경계 검증을 먼저 수행하고, 필요한 분석만 실행한 뒤 결과를 재현 가능한 테스트로 보호한다</text>
  <rect x="70" y="192" width="1460" height="400" rx="28" fill="#0A1727" stroke="#38506A" stroke-width="2"/>
  <path d="M 330 398 H 360" class="connector" marker-end="url(#arrow)"/>
<path d="M 630 398 H 660" class="connector" marker-end="url(#arrow)"/>
<path d="M 930 398 H 960" class="connector" marker-end="url(#arrow)"/>
<path d="M 1230 398 H 1260" class="connector" marker-end="url(#arrow)"/>
  <g data-card="1">
        <rect x="70" y="248" width="260" height="300" rx="24" class="card"/>
        <circle cx="104" cy="282" r="17" fill="#60A5FA"/>
        <text x="104" y="289" text-anchor="middle" class="step">1</text>
        <text x="94" y="344" class="card-title">전송 경계</text>
        <rect x="94" y="370" width="70" height="4" rx="2" fill="#60A5FA"/>
        <text x="94" y="422" class="body"><tspan x="94" dy="0">HTTP 본문 크기 제한</tspan><tspan x="94" dy="36">문자열 생성 전 차단</tspan></text>
      </g>
<g data-card="2">
        <rect x="370" y="248" width="260" height="300" rx="24" class="card"/>
        <circle cx="404" cy="282" r="17" fill="#36C5F0"/>
        <text x="404" y="289" text-anchor="middle" class="step">2</text>
        <text x="394" y="344" class="card-title">서비스 입력 검증</text>
        <rect x="394" y="370" width="70" height="4" rx="2" fill="#36C5F0"/>
        <text x="394" y="422" class="body"><tspan x="394" dy="0">문자 수와 공백 확인</tspan><tspan x="394" dy="36">원문을 오류에 포함하지 않음</tspan></text>
      </g>
<g data-card="3">
        <rect x="670" y="248" width="260" height="300" rx="24" class="card"/>
        <circle cx="704" cy="282" r="17" fill="#5EEAD4"/>
        <text x="704" y="289" text-anchor="middle" class="step">3</text>
        <text x="694" y="344" class="card-title">정규화·라우팅</text>
        <rect x="694" y="370" width="70" height="4" rx="2" fill="#5EEAD4"/>
        <text x="694" y="422" class="body"><tspan x="694" dy="0">표기 정규화</tspan><tspan x="694" dy="36">언어 감지와 처리 경로 선택</tspan></text>
      </g>
<g data-card="4">
        <rect x="970" y="248" width="260" height="300" rx="24" class="card"/>
        <circle cx="1004" cy="282" r="17" fill="#B794F4"/>
        <text x="1004" y="289" text-anchor="middle" class="step">4</text>
        <text x="994" y="344" class="card-title">텍스트 분석</text>
        <rect x="994" y="370" width="70" height="4" rx="2" fill="#B794F4"/>
        <text x="994" y="422" class="body"><tspan x="994" dy="0">한국어·일본어 토큰화</tspan><tspan x="994" dy="36">Aho-Corasick 다중 검색</tspan></text>
      </g>
<g data-card="5">
        <rect x="1270" y="248" width="260" height="300" rx="24" class="card"/>
        <circle cx="1304" cy="282" r="17" fill="#FBBF24"/>
        <text x="1304" y="289" text-anchor="middle" class="step">5</text>
        <text x="1294" y="344" class="card-title">판단·품질 게이트</text>
        <rect x="1294" y="370" width="70" height="4" rx="2" fill="#FBBF24"/>
        <text x="1294" y="422" class="body"><tspan x="1294" dy="0">필터링·색인·라우팅</tspan><tspan x="1294" dy="36">결정적 픽스처로 회귀 검증</tspan></text>
      </g>
  <g>
    <rect x="70" y="628" width="710" height="174" rx="22" fill="#0A1727" stroke="#36C5F0" stroke-width="2"/>
    <circle cx="104" cy="670" r="8" fill="#36C5F0"/>
    <text x="126" y="678" class="note-title">입력 메모리 경계</text>
    <text x="104" y="728" class="note"><tspan x="104" dy="0">`String` 길이 검사는 이미 만들어진 문자열을 보호한다.</tspan><tspan x="104" dy="30">HTTP 본문 제한은 그보다 앞선 전송 계층에 둔다.</tspan></text>
  </g>
  <g>
    <rect x="820" y="628" width="710" height="174" rx="22" fill="#0A1727" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="854" cy="670" r="8" fill="#FBBF24"/>
    <text x="876" y="678" class="note-title">품질 주장 경계</text>
    <text x="854" y="728" class="note"><tspan x="854" dy="0">품질 게이트는 저장소의 대표 동작을 고정한다.</tspan><tspan x="854" dy="30">대규모 외부 말뭉치의 통계적 정확도를 보장하지 않는다.</tspan></text>
  </g>
</svg>