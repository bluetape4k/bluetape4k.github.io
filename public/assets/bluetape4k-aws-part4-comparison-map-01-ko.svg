<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-label="Spring Cloud AWS와 bluetape4k AWS comparison map">
  <defs>
    <style>
      .title{font-family:'goorm Sans',cursive;font-size:34px;fill:#102033}
      .subtitle,.body,.small{font-family:'goorm Sans Code',monospace;fill:#334155}
      .subtitle{font-size:15px}.label{font-family:'goorm Sans',cursive;font-size:22px;fill:#102033}
      .body{font-size:14px}.small{font-size:12px}
      .panel{fill:#fff;stroke:#d7e2ef;stroke-width:1.4;rx:18}.card{stroke-width:1.6;rx:16}
      .arrow{fill:none;stroke:#475569;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:8 7;stroke-linecap:round;marker-end:url(#arrowMuted)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1160" height="760" fill="#ffffff"/>
  <text class="title" x="54" y="70">Ownership boundary로 비교하기</text>
  <text class="subtitle" x="56" y="104">둘 다 AWS SDK v2 위에 있지만 framework wiring, coroutine helper, runtime shape의 소유자가 다릅니다.</text>
  <rect class="panel" x="54" y="136" width="1052" height="552"/>

  <rect class="card" x="108" y="176" width="410" height="142" fill="#dcfce7" stroke="#22c55e"/>
  <text class="label" x="313" y="214" text-anchor="middle">Spring Cloud AWS</text>
  <text class="body" x="313" y="246" text-anchor="middle">Spring Boot starter, template, listener</text>
  <text class="body" x="313" y="270" text-anchor="middle">S3, SQS, SNS, SES, DynamoDB, config</text>
  <text class="body" x="313" y="294" text-anchor="middle">Spring Integration과 Cloud Stream extension</text>

  <rect class="card" x="642" y="176" width="410" height="142" fill="#e0f2fe" stroke="#38bdf8"/>
  <text class="label" x="847" y="214" text-anchor="middle">bluetape4k-aws</text>
  <text class="body" x="847" y="246" text-anchor="middle">Java v2와 Kotlin SDK 위의 Kotlin-first helper</text>
  <text class="body" x="847" y="270" text-anchor="middle">Spring Boot 4 adapter 또는 Ktor 3 adapter</text>
  <text class="body" x="847" y="294" text-anchor="middle">CRT, TransferManager, coroutine operation</text>

  <rect class="card" x="108" y="386" width="410" height="132" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="label" x="313" y="424" text-anchor="middle">Spring-first 적합성</text>
  <text class="body" x="313" y="456" text-anchor="middle">Spring이 application wiring을 소유할 때</text>
  <text class="body" x="313" y="480" text-anchor="middle">그리고 팀 규약이 이미 Spring Cloud에 맞을 때</text>

  <rect class="card" x="642" y="386" width="410" height="132" fill="#ecfeff" stroke="#06b6d4"/>
  <text class="label" x="847" y="424" text-anchor="middle">Kotlin/JVM 적합성</text>
  <text class="body" x="847" y="456" text-anchor="middle">coroutine, Ktor, 명시적 SDK client,</text>
  <text class="body" x="847" y="480" text-anchor="middle">또는 CRT-backed S3 transfer가 설계 제약일 때</text>

  <rect class="card" x="244" y="578" width="672" height="74" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="label" x="580" y="608" text-anchor="middle">공유 AWS 책임</text>
  <text class="body" x="580" y="634" text-anchor="middle">IAM, retry, idempotency, provisioning, observability, local emulator gap은 application decision으로 남습니다.</text>

  <polyline class="arrow" points="313,318 313,386"/>
  <polyline class="arrow" points="847,318 847,386"/>
  <polyline class="arrow" points="313,518 313,552 520,552 520,578"/>
  <polyline class="arrow" points="847,518 847,552 640,552 640,578"/>
  <polyline class="dash" points="518,247 642,247"/>
  <text class="small" x="580" y="236" text-anchor="middle">같은 AWS SDK family</text>
  <path class="connector" d="M2 2 L3 2" fill="none" stroke="transparent"/>
</svg>