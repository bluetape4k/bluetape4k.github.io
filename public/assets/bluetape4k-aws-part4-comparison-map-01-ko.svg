<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-label="Spring Cloud AWS와 bluetape4k AWS 비교">
  <defs>
    <style>
      .title{font-family:'goorm Sans',cursive;font-size:34px;fill:#f8fafc}
      .subtitle,.body,.small{font-family:'goorm Sans Code',monospace;fill:#cbd5e1}
      .subtitle{font-size:15px}.label{font-family:'goorm Sans',cursive;font-size:22px;fill:#f8fafc}
      .body{font-size:14px}.small{font-size:12px}
      .panel{fill:#111827;stroke:#334155;stroke-width:1.4;rx:18}.card{stroke-width:1.6;rx:16}
      .arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:8 7;stroke-linecap:round;marker-end:url(#arrowMuted)}
    </style>
    <marker id="arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#94a3b8"/></marker>
    <marker id="arrowMuted" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1160" height="760" fill="#0b1220"/>
  <text class="title" x="54" y="70">통합 책임의 소유권으로 비교하기</text>
  <text class="subtitle" x="56" y="104">둘 다 AWS SDK v2를 사용하지만 프레임워크 구성, 코루틴 도우미, 런타임의 소유권은 다릅니다.</text>
  <rect class="panel" x="54" y="136" width="1052" height="552"/>

  <rect class="card" x="108" y="176" width="410" height="142" fill="#163a2d" stroke="#4ade80"/>
  <text class="label" x="313" y="214" text-anchor="middle">Spring Cloud AWS</text>
  <text class="body" x="313" y="246" text-anchor="middle">Spring Boot 스타터, 템플릿, 리스너</text>
  <text class="body" x="313" y="270" text-anchor="middle">S3, SQS, SNS, SES, DynamoDB 설정</text>
  <text class="body" x="313" y="294" text-anchor="middle">Spring Integration과 Cloud Stream 확장</text>

  <rect class="card" x="642" y="176" width="410" height="142" fill="#12344a" stroke="#38bdf8"/>
  <text class="label" x="847" y="214" text-anchor="middle">bluetape4k-aws</text>
  <text class="body" x="847" y="246" text-anchor="middle">Java v2와 Kotlin SDK를 위한 Kotlin 우선 도우미</text>
  <text class="body" x="847" y="270" text-anchor="middle">Spring Boot 4 또는 Ktor 3 어댑터</text>
  <text class="body" x="847" y="294" text-anchor="middle">CRT, TransferManager, 코루틴 작업</text>

  <rect class="card" x="108" y="386" width="410" height="132" fill="#18392d" stroke="#34d399"/>
  <text class="label" x="313" y="424" text-anchor="middle">Spring 우선 환경</text>
  <text class="body" x="313" y="456" text-anchor="middle">Spring이 애플리케이션 구성을 소유하고</text>
  <text class="body" x="313" y="480" text-anchor="middle">팀 규약이 이미 Spring Cloud에 맞을 때</text>

  <rect class="card" x="642" y="386" width="410" height="132" fill="#123a43" stroke="#22d3ee"/>
  <text class="label" x="847" y="424" text-anchor="middle">Kotlin/JVM 적합성</text>
  <text class="body" x="847" y="456" text-anchor="middle">코루틴, Ktor, 명시적 SDK 클라이언트,</text>
  <text class="body" x="847" y="480" text-anchor="middle">CRT 기반 S3 전송이 설계 제약일 때</text>

  <rect class="card" x="244" y="578" width="672" height="74" fill="#453511" stroke="#fbbf24"/>
  <text class="label" x="580" y="608" text-anchor="middle">공통으로 남는 AWS 책임</text>
  <text class="body" x="580" y="634" text-anchor="middle">IAM, 재시도, 멱등성, 프로비저닝, 관측성, 로컬 에뮬레이터 차이는 애플리케이션이 결정합니다.</text>

  <polyline class="arrow" points="313,318 313,386"/>
  <polyline class="arrow" points="847,318 847,386"/>
  <polyline class="arrow" points="313,518 313,552 520,552 520,578"/>
  <polyline class="arrow" points="847,518 847,552 640,552 640,578"/>
  <polyline class="dash" points="518,247 642,247"/>
  <text class="small" x="580" y="236" text-anchor="middle">같은 AWS SDK 계열</text>
  <path class="connector" d="M2 2 L3 2" fill="none" stroke="transparent"/>
</svg>