<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="980" viewBox="0 0 1580 980" role="img" aria-labelledby="title desc">
<title id="title">Near Cache 읽기와 무효화 흐름</title>
<desc id="desc">L1 hit은 JVM 안에서 끝나고, miss·write·invalidation만 Redis L2와 조율합니다.</desc>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/></filter>

  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#60a5fa"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#86efac"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#fbbf24"/></marker>
  <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#f87171"/></marker>
  <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#c4b5fd"/></marker>
  <marker id="arrow-cyan" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#67e8f9"/></marker>
  <style>
    .title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:44px;font-weight:700;fill:#f8fafc}
    .subtitle{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:18px;fill:#cbd5e1}
    .lane-title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-body{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:16px;fill:#cbd5e1}
    .small{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:14px;fill:#94a3b8}
    .code{font-family:"goorm Sans Code","goorm Sans","Apple SD Gothic Neo",monospace;font-size:15px;fill:#cbd5e1}
    .panel{fill:#111827;stroke:#334155;stroke-width:2}
    .card{filter:url(#shadow);stroke-width:2}

    .connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    .line-blue{stroke:#60a5fa;marker-end:url(#arrow-blue)}
    .line-green{stroke:#86efac;marker-end:url(#arrow-green)}
    .line-amber{stroke:#fbbf24;marker-end:url(#arrow-amber)}
    .line-red{stroke:#f87171;marker-end:url(#arrow-red)}
    .line-purple{stroke:#c4b5fd;marker-end:url(#arrow-purple)}
    .line-cyan{stroke:#67e8f9;marker-end:url(#arrow-cyan)}
    .dash-blue{stroke:#60a5fa;stroke-dasharray:10 9;marker-end:url(#arrow-blue)}
    .dash-green{stroke:#86efac;stroke-dasharray:10 9;marker-end:url(#arrow-green)}
    .label-bg{fill:#0f172a;stroke:#475569;stroke-width:1.5}
  </style>
</defs>
<rect width="1580" height="980" fill="#0b1220"/>
<rect x="34" y="30" width="1512" height="920" rx="28" class="panel"/>
<text x="70" y="86" class="title">Near Cache 읽기와 무효화 흐름</text>
<text x="72" y="122" class="subtitle">L1 hit은 JVM 안에서 끝나고, miss·write·invalidation만 Redis L2와 조율합니다.</text>
<g>
  <rect x="82" y="370" width="236" height="118" rx="18" fill="#172554" stroke="#60a5fa" class="card"/>
  <text x="200" y="412" text-anchor="middle" dominant-baseline="middle" class="card-title">애플리케이션</text>
<text x="200" y="446" text-anchor="middle" dominant-baseline="middle" class="card-body">repository / service</text>
</g>
<g>
  <rect x="430" y="270" width="300" height="130" rx="18" fill="#14351f" stroke="#86efac" class="card"/>
  <text x="580" y="307" text-anchor="middle" dominant-baseline="middle" class="small">L1 Front Cache</text>
<text x="580" y="341" text-anchor="middle" dominant-baseline="middle" class="card-body">JVM 안 Caffeine</text>
<text x="580" y="363" text-anchor="middle" dominant-baseline="middle" class="card-body">hot read 경로</text>
</g>
<g>
  <rect x="840" y="270" width="300" height="130" rx="18" fill="#3b1217" stroke="#f87171" class="card"/>
  <text x="990" y="307" text-anchor="middle" dominant-baseline="middle" class="small">Redis L2</text>
<text x="990" y="341" text-anchor="middle" dominant-baseline="middle" class="card-body">공유 상태</text>
<text x="990" y="363" text-anchor="middle" dominant-baseline="middle" class="card-body">TTL · eviction</text>
</g>
<g>
  <rect x="1236" y="198" width="250" height="118" rx="18" fill="#12333b" stroke="#67e8f9" class="card"/>
  <text x="1361" y="229" text-anchor="middle" dominant-baseline="middle" class="small">RESP3 Tracking</text>
<text x="1361" y="263" text-anchor="middle" dominant-baseline="middle" class="card-body">서버 push</text>
<text x="1361" y="285" text-anchor="middle" dominant-baseline="middle" class="card-body">key invalidation</text>
</g>
<g>
  <rect x="1236" y="504" width="250" height="118" rx="18" fill="#3b2a08" stroke="#fbbf24" class="card"/>
  <text x="1361" y="535" text-anchor="middle" dominant-baseline="middle" class="small">Pub/Sub Topic</text>
<text x="1361" y="569" text-anchor="middle" dominant-baseline="middle" class="card-body">client 관리</text>
<text x="1361" y="591" text-anchor="middle" dominant-baseline="middle" class="card-body">broadcast invalidation</text>
</g>
<g>
  <rect x="462" y="638" width="238" height="96" rx="18" fill="#261943" stroke="#c4b5fd" class="card"/>
  <text x="581" y="669" text-anchor="middle" dominant-baseline="middle" class="card-title">Local 통계</text>
<text x="581" y="703" text-anchor="middle" dominant-baseline="middle" class="card-body">hit · miss · invalidated</text>
</g>
<path class="connector line-blue" d="M318 428 H430"/><rect class="label-bg" x="345" y="390" width="58" height="30" rx="15"/><text class="small" x="374" y="409" text-anchor="middle">get</text>
<path class="connector line-green" d="M430 354 H318"/><rect class="label-bg" x="338" y="317" width="72" height="30" rx="15"/><text class="small" x="374" y="336" text-anchor="middle">L1 hit</text>
<path class="connector line-blue" d="M730 328 H840"/><rect class="label-bg" x="735" y="290" width="100" height="30" rx="15"/><text class="small" x="785" y="309" text-anchor="middle">miss load</text>
<path class="connector line-green" d="M840 372 H730"/><rect class="label-bg" x="758" y="375" width="54" height="30" rx="15"/><text class="small" x="785" y="394" text-anchor="middle">fill</text>
<path class="connector line-amber" d="M202 488 V820 Q202 840 222 840 H990 Q1010 840 1010 820 V400"/><rect class="label-bg" x="547" y="801" width="126" height="30" rx="15"/><text class="small" x="610" y="820" text-anchor="middle">write-through</text>
<path class="connector line-cyan" d="M1140 326 H1236"/><rect class="label-bg" x="1136" y="288" width="104" height="30" rx="15"/><text class="small" x="1188" y="307" text-anchor="middle">변경 key</text>
<path class="connector dash-green" d="M1236 258 H730"/><rect class="label-bg" x="930" y="221" width="104" height="30" rx="15"/><text class="small" x="982" y="240" text-anchor="middle">invalidate</text>
<path class="connector line-amber" d="M1140 372 H1184 Q1204 372 1204 392 V544 Q1204 564 1224 564 H1236"/><rect class="label-bg" x="1165" y="441" width="78" height="30" rx="15"/><text class="small" x="1204" y="460" text-anchor="middle">publish</text>
<path class="connector dash-blue" d="M1486 563 H1530 Q1550 563 1550 543 V170 Q1550 150 1530 150 H620 Q600 150 600 170 V270"/><rect class="label-bg" x="934" y="113" width="104" height="30" rx="15"/><text class="small" x="986" y="132" text-anchor="middle">invalidate</text>
<path class="connector line-purple" d="M580 400 V638"/><rect class="label-bg" x="589" y="503" width="74" height="30" rx="15"/><text class="small" x="626" y="522" text-anchor="middle">record</text>
<text x="790" y="886" text-anchor="middle" class="small">선택 기준: read-heavy hot key에는 L1 hit ratio, write-heavy 데이터에는 무효화 비용과 stale 허용 범위를 먼저 봅니다.</text>
</svg>
