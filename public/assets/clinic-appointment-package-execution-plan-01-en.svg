<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc" data-locale="en">
<title id="title">Freeze a Selected Package Contract into a Plan Revision</title><desc id="desc">Validate choices and exact component versions without creating visit times.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#111932"/></linearGradient>
 <marker id="blueArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0 0 L14 7 L0 14 Z" fill="#60a5fa" data-solid-head="true"/></marker>
<marker id="greenArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0 0 L14 7 L0 14 Z" fill="#2dd4bf" data-solid-head="true"/></marker>
<marker id="amberArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0 0 L14 7 L0 14 Z" fill="#fbbf24" data-solid-head="true"/></marker>
<marker id="redArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0 0 L14 7 L0 14 Z" fill="#fb7185" data-solid-head="true"/></marker>
 <style>
 .title{font-family:"Architects Daughter",cursive;font-size:37px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"Comic Mono",monospace;font-size:18px;fill:#aebed2}.card{fill:#11233e;stroke-width:3}.card.blue{stroke:#60a5fa}.card.green{stroke:#2dd4bf;fill:#10333b}.card.amber{stroke:#fbbf24;fill:#312818}.card.red{stroke:#fb7185;fill:#341b2b}.card-title{font-family:"Architects Daughter",cursive;font-size:21px;font-weight:700;fill:#f8fafc}.card-title.compact{font-family:"Comic Mono",monospace;font-size:15px}.body,.label,.note{font-family:"Comic Mono",monospace;fill:#d7e3f3}.body{font-size:16px}.note{font-size:15px;fill:#aebed2}.route{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.blue-line{stroke:#60a5fa;marker-end:url(#blueArrow)}.green-line{stroke:#2dd4bf;marker-end:url(#greenArrow)}.amber-line{stroke:#fbbf24;marker-end:url(#amberArrow)}.red-line{stroke:#fb7185;marker-end:url(#redArrow)}.lifeline{stroke:#526783;stroke-width:2;stroke-dasharray:8 10}.activation{fill:#17314e;stroke:#7091ab;stroke-width:2}.pill{fill:#0d1a2e;stroke-width:2}.label{font-size:15px}.frame{fill:none;stroke:#526783;stroke-width:2;stroke-dasharray:9 8}.badge{font-family:"Comic Mono",monospace;font-size:15px;font-weight:700}
 </style>
</defs><rect width="1440" height="940" fill="url(#bg)"/><rect x="28" y="26" width="1384" height="888" rx="30" fill="none" stroke="#2b4168" stroke-width="2"/>
<text class="title" x="64" y="78">Freeze a Selected Package Contract into a Plan Revision</text><text class="subtitle" x="66" y="112">Validate choices and exact component versions without creating visit times.</text>
 <g class="node-card"><rect id="contract" x="55" y="280" width="320" height="230" rx="22" class="card blue"/><text class="card-title" x="215" y="325" text-anchor="middle">Patient A Execution Contract</text><text class="body" x="215" y="362" text-anchor="middle">skin diagnosis v2: required</text>
<text class="body" x="215" y="386" text-anchor="middle">laser toning v8: selected</text>
<text class="body" x="215" y="410" text-anchor="middle">soothing mask v4: selected</text></g>
 <g class="node-card"><rect id="limits" x="465" y="170" width="390" height="90" rx="22" class="card blue"/><text class="card-title compact" x="660" y="215" text-anchor="middle">quantity and total size</text></g><g class="node-card"><rect id="selection" x="465" y="296" width="390" height="90" rx="22" class="card blue"/><text class="card-title compact" x="660" y="341" text-anchor="middle">exact selection count</text></g><g class="node-card"><rect id="provenance" x="465" y="422" width="390" height="90" rx="22" class="card blue"/><text class="card-title compact" x="660" y="467" text-anchor="middle">treatment provenance</text></g><g class="node-card"><rect id="relations" x="465" y="548" width="390" height="90" rx="22" class="card blue"/><text class="card-title compact" x="660" y="593" text-anchor="middle">relation references</text></g><g class="node-card"><rect id="acyclic" x="465" y="674" width="390" height="90" rx="22" class="card green"/><text class="card-title compact" x="660" y="719" text-anchor="middle">dependency acyclicity</text></g>
 <g class="node-card"><rect id="revision" x="950" y="210" width="390" height="210" rx="22" class="card green"/><text class="card-title" x="1145" y="255" text-anchor="middle">New Plan Revision</text><text class="body" x="1145" y="292" text-anchor="middle">PlannedTreatment</text>
<text class="body" x="1145" y="316" text-anchor="middle">ExecutionDependency</text>
<text class="body" x="1145" y="340" text-anchor="middle">VisitGroupingConstraint</text></g>
 <g class="node-card"><rect id="grouping" x="950" y="480" width="390" height="170" rx="22" class="card amber"/><text class="card-title compact" x="1145" y="525" text-anchor="middle">Grouping Is a Separate Axis</text><text class="body" x="1145" y="562" text-anchor="middle">MAY_SAME_VISIT: permitted</text>
<text class="body" x="1145" y="586" text-anchor="middle">MUST_SEPARATE_VISIT: separate</text></g>
 <g class="node-card"><rect id="boundary" x="950" y="710" width="390" height="150" rx="22" class="card red"/><text class="card-title" x="1145" y="755" text-anchor="middle">Terminal Boundary</text><text class="body" x="1145" y="792" text-anchor="middle">does not create visit candidates</text>
<text class="body" x="1145" y="816" text-anchor="middle">does not confirm appointments</text></g>
 <path class="route blue-line" data-source-node="contract" data-target-node="limits" d="M375 395 H410 Q435 395 435 370 V240 Q435 215 465 215"/>
 <path class="route blue-line" data-source-node="limits" data-target-node="selection" d="M660 260 V296"/><path class="route blue-line" data-source-node="selection" data-target-node="provenance" d="M660 386 V422"/><path class="route blue-line" data-source-node="provenance" data-target-node="relations" d="M660 512 V548"/><path class="route blue-line" data-source-node="relations" data-target-node="acyclic" d="M660 638 V674"/>
 <path class="route green-line" data-source-node="acyclic" data-target-node="revision" d="M855 719 H895 Q920 719 920 694 V340 Q920 315 950 315"/>
 <path class="route amber-line" data-source-node="revision" data-target-node="grouping" d="M1145 420 V480"/>
 <path class="route red-line" data-source-node="grouping" data-target-node="boundary" d="M1145 650 V710"/>
 <text class="note" x="65" y="825">The scenario comes from the approved design; validation behavior comes from the current planner and tests.</text></svg>
