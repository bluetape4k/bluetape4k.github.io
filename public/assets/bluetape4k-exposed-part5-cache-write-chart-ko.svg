<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img">
<title>캐시 쓰기의 완료 경계</title>
<desc>2026-07-27 벤치마크입니다. 완료 경계가 같은 연산끼리만 비교해야 합니다.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.42"/></filter>
  <style>
    .bg{fill:#0B1220}.frame{fill:#0F1E33;stroke:#284766;stroke-width:2}
    .title{font-family:"goorm Sans";font-size:42px;fill:#F5F9FF;font-weight:700}
    .subtitle,.body,.small,.tiny,.axisLabel{font-family:"goorm Sans Code","goorm Sans";fill:#D7E3F5}
    .subtitle{font-size:16px}.body{font-size:14px}.small{font-size:12px;fill:#B8C7DD}.tiny{font-size:11px;fill:#B8C7DD}
    .label{font-family:"goorm Sans";font-size:23px;fill:#F5F9FF;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}
    .axis{stroke:#55718F;stroke-width:1.4}.grid{stroke:#2F4B67;stroke-width:1;stroke-dasharray:4 6}
  </style>
</defs>
<rect class="bg" width="1280" height="680"/>
<rect class="frame" x="34" y="28" width="1212" height="624" rx="26"/>
<text class="title" x="70" y="82">캐시 쓰기의 완료 경계</text>
<text class="subtitle" x="72" y="114">2026-07-27 벤치마크입니다. 완료 경계가 같은 연산끼리만 비교해야 합니다.</text>
<g>
  <line class="axis" x1="360" y1="410" x2="1140" y2="410"/>
  <line class="grid" x1="360" y1="156" x2="360" y2="410"/>
  <line class="grid" x1="750" y1="156" x2="750" y2="410"/>
  <line class="grid" x1="1140" y1="156" x2="1140" y2="410"/>
  <text class="body" x="92" y="184" dominant-baseline="middle">Write-Behind 요청 수락</text>
<rect x="360" y="166" width="780" height="36" rx="10" fill="#16263A" stroke="#2D4968"/>
<rect class="card" x="360" y="166" width="729.0816" height="36" rx="10" fill="#DB7890" stroke="#DB7890"/>
<text class="body" x="1103.0816" y="184" dominant-baseline="middle">3,552 ops/s</text>
<text class="body" x="92" y="262" dominant-baseline="middle">Write-Through DB 반영</text>
<rect x="360" y="244" width="780" height="36" rx="10" fill="#16263A" stroke="#2D4968"/>
<rect class="card" x="360" y="244" width="622.8347210526316" height="36" rx="10" fill="#A993FF" stroke="#A993FF"/>
<text class="body" x="996.8347210526316" y="262" dominant-baseline="middle">3,034 ops/s</text>
<text class="body" x="92" y="340" dominant-baseline="middle">Write-Behind 큐 비우기</text>
<rect x="360" y="322" width="780" height="36" rx="10" fill="#16263A" stroke="#2D4968"/>
<rect class="card" x="360" y="322" width="20" height="36" rx="10" fill="#69B888" stroke="#69B888"/>
<text class="body" x="394" y="340" dominant-baseline="middle">0.988 ops/s</text>
  <text class="tiny" x="360" y="436" text-anchor="middle">0</text>
