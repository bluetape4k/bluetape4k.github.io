<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">OCR 합성 예제 문서</title>
  <desc id="desc">OCR 요청과 응답 예제를 설명하기 위한 합성 문서 이미지입니다.</desc>
  <defs>
    <filter id="paper-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#020617" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #0b1220; }
      .paper { fill: #111c2e; stroke: #42566e; stroke-width: 3; filter: url(#paper-shadow); }
      .title { font: 800 54px 'goorm Sans Code'; fill: #f1f5f9; letter-spacing: 0; }
      .subtitle { font: 700 30px 'goorm Sans Code'; fill: #d7e1ee; letter-spacing: 0; }
      .mono { font: 26px 'goorm Sans Code'; fill: #c2cede; letter-spacing: 0; }
      .stamp { fill: #12363a; stroke: #2dd4bf; stroke-width: 3; }
      .stamp-text { font: 800 28px 'goorm Sans Code'; fill: #5eead4; letter-spacing: 0; }
      .line { stroke: #42566e; stroke-width: 3; stroke-linecap: round; }
      .code { fill: #0b1220; stroke: #33475f; stroke-width: 2; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <rect class="paper" x="170" y="70" width="860" height="620" rx="28"/>
  <text class="title" x="250" y="175">BLUETAPE OCR</text>
  <rect class="stamp" x="760" y="122" width="190" height="64" rx="16"/>
  <text class="stamp-text" x="794" y="164">샘플</text>
  <line class="line" x1="250" y1="220" x2="950" y2="220"/>
  <text class="subtitle" x="250" y="292">요청: ocr-sample-request</text>
  <text class="mono" x="250" y="350">1행: 이미지 업로드</text>
  <text class="mono" x="250" y="402">2행: 네이티브 OCR 검증</text>
  <text class="mono" x="250" y="454">3행: 대체 응답 안전 반환</text>
  <rect class="code" x="250" y="510" width="700" height="108" rx="18"/>
  <text class="mono" x="286" y="560">status = COMPLETED</text>
  <text class="mono" x="286" y="602">language = eng</text>
</svg>
