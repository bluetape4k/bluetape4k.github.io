    .ui-eyebrow,.ui-label,.ui-mono,.ui-button{font-family:"goorm Sans Code", "goorm Sans", monospace}
    .ui-title,.ui-section,.ui-card-title,.ui-value{font-family:"goorm Sans", "Apple SD Gothic Neo", sans-serif;font-weight:800;fill:#f4f8ff}
    .ui-eyebrow{font-size:12px;font-weight:800;fill:#7fc9ff}
    .ui-title{font-size:34px}.ui-section{font-size:21px}.ui-card-title{font-size:23px}
    .ui-label{font-size:13px;fill:#dce8f5}.ui-mono{font-size:12px;fill:#a9bad0}.ui-value{font-size:34px}.ui-button{font-size:13px;font-weight:800;fill:#dce8f5}
    .muted{font-family:"goorm Sans Code", "goorm Sans", monospace;font-size:12px;fill:#8299b2}.divider{stroke:#263d59;stroke-width:1}
