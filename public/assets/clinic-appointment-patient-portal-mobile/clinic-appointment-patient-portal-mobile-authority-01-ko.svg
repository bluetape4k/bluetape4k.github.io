<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1240" viewBox="0 0 1860 1240" role="img" aria-labelledby="title desc" data-locale="ko">
<title id="title">환자 채널은 예약 사실을 보여 주고, 예약 서비스가 결정한다</title><desc id="desc">포털·알림·모바일 채널의 화면 상태와 예약 서비스의 기준 데이터 원본을 분리합니다.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#111c32"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091321"/><stop offset="1" stop-color="#101b2e"/></linearGradient>

  <marker id="portal-blue-arrow" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x">
