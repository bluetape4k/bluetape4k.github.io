    .decision-body{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:12px;fill:#d2c4f4}
    .outcome{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:11px;font-weight:800;fill:#f8fbff}
