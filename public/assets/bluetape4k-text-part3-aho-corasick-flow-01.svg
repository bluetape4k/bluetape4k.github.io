<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Aho-Corasick build and search path</title>
  <desc id="desc">Keyword dictionaries are compiled into an immutable automaton, then request text is scanned once and routed to masking, alerts, or highlighting.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#132238" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2878d9" stroke="#2878d9" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#15956b" stroke="#15956b" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas { fill: #f8fbff; }
      .band-build { fill: #eaf3ff; stroke: #9ac4f8; stroke-width: 2; }
      .band-request { fill: #ebfbf5; stroke: #91d9bf; stroke-width: 2; }
      .card { filter: url(#shadow); stroke-width: 2; rx: 22; }
      .build-card { fill: #ffffff; stroke: #7eb6f2; }
      .request-card { fill: #ffffff; stroke: #6ecba9; }
      .result-card { fill: #fffaf0; stroke: #e6b96f; }
      .title { font-family: "Architects Daughter", "Comic Mono", ui-sans-serif, system-ui, sans-serif; font-size: 28px; fill: #102033; font-weight: 700; }
      .label { font-family: "Comic Mono", ui-monospace, monospace; font-size: 20px; fill: #102033; font-weight: 700; }
      .body { font-family: "Comic Mono", ui-monospace, monospace; font-size: 16px; fill: #334155; }
      .tag { font-family: "Comic Mono", ui-monospace, monospace; font-size: 15px; fill: #0f3d66; font-weight: 700; }
      .connector-blue { fill: none; stroke: #2878d9; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .connector-green { fill: none; stroke: #15956b; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .note { font-family: "Comic Mono", ui-monospace, monospace; font-size: 17px; fill: #475569; }
    </style>
  </defs>

  <rect class="canvas" x="0" y="0" width="1440" height="760"/>

  <text class="title" x="72" y="70">Aho-Corasick: build once, scan once</text>

  <rect class="band-build" x="56" y="108" width="1328" height="244" rx="30"/>
  <text class="tag" x="90" y="146">BUILD / RELOAD TIME</text>

  <rect class="band-request" x="56" y="398" width="1328" height="266" rx="30"/>
  <text class="tag" x="90" y="436">REQUEST TIME</text>

  <g>
    <rect class="card build-card" x="96" y="176" width="300" height="122" rx="22"/>
    <text class="label" x="126" y="218">Keyword dictionary</text>
    <text class="body" x="126" y="250">abuse words</text>
    <text class="body" x="126" y="276">risk phrases</text>
  </g>

  <g>
    <rect class="card build-card" x="570" y="176" width="300" height="122" rx="22"/>
    <text class="label" x="600" y="218">Build automaton</text>
    <text class="body" x="600" y="250">trie nodes</text>
    <text class="body" x="600" y="276">failure transitions</text>
  </g>

  <g>
    <rect class="card build-card" x="1044" y="176" width="300" height="122" rx="22"/>
    <text class="label" x="1074" y="218">Immutable matcher</text>
    <text class="body" x="1074" y="250">thread-safe reuse</text>
    <text class="body" x="1074" y="276">shared by requests</text>
  </g>

  <path class="connector-blue" d="M 398 237 L 548 237"/>
  <path class="connector-blue" d="M 872 237 L 1022 237"/>

  <g>
    <rect class="card request-card" x="96" y="482" width="260" height="118" rx="22"/>
    <text class="label" x="126" y="522">User text</text>
    <text class="body" x="126" y="554">validate length</text>
    <text class="body" x="126" y="580">no raw echo</text>
  </g>

  <g>
    <rect class="card request-card" x="466" y="482" width="260" height="118" rx="22"/>
    <text class="label" x="496" y="522">Scan once</text>
    <text class="body" x="496" y="554">parseText</text>
    <text class="body" x="496" y="580">containsMatch</text>
  </g>

  <g>
    <rect class="card result-card" x="836" y="482" width="260" height="118" rx="22"/>
    <text class="label" x="866" y="522">Matches</text>
    <text class="body" x="866" y="554">start/end</text>
    <text class="body" x="866" y="580">keyword + value</text>
  </g>

  <g>
    <rect class="card result-card" x="1188" y="454" width="156" height="174" rx="22"/>
    <text class="label" x="1214" y="496">Decide</text>
    <text class="body" x="1214" y="530">mask</text>
    <text class="body" x="1214" y="560">alert</text>
    <text class="body" x="1214" y="590">highlight</text>
  </g>

  <path class="connector-green" d="M 358 541 L 444 541"/>
  <path class="connector-green" d="M 728 541 L 814 541"/>
  <path class="connector-green" d="M 1098 541 L 1166 541"/>

  <path class="connector-blue" d="M 1194 300 L 1194 460" marker-end="url(#arrow-blue)"/>

  <text class="note" x="94" y="706">Use containsMatch for existence, parseText for positions, replaceAll for masking, and Flow + take(1) for alert-style collection.</text>
</svg>
