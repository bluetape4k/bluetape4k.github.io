<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img">
<title>Exposed 실행 모델</title>
<desc>작업 특성, 드라이버 경로, 스트리밍 요구에 따라 JDBC + 가상 스레드 또는 R2DBC + 코루틴을 고릅니다.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.42"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#78AFFF"/></marker>
  <style>
    .bg{fill:#0B1220}.frame{fill:#0F1E33;stroke:#284766;stroke-width:2}
    .title{font-family:"goorm Sans";font-size:42px;fill:#F5F9FF;font-weight:700}
    .subtitle,.body,.small,.tiny,.axisLabel{font-family:"goorm Sans Code","goorm Sans";fill:#D7E3F5}
    .subtitle{font-size:16px}.body{font-size:14px}.small{font-size:12px;fill:#B8C7DD}.tiny{font-size:11px;fill:#B8C7DD}
    .label{font-family:"goorm Sans";font-size:23px;fill:#F5F9FF;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.line{fill:none;stroke:#78AFFF;stroke-width:3.2;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .axis{stroke:#55718F;stroke-width:1.4}.grid{stroke:#2F4B67;stroke-width:1;stroke-dasharray:4 6}
  </style>
</defs>
<rect class="bg" width="1500" height="760"/>
<rect class="frame" x="34" y="28" width="1432" height="704" rx="26"/>
<text class="title" x="70" y="82">Exposed 실행 모델</text>
<text class="subtitle" x="72" y="114">작업 특성, 드라이버 경로, 스트리밍 요구에 따라 JDBC + 가상 스레드 또는 R2DBC + 코루틴을 고릅니다.</text>
<g transform="translate(80 172)">
  <g>
  <rect class="card" x="0" y="228" width="236" height="116" rx="16" fill="#1E293B" stroke="#94A3B8"/>
  <text class="label" x="118" y="268" text-anchor="middle" dominant-baseline="middle">요청</text>
  <text class="body" x="118" y="298" text-anchor="middle">MVC · WebFlux · Ktor</text>
</g>
  <g>
  <rect class="card" x="330" y="68" width="278" height="128" rx="16" fill="#173D27" stroke="#4BDB85"/>
  <text class="label" x="469" y="114" text-anchor="middle" dominant-baseline="middle">JDBC + 가상 스레드</text>
  <text class="body" x="469" y="144" text-anchor="middle">성숙한 드라이버 경로</text>
<text class="body" x="469" y="164" text-anchor="middle">단순한 스택 추적</text>
</g>
  <g>
  <rect class="card" x="330" y="388" width="278" height="128" rx="16" fill="#2D2359" stroke="#A993FF"/>
  <text class="label" x="469" y="434" text-anchor="middle" dominant-baseline="middle">R2DBC + 코루틴</text>
  <text class="body" x="469" y="464" text-anchor="middle">suspend · Flow</text>
<text class="body" x="469" y="484" text-anchor="middle">배압 경로</text>
</g>
  <g>
  <rect class="card" x="740" y="68" width="270" height="128" rx="16" fill="#4B3212" stroke="#F0B84D"/>
  <text class="label" x="875" y="114" text-anchor="middle" dominant-baseline="middle">배치 / CRUD</text>
  <text class="body" x="875" y="144" text-anchor="middle">왕복 비용 측정</text>
<text class="body" x="875" y="164" text-anchor="middle">풀과 인덱스가 중요</text>
</g>
  <g>
  <rect class="card" x="740" y="388" width="270" height="128" rx="16" fill="#123F3C" stroke="#35D0C5"/>
  <text class="label" x="875" y="434" text-anchor="middle" dominant-baseline="middle">스트리밍 / 리액티브</text>
  <text class="body" x="875" y="464" text-anchor="middle">row 흐름</text>
<text class="body" x="875" y="484" text-anchor="middle">이벤트 루프 친화</text>
</g>
  <g>
  <rect class="card" x="1120" y="228" width="236" height="116" rx="16" fill="#163761" stroke="#5EA0FF"/>
  <text class="label" x="1238" y="268" text-anchor="middle" dominant-baseline="middle">선택</text>
  <text class="body" x="1238" y="298" text-anchor="middle">작업 특성 우선</text>
<text class="body" x="1238" y="318" text-anchor="middle">벤치마크로 검증</text>
</g>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M236 270 H278 Q288 270 288 260 V142 Q288 132 298 132 H330"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M236 302 H278 Q288 302 288 312 V442 Q288 452 298 452 H330"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M608 132 H740"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M608 452 H740"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M1010 132 H1054 Q1064 132 1064 142 V276 Q1064 286 1074 286 H1120"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M1010 452 H1054 Q1064 452 1064 442 V324 Q1064 314 1074 314 H1120"/>
</g></svg>