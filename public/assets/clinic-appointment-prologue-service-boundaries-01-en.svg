<svg xmlns="http://www.w3.org/2000/svg" width="2020" height="1200" viewBox="0 0 2020 1200" role="img" aria-labelledby="title desc">
  <title id="title">Source-of-record and responsibility boundaries</title>
  <desc id="desc">Product, commerce, clinical, and CRM sources of record provide facts to the appointment service. The appointment service owns plans, commitments, capacity, policy snapshots, history, and objective events, while notification and statistics consumers read those facts without owning the appointment source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <linearGradient id="sourceDataFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#162b45"/><stop offset="1" stop-color="#202049"/></linearGradient>
    <linearGradient id="appointmentFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b4a"/><stop offset="1" stop-color="#192b4d"/></linearGradient>
    <linearGradient id="consumerFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#292147"/><stop offset="1" stop-color="#192d4a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.58"/></filter>
    <marker id="inputArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#67e8f9" data-solid-head="true"/></marker>
    <marker id="eventArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-size="10x10" data-tip-direction="positive-x"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#c084fc" data-solid-head="true"/></marker>
    <marker id="boundaryArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-size="10x10" data-tip-direction="positive-x"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#fbbf24" data-solid-head="true"/></marker>
    <style>
      .title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:38px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:17px;fill:#aebed2}.section{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:22px;font-weight:700;fill:#f8fafc}.card-title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:21px;font-weight:700;fill:#f8fafc}.body{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:14px;fill:#d7e3f3}.small{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:12px;fill:#aebed2}.code{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:13px;font-weight:700;fill:#f8fafc}.pill{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:12px;font-weight:700;fill:#f8fafc}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:4}.input-line{stroke:#67e8f9;marker-end:url(#inputArrow)}.event-line{stroke:#c084fc;stroke-dasharray:10 8;marker-end:url(#eventArrow)}.boundary-line{stroke:#fbbf24;stroke-dasharray:6 8;marker-end:url(#boundaryArrow)}
    </style>
  </defs>
  <rect width="2020" height="1200" fill="url(#bg)"/><rect width="2020" height="1200" rx="34" fill="url(#bg)"/><rect x="28" y="28" width="1964" height="1144" rx="30" fill="none" stroke="#263a5e" stroke-width="2"/>
  <circle cx="1860" cy="140" r="230" fill="#7c3aed" opacity=".08"/><circle cx="160" cy="1050" r="250" fill="#0891b2" opacity=".07"/>
  <text class="title" x="70" y="78">Source-of-record and responsibility boundaries</text><text class="subtitle" x="72" y="116">Sources of record provide facts; the appointment service preserves visit commitments and schedule truth.</text>
  <g transform="translate(1400 58)"><rect x="0" y="0" width="20" height="20" rx="6" fill="none" stroke="#67e8f9" stroke-width="3"/><text class="small" x="30" y="16">Source-of-record input</text><rect x="205" y="0" width="20" height="20" rx="6" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="6 4"/><text class="small" x="235" y="16">Objective event</text><rect x="405" y="0" width="20" height="20" rx="6" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5 5"/><text class="small" x="435" y="16">Outside responsibility</text></g>

  <text class="section" x="80" y="166">Source-of-record services</text><text class="section" x="730" y="166">Appointment service boundary</text><text class="section" x="1550" y="166">Consumers / adapters</text>

  <g filter="url(#shadow)">
    <rect x="70" y="198" width="420" height="168" rx="24" fill="url(#sourceDataFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="220" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="239" text-anchor="middle">SOURCE DATA</text><text class="card-title" x="94" y="278"><tspan x="94" dy="0">Product management /</tspan><tspan x="94" dy="25">development</tspan></text><text class="body" x="94" y="326">Source of record: catalog / BOM / version</text><text class="small" x="94" y="350">Responsibility: projection / snapshot</text>
    <rect x="70" y="408" width="420" height="168" rx="24" fill="url(#sourceDataFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="430" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="449" text-anchor="middle">SOURCE DATA</text><text class="card-title" x="94" y="486"><tspan x="94" dy="0">Commerce /</tspan><tspan x="94" dy="25">purchases</tspan></text><text class="body" x="94" y="534">Source of record: purchase / add-on / refund</text><text class="small" x="94" y="558">Responsibility: purchase-source-qualified event</text>
    <rect x="70" y="618" width="420" height="168" rx="24" fill="url(#sourceDataFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="640" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="659" text-anchor="middle">SOURCE DATA</text><text class="card-title" x="94" y="706">Clinical / treatment</text><text class="body" x="94" y="738">Source of record: start / complete / partial</text><text class="small" x="94" y="764">Responsibility: TreatmentFulfillmentEvent</text>
    <rect x="70" y="828" width="420" height="168" rx="24" fill="url(#sourceDataFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="850" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="869" text-anchor="middle">SOURCE DATA</text><text class="card-title" x="94" y="916">Customer counseling / CRM</text><text class="body" x="94" y="948">Source of record: profile / counseling / complaint</text><text class="small" x="94" y="974">Responsibility: reassessment and counseling</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="700" y="198" width="640" height="798" rx="28" fill="url(#appointmentFill)" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="730" y="224" width="220" height="32" rx="16" fill="#0f766e"/><text class="pill" x="840" y="245" text-anchor="middle">SOURCE OF TRUTH</text><text class="card-title" x="730" y="302">Information owned by scheduling</text><text class="small" x="730" y="330">plans / commitments / capacity / state / history</text>
    <rect x="730" y="366" width="580" height="108" rx="18" fill="#153a4a" stroke="#22d3ee" stroke-width="2"/><text class="code" x="760" y="406">AppointmentPlan</text><text class="body" x="760" y="436">PlannedTreatment / dependency-DAG / catalog snapshot</text><text class="small" x="760" y="460">reproducible obligations per purchase</text>
    <rect x="730" y="498" width="580" height="108" rx="18" fill="#1a3150" stroke="#60a5fa" stroke-width="2"/><text class="code" x="760" y="538"><tspan x="760" dy="0">AppointmentCommitment /</tspan><tspan x="760" dy="20">Appointment</tspan></text><text class="body" x="760" y="578">AppointmentItem / ResourceAllocation / consent</text><text class="small" x="760" y="602">PROPOSED / HELD / CONFIRMED visit promise</text>
    <rect x="730" y="630" width="580" height="108" rx="18" fill="#20264b" stroke="#818cf8" stroke-width="2"/><text class="code" x="760" y="670">Capacity / PolicySnapshot / History</text><text class="body" x="760" y="700">plan revision / capacity ceiling / state history</text><text class="small" x="760" y="724">recalculation cannot overwrite consent</text>
    <rect x="730" y="762" width="580" height="108" rx="18" fill="#292347" stroke="#c084fc" stroke-width="2"/><text class="code" x="760" y="802">Objective events + durable outbox</text><text class="body" x="760" y="832">AppointmentCreated / Rescheduled / StatusChanged</text><text class="small" x="760" y="856">notifications / CRM / statistics consume these facts</text>
    <rect x="730" y="894" width="580" height="76" rx="18" fill="#332817" stroke="#fbbf24" stroke-width="2"/><text class="body" x="760" y="927">Outside scheduling responsibility</text><text class="small" x="760" y="947"><tspan x="760" dy="0">pricing / refund approval / clinical judgment</tspan><tspan x="760" dy="17">counseling / delivery / projection ownership</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1540" y="318" width="410" height="210" rx="24" fill="url(#consumerFill)" stroke="#c084fc" stroke-width="2"/><rect x="1564" y="342" width="142" height="28" rx="14" fill="#581c87"/><text class="pill" x="1635" y="361" text-anchor="middle">CONSUMER</text><text class="card-title" x="1564" y="410">Notification adapter / channel</text><text class="body" x="1564" y="442">Source of record: contact / language / consent</text><text class="small" x="1564" y="474">Responsibility: claim outbox, retry, deliver</text><text class="small" x="1564" y="500">scheduling does not call SMS directly</text>
    <rect x="1540" y="650" width="410" height="210" rx="24" fill="url(#consumerFill)" stroke="#c084fc" stroke-width="2"/><rect x="1564" y="674" width="142" height="28" rx="14" fill="#581c87"/><text class="pill" x="1635" y="693" text-anchor="middle">CONSUMER</text><text class="card-title" x="1564" y="742">Statistics / external projection</text><text class="body" x="1564" y="774">Source of record: read model / SLA metrics</text><text class="small" x="1564" y="806">Responsibility: schema contract / projection</text><text class="small" x="1564" y="832">does not own appointment source state</text>
  </g>

  <g>
    <path class="connector input-line" data-connector="product-input" d="M 490 282 H 620 Q 640 282 640 302 V 318 Q 640 330 660 330 H 700"/><text class="small" x="500" y="268">catalog version</text>
    <path class="connector input-line" data-connector="commerce-input" d="M 490 492 H 620 Q 640 492 640 512 V 518 Q 640 530 660 530 H 700"/><text class="small" x="500" y="478">PurchaseCompleted</text>
    <path class="connector input-line" data-connector="clinical-input" d="M 490 702 H 620 Q 640 702 640 722 V 738 Q 640 750 660 750 H 700"/><text class="small" x="500" y="688">fulfillment fact</text>
    <path class="connector input-line" data-connector="crm-input" d="M 490 900 H 700"/><text class="small" x="500" y="888">reassessment outcome</text>
    <path class="connector event-line" data-connector="notification-output" d="M 1340 810 H 1410 Q 1430 810 1430 790 V 434 Q 1430 422 1450 422 H 1540"/><text class="small" x="1350" y="786">event + outbox</text>
    <path class="connector event-line" data-connector="statistics-output" d="M 1340 842 H 1420 Q 1440 842 1440 822 V 766 Q 1440 754 1460 754 H 1540"/><text class="small" x="1350" y="874">schema event</text>
    <path class="connector event-line" data-connector="crm-output" d="M 700 930 H 490"/><text class="small" x="500" y="950">objective fact</text>
    <path class="connector boundary-line" data-connector="boundary-reminder" d="M 1310 930 H 1510"/><text class="small" x="1380" y="918">not owned</text>
  </g>

  <rect x="70" y="1030" width="1880" height="100" rx="22" fill="#0b1628" stroke="#2b4168" stroke-width="2"/><text class="small" x="98" y="1064">Reading rule</text><text class="body" x="98" y="1092">The source-of-record service decides its source facts; scheduling links only the snapshots and objective events it needs.</text><text class="body" x="98" y="1118">CRM, notification, and statistics consume appointment facts but never become the appointment source of truth.</text>
</svg>
