<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Service authority and responsibility boundaries</title>
  <desc id="desc">Product, commerce, clinical, and CRM authorities provide facts to the appointment service. The appointment service owns plans, commitments, capacity, policy snapshots, history, and objective events, while notification and statistics consumers read those facts without owning the appointment source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <linearGradient id="authorityFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#162b45"/><stop offset="1" stop-color="#202049"/></linearGradient>
    <linearGradient id="appointmentFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b4a"/><stop offset="1" stop-color="#192b4d"/></linearGradient>
    <linearGradient id="consumerFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#292147"/><stop offset="1" stop-color="#192d4a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.58"/></filter>
    <marker id="inputArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#67e8f9" data-solid-head="true"/></marker>
    <marker id="eventArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-size="10x10" data-tip-direction="positive-x"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#c084fc" data-solid-head="true"/></marker>
    <marker id="boundaryArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-size="10x10" data-tip-direction="positive-x"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#fbbf24" data-solid-head="true"/></marker>
    <style>
      .title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:38px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:17px;fill:#aebed2}.section{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:22px;font-weight:700;fill:#f8fafc}.card-title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:21px;font-weight:700;fill:#f8fafc}.body{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:14px;fill:#d7e3f3}.small{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:12px;fill:#aebed2}.code{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:13px;font-weight:700;fill:#f8fafc}.pill{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:12px;font-weight:700;fill:#f8fafc}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:4}.input-line{stroke:#67e8f9;marker-end:url(#inputArrow)}.event-line{stroke:#c084fc;stroke-dasharray:10 8;marker-end:url(#eventArrow)}.boundary-line{stroke:#fbbf24;stroke-dasharray:6 8;marker-end:url(#boundaryArrow)}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="url(#bg)"/><rect width="1800" height="1200" rx="34" fill="url(#bg)"/><rect x="28" y="28" width="1744" height="1144" rx="30" fill="none" stroke="#263a5e" stroke-width="2"/>
  <circle cx="1650" cy="140" r="230" fill="#7c3aed" opacity=".08"/><circle cx="160" cy="1050" r="250" fill="#0891b2" opacity=".07"/>
  <text class="title" x="70" y="78">Service authority and responsibility boundaries</text><text class="subtitle" x="72" y="116">Source authorities provide facts; the appointment service preserves visit commitments and schedule truth.</text>
  <g transform="translate(1110 58)"><rect x="0" y="0" width="20" height="20" rx="6" fill="none" stroke="#67e8f9" stroke-width="3"/><text class="small" x="30" y="16">Input authority</text><rect x="205" y="0" width="20" height="20" rx="6" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="6 4"/><text class="small" x="235" y="16">Objective event</text><rect x="405" y="0" width="20" height="20" rx="6" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5 5"/><text class="small" x="435" y="16">Outside responsibility</text></g>

  <text class="section" x="80" y="166">Source authorities</text><text class="section" x="620" y="166">Appointment service boundary</text><text class="section" x="1330" y="166">Consumers / adapters</text>

  <g filter="url(#shadow)">
    <rect x="70" y="198" width="420" height="168" rx="24" fill="url(#authorityFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="220" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="239" text-anchor="middle">AUTHORITY</text><text class="card-title" x="94" y="278"><tspan x="94" dy="0">Product management /</tspan><tspan x="94" dy="25">development</tspan></text><text class="body" x="94" y="326">Authority: catalog / BOM / version</text><text class="small" x="94" y="350">Responsibility: projection / snapshot</text>
    <rect x="70" y="408" width="420" height="168" rx="24" fill="url(#authorityFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="430" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="449" text-anchor="middle">AUTHORITY</text><text class="card-title" x="94" y="486"><tspan x="94" dy="0">Commerce /</tspan><tspan x="94" dy="25">purchases</tspan></text><text class="body" x="94" y="534">Authority: purchase / add-on / refund</text><text class="small" x="94" y="558">Responsibility: qualified purchase event</text>
    <rect x="70" y="618" width="420" height="168" rx="24" fill="url(#authorityFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="640" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="659" text-anchor="middle">AUTHORITY</text><text class="card-title" x="94" y="706">Clinical / treatment</text><text class="body" x="94" y="738">Authority: start / complete / partial</text><text class="small" x="94" y="764">Responsibility: TreatmentFulfillmentEvent</text>
    <rect x="70" y="828" width="420" height="168" rx="24" fill="url(#authorityFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="850" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="869" text-anchor="middle">AUTHORITY</text><text class="card-title" x="94" y="916">Customer counseling / CRM</text><text class="body" x="94" y="948">Authority: profile / counseling / complaint</text><text class="small" x="94" y="974">Responsibility: reassessment and counseling</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="590" y="198" width="640" height="798" rx="28" fill="url(#appointmentFill)" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="620" y="224" width="220" height="32" rx="16" fill="#0f766e"/><text class="pill" x="730" y="245" text-anchor="middle">SOURCE OF TRUTH</text><text class="card-title" x="620" y="302">Facts owned by scheduling</text><text class="small" x="620" y="330">plans / commitments / capacity / state / history</text>
    <rect x="620" y="366" width="580" height="108" rx="18" fill="#153a4a" stroke="#22d3ee" stroke-width="2"/><text class="code" x="650" y="406">AppointmentPlan</text><text class="body" x="650" y="436">PlannedTreatment / dependency-DAG / catalog snapshot</text><text class="small" x="650" y="460">reproducible obligations per purchase</text>
    <rect x="620" y="498" width="580" height="108" rx="18" fill="#1a3150" stroke="#60a5fa" stroke-width="2"/><text class="code" x="650" y="538"><tspan x="650" dy="0">AppointmentCommitment /</tspan><tspan x="650" dy="20">Appointment</tspan></text><text class="body" x="650" y="578">AppointmentItem / ResourceAllocation / consent</text><text class="small" x="650" y="602">PROPOSED / HELD / CONFIRMED visit promise</text>
    <rect x="620" y="630" width="580" height="108" rx="18" fill="#20264b" stroke="#818cf8" stroke-width="2"/><text class="code" x="650" y="670">Capacity / PolicySnapshot / History</text><text class="body" x="650" y="700">plan revision / capacity ceiling / state history</text><text class="small" x="650" y="724">recalculation cannot overwrite consent</text>
    <rect x="620" y="762" width="580" height="108" rx="18" fill="#292347" stroke="#c084fc" stroke-width="2"/><text class="code" x="650" y="802">Objective events + durable outbox</text><text class="body" x="650" y="832">AppointmentCreated / Rescheduled / StatusChanged</text><text class="small" x="650" y="856">notifications / CRM / statistics consume these facts</text>
    <rect x="620" y="894" width="580" height="76" rx="18" fill="#332817" stroke="#fbbf24" stroke-width="2"/><text class="body" x="650" y="927">Outside scheduling responsibility</text><text class="small" x="650" y="947"><tspan x="650" dy="0">pricing / refund approval / clinical judgment</tspan><tspan x="650" dy="17">counseling / delivery / projection authority</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1320" y="318" width="410" height="210" rx="24" fill="url(#consumerFill)" stroke="#c084fc" stroke-width="2"/><rect x="1344" y="342" width="142" height="28" rx="14" fill="#581c87"/><text class="pill" x="1415" y="361" text-anchor="middle">CONSUMER</text><text class="card-title" x="1344" y="410">Notification adapter / channel</text><text class="body" x="1344" y="442">Authority: contact / language / consent</text><text class="small" x="1344" y="474">Responsibility: claim outbox, retry, deliver</text><text class="small" x="1344" y="500">scheduling does not call SMS directly</text>
    <rect x="1320" y="650" width="410" height="210" rx="24" fill="url(#consumerFill)" stroke="#c084fc" stroke-width="2"/><rect x="1344" y="674" width="142" height="28" rx="14" fill="#581c87"/><text class="pill" x="1415" y="693" text-anchor="middle">CONSUMER</text><text class="card-title" x="1344" y="742">Statistics / external projection</text><text class="body" x="1344" y="774">Authority: read model / SLA metrics</text><text class="small" x="1344" y="806">Responsibility: schema contract / projection</text><text class="small" x="1344" y="832">does not own appointment source state</text>
  </g>

  <g>
    <path class="connector input-line" data-connector="product-input" d="M 490 282 H 536 Q 548 282 548 294 V 318 Q 548 330 560 330 H 590"/><text class="small" x="500" y="268">catalog version</text>
    <path class="connector input-line" data-connector="commerce-input" d="M 490 492 H 536 Q 548 492 548 504 V 518 Q 548 530 560 530 H 590"/><text class="small" x="500" y="478">PurchaseCompleted</text>
    <path class="connector input-line" data-connector="clinical-input" d="M 490 702 H 536 Q 548 702 548 714 V 738 Q 548 750 560 750 H 590"/><text class="small" x="500" y="688">fulfillment fact</text>
    <path class="connector input-line" data-connector="crm-input" d="M 490 900 H 590"/><text class="small" x="500" y="888">reassessment outcome</text>
    <path class="connector event-line" data-connector="notification-output" d="M 1230 810 H 1268 Q 1280 810 1280 798 V 434 Q 1280 422 1292 422 H 1320"/><text class="small" x="1238" y="786">event + outbox</text>
    <path class="connector event-line" data-connector="statistics-output" d="M 1230 842 H 1278 Q 1290 842 1290 830 V 766 Q 1290 754 1302 754 H 1320"/><text class="small" x="1238" y="874">schema event</text>
    <path class="connector event-line" data-connector="crm-output" d="M 590 930 H 490"/><text class="small" x="500" y="950">objective fact</text>
    <path class="connector boundary-line" data-connector="boundary-reminder" d="M 1200 930 H 1280"/><text class="small" x="1220" y="918">not owned</text>
  </g>

  <rect x="70" y="1030" width="1660" height="100" rx="22" fill="#0b1628" stroke="#2b4168" stroke-width="2"/><text class="small" x="98" y="1064">Reading rule</text><text class="body" x="98" y="1092">The authority service decides its source facts; scheduling links only the snapshots and objective events it needs.</text><text class="body" x="98" y="1118">CRM, notification, and statistics consume appointment facts but never become the appointment source of truth.</text>
</svg>
