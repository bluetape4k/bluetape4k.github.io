<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">실행 환경에 따른 테넌트 상태 전달 방식</title><desc id="desc">헤더는 라우팅 입력일 뿐 인증·권한 정책이 아닙니다. korean ≠ english, acme:rw ≠ acme:ro를 실제 데이터로 검증합니다.</desc><defs><marker id="arrow-cyan" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#36C5F0"/></marker><marker id="arrow-mint" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5EEAD4"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FBBF24"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FB7185"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A78BFA"/></marker></defs>
  <style>
  .bg{fill:#07111F}.panel{fill:#0D1B2D;stroke:#36536F;stroke-width:2}.card{fill:#10243A;stroke:#36536F;stroke-width:2}.card2{fill:#132B43;stroke:#36536F;stroke-width:2}
  .title{font:700 42px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}.sub{font:600 19px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}.h{font:700 24px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
  .body{font:600 17px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}.mono{font:700 16px "goorm Sans Code","goorm Sans",monospace;fill:#E6F2FF}.small{font:600 14px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
  .life{stroke:#36536F;stroke-width:2;stroke-dasharray:8 9}.act{fill:#123252;stroke:#36C5F0;stroke-width:2}
  .call{fill:none;stroke:#36C5F0;stroke-width:4;marker-end:url(#arrow-cyan)}.ok{fill:none;stroke:#5EEAD4;stroke-width:4;marker-end:url(#arrow-mint)}
  .warn{fill:none;stroke:#FBBF24;stroke-width:4;marker-end:url(#arrow-amber)}.err{fill:none;stroke:#FB7185;stroke-width:4;marker-end:url(#arrow-red)}
  .violet{fill:none;stroke:#A78BFA;stroke-width:4;marker-end:url(#arrow-violet)}.return{stroke-dasharray:10 8}
  .pill{fill:#10243A;stroke:#36536F;stroke-width:2}.frame{fill:none;stroke:#FB7185;stroke-width:2;stroke-dasharray:10 8}
  .axis{stroke:#36536F;stroke-width:2}.grid{stroke:#233B54;stroke-width:1}.footer{fill:#0B2238;stroke:#36536F;stroke-width:2}
  </style>
<rect width="1600" height="1000" class="bg"/><rect x="32" y="32" width="1536" height="936" rx="30" class="panel frame"/>
<text x="78" y="98" class="title">실행 환경에 따른 테넌트 상태 전달 방식</text><text x="80" y="138" class="sub subtitle">전달 수단은 달라도 입력 검증, 명시적 전달, 트랜잭션 내부 선택, 격리 검증은 동일합니다.</text><rect x="100" y="220" width="620" height="370" rx="20" class="card"/>
<text x="124" y="264" class="h">Spring / JDBC</text><text x="124" y="302" class="body">Filter·Interceptor</text><text x="124" y="332" class="body">ThreadLocal·ScopedValue</text><text x="124" y="362" class="body">JDBC 트랜잭션</text><text x="124" y="392" class="body">정리 규칙 필수</text><rect x="880" y="220" width="620" height="370" rx="20" class="card2"/>
<text x="904" y="264" class="h">Ktor / R2DBC</text><text x="904" y="302" class="body">Application Plugin</text><text x="904" y="332" class="body">ApplicationCall.attributes</text><text x="904" y="362" class="body">suspendTransaction</text><text x="904" y="392" class="body">명시적 값 전달</text><rect x="150" y="700" width="250" height="92" rx="20" class="card"/><text x="275" y="754" text-anchor="middle" class="mono">1. 식별 정보 추출</text><path d="M400 746 H438" class="call"/><rect x="440" y="700" width="250" height="92" rx="20" class="card2"/><text x="565" y="754" text-anchor="middle" class="mono">2. 권한·준비 상태 확인</text><path d="M690 746 H728" class="call"/><rect x="730" y="700" width="250" height="92" rx="20" class="card"/><text x="855" y="754" text-anchor="middle" class="mono">3. 라우팅 값 전달</text><path d="M980 746 H1018" class="call"/><rect x="1020" y="700" width="250" height="92" rx="20" class="card"/><text x="1145" y="754" text-anchor="middle" class="mono">4. 스키마·대상 선택</text><path d="M1270 746 H1308" class="call"/><rect x="1310" y="700" width="250" height="92" rx="20" class="card"/><text x="1435" y="754" text-anchor="middle" class="mono">5. 격리 테스트</text><rect x="130" y="870" width="1340" height="76" rx="20" class="footer"/><text x="800" y="916" text-anchor="middle" class="body">헤더는 라우팅 입력일 뿐 인증·권한 정책이 아닙니다. korean ≠ english, acme:rw ≠ acme:ro를 실제 데이터로 검증합니다.</text></svg>
