<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-labelledby="title desc">
<title id="title">Readiness contract sequence</title>
<desc id="desc">Sequence diagram showing readiness probes, Spring Actuator or Ktor readyz endpoint, readiness state, repository ping, and database response branches.</desc>
<defs>
<style>
.title{font-family:"Architects Daughter";font-size:40px;fill:#f8fafc}.subtitle,.msg,.note,.footer{font-family:"Comic Mono";fill:#d8e5f2}.subtitle{font-size:18px}.participant{font-family:"Architects Daughter";font-size:19px;fill:#f8fafc}.role{font-family:"Comic Mono";font-size:13px;fill:#b6c4d6}.msg{font-size:14px}.note{font-size:13px}.footer{font-size:14px;fill:#a9b8ca}.frame{fill:#08111f;stroke:#41545d;stroke-width:3}.header{fill:#111827;stroke:#546e7a;stroke-width:2}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#2a2117;stroke:#8f784e;stroke-width:1.5}.call,.state,.return,.skip{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.call{stroke:#3f7d9c}.state{stroke:#6e8f4f}.return{stroke:#9b7d54;stroke-dasharray:8 6}.skip{stroke:#b86868}.alt{fill:none;stroke:#78909c;stroke-width:3;stroke-dasharray:12 7}.branchDivider{stroke:#78909c;stroke-width:3;stroke-dasharray:12 8}.label{fill:#111827;stroke:#52627a;stroke-width:1.5}.callLabel{stroke:#9cc2d1}.stateLabel{stroke:#b6c9a4}.returnLabel{stroke:#c8b38f}.skipLabel{stroke:#d9abab}.branchOk{fill:#2a2117;stroke:#a2743d;stroke-width:1.8}.branchSkip{fill:#321b24;stroke:#b86868;stroke-width:1.8}.callText{fill:#7dd3fc}.stateText{fill:#a3d977}.returnText{fill:#e8c58f}.skipText{fill:#fda4af}text{letter-spacing:0}</style>
<marker id="arrowCall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker><marker id="arrowState" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker><marker id="arrowReturn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker><marker id="arrowSkip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b86868" stroke="#b86868" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
</defs>
<rect x="24" y="24" width="1452" height="1132" rx="20" class="frame"/>
<text x="750" y="78" text-anchor="middle" class="title">Readiness Probe Is an Operational Contract</text>
<text x="750" y="108" text-anchor="middle" class="subtitle">Spring uses Actuator readiness; Ktor exposes /readyz, but both must prove database reachability.</text>
<rect x="76" y="150" width="150" height="68" rx="10" class="header"/><text x="151" y="179" text-anchor="middle" class="participant">Probe</text><text x="151" y="201" text-anchor="middle" class="role">Kubernetes</text>
<rect x="302" y="150" width="230" height="68" rx="10" class="header"/><text x="417" y="179" text-anchor="middle" class="participant">Readiness Endpoint</text><text x="417" y="201" text-anchor="middle" class="role">Actuator or /readyz</text>
<rect x="610" y="150" width="190" height="68" rx="10" class="header"/><text x="705" y="179" text-anchor="middle" class="participant">ReadinessState</text><text x="705" y="201" text-anchor="middle" class="role">degrade switch</text>
<rect x="878" y="150" width="210" height="68" rx="10" class="header"/><text x="983" y="179" text-anchor="middle" class="participant">Repository</text><text x="983" y="201" text-anchor="middle" class="role">ping / record</text>
<rect x="1172" y="150" width="190" height="68" rx="10" class="header"/><text x="1267" y="179" text-anchor="middle" class="participant">Database</text><text x="1267" y="201" text-anchor="middle" class="role">Exposed JDBC</text>
<line x1="151" y1="218" x2="151" y2="1040" class="lifeline"/><line x1="417" y1="218" x2="417" y2="1040" class="lifeline"/><line x1="705" y1="218" x2="705" y2="1040" class="lifeline"/><line x1="983" y1="218" x2="983" y2="1040" class="lifeline"/><line x1="1267" y1="218" x2="1267" y2="1040" class="lifeline"/>
<rect x="410" y="304" width="14" height="632" rx="6" class="activation"/><rect x="698" y="394" width="14" height="112" rx="6" class="activation"/><rect x="976" y="538" width="14" height="278" rx="6" class="activation"/><rect x="1260" y="620" width="14" height="96" rx="6" class="activation"/>
<rect x="102" y="260" width="240" height="34" rx="17" class="label callLabel"/><text x="120" y="282" class="msg callText">GET readiness endpoint</text><path data-connector="probe-to-endpoint" d="M 151 318 L 417 318" class="call" marker-end="url(#arrowCall)"/>
<rect x="450" y="348" width="250" height="34" rx="17" class="label stateLabel"/><text x="468" y="370" class="msg stateText">read example state first</text><path data-connector="endpoint-to-state" d="M 417 398 L 705 398" class="state" marker-end="url(#arrowState)"/>
<rect x="488" y="438" width="230" height="34" rx="17" class="label returnLabel"/><text x="506" y="460" class="msg returnText">databaseAvailable=true</text><path data-connector="state-to-endpoint-ok" d="M 705 494 L 417 494" class="return" marker-end="url(#arrowReturn)"/>
<rect x="92" y="526" width="1288" height="520" rx="14" class="alt"/>
<rect x="118" y="544" width="300" height="30" rx="15" class="branchOk"/><text x="140" y="564" class="note">alt database is reachable</text>
<rect x="720" y="594" width="246" height="34" rx="17" class="label stateLabel"/><text x="738" y="616" class="msg stateText">repository.ping()</text><path data-connector="endpoint-to-repository-ping" d="M 417 648 L 983 648" class="state" marker-end="url(#arrowState)"/>
<rect x="1020" y="594" width="172" height="34" rx="17" class="label stateLabel"/><text x="1038" y="616" class="msg stateText">SELECT 1 / ping</text><path data-connector="repository-to-database-ping" d="M 983 682 L 1267 682" class="state" marker-end="url(#arrowState)"/>
<rect x="1010" y="720" width="180" height="34" rx="17" class="label returnLabel"/><text x="1028" y="742" class="msg returnText">reachable</text><path data-connector="database-to-repository-up" d="M 1267 760 L 983 760" class="return" marker-end="url(#arrowReturn)"/>
<rect x="500" y="782" width="250" height="34" rx="17" class="label returnLabel"/><text x="518" y="804" class="msg returnText">HTTP 200, status UP</text><path data-connector="endpoint-to-probe-up" d="M 417 842 L 151 842" class="return" marker-end="url(#arrowReturn)"/>
<line x1="92" y1="890" x2="1380" y2="890" class="branchDivider"/>
<rect x="118" y="914" width="390" height="30" rx="15" class="branchSkip"/><text x="140" y="934" class="note">else example state or DB ping is degraded</text>
<rect x="474" y="962" width="290" height="34" rx="17" class="label skipLabel"/><text x="492" y="984" class="msg skipText">HTTP 503, status DOWN</text><path data-connector="endpoint-to-probe-down" d="M 417 1022 L 151 1022" class="skip" marker-end="url(#arrowSkip)"/>
<rect x="96" y="1068" width="1288" height="44" rx="12" fill="#111827" stroke="#52627a" stroke-width="2"/>
<text x="118" y="1096" class="note">Tests assert UP/DOWN responses, request-id echo/sanitize, and structured validation errors for Spring and Ktor examples.</text>
<text x="750" y="1136" text-anchor="middle" class="footer">Sources: exposed-workshop 09-spring-observability-readiness and 10-ktor-observability-readiness</text>







