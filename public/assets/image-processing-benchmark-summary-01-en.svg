<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="scrimage versus libvips Java 25 benchmark summary">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
    <style>
      .canvas{fill:#0b1220}.frame{fill:#111c31;stroke:#355277;stroke-width:1.5}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:40px;font-weight:400;fill:#f8fafc}
      .subtitle,.axis,.note{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:15px;font-weight:400;fill:#b7c8e2}
      .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;font-weight:400;fill:#f8fafc}
      .value{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:14px;font-weight:700;fill:#e7f0ff}
      .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:400;fill:#c9dcf5}
      .na{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:13px;font-weight:700;fill:#f9c98f}
      rect[fill="#fff"]{fill:#14213a} rect[stroke="#e2e8f0"]{stroke:#355277}
      line[stroke="#d8e0ea"]{stroke:#355277} rect[fill="#8fc5f3"]{fill:#5ca7df} rect[fill="#7cc7a2"]{fill:#54d0ad}
      .panel{filter:url(#shadow)}
    </style>
  </defs>
  <rect class="canvas" width="1280" height="720"/>
  <rect class="frame" x="32" y="28" width="1216" height="664" rx="28"/>
  <text class="title" x="70" y="82">Natural photos: scrimage vs libvips</text>
  <text class="subtitle" x="72" y="116">macOS Java 25 run, average of cafe and landscape JPEG inputs, AverageTime ms/op, log scale</text>

  <rect x="58" y="144" width="1164" height="424" rx="18" fill="#fff" stroke="#e2e8f0" class="panel"/>
  <line x1="270" y1="176" x2="270" y2="514" stroke="#d8e0ea"/>
  <line x1="470" y1="176" x2="470" y2="514" stroke="#d8e0ea"/>
  <line x1="670" y1="176" x2="670" y2="514" stroke="#d8e0ea"/>
  <line x1="870" y1="176" x2="870" y2="514" stroke="#d8e0ea"/>
  <line x1="1070" y1="176" x2="1070" y2="514" stroke="#d8e0ea"/>
  <text class="axis" x="270" y="544" text-anchor="middle">0.1</text>
  <text class="axis" x="470" y="544" text-anchor="middle">1</text>
  <text class="axis" x="670" y="544" text-anchor="middle">10</text>
  <text class="axis" x="870" y="544" text-anchor="middle">100</text>
  <text class="axis" x="1070" y="544" text-anchor="middle">1000</text>

  <text class="label" x="88" y="222">Resize 4K to 1080p</text>
  <rect x="270" y="188" width="612" height="20" rx="6" fill="#8fc5f3"/>
  <rect x="270" y="224" width="80" height="20" rx="6" fill="#7cc7a2"/>
  <text class="value" x="893" y="203">scrimage 115.26</text>
  <text class="value" x="360" y="239">vips FFM 0.251</text>
  <text class="value" x="88" y="252">459x faster</text>

  <text class="label" x="88" y="344">JPEG encode</text>
  <rect x="270" y="310" width="630" height="20" rx="6" fill="#8fc5f3"/>
  <rect x="270" y="346" width="544" height="20" rx="6" fill="#7cc7a2"/>
  <text class="value" x="911" y="325">scrimage 141.45</text>
  <text class="value" x="824" y="361">vips FFM 52.55</text>
  <text class="value" x="88" y="374">2.7x faster</text>

  <text class="label" x="88" y="466">PNG encode</text>
  <rect x="270" y="432" width="794" height="20" rx="6" fill="#8fc5f3"/>
  <rect x="270" y="468" width="751" height="20" rx="6" fill="#7cc7a2"/>
  <text class="value" x="1075" y="447">scrimage 936.74</text>
  <text class="value" x="1031" y="483">vips FFM 565.84</text>
  <text class="value" x="88" y="496">1.7x faster</text>

  <rect x="756" y="594" width="18" height="12" rx="4" fill="#8fc5f3"/>
  <text class="small" x="784" y="606">scrimage pure JVM</text>
  <rect x="756" y="620" width="18" height="12" rx="4" fill="#7cc7a2"/>
  <text class="small" x="784" y="632">libvips Java 25 FFM</text>
  <text class="na" x="756" y="658">Java 21 JNI: N/A on this macOS arm64 run</text>

  <text class="note" x="76" y="616">Source: bluetape4k-image images-benchmark,</text>
  <text class="note" x="76" y="642">2026-05-28 macOS Java 25 run, cafe.jpg and landscape.jpg natural photos.</text>
  <text class="note" x="76" y="668">Same-host Java 21 JNI measurement is unavailable on this arm64 host.</text>
</svg>
