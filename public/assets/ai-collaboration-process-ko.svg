<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">AI 협업 환경의 반복 구조</title>
  <desc id="desc">의도 정의, 맥락 탐색, 작업 분류, 실행, 검증, memory 축적이 다음 작업의 기준을 만드는 AI 협업 환경 구조.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101d33"/>
      <stop offset="1" stop-color="#0c1727"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="132%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <marker id="flow-arrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L13 7 L1 13 Z" fill="#77d4ff"/>
    </marker>
    <style>
      .title { font: 700 40px "goorm Sans", sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 19px "goorm Sans", sans-serif; fill: #b6c7dd; }
      .stage-title { font: 700 25px "goorm Sans", sans-serif; fill: #f8fafc; }
      .stage-body { font: 500 17px "goorm Sans", sans-serif; fill: #d7e3f3; }
      .code { font: 600 16px "goorm Sans Code", monospace; fill: #c5e5ff; }
      .badge-text { font: 800 16px "goorm Sans Code", monospace; fill: #07111f; }
      .footer-title { font: 700 16px "goorm Sans", sans-serif; fill: #8ed8ff; }
      .footer-body { font: 500 16px "goorm Sans", sans-serif; fill: #d7e3f3; }
      .card { fill: #12213a; stroke: #2d4667; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .footer { fill: #0f1c31; stroke: #2d4667; stroke-width: 2; rx: 20; }
      .connector { fill: none; stroke: #77d4ff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#flow-arrow); }
      .feedback { stroke: #c4a7ff; marker-end: url(#feedback-arrow); }
    </style>
    <marker id="feedback-arrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L13 7 L1 13 Z" fill="#c4a7ff"/>
    </marker>
  </defs>

  <rect width="1600" height="1040" fill="url(#background)"/>
  <circle cx="1480" cy="90" r="210" fill="#123454" opacity="0.34"/>
  <circle cx="105" cy="970" r="240" fill="#281d54" opacity="0.26"/>
  <path d="M70 165 H1530" stroke="#2d4667" stroke-width="2"/>

  <text x="70" y="82" class="title">AI 협업 환경의 반복 구조</text>
  <text x="70" y="120" class="subtitle">의도·맥락·분류·실행·검증·memory가 다음 작업의 기준을 다시 만듭니다.</text>

  <rect x="70" y="210" width="320" height="290" class="card"/>
  <rect x="102" y="242" width="76" height="34" rx="17" fill="#77d4ff"/>
  <text x="125" y="265" class="badge-text">01</text>
  <text x="102" y="322" class="stage-title">목표</text>
  <text x="102" y="360" class="stage-body">원하는 결과와 제약을 밝히고</text>
  <text x="102" y="390" class="stage-body">성공 조건과 종료 지점을</text>
  <text x="102" y="420" class="stage-body">정합니다.</text>

  <rect x="450" y="210" width="320" height="290" class="card"/>
  <rect x="482" y="242" width="76" height="34" rx="17" fill="#5eead4"/>
  <text x="505" y="265" class="badge-text">02</text>
  <text x="482" y="322" class="stage-title">맥락</text>
  <text x="482" y="360" class="code">AGENTS.md, CLAUDE.md,</text>
  <text x="482" y="390" class="stage-body">qmd, 저장소 문서와</text>
  <text x="482" y="420" class="stage-body">코드를 읽습니다.</text>

  <rect x="830" y="210" width="320" height="290" class="card"/>
  <rect x="862" y="242" width="76" height="34" rx="17" fill="#86efac"/>
  <text x="885" y="265" class="badge-text">03</text>
  <text x="862" y="322" class="stage-title">분류</text>
  <text x="862" y="360" class="stage-body">작업 유형을 분류하고</text>
  <text x="862" y="390" class="stage-body">알맞은 skill을 고르며</text>
  <text x="862" y="420" class="stage-body">책임이 분명한 작업으로 나눕니다.</text>

  <rect x="1210" y="210" width="320" height="290" class="card"/>
  <rect x="1242" y="242" width="76" height="34" rx="17" fill="#fdba74"/>
  <text x="1265" y="265" class="badge-text">04</text>
  <text x="1242" y="322" class="stage-title">실행</text>
  <text x="1242" y="360" class="stage-body">편집·테스트·리뷰를 수행하고</text>
  <text x="1242" y="390" class="stage-body">책임 경계를</text>
  <text x="1242" y="420" class="stage-body">분명하게 유지합니다.</text>

  <path d="M390 355 H450" class="connector" data-connector="goal-to-context"/>
  <path d="M770 355 H830" class="connector" data-connector="context-to-routing"/>
  <path d="M1150 355 H1210" class="connector" data-connector="routing-to-execution"/>

  <rect x="1210" y="610" width="320" height="250" class="card"/>
  <rect x="1242" y="642" width="76" height="34" rx="17" fill="#fda4af"/>
  <text x="1265" y="665" class="badge-text">05</text>
  <text x="1242" y="722" class="stage-title">검증</text>
  <text x="1242" y="760" class="stage-body">진단·빌드·대상 테스트와</text>
  <text x="1242" y="790" class="stage-body">리뷰·근거를</text>
  <text x="1242" y="820" class="stage-body">확인합니다.</text>

  <rect x="70" y="610" width="320" height="250" class="card"/>
  <rect x="102" y="642" width="76" height="34" rx="17" fill="#c4a7ff"/>
  <text x="125" y="665" class="badge-text">06</text>
  <text x="102" y="722" class="stage-title">memory</text>
  <text x="102" y="760" class="stage-body">교훈·명세·계획·결정을</text>
  <text x="102" y="790" class="stage-body">지속되는 저장소 문서로</text>
  <text x="102" y="820" class="stage-body">남깁니다.</text>

  <path d="M1370 500 V610" class="connector" data-connector="execution-to-verification"/>
  <path d="M1210 785 H390" class="connector" data-connector="verification-to-memory"/>
  <path d="M230 610 V500" class="connector feedback" data-connector="memory-to-goal"/>

  <rect x="70" y="920" width="1460" height="70" class="footer"/>
  <text x="104" y="950" class="footer-title">축적 규칙</text>
  <text x="104" y="976" class="footer-body">반복되는 수정은 설정으로, 반복되는 작업 흐름은 skill로, 지속될 결정은 검색 가능한 memory로 남깁니다.</text>
</svg>
