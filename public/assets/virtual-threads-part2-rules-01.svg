<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Threads production rules</title>
  <desc id="desc">A Graphviz-derived flow of virtual thread usage rules from bluetape4k-workshop: blocking synchronous code, thread-per-task execution, semaphore limits, scoped values, and lock discipline.</desc>
  <defs>
    <marker id="arrow-vt2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5c7d70"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f8fbf9"/>
  <rect x="64" y="62" width="1072" height="506" rx="24" fill="#ffffff" stroke="#c8d7cf" stroke-width="2"/>
  <text x="96" y="122" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="42" fill="#17342b">Virtual Threads Rules</text>
  <text x="98" y="162" font-family="Comic Mono, monospace" font-size="22" fill="#526056">rules from bluetape4k-workshop/virtualthreads/rules</text>

  <g font-family="Comic Mono, monospace" font-size="17" fill="#17342b">
    <rect x="96" y="246" width="182" height="112" rx="16" fill="#e3f2ec" stroke="#b9d8c8"/>
    <text x="187" y="284" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Blocking sync</text>
    <text x="187" y="316" text-anchor="middle">OK for I/O waits</text>

    <rect x="338" y="246" width="188" height="112" rx="16" fill="#eaf4ff" stroke="#b9cde0"/>
    <text x="432" y="284" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Thread per task</text>
    <text x="432" y="316" text-anchor="middle">do not pool VT</text>

    <rect x="586" y="246" width="188" height="112" rx="16" fill="#fff1df" stroke="#dfc6a6"/>
    <text x="680" y="284" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Semaphore</text>
    <text x="680" y="316" text-anchor="middle">limit resources</text>

    <rect x="834" y="210" width="188" height="104" rx="16" fill="#f4f0ff" stroke="#c9bee6"/>
    <text x="928" y="248" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">ScopedValue</text>
    <text x="928" y="280" text-anchor="middle">context scope</text>

    <rect x="834" y="382" width="188" height="104" rx="16" fill="#e6f4ff" stroke="#b6d3e8"/>
    <text x="928" y="420" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Locks</text>
    <text x="928" y="452" text-anchor="middle">small scope</text>
  </g>

  <g fill="none" stroke="#5c7d70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-vt2)">
    <path d="M278 302 H338"/>
    <path d="M526 302 H586"/>
    <path d="M774 302 H804 V262 H834"/>
    <path d="M774 302 H804 V434 H834"/>
  </g>

  <g font-family="Comic Mono, monospace" font-size="17" fill="#25493d">
    <rect x="126" y="424" width="592" height="72" rx="16" fill="#f8fbfa" stroke="#d6e2dc"/>
    <text x="154" y="456" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Practical rule</text>
    <text x="154" y="484">Virtual threads remove thread pressure, not downstream limits.</text>
  </g>
</svg>
