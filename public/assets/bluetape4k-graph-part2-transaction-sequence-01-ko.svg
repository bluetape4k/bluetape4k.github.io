<rect x="88" y="655" width="1324" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="750" y="680" text-anchor="middle">트랜잭션 블록은 생명주기 명령을 제외하여 DDL과 자동 커밋 규칙을 저장소별로 유지한다.</text>
<text class="footer" x="750" y="704" text-anchor="middle">일괄 처리 기본값은 공통 계약을 따르고 어댑터는 저장소 고유의 원자적 동작으로 재정의할 수 있다.</text>
</svg>
