<svg xmlns="http://www.w3.org/2000/svg" width="920" height="540" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
  <title id="title">Subject bridge Flow marble diagram</title>
  <desc id="desc">A marble diagram showing how publish, behavior, replay, and unicast subject contracts differ for late subscribers.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ed8ff" stroke="#9ed8ff"/></marker>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <radialGradient id="marbleTeal" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#d5fff8"/><stop offset="34%" stop-color="#62d6cb"/><stop offset="100%" stop-color="#0b766f"/></radialGradient>
    <radialGradient id="marbleAmber" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#fff0c2"/><stop offset="36%" stop-color="#dfac3f"/><stop offset="100%" stop-color="#9b6a12"/></radialGradient>
    <radialGradient id="marbleGreen" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#dff8c7"/><stop offset="36%" stop-color="#83c95a"/><stop offset="100%" stop-color="#3f7b2a"/></radialGradient>
    <radialGradient id="marblePurple" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#f0e7ff"/><stop offset="36%" stop-color="#a98be9"/><stop offset="100%" stop-color="#6840a8"/></radialGradient>
    <filter id="panelShadow" x="-8%" y="-12%" width="116%" height="124%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
    <filter id="marbleShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#020617" flood-opacity="0.42"/></filter>
    <filter id="laneGlow" x="-4%" y="-120%" width="108%" height="340%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.35"/></filter>
    <style>
      .bg { fill: url(#bgGradient); } .panel { fill: url(#panelGradient); stroke: #536377; stroke-width: 2; rx: 18; filter: url(#panelShadow); }
      .title { font: 24px "Architects Daughter", "Comic Mono", system-ui, sans-serif; fill: #f8fafc; }
      .sub,.small { font: 13px "Comic Mono", ui-monospace, monospace; fill: #b6c4d6; }
      .tiny { font: 11px "Comic Mono", ui-monospace, monospace; fill: #f8fafc; text-anchor: middle; dominant-baseline: middle; font-weight: 700; }
      .result { font: 12px "Comic Mono", ui-monospace, monospace; fill: #d8e5f2; text-anchor: middle; }
      .line { stroke: #9ed8ff; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); filter: url(#laneGlow); }
      .shape { stroke: #e8f7ff; stroke-width: 1.8; filter: url(#marbleShadow); }
      .box { fill: #172033; stroke-width: 2.5; rx: 14; }
      .teal { fill: url(#marbleTeal); } .amber { fill: url(#marbleAmber); } .green { fill: url(#marbleGreen); } .purple { fill: url(#marblePurple); }
    </style>
  </defs>
  <rect class="bg" width="920" height="540"/><rect class="panel" x="24" y="22" width="872" height="496"/>
  <text class="title" x="52" y="58">subject bridge: late subscribers change the contract</text>
  <text class="sub" x="52" y="84">publish drops early events, behavior sends latest state, replay sends history, unicast consumes work once</text>
  <text class="small" x="52" y="144">callback</text><line class="line" x1="150" y1="140" x2="806" y2="140"/>
  <circle class="shape teal" cx="220" cy="140" r="13"/><text class="tiny" x="220" y="140">E1</text>
  <rect class="shape amber" x="326" y="127" width="32" height="26" rx="7"/><text class="tiny" x="342" y="140">S1</text>
  <path class="shape green" d="M 462 123 L 479 140 L 462 157 L 445 140 Z"/><text class="tiny" x="462" y="140">E2</text>
  <circle class="shape purple" cx="570" cy="140" r="13"/><text class="tiny" x="570" y="140">W</text>
  <path d="M 410 104 V 492" stroke="#f8fafc" stroke-width="2" stroke-dasharray="8 8"/><text class="result" x="410" y="505">subscriber starts</text>

  <text class="small" x="52" y="234">Publish</text><line class="line" x1="150" y1="230" x2="806" y2="230"/>
  <path class="shape green" d="M 462 213 L 479 230 L 462 247 L 445 230 Z"/><text class="tiny" x="462" y="230">E2</text><text class="result" x="245" y="256">E1 dropped</text>
  <text class="small" x="52" y="314">Behavior</text><line class="line" x1="150" y1="310" x2="806" y2="310"/>
  <rect class="shape amber" x="326" y="297" width="32" height="26" rx="7"/><text class="tiny" x="342" y="310">S1</text>
  <path class="shape green" d="M 462 293 L 479 310 L 462 327 L 445 310 Z"/><text class="tiny" x="462" y="310">E2</text>
  <text class="small" x="52" y="394">Replay</text><line class="line" x1="150" y1="390" x2="806" y2="390"/>
  <circle class="shape teal" cx="220" cy="390" r="11"/><text class="tiny" x="220" y="390">E1</text>
  <path class="shape green" d="M 462 375 L 477 390 L 462 405 L 447 390 Z"/><text class="tiny" x="462" y="390">E2</text>
  <text class="small" x="52" y="474">Unicast</text><line class="line" x1="150" y1="470" x2="806" y2="470"/>
  <circle class="shape purple" cx="570" cy="470" r="11"/><text class="tiny" x="570" y="470">W</text>
  <rect class="box" x="612" y="448" width="124" height="44" stroke="#8b6bd6"/><text class="tiny" x="674" y="470">one consumer</text>
</svg>
