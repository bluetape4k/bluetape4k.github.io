<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 1 1 L 7 4 L 1 7 Z" fill="#496A8F"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"goorm Sans";font-size:42px;fill:#22344A;font-weight:400}
    .subtitle,.footer{font-family:"goorm Sans Code";font-size:17px;fill:#536476;font-weight:400}
    .nodeTitle{font-family:"goorm Sans";font-size:25px;fill:#22344A;font-weight:400}
    .nodeBody,.edgeLabel{font-family:"goorm Sans Code";font-size:16px;fill:#3F5269;font-weight:400}
    .edge{fill:none;stroke:#496A8F;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1500" height="760"/>
<rect class="frame" x="34" y="28" width="1432" height="704" rx="24"/>
<text class="title" x="750" y="82" text-anchor="middle">영속성 조합 구성</text>
<text class="subtitle" x="750" y="116" text-anchor="middle">현재 어댑터는 역할별이며 복합 팬아웃은 계획 단계입니다</text>
<path class="edge" d="M255 285 V260 Q255 250 265 250 H488"/>
<path class="edge" d="M415 344 H448 Q458 344 458 354 V484 Q458 494 468 494 H488"/>
<path class="edge" d="M840 229 H1175 Q1185 229 1185 239 V273"/>
<path class="edge" d="M840 494 H910 Q920 494 920 484 V354 Q920 344 930 344 H988"/>
<g id="app">
  <rect x="95" y="285" width="320" height="142" rx="12" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="255" y="327" text-anchor="middle">애플리케이션 커밋</text>
  <text class="nodeBody" x="255" y="351" text-anchor="middle">현재 API</text>
  <text class="nodeBody" x="255" y="377" text-anchor="middle">저장소 하나 등록</text>
</g>
<g id="primary">
  <rect x="500" y="170" width="340" height="142" rx="12" fill="#EAF8EF" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="670" y="212" text-anchor="middle">주 저장소</text>
  <text class="nodeBody" x="670" y="236" text-anchor="middle">Exposed 또는 Redis</text>
  <text class="nodeBody" x="670" y="262" text-anchor="middle">스냅샷과 차이 조회</text>
</g>
<g id="stream">
  <rect x="500" y="435" width="340" height="142" rx="12" fill="#FFF0E8" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="670" y="477" text-anchor="middle">이벤트 스트림</text>
  <text class="nodeBody" x="670" y="501" text-anchor="middle">Kafka</text>
  <text class="nodeBody" x="670" y="527" text-anchor="middle">쓰기 전용 스냅샷 이벤트</text>
</g>
<g id="future">
  <rect x="1000" y="285" width="370" height="142" rx="12" fill="#FFF4D9" stroke="#7B8CA3" stroke-width="2"/>
  <text class="nodeTitle" x="1185" y="327" text-anchor="middle">계획된 복합 저장소</text>
  <text class="nodeBody" x="1185" y="351" text-anchor="middle">주 저장소에서 읽기</text>
  <text class="nodeBody" x="1185" y="377" text-anchor="middle">스트림으로 쓰기 팬아웃</text>
</g>
<rect x="88" y="670" width="1324" height="56" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="750" y="693" text-anchor="middle">Exposed + Kafka는 유용한 운영 구성이지만 아직 일급 어댑터는 아닙니다.</text>
<text class="footer" x="750" y="716" text-anchor="middle">그전까지는 현재 API가 아니라 계획된 기능임을 분명히 합니다.</text>
</svg>
