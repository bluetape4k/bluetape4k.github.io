<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080" role="img" aria-labelledby="title desc">
<title id="title">Exposed Workshop cache strategy contracts</title>
<desc id="desc">Chapter 11 separates repository calls from DB access through loader and writer contracts.</desc>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/></filter>

  <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#60a5fa"/></marker>
  <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#86efac"/></marker>
  <marker id="arrow-amber" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#fbbf24"/></marker>
  <marker id="arrow-red" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#f87171"/></marker>
  <marker id="arrow-purple" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#c4b5fd"/></marker>
  <marker id="arrow-cyan" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#67e8f9"/></marker>
  <style>
    .title{font-family:"Architects Daughter","Comic Sans MS",Arial,sans-serif;font-size:44px;font-weight:700;fill:#f8fafc}
    .subtitle{font-family:"Comic Mono","Comic Sans MS",Arial,sans-serif;font-size:18px;fill:#cbd5e1}
    .lane-title{font-family:"Architects Daughter","Comic Sans MS",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-title{font-family:"Architects Daughter","Comic Sans MS",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-body{font-family:"Comic Mono","Comic Sans MS",Arial,sans-serif;font-size:16px;fill:#cbd5e1}
    .small{font-family:"Comic Mono","Comic Sans MS",Arial,sans-serif;font-size:14px;fill:#94a3b8}
    .mono{font-family:"Comic Mono","Comic Sans MS",Arial,sans-serif;font-size:15px;fill:#cbd5e1}
    .panel{fill:#111827;stroke:#334155;stroke-width:2}
    .row{fill:#0f172a;stroke:#334155;stroke-width:2}
    .row-alt{fill:#111c2f;stroke:#334155;stroke-width:2}
    .card{filter:url(#shadow);stroke-width:2}

    .connector{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
    .line-blue{stroke:#60a5fa;marker-end:url(#arrow-blue)}
    .line-green{stroke:#86efac;marker-end:url(#arrow-green)}
    .line-amber{stroke:#fbbf24;marker-end:url(#arrow-amber)}
    .line-red{stroke:#f87171;marker-end:url(#arrow-red)}
    .line-purple{stroke:#c4b5fd;marker-end:url(#arrow-purple)}
    .line-cyan{stroke:#67e8f9;marker-end:url(#arrow-cyan)}
    .dash-blue{stroke:#60a5fa;stroke-dasharray:11 10;marker-end:url(#arrow-blue)}
    .dash-green{stroke:#86efac;stroke-dasharray:11 10;marker-end:url(#arrow-green)}
    .dash-purple{stroke:#c4b5fd;stroke-dasharray:11 10;marker-end:url(#arrow-purple)}
    .label-bg{fill:#0f172a;stroke:#475569;stroke-width:1.5}
  </style>
</defs>
<rect width="1760" height="1080" fill="#0b1220"/>
<rect x="34" y="30" width="1692" height="1020" rx="28" class="panel"/>
<text x="70" y="86" class="title">Exposed Workshop cache strategy contracts</text>
<text x="72" y="122" class="subtitle">Chapter 11 separates repository calls from DB access through loader and writer contracts.</text>
<g>
  <rect x="420" y="168" width="920" height="104" rx="18" fill="#3b2a08" stroke="#fbbf24" class="card"/>
  <text x="880" y="203" text-anchor="middle" dominant-baseline="middle" class="mono">JdbcCacheRepository</text>
<text x="880" y="237" text-anchor="middle" dominant-baseline="middle" class="mono">get / put / putAll / invalidate</text>
</g>
<rect class="row" x="70" y="320" width="1620" height="178" rx="24"/>
<g>
  <rect x="118" y="366" width="338" height="96" rx="16" fill="#172554" stroke="#60a5fa" class="card"/>
  <text x="287" y="397" text-anchor="middle" dominant-baseline="middle" class="mono">JdbcCacheRepository</text>
<text x="287" y="431" text-anchor="middle" dominant-baseline="middle" class="mono">get(id)</text>
</g>
<g>
  <rect x="620" y="358" width="332" height="112" rx="16" fill="#3b2a08" stroke="#fbbf24" class="card"/>
  <text x="786" y="386" text-anchor="middle" dominant-baseline="middle" class="mono">RMap / Near Cache</text>
<text x="786" y="420" text-anchor="middle" dominant-baseline="middle" class="mono">return hit</text>
<text x="786" y="442" text-anchor="middle" dominant-baseline="middle" class="mono">call loader on miss</text>
</g>
<g>
  <rect x="1264" y="362" width="300" height="104" rx="16" fill="#14351f" stroke="#86efac" class="card"/>
  <text x="1414" y="397" text-anchor="middle" dominant-baseline="middle" class="mono">Exposed DB</text>
<text x="1414" y="431" text-anchor="middle" dominant-baseline="middle" class="mono">source of truth</text>
</g>

<path class="connector line-blue" data-connector="readThrough-repository-to-map" d="M456 414 H620"/><rect class="label-bg" x="503" y="377" width="70" height="30" rx="15"/><text class="small" x="538" y="396" text-anchor="middle">get</text>
<path class="connector line-blue" data-connector="readThrough-map-to-db" d="M952 402 H1264"/><rect class="label-bg" x="1022" y="365" width="172" height="30" rx="15"/><text class="small" x="1108" y="384" text-anchor="middle">EntityMapLoader.load</text>


<path class="connector dash-green" data-connector="readThrough-db-to-map" d="M1264 442 H952"/><rect class="label-bg" x="1033" y="447" width="150" height="30" rx="15"/><text class="small" x="1108" y="466" text-anchor="middle">loaded entity</text>
<rect class="row-alt" x="70" y="540" width="1620" height="178" rx="24"/>
<g>
  <rect x="118" y="586" width="338" height="96" rx="16" fill="#172554" stroke="#60a5fa" class="card"/>
  <text x="287" y="617" text-anchor="middle" dominant-baseline="middle" class="mono">JdbcCacheRepository</text>
<text x="287" y="651" text-anchor="middle" dominant-baseline="middle" class="mono">put(entity)</text>
</g>
<g>
  <rect x="620" y="578" width="332" height="112" rx="16" fill="#3b2a08" stroke="#fbbf24" class="card"/>
  <text x="786" y="617" text-anchor="middle" dominant-baseline="middle" class="mono">undefined</text>
<text x="786" y="651" text-anchor="middle" dominant-baseline="middle" class="mono">READ_WRITE_THROUGH</text>
</g>
<g>
  <rect x="1264" y="582" width="300" height="104" rx="16" fill="#14351f" stroke="#86efac" class="card"/>
  <text x="1414" y="617" text-anchor="middle" dominant-baseline="middle" class="mono">Exposed DB</text>
<text x="1414" y="651" text-anchor="middle" dominant-baseline="middle" class="mono">immediate DB write</text>
</g>

<path class="connector line-blue" data-connector="writeThrough-repository-to-map" d="M456 634 H620"/><rect class="label-bg" x="503" y="597" width="70" height="30" rx="15"/><text class="small" x="538" y="616" text-anchor="middle">put</text>
<path class="connector line-blue" data-connector="writeThrough-map-to-db" d="M952 622 H1264"/><rect class="label-bg" x="1022" y="585" width="172" height="30" rx="15"/><text class="small" x="1108" y="604" text-anchor="middle">EntityMapWriter.write</text>



<rect class="row" x="70" y="750" width="1620" height="250" rx="24"/>
<g>
  <rect x="118" y="796" width="338" height="96" rx="16" fill="#172554" stroke="#60a5fa" class="card"/>
  <text x="287" y="827" text-anchor="middle" dominant-baseline="middle" class="mono">JdbcCacheRepository</text>
<text x="287" y="861" text-anchor="middle" dominant-baseline="middle" class="mono">putAll(events)</text>
</g>
<g>
  <rect x="620" y="788" width="332" height="112" rx="16" fill="#3b1217" stroke="#f87171" class="card"/>
  <text x="786" y="827" text-anchor="middle" dominant-baseline="middle" class="mono">undefined</text>
<text x="786" y="861" text-anchor="middle" dominant-baseline="middle" class="mono">WRITE_BEHIND</text>
</g>
<g>
  <rect x="1264" y="874" width="300" height="104" rx="16" fill="#261943" stroke="#c4b5fd" class="card"/>
  <text x="1414" y="909" text-anchor="middle" dominant-baseline="middle" class="mono">Exposed DB</text>
<text x="1414" y="943" text-anchor="middle" dominant-baseline="middle" class="mono">batch flush</text>
</g>
<g>
  <rect x="1050" y="790" width="300" height="104" rx="16" fill="#261943" stroke="#c4b5fd" class="card"/>
  <text x="1200" y="825" text-anchor="middle" dominant-baseline="middle" class="mono">write-behind queue</text>
<text x="1200" y="859" text-anchor="middle" dominant-baseline="middle" class="mono">batch / retry</text>
</g>
