<path class="connector dash-purple" data-connector="writebehind-map-to-queue" d="M952 842 H1050"/><rect class="label-bg" x="956" y="803" width="90" height="30" rx="15"/><text class="small" x="1001" y="822" text-anchor="middle">enqueue</text>
<path class="connector line-purple" data-connector="writebehind-queue-to-db" d="M1200 894 V946 Q1200 968 1222 968 H1264"/><rect class="label-bg" x="1180" y="927" width="104" height="30" rx="15"/><text class="small" x="1232" y="946" text-anchor="middle">batch flush</text>

<rect x="118" y="940" width="1000" height="52" rx="16" fill="#3b2a08" stroke="#fbbf24" stroke-width="2"/>
<text class="mono" x="146" y="972">DB write path is separated: queue durability / retry / drain policy required</text>
</svg>