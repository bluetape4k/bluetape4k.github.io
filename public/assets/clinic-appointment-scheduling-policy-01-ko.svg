<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">병원별 예약 정책이 유효 정책 스냅숏이 되는 과정</title>
  <desc id="desc">테넌트 기본 정책과 병원별 재정의를 합성하고 활성화 검사를 거쳐 유효 정책 스냅숏을 만든 뒤, 미래 제안과 기존 확정 방문 약속을 다르게 처리하는 흐름</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16324f" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M1 1 L13 7 L1 13 Z" fill="#20639b"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x">
      <path d="M1 1 L9 5 L1 9 Z" fill="#c9791d"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x">
      <path d="M1 1 L9 5 L1 9 Z" fill="#138a8a"/>
    </marker>
    <style>
      .canvas { fill: #f7fbff; }
      .title { font: 700 30px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #16324f; }
      .subtitle { font: 400 17px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #4d6478; }
      .card { stroke-width: 2; rx: 22; filter: url(#shadow); }
      .card-title { font: 700 23px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #16324f; }
      .card-id { font: 600 15px 'JetBrains Mono', monospace; fill: #52708a; }
      .body { font: 400 17px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #29465e; }
      .small { font: 500 15px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #4d6478; }
      .edge-label { font: 700 15px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #35566f; paint-order: stroke; stroke: #f7fbff; stroke-width: 7px; stroke-linejoin: round; }
      .note { font: 600 16px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #35566f; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="1000"/>
  <text class="title" x="80" y="64">병원별 예약 규칙이 유효 정책 스냅숏이 되는 과정</text>
  <text class="subtitle" x="80" y="98">같은 요청도 정책의 범위·출처·세대가 다르면 결과가 달라진다</text>

  <g id="tenant-default" data-node="tenant-default" data-source="src/content/docs/ko/blog/clinic-appointment-scheduling-policy.mdx">
    <rect class="card" x="80" y="170" width="320" height="170" fill="#e9f3ff" stroke="#77a9d0"/>
    <text class="card-title" x="112" y="218">테넌트 기본 정책</text>
    <text class="card-id" x="112" y="246">tenant default</text>
    <text class="body" x="112" y="282">모든 병원의 기준</text>
    <text class="small" x="112" y="310">승인 방식 · 안전 상한 · 운영 시간</text>
  </g>

  <g id="clinic-override" data-node="clinic-override" data-source="src/content/docs/ko/blog/clinic-appointment-scheduling-policy.mdx">
    <rect class="card" x="80" y="460" width="320" height="170" fill="#fff4e6" stroke="#d9a05b"/>
    <text class="card-title" x="112" y="508">병원별 재정의</text>
    <text class="card-id" x="112" y="536">clinic override</text>
    <text class="body" x="112" y="572">업무 차이를 명시</text>
    <text class="small" x="112" y="600">INHERIT · SET · DISABLE</text>
  </g>

  <g id="compose" data-node="compose" data-source="src/content/docs/ko/blog/clinic-appointment-scheduling-policy.mdx">
    <rect class="card" x="480" y="300" width="330" height="200" fill="#ffffff" stroke="#477b9e"/>
    <text class="card-title" x="518" y="350">정책 합성</text>
    <text class="card-id" x="518" y="378">resolve policy paths</text>
    <text class="body" x="518" y="416">기본값과 재정의를</text>
    <text class="body" x="518" y="444">경로별로 결정</text>
    <text class="small" x="518" y="476">출처를 잃지 않고 결과를 만든다</text>
  </g>

  <g id="activation-gate" data-node="activation-gate" data-source="src/content/docs/ko/blog/clinic-appointment-scheduling-policy.mdx">
    <rect class="card" x="870" y="300" width="300" height="200" fill="#f0f8f5" stroke="#63a68c"/>
    <text class="card-title" x="908" y="350">활성화 검사</text>
    <text class="card-id" x="908" y="378">CAS + generation</text>
    <text class="body" x="908" y="416">기대 revision과</text>
    <text class="body" x="908" y="444">세대를 비교</text>
    <text class="small" x="908" y="476">충돌이면 이전 ACTIVE 보존</text>
  </g>

  <g id="effective-snapshot" data-node="effective-snapshot" data-source="src/content/docs/ko/blog/clinic-appointment-scheduling-policy.mdx">
    <rect class="card" x="1230" y="300" width="290" height="200" fill="#eef0ff" stroke="#8b8ed1"/>
    <text class="card-title" x="1268" y="350">유효 정책 스냅숏</text>
    <text class="card-id" x="1268" y="378">effective snapshot</text>
    <text class="body" x="1268" y="416">시점 · 세대 · 출처</text>
    <text class="body" x="1268" y="444">· snapshotHash</text>
    <text class="small" x="1268" y="476">같은 입력이면 같은 판단</text>
  </g>

  <g id="booking-decision" data-node="booking-decision" data-source="src/content/docs/ko/blog/clinic-appointment-scheduling-policy.mdx">
    <rect class="card" x="1230" y="610" width="290" height="150" fill="#ffffff" stroke="#477b9e"/>
    <text class="card-title" x="1268" y="660">예약 판단</text>
    <text class="card-id" x="1268" y="688">booking decision</text>
    <text class="body" x="1268" y="726">미래의 요청을 평가</text>
  </g>

  <g id="future-proposal" data-node="future-proposal" data-source="src/content/docs/ko/blog/clinic-appointment-scheduling-policy.mdx">
    <rect class="card" x="870" y="840" width="300" height="110" fill="#fff4e6" stroke="#d9a05b"/>
    <text class="card-title" x="908" y="884">새 제안 · 미래 판단</text>
    <text class="small" x="908" y="916">PROPOSED / HELD는 새 정책 적용 가능</text>
  </g>

  <g id="confirmed-protected" data-node="confirmed-protected" data-source="src/content/docs/ko/blog/clinic-appointment-scheduling-policy.mdx">
    <rect class="card" x="1230" y="840" width="290" height="110" fill="#eaf8f7" stroke="#5aa8a3"/>
    <text class="card-title" x="1268" y="884">확정 방문 약속 보호</text>
    <text class="small" x="1268" y="916">CONFIRMED는 자동으로 다시 쓰지 않음</text>
  </g>

  <path d="M400 255 H440 Q460 255 460 275 V300 Q460 330 450 330 H480" fill="none" stroke="#20639b" stroke-width="4" marker-end="url(#arrow-blue)" data-edge="tenant-default->compose" data-source="tenant-default" data-target="compose" data-role="primary"/>
  <text class="edge-label" x="410" y="224">기준값</text>

  <path d="M400 545 H440 Q460 545 460 525 V500 Q460 470 450 470 H480" fill="none" stroke="#c9791d" stroke-width="4" marker-end="url(#arrow-amber)" data-edge="clinic-override->compose" data-source="clinic-override" data-target="compose" data-role="override"/>
  <text class="edge-label" x="408" y="586">병원별 의도</text>

  <path d="M810 400 H870" fill="none" stroke="#20639b" stroke-width="4" marker-end="url(#arrow-blue)" data-edge="compose->activation-gate" data-source="compose" data-target="activation-gate" data-role="primary"/>
  <text class="edge-label" x="824" y="376">합성</text>

  <path d="M1170 400 H1230" fill="none" stroke="#20639b" stroke-width="4" marker-end="url(#arrow-blue)" data-edge="activation-gate->effective-snapshot" data-source="activation-gate" data-target="effective-snapshot" data-role="primary"/>
  <text class="edge-label" x="1182" y="376">검증</text>

  <path d="M1375 500 V610" fill="none" stroke="#20639b" stroke-width="4" marker-end="url(#arrow-blue)" data-edge="effective-snapshot->booking-decision" data-source="effective-snapshot" data-target="booking-decision" data-role="primary"/>
  <text class="edge-label" x="1392" y="565">정책 읽기</text>

  <path d="M1300 760 V770 Q1300 790 1280 790 H1040 Q1020 790 1020 810 V840" fill="none" stroke="#c9791d" stroke-width="4" marker-end="url(#arrow-amber)" data-edge="booking-decision->future-proposal" data-source="booking-decision" data-target="future-proposal" data-role="future-branch"/>
  <text class="edge-label" x="1040" y="758">새 요청</text>

  <path d="M1450 760 V840" fill="none" stroke="#138a8a" stroke-width="4" marker-end="url(#arrow-teal)" data-edge="booking-decision->confirmed-protected" data-source="booking-decision" data-target="confirmed-protected" data-role="protected-branch"/>
  <text class="edge-label" x="1470" y="806">기존 확정</text>

  <rect x="80" y="720" width="730" height="170" rx="18" fill="#ffffff" stroke="#bdd0df" stroke-width="2"/>
  <text class="note" x="112" y="765">핵심 경계</text>
  <text class="body" x="112" y="802">정책은 미래의 판단 규칙이고, 확정 방문 약속은</text>
  <text class="body" x="112" y="832">이미 환자에게 약속한 결과다. 둘을 같은 값으로</text>
  <text class="body" x="112" y="862">다시 계산하지 않는다.</text>
</svg>
