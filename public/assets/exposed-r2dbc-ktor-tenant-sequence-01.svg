<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ktor R2DBC tenant request sequence</title>
  <desc id="desc">A request with X-TENANT-ID is validated by a Ktor plugin, stored as a call attribute, passed to a tenant transaction helper, and used to switch the R2DBC schema.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#059669" stroke="#059669" stroke-dasharray="none"/>
    </marker>
    <style>
      .canvas { fill: #f8fbff; }
      .title { font: 700 42px "Architects Daughter", "Comic Mono", Inter, sans-serif; fill: #102a43; }
      .subtitle { font: 400 22px "Comic Mono", Inter, sans-serif; fill: #475569; }
      .participant { fill: #ffffff; stroke: #93c5fd; stroke-width: 3; filter: url(#shadow); }
      .participant-alt { fill: #f0fdf4; stroke: #86efac; stroke-width: 3; filter: url(#shadow); }
      .p-title { font: 700 24px "Architects Daughter", "Comic Mono", Inter, sans-serif; fill: #0f172a; text-anchor: middle; }
      .p-sub { font: 400 15px "Comic Mono", Inter, sans-serif; fill: #64748b; text-anchor: middle; }
      .lifeline { stroke: #cbd5e1; stroke-width: 3; stroke-dasharray: 8 10; }
      .msg { stroke: #2563eb; stroke-width: 4.4; marker-end: url(#arrow-blue); stroke-linecap: round; }
      .msg-green { stroke: #059669; stroke-width: 4.4; marker-end: url(#arrow-green); stroke-linecap: round; }
      .return { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 10 8; stroke-linecap: round; }
      .label { font: 700 19px "Comic Mono", Inter, sans-serif; fill: #1e293b; }
      .small { font: 400 16px "Comic Mono", Inter, sans-serif; fill: #475569; }
      .note { fill: #fff7ed; stroke: #fdba74; stroke-width: 2.5; filter: url(#shadow); }
      .note-title { font: 700 22px "Architects Daughter", "Comic Mono", Inter, sans-serif; fill: #9a3412; }
      .note-text { font: 400 17px "Comic Mono", Inter, sans-serif; fill: #7c2d12; }
      .guard { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 2; }
      .guard-text { font: 700 16px "Comic Mono", Inter, sans-serif; fill: #1d4ed8; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="900"/>
  <text class="title" x="80" y="76">Ktor + Exposed R2DBC tenant routing</text>
  <text class="subtitle" x="80" y="112">Raw headers stop at the plugin. Database routing receives validated values.</text>

  <g transform="translate(70 155)">
    <rect class="participant" x="0" y="0" width="210" height="92" rx="18"/>
    <text class="p-title" x="105" y="38">Client</text>
    <text class="p-sub" x="105" y="66">HTTP request</text>
  </g>
  <g transform="translate(355 155)">
    <rect class="participant" x="0" y="0" width="240" height="92" rx="18"/>
    <text class="p-title" x="120" y="38">TenantPlugin</text>
    <text class="p-sub" x="120" y="66">normalize + validate</text>
  </g>
  <g transform="translate(685 155)">
    <rect class="participant" x="0" y="0" width="240" height="92" rx="18"/>
    <text class="p-title" x="120" y="38">Call attributes</text>
    <text class="p-sub" x="120" y="66">Tenants.Tenant</text>
  </g>
  <g transform="translate(1015 155)">
    <rect class="participant" x="0" y="0" width="260" height="92" rx="18"/>
    <text class="p-title" x="130" y="38">Tenant tx helper</text>
    <text class="p-sub" x="130" y="66">suspendTransactionWithTenant</text>
  </g>
  <g transform="translate(1360 155)">
    <rect class="participant-alt" x="0" y="0" width="190" height="92" rx="18"/>
    <text class="p-title" x="95" y="38">R2DBC DB</text>
    <text class="p-sub" x="95" y="66">schema state</text>
  </g>

  <line class="lifeline" x1="175" y1="247" x2="175" y2="790"/>
  <line class="lifeline" x1="475" y1="247" x2="475" y2="790"/>
  <line class="lifeline" x1="805" y1="247" x2="805" y2="790"/>
  <line class="lifeline" x1="1145" y1="247" x2="1145" y2="790"/>
  <line class="lifeline" x1="1455" y1="247" x2="1455" y2="790"/>

  <text class="label" x="205" y="300">GET /actors</text>
  <text class="small" x="205" y="324">X-TENANT-ID: korean</text>
  <line class="msg" x1="175" y1="345" x2="465" y2="345"/>

  <rect class="guard" x="365" y="380" width="220" height="46" rx="12"/>
  <text class="guard-text" x="475" y="410">reject blank / unknown</text>
  <text class="label" x="508" y="374">Tenants.findById()</text>
  <line class="msg-green" x1="475" y1="435" x2="795" y2="435"/>

  <text class="label" x="830" y="468">attributes.put(Tenants.KOREAN)</text>
  <line class="return" x1="805" y1="492" x2="485" y2="492"/>

  <text class="label" x="825" y="548">route reads call.currentTenant()</text>
  <line class="msg" x1="475" y1="570" x2="795" y2="570"/>

  <text class="label" x="840" y="626">tenant enum crosses the boundary</text>
  <line class="msg-green" x1="805" y1="650" x2="1135" y2="650"/>

  <text class="label" x="1174" y="706">SET SCHEMA korean</text>
  <line class="msg-green" x1="1145" y1="730" x2="1445" y2="730"/>

  <text class="label" x="1174" y="768">query actors</text>
  <line class="msg" x1="1145" y1="790" x2="1445" y2="790"/>

  <g transform="translate(74 815)">
    <rect class="note" x="0" y="0" width="1460" height="58" rx="18"/>
    <text class="note-title" x="26" y="36">Boundary rule</text>
    <text class="note-text" x="198" y="36">Do not pass raw header strings to schema selection. Keep request-scoped state in Ktor call attributes, then pass explicit validated values.</text>
  </g>
</svg>
