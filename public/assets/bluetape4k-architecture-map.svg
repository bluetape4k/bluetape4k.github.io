<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k architecture position map</title>
  <desc id="desc">A simplified architecture map showing bluetape4k library positions across Kotlin backend service layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf2ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1440" height="820" fill="url(#bg)"/>

  <text x="80" y="82" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="42" font-weight="400" fill="#0f172a">bluetape4k position map</text>
  <text x="80" y="122" font-family="Comic Mono, SFMono-Regular, Menlo, monospace" font-size="20" fill="#475569">Where the library families sit in a Kotlin backend service stack.</text>

  <g filter="url(#shadow)">
    <rect x="435" y="176" width="570" height="112" rx="22" fill="#0f172a"/>
    <text x="720" y="222" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" font-weight="400" fill="#f8fafc">Application Runtime</text>
    <text x="720" y="258" text-anchor="middle" font-family="Comic Mono, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="400" fill="#93c5fd">Spring Boot · Ktor · Coroutines</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="360" width="255" height="128" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="208" y="413" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" font-weight="400" fill="#1d4ed8">Application Edge</text>
    <text x="208" y="452" text-anchor="middle" font-family="Comic Mono, SFMono-Regular, Menlo, monospace" font-size="18" fill="#334155">HTTP APIs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="398" y="360" width="255" height="128" rx="22" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="526" y="413" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" font-weight="400" fill="#15803d">Persistence</text>
    <text x="526" y="452" text-anchor="middle" font-family="Comic Mono, SFMono-Regular, Menlo, monospace" font-size="18" fill="#334155">Exposed JDBC/R2DBC</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="717" y="360" width="255" height="128" rx="22" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
    <text x="845" y="413" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" font-weight="400" fill="#6d28d9">Integration</text>
    <text x="845" y="452" text-anchor="middle" font-family="Comic Mono, SFMono-Regular, Menlo, monospace" font-size="18" fill="#334155">AWS · Graph · Redis</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="360" width="350" height="128" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="1185" y="413" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" font-weight="400" fill="#c2410c">Operations</text>
    <text x="1185" y="452" text-anchor="middle" font-family="Comic Mono, SFMono-Regular, Menlo, monospace" font-size="17" fill="#334155">Leader · Jobs · Observability</text>
  </g>

  <path d="M560 288 V318 H208 V360" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M650 288 V328 H526 V360" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M790 288 V328 H845 V360" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M890 288 V318 H1185 V360" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="170" y="590" width="500" height="118" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="420" y="636" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" font-weight="400" fill="#0f172a">Foundation Modules</text>
    <text x="420" y="674" text-anchor="middle" font-family="Comic Mono, SFMono-Regular, Menlo, monospace" font-size="18" fill="#334155">Core · Coroutines · Text · Image · Testing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="590" width="500" height="118" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="1020" y="636" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" font-weight="400" fill="#0f172a">Example Applications</text>
    <text x="1020" y="674" text-anchor="middle" font-family="Comic Mono, SFMono-Regular, Menlo, monospace" font-size="18" fill="#334155">Workshops · Clinic · Timefold · R2DBC</text>
  </g>

  <path d="M420 590 V520 H690 V288" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M1020 590 V522 H750 V288" stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="350" y="746" width="740" height="44" rx="22" fill="url(#core)"/>
    <text x="720" y="775" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="19" font-weight="400" fill="#ffffff">Version governance supports every layer through the central BOM</text>
  </g>
</svg>
