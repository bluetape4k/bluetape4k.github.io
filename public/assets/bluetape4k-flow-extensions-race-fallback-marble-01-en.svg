<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">Race and fallback Flow marble diagram</title>
  <desc id="desc">A marble diagram comparing latency-first race, strict concat fallback, and merge partial contribution.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ed8ff" stroke="#9ed8ff"/></marker>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <linearGradient id="operatorGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#26384f"/><stop offset="100%" stop-color="#172033"/></linearGradient>
    <radialGradient id="marbleBlue" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#d8efff"/><stop offset="34%" stop-color="#67b7ee"/><stop offset="100%" stop-color="#1f5f99"/></radialGradient>
    <radialGradient id="marbleGreen" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#dff8c7"/><stop offset="36%" stop-color="#83c95a"/><stop offset="100%" stop-color="#3f7b2a"/></radialGradient>
    <radialGradient id="marbleOrange" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#ffd9bc"/><stop offset="36%" stop-color="#e28a46"/><stop offset="100%" stop-color="#9c4b1f"/></radialGradient>
    <radialGradient id="marblePurple" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#f0e7ff"/><stop offset="36%" stop-color="#a98be9"/><stop offset="100%" stop-color="#6840a8"/></radialGradient>
    <filter id="panelShadow" x="-8%" y="-12%" width="116%" height="124%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
    <filter id="marbleShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#020617" flood-opacity="0.42"/></filter>
    <filter id="laneGlow" x="-4%" y="-120%" width="108%" height="340%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.35"/></filter>
    <style>
      .bg { fill: url(#bgGradient); } .panel { fill: url(#panelGradient); stroke: #536377; stroke-width: 2; rx: 18; filter: url(#panelShadow); }
      .title { font: 24px "Architects Daughter", "Comic Mono", system-ui, sans-serif; fill: #f8fafc; }
      .sub,.small { font: 13px "Comic Mono", ui-monospace, monospace; fill: #b6c4d6; }
      .label { font: 15px "Comic Mono", ui-monospace, monospace; fill: #e5edf7; }
      .tiny { font: 11px "Comic Mono", ui-monospace, monospace; fill: #f8fafc; text-anchor: middle; dominant-baseline: middle; font-weight: 700; }
      .result { font: 12px "Comic Mono", ui-monospace, monospace; fill: #d8e5f2; text-anchor: middle; }
      .edge { stroke: #9ed8ff; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); filter: url(#laneGlow); }
      .shape { stroke: #e8f7ff; stroke-width: 1.8; filter: url(#marbleShadow); }
      .box { fill: #172033; stroke-width: 2.5; rx: 14; } .op { fill: url(#operatorGradient); stroke: #7dd3fc; }
      .cancel { stroke: #fda4af; stroke-width: 4; stroke-linecap: round; }
      .blue { fill: url(#marbleBlue); } .green { fill: url(#marbleGreen); } .orange { fill: url(#marbleOrange); } .purple { fill: url(#marblePurple); }
    </style>
  </defs>
  <rect class="bg" width="920" height="460"/><rect class="panel" x="24" y="22" width="872" height="416"/>
  <text class="title" x="52" y="58">race / fallback: latency, priority, and partial merge are different</text>
  <text class="sub" x="52" y="84">race cancels losers; concat preserves source priority; merge keeps partial contributions</text>

  <text class="small" x="52" y="154">sources</text>
  <path class="edge" d="M150 150 L806 150"/>
  <circle class="shape blue" cx="420" cy="150" r="13"/><text class="tiny" x="420" y="150">C</text><text class="result" x="420" y="180">cache 200ms</text>
  <path class="shape green" d="M 300 133 L 317 150 L 300 167 L 283 150 Z"/><text class="tiny" x="300" y="150">R</text><text class="result" x="300" y="180">replica 20ms</text>
  <rect class="shape orange" x="504" y="137" width="34" height="26" rx="7"/><text class="tiny" x="521" y="150">A</text><text class="result" x="521" y="180">remote 120ms</text>

  <rect class="box op" x="236" y="228" width="128" height="48"/><text class="label" x="300" y="257" text-anchor="middle">race / amb</text>
  <path d="M 300 168 V 228" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M 420 168 V 248" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/><path class="cancel" d="M 405 240 L 435 270 M 435 240 L 405 270"/>
  <path d="M 521 168 V 248" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/><path class="cancel" d="M 506 240 L 536 270 M 536 240 L 506 270"/>
  <text class="small" x="52" y="334">winner</text>
  <path class="edge" d="M150 330 L806 330"/>
  <rect class="box" x="252" y="308" width="96" height="44" stroke="#62984d"/><path class="shape green" d="M 300 318 L 312 330 L 300 342 L 288 330 Z"/><text class="tiny" x="300" y="330">R</text>
  <text class="result" x="300" y="372">latency-first winner</text>

  <rect class="box op" x="468" y="228" width="122" height="48"/><text class="label" x="529" y="257" text-anchor="middle">concat</text>
  <text class="result" x="529" y="288">priority order</text>
  <rect class="box op" x="640" y="228" width="122" height="48"/><text class="label" x="701" y="257" text-anchor="middle">merge</text>
  <text class="result" x="701" y="288">partial results</text>
  <rect class="box" x="474" y="390" width="152" height="38" stroke="#8b6bd6"/><text class="tiny" x="550" y="409">cache -> replica -> remote</text>
  <rect class="box" x="666" y="390" width="116" height="38" stroke="#c26b3d"/><text class="tiny" x="724" y="409">C + R + A</text>
</svg>
