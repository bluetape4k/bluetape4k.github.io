<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k 생태계의 계층과 선택 경계</title>
  <desc id="desc">Spring Boot 4 또는 Ktor 3 서비스가 애플리케이션 경계를 소유하고, Bluetape4k의 도메인 기능, 데이터, 인프라, 기반 계층 중 필요한 부분만 선택해 조합하는 책임 지도.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="service" x1="0" x2="1">
      <stop offset="0" stop-color="#12395b"/>
      <stop offset="1" stop-color="#172e58"/>
    </linearGradient>
    <style>
      .title { font: 700 44px "goorm Sans", sans-serif; fill: #f8fafc; }
      .subtitle { font: 500 20px "goorm Sans", sans-serif; fill: #b7c8e2; }
      .eyebrow { font: 800 16px "goorm Sans Code", monospace; letter-spacing: 1.2px; }
      .service-title { font: 700 31px "goorm Sans", sans-serif; fill: #f8fafc; }
      .service-body { font: 500 19px "goorm Sans", sans-serif; fill: #c9dcf5; }
      .layer-title { font: 700 27px "goorm Sans", sans-serif; fill: #f8fafc; }
      .layer-body { font: 500 18px "goorm Sans", sans-serif; fill: #c9d8eb; }
      .code { font: 600 17px "goorm Sans Code", monospace; fill: #d3ecff; }
      .frame-title { font: 800 18px "goorm Sans", sans-serif; fill: #a8c7e8; }
      .note { font: 700 19px "goorm Sans", sans-serif; fill: #dcecff; }
      .small-note { font: 500 16px "goorm Sans", sans-serif; fill: #a9bfdc; }
      .badge-body { font: 500 16px "goorm Sans", sans-serif; fill: #1d2940; }
    .syntax-keyword{fill:#d8b4fe}.syntax-type{fill:#8de4d4}.syntax-operator{fill:#f9c98f}</style>
  </defs>

  <rect width="1600" height="1280" fill="url(#background)"/>
  <circle cx="1495" cy="118" r="245" fill="#1d4d78" opacity="0.24"/>
  <circle cx="100" cy="1215" r="260" fill="#3a236b" opacity="0.20"/>

  <text x="90" y="95" class="title">Bluetape4k 생태계의 계층과 선택 경계</text>
  <text x="90" y="135" class="subtitle">서비스가 소유하는 애플리케이션 경계 아래에서 필요한 책임 계층만 골라 조합합니다.</text>
  <rect x="90" y="170" width="1420" height="2" fill="#355277"/>

  <rect x="90" y="215" width="1420" height="186" rx="28" fill="url(#service)" stroke="#4f9ad1" stroke-width="3"/>
  <rect x="132" y="251" width="210" height="34" rx="17" fill="#73d4ff"/>
  <text x="156" y="274" class="eyebrow" fill="#07111f">서비스 소유 경계</text>
  <text x="132" y="333" class="service-title">Spring Boot 4 / Ktor 3 애플리케이션</text>
  <text x="132" y="370" class="service-body">HTTP API, 요청 처리, 서비스 조합, 운영 책임은 애플리케이션이 맡습니다.</text>
  <rect x="1118" y="262" width="330" height="90" rx="18" fill="#102541" stroke="#3d79ad" stroke-width="2"/>
  <text x="1150" y="300" class="code">spring-boot/*</text>
  <text x="1150" y="331" class="code">*-ktor · examples</text>

  <rect x="90" y="450" width="1420" height="730" rx="30" fill="#101c31" opacity="0.94" stroke="#314d72" stroke-width="3"/>
  <text x="132" y="502" class="frame-title">선택 가능한 Bluetape4k 책임 계층</text>
  <rect x="1004" y="470" width="442" height="52" rx="18" fill="#1b3153" stroke="#416c98" stroke-width="2"/>
  <text x="1034" y="503" class="note">필요한 계층만 선택해 조합</text>

  <rect x="132" y="546" width="1316" height="126" rx="22" fill="#1d2448" stroke="#7c6ee6" stroke-width="2"/>
  <rect x="160" y="572" width="260" height="72" rx="18" fill="#bca7ff"/>
  <text x="190" y="601" class="eyebrow" fill="#20173e">도메인 기능</text>
  <text x="190" y="628" class="badge-body">서비스 문제에 가까운 기능</text>
  <text x="460" y="598" class="layer-title">서비스 요구를 구현하는 기능</text>
  <text x="460" y="631" class="layer-body">리더 선출, 감사 이력, 이미지·텍스트 처리, 그래프 데이터베이스</text>
  <text x="460" y="657" class="code">Leader · JaVers · Image · Text · Graph</text>

  <rect x="132" y="696" width="1316" height="126" rx="22" fill="#123a43" stroke="#4dc6c8" stroke-width="2"/>
  <rect x="160" y="722" width="260" height="72" rx="18" fill="#5eead4"/>
  <text x="190" y="752" class="eyebrow" fill="#082f32">데이터</text>
  <text x="190" y="779" class="badge-body">영속화와 데이터 접근</text>
  <text x="460" y="748" class="layer-title">데이터를 저장하고 읽는 경계</text>
  <text x="460" y="781" class="layer-body">JDBC·R2DBC, Exposed, 문서형·와이드 컬럼 데이터베이스, 그래프 어댑터</text>
  <text x="460" y="807" class="code"><tspan class="syntax-type">Exposed</tspan> · <tspan class="syntax-keyword">data</tspan><tspan class="syntax-operator">/</tspan><tspan class="syntax-operator">*</tspan> · <tspan class="syntax-type">GraphDB</tspan> adapters</text>

  <rect x="132" y="846" width="1316" height="126" rx="22" fill="#3b2d1f" stroke="#e8ab61" stroke-width="2"/>
  <rect x="160" y="872" width="260" height="72" rx="18" fill="#fdba74"/>
  <text x="190" y="902" class="eyebrow" fill="#422006">인프라</text>
  <text x="190" y="929" class="badge-body">운영과 연결성</text>
  <text x="460" y="898" class="layer-title">운영 환경과 연결하는 기능</text>
  <text x="460" y="931" class="layer-body">클라우드, 메시징, 캐시, 관측성, 복원력</text>
  <text x="460" y="957" class="code">AWS · Kafka · NATS · Redis · Micrometer · OpenTelemetry</text>

  <rect x="132" y="996" width="1316" height="126" rx="22" fill="#183b31" stroke="#74cb9b" stroke-width="2"/>
  <rect x="160" y="1022" width="260" height="72" rx="18" fill="#86efac"/>
  <text x="190" y="1052" class="eyebrow" fill="#123622">기반</text>
  <text x="190" y="1079" class="badge-body">공통 Kotlin/JVM 기반</text>
  <text x="460" y="1048" class="layer-title">모듈이 함께 쓰는 기본기</text>
  <text x="460" y="1081" class="layer-body">재사용되는 언어·동시성·로깅·테스트·의존성 정렬</text>
  <text x="460" y="1107" class="code">core · coroutines · logging · testing · BOM</text>

  <text x="132" y="1153" class="small-note">이 그림은 의존성 그래프가 아니라, 서비스를 설계할 때 읽고 선택하는 책임 지도입니다.</text>
</svg>
