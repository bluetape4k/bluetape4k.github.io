<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">일반 Exposed JDBC benchmark 처리량</title>
  <desc id="desc">기준 설정에서 Exposed JDBC 설정을 조정하며 전체 처리량이 높아지는 과정을 보여 주는 막대 차트.</desc>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="64" y="62" width="1072" height="506" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="122" font-family="goorm Sans" font-size="40" font-weight="700" fill="#f8fafc">일반 Exposed JDBC Benchmark</text>
  <text x="98" y="162" font-family="goorm Sans Code" font-size="21" fill="#cbd5e1">PostgreSQL Testcontainers · CRUD/JOIN 전체 ops/sec</text>
  <g font-family="goorm Sans Code" font-size="15" fill="#cbd5e1">
    <line x1="122" y1="468" x2="1068" y2="468" stroke="#64748b" stroke-width="2"/>
    <line x1="122" y1="218" x2="122" y2="468" stroke="#64748b" stroke-width="2"/>
    <line x1="122" y1="343" x2="1068" y2="343" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="122" y1="218" x2="1068" y2="218" stroke="#1f2937" stroke-width="1.5"/>
    <text x="104" y="473" text-anchor="end">0</text>
    <text x="104" y="348" text-anchor="end">25k</text>
    <text x="104" y="223" text-anchor="end">50k</text>
  </g>
  <g font-family="goorm Sans Code" font-size="16" fill="#e2e8f0">
    <rect x="170" y="341" width="92" height="127" rx="12" fill="#f59e0b" stroke="#fbbf24"/>
    <text x="216" y="329" text-anchor="middle">25,400</text>
    <text x="216" y="500" text-anchor="middle">기준</text>
    <rect x="392" y="251" width="92" height="217" rx="12" fill="#60a5fa" stroke="#93c5fd"/>
    <text x="438" y="239" text-anchor="middle">43,487</text>
    <text x="438" y="500" text-anchor="middle">Pool</text>
    <text x="438" y="520" text-anchor="middle">+ thread</text>
    <rect x="614" y="247" width="92" height="221" rx="12" fill="#34d399" stroke="#86efac"/>
    <text x="660" y="235" text-anchor="middle">44,161</text>
    <text x="660" y="500" text-anchor="middle">index</text>
    <text x="660" y="520" text-anchor="middle">추가</text>
    <rect x="836" y="241" width="92" height="227" rx="12" fill="#8bb7f0" stroke="#5f94cf"/>
    <text x="882" y="229" text-anchor="middle">45,431</text>
    <text x="882" y="500" text-anchor="middle">설정</text>
    <text x="882" y="520" text-anchor="middle">강화</text>
  </g>
  <text x="96" y="548" font-family="goorm Sans Code" font-size="17" fill="#cbd5e1">pool/thread 균형과 JOIN index를 조정해 일반 JDBC 경로를 25.4k에서 45.4k ops/sec로 높였습니다.</text>
</svg>
