<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">How Patient A's actions and events become a visit commitment</title>
  <desc id="desc">A time-ordered view separates Patient A's actions, appointment-service processing, and objective events such as PurchaseCompleted, AppointmentPlanCreated, AppointmentCreated, and TreatmentFulfillmentEvent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <linearGradient id="actionFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2816"/><stop offset="1" stop-color="#282034"/></linearGradient>
    <linearGradient id="processingFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#142d49"/><stop offset="1" stop-color="#20214a"/></linearGradient>
    <linearGradient id="eventFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12384a"/><stop offset="1" stop-color="#15324a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.58"/></filter>
    <marker id="primaryArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#67e8f9" data-solid-head="true"/></marker>
    <marker id="actionArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#fbbf24" data-solid-head="true"/></marker>
    <style>
      .title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:40px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:19px;fill:#aebed2}.lane{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}.lane-note{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:14px;fill:#aebed2}.step{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:17px;font-weight:700;fill:#dbeafe}.card-title{font-family:"Architects Daughter","goorm Sans",sans-serif;font-size:19px;font-weight:700;fill:#f8fafc}.body{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:15px;fill:#d7e3f3}.code{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:14px;font-weight:700;fill:#f8fafc}.small{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:13px;fill:#aebed2}.status{font-family:"Comic Mono","goorm Sans Code",monospace;font-size:12px;font-weight:700;fill:#f8fafc}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:4}.action-line{stroke:#fbbf24;marker-end:url(#actionArrow)}.primary-line{stroke:#67e8f9;marker-end:url(#primaryArrow)}
    </style>
  </defs>
  <rect width="1800" height="1100" fill="url(#bg)"/><rect width="1800" height="1100" rx="34" fill="url(#bg)"/><rect x="28" y="28" width="1744" height="1044" rx="30" fill="none" stroke="#263a5e" stroke-width="2"/>
  <circle cx="1650" cy="130" r="210" fill="#7c3aed" opacity=".08"/><circle cx="130" cy="960" r="230" fill="#0891b2" opacity=".07"/>
  <text class="title" x="70" y="78">Patient A: actions and events become a visit commitment</text><text class="subtitle" x="72" y="116">An action is an intentional command; an event is an objective fact the appointment service has committed.</text>
  <g transform="translate(1120 54)"><rect x="0" y="0" width="20" height="20" rx="6" fill="#3a2816" stroke="#fbbf24" stroke-width="2"/><text class="small" x="30" y="16">Action / command</text><rect x="220" y="0" width="20" height="20" rx="6" fill="#12384a" stroke="#2dd4bf" stroke-width="2"/><text class="small" x="250" y="16">Event / objective fact</text></g>
  <path class="connector primary-line" data-connector="timeline-1-2" d="M 470 164 H 490"/><path class="connector primary-line" data-connector="timeline-2-3" d="M 710 164 H 730"/><path class="connector primary-line" data-connector="timeline-3-4" d="M 950 164 H 970"/><path class="connector primary-line" data-connector="timeline-4-5" d="M 1190 164 H 1210"/><path class="connector primary-line" data-connector="timeline-5-6" d="M 1430 164 H 1450"/>
  <g><circle cx="360" cy="164" r="12" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><circle cx="600" cy="164" r="12" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><circle cx="840" cy="164" r="12" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><circle cx="1080" cy="164" r="12" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><circle cx="1320" cy="164" r="12" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><circle cx="1560" cy="164" r="12" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/><text class="step" x="360" y="136" text-anchor="middle">01</text><text class="step" x="600" y="136" text-anchor="middle">02</text><text class="step" x="840" y="136" text-anchor="middle">03</text><text class="step" x="1080" y="136" text-anchor="middle">04</text><text class="step" x="1320" y="136" text-anchor="middle">05</text><text class="step" x="1560" y="136" text-anchor="middle">06</text></g>
  <g><rect x="62" y="216" width="154" height="178" rx="22" fill="#251b2b" stroke="#fbbf24" stroke-width="2"/><text class="lane" x="139" y="278" text-anchor="middle">Action</text><text class="lane-note" x="139" y="310" text-anchor="middle">intentional command</text><text class="lane-note" x="139" y="334" text-anchor="middle">or visit behavior</text><rect x="62" y="446" width="154" height="178" rx="22" fill="#132541" stroke="#60a5fa" stroke-width="2"/><text class="lane" x="139" y="508" text-anchor="middle">Scheduling</text><text class="lane-note" x="139" y="540" text-anchor="middle">validate / plan / state</text><text class="lane-note" x="139" y="564" text-anchor="middle">commit / follow up</text><rect x="62" y="676" width="154" height="178" rx="22" fill="#123447" stroke="#2dd4bf" stroke-width="2"/><text class="lane" x="139" y="738" text-anchor="middle">Event</text><text class="lane-note" x="139" y="770" text-anchor="middle">committed objective</text><text class="lane-note" x="139" y="794" text-anchor="middle">fact and handoff clue</text></g>
  <g filter="url(#shadow)">
    <rect x="250" y="216" width="220" height="178" rx="20" fill="url(#actionFill)" stroke="#fbbf24" stroke-width="2"/><rect x="266" y="232" width="82" height="25" rx="12" fill="#92400e"/><text class="status" x="307" y="250" text-anchor="middle">Current</text><text class="card-title" x="360" y="292" text-anchor="middle">Buy event product</text><text class="body" x="360" y="326" text-anchor="middle">one usable benefit</text><text class="body" x="360" y="350" text-anchor="middle">inside a validity window</text>
    <rect x="490" y="216" width="220" height="178" rx="20" fill="url(#actionFill)" stroke="#fbbf24" stroke-width="2"/><rect x="506" y="232" width="82" height="25" rx="12" fill="#92400e"/><text class="status" x="547" y="250" text-anchor="middle">Current</text><text class="card-title" x="600" y="292" text-anchor="middle">Add multi-visit</text><text class="body" x="600" y="326" text-anchor="middle">buy several visits</text><text class="body" x="600" y="350" text-anchor="middle">track what remains</text>
    <rect x="730" y="216" width="220" height="178" rx="20" fill="url(#actionFill)" stroke="#fbbf24" stroke-width="2"/><rect x="746" y="232" width="82" height="25" rx="12" fill="#92400e"/><text class="status" x="787" y="250" text-anchor="middle">Current</text><text class="card-title" x="840" y="286" text-anchor="middle"><tspan x="840" dy="0">Choose package</tspan><tspan x="840" dy="24">items</tspan></text><text class="body" x="840" y="344" text-anchor="middle">treatments and rules</text><text class="body" x="840" y="368" text-anchor="middle">may span visits</text>
    <rect x="970" y="216" width="220" height="178" rx="20" fill="url(#actionFill)" stroke="#fbbf24" stroke-width="2"/><rect x="986" y="232" width="82" height="25" rx="12" fill="#78350f"/><text class="status" x="1027" y="250" text-anchor="middle">Design</text><text class="card-title" x="1080" y="286" text-anchor="middle"><tspan x="1080" dy="0">Request preferred</tspan><tspan x="1080" dy="24">date</tspan></text><text class="body" x="1080" y="344" text-anchor="middle">send patient preference</text><text class="body" x="1080" y="368" text-anchor="middle">items and time window</text>
    <rect x="1210" y="216" width="220" height="178" rx="20" fill="url(#actionFill)" stroke="#fbbf24" stroke-width="2"/><rect x="1226" y="232" width="82" height="25" rx="12" fill="#78350f"/><text class="status" x="1267" y="250" text-anchor="middle">Design</text><text class="card-title" x="1320" y="286" text-anchor="middle"><tspan x="1320" dy="0">Agree to time</tspan><tspan x="1320" dy="24">and items</tspan></text><text class="body" x="1320" y="344" text-anchor="middle">review policy snapshot</text><text class="body" x="1320" y="368" text-anchor="middle">accept the commitment</text>
    <rect x="1450" y="216" width="220" height="178" rx="20" fill="url(#actionFill)" stroke="#fbbf24" stroke-width="2"/><rect x="1466" y="232" width="82" height="25" rx="12" fill="#92400e"/><text class="status" x="1507" y="250" text-anchor="middle">Observed</text><text class="card-title" x="1560" y="286" text-anchor="middle"><tspan x="1560" dy="0">Check in and</tspan><tspan x="1560" dy="24">receive care</tspan></text><text class="body" x="1560" y="344" text-anchor="middle">partial or complete care</text><text class="body" x="1560" y="368" text-anchor="middle">actual visit behavior</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="250" y="446" width="220" height="178" rx="20" fill="url(#processingFill)" stroke="#60a5fa" stroke-width="2"/><text class="card-title" x="360" y="494" text-anchor="middle">Validate purchase</text><text class="body" x="360" y="532" text-anchor="middle">product-version snapshot</text><text class="code" x="360" y="566" text-anchor="middle">PurchaseCompleted</text>
    <rect x="490" y="446" width="220" height="178" rx="20" fill="url(#processingFill)" stroke="#60a5fa" stroke-width="2"/><text class="card-title" x="600" y="494" text-anchor="middle">Expand plan</text><text class="code" x="600" y="532" text-anchor="middle">PlannedTreatment 1..N</text><text class="body" x="600" y="566" text-anchor="middle">preserve obligations</text>
    <rect x="730" y="446" width="220" height="178" rx="20" fill="url(#processingFill)" stroke="#60a5fa" stroke-width="2"/><text class="card-title" x="840" y="494" text-anchor="middle">Expand BOM / DAG</text><text class="body" x="840" y="532" text-anchor="middle">resources and order</text><text class="body" x="840" y="566" text-anchor="middle">separate remaining items</text>
    <rect x="970" y="446" width="220" height="178" rx="20" fill="url(#processingFill)" stroke="#60a5fa" stroke-width="2"/><text class="card-title" x="1080" y="494" text-anchor="middle">Calculate and hold</text><text class="body" x="1080" y="532" text-anchor="middle">PROPOSED -&gt; HELD</text><text class="body" x="1080" y="566" text-anchor="middle">temporary resource hold</text>
    <rect x="1210" y="446" width="220" height="178" rx="20" fill="url(#processingFill)" stroke="#60a5fa" stroke-width="2"/><text class="card-title" x="1320" y="494" text-anchor="middle">Confirm commitment</text><text class="body" x="1320" y="532" text-anchor="middle">consent and capacity</text><text class="body" x="1320" y="566" text-anchor="middle">freeze plan revision</text>
    <rect x="1450" y="446" width="220" height="178" rx="20" fill="url(#processingFill)" stroke="#60a5fa" stroke-width="2"/><text class="card-title" x="1560" y="482" text-anchor="middle"><tspan x="1560" dy="0">Split complete /</tspan><tspan x="1560" dy="24">remaining</tspan></text><text class="body" x="1560" y="544" text-anchor="middle"><tspan x="1560" dy="0">clinical source</tspan><tspan x="1560" dy="24">stays external</tspan></text><text class="body" x="1560" y="596" text-anchor="middle">prepare CRM handoff</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="250" y="676" width="220" height="178" rx="20" fill="url(#eventFill)" stroke="#2dd4bf" stroke-width="2"/><text class="code" x="360" y="732" text-anchor="middle">PurchaseCompleted</text><text class="body" x="360" y="770" text-anchor="middle">purchase-completed event</text><text class="small" x="360" y="808" text-anchor="middle">input to plan expansion</text>
    <rect x="490" y="676" width="220" height="178" rx="20" fill="url(#eventFill)" stroke="#2dd4bf" stroke-width="2"/><text class="code" x="600" y="732" text-anchor="middle">AppointmentPlanCreated</text><text class="body" x="600" y="770" text-anchor="middle">one plan per purchase</text><text class="small" x="600" y="808" text-anchor="middle">not a slot reservation</text>
    <rect x="730" y="676" width="220" height="178" rx="20" fill="url(#eventFill)" stroke="#2dd4bf" stroke-width="2"/><text class="card-title" x="840" y="732" text-anchor="middle">Plan item ready</text><text class="body" x="840" y="760" text-anchor="middle"><tspan x="840" dy="0">remaining obligation</tspan><tspan x="840" dy="24">visible</tspan></text><text class="small" x="840" y="820" text-anchor="middle">package / multi-visit tracking</text>
    <rect x="970" y="676" width="220" height="178" rx="20" fill="url(#eventFill)" stroke="#2dd4bf" stroke-width="2"/><text class="code" x="1080" y="732" text-anchor="middle">AppointmentProposed</text><text class="body" x="1080" y="770" text-anchor="middle">temporary state event</text><text class="small" x="1080" y="808" text-anchor="middle">not a confirmed commitment</text>
    <rect x="1210" y="676" width="220" height="178" rx="20" fill="url(#eventFill)" stroke="#2dd4bf" stroke-width="2"/><text class="code" x="1320" y="732" text-anchor="middle">AppointmentCreated</text><text class="body" x="1320" y="760" text-anchor="middle"><tspan x="1320" dy="0">CONFIRMED visit</tspan><tspan x="1320" dy="24">commitment</tspan></text><text class="small" x="1320" y="820" text-anchor="middle">consent and snapshot included</text>
    <rect x="1450" y="676" width="220" height="178" rx="20" fill="url(#eventFill)" stroke="#2dd4bf" stroke-width="2"/><text class="code" x="1560" y="722" text-anchor="middle"><tspan x="1560" dy="0">TreatmentFulfillment</tspan><tspan x="1560" dy="22">Event</tspan></text><text class="body" x="1560" y="776" text-anchor="middle">attendance / complete / remaining</text><text class="small" x="1560" y="812" text-anchor="middle">reschedule and counseling clue</text>
  </g>
  <g><path class="connector action-line" data-connector="action-1-process" d="M 360 394 V 446"/><path class="connector action-line" data-connector="action-2-process" d="M 600 394 V 446"/><path class="connector action-line" data-connector="action-3-process" d="M 840 394 V 446"/><path class="connector action-line" data-connector="action-4-process" d="M 1080 394 V 446"/><path class="connector action-line" data-connector="action-5-process" d="M 1320 394 V 446"/><path class="connector action-line" data-connector="action-6-process" d="M 1560 394 V 446"/><path class="connector primary-line" data-connector="process-1-event" d="M 360 624 V 676"/><path class="connector primary-line" data-connector="process-2-event" d="M 600 624 V 676"/><path class="connector primary-line" data-connector="process-3-event" d="M 840 624 V 676"/><path class="connector primary-line" data-connector="process-4-event" d="M 1080 624 V 676"/><path class="connector primary-line" data-connector="process-5-event" d="M 1320 624 V 676"/><path class="connector primary-line" data-connector="process-6-event" d="M 1560 624 V 676"/></g>
  <rect x="62" y="920" width="1608" height="116" rx="22" fill="#0b1628" stroke="#2b4168" stroke-width="2"/><text class="small" x="90" y="955">Reading rule</text><text class="body" x="90" y="985">A purchase event creates a plan but does not confirm a slot. A confirmed visit and clinical completion are different events.</text><text class="body" x="90" y="1012">After partial completion or interruption, remaining obligations return to a future proposal. No-show and VIP policy stays outside scheduling authority.</text>
</svg>
