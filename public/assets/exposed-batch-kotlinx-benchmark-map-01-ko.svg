<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">배치 벤치마크 결과의 생성 경로</title><desc id="desc">테스트는 기능을 검증하고, 벤치마크는 고정된 조건에서 성능을 측정합니다.</desc><defs><marker id="arrow-cyan" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#36C5F0"/></marker><marker id="arrow-mint" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5EEAD4"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FBBF24"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FB7185"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A78BFA"/></marker></defs>
  <style>
  .bg{fill:#07111F}.panel{fill:#0D1B2D;stroke:#36536F;stroke-width:2}.card{fill:#10243A;stroke:#36536F;stroke-width:2}.card2{fill:#132B43;stroke:#36536F;stroke-width:2}
  .title{font:700 42px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}.sub{font:600 19px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}.h{font:700 24px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
  .body{font:600 17px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}.mono{font:700 16px "goorm Sans Code","goorm Sans",monospace;fill:#E6F2FF}.small{font:600 14px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
  .life{stroke:#36536F;stroke-width:2;stroke-dasharray:8 9}.act{fill:#123252;stroke:#36C5F0;stroke-width:2}
  .call{fill:none;stroke:#36C5F0;stroke-width:4;marker-end:url(#arrow-cyan)}.ok{fill:none;stroke:#5EEAD4;stroke-width:4;marker-end:url(#arrow-mint)}
  .warn{fill:none;stroke:#FBBF24;stroke-width:4;marker-end:url(#arrow-amber)}.err{fill:none;stroke:#FB7185;stroke-width:4;marker-end:url(#arrow-red)}
  .violet{fill:none;stroke:#A78BFA;stroke-width:4;marker-end:url(#arrow-violet)}.return{stroke-dasharray:10 8}
  .pill{fill:#10243A;stroke:#36536F;stroke-width:2}.frame{fill:none;stroke:#FB7185;stroke-width:2;stroke-dasharray:10 8}
  .axis{stroke:#36536F;stroke-width:2}.grid{stroke:#233B54;stroke-width:1}.footer{fill:#0B2238;stroke:#36536F;stroke-width:2}
  </style>
<rect width="1600" height="820" class="bg"/><rect x="32" y="32" width="1536" height="756" rx="30" class="panel frame"/>
<text x="78" y="98" class="title">배치 벤치마크 결과의 생성 경로</text><text x="80" y="138" class="sub subtitle">측정 조건과 결과 문서를 같은 생성 경로에 두어 수치와 설명의 불일치를 줄입니다.</text><rect x="45" y="260" width="270" height="220" rx="20" class="card"/>
<text x="69" y="304" class="h">Gradle 실행 프로필</text><text x="69" y="342" class="body">DB·드라이버별 실행</text><text x="69" y="372" class="body">워밍업·반복 조건</text><rect x="355" y="260" width="270" height="220" rx="20" class="card"/>
<text x="379" y="304" class="h">JMH 벤치마크</text><text x="379" y="342" class="body">@Param 비교 행렬</text><text x="379" y="372" class="body">시드·전체 작업 분리</text><rect x="665" y="260" width="270" height="220" rx="20" class="card2"/>
<text x="689" y="304" class="h">JSON 보고서</text><text x="689" y="342" class="body">원시 측정 결과</text><text x="689" y="372" class="body">작업별 ops/sec·avg ms</text><rect x="975" y="260" width="270" height="220" rx="20" class="card"/>
<text x="999" y="304" class="h">문서 생성기</text><text x="999" y="342" class="body">표·차트 생성</text><text x="999" y="372" class="body">조건과 단위 유지</text><rect x="1285" y="260" width="270" height="220" rx="20" class="card"/>
<text x="1309" y="304" class="h">독자용 문서</text><text x="1309" y="342" class="body">Markdown 상세 결과</text><text x="1309" y="372" class="body">추세와 한계 설명</text><path d="M315 370 H339" class="call"/><text x="327" y="338" text-anchor="middle" class="small">실행</text><path d="M625 370 H649" class="call"/><text x="637" y="338" text-anchor="middle" class="small">기록</text><path d="M935 370 H959" class="call"/><text x="947" y="338" text-anchor="middle" class="small">변환</text><path d="M1245 370 H1269" class="call"/><text x="1257" y="338" text-anchor="middle" class="small">게시</text><rect x="170" y="650" width="1260" height="84" rx="20" class="footer"/><text x="800" y="700" text-anchor="middle" class="body">테스트는 기능을 검증하고, 벤치마크는 고정된 조건에서 성능을 측정합니다.</text></svg>
