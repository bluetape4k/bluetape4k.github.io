<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">한 번의 업무 변경에서 발생하는 감사 비용</title>
  <desc id="desc">업무 변경이 원본 상태 저장과 JaVers commit으로 나뉘고, commit metadata와 snapshot을 저장한 뒤 감사 조회에서 다시 결합되는 구조를 보여준다.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f" />
      <stop offset="0.56" stop-color="#0c1730" />
      <stop offset="1" stop-color="#11152b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.58" />
    </filter>
    <marker id="arrowCyan" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#58a6c9" />
    </marker>
    <marker id="arrowPurple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#a78bfa" />
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#82b366" />
    </marker>
    <style>
      .title { font-family: 'goorm Sans', 'Architects Daughter', sans-serif; font-size: 42px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'goorm Sans Code', 'Comic Mono', monospace; font-size: 19px; fill: #a9b8d4; }
      .card-title { font-family: 'goorm Sans', 'Architects Daughter', sans-serif; font-size: 27px; font-weight: 700; fill: #f8fafc; }
      .body { font-family: 'goorm Sans Code', 'Comic Mono', monospace; font-size: 17px; fill: #c7d3e7; }
      .small { font-family: 'goorm Sans Code', 'Comic Mono', monospace; font-size: 15px; fill: #a9b8d4; }
      .chip { font-family: 'goorm Sans Code', 'Comic Mono', monospace; font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .connector { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .cyan { stroke: #58a6c9; marker-end: url(#arrowCyan); }
      .purple { stroke: #a78bfa; marker-end: url(#arrowPurple); }
      .green { stroke: #82b366; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1600" height="980" rx="32" fill="url(#canvas)" />
  <rect x="28" y="28" width="1544" height="924" rx="28" fill="none" stroke="#263a5e" stroke-width="2" />
  <text class="title" x="800" y="78" text-anchor="middle">감사 이력은 어디에서 비용을 만드는가</text>
  <text class="subtitle" x="800" y="114" text-anchor="middle">원본 저장 · commit metadata · snapshot · 결합 조회를 하나의 비용 경계로 봅니다.</text>

  <path class="connector cyan" data-connector="change-source" d="M 700 260 V 300 Q 700 316 684 316 H 370 Q 350 316 350 336 V 360" />
  <path class="connector purple" data-connector="change-commit" d="M 900 260 V 300 Q 900 316 916 316 H 1230 Q 1250 316 1250 336 V 360" />
  <path class="connector purple" data-connector="commit-metadata" d="M 1160 560 V 586 Q 1160 600 1146 600 H 974 Q 960 600 960 614 V 640" />
  <path class="connector purple" data-connector="commit-snapshot" d="M 1340 560 V 586 Q 1340 600 1354 600 H 1436 Q 1450 600 1450 614 V 640" />
  <path class="connector green" data-connector="metadata-query" d="M 960 790 V 816 Q 960 830 946 830 H 870 Q 850 830 850 850 V 866" />
  <path class="connector green" data-connector="snapshot-query" d="M 1450 790 V 816 Q 1450 830 1436 830 H 1090 Q 1070 830 1070 850 V 866" />

  <g filter="url(#shadow)" aria-label="업무 변경">
    <rect x="620" y="150" width="360" height="110" rx="22" fill="#14283a" stroke="#58a6c9" stroke-width="2" />
    <text class="card-title" x="800" y="193" text-anchor="middle">업무 변경</text>
    <text class="body" x="800" y="228" text-anchor="middle">명령 처리 · 상태 전이 · 작성자</text>
  </g>

  <g filter="url(#shadow)" aria-label="원본 상태 저장">
    <rect x="90" y="360" width="520" height="200" rx="24" fill="#102b3e" stroke="#58a6c9" stroke-width="2" />
    <text class="card-title" x="130" y="405">원본 상태 저장</text>
    <text class="body" x="130" y="445">업무 table에 현재 aggregate를 저장</text>
    <text class="body" x="130" y="477">source of truth의 transaction을 책임</text>
    <rect x="130" y="505" width="160" height="34" rx="12" fill="#153f55" stroke="#58a6c9" />
    <text class="chip" x="210" y="528" text-anchor="middle">쓰기 지연</text>
    <rect x="310" y="505" width="200" height="34" rx="12" fill="#153f55" stroke="#58a6c9" />
    <text class="chip" x="410" y="528" text-anchor="middle">transaction 경계</text>
  </g>

  <g filter="url(#shadow)" aria-label="JaVers commit">
    <rect x="990" y="360" width="520" height="200" rx="24" fill="#241d45" stroke="#a78bfa" stroke-width="2" />
    <text class="card-title" x="1030" y="405">JaVers commit</text>
    <text class="body" x="1030" y="445">객체 diff를 계산하고 감사 commit을 생성</text>
    <text class="body" x="1030" y="477">commit metadata와 snapshot 저장을 요청</text>
    <rect x="1030" y="505" width="170" height="34" rx="12" fill="#34275d" stroke="#a78bfa" />
    <text class="chip" x="1115" y="528" text-anchor="middle">diff 계산</text>
    <rect x="1220" y="505" width="220" height="34" rx="12" fill="#34275d" stroke="#a78bfa" />
    <text class="chip" x="1330" y="528" text-anchor="middle">직렬화와 저장</text>
  </g>

  <g filter="url(#shadow)" aria-label="commit metadata">
    <rect x="770" y="640" width="380" height="150" rx="22" fill="#252143" stroke="#a78bfa" stroke-width="2" />
    <text class="card-title" x="810" y="682">commit metadata</text>
    <text class="body" x="810" y="720">author · commit date · properties</text>
    <text class="small" x="810" y="752">작성자·기간 조회와 index 선택</text>
  </g>

  <g filter="url(#shadow)" aria-label="snapshot">
    <rect x="1260" y="640" width="290" height="150" rx="22" fill="#252143" stroke="#a78bfa" stroke-width="2" />
    <text class="card-title" x="1300" y="682">snapshot</text>
    <text class="body" x="1300" y="720">전체 state · version · type</text>
    <text class="small" x="1300" y="752">변경 빈도와 보존량</text>
  </g>

  <g filter="url(#shadow)" aria-label="감사 이력 조회">
    <rect x="590" y="866" width="670" height="78" rx="20" fill="#17342f" stroke="#82b366" stroke-width="2" />
    <text class="card-title" x="925" y="900" text-anchor="middle">감사 이력 조회</text>
    <text class="small" x="925" y="927" text-anchor="middle">metadata 결합 · 조건 pushdown · sequence 역순 정렬 · snapshot 복원</text>
  </g>

  <circle cx="110" cy="920" r="7" fill="#58a6c9" />
  <text class="small" x="128" y="926">현재 상태 비용</text>
  <circle cx="280" cy="920" r="7" fill="#a78bfa" />
  <text class="small" x="298" y="926">감사 저장 비용</text>
  <circle cx="460" cy="920" r="7" fill="#82b366" />
  <text class="small" x="478" y="926">감사 조회 비용</text>
</svg>
