<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1580" viewBox="0 0 1600 1580" role="img" aria-labelledby="title desc">
  <title id="title">첫 요청, 동일 키 재시도, 릴레이 재시도</title><desc id="desc">첫 결제 요청, 동일 멱등성 키 재시도, 커밋 이후 릴레이 재시도의 참여자와 호출 순서를 보여주는 시퀀스 다이어그램</desc>
  <defs>
    <marker id="arrowCall" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA" stroke="#60A5FA" stroke-width="0" stroke-dasharray="none"/></marker><marker id="arrowState" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9FB36A" stroke="#9FB36A" stroke-width="0" stroke-dasharray="none"/></marker><marker id="arrowReturn" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5BC0BE" stroke="#5BC0BE" stroke-width="0" stroke-dasharray="none"/></marker><marker id="arrowError" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#E07A7A" stroke="#E07A7A" stroke-width="0" stroke-dasharray="none"/></marker>
  </defs>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0D1B2D;stroke:#38506A;stroke-width:2}.header{fill:#10243A;stroke:#38506A;stroke-width:2}
    .title{font:700 40px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}.subtitle,.role,.msg,.note,.footer,.num{font-family:"goorm Sans Code","goorm Sans",monospace}
    .subtitle{font-size:18px;fill:#A9BDD1}.participant{font:700 20px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
    .role{font-size:14px;fill:#A9BDD1}.lifeline{stroke:#607991;stroke-width:2;stroke-dasharray:7 8}
    .activation{fill:#132A43;stroke:#7C93AA;stroke-width:1.5}.call,.state,.return,.error{fill:none;stroke-width:4;stroke-linecap:round}
    .call{stroke:#60A5FA}.state{stroke:#9FB36A}.return{stroke:#5BC0BE;stroke-dasharray:9 6}.error{stroke:#E07A7A;stroke-dasharray:9 6}
    .label{fill:#0A1727;stroke-width:1.5}.msg{font-size:13px}.num{font-size:11px;font-weight:800;fill:#07111F}
    .alt{fill:none;stroke:#607991;stroke-width:2;stroke-dasharray:12 8}.branch{fill:#0A1727;stroke:#607991;stroke-width:1.5}
    .note{font-size:14px;fill:#A9BDD1}.footer{font-size:15px;fill:#A9BDD1}
  </style>
  <rect width="1600" height="1580" class="canvas"/><rect x="24" y="24" width="1552" height="1532" rx="26" class="frame"/>
  <text x="800" y="82" text-anchor="middle" class="title">첫 요청, 동일 키 재시도, 릴레이 재시도</text><text x="800" y="120" text-anchor="middle" class="subtitle">멱등성은 요청 중복을 막고, 아웃박스는 커밋 이후 전달 실패를 복구한다</text>
  <rect x="33" y="160" width="224" height="72" rx="12" class="header"/><text x="145" y="190" text-anchor="middle" class="participant">호출자</text><text x="145" y="214" text-anchor="middle" class="role">HTTP 클라이언트</text><path d="M145 232 V1500" class="lifeline"/><rect x="353" y="160" width="224" height="72" rx="12" class="header"/><text x="465" y="190" text-anchor="middle" class="participant">엔드포인트</text><text x="465" y="214" text-anchor="middle" class="role">Spring 또는 Ktor</text><path d="M465 232 V1500" class="lifeline"/><rect x="673" y="160" width="224" height="72" rx="12" class="header"/><text x="785" y="190" text-anchor="middle" class="participant">Exposed TX</text><text x="785" y="214" text-anchor="middle" class="role">고유 키 + 아웃박스</text><path d="M785 232 V1500" class="lifeline"/><rect x="993" y="160" width="224" height="72" rx="12" class="header"/><text x="1105" y="190" text-anchor="middle" class="participant">릴레이</text><text x="1105" y="214" text-anchor="middle" class="role">커밋 후 작업자</text><path d="M1105 232 V1500" class="lifeline"/><rect x="1313" y="160" width="224" height="72" rx="12" class="header"/><text x="1425" y="190" text-anchor="middle" class="participant">외부 API</text><text x="1425" y="214" text-anchor="middle" class="role">Kafka 또는 HTTP</text><path d="M1425 232 V1500" class="lifeline"/>
  <rect x="457" y="295" width="16" height="670" rx="6" class="activation"/><rect x="777" y="365" width="16" height="560" rx="6" class="activation"/>
  <rect x="1097" y="1060" width="16" height="430" rx="6" class="activation"/><rect x="1417" y="495" width="16" height="940" rx="6" class="activation"/>
  <rect x="78" y="270" width="1444" height="420" rx="18" class="alt"/><rect x="98" y="282" width="210" height="30" rx="15" class="branch"/><text x="118" y="303" class="note">첫 요청</text>
  <rect x="78" y="745" width="1444" height="220" rx="18" class="alt"/><rect x="98" y="757" width="240" height="30" rx="15" class="branch"/><text x="118" y="778" class="note">동일 키 재시도</text>
  <rect x="78" y="1025" width="1444" height="475" rx="18" class="alt"/><rect x="98" y="1037" width="250" height="30" rx="15" class="branch"/><text x="118" y="1058" class="note">반복: 릴레이 재시도</text>
  <rect x="163" y="318" width="284" height="30" rx="15" class="label" stroke="#60A5FA"/>
        <circle cx="180" cy="333" r="11" fill="#60A5FA"/><text x="180" y="338" text-anchor="middle" class="num">1</text>
        <text x="199" y="338" class="msg" fill="#60A5FA">POST 명령 + 멱등성 키</text>
        <path data-connector="message-1" d="M145 360 H465" class="call" marker-end="url(#arrowCall)"/><rect x="483" y="383" width="284" height="30" rx="15" class="label" stroke="#9FB36A"/>
        <circle cx="500" cy="398" r="11" fill="#9FB36A"/><text x="500" y="403" text-anchor="middle" class="num">2</text>
        <text x="519" y="403" class="msg" fill="#9FB36A">pending 명령 + 아웃박스 행 저장</text>
        <path data-connector="message-2" d="M465 425 H785" class="state" marker-end="url(#arrowState)"/><rect x="483" y="448" width="284" height="30" rx="15" class="label" stroke="#5BC0BE"/>
        <circle cx="500" cy="463" r="11" fill="#5BC0BE"/><text x="500" y="468" text-anchor="middle" class="num">3</text>
        <text x="519" y="468" class="msg" fill="#5BC0BE">커밋된 행 반환</text>
        <path data-connector="message-3" d="M785 490 H465" class="return" marker-end="url(#arrowReturn)"/><rect x="483" y="513" width="390" height="30" rx="15" class="label" stroke="#60A5FA"/>
        <circle cx="500" cy="528" r="11" fill="#60A5FA"/><text x="500" y="533" text-anchor="middle" class="num">4</text>
        <text x="519" y="533" class="msg" fill="#60A5FA">중복 경로 밖에서 한 번 호출</text>
        <path data-connector="message-4" d="M465 555 H1425" class="call" marker-end="url(#arrowCall)"/><rect x="483" y="578" width="390" height="30" rx="15" class="label" stroke="#5BC0BE"/>
        <circle cx="500" cy="593" r="11" fill="#5BC0BE"/><text x="500" y="598" text-anchor="middle" class="num">5</text>
        <text x="519" y="598" class="msg" fill="#5BC0BE">성공 응답</text>
        <path data-connector="message-5" d="M1425 620 H465" class="return" marker-end="url(#arrowReturn)"/><rect x="163" y="633" width="284" height="30" rx="15" class="label" stroke="#5BC0BE"/>
        <circle cx="180" cy="648" r="11" fill="#5BC0BE"/><text x="180" y="653" text-anchor="middle" class="num">6</text>
        <text x="199" y="653" class="msg" fill="#5BC0BE">201 Created + 저장 결과</text>
        <path data-connector="message-6" d="M465 675 H145" class="return" marker-end="url(#arrowReturn)"/><rect x="163" y="793" width="284" height="30" rx="15" class="label" stroke="#60A5FA"/>
        <circle cx="180" cy="808" r="11" fill="#60A5FA"/><text x="180" y="813" text-anchor="middle" class="num">7</text>
        <text x="199" y="813" class="msg" fill="#60A5FA">같은 키로 다시 POST</text>
        <path data-connector="message-7" d="M145 835 H465" class="call" marker-end="url(#arrowCall)"/><rect x="483" y="853" width="284" height="30" rx="15" class="label" stroke="#9FB36A"/>
        <circle cx="500" cy="868" r="11" fill="#9FB36A"/><text x="500" y="873" text-anchor="middle" class="num">8</text>
        <text x="519" y="873" class="msg" fill="#9FB36A">기존 행 조회, 새 행 없음</text>
        <path data-connector="message-8" d="M465 895 H785" class="state" marker-end="url(#arrowState)"/><rect x="163" y="908" width="284" height="30" rx="15" class="label" stroke="#5BC0BE"/>
        <circle cx="180" cy="923" r="11" fill="#5BC0BE"/><text x="180" y="928" text-anchor="middle" class="num">9</text>
        <text x="199" y="928" class="msg" fill="#5BC0BE">200 OK + 저장 결과</text>
        <path data-connector="message-9" d="M465 950 H145" class="return" marker-end="url(#arrowReturn)"/><rect x="803" y="1068" width="284" height="30" rx="15" class="label" stroke="#9FB36A"/>
        <circle cx="820" cy="1083" r="11" fill="#9FB36A"/><text x="820" y="1088" text-anchor="middle" class="num">10</text>
        <text x="839" y="1088" class="msg" fill="#9FB36A">pending·재시도 가능 행 폴링</text>
        <path data-connector="message-10" d="M1105 1110 H785" class="state" marker-end="url(#arrowState)"/><rect x="1123" y="1130" width="284" height="30" rx="15" class="label" stroke="#60A5FA"/>
        <circle cx="1140" cy="1145" r="11" fill="#60A5FA"/><text x="1140" y="1150" text-anchor="middle" class="num">11</text>
        <text x="1159" y="1150" class="msg" fill="#60A5FA">이벤트 발행</text>
        <path data-connector="message-11" d="M1105 1172 H1425" class="call" marker-end="url(#arrowCall)"/><rect x="1123" y="1192" width="284" height="30" rx="15" class="label" stroke="#E07A7A"/>
        <circle cx="1140" cy="1207" r="11" fill="#E07A7A"/><text x="1140" y="1212" text-anchor="middle" class="num">12</text>
        <text x="1159" y="1212" class="msg" fill="#E07A7A">실패 응답</text>
        <path data-connector="message-12" d="M1425 1234 H1105" class="error" marker-end="url(#arrowError)"/><rect x="803" y="1254" width="284" height="30" rx="15" class="label" stroke="#E07A7A"/>
        <circle cx="820" cy="1269" r="11" fill="#E07A7A"/><text x="820" y="1274" text-anchor="middle" class="num">13</text>
        <text x="839" y="1274" class="msg" fill="#E07A7A">attempts + 1, 상태 기록</text>
        <path data-connector="message-13" d="M1105 1296 H785" class="error" marker-end="url(#arrowError)"/><rect x="1123" y="1316" width="284" height="30" rx="15" class="label" stroke="#60A5FA"/>
        <circle cx="1140" cy="1331" r="11" fill="#60A5FA"/><text x="1140" y="1336" text-anchor="middle" class="num">14</text>
        <text x="1159" y="1336" class="msg" fill="#60A5FA">다음 주기 재발행</text>
        <path data-connector="message-14" d="M1105 1358 H1425" class="call" marker-end="url(#arrowCall)"/><rect x="1123" y="1378" width="284" height="30" rx="15" class="label" stroke="#5BC0BE"/>
        <circle cx="1140" cy="1393" r="11" fill="#5BC0BE"/><text x="1140" y="1398" text-anchor="middle" class="num">15</text>
        <text x="1159" y="1398" class="msg" fill="#5BC0BE">성공 응답</text>
        <path data-connector="message-15" d="M1425 1420 H1105" class="return" marker-end="url(#arrowReturn)"/><rect x="803" y="1440" width="284" height="30" rx="15" class="label" stroke="#9FB36A"/>
        <circle cx="820" cy="1455" r="11" fill="#9FB36A"/><text x="820" y="1460" text-anchor="middle" class="num">16</text>
        <text x="839" y="1460" class="msg" fill="#9FB36A">PUBLISHED 표시</text>
        <path data-connector="message-16" d="M1105 1482 H785" class="state" marker-end="url(#arrowState)"/>
  <text x="800" y="1535" text-anchor="middle" class="footer">HTTP 재시도는 저장된 요청 상태를 재사용하고, 릴레이 재시도는 아웃박스의 attempts와 status를 따릅니다.</text>
</svg>