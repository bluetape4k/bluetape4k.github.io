<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="920" viewBox="0 0 2050 920">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="2050" height="920"/>
<rect class="frame" x="34" y="28" width="1982" height="864" rx="24"/>
<text class="title" x="1025" y="82" text-anchor="middle">One Graph API, Two Execution Paths</text>
<text class="subtitle" x="1025" y="118" text-anchor="middle">The delegate operation stays synchronous; submission and waiting boundaries change</text>
<path class="edge" data-connector="syncCaller-to-syncMethod" d="M390 306 L450 306"/>
<path class="edge" data-connector="syncMethod-to-syncBackend" d="M770 306 L830 306"/>
<path class="edge" data-connector="syncBackend-to-syncResult" d="M1170 306 L1230 306"/>
<path class="edge" data-connector="vtCaller-to-vtAdapter" d="M390 596 L450 596"/>
<path class="edge" data-connector="vtAdapter-to-virtualThread" d="M790 596 L850 596"/>
<path class="edge" data-connector="virtualThread-to-vtBackend" d="M1170 596 L1230 596"/>
<path class="edge" data-connector="vtBackend-to-futureResult" d="M1570 596 L1630 596"/>
<g id="syncCaller">
  <rect x="70" y="235" width="320" height="142" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="230" y="292.5" text-anchor="middle">Caller Thread</text>
  <text class="nodeBody" x="230" y="326.5" text-anchor="middle">calls GraphOperations</text>
  <text class="nodeBody" x="230" y="349.5" text-anchor="middle">waits for the return value</text>
</g>
<g id="syncMethod">
  <rect x="450" y="235" width="320" height="142" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="610" y="292.5" text-anchor="middle">GraphOperations</text>
  <text class="nodeBody" x="610" y="326.5" text-anchor="middle">invokes the synchronous</text>
  <text class="nodeBody" x="610" y="349.5" text-anchor="middle">delegate method</text>
</g>
<g id="syncBackend">
  <rect x="830" y="235" width="340" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1000" y="292.5" text-anchor="middle">Graph Backend</text>
  <text class="nodeBody" x="1000" y="326.5" text-anchor="middle">executes the graph operation</text>
  <text class="nodeBody" x="1000" y="349.5" text-anchor="middle">in memory or over I/O</text>
</g>
<g id="syncResult">
  <rect x="1230" y="235" width="320" height="142" rx="12" fill="#134E4A" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1390" y="292.5" text-anchor="middle">Direct Result</text>
  <text class="nodeBody" x="1390" y="326.5" text-anchor="middle">returns to the caller</text>
  <text class="nodeBody" x="1390" y="349.5" text-anchor="middle">on the same call path</text>
</g>
<g id="vtCaller">
  <rect x="70" y="525" width="320" height="142" rx="12" fill="#831843" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="230" y="582.5" text-anchor="middle">Caller Thread</text>
  <text class="nodeBody" x="230" y="616.5" text-anchor="middle">requests an async operation</text>
  <text class="nodeBody" x="230" y="639.5" text-anchor="middle">receives CompletableFuture</text>
</g>
<g id="vtAdapter">
  <rect x="450" y="525" width="340" height="142" rx="12" fill="#831843" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="620" y="582.5" text-anchor="middle">Virtual Thread Adapter</text>
  <text class="nodeBody" x="620" y="616.5" text-anchor="middle">submits virtualFutureOf { ... }</text>
  <text class="nodeBody" x="620" y="639.5" text-anchor="middle">without changing the delegate</text>
</g>
<g id="virtualThread">
  <rect x="850" y="525" width="320" height="142" rx="12" fill="#4C1D95" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1010" y="582.5" text-anchor="middle">Virtual Thread</text>
  <text class="nodeBody" x="1010" y="616.5" text-anchor="middle">runs the same synchronous</text>
  <text class="nodeBody" x="1010" y="639.5" text-anchor="middle">delegate method</text>
</g>
<g id="vtBackend">
  <rect x="1230" y="525" width="340" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1400" y="582.5" text-anchor="middle">Graph Backend</text>
  <text class="nodeBody" x="1400" y="616.5" text-anchor="middle">executes the same operation</text>
  <text class="nodeBody" x="1400" y="639.5" text-anchor="middle">and may block on I/O</text>
</g>
<g id="futureResult">
  <rect x="1630" y="525" width="330" height="142" rx="12" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1795" y="582.5" text-anchor="middle">Completion Boundary</text>
  <text class="nodeBody" x="1795" y="616.5" text-anchor="middle">future completes</text>
  <text class="nodeBody" x="1795" y="639.5" text-anchor="middle">caller composes or joins</text>
</g>
<rect x="88" y="824" width="1874" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="1025" y="849" text-anchor="middle">Immediate join measures one operation end to end; it does not prove concurrent throughput.</text>
<text class="footer" x="1025" y="873" text-anchor="middle">Measure the real backend, connection pool, and target concurrency before choosing the execution path.</text>
</svg>
