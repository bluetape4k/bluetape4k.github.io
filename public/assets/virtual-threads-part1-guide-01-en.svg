<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Threads guide flow</title>
  <desc id="desc">A Graphviz-derived flow showing request tasks, virtual-thread execution, blocking I/O, resource limits, diagnostics, and cleanup.</desc>
  <defs>
    <marker id="arrow-vt1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="66" y="66" width="1068" height="498" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="100" y="126" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="42" fill="#f8fafc">Virtual Threads Overview</text>
  <text x="102" y="166" font-family="Comic Mono, monospace" font-size="23" fill="#cbd5e1">cheap threads, not magic threads</text>

  <g font-family="Comic Mono, monospace" font-size="18" fill="#f8fafc">
    <rect class="card" x="100" y="240" width="166" height="104" rx="16" fill="#12372f" stroke="#2dd4bf"/>
    <text x="183" y="280" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="24">Request task</text>
    <text x="183" y="315" text-anchor="middle">one job</text>

    <rect class="card" x="324" y="240" width="190" height="104" rx="16" fill="#102a43" stroke="#60a5fa"/>
    <text x="419" y="274" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Virtual-thread</text>
    <text x="419" y="307" text-anchor="middle">per task executor</text>

    <rect class="card" x="572" y="240" width="184" height="104" rx="16" fill="#3b2814" stroke="#f59e0b"/>
    <text x="664" y="274" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Blocking I/O</text>
    <text x="664" y="307" text-anchor="middle">JDBC / HTTP calls</text>

    <rect class="card" x="814" y="240" width="206" height="104" rx="16" fill="#2d2147" stroke="#a78bfa"/>
    <text x="917" y="274" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Resource limits</text>
    <text x="917" y="307" text-anchor="middle">pool / semaphore</text>
    <text x="917" y="330" text-anchor="middle">timeout</text>

    <rect class="card" x="688" y="420" width="184" height="94" rx="16" fill="#123047" stroke="#38bdf8"/>
    <text x="780" y="456" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Diagnostics</text>
    <text x="780" y="488" text-anchor="middle">JFR / metrics</text>

    <rect class="card" x="934" y="420" width="170" height="94" rx="16" fill="#3f300c" stroke="#facc15"/>
    <text x="1019" y="456" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Lifecycle</text>
    <text x="1019" y="488" text-anchor="middle">interrupt / cleanup</text>
  </g>

  <g fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-vt1)">
    <path class="connector" d="M266 292 H324"/>
    <path class="connector" d="M514 292 H572"/>
    <path class="connector" d="M756 292 H814"/>
    <path class="connector" d="M917 344 V370 Q917 384 903 384 H794 Q780 384 780 398 V420"/>
    <path class="connector" d="M1020 292 H1040 Q1060 292 1060 312 V420"/>
  </g>

  <g font-family="Comic Mono, monospace" font-size="16" fill="#cbd5e1">
    <rect class="card" x="100" y="420" width="504" height="94" rx="16" fill="#172033" stroke="#334155"/>
    <text x="126" y="454" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="24">Production rule</text>
    <text x="126" y="486">Do not pool virtual threads. Limit downstream resources.</text>
  </g>
</svg>
