<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1900" viewBox="0 0 2400 1900" role="img" aria-labelledby="title desc">
  <title id="title">Solver 실행과 영속화 책임의 경계</title>
  <desc id="desc">클라이언트가 계획 문제를 제출한 뒤 작업 스냅샷을 저장하고 SolverManager가 비동기로 최적화하며, 결과를 조회하고 승인한 후에만 업무 데이터에 반영하는 권장 흐름을 보여 준다.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="0.58" stop-color="#0c1730"/><stop offset="1" stop-color="#10142a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020617" flood-opacity="0.55"/></filter>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f9fc4" stroke="#5f9fc4" stroke-dasharray="none"/></marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#88a86b" stroke="#88a86b" stroke-dasharray="none"/></marker>
    <marker id="arrow-amber" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c99a58" stroke="#c99a58" stroke-dasharray="none"/></marker>
    <style>
      .title{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:46px;font-weight:700;fill:#f8fafc}.subtitle{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:18px;fill:#a9b8d4}.frame{fill:none;stroke:#2b4168;stroke-width:2}.participantCard{fill:#13233b;stroke:#5b789d;stroke-width:2;filter:url(#shadow)}.participantTitle{font-family:'goorm Sans',sans-serif;font-size:19px;font-weight:700;fill:#f8fafc}.role{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:13px;fill:#9fb0ca}.lifeline{stroke:#52647f;stroke-width:2;stroke-dasharray:8 9}.activation{fill:#203b4d;stroke:#73a5bd;stroke-width:1.6}.activationGreen{fill:#30483f;stroke:#88a86b;stroke-width:1.6}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:9 7}.labelPill{fill:#101b30;stroke-width:1.5}.labelText{font-family:'goorm Sans',sans-serif;font-size:15px;font-weight:700}.badgeText{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:13px;font-weight:700}.altBox{fill:none;stroke:#71839f;stroke-width:2.2;stroke-dasharray:12 8}.branchDivider{stroke:#71839f;stroke-width:2;stroke-dasharray:12 8}.frameLabel{fill:#101b30;stroke-width:1.5}.frameText{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:15px;font-weight:700}.note{font-family:'goorm Sans',sans-serif;font-size:17px;fill:#c7d3e7}.noteStrong{font-family:'goorm Sans',sans-serif;font-size:18px;font-weight:700;fill:#f1d6a7}
    </style>
  </defs>
  <rect width="2400" height="1900" rx="34" fill="url(#canvas)"/><rect class="frame" x="28" y="28" width="2344" height="1844" rx="30"/>
  <text class="title" x="1200" y="76" text-anchor="middle">Solver 실행과 영속화는 같은 책임이 아니다</text><text class="subtitle" x="1200" y="112" text-anchor="middle">quickstart의 비동기 실행 위에 작업·결과·승인·업무 반영 경계를 더합니다.</text>
  <g id="participants">
    <g><rect class="participantCard header" x="50" y="145" width="250" height="90" rx="16"/><text class="participant participantTitle" x="175" y="182" text-anchor="middle">클라이언트</text><text class="role" x="175" y="210" text-anchor="middle">운영자 · API 사용자</text><line class="lifeline" x1="175" y1="235" x2="175" y2="1720"/></g>
    <g><rect class="participantCard header" x="380" y="145" width="250" height="90" rx="16"/><text class="participant participantTitle" x="505" y="182" text-anchor="middle">API</text><text class="role" x="505" y="210" text-anchor="middle">입력 검증 · 조회</text><line class="lifeline" x1="505" y1="235" x2="505" y2="1720"/></g>
    <g><rect class="participantCard header" x="710" y="145" width="250" height="90" rx="16"/><text class="participant participantTitle" x="835" y="182" text-anchor="middle">작업 저장소</text><text class="role" x="835" y="210" text-anchor="middle">snapshot · status</text><line class="lifeline" x1="835" y1="235" x2="835" y2="1720"/></g>
    <g><rect class="participantCard header" x="1040" y="145" width="250" height="90" rx="16"/><text class="participant participantTitle" x="1165" y="182" text-anchor="middle">SolverManager</text><text class="role" x="1165" y="210" text-anchor="middle">비동기 작업 수명주기</text><line class="lifeline" x1="1165" y1="235" x2="1165" y2="1720"/></g>
    <g><rect class="participantCard header" x="1370" y="145" width="250" height="90" rx="16"/><text class="participant participantTitle" x="1495" y="182" text-anchor="middle">Solver</text><text class="role" x="1495" y="210" text-anchor="middle">제약 평가 · 탐색</text><line class="lifeline" x1="1495" y1="235" x2="1495" y2="1720"/></g>
    <g><rect class="participantCard header" x="1700" y="145" width="250" height="90" rx="16"/><text class="participant participantTitle" x="1825" y="182" text-anchor="middle">결과 저장소</text><text class="role" x="1825" y="210" text-anchor="middle">best solution · score</text><line class="lifeline" x1="1825" y1="235" x2="1825" y2="1720"/></g>
    <g><rect class="participantCard header" x="2030" y="145" width="300" height="90" rx="16"/><text class="participant participantTitle" x="2180" y="182" text-anchor="middle">업무 데이터</text><text class="role" x="2180" y="210" text-anchor="middle">승인 뒤 반영되는 원본</text><line class="lifeline" x1="2180" y1="235" x2="2180" y2="1720"/></g>
  </g>
  <rect class="altBox" x="80" y="285" width="2240" height="1350" rx="22"/><rect class="frameLabel" x="110" y="265" width="405" height="40" rx="20" stroke="#5f9fc4"/><text class="frameText" x="312" y="291" text-anchor="middle" fill="#a8d6ee">현재 quickstart · 메모리 작업 상태</text>
  <line class="branchDivider" x1="80" y1="940" x2="2320" y2="940"/><rect class="frameLabel" x="110" y="920" width="490" height="40" rx="20" stroke="#c99a58"/><text class="frameText" x="355" y="946" text-anchor="middle" fill="#f1d6a7">실제 서비스에서 추가할 영속화·승인 경계</text>
  <rect class="activation" x="497" y="340" width="16" height="1230" rx="5"/><rect class="activationGreen" x="1157" y="590" width="16" height="800" rx="5"/><rect class="activationGreen" x="1487" y="680" width="16" height="260" rx="5"/>

  <g id="m1"><rect class="labelPill" x="200" y="310" width="280" height="38" rx="19" stroke="#5f9fc4"/><circle cx="222" cy="329" r="14" fill="#173148" stroke="#5f9fc4"/><text class="badgeText" x="222" y="334" text-anchor="middle" fill="#a8d6ee">1</text><text class="labelText" x="350" y="335" text-anchor="middle" fill="#a8d6ee">계획 문제 제출</text><path class="seq" d="M175 370 H505" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/></g>
  <g id="m2"><rect class="labelPill" x="560" y="400" width="300" height="38" rx="19" stroke="#88a86b"/><circle cx="582" cy="419" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="582" y="424" text-anchor="middle" fill="#c9dda8">2</text><text class="labelText" x="720" y="425" text-anchor="middle" fill="#c9dda8">입력·업무 규칙 검증</text><path class="seq" d="M505 460 H835" stroke="#88a86b" marker-end="url(#arrow-green)"/></g>
  <g id="m3"><rect class="labelPill" x="550" y="490" width="320" height="38" rx="19" stroke="#88a86b"/><circle cx="572" cy="509" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="572" y="514" text-anchor="middle" fill="#c9dda8">3</text><text class="labelText" x="720" y="515" text-anchor="middle" fill="#c9dda8">작업 스냅샷 저장</text><path class="seq" d="M505 550 H835" stroke="#88a86b" marker-end="url(#arrow-green)"/></g>
  <g id="m4"><rect class="labelPill" x="850" y="580" width="300" height="38" rx="19" stroke="#5f9fc4"/><circle cx="872" cy="599" r="14" fill="#173148" stroke="#5f9fc4"/><text class="badgeText" x="872" y="604" text-anchor="middle" fill="#a8d6ee">4</text><text class="labelText" x="1010" y="605" text-anchor="middle" fill="#a8d6ee">비동기 solve 시작</text><path class="seq" d="M505 640 H1165" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/></g>
  <g id="m5"><rect class="labelPill" x="1180" y="670" width="300" height="38" rx="19" stroke="#5f9fc4"/><circle cx="1202" cy="689" r="14" fill="#173148" stroke="#5f9fc4"/><text class="badgeText" x="1202" y="694" text-anchor="middle" fill="#a8d6ee">5</text><text class="labelText" x="1340" y="695" text-anchor="middle" fill="#a8d6ee">제약 점수로 탐색</text><path class="seq" d="M1165 730 H1495" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/></g>
  <g id="m6"><rect class="labelPill" x="1260" y="760" width="470" height="38" rx="19" stroke="#88a86b"/><circle cx="1282" cy="779" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="1282" y="784" text-anchor="middle" fill="#c9dda8">6</text><text class="labelText" x="1500" y="785" text-anchor="middle" fill="#c9dda8">더 나은 해답 이벤트</text><path class="seqReturn" d="M1495 820 H1165" stroke="#88a86b"/><polygon points="1179,812 1165,820 1179,828" fill="#88a86b" data-direct-solid-head="true"/></g>
  <g id="m7"><rect class="labelPill" x="1020" y="850" width="470" height="38" rx="19" stroke="#88a86b"/><circle cx="1042" cy="869" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="1042" y="874" text-anchor="middle" fill="#c9dda8">7</text><text class="labelText" x="1260" y="875" text-anchor="middle" fill="#c9dda8">현재 best solution 갱신</text><path class="seq" d="M1165 910 H1825" stroke="#88a86b" marker-end="url(#arrow-green)"/></g>

  <g id="m8"><rect class="labelPill" x="1500" y="970" width="360" height="38" rx="19" stroke="#c99a58"/><circle cx="1522" cy="989" r="14" fill="#423324" stroke="#c99a58"/><text class="badgeText" x="1522" y="994" text-anchor="middle" fill="#f1d6a7">8</text><text class="labelText" x="1685" y="995" text-anchor="middle" fill="#f1d6a7">해답과 Score 저장</text><path class="seq" d="M1165 1030 H1825" stroke="#c99a58" marker-end="url(#arrow-amber)"/></g>
  <g id="m9"><rect class="labelPill" x="1050" y="1060" width="430" height="38" rx="19" stroke="#5f9fc4"/><circle cx="1072" cy="1079" r="14" fill="#173148" stroke="#5f9fc4"/><text class="badgeText" x="1072" y="1084" text-anchor="middle" fill="#a8d6ee">9</text><text class="labelText" x="1270" y="1085" text-anchor="middle" fill="#a8d6ee">작업 결과 조회</text><path class="seq" d="M505 1120 H1825" stroke="#5f9fc4" marker-end="url(#arrow-blue)"/></g>
  <g id="m10"><rect class="labelPill" x="1020" y="1150" width="490" height="38" rx="19" stroke="#88a86b"/><circle cx="1042" cy="1169" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="1042" y="1174" text-anchor="middle" fill="#c9dda8">10</text><text class="labelText" x="1270" y="1175" text-anchor="middle" fill="#c9dda8">후보 해답·Score·상태</text><path class="seqReturn" d="M1825 1210 H505" stroke="#88a86b"/><polygon points="519,1202 505,1210 519,1218" fill="#88a86b" data-direct-solid-head="true"/></g>
  <g id="m11"><rect class="labelPill" x="210" y="1240" width="280" height="38" rx="19" stroke="#c99a58"/><circle cx="232" cy="1259" r="14" fill="#423324" stroke="#c99a58"/><text class="badgeText" x="232" y="1264" text-anchor="middle" fill="#f1d6a7">11</text><text class="labelText" x="360" y="1265" text-anchor="middle" fill="#f1d6a7">결과 검토·승인</text><path class="seq" d="M175 1300 H505" stroke="#c99a58" marker-end="url(#arrow-amber)"/></g>
  <g id="m12"><rect class="labelPill" x="1180" y="1330" width="430" height="38" rx="19" stroke="#c99a58"/><circle cx="1202" cy="1349" r="14" fill="#423324" stroke="#c99a58"/><text class="badgeText" x="1202" y="1354" text-anchor="middle" fill="#f1d6a7">12</text><text class="labelText" x="1400" y="1355" text-anchor="middle" fill="#f1d6a7">승인된 배치만 업무 반영</text><path class="seq" d="M505 1390 H2180" stroke="#c99a58" marker-end="url(#arrow-amber)"/></g>
  <g id="m13"><rect class="labelPill" x="1090" y="1420" width="360" height="38" rx="19" stroke="#88a86b"/><circle cx="1112" cy="1439" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="1112" y="1444" text-anchor="middle" fill="#c9dda8">13</text><text class="labelText" x="1275" y="1445" text-anchor="middle" fill="#c9dda8">반영 이력 기록</text><path class="seqReturn" d="M2180 1480 H505" stroke="#88a86b"/><polygon points="519,1472 505,1480 519,1488" fill="#88a86b" data-direct-solid-head="true"/></g>
  <g id="m14"><rect class="labelPill" x="205" y="1510" width="290" height="38" rx="19" stroke="#88a86b"/><circle cx="227" cy="1529" r="14" fill="#2c3b32" stroke="#88a86b"/><text class="badgeText" x="227" y="1534" text-anchor="middle" fill="#c9dda8">14</text><text class="labelText" x="360" y="1535" text-anchor="middle" fill="#c9dda8">반영 완료 응답</text><path class="seqReturn" d="M505 1570 H175" stroke="#88a86b"/><polygon points="189,1562 175,1570 189,1578" fill="#88a86b" data-direct-solid-head="true"/></g>
  <rect x="190" y="1680" width="2020" height="112" rx="24" fill="#1d2939" stroke="#c99a58" stroke-width="2"/><text class="noteStrong" x="1200" y="1724" text-anchor="middle">Exposed 예제는 이 흐름 전체가 아니라 Score 컬럼의 저장·조회만 증명합니다.</text><text class="note" x="1200" y="1760" text-anchor="middle">작업 스냅샷, 상태, 해답, 승인, 업무 반영은 애플리케이션이 별도로 설계해야 합니다.</text>
</svg>
