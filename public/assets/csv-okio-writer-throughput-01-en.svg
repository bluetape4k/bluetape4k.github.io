<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">CSV writer throughput comparison</title>
  <desc id="desc">Grouped bar chart comparing the existing Writer path and Okio BufferedSink throughput in operations per second for small, medium, and large CSV writer workloads. Higher is better.</desc>
  <defs>
    <style>
      .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 38px; fill: #e6edf7; }
      .subtitle { font-family: 'Comic Mono', 'SFMono-Regular', Menlo, monospace; font-size: 18px; fill: #9fb2cc; }
      .label { font-family: 'Comic Mono', 'SFMono-Regular', Menlo, monospace; font-size: 16px; fill: #d7e2f0; }
      .small { font-family: 'Comic Mono', 'SFMono-Regular', Menlo, monospace; font-size: 13px; fill: #9fb2cc; }
      .panel-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; font-size: 25px; fill: #e6edf7; }
      .value { font-family: 'Comic Mono', 'SFMono-Regular', Menlo, monospace; font-size: 15px; font-weight: 700; fill: #e6edf7; }
      .speed { font-family: 'Comic Mono', 'SFMono-Regular', Menlo, monospace; font-size: 15px; font-weight: 700; fill: #67e8c9; }
      .note { font-family: 'Comic Mono', 'SFMono-Regular', Menlo, monospace; font-size: 14px; fill: #9fb2cc; }
    </style>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000814" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="1288" height="728" rx="24" fill="#0b1220" stroke="#263954"/>
  <text x="44" y="70" class="title">CSV Writer Throughput: Writer vs Okio Sink</text>
  <text x="46" y="106" class="subtitle">ops/s, higher is better. Each workload panel uses its own scale so the medium and large jumps stay visible.</text>

  <g transform="translate(48,134)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#6aa9ff"/>
    <text x="28" y="15" class="label">Existing OutputStreamWriter path</text>
    <rect x="344" y="0" width="18" height="18" rx="4" fill="#53d6b7"/>
    <text x="372" y="15" class="label">Okio BufferedSink UTF-8 path</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="58" y="190" width="388" height="328" rx="18" fill="#12213a" stroke="#314868"/>
  </g>
  <text x="82" y="230" class="panel-title">Small rows</text>
  <text x="342" y="230" class="speed">1.39x faster</text>
  <text x="82" y="262" class="small">Existing</text>
  <rect x="86" y="274" width="326" height="34" rx="10" fill="#1d3657"/>
  <rect x="86" y="274" width="215.40" height="34" rx="10" fill="#6aa9ff"/>
  <text x="312" y="297" class="value">11,741 ops/s</text>
  <text x="82" y="348" class="small">Okio</text>
  <rect x="86" y="360" width="326" height="34" rx="10" fill="#173c37"/>
  <rect x="86" y="360" width="300.00" height="34" rx="10" fill="#53d6b7"/>
  <text x="300" y="383" class="value">16,356 ops/s</text>
  <line x1="86" y1="424" x2="412" y2="424" stroke="#334a68" stroke-width="1"/>
  <text x="86" y="448" class="small">0</text>
  <text x="302" y="448" class="small">16,356 ops/s</text>
  <text x="86" y="482" class="note">Setup cost still matters here.</text>

  <g filter="url(#softShadow)">
    <rect x="474" y="190" width="388" height="328" rx="18" fill="#12213a" stroke="#314868"/>
  </g>
  <text x="498" y="230" class="panel-title">Medium rows</text>
  <text x="758" y="230" class="speed">3.06x faster</text>
  <text x="498" y="262" class="small">Existing</text>
  <rect x="502" y="274" width="326" height="34" rx="10" fill="#1d3657"/>
  <rect x="502" y="274" width="98.05" height="34" rx="10" fill="#6aa9ff"/>
  <text x="612" y="297" class="value">676 ops/s</text>
  <text x="498" y="348" class="small">Okio</text>
  <rect x="502" y="360" width="326" height="34" rx="10" fill="#173c37"/>
  <rect x="502" y="360" width="300.00" height="34" rx="10" fill="#53d6b7"/>
  <text x="716" y="383" class="value">2,069 ops/s</text>
  <line x1="502" y1="424" x2="828" y2="424" stroke="#334a68" stroke-width="1"/>
  <text x="502" y="448" class="small">0</text>
  <text x="710" y="448" class="small">2,069 ops/s</text>
  <text x="502" y="482" class="note">The streaming path starts to pull away.</text>

  <g filter="url(#softShadow)">
    <rect x="890" y="190" width="388" height="328" rx="18" fill="#12213a" stroke="#314868"/>
  </g>
  <text x="914" y="230" class="panel-title">Large rows</text>
  <text x="1174" y="230" class="speed">3.25x faster</text>
  <text x="914" y="262" class="small">Existing</text>
  <rect x="918" y="274" width="326" height="34" rx="10" fill="#1d3657"/>
  <rect x="918" y="274" width="92.38" height="34" rx="10" fill="#6aa9ff"/>
  <text x="1022" y="297" class="value">83.8 ops/s</text>
  <text x="914" y="348" class="small">Okio</text>
  <rect x="918" y="360" width="326" height="34" rx="10" fill="#173c37"/>
  <rect x="918" y="360" width="300.00" height="34" rx="10" fill="#53d6b7"/>
  <text x="1132" y="383" class="value">272.2 ops/s</text>
  <line x1="918" y1="424" x2="1244" y2="424" stroke="#334a68" stroke-width="1"/>
  <text x="918" y="448" class="small">0</text>
  <text x="1134" y="448" class="small">272.2 ops/s</text>
  <text x="918" y="482" class="note">The large export path gets the clearest win.</text>

  <rect x="58" y="574" width="1220" height="86" rx="18" fill="#172033" stroke="#4b5f80"/>
  <text x="82" y="610" class="panel-title">What the chart is saying</text>
  <text x="82" y="642" class="subtitle">The Flow already streams rows; Okio removes a character-layer detour in the UTF-8 file path.</text>

  <text x="44" y="714" class="subtitle">Measured with ./gradlew :bluetape4k-csv:testBenchmark. Source tables remain in the post.</text>
</svg>
