<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Transactional Outbox and Idempotency Failure Boundaries</title><desc id="desc">Architecture showing idempotency checks, atomic domain and outbox persistence, after-commit relay delivery, and retry state</desc>
  <defs><marker id="arrow0" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#60A5FA"/></marker><marker id="arrow1" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#5EEAD4"/></marker><marker id="arrow2" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#F4B860"/></marker><marker id="arrow3" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#E07A7A"/></marker><marker id="arrow4" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#B794F4"/></marker></defs><style>
    .canvas{fill:#07111F}.frame{fill:#0D1B2D;stroke:#38506A;stroke-width:2}
    .lane{fill:#0A1727;stroke:#38506A;stroke-width:2}.card{fill:#10243A;stroke-width:2}
    .title{font:700 33px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
    .subtitle,.lane-title,.body,.footer{font-family:"Comic Mono","SFMono-Regular",Menlo,monospace;fill:#A9BDD1}
    .subtitle{font-size:15px}.lane-title{font-size:17px;fill:#36C5F0}
    .card-title{font:700 15px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#E6F2FF}
    .body{font-size:14px}.footer{font-size:13px}
    .connector{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1600" height="980" class="canvas"/><rect x="28" y="28" width="1544" height="924" rx="30" class="frame"/>
  <text x="70" y="100" class="title">Transactional Outbox and Idempotency Failure Boundaries</text><text x="70" y="142" class="subtitle">Persist request intent in one database transaction, then retry external delivery after commit</text>
  <rect x="40" y="190" width="1520" height="320" rx="26" class="lane"/><text x="70" y="224" class="lane-title">Request transaction</text>
  <rect x="40" y="570" width="1520" height="320" rx="26" class="lane"/><text x="70" y="604" class="lane-title">After-commit delivery</text>
  <g data-card="Client">
    <rect x="60" y="250" width="290" height="210" rx="22" class="card" stroke="#60A5FA"/>
    <circle cx="86" cy="280" r="7" fill="#60A5FA"/>
    <text x="104" y="288" class="card-title">Client</text>
    <text x="86" y="334" class="body" text-anchor="start"><tspan x="86" dy="0">Command + idempotency key</tspan><tspan x="86" dy="30">Retry after timeout</tspan></text>
  </g><g data-card="Spring or Ktor">
    <rect x="430" y="250" width="300" height="210" rx="22" class="card" stroke="#36C5F0"/>
    <circle cx="456" cy="280" r="7" fill="#36C5F0"/>
    <text x="474" y="288" class="card-title">Spring or Ktor</text>
    <text x="456" y="334" class="body" text-anchor="start"><tspan x="456" dy="0">Validate input</tspan><tspan x="456" dy="30">Look up existing key</tspan></text>
  </g><g data-card="Idempotency boundary">
    <rect x="810" y="250" width="300" height="210" rx="22" class="card" stroke="#B794F4"/>
    <circle cx="836" cy="280" r="7" fill="#B794F4"/>
    <text x="854" y="288" class="card-title">Idempotency boundary</text>
    <text x="836" y="334" class="body" text-anchor="start"><tspan x="836" dy="0">Unique index</tspan><tspan x="836" dy="30">Return stored row on duplicate</tspan></text>
  </g><g data-card="Database transaction">
    <rect x="1190" y="250" width="350" height="210" rx="22" class="card" stroke="#5EEAD4"/>
    <circle cx="1216" cy="280" r="7" fill="#5EEAD4"/>
    <text x="1234" y="288" class="card-title">Database transaction</text>
    <text x="1216" y="334" class="body" text-anchor="start"><tspan x="1216" dy="0">Domain row</tspan><tspan x="1216" dy="30">Outbox row</tspan><tspan x="1216" dy="30">Commit together</tspan></text>
  </g><g data-card="Outbox">
    <rect x="60" y="650" width="290" height="200" rx="22" class="card" stroke="#F4B860"/>
    <circle cx="86" cy="680" r="7" fill="#F4B860"/>
    <text x="104" y="688" class="card-title">Outbox</text>
    <text x="86" y="734" class="body" text-anchor="start"><tspan x="86" dy="0">PENDING state</tspan><tspan x="86" dy="30">Durable delivery intent</tspan></text>
  </g><g data-card="Relay">
    <rect x="430" y="650" width="300" height="200" rx="22" class="card" stroke="#F4B860"/>
    <circle cx="456" cy="680" r="7" fill="#F4B860"/>
    <text x="474" y="688" class="card-title">Relay</text>
    <text x="456" y="734" class="body" text-anchor="start"><tspan x="456" dy="0">Poll after commit</tspan><tspan x="456" dy="30">Record attempts and status</tspan></text>
  </g><g data-card="External system">
    <rect x="810" y="650" width="300" height="200" rx="22" class="card" stroke="#5EEAD4"/>
    <circle cx="836" cy="680" r="7" fill="#5EEAD4"/>
    <text x="854" y="688" class="card-title">External system</text>
    <text x="836" y="734" class="body" text-anchor="start"><tspan x="836" dy="0">Kafka or HTTP</tspan><tspan x="836" dy="30">May return failure</tspan></text>
  </g><g data-card="Retry ledger">
    <rect x="1190" y="650" width="350" height="200" rx="22" class="card" stroke="#E07A7A"/>
    <circle cx="1216" cy="680" r="7" fill="#E07A7A"/>
    <text x="1234" y="688" class="card-title">Retry ledger</text>
    <text x="1216" y="734" class="body" text-anchor="start"><tspan x="1216" dy="0">attempts + 1</tspan><tspan x="1216" dy="30">Dead letter at budget</tspan></text>
  </g>
  <path data-connector="client-app" d="M350 355 H430" class="connector" stroke="#60A5FA" marker-end="url(#arrow0)"/>
  <path data-connector="app-idempotency" d="M730 355 H810" class="connector" stroke="#B794F4" marker-end="url(#arrow4)"/>
  <path data-connector="idempotency-tx" d="M1110 355 H1190" class="connector" stroke="#5EEAD4" marker-end="url(#arrow1)"/>
  <path data-connector="tx-outbox" d="M1365 460 V530 Q1365 550 1345 550 H225 Q205 550 205 570 V650" class="connector" stroke="#5EEAD4" marker-end="url(#arrow1)"/>
  <path data-connector="outbox-relay" d="M350 750 H430" class="connector" stroke="#F4B860" marker-end="url(#arrow2)"/>
  <path data-connector="relay-external" d="M730 750 H810" class="connector" stroke="#F4B860" marker-end="url(#arrow2)"/>
  <path data-connector="external-retry" d="M1110 750 H1190" class="connector" stroke="#E07A7A" marker-end="url(#arrow3)"/>
  <path data-connector="retry-outbox" d="M1365 850 V874 Q1365 894 1345 894 H225 Q205 894 205 874 V850" class="connector" stroke="#B794F4" marker-end="url(#arrow4)"/>
  <text x="800" y="930" text-anchor="middle" class="footer">The unique index prevents duplicate creation; outbox status makes after-commit delivery failures readable and retryable.</text>
</svg>