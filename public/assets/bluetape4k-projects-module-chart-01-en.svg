<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="760" viewBox="0 0 1480 760" role="img">
<title>Module Composition Snapshot</title>
<desc>The repository is broad, so start with the largest boundary groups first.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020712" flood-opacity="0.45"/></filter>

  <style>
    .bg{fill:#07111F}.frame{fill:#0D1B2D;stroke:#213B5E;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#F7FAFF;font-weight:700}
    .subtitle,.body,.small{font-family:"Comic Mono","Courier New",monospace;fill:#C9D6E8}
    .subtitle{font-size:17px}.body{font-size:14px}.small{font-size:12px;fill:#8DA2BC}
    .label{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:22px;fill:#F7FAFF;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke:#78AFFF;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bar-label{font-family:"Comic Mono","Courier New",monospace;font-size:15px;fill:#F7FAFF}.axis{stroke:#47627F;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1480" height="760"/>
<rect class="frame" x="34" y="28" width="1412" height="704" rx="24"/>
<text class="title" x="70" y="82">Module Composition Snapshot</text>
<text class="subtitle" x="72" y="114">The repository is broad, so start with the largest boundary groups first.</text>
<line class="axis" x1="180" y1="620" x2="1280" y2="620"/>
<g>
  <rect x="190" y="190" width="1040" height="34" rx="8" fill="#132D55" stroke="#68A7FF" stroke-width="2"/>
  <text class="bar-label" x="204" y="213">Foundation and test support</text>
  <text class="bar-label" x="1216" y="213" text-anchor="end">core · coroutines · logging · junit5</text>
</g>
<g>
  <rect x="190" y="268" width="930" height="34" rx="8" fill="#123D43" stroke="#4ED7C7" stroke-width="2"/>
  <text class="bar-label" x="204" y="291">I/O, serialization, HTTP, RPC</text>
  <text class="bar-label" x="1106" y="291" text-anchor="end">io · okio · csv · protobuf · json · grpc</text>
</g>
<g>
  <rect x="190" y="346" width="1110" height="34" rx="8" fill="#173B2A" stroke="#66D58D" stroke-width="2"/>
  <text class="bar-label" x="204" y="369">Data, cache, and infrastructure</text>
  <text class="bar-label" x="1286" y="369" text-anchor="end">jdbc · r2dbc · hibernate · Redis · Kafka</text>
</g>
<g>
  <rect x="190" y="424" width="760" height="34" rx="8" fill="#2D255C" stroke="#B29DFF" stroke-width="2"/>
  <text class="bar-label" x="204" y="447">Application frameworks</text>
  <text class="bar-label" x="936" y="447" text-anchor="end">Spring Boot 4 · Ktor 3 · examples</text>
</g>
<g>
  <rect x="190" y="502" width="860" height="34" rx="8" fill="#443215" stroke="#F6C55F" stroke-width="2"/>
  <text class="bar-label" x="204" y="525">Focused utilities</text>
  <text class="bar-label" x="1036" y="525" text-anchor="end">IDs · money · measured · workflow · states</text>
</g>
<text class="small" x="190" y="660">Values show relative README surface area, not an exact module count.</text>
</svg>