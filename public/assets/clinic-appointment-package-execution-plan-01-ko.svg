<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc" data-locale="ko">
<title id="title">선택한 패키지 실행 계약을 Plan 리비전으로 고정한다</title><desc id="desc">선택 결과와 정확한 구성 상품 버전을 검증하되 방문 시간은 만들지 않습니다.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#111932"/></linearGradient>
 <marker id="blueArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0 0 L14 7 L0 14 Z" fill="#60a5fa" data-solid-head="true"/></marker>
<marker id="greenArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0 0 L14 7 L0 14 Z" fill="#2dd4bf" data-solid-head="true"/></marker>
<marker id="amberArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0 0 L14 7 L0 14 Z" fill="#fbbf24" data-solid-head="true"/></marker>
<marker id="redArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M0 0 L14 7 L0 14 Z" fill="#fb7185" data-solid-head="true"/></marker>
 <style>
 .title{font-family:"goorm Sans",sans-serif;font-size:37px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"goorm Sans",sans-serif;font-size:18px;fill:#aebed2}.card{fill:#11233e;stroke-width:3}.card.blue{stroke:#60a5fa}.card.green{stroke:#2dd4bf;fill:#10333b}.card.amber{stroke:#fbbf24;fill:#312818}.card.red{stroke:#fb7185;fill:#341b2b}.card-title{font-family:"goorm Sans",sans-serif;font-size:21px;font-weight:700;fill:#f8fafc}.card-title.compact{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:15px}.body,.label,.note{font-family:"goorm Sans Code","goorm Sans",monospace;fill:#d7e3f3}.body{font-size:16px}.note{font-size:15px;fill:#aebed2}.route{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.blue-line{stroke:#60a5fa;marker-end:url(#blueArrow)}.green-line{stroke:#2dd4bf;marker-end:url(#greenArrow)}.amber-line{stroke:#fbbf24;marker-end:url(#amberArrow)}.red-line{stroke:#fb7185;marker-end:url(#redArrow)}.lifeline{stroke:#526783;stroke-width:2;stroke-dasharray:8 10}.activation{fill:#17314e;stroke:#7091ab;stroke-width:2}.pill{fill:#0d1a2e;stroke-width:2}.label{font-size:15px}.frame{fill:none;stroke:#526783;stroke-width:2;stroke-dasharray:9 8}.badge{font-family:"goorm Sans",sans-serif;font-size:15px;font-weight:700}
 </style>
</defs><rect width="1440" height="940" fill="url(#bg)"/><rect x="28" y="26" width="1384" height="888" rx="30" fill="none" stroke="#2b4168" stroke-width="2"/>
<text class="title" x="64" y="78">선택한 패키지 실행 계약을 Plan 리비전으로 고정한다</text><text class="subtitle" x="66" y="112">선택 결과와 정확한 구성 상품 버전을 검증하되 방문 시간은 만들지 않습니다.</text>
 <g class="node-card"><rect id="contract" x="55" y="280" width="320" height="230" rx="22" class="card blue"/><text class="card-title" x="215" y="325" text-anchor="middle">환자 A의 실행 계약</text><text class="body" x="215" y="362" text-anchor="middle">피부 진단 v2 · 필수</text>
<text class="body" x="215" y="386" text-anchor="middle">레이저 토닝 v8 · 선택</text>
<text class="body" x="215" y="410" text-anchor="middle">진정 마스크 관리 v4 · 선택</text></g>
 <g class="node-card"><rect id="limits" x="465" y="170" width="390" height="90" rx="22" class="card blue"/><text class="card-title" x="660" y="215" text-anchor="middle">수량·전체 크기</text></g><g class="node-card"><rect id="selection" x="465" y="296" width="390" height="90" rx="22" class="card blue"/><text class="card-title" x="660" y="341" text-anchor="middle">정확한 선택 수</text></g><g class="node-card"><rect id="provenance" x="465" y="422" width="390" height="90" rx="22" class="card blue"/><text class="card-title" x="660" y="467" text-anchor="middle">진료 항목 근거 이력</text></g><g class="node-card"><rect id="relations" x="465" y="548" width="390" height="90" rx="22" class="card blue"/><text class="card-title" x="660" y="593" text-anchor="middle">관계 참조</text></g><g class="node-card"><rect id="acyclic" x="465" y="674" width="390" height="90" rx="22" class="card green"/><text class="card-title" x="660" y="719" text-anchor="middle">실행 의존성 순환</text></g>
 <g class="node-card"><rect id="revision" x="950" y="210" width="390" height="210" rx="22" class="card green"/><text class="card-title" x="1145" y="255" text-anchor="middle">새 Plan 리비전</text><text class="body" x="1145" y="292" text-anchor="middle">PlannedTreatment</text>
<text class="body" x="1145" y="316" text-anchor="middle">ExecutionDependency</text>
<text class="body" x="1145" y="340" text-anchor="middle">VisitGroupingConstraint</text></g>
 <g class="node-card"><rect id="grouping" x="950" y="480" width="390" height="170" rx="22" class="card amber"/><text class="card-title" x="1145" y="525" text-anchor="middle">묶음 조건은 별도 축</text><text class="body" x="1145" y="562" text-anchor="middle">MAY_SAME_VISIT · 함께 가능</text>
<text class="body" x="1145" y="586" text-anchor="middle">MUST_SEPARATE_VISIT · 분리</text></g>
 <g class="node-card"><rect id="boundary" x="950" y="710" width="390" height="150" rx="22" class="card red"/><text class="card-title" x="1145" y="755" text-anchor="middle">최종 경계</text><text class="body" x="1145" y="792" text-anchor="middle">방문 후보를 만들지 않는다</text>
<text class="body" x="1145" y="816" text-anchor="middle">확정 예약을 만들지 않는다</text></g>
 <path class="route blue-line" data-source-node="contract" data-target-node="limits" d="M375 395 H410 Q435 395 435 370 V240 Q435 215 465 215"/>
 <path class="route blue-line" data-source-node="limits" data-target-node="selection" d="M660 260 V296"/><path class="route blue-line" data-source-node="selection" data-target-node="provenance" d="M660 386 V422"/><path class="route blue-line" data-source-node="provenance" data-target-node="relations" d="M660 512 V548"/><path class="route blue-line" data-source-node="relations" data-target-node="acyclic" d="M660 638 V674"/>
 <path class="route green-line" data-source-node="acyclic" data-target-node="revision" d="M855 719 H895 Q920 719 920 694 V340 Q920 315 950 315"/>
 <path class="route amber-line" data-source-node="revision" data-target-node="grouping" d="M1145 420 V480"/>
 <path class="route red-line" data-source-node="grouping" data-target-node="boundary" d="M1145 650 V710"/>
 <text class="note" x="65" y="825">선택 사례는 승인된 설계, 검증 동작은 현재 planner와 테스트에 근거합니다.</text></svg>
