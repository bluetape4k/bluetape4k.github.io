<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Data ownership and delivery boundaries in usage-billing microservices</title>
  <desc id="desc">Meter, Usage, Billing, and Invoice own PostgreSQL and Outbox state, publish facts through Kafka, and Query owns a separate Inbox and projection</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#0b1728"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020817" flood-opacity=".6"/></filter>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#f59e0b"/></marker>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#38bdf8"/></marker>
    <style>
      .en{font-family:'Architects Daughter','Comic Sans MS',sans-serif}.mono{font-family:'Comic Mono','SFMono-Regular',monospace}
      .title{font-size:31px;font-weight:800;fill:#f8fafc}.subtitle{font-size:15px;fill:#a8b8cc}.card{fill:#101d30;stroke:#405977;stroke-width:2}.db{fill:#0b1525;stroke:#22c55e;stroke-width:2}.name{font-size:21px;font-weight:800;fill:#f8fafc}.body{font-size:13.5px;fill:#c4d2e3}.small{font-size:12px;fill:#9fb0c5}.topic{font-size:13px;font-weight:700;fill:#fde68a}.label{font-size:12px;font-weight:700}.pub{stroke:#f59e0b;stroke-width:4;fill:none;marker-end:url(#arrowOrange)}.sub{stroke:#38bdf8;stroke-width:4;fill:none;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/><path d="M0 120H1440M0 240H1440M0 360H1440M0 480H1440M0 600H1440M0 720H1440M120 0V900M240 0V900M360 0V900M480 0V900M600 0V900M720 0V900M840 0V900M960 0V900M1080 0V900M1200 0V900M1320 0V900" stroke="#17304a" stroke-width="1" opacity=".35"/>
  <text x="60" y="70" class="en title">Five services, five systems of record</text><text x="60" y="104" class="mono subtitle">Commit each local effect with its Outbox; decide the Inbox before applying a received event.</text>
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="270" height="340" rx="24" class="card"/><text x="86" y="195" class="en name">Meter</text><text x="86" y="226" class="mono body">immutable price versions</text><text x="86" y="252" class="mono body">command receipts</text><rect x="86" y="290" width="218" height="118" rx="16" class="db"/><text x="108" y="328" class="en body">Meter PostgreSQL</text><text x="108" y="358" class="mono small">price / receipt / outbox</text><text x="108" y="386" class="mono small">PENDING -&gt; PUBLISHED</text><rect x="86" y="432" width="180" height="36" rx="18" fill="#3a260d" stroke="#f59e0b"/><text x="176" y="456" text-anchor="middle" class="mono topic">PriceActivated</text>
    <rect x="390" y="150" width="270" height="340" rx="24" class="card"/><text x="416" y="195" class="en name">Usage</text><text x="416" y="226" class="mono body">accepted usage facts</text><text x="416" y="252" class="mono body">approved price evidence</text><rect x="416" y="290" width="218" height="118" rx="16" class="db"/><text x="438" y="328" class="en body">Usage PostgreSQL</text><text x="438" y="358" class="mono small">price / inbox / outbox</text><text x="438" y="386" class="mono small">APPLIED / DUPLICATE</text><rect x="454" y="432" width="180" height="36" rx="18" fill="#3a260d" stroke="#f59e0b"/><text x="544" y="456" text-anchor="middle" class="mono topic">UsageAccepted</text>
    <rect x="720" y="150" width="270" height="340" rx="24" class="card"/><text x="746" y="195" class="en name">Billing</text><text x="746" y="226" class="mono body">replicated price evidence</text><text x="746" y="252" class="mono body">immutable charges</text><rect x="746" y="290" width="218" height="118" rx="16" class="db"/><text x="768" y="328" class="en body">Billing PostgreSQL</text><text x="768" y="358" class="mono small">inbox / charge / outbox</text><text x="768" y="386" class="mono small">DEFERRED / QUARANTINED</text><rect x="784" y="432" width="180" height="36" rx="18" fill="#3a260d" stroke="#f59e0b"/><text x="874" y="456" text-anchor="middle" class="mono topic">ChargeRated</text>
    <rect x="1050" y="150" width="330" height="340" rx="24" class="card"/><text x="1076" y="195" class="en name">Invoice</text><text x="1076" y="226" class="mono body">immutable invoice lines</text><text x="1076" y="252" class="mono body">source event links</text><rect x="1076" y="290" width="278" height="118" rx="16" class="db"/><text x="1098" y="328" class="en body">Invoice PostgreSQL</text><text x="1098" y="358" class="mono small">inbox / line / outbox</text><text x="1098" y="386" class="mono small">correction appends a line</text><rect x="1126" y="432" width="228" height="36" rx="18" fill="#3a260d" stroke="#f59e0b"/><text x="1240" y="456" text-anchor="middle" class="mono topic">InvoiceIssued</text>
  </g>
  <rect x="60" y="560" width="1320" height="104" rx="22" fill="#172238" stroke="#f59e0b" stroke-width="2"/><text x="90" y="600" class="en name">Kafka public event contracts</text><text x="90" y="632" class="mono body">at-least-once delivery / versioned envelopes / replayable immutable facts</text>
  <path d="M255 490V546" class="pub connector" data-connector="meter-publish"/><path d="M585 490V546" class="pub connector" data-connector="usage-publish"/><path d="M915 490V546" class="pub connector" data-connector="billing-publish"/><path d="M1245 490V546" class="pub connector" data-connector="invoice-publish"/><path d="M440 560V504" class="sub connector" data-connector="usage-consume"/><path d="M770 560V504" class="sub connector" data-connector="billing-consume"/><path d="M1100 560V504" class="sub connector" data-connector="invoice-consume"/>
  <rect x="368" y="512" width="144" height="28" rx="14" fill="#08243a"/><text x="440" y="531" text-anchor="middle" class="mono label" fill="#7dd3fc">consume price</text><rect x="696" y="512" width="148" height="28" rx="14" fill="#08243a"/><text x="770" y="531" text-anchor="middle" class="mono label" fill="#7dd3fc">price + usage</text><rect x="1026" y="512" width="148" height="28" rx="14" fill="#08243a"/><text x="1100" y="531" text-anchor="middle" class="mono label" fill="#7dd3fc">rated charges</text>
  <g filter="url(#shadow)"><rect x="280" y="724" width="880" height="126" rx="24" class="card"/><text x="318" y="770" class="en name">Query</text><text x="318" y="798" class="mono body">Builds tenant projections from all four topics.</text><text x="318" y="824" class="mono body">Exposes quarantine and recovery diagnostics.</text><rect x="810" y="746" width="312" height="78" rx="16" class="db"/><text x="836" y="778" class="en body">Query PostgreSQL</text><text x="836" y="806" class="mono small">inbox / checkpoint / quarantine / redrive audit</text></g>
  <path d="M720 664V710" class="sub connector" data-connector="query-consume"/><rect x="624" y="674" width="192" height="28" rx="14" fill="#08243a"/><text x="720" y="693" text-anchor="middle" class="mono label" fill="#7dd3fc">consume all public events</text>
</svg>
