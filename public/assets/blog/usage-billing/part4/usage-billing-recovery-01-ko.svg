<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1650" viewBox="0 0 1440 1650" role="img" aria-labelledby="title desc">
  <title id="title">장애를 복구하는 여섯 단계</title>
  <desc id="desc">기준 데이터를 보존한 채 탐지부터 재개 승인까지 증거로 연결합니다.</desc>
  <defs>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#16304a" stroke-width="1" opacity="0.42" />
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#f59e0b" />
    </marker>
    <style>
      .title { fill:#f8fafc; font:700 48px Inter, Pretendard, sans-serif; }
      .subtitle { fill:#9fb3c8; font:500 22px Inter, Pretendard, sans-serif; }
      .card-group rect { fill:#111f34; stroke:#476581; stroke-width:3; }
      .card-title { fill:#f8fafc; font:700 25px Inter, Pretendard, sans-serif; }
      .card-copy { fill:#b8c9dc; font:500 18px Inter, Pretendard, sans-serif; }
      .transient rect { stroke:#38bdf8; }
      .contract rect { stroke:#f59e0b; }
      .mismatch rect { stroke:#a78bfa; }
      .gate rect { fill:#102c35; stroke:#22c55e; stroke-width:4; }
      .gate .card-title { fill:#86efac; }
      .resume rect { fill:#102b3c; stroke:#22d3ee; stroke-width:4; }
      .connector { fill:none; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
      .connector.cyan { stroke:#38bdf8; }
      .connector.amber { stroke:#f59e0b; }
      .branch-label rect { fill:#082f49; stroke:#0ea5e9; stroke-width:2; }
      .branch-label text { fill:#7dd3fc; font:700 18px Inter, Pretendard, sans-serif; }
      .footer { fill:#fbbf24; font:650 20px Inter, Pretendard, sans-serif; }
    </style>
  </defs>
  <rect width="1440" height="1650" fill="#071423" />
  <rect width="1440" height="1650" fill="url(#grid)" />
  <text x="80" y="86" class="title">장애를 복구하는 여섯 단계</text>
  <text x="80" y="128" class="subtitle">기준 데이터를 보존한 채 탐지부터 재개 승인까지 증거로 연결합니다.</text>

  
    <g class="card-group normal">
      <rect x="430" y="180" width="580" height="120" rx="24" class="card" />
      <text x="720" y="225" class="card-title" text-anchor="middle">1. 탐지</text>
      <text x="720" y="257" class="card-copy" text-anchor="middle">Lag · 실패 상태 · 금액 불일치</text>
    </g>
  <path d="M 720 300 L 720 350" class="connector cyan" marker-end="url(#arrow-cyan)" />
  
    <g class="card-group normal">
      <rect x="430" y="365" width="580" height="120" rx="24" class="card" />
      <text x="720" y="410" class="card-title" text-anchor="middle">2. 영향 범위 식별</text>
      <text x="720" y="442" class="card-copy" text-anchor="middle">Tenant · 기간 · Event · Generation</text>
    </g>
  <path d="M 720 485 L 720 535" class="connector cyan" marker-end="url(#arrow-cyan)" />
  
    <g class="card-group normal">
      <rect x="430" y="550" width="580" height="120" rx="24" class="card" />
      <text x="720" y="595" class="card-title" text-anchor="middle">3. 실패 분류</text>
      <text x="720" y="627" class="card-copy" text-anchor="middle">자동 복구와 운영자 개입 경계를 결정</text>
    </g>

  <path d="M 610 670 L 610 710 Q 610 730 590 730 L 280 730 Q 260 730 260 750 L 260 760" class="connector cyan" marker-end="url(#arrow-cyan)" />
  <path d="M 720 670 L 720 760" class="connector amber" marker-end="url(#arrow-amber)" />
  <path d="M 830 670 L 830 710 Q 830 730 850 730 L 1160 730 Q 1180 730 1180 750 L 1180 760" class="connector cyan" marker-end="url(#arrow-cyan)" />

  
    <g class="card-group transient">
      <rect x="70" y="775" width="380" height="170" rx="24" class="card" />
      <text x="260" y="820" class="card-title" text-anchor="middle">일시적 장애</text>
      <text x="260" y="852" class="card-copy" text-anchor="middle">재시도 · Lease 인계</text>
<text x="260" y="879" class="card-copy" text-anchor="middle">기존 작업 재사용</text>
    </g>
  
    <g class="card-group contract">
      <rect x="530" y="775" width="380" height="170" rx="24" class="card" />
      <text x="720" y="820" class="card-title" text-anchor="middle">영구 계약 오류</text>
      <text x="720" y="852" class="card-copy" text-anchor="middle">격리 · 계약 수정</text>
<text x="720" y="879" class="card-copy" text-anchor="middle">불변 원본 Redrive</text>
    </g>
  
    <g class="card-group mismatch">
      <rect x="990" y="775" width="380" height="170" rx="24" class="card" />
      <text x="1180" y="820" class="card-title" text-anchor="middle">정합성 오류</text>
      <text x="1180" y="852" class="card-copy" text-anchor="middle">Replay · Rebuild</text>
<text x="1180" y="879" class="card-copy" text-anchor="middle">Append-only 보정</text>
    </g>

  <path d="M 260 945 L 260 990 Q 260 1010 280 1010 L 670 1010 Q 690 1010 690 1030 L 690 1055" class="connector cyan" marker-end="url(#arrow-cyan)" />
  <path d="M 720 945 L 720 1055" class="connector amber" marker-end="url(#arrow-amber)" />
  <path d="M 1180 945 L 1180 990 Q 1180 1010 1160 1010 L 770 1010 Q 750 1010 750 1030 L 750 1055" class="connector cyan" marker-end="url(#arrow-cyan)" />
  
    <g class="card-group normal">
      <rect x="330" y="1070" width="780" height="120" rx="24" class="card" />
      <text x="720" y="1115" class="card-title" text-anchor="middle">4. 정합성 검증</text>
      <text x="720" y="1147" class="card-copy" text-anchor="middle">원장 · Event Store · Projection · Read Model 대조</text>
    </g>
  <path d="M 720 1190 L 720 1240" class="connector cyan" marker-end="url(#arrow-cyan)" />
  
    <g class="card-group gate">
      <rect x="330" y="1255" width="780" height="120" rx="24" class="card" />
      <text x="720" y="1300" class="card-title" text-anchor="middle">5. 복구 완료 Gate</text>
      <text x="720" y="1332" class="card-copy" text-anchor="middle">Cursor · Quarantine · 금액 · Fencing Token · Lag</text>
    </g>
  <path d="M 720 1375 L 720 1415" class="connector cyan" marker-end="url(#arrow-cyan)" />
  
    <g class="card-group resume">
      <rect x="330" y="1430" width="780" height="120" rx="24" class="card" />
      <text x="720" y="1475" class="card-title" text-anchor="middle">6. 재개 승인</text>
      <text x="720" y="1507" class="card-copy" text-anchor="middle">관찰 범위를 유지하며 트래픽을 단계적으로 복원</text>
    </g>
  <text x="720" y="1590" class="footer" text-anchor="middle">금지: 원본 사실 수정 · Checkpoint 건너뛰기 · 실패 상태 강제 완료 · 재무 이력 덮어쓰기</text>
</svg>