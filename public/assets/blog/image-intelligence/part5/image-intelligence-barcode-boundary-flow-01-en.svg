<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1450" viewBox="0 0 1800 1450" role="img" aria-labelledby="title desc">
<title id="title">From the ZXing adapter to visitor-pass policy</title>
<desc id="desc">A flow diagram showing ImmutableImage and BarcodeOptions crossing the provider-neutral BarcodeReader boundary, becoming BarcodeResult facts inside the ZXing adapter, retaining AnalysisResult states, and reaching VisitorPassPolicy actions.</desc>
<defs>
<linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="0.58" stop-color="#0c1730"/><stop offset="1" stop-color="#10142a"/></linearGradient>
<marker id="arrow-blue" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#66aee8" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-cyan" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#50c7d9" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-purple" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#a78bfa" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-green" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#57c58a" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-amber" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#f0ad5b" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-red" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#ef7d8f" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-muted" viewBox="0 0 14 14" markerWidth="10" markerHeight="10" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#8191ab" stroke="none" stroke-dasharray="none"/></marker>
<style>
.title{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:48px;font-weight:700;fill:#f8fafc}.subtitle{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:20px;fill:#a9b8d4}.section{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:25px;font-weight:700;fill:#f8fafc}.card-title{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:25px;font-weight:700;fill:#f8fafc}.body{font-family:'Comic Mono','goorm Sans',monospace;font-size:18px;fill:#cbd7ea}.mono{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:18px;fill:#b9c9e2}.small{font-family:'Comic Mono','goorm Sans',monospace;font-size:15px;fill:#9fb0ca}.status{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:22px;font-weight:700;fill:#f8fafc}.status-detail{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:15px;fill:#b9c9e2}.label{font-family:'Comic Mono','goorm Sans',monospace;font-size:14px;font-weight:700;fill:#e7eef9}.row{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:16px;fill:#dce7f5}.card{stroke-width:2}.frame{stroke-width:2}.label-bg{stroke-width:1.5}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round}.divider{stroke:#405777;stroke-width:1.5}
</style>
</defs>
<rect width="1800" height="1450" fill="url(#canvas)"/>
<rect x="28" y="28" width="1744" height="1394" rx="28" fill="none" stroke="#2b4168" stroke-width="2"/>
<text class="title" x="900" y="74" text-anchor="middle">From the ZXing adapter to visitor-pass policy</text>
<text class="subtitle" x="900" y="114" text-anchor="middle">The adapter normalizes payloads, AnalysisResult preserves state, and policy chooses the action.</text>
<rect class="label-bg" x="550" y="132" width="210" height="28" rx="10" fill="#101c31" stroke="#66aee8"/>
<text class="label" x="655.0" y="151" text-anchor="middle">data contract</text>
<rect class="label-bg" x="776" y="132" width="235" height="28" rx="10" fill="#101c31" stroke="#8191ab"/>
<text class="label" x="893.5" y="151" text-anchor="middle">adapter implementation</text>
<rect class="label-bg" x="1027" y="132" width="185" height="28" rx="10" fill="#101c31" stroke="#a78bfa"/>
<text class="label" x="1119.5" y="151" text-anchor="middle">policy action</text>
<rect class="frame" x="70" y="180" width="1660" height="350" rx="28" fill="#0c172a" stroke="#344968"/>
<text class="section" x="110" y="225">Contract boundary: callers keep the same result when the provider changes</text>
<path class="connector" data-edge-id="input-reader" data-source="input" data-target="reader" d="M410 360 H525" stroke="#66aee8" stroke-width="4" marker-end="url(#arrow-blue)"/>
<path class="connector" data-edge-id="reader-adapter" data-source="reader" data-target="adapter" d="M785 360 H835" stroke="#8191ab" stroke-width="3" marker-end="url(#arrow-muted)"/>
<path class="connector" data-edge-id="adapter-backend" data-source="adapter" data-target="backend" d="M990 397 V415" stroke="#8191ab" stroke-width="3" marker-end="url(#arrow-muted)"/>
<path class="connector" data-edge-id="adapter-result" data-source="adapter" data-target="result" d="M1145 360 H1240" stroke="#66aee8" stroke-width="4" marker-end="url(#arrow-blue)"/>
<rect class="label-bg" x="435" y="323" width="70" height="30" rx="10" fill="#101c31" stroke="#66aee8"/><text class="label" x="470.0" y="343" text-anchor="middle">input + options</text>
<rect class="label-bg" x="785" y="323" width="50" height="30" rx="10" fill="#101c31" stroke="#8191ab"/><text class="label" x="810.0" y="343" text-anchor="middle">impl</text>
<rect class="label-bg" x="1150" y="323" width="90" height="30" rx="10" fill="#101c31" stroke="#66aee8"/><text class="label" x="1195.0" y="343" text-anchor="middle">normalized</text>
<g data-node-id="input"><rect class="card" x="110" y="275" width="300" height="170" rx="22" fill="#203e61" stroke="#66aee8"/><text class="mono" x="140" y="316">qualified ImmutableImage</text><text class="card-title" x="140" y="358">Input + options</text><text class="mono" x="140" y="396">format / tryHarder / rawBytes</text><text class="small" x="140" y="424">qualified ImmutableImage</text></g>
<g data-node-id="reader"><rect class="card" x="525" y="275" width="260" height="170" rx="22" fill="#173d4e" stroke="#50c7d9"/><text class="mono" x="555" y="316">BarcodeReader</text><text class="card-title" x="555" y="358">provider-neutral API</text><text class="mono" x="555" y="396">List&lt;BarcodeResult&gt;</text><text class="small" x="555" y="424">controller / policy stops here</text></g>
<g data-node-id="adapter"><rect class="frame" x="835" y="250" width="310" height="220" rx="22" fill="#173d4e" stroke="#50c7d9" stroke-dasharray="10 8"/><text class="mono" x="865" y="283">images-barcode-zxing</text><text class="small" x="865" y="308">adapter module</text><rect class="card" x="865" y="330" width="250" height="66" rx="16" fill="#203e61" stroke="#66aee8"/><text class="card-title" x="990" y="371" text-anchor="middle">ZxingBarcodeReader</text><rect class="label-bg" x="865" y="415" width="250" height="38" rx="12" fill="#101c31" stroke="#8191ab"/><text class="status-detail" x="990" y="440" text-anchor="middle">ZXing / MultiFormatReader</text><text class="small" x="990" y="488" text-anchor="middle">ZXing stays inside this card</text></g>
<g data-node-id="result"><rect class="card" x="1240" y="275" width="440" height="170" rx="22" fill="#203e61" stroke="#66aee8"/><text class="mono" x="1270" y="316">List&lt;BarcodeResult&gt;</text><text class="card-title" x="1270" y="358">Normalized facts</text><text class="mono" x="1270" y="396">text / format / provider</text><text class="small" x="1270" y="424">region? / rawBytes? / ZXing types are not exposed</text></g>
<rect class="frame" x="70" y="600" width="1660" height="300" rx="28" fill="#0c172a" stroke="#344968"/>
<text class="section" x="110" y="650">State wrapper: these outcomes are not the same</text>
<text class="small" x="110" y="678">Do not collapse no-code results with a provider that never ran.</text>
<path class="connector" data-edge-id="result-state" data-source="result" data-target="analysis-state" d="M1460 445 V555 Q1460 575 1440 575 H920 Q900 575 900 595 V690" stroke="#66aee8" stroke-width="4" marker-end="url(#arrow-blue)"/>
<rect class="label-bg" x="1060" y="545" width="245" height="30" rx="10" fill="#101c31" stroke="#66aee8"/><text class="label" x="1182.5" y="565" text-anchor="middle">result + normalized failure</text>
<path class="connector" data-edge-id="state-policy" data-source="analysis-state" data-target="policy" d="M1085 875 V1000" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow-purple)"/>
<rect class="label-bg" x="1110" y="914" width="145" height="30" rx="10" fill="#101c31" stroke="#a78bfa"/><text class="label" x="1182.5" y="934" text-anchor="middle">facts + states</text>
<g data-node-id="analysis-state"><rect class="label-bg" x="770" y="690" width="260" height="34" rx="11" fill="#101c31" stroke="#66aee8"/><text class="label" x="900" y="713" text-anchor="middle">AnalysisResult</text></g>
<g data-node-id="completed"><rect class="card" x="110" y="745" width="370" height="130" rx="18" fill="#183e32" stroke="#57c58a"/><text class="status" x="136" y="785">Completed</text><text class="status-detail" x="136" y="823">BarcodeResult present</text><text class="small" x="136" y="853">payload available</text></g>
<g data-node-id="empty"><rect class="card" x="505" y="745" width="370" height="130" rx="18" fill="#25334a" stroke="#8191ab"/><text class="status" x="531" y="785">Empty</text><text class="status-detail" x="531" y="823">reader ran / no code</text><text class="small" x="531" y="853">normal empty result</text></g>
<g data-node-id="unavailable"><rect class="card" x="900" y="745" width="370" height="130" rx="18" fill="#4a3521" stroke="#f0ad5b"/><text class="status" x="926" y="785">Unavailable</text><text class="status-detail" x="926" y="823">provider not configured</text><text class="small" x="926" y="853">no execution path</text></g>
<g data-node-id="failed"><rect class="card" x="1295" y="745" width="370" height="130" rx="18" fill="#4b2534" stroke="#ef7d8f"/><text class="status" x="1321" y="785">Failed</text><text class="status-detail" x="1321" y="823">decode / format / input error</text><text class="small" x="1321" y="853">preserve failure reason</text></g>
<rect class="frame" x="70" y="1000" width="1660" height="390" rx="28" fill="#0c172a" stroke="#344968"/>
<text class="section" x="110" y="1050">Policy interprets meaning; the application performs side effects</text>
<path class="connector" data-edge-id="policy-decision" data-source="policy" data-target="decision" d="M930 1195 H1010" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow-purple)"/>
<rect class="label-bg" x="940" y="1158" width="70" height="30" rx="10" fill="#101c31" stroke="#a78bfa"/><text class="label" x="975.0" y="1178" text-anchor="middle">action</text>
<g data-node-id="policy"><rect class="card" x="110" y="1100" width="820" height="210" rx="22" fill="#352b58" stroke="#a78bfa"/><text class="mono" x="145" y="1140">VisitorPassPolicy.decide</text><text class="small" x="145" y="1165">facts + states -&gt; action</text><text class="row" x="145" y="1205">completed + QR_CODE + visitor:</text><rect class="label-bg" x="700" y="1180" width="190" height="34" rx="11" fill="#101c31" stroke="#57c58a"/><text class="label" x="795" y="1203" text-anchor="middle">ALLOW</text><text class="row" x="145" y="1245">completed + other payload</text><rect class="label-bg" x="700" y="1220" width="190" height="34" rx="11" fill="#101c31" stroke="#ef7d8f"/><text class="label" x="795" y="1243" text-anchor="middle">REJECT</text><text class="row" x="145" y="1285">Empty / Unavailable / Failed</text><rect class="label-bg" x="650" y="1260" width="240" height="34" rx="11" fill="#101c31" stroke="#a78bfa"/><text class="label" x="770" y="1283" text-anchor="middle">MANUAL_REVIEW</text></g>
<g data-node-id="decision"><rect class="card" x="1010" y="1100" width="650" height="210" rx="22" fill="#171b37" stroke="#a78bfa"/><text class="mono" x="1045" y="1140">VisitorPassDecision</text><text class="card-title" x="1045" y="1170">action + reasons</text><rect class="label-bg" x="1045" y="1185" width="145" height="34" rx="11" fill="#101c31" stroke="#57c58a"/><text class="label" x="1117" y="1208" text-anchor="middle">ALLOW</text><rect class="label-bg" x="1205" y="1185" width="145" height="34" rx="11" fill="#101c31" stroke="#ef7d8f"/><text class="label" x="1277" y="1208" text-anchor="middle">REJECT</text><rect class="label-bg" x="1365" y="1185" width="245" height="34" rx="11" fill="#101c31" stroke="#a78bfa"/><text class="label" x="1487" y="1208" text-anchor="middle">MANUAL_REVIEW</text><text class="small" x="1045" y="1255">policy returns; application executes</text><text class="small" x="1045" y="1285">Application boundary: HTTP / storage / rendering</text></g>
<rect class="label-bg" x="110" y="1330" width="1550" height="38" rx="14" fill="#101c31" stroke="#405777"/>
<text class="body" x="885" y="1355" text-anchor="middle">ZXing decodes -&gt; the adapter normalizes -&gt; policy interprets -&gt; the application performs side effects</text>
</svg>
