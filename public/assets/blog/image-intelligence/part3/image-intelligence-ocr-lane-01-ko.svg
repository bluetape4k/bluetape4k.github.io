<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">OCR 분석 경로와 통합 응답</title>
  <desc id="desc">자격 판정된 이미지가 OCR 공급자, 실행 보호 경계, 상태 계약과 공개 응답을 거쳐 객체 검출과 바코드 형제 결과와 함께 통합 응답으로 모이는 구조.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/><stop offset="0.58" stop-color="#0c1730"/><stop offset="1" stop-color="#10142a"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-20%" width="136%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity="0.58"/></filter>
    <marker id="arrow-cyan" data-role="primary" data-tip-direction="positive-x" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#50c7d9"/></marker>
    <marker id="arrow-amber" data-role="primary" data-tip-direction="positive-x" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#f0ad5b"/></marker>
    <marker id="arrow-green" data-role="primary" data-tip-direction="positive-x" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L13 7 L1 13 Z" fill="#57c58a"/></marker>
    <style>
      .title{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:44px;font-weight:700;fill:#f8fafc}.subtitle{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:19px;fill:#a9b8d4}
      .card{fill:#14233a;stroke-width:2;filter:url(#shadow)}.cardTitle{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:28px;font-weight:700;fill:#f8fafc}.cardType{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:17px;fill:#9fb0ca}.field{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:18px;fill:#c5d4e9}.body{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:18px;fill:#c7d3e7}.small{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:16px;fill:#9fb0ca}.connector{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.label{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:17px;font-weight:700;fill:#e7eef9}.labelBg{fill:#101c31;stroke-width:1.5}
    </style>
  </defs>
  <rect width="2000" height="1200" rx="34" fill="url(#canvas)"/><rect x="28" y="28" width="1944" height="1144" rx="28" fill="none" stroke="#2b4168" stroke-width="2"/>
  <text class="title" x="1000" y="76" text-anchor="middle">OCR 결과는 실행 상태와 함께 통합 응답으로 이동한다</text>
  <text class="subtitle" x="1000" y="114" text-anchor="middle">공급자 예외를 형제 결과까지 덮어쓰지 않고, 각 경로의 상태를 그대로 보존합니다.</text>

  <g id="node-qualified-image" data-node="qualified-image"><rect class="card" x="90" y="430" width="330" height="190" rx="24" stroke="#8aa4c7"/><text class="cardType" x="125" y="474">ImageUploadQualifier</text><text class="cardTitle" x="125" y="522">QualifiedImage</text><text class="field" x="125" y="562">ImmutableImage</text><text class="small" x="125" y="596">입력 판정과 단일 디코딩을 통과</text></g>
  <g id="node-ocr-provider" data-node="ocr-provider"><rect class="card" x="520" y="180" width="380" height="210" rx="24" stroke="#50c7d9"/><text class="cardType" x="560" y="224">OcrAnalysisProvider</text><text class="cardTitle" x="560" y="272">OCR 공급자</text><text class="field" x="560" y="314">suspend analyze(image)</text><text class="small" x="560" y="355">픽스처 또는 Tesseract 구현</text></g>
  <g id="node-runner" data-node="guarded-runner"><rect class="card" x="520" y="470" width="380" height="210" rx="24" stroke="#a78bfa"/><text class="cardType" x="560" y="514">GuardedAnalysisRunner</text><text class="cardTitle" x="560" y="562">실행 보호 경계</text><text class="field" x="560" y="604">withPermit · withTimeout</text><text class="small" x="560" y="645">취소는 다시 던지고, 타임아웃은 변환</text></g>
  <g id="node-analysis-result" data-node="analysis-result"><rect class="card" x="990" y="470" width="370" height="210" rx="24" stroke="#f0ad5b"/><text class="cardType" x="1030" y="514">AnalysisResult</text><text class="cardTitle" x="1030" y="562">OCR 상태 계약</text><text class="field" x="1030" y="604">Completed · Empty</text><text class="field" x="1030" y="636">Unavailable · Failed</text><text class="small" x="1030" y="667">provider · elapsedMillis를 함께 보존</text></g>
  <g id="node-ocr-response" data-node="ocr-response"><rect class="card" x="1420" y="180" width="390" height="210" rx="24" stroke="#50c7d9"/><text class="cardType" x="1460" y="224">OcrAnalysisResponse</text><text class="cardTitle" x="1460" y="272">공개 OCR 응답</text><text class="field" x="1460" y="314">result.text · pageCount</text><text class="field" x="1460" y="346">reasonCode (필요할 때)</text></g>
  <g id="node-detection-lane" data-node="detection-lane"><rect class="card" x="980" y="820" width="380" height="180" rx="24" stroke="#f0ad5b"/><text class="cardType" x="1020" y="864">DetectionAnalysisResponse</text><text class="cardTitle" x="1020" y="912">객체 검출 형제 경로</text><text class="small" x="1020" y="952">OCR 실패와 독립적으로 보존</text></g>
  <g id="node-barcode-lane" data-node="barcode-lane"><rect class="card" x="520" y="820" width="380" height="180" rx="24" stroke="#57c58a"/><text class="cardType" x="560" y="864">BarcodeAnalysisResponse</text><text class="cardTitle" x="560" y="912">바코드 형제 경로</text><text class="small" x="560" y="952">QR 판독 상태를 별도 필드로 보존</text></g>
  <g id="node-aggregate-response" data-node="aggregate-response"><rect class="card" x="1450" y="500" width="430" height="500" rx="28" stroke="#a78bfa"/><text class="cardType" x="1490" y="548">ImageIntelligenceResponse</text><text class="cardTitle" x="1490" y="596">통합 응답</text><rect x="1490" y="632" width="350" height="128" rx="18" fill="#101c31" stroke="#7789a8" stroke-width="1.5"/><text class="small" x="1520" y="670">AggregateStatus</text><text class="body" x="1520" y="712">COMPLETED · PARTIAL</text><text class="body" x="1520" y="742">FAILED</text><rect x="1490" y="790" width="350" height="164" rx="18" fill="#171b37" stroke="#a78bfa" stroke-width="1.5"/><text class="small" x="1520" y="828">ocr · detection · barcodes</text><text class="body" x="1520" y="872">각 분석 결과를 함께 반환</text><text class="body" x="1520" y="906">정책 계층은 다음 경계에서 결정</text></g>

  <path class="connector" data-connector="image-to-ocr" d="M420 470 H470 Q490 470 490 450 V285 Q490 265 500 265 H520" stroke="#50c7d9" marker-end="url(#arrow-cyan)"/>
  <path class="connector" data-connector="image-to-barcode" d="M420 580 H460 Q480 580 480 910 H520" stroke="#57c58a" marker-end="url(#arrow-green)"/>
  <path class="connector" data-connector="ocr-to-runner" d="M710 390 V470" stroke="#50c7d9" marker-end="url(#arrow-cyan)"/>
  <path class="connector" data-connector="runner-to-state" d="M900 575 H990" stroke="#a78bfa" marker-end="url(#arrow-cyan)"/>
  <path class="connector" data-connector="state-to-response" d="M1175 470 V430 Q1175 410 1195 410 H1340 Q1380 410 1380 370 V320 Q1380 240 1400 280 H1420" stroke="#f0ad5b" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="ocr-to-aggregate" d="M1600 390 V450 Q1600 470 1620 470 H1680 Q1720 470 1720 430 V500" stroke="#50c7d9" marker-end="url(#arrow-cyan)"/>
  <path class="connector" data-connector="detection-to-aggregate" d="M1360 910 H1400 Q1430 910 1430 870 H1450" stroke="#f0ad5b" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="barcode-to-aggregate" d="M900 910 H930 Q950 910 950 1040 H1400 Q1430 1040 1430 970 H1450" stroke="#57c58a" marker-end="url(#arrow-green)"/>

  <rect class="labelBg" x="280" y="370" width="220" height="42" rx="13" stroke="#8aa4c7"/><text class="label" x="390" y="398" text-anchor="middle">공통 입력</text>
  <rect class="labelBg" x="930" y="404" width="190" height="42" rx="13" stroke="#a78bfa"/><text class="label" x="1025" y="432" text-anchor="middle">상태로 변환</text>
  <rect class="labelBg" x="1250" y="248" width="210" height="42" rx="13" stroke="#50c7d9"/><text class="label" x="1355" y="276" text-anchor="middle">공개 계약</text>
  <rect x="150" y="1060" width="1700" height="62" rx="20" fill="#101c31" stroke="#405777" stroke-width="1.5"/><text class="body" x="1000" y="1090" text-anchor="middle">OCR의 `Failed`가 검출·바코드 결과를 지우지 않습니다.</text><text class="small" x="1000" y="1114" text-anchor="middle">집계 상태는 각 경로의 사용 가능성을 설명하고, 개별 결과는 원래 계약으로 남습니다.</text>
</svg>
