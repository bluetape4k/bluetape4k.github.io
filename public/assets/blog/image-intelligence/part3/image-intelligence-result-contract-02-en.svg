<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">The four OCR states and their response contracts</title>
  <desc id="desc">A comparison of Completed, Empty, Unavailable, and Failed OCR states, their public fields, and the aggregate status they inform.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="0.58" stop-color="#0c1730"/><stop offset="1" stop-color="#10142a"/></linearGradient>
    <filter id="shadow" x="-18%" y="-20%" width="136%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity="0.58"/></filter>
    <marker id="arrow-cyan" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M0 0 L14 7 L0 14 Z" fill="#50c7d9" stroke="#50c7d9" stroke-dasharray="none"/></marker>
    <marker id="arrow-amber" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M0 0 L14 7 L0 14 Z" fill="#f0ad5b" stroke="#f0ad5b" stroke-dasharray="none"/></marker>
    <marker id="arrow-red" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M0 0 L14 7 L0 14 Z" fill="#ef7181" stroke="#ef7181" stroke-dasharray="none"/></marker>
    <style>
      .title{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:44px;font-weight:700;fill:#f8fafc}.subtitle{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:19px;fill:#a9b8d4}.card{fill:#14233a;stroke-width:2;filter:url(#shadow)}.cardTitle{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:29px;font-weight:700;fill:#f8fafc}.cardTitleSmall{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:21px;font-weight:700;fill:#f8fafc}.cardType{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:17px;fill:#9fb0ca}.field{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:18px;fill:#c5d4e9}.body{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:18px;fill:#c7d3e7}.small{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:16px;fill:#9fb0ca}.connector{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.label{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:17px;font-weight:700;fill:#e7eef9}
    </style>
  </defs>
  <rect width="2000" height="1200" fill="#07101f"/><rect width="2000" height="1200" rx="34" fill="url(#canvas)"/><rect x="28" y="28" width="1944" height="1144" rx="28" fill="none" stroke="#2b4168" stroke-width="2"/>
  <text class="title" x="1000" y="76" text-anchor="middle">The four OCR states describe different contracts</text>
  <text class="subtitle" x="1000" y="114" text-anchor="middle">The public response distinguishes no text, no provider, and execution failure.</text>

  <g id="node-completed" data-node="completed"><rect class="card" x="70" y="190" width="430" height="340" rx="26" stroke="#57c58a"/><text class="cardType" x="110" y="236">AnalysisResult.Completed</text><text class="cardTitle" x="110" y="286">Completed</text><text class="body" x="110" y="332">The provider returned OCR data</text><rect x="110" y="370" width="350" height="112" rx="18" fill="#101c31" stroke="#57c58a" stroke-width="1.5"/><text class="field" x="135" y="414">result.text</text><text class="field" x="135" y="448">result.pageCount</text><text class="small" x="110" y="510">Expose text and page count</text></g>
  <g id="node-empty" data-node="empty"><rect class="card" x="540" y="190" width="430" height="340" rx="26" stroke="#50c7d9"/><text class="cardType" x="580" y="236">AnalysisResult.Empty</text><text class="cardTitle" x="580" y="286">Empty</text><text class="body" x="580" y="332">The provider ran but found no text</text><rect x="580" y="370" width="350" height="112" rx="18" fill="#101c31" stroke="#50c7d9" stroke-width="1.5"/><text class="field" x="605" y="414">status = EMPTY</text><text class="field" x="605" y="448">provider · elapsedMillis</text><text class="small" x="580" y="510">Do not turn it into a failure</text></g>
  <g id="node-unavailable" data-node="unavailable"><rect class="card" x="1010" y="190" width="430" height="340" rx="26" stroke="#f0ad5b"/><text class="cardType" x="1050" y="236">AnalysisResult.Unavailable</text><text class="cardTitle" x="1050" y="286">Unavailable</text><text class="body" x="1050" y="332">The provider is not configured or usable</text><rect x="1050" y="370" width="350" height="112" rx="18" fill="#101c31" stroke="#f0ad5b" stroke-width="1.5"/><text class="field" x="1075" y="414">status = UNAVAILABLE</text><text class="field" x="1075" y="448">reasonCode</text><text class="small" x="1050" y="510">Make configuration absence explicit</text></g>
  <g id="node-failed" data-node="failed"><rect class="card" x="1480" y="190" width="430" height="340" rx="26" stroke="#ef7181"/><text class="cardType" x="1520" y="236">AnalysisResult.Failed</text><text class="cardTitle" x="1520" y="286">Failed</text><text class="body" x="1520" y="332">A timeout or provider exception occurred</text><rect x="1520" y="370" width="350" height="112" rx="18" fill="#101c31" stroke="#ef7181" stroke-width="1.5"/><text class="field" x="1545" y="414">status = FAILED</text><text class="field" x="1545" y="448">reasonCode</text><text class="small" x="1520" y="510">Expose a stable reason, not raw text</text></g>

  <path class="connector" data-connector="completed-to-aggregate" d="M285 530 V760" stroke="#57c58a" marker-end="url(#arrow-cyan)"/>
  <path class="connector" data-connector="empty-to-aggregate" d="M755 530 V760" stroke="#50c7d9" marker-end="url(#arrow-cyan)"/>
  <path class="connector" data-connector="unavailable-to-aggregate" d="M1225 530 V760" stroke="#f0ad5b" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="failed-to-aggregate" d="M1695 530 V760" stroke="#ef7181" marker-end="url(#arrow-red)"/>

  <g id="node-ocr-result" data-node="ocr-result"><rect x="140" y="760" width="390" height="165" rx="22" fill="#101c31" stroke="#57c58a" stroke-width="2"/><text class="cardTitle" x="175" y="810">Response: include result</text><text class="field" x="175" y="852">text · pageCount</text><text class="small" x="175" y="890">Return the extracted value</text></g>
  <g id="node-empty-contract" data-node="empty-contract"><rect x="590" y="760" width="330" height="165" rx="22" fill="#101c31" stroke="#50c7d9" stroke-width="2"/><text class="cardTitle" x="625" y="810">Response: status only</text><text class="field" x="625" y="852">status · provider</text><text class="small" x="625" y="890">Empty is a normal outcome</text></g>
  <g id="node-unavailable-contract" data-node="unavailable-contract"><rect x="1000" y="760" width="420" height="165" rx="22" fill="#101c31" stroke="#f0ad5b" stroke-width="2"/><text class="cardTitle" x="1035" y="810">Response: unavailable</text><text class="field" x="1035" y="852">status · reasonCode</text><text class="small" x="1035" y="890">provider_not_configured, for example</text></g>
  <g id="node-failed-contract" data-node="failed-contract"><rect x="1500" y="760" width="330" height="165" rx="22" fill="#101c31" stroke="#ef7181" stroke-width="2"/><text class="cardTitleSmall" x="1535" y="810">Response: execution failed</text><text class="field" x="1535" y="852">status · reasonCode</text><text class="small" x="1535" y="890">timeout · provider_failure</text></g>

  <g id="node-aggregate-status" data-node="aggregate-status"><rect class="card" x="300" y="1000" width="1400" height="112" rx="24" stroke="#a78bfa"/><text class="cardType" x="350" y="1043">ImageIntelligenceService</text><text class="cardTitle" x="600" y="1050">Aggregate status</text><text class="body" x="1000" y="1050">COMPLETED: all available lanes finish</text><text class="body" x="1000" y="1082">PARTIAL: some lanes available · FAILED: no lane available</text></g>
  <rect x="140" y="1140" width="1720" height="1" fill="#405777"/><text class="small" x="1000" y="1160" text-anchor="middle">Parent-request cancellation is propagated through coroutine lifecycle, not converted into one of these four states.</text>
</svg>
