<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2120" viewBox="0 0 1800 2120" role="img" aria-labelledby="title desc">
<title id="title">Detection facts become ordered visitor-pass policy decisions</title>
<desc id="desc">A visitor-pass policy evaluates analysis results in precedence order: sensitive region, invalid QR, degraded lanes, valid conditions, and remaining review reasons, while keeping application side effects outside the policy.</desc>
<defs>
<linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101f"/><stop offset="0.58" stop-color="#0c1730"/><stop offset="1" stop-color="#10142a"/></linearGradient>
<marker id="arrow-blue" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#66aee8" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-cyan" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#50c7d9" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-amber" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#f0ad5b" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-red" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#ef7d8f" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-rose" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#f0937a" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-purple" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#a78bfa" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-green" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#57c58a" stroke="none" stroke-dasharray="none"/></marker>
<marker id="arrow-muted" viewBox="0 0 14 14" markerWidth="10" markerHeight="10" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-tip-direction="positive-x"><path d="M1 1 L13 7 L1 13 Z" fill="#8191ab" stroke="none" stroke-dasharray="none"/></marker>
<style>
.title{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:46px;font-weight:700;fill:#f8fafc}.subtitle{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:20px;fill:#a9b8d4}.section{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:25px;font-weight:700;fill:#f8fafc}.cardTitle{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:29px;font-weight:700;fill:#f8fafc}.actionTitle{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:25px;font-weight:700;fill:#f8fafc}.body{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:19px;fill:#cbd7ea}.mono{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:18px;fill:#b9c9e2}.small{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:16px;fill:#9fb0ca}.rowTitle{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:22px;font-weight:700;fill:#f8fafc}.rowDetail{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:15px;fill:#b9c9e2}.step{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:20px;font-weight:700;fill:#f8fafc}.label{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:16px;font-weight:700;fill:#e7eef9}.card{fill:#14233a;stroke-width:2}.frame{fill:#0c172a;fill-opacity:.42;stroke:#344968;stroke-width:2}.pill{fill:#101c31;stroke-width:1.5}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round}.muted{fill:#9fb0ca}</style>
</defs>
<rect width="1800" height="2120" fill="url(#canvas)"/>
<rect x="28" y="28" width="1744" height="2064" rx="28" fill="none" stroke="#2b4168" stroke-width="2"/>
<text class="title" x="900" y="76" text-anchor="middle">Detection facts become ordered visitor-pass policy decisions</text>
<text class="subtitle" x="900" y="116" text-anchor="middle">Detectors preserve facts and states, policy chooses an action, and the application owns the actual side effects.</text>
<rect class="card" x="390" y="170" width="1020" height="176" rx="24" fill="#14233a" stroke="#66aee8"/>
<text class="mono" x="450" y="214">ImageAnalysisResults</text>
<text class="cardTitle" x="450" y="258">Analysis facts and states</text>
<text class="mono" x="450" y="300">detection · barcode · ocr</text>
<text class="body" x="940" y="258">Preserve DetectionResult · AnalysisResult · reason</text>
<text class="small" x="940" y="300">Empty results and execution failures are not the same list</text>
<path class="connector" d="M900 346 V414" stroke="#66aee8" stroke-width="4" marker-end="url(#arrow-blue)"/>
<rect class="pill" x="755" y="365" width="290" height="38" rx="12" fill="#101c31" stroke="#66aee8"/>
<text class="label" x="900" y="390" text-anchor="middle">facts + states</text>
<rect class="card" x="260" y="430" width="1280" height="170" rx="26" fill="#171b37" stroke="#a78bfa"/>
<text class="mono" x="330" y="474">VisitorPassPolicy.decide</text>
<text class="cardTitle" x="330" y="520">Evaluate precedence in order</text>
<text class="body" x="330" y="558">Return the first matching result; do not combine facts and treatment commands in one type.</text>
<path class="connector" d="M900 600 V746" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow-purple)"/>
<rect class="pill" x="1010" y="660" width="220" height="38" rx="12" fill="#101c31" stroke="#a78bfa"/>
<text class="label" x="1120" y="685" text-anchor="middle">policy evaluation</text>
<rect class="frame" x="100" y="650" width="1600" height="810" rx="28" fill="#0c172a" stroke="#344968"/>
<text class="section" x="150" y="700">Return on first match</text>
<text class="small" x="150" y="730">Yes → return action · No → continue</text>
<rect class="card" x="170" y="760" width="700" height="102" rx="22" fill="#4a3521" stroke="#f0ad5b"/>
<circle cx="218" cy="811" r="27" fill="#f0ad5b" opacity="0.28" stroke="#f0ad5b" stroke-width="2"/>
<text class="step" x="218" y="818" text-anchor="middle">1</text>
<text class="rowTitle" x="270" y="800">Was a sensitive region detected?</text>
<text class="rowDetail" x="270" y="836">SENSITIVE_REGION</text>
<rect class="card" x="1000" y="760" width="600" height="102" rx="22" fill="#4b2534" stroke="#ef7d8f"/>
<text class="small" x="1042" y="792">action</text>
<text class="actionTitle" x="1042" y="825">QUARANTINE</text>
<text class="rowDetail" x="1270" y="825">SENSITIVE_REGION_DETECTED</text>
<path class="connector" d="M870 811 H1000" stroke="#ef7d8f" stroke-width="4" marker-end="url(#arrow-red)"/>
<text class="label" x="935" y="803" text-anchor="middle">Yes</text>
<path class="connector" d="M520 862 V895" stroke="#8191ab" stroke-width="4" marker-end="url(#arrow-muted)"/>
<text class="small" x="565" y="888">No · continue</text>
<rect class="card" x="170" y="895" width="700" height="102" rx="22" fill="#4a3521" stroke="#f0ad5b"/>
<circle cx="218" cy="946" r="27" fill="#f0ad5b" opacity="0.28" stroke="#f0ad5b" stroke-width="2"/>
<text class="step" x="218" y="953" text-anchor="middle">2</text>
<text class="rowTitle" x="270" y="935">Is a completed barcode not a visitor QR?</text>
<text class="rowDetail" x="270" y="971">INVALID_VISITOR_QR</text>
<rect class="card" x="1000" y="895" width="600" height="102" rx="22" fill="#4a2c28" stroke="#f0937a"/>
<text class="small" x="1042" y="927">action</text>
<text class="actionTitle" x="1042" y="960">REJECT</text>
<text class="rowDetail" x="1270" y="960">INVALID_VISITOR_QR</text>
<path class="connector" d="M870 946 H1000" stroke="#f0937a" stroke-width="4" marker-end="url(#arrow-rose)"/>
<text class="label" x="935" y="938" text-anchor="middle">Yes</text>
<path class="connector" d="M520 997 V1030" stroke="#8191ab" stroke-width="4" marker-end="url(#arrow-muted)"/>
<text class="small" x="565" y="1023">No · continue</text>
<rect class="card" x="170" y="1030" width="700" height="102" rx="22" fill="#4a3521" stroke="#f0ad5b"/>
<circle cx="218" cy="1081" r="27" fill="#f0ad5b" opacity="0.28" stroke="#f0ad5b" stroke-width="2"/>
<text class="step" x="218" y="1088" text-anchor="middle">3</text>
<text class="rowTitle" x="270" y="1070">Is any analysis lane Failed / Unavailable?</text>
<text class="rowDetail" x="270" y="1106">degraded reason from OCR · DETECTION · BARCODE</text>
<rect class="card" x="1000" y="1030" width="600" height="102" rx="22" fill="#4a3521" stroke="#f0ad5b"/>
<text class="small" x="1042" y="1062">action</text>
<text class="actionTitle" x="1042" y="1095">MANUAL_REVIEW</text>
<text class="rowDetail" x="1270" y="1095">failure or provider unavailable</text>
<path class="connector" d="M870 1081 H1000" stroke="#f0ad5b" stroke-width="4" marker-end="url(#arrow-amber)"/>
<text class="label" x="935" y="1073" text-anchor="middle">Yes</text>
<path class="connector" d="M520 1132 V1165" stroke="#8191ab" stroke-width="4" marker-end="url(#arrow-muted)"/>
<text class="small" x="565" y="1158">No · continue</text>
<rect class="card" x="170" y="1165" width="700" height="102" rx="22" fill="#352b58" stroke="#a78bfa"/>
<circle cx="218" cy="1216" r="27" fill="#a78bfa" opacity="0.28" stroke="#a78bfa" stroke-width="2"/>
<text class="step" x="218" y="1223" text-anchor="middle">4</text>
<text class="rowTitle" x="270" y="1205">Are there no review reasons?</text>
<text class="rowDetail" x="270" y="1241">face = 1 · visitor QR = 1 · OCR text not blank</text>
<rect class="card" x="1000" y="1165" width="600" height="102" rx="22" fill="#183e32" stroke="#57c58a"/>
<text class="small" x="1042" y="1197">action</text>
<text class="actionTitle" x="1042" y="1230">ALLOW</text>
<text class="rowDetail" x="1270" y="1230">example auto-approval conditions</text>
<path class="connector" d="M870 1216 H1000" stroke="#57c58a" stroke-width="4" marker-end="url(#arrow-green)"/>
<text class="label" x="935" y="1208" text-anchor="middle">Yes</text>
<path class="connector" d="M520 1267 V1300" stroke="#8191ab" stroke-width="4" marker-end="url(#arrow-muted)"/>
<text class="small" x="565" y="1293">No · continue</text>
<rect class="card" x="170" y="1300" width="700" height="102" rx="22" fill="#352b58" stroke="#a78bfa"/>
<circle cx="218" cy="1351" r="27" fill="#a78bfa" opacity="0.28" stroke="#a78bfa" stroke-width="2"/>
<text class="step" x="218" y="1358" text-anchor="middle">5</text>
<text class="rowTitle" x="270" y="1340">Do any remaining conditions disagree?</text>
<text class="rowDetail" x="270" y="1376">Empty · count mismatch · missing OCR content</text>
<rect class="card" x="1000" y="1300" width="600" height="102" rx="22" fill="#352b58" stroke="#a78bfa"/>
<text class="small" x="1042" y="1332">action</text>
<text class="actionTitle" x="1042" y="1365">MANUAL_REVIEW</text>
<text class="rowDetail" x="1270" y="1365">preserve a concrete review reason</text>
<path class="connector" d="M870 1351 H1000" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow-purple)"/>
<text class="label" x="935" y="1343" text-anchor="middle">Yes</text>
<path class="connector" d="M900 1460 V1532" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow-purple)"/>
<rect class="card" x="300" y="1545" width="1200" height="190" rx="26" fill="#171b37" stroke="#a78bfa"/>
<text class="mono" x="370" y="1588">VisitorPassDecision</text>
<text class="cardTitle" x="370" y="1632">action + reasons</text>
<text class="body" x="370" y="1670">The policy returns a treatment command and reasons; it does not mutate pixels itself.</text>
<rect class="pill" x="370" y="1690" width="200" height="34" rx="12" fill="#101c31" stroke="#57c58a"/>
<text class="label" x="470" y="1713" text-anchor="middle">ALLOW</text>
<rect class="pill" x="610" y="1690" width="310" height="34" rx="12" fill="#101c31" stroke="#a78bfa"/>
<text class="label" x="765" y="1713" text-anchor="middle">MANUAL_REVIEW</text>
<rect class="pill" x="960" y="1690" width="200" height="34" rx="12" fill="#101c31" stroke="#f0937a"/>
<text class="label" x="1060" y="1713" text-anchor="middle">REJECT</text>
<rect class="pill" x="1240" y="1690" width="200" height="34" rx="12" fill="#101c31" stroke="#ef7d8f"/>
<text class="label" x="1340" y="1713" text-anchor="middle">QUARANTINE</text>
<path class="connector" d="M900 1735 V1792" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow-purple)"/>
<rect class="card" x="190" y="1810" width="1420" height="190" rx="26" fill="#14233a" stroke="#66aee8"/>
<text class="mono" x="260" y="1852">Application boundary</text>
<text class="cardTitle" x="260" y="1897">The application owns actual side effects</text>
<text class="small" x="260" y="1942">Renderer</text>
<text class="mono" x="260" y="1972">BLUR · MOSAIC · SOLID_MASK</text>
<text class="small" x="740" y="1942">Storage</text>
<text class="mono" x="740" y="1972">DROP · QUARANTINE</text>
<text class="small" x="1190" y="1942">HTTP / Review</text>
<text class="mono" x="1190" y="1972">REJECT · MANUAL_REVIEW</text>
<rect class="pill" x="170" y="2030" width="1460" height="48" rx="22" fill="#101c31" stroke="#405777"/>
<text class="body" x="900" y="2061" text-anchor="middle">The detector reports facts, policy chooses an action, and the application performs rendering, storage, rejection, and manual review.</text>
</svg>
