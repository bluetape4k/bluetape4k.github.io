<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2440" viewBox="0 0 1500 2440" role="img" aria-labelledby="title desc">
  <title id="title">From uploaded image to QualifiedImage</title>
  <desc id="desc">A vertical flow in which a multipart image passes early input rejection, actual byte and file-format checks, dimension and pixel budgets, and one full decode before becoming a QualifiedImage.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.58" stop-color="#0c1730"/>
      <stop offset="1" stop-color="#11152c"/>
    </linearGradient>
    <linearGradient id="qualified" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d38"/>
      <stop offset="1" stop-color="#142c3d"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-20%" width="136%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity="0.58"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L13 7 L1 13 Z" fill="#66aee8"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L13 7 L1 13 Z" fill="#57c58a"/>
    </marker>
    <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L13 7 L1 13 Z" fill="#ef7d7d"/>
    </marker>
    <style>
      .title{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:48px;font-weight:700;fill:#f8fafc}
      .subtitle{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:21px;fill:#a9b8d4}
      .cardTitle{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:30px;font-weight:700;fill:#f8fafc}
      .body{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:20px;fill:#cbd7ea}
      .mono{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:18px;fill:#b9c9e2}
      .small{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:17px;fill:#9fb0ca}
      .step{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:20px;font-weight:700;fill:#f8fafc}
      .rejectTitle{font-family:'Architects Daughter','goorm Sans',sans-serif;font-size:22px;font-weight:700;fill:#ffd0d0}
      .rejectCode{font-family:'Comic Mono','goorm Sans Code',monospace;font-size:17px;fill:#f4b4b4}
      .card{fill:#14233a;stroke-width:2;filter:url(#shadow)}
      .connector{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .rejectLine{fill:none;stroke:#ef7d7d;stroke-width:3;stroke-linecap:round;stroke-dasharray:8 9}
      .pill{fill:#101c31;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1500" height="2440" rx="34" fill="url(#canvas)"/>
  <rect x="28" y="28" width="1444" height="2384" rx="28" fill="none" stroke="#2b4168" stroke-width="2"/>
  <text class="title" x="750" y="82" text-anchor="middle">Qualify Input Before Analysis Begins</text>
  <text class="subtitle" x="750" y="126" text-anchor="middle">early rejection -> read once -> pixel budget -> decode once -> QualifiedImage</text>

  <g id="card-upload" data-node="upload">
    <rect class="card" x="205" y="180" width="790" height="150" rx="24" stroke="#6686b8"/>
    <circle cx="275" cy="235" r="28" fill="#263b5c" stroke="#6686b8" stroke-width="2"/>
    <text class="step" x="275" y="242" text-anchor="middle">1</text>
    <text class="small" x="330" y="220">HTTP INPUT</text>
    <text class="cardTitle" x="330" y="265">Multipart Image Upload</text>
    <text class="mono" x="330" y="302">filename | Content-Type | reported size</text>
  </g>

  <path class="connector" data-connector="upload-to-declared" d="M600 330 V412" stroke="#66aee8" marker-end="url(#arrow-blue)"/>

  <g id="card-declared" data-node="declared-guards">
    <rect class="card" x="165" y="430" width="870" height="190" rx="24" stroke="#66aee8"/>
    <circle cx="235" cy="490" r="28" fill="#203e61" stroke="#66aee8" stroke-width="2"/>
    <text class="step" x="235" y="497" text-anchor="middle">2</text>
    <text class="small" x="290" y="474">LOW-COST DECLARED GUARDS</text>
    <text class="cardTitle" x="290" y="520">Reject Before Reading</text>
    <text class="body" x="290" y="565">empty input | supported MIME | reported compressed size</text>
    <text class="mono" x="290" y="598">PNG | JPEG | WebP / maxInputBytes</text>
  </g>

  <path class="rejectLine" data-connector="declared-to-reject" d="M1035 525 H1110" marker-end="url(#arrow-red)"/>

  <g id="reject-early" data-node="reject-early">
    <rect x="1125" y="438" width="240" height="176" rx="20" fill="#301c2b" stroke="#c76070" stroke-width="2"/>
    <text class="rejectTitle" x="1245" y="484" text-anchor="middle">Reject Now</text>
    <text class="rejectCode" x="1245" y="523" text-anchor="middle">400</text>
    <text class="rejectCode" x="1245" y="553" text-anchor="middle">or 413</text>
    <text class="small" x="1245" y="590" text-anchor="middle">0 decodes</text>
  </g>

  <path class="connector" data-connector="declared-to-read" d="M600 620 V702" stroke="#66aee8" marker-end="url(#arrow-blue)"/>
  <text class="small" x="630" y="672">PASS</text>

  <g id="card-read" data-node="read-once">
    <rect class="card" x="205" y="720" width="790" height="160" rx="24" stroke="#7e9fd0"/>
    <circle cx="275" cy="780" r="28" fill="#283d5f" stroke="#7e9fd0" stroke-width="2"/>
    <text class="step" x="275" y="787" text-anchor="middle">3</text>
    <text class="small" x="330" y="763">READ ONCE</text>
    <text class="cardTitle" x="330" y="810">Read Upload Bytes Once</text>
    <text class="body" x="330" y="850">Reuse the same ByteArray for every later check and decode</text>
  </g>

  <path class="connector" data-connector="read-to-actual" d="M600 880 V962" stroke="#66aee8" marker-end="url(#arrow-blue)"/>

  <g id="card-actual" data-node="actual-guards">
    <rect class="card" x="165" y="980" width="870" height="210" rx="24" stroke="#50c7d9"/>
    <circle cx="235" cy="1040" r="28" fill="#173d4e" stroke="#50c7d9" stroke-width="2"/>
    <text class="step" x="235" y="1047" text-anchor="middle">4</text>
    <text class="small" x="290" y="1024">ACTUAL CONTENT GUARDS</text>
    <text class="cardTitle" x="290" y="1070">Check Actual Bytes and File Format</text>
    <text class="body" x="290" y="1115">actual size | PNG/JPEG/WebP signature</text>
    <text class="body" x="290" y="1152">declared MIME matches the actual signature</text>
  </g>

  <path class="rejectLine" data-connector="actual-to-reject" d="M1035 1085 H1110" marker-end="url(#arrow-red)"/>

  <g id="reject-content" data-node="reject-content">
    <rect x="1125" y="998" width="240" height="176" rx="20" fill="#301c2b" stroke="#c76070" stroke-width="2"/>
    <text class="rejectTitle" x="1245" y="1044" text-anchor="middle">Reject Input</text>
    <text class="rejectCode" x="1245" y="1083" text-anchor="middle">format / size</text>
    <text class="rejectCode" x="1245" y="1113" text-anchor="middle">mismatch</text>
    <text class="small" x="1245" y="1150" text-anchor="middle">0 decodes</text>
  </g>

  <path class="connector" data-connector="actual-to-probe" d="M600 1190 V1272" stroke="#66aee8" marker-end="url(#arrow-blue)"/>

  <g id="card-probe" data-node="dimension-probe">
    <rect class="card" x="205" y="1290" width="790" height="160" rx="24" stroke="#f0ad5b"/>
    <circle cx="275" cy="1350" r="28" fill="#4a3521" stroke="#f0ad5b" stroke-width="2"/>
    <text class="step" x="275" y="1357" text-anchor="middle">5</text>
    <text class="small" x="330" y="1333">DIMENSION PROBE</text>
    <text class="cardTitle" x="330" y="1380">Probe Width and Height First</text>
    <text class="body" x="330" y="1420">Read dimensions before allocating the full pixel buffer</text>
  </g>

  <path class="connector" data-connector="probe-to-budget" d="M600 1450 V1532" stroke="#66aee8" marker-end="url(#arrow-blue)"/>

  <g id="card-budget" data-node="decoded-budget">
    <rect class="card" x="165" y="1550" width="870" height="200" rx="24" stroke="#f0ad5b"/>
    <circle cx="235" cy="1610" r="28" fill="#4a3521" stroke="#f0ad5b" stroke-width="2"/>
    <text class="step" x="235" y="1617" text-anchor="middle">6</text>
    <text class="small" x="290" y="1594">DECODED BUDGET</text>
    <text class="cardTitle" x="290" y="1640">Check Side and Total-Pixel Budgets</text>
    <text class="mono" x="290" y="1685">maxInputSide = 8,192</text>
    <text class="mono" x="290" y="1720">maxInputPixels = 16,777,216</text>
  </g>

  <path class="rejectLine" data-connector="budget-to-reject" d="M1035 1650 H1110" marker-end="url(#arrow-red)"/>

  <g id="reject-budget" data-node="reject-budget">
    <rect x="1125" y="1562" width="240" height="176" rx="20" fill="#301c2b" stroke="#c76070" stroke-width="2"/>
    <text class="rejectTitle" x="1245" y="1608" text-anchor="middle">Over Budget</text>
    <text class="rejectCode" x="1245" y="1647" text-anchor="middle">413</text>
    <text class="rejectCode" x="1245" y="1677" text-anchor="middle">payload_too_large</text>
    <text class="small" x="1245" y="1714" text-anchor="middle">0 decodes</text>
  </g>

  <path class="connector" data-connector="budget-to-decode" d="M600 1750 V1842" stroke="#66aee8" marker-end="url(#arrow-blue)"/>

  <g id="card-decode" data-node="decode-once">
    <rect class="card" x="205" y="1860" width="790" height="170" rx="24" stroke="#a78bfa"/>
    <circle cx="275" cy="1920" r="28" fill="#352b58" stroke="#a78bfa" stroke-width="2"/>
    <text class="step" x="275" y="1927" text-anchor="middle">7</text>
    <text class="small" x="330" y="1903">ONE FULL DECODE</text>
    <text class="cardTitle" x="330" y="1950">Decode the Complete Image Once</text>
    <text class="body" x="330" y="1993">Normalize damaged content to image_not_decodable</text>
  </g>

  <path class="connector" data-connector="decode-to-qualified" d="M600 2030 V2122" stroke="#57c58a" marker-end="url(#arrow-green)"/>
  <text class="small" x="632" y="2081">PASS</text>

  <g id="card-qualified" data-node="qualified-image">
    <rect x="135" y="2140" width="930" height="180" rx="28" fill="url(#qualified)" stroke="#57c58a" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="215" cy="2202" r="31" fill="#183e32" stroke="#57c58a" stroke-width="2"/>
    <path d="M200 2203 L211 2214 L232 2189" fill="none" stroke="#8ce8b4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="small" x="275" y="2188">QUALIFIED INPUT</text>
    <text class="cardTitle" x="275" y="2235">QualifiedImage</text>
    <text class="mono" x="275" y="2276">mediaType | dimensions | ImmutableImage</text>
  </g>

  <rect class="pill" x="175" y="2352" width="1150" height="58" rx="18" stroke="#405777"/>
  <text class="body" x="750" y="2390" text-anchor="middle">Shared invariant: rejected input = 0 decodes | qualified input = 1 decode</text>
</svg>
