<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1420" viewBox="0 0 2000 1420" role="img" aria-labelledby="title desc">
  <title id="title">이미지 인텔리전스 API의 전체 처리 경계</title>
  <desc id="desc">업로드 이미지를 공통 자격 판정에서 확인하고 한 번 디코딩한 뒤 OCR, 객체 검출, 바코드와 QR 경로를 독립 실행하여 부분 결과와 방문증 정책으로 연결한다.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.58" stop-color="#0c1730"/>
      <stop offset="1" stop-color="#10142a"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-20%" width="136%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#020617" flood-opacity="0.58"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L13 7 L1 13 Z" fill="#66aee8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L13 7 L1 13 Z" fill="#50c7d9"/>
    </marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L13 7 L1 13 Z" fill="#f0ad5b"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L13 7 L1 13 Z" fill="#57c58a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L13 7 L1 13 Z" fill="#a78bfa"/>
    </marker>
    <style>
      .title{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:46px;font-weight:700;fill:#f8fafc}
      .subtitle{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:20px;fill:#a9b8d4}
      .section{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:23px;font-weight:700;fill:#f8fafc}
      .cardTitle{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:27px;font-weight:700;fill:#f8fafc}
      .body{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:18px;fill:#cbd7ea}
      .mono{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:17px;fill:#b9c9e2}
      .small{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:16px;fill:#9fb0ca}
      .card{fill:#14233a;stroke-width:2;filter:url(#shadow)}
      .connector{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .pill{fill:#101c31;stroke-width:1.5}
    </style>
  </defs>

  <rect width="2000" height="1420" rx="34" fill="url(#canvas)"/>
  <rect x="28" y="28" width="1944" height="1364" rx="28" fill="none" stroke="#2b4168" stroke-width="2"/>
  <text class="title" x="1000" y="76" text-anchor="middle">이미지 한 장을 여러 분석 계약으로 나눈다</text>
  <text class="subtitle" x="1000" y="116" text-anchor="middle">공통 입력 자격 판정 → 단일 디코딩 → 독립 분석 → 부분 결과 → 업무 정책</text>

  <g id="card-upload" data-node="upload">
    <rect class="card" x="80" y="190" width="340" height="180" rx="24" stroke="#6686b8"/>
    <text class="small" x="120" y="230">HTTP INPUT</text>
    <text class="cardTitle" x="120" y="272">이미지 업로드</text>
    <text class="mono" x="120" y="312">multipart file</text>
    <text class="body" x="120" y="344">PNG · JPEG · WebP</text>
  </g>

  <g id="card-qualifier" data-node="qualifier">
    <rect class="card" x="510" y="165" width="520" height="230" rx="24" stroke="#66aee8"/>
    <text class="small" x="550" y="207">SHARED QUALIFICATION</text>
    <text class="cardTitle" x="550" y="250">입력 자격 판정</text>
    <text class="body" x="550" y="290">미디어 타입 · 실제 파일 시그니처</text>
    <text class="body" x="550" y="324">압축 바이트 · 가로/세로 · 전체 픽셀</text>
    <text class="body" x="550" y="358">디코딩 가능한 이미지인지 확인</text>
  </g>

  <g id="card-image" data-node="immutable-image">
    <rect class="card" x="1180" y="190" width="430" height="180" rx="24" stroke="#7e9fd0"/>
    <text class="small" x="1220" y="230">ONE DECODE</text>
    <text class="cardTitle" x="1220" y="272">ImmutableImage</text>
    <text class="body" x="1220" y="312">검증된 이미지 객체 하나를</text>
    <text class="body" x="1220" y="344">세 처리 경로가 읽기 전용으로 공유</text>
  </g>

  <path class="connector" data-connector="upload-to-qualifier" d="M420 280 H510" stroke="#66aee8" marker-end="url(#arrow-blue)"/>
  <path class="connector" data-connector="qualifier-to-image" d="M1030 280 H1180" stroke="#66aee8" marker-end="url(#arrow-blue)"/>

  <text class="section" x="1000" y="480" text-anchor="middle">같은 입력, 서로 다른 결과와 실패 의미</text>

  <path class="connector" data-connector="image-to-ocr" d="M1270 370 V438 Q1270 452 1256 452 H354 Q340 452 340 466 V535" stroke="#50c7d9" marker-end="url(#arrow-cyan)"/>
  <path class="connector" data-connector="image-to-detection" d="M1395 370 V500 Q1395 514 1381 514 H1014 Q1000 514 1000 528 V535" stroke="#f0ad5b" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="image-to-barcode" d="M1520 370 V438 Q1520 452 1534 452 H1646 Q1660 452 1660 466 V535" stroke="#57c58a" marker-end="url(#arrow-green)"/>

  <g id="card-ocr" data-node="ocr">
    <rect class="card" x="150" y="550" width="380" height="230" rx="24" stroke="#50c7d9"/>
    <text class="small" x="190" y="592">ANALYSIS LANE</text>
    <text class="cardTitle" x="190" y="635">OCR</text>
    <text class="mono" x="190" y="676">text · pageCount</text>
    <text class="body" x="190" y="718">Completed · Empty</text>
    <text class="body" x="190" y="750">Unavailable · Failed</text>
  </g>

  <g id="card-detection" data-node="detection">
    <rect class="card" x="810" y="550" width="380" height="230" rx="24" stroke="#f0ad5b"/>
    <text class="small" x="850" y="592">ANALYSIS LANE</text>
    <text class="cardTitle" x="850" y="635">객체 검출</text>
    <text class="mono" x="850" y="676">label · category · confidence</text>
    <text class="body" x="850" y="718">Completed · Empty</text>
    <text class="body" x="850" y="750">Unavailable · Failed</text>
  </g>

  <g id="card-barcode" data-node="barcode">
    <rect class="card" x="1470" y="550" width="380" height="230" rx="24" stroke="#57c58a"/>
    <text class="small" x="1510" y="592">ANALYSIS LANE</text>
    <text class="cardTitle" x="1510" y="635">바코드 · QR</text>
    <text class="mono" x="1510" y="676">text · format · provider</text>
    <text class="body" x="1510" y="718">Completed · Empty</text>
    <text class="body" x="1510" y="750">Unavailable · Failed</text>
  </g>

  <path class="connector" data-connector="ocr-to-aggregate" d="M340 780 V826 Q340 840 354 840 H770 Q784 840 784 854 V885" stroke="#50c7d9" marker-end="url(#arrow-cyan)"/>
  <path class="connector" data-connector="detection-to-aggregate" d="M1000 780 V885" stroke="#f0ad5b" marker-end="url(#arrow-amber)"/>
  <path class="connector" data-connector="barcode-to-aggregate" d="M1660 780 V826 Q1660 840 1646 840 H1230 Q1216 840 1216 854 V885" stroke="#57c58a" marker-end="url(#arrow-green)"/>

  <g id="card-aggregate" data-node="aggregate">
    <rect class="card" x="650" y="900" width="700" height="170" rx="26" stroke="#7d8ca8"/>
    <text class="small" x="700" y="942">PARTIAL RESULT CONTRACT</text>
    <text class="cardTitle" x="700" y="986">부분 결과 조합</text>
    <text class="mono" x="700" y="1027">COMPLETED · PARTIAL · FAILED</text>
    <text class="body" x="1030" y="1027">성공한 결과와 실패 사유를 함께 보존</text>
  </g>

  <path class="connector" data-connector="aggregate-to-policy" d="M1000 1070 V1140" stroke="#a78bfa" marker-end="url(#arrow-purple)"/>

  <g id="card-policy" data-node="policy">
    <rect class="card" x="580" y="1155" width="840" height="135" rx="26" stroke="#a78bfa"/>
    <text class="small" x="630" y="1195">BUSINESS POLICY</text>
    <text class="cardTitle" x="630" y="1238">방문증 정책</text>
    <text class="mono" x="905" y="1238">ALLOW · MANUAL_REVIEW · REJECT · QUARANTINE</text>
  </g>

  <rect class="pill" x="110" y="1322" width="1780" height="58" rx="20" stroke="#405777"/>
  <circle cx="155" cy="1351" r="7" fill="#66aee8"/>
  <text class="body" x="178" y="1358">입력 자격 판정 실패 시 분석을 시작하지 않는다.</text>
  <circle cx="770" cy="1351" r="7" fill="#57c58a"/>
  <text class="body" x="793" y="1358">한 경로의 실패가 다른 결과를 지우지 않는다.</text>
  <circle cx="1390" cy="1351" r="7" fill="#a78bfa"/>
  <text class="body" x="1413" y="1358">요청 취소는 부분 성공으로 바꾸지 않는다.</text>
</svg>
