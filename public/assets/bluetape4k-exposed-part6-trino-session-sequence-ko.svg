<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Trino session options and EXPLAIN pushdown inspection sequence</title>
  <desc id="desc">Sequence for the local-only Exposed Trino workshop path that validates typed session options, generates SQL locally, and prepares an EXPLAIN request without contacting Trino.</desc>
  <defs>
    <style>
      text { letter-spacing: 0; }
      .title { font-family: "goorm Sans"; font-size: 40px; font-weight: 400; fill: #F5F9FF; }
      .subtitle, .msg, .note, .footer, .role { font-family: "goorm Sans Code","goorm Sans"; fill: #D7E3F5; }
      .subtitle { font-size: 18px; }
      .participant { font-family: "goorm Sans"; font-size: 19px; font-weight: 400; fill: #F5F9FF; }
      .role { font-size: 13px; fill: #B8C7DD; }
      .msg { font-size: 14px; }
      .note { font-size: 13px; }
      .footer { font-size: 14px; fill: #8EA6C4; }
      .frame { fill: #0B1220; stroke: #284766; stroke-width: 3; }
      .header { fill: #0F1E33; stroke: #365979; stroke-width: 2; }
      .lifeline { stroke: #55718F; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #2D2415; stroke: #8f784e; stroke-width: 1.5; }
      .call { fill: none; stroke: #78AFFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowCall); }
      .sql { fill: none; stroke: #F2B84B; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSql); }
      .state { fill: none; stroke: #6FD28C; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowState); }
      .return { fill: none; stroke: #EFC46B; stroke-width: 2.5; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowReturn); }
      .alt { fill: none; stroke: #78AFFF; stroke-width: 3; stroke-dasharray: 12 7; }
      .label { fill: #0F1E33; stroke: #365979; stroke-width: 1.5; }
      .label.callLabel { stroke: #4F83B0; }
      .label.sqlLabel { stroke: #8F6F2C; }
      .label.stateLabel { stroke: #4D7B5E; }
      .label.returnLabel { stroke: #8F6F2C; }
      .badge { stroke-width: 1.8; }
      .badge.callBadge { fill: #102A43; stroke: #78AFFF; }
      .badge.sqlBadge { fill: #332812; stroke: #F2B84B; }
      .badge.stateBadge { fill: #142C22; stroke: #6FD28C; }
      .badge.returnBadge { fill: #332812; stroke: #EFC46B; }
      .badgeText { font-family: "goorm Sans Code","goorm Sans"; font-size: 12px; font-weight: 700; }
      .msg.callText, .badgeText.callText { fill: #9DC7FF; }
      .msg.sqlText, .badgeText.sqlText { fill: #F5C76A; }
      .msg.stateText, .badgeText.stateText { fill: #8DE3A6; }
      .msg.returnText, .badgeText.returnText { fill: #F5CF7A; }
    </style>
    <marker id="arrowCall" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#78AFFF" stroke="#78AFFF" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowSql" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#F2B84B" stroke="#F2B84B" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowState" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#6FD28C" stroke="#6FD28C" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
    <marker id="arrowReturn" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#EFC46B" stroke="#EFC46B" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1112" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">Trino 세션 옵션과 푸시다운 점검</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">타입이 있는 옵션을 로컬에서 검증하고 Exposed로 SQL을 만든 뒤 네트워크 없이 Trino EXPLAIN 요청을 준비합니다.</text>

  <g id="participants">
    <rect x="60" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="145" y="179" text-anchor="middle" class="participant">워크숍 테스트</text>
    <text x="145" y="201" text-anchor="middle" class="role">JUnit 로컬 경로</text>

    <rect x="300" y="150" width="210" height="68" rx="10" class="header"/>
    <text x="405" y="179" text-anchor="middle" class="participant">Trino 프로필</text>
    <text x="405" y="201" text-anchor="middle" class="role">검증된 입력</text>

    <rect x="580" y="150" width="220" height="68" rx="10" class="header"/>
    <text x="690" y="179" text-anchor="middle" class="participant">Trino 옵션</text>
    <text x="690" y="201" text-anchor="middle" class="role">bluetape4k API</text>

    <rect x="870" y="150" width="190" height="68" rx="10" class="header"/>
    <text x="965" y="179" text-anchor="middle" class="participant">Exposed Query</text>
    <text x="965" y="201" text-anchor="middle" class="role">warehouse DSL</text>

    <rect x="1130" y="150" width="180" height="68" rx="10" class="header"/>
    <text x="1220" y="179" text-anchor="middle" class="participant">H2 다이얼렉트</text>
    <text x="1220" y="201" text-anchor="middle" class="role">SQL 생성</text>

    <rect x="1380" y="150" width="160" height="68" rx="10" class="header"/>
    <text x="1460" y="179" text-anchor="middle" class="participant">EXPLAIN</text>
    <text x="1460" y="201" text-anchor="middle" class="role">요청 형태</text>
  </g>

  <line x1="145" y1="218" x2="145" y2="1040" class="lifeline"/>
  <line x1="405" y1="218" x2="405" y2="1040" class="lifeline"/>
  <line x1="690" y1="218" x2="690" y2="1040" class="lifeline"/>
  <line x1="965" y1="218" x2="965" y2="1040" class="lifeline"/>
  <line x1="1220" y1="218" x2="1220" y2="1040" class="lifeline"/>
  <line x1="1460" y1="218" x2="1460" y2="1040" class="lifeline"/>

  <rect x="398" y="318" width="14" height="168" rx="6" class="activation"/>
  <rect x="683" y="486" width="14" height="72" rx="6" class="activation"/>
  <rect x="958" y="642" width="14" height="200" rx="6" class="activation"/>
  <rect x="1213" y="746" width="14" height="96" rx="6" class="activation"/>
  <rect x="1453" y="992" width="14" height="70" rx="6" class="activation"/>

  <rect x="72" y="260" width="430" height="34" rx="17" class="label callLabel"/>
  <circle cx="96" cy="277" r="13" class="badge callBadge"/><text x="96" y="282" text-anchor="middle" class="badgeText callText">1</text>
  <text x="120" y="282" class="msg callText">defaultTrinoAnalyticsProfile()</text>
  <path d="M 145 326 L 398 326" class="call"/>

  <rect x="178" y="360" width="530" height="34" rx="17" class="label stateLabel"/>
  <circle cx="202" cy="377" r="13" class="badge stateBadge"/><text x="202" y="382" text-anchor="middle" class="badgeText stateText">2</text>
  <text x="226" y="382" class="msg stateText">카탈로그·스키마·소스·태그·세션 속성 검증</text>
  <path d="M 405 414 L 405 460" class="state"/>

  <rect x="430" y="434" width="470" height="34" rx="17" class="label callLabel"/>
  <circle cx="454" cy="451" r="13" class="badge callBadge"/><text x="454" y="456" text-anchor="middle" class="badgeText callText">3</text>
  <text x="478" y="456" class="msg callText">toConnectionOptions()</text>
  <path d="M 412 494 L 683 494" class="call"/>

  <rect x="442" y="508" width="520" height="34" rx="17" class="label returnLabel"/>
  <circle cx="466" cy="525" r="13" class="badge returnBadge"/><text x="466" y="530" text-anchor="middle" class="badgeText returnText">4</text>
  <text x="490" y="530" class="msg returnText">explicitPrepare=false, source, tags, sessionProperties</text>
  <path d="M 683 550 L 145 550" class="return"/>

  <rect x="138" y="594" width="470" height="34" rx="17" class="label callLabel"/>
  <circle cx="162" cy="611" r="13" class="badge callBadge"/><text x="162" y="616" text-anchor="middle" class="badgeText callText">5</text>
  <text x="186" y="616" class="msg callText">buildRegionalTopOrdersQuery()</text>
  <path d="M 145 650 L 958 650" class="call"/>

  <rect x="784" y="686" width="472" height="34" rx="17" class="label sqlLabel"/>
  <circle cx="808" cy="703" r="13" class="badge sqlBadge"/><text x="808" y="708" text-anchor="middle" class="badgeText sqlText">6</text>
  <text x="832" y="708" class="msg sqlText">로컬 H2 트랜잭션에서 prepareSQL</text>
  <path d="M 972 754 L 1213 754" class="sql"/>

  <rect x="918" y="786" width="392" height="34" rx="17" class="label returnLabel"/>
  <circle cx="942" cy="803" r="13" class="badge returnBadge"/><text x="942" y="808" text-anchor="middle" class="badgeText returnText">7</text>
  <text x="966" y="808" class="msg returnText">조건식·정렬·top-N을 포함한 SELECT</text>
  <path d="M 1213 834 L 972 834" class="return"/>

  <rect x="852" y="884" width="674" height="132" rx="14" class="alt"/>
  <rect x="884" y="902" width="236" height="30" rx="15" fill="#2D2415" stroke="#F2B84B" stroke-width="1.8"/>
  <text x="906" y="922" class="note">요청 형태만 확인</text>

  <rect x="1006" y="940" width="398" height="34" rx="17" class="label stateLabel"/>
  <circle cx="1030" cy="957" r="13" class="badge stateBadge"/><text x="1030" y="962" text-anchor="middle" class="badgeText stateText">8</text>
  <text x="1054" y="962" class="msg stateText">buildExplainRequest(sql)</text>
  <path d="M 972 1000 L 1453 1000" class="state"/>

  <rect x="98" y="1068" width="1404" height="44" rx="12" fill="#0F1E33" stroke="#284766" stroke-width="2"/>
  <text x="118" y="1096" class="note">기본 경로는 로컬에 머뭅니다. Trino 엔드포인트, 인증 정보, 네트워크 호출, 실제 커넥터, 푸시다운 결과 검증이 없습니다.</text>
  <text x="800" y="1128" text-anchor="middle" class="footer">github.com/bluetape4k/exposed-workshop - 13-ecosystem-integrations/02-trino-session-options</text>
</svg>
