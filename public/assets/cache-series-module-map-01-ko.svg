<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="930" viewBox="0 0 1520 930" role="img" aria-labelledby="title desc">
<title id="title">Bluetape4k Cache 모듈 지도</title>
<desc id="desc">cache-core가 공통 계약을 정의하고, provider 모듈이 로컬·분산 캐시 동작을 연결합니다.</desc>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/></filter>

  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#60a5fa"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#86efac"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#fbbf24"/></marker>
  <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#f87171"/></marker>
  <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#c4b5fd"/></marker>
  <marker id="arrow-cyan" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#67e8f9"/></marker>
  <style>
    .title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:44px;font-weight:700;fill:#f8fafc}
    .subtitle{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:18px;fill:#cbd5e1}
    .lane-title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-body{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:16px;fill:#cbd5e1}
    .small{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:14px;fill:#94a3b8}
    .code{font-family:"goorm Sans Code","goorm Sans","Apple SD Gothic Neo",monospace;font-size:15px;fill:#cbd5e1}
    .panel{fill:#111827;stroke:#334155;stroke-width:2}
    .card{filter:url(#shadow);stroke-width:2}

    .connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    .line-blue{stroke:#60a5fa;marker-end:url(#arrow-blue)}
    .line-green{stroke:#86efac;marker-end:url(#arrow-green)}
    .line-amber{stroke:#fbbf24;marker-end:url(#arrow-amber)}
    .line-red{stroke:#f87171;marker-end:url(#arrow-red)}
    .line-purple{stroke:#c4b5fd;marker-end:url(#arrow-purple)}
    .line-cyan{stroke:#67e8f9;marker-end:url(#arrow-cyan)}
    .dash-blue{stroke:#60a5fa;stroke-dasharray:10 9;marker-end:url(#arrow-blue)}
    .dash-green{stroke:#86efac;stroke-dasharray:10 9;marker-end:url(#arrow-green)}
    .label-bg{fill:#0f172a;stroke:#475569;stroke-width:1.5}
  </style>
</defs>
<rect width="1520" height="930" fill="#0b1220"/>
<rect x="34" y="30" width="1452" height="870" rx="28" class="panel"/>
<text x="70" y="86" class="title">Bluetape4k Cache 모듈 지도</text>
<text x="72" y="122" class="subtitle">cache-core가 공통 계약을 정의하고, provider 모듈이 로컬·분산 캐시 동작을 연결합니다.</text>
<g>
  <rect x="72" y="170" width="1376" height="610" rx="24" fill="#172033" stroke="#26364f" stroke-width="2"/>
  <text x="96" y="208" class="lane-title">공통 계약에서 provider 구현으로</text>
</g>
<g>
  <rect x="606" y="222" width="308" height="104" rx="18" fill="#172554" stroke="#60a5fa" class="card"/>
  <text x="760" y="257" text-anchor="middle" dominant-baseline="middle" class="card-title">애플리케이션 코드</text>
<text x="760" y="291" text-anchor="middle" dominant-baseline="middle" class="card-body">Spring · Ktor · Exposed</text>
</g>
<g>
  <rect x="500" y="390" width="520" height="148" rx="18" fill="#261943" stroke="#c4b5fd" class="card"/>
  <text x="760" y="436" text-anchor="middle" dominant-baseline="middle" class="small">cache-core</text>
<text x="760" y="470" text-anchor="middle" dominant-baseline="middle" class="card-body">JCache helper · SuspendCache</text>
<text x="760" y="492" text-anchor="middle" dominant-baseline="middle" class="card-body">Memoizer · NearCache · resilience</text>
</g>
<g>
  <rect x="118" y="640" width="242" height="100" rx="18" fill="#14351f" stroke="#86efac" class="card"/>
  <text x="239" y="673" text-anchor="middle" dominant-baseline="middle" class="card-title">Local provider</text>
<text x="239" y="707" text-anchor="middle" dominant-baseline="middle" class="card-body">Caffeine · Cache2k · Ehcache</text>
</g>
<g>
  <rect x="414" y="640" width="224" height="100" rx="18" fill="#3b2a08" stroke="#fbbf24" class="card"/>
  <text x="526" y="673" text-anchor="middle" dominant-baseline="middle" class="small">Memoizer</text>
<text x="526" y="707" text-anchor="middle" dominant-baseline="middle" class="card-body">sync · async · suspend</text>
</g>
<g>
  <rect x="692" y="640" width="224" height="100" rx="18" fill="#12333b" stroke="#67e8f9" class="card"/>
  <text x="804" y="673" text-anchor="middle" dominant-baseline="middle" class="small">Lettuce</text>
<text x="804" y="707" text-anchor="middle" dominant-baseline="middle" class="card-body">RESP3 NearCache</text>
</g>
<g>
  <rect x="970" y="640" width="224" height="100" rx="18" fill="#3b1217" stroke="#f87171" class="card"/>
  <text x="1082" y="673" text-anchor="middle" dominant-baseline="middle" class="small">Redisson</text>
<text x="1082" y="707" text-anchor="middle" dominant-baseline="middle" class="card-body">RLocalCachedMap</text>
</g>
<g>
  <rect x="1248" y="640" width="166" height="100" rx="18" fill="#1e293b" stroke="#64748b" class="card"/>
  <text x="1331" y="673" text-anchor="middle" dominant-baseline="middle" class="small">Hazelcast</text>
<text x="1331" y="707" text-anchor="middle" dominant-baseline="middle" class="card-body">IMap</text>
</g>
<path class="connector line-blue" d="M760 326 V390"/><rect class="label-bg" x="766" y="343" width="64" height="30" rx="15"/><text class="small" x="798" y="362" text-anchor="middle">사용</text>
<path class="connector line-green" d="M500 472 H244 Q224 472 224 492 V640"/>
<path class="connector line-amber" d="M604 538 V640"/>
<path class="connector line-cyan" d="M784 538 V640"/>
<path class="connector line-red" d="M916 538 V590 Q916 610 936 610 H1082 Q1102 610 1102 630 V640"/>
<path class="connector line-blue" d="M1020 472 H1331 Q1351 472 1351 492 V640"/>
<text x="760" y="838" text-anchor="middle" class="small">핵심: 애플리케이션은 provider 차이를 직접 다루지 않고 공통 계약을 사용합니다.</text>
</svg>
