<svg xmlns="http://www.w3.org/2000/svg" width="2020" height="1200" viewBox="0 0 2020 1200" role="img" aria-labelledby="title desc">
  <title id="title">서비스별 기준정보와 책임 경계</title>
  <desc id="desc">상품·구매·임상·CRM 기준정보 원천이 예약서비스에 사실을 입력하고, 예약서비스가 객관적 이벤트와 durable outbox를 알림·통계 consumer로 전달하는 책임 경계도입니다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0d1930"/><stop offset="1" stop-color="#11172d"/></linearGradient>
    <linearGradient id="sourceDataFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#162b45"/><stop offset="1" stop-color="#202049"/></linearGradient>
    <linearGradient id="appointmentFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123b4a"/><stop offset="1" stop-color="#192b4d"/></linearGradient>
    <linearGradient id="consumerFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#292147"/><stop offset="1" stop-color="#192d4a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.58"/></filter>
    <marker id="inputArrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" data-role="primary" data-size="14x14" data-tip-direction="positive-x"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#67e8f9" data-solid-head="true"/></marker>
    <marker id="eventArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-size="10x10" data-tip-direction="positive-x"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#c084fc" data-solid-head="true"/></marker>
    <marker id="boundaryArrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="secondary" data-size="10x10" data-tip-direction="positive-x"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#fbbf24" data-solid-head="true"/></marker>
    <style>
      .title{font-family:"goorm Sans",sans-serif;font-size:46px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"goorm Sans",sans-serif;font-size:19px;fill:#aebed2}.section{font-family:"goorm Sans",sans-serif;font-size:22px;font-weight:700;fill:#f8fafc}.card-title{font-family:"goorm Sans",sans-serif;font-size:23px;font-weight:700;fill:#f8fafc}.body{font-family:"goorm Sans",sans-serif;font-size:16px;fill:#d7e3f3}.small{font-family:"goorm Sans",sans-serif;font-size:14px;fill:#aebed2}.code{font-family:"goorm Sans Code","goorm Sans",monospace;font-size:14px;font-weight:700;fill:#f8fafc}.pill{font-family:"goorm Sans",sans-serif;font-size:13px;font-weight:700;fill:#f8fafc}.connector{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:4}.input-line{stroke:#67e8f9;marker-end:url(#inputArrow)}.event-line{stroke:#c084fc;stroke-dasharray:10 8;marker-end:url(#eventArrow)}.boundary-line{stroke:#fbbf24;stroke-dasharray:6 8;marker-end:url(#boundaryArrow)}
    </style>
  </defs>
  <rect width="2020" height="1200" fill="url(#bg)"/><rect width="2020" height="1200" rx="34" fill="url(#bg)"/><rect x="28" y="28" width="1964" height="1144" rx="30" fill="none" stroke="#263a5e" stroke-width="2"/>
  <circle cx="1860" cy="140" r="230" fill="#7c3aed" opacity=".08"/><circle cx="160" cy="1050" r="250" fill="#0891b2" opacity=".07"/>
  <text class="title" x="70" y="78">서비스별 기준정보는 책임의 경계를 만든다</text><text class="subtitle" x="72" y="116">기준정보 원천이 사실을 제공하고, 예약서비스는 방문 약속과 일정의 source of truth를 보존합니다.</text>
  <g transform="translate(1380 58)"><rect x="0" y="0" width="20" height="20" rx="6" fill="none" stroke="#67e8f9" stroke-width="3"/><text class="small" x="30" y="16">입력 사실 · 기준정보 원천</text><rect x="255" y="0" width="20" height="20" rx="6" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="6 4"/><text class="small" x="285" y="16">객관적 이벤트 · consumer</text><rect x="540" y="0" width="20" height="20" rx="6" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5 5"/><text class="small" x="570" y="16">책임 밖</text></g>

  <text class="section" x="80" y="166">업무 기준정보 원천</text><text class="section" x="730" y="166">예약서비스 책임 경계</text><text class="section" x="1550" y="166">소비자·adapter</text>

  <g filter="url(#shadow)">
    <rect x="70" y="198" width="420" height="168" rx="24" fill="url(#sourceDataFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="220" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="239" text-anchor="middle">SOURCE DATA</text><text class="card-title" x="94" y="286">상품관리·상품개발</text><text class="body" x="94" y="318">기준정보: 상품 정의 · BOM · 버전</text><text class="small" x="94" y="344">책임: catalog projection / snapshot 제공</text>
    <rect x="70" y="408" width="420" height="168" rx="24" fill="url(#sourceDataFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="430" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="449" text-anchor="middle">SOURCE DATA</text><text class="card-title" x="94" y="496">구매·커머스</text><text class="body" x="94" y="528">기준정보: 구매 계약 · 추가 구매 · 환불</text><text class="small" x="94" y="554">책임: 구매 기준정보 원천 확인 이벤트</text>
    <rect x="70" y="618" width="420" height="168" rx="24" fill="url(#sourceDataFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="640" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="659" text-anchor="middle">SOURCE DATA</text><text class="card-title" x="94" y="706">임상·시술</text><text class="body" x="94" y="738">기준정보: 시작 · 완료 · 부분 완료</text><text class="small" x="94" y="764">책임: TreatmentFulfillmentEvent 제공</text>
    <rect x="70" y="828" width="420" height="168" rx="24" fill="url(#sourceDataFill)" stroke="#38bdf8" stroke-width="2"/><rect x="94" y="850" width="142" height="28" rx="14" fill="#0c4a6e"/><text class="pill" x="165" y="869" text-anchor="middle">SOURCE DATA</text><text class="card-title" x="94" y="916">고객상담·CRM</text><text class="body" x="94" y="948">기준정보: 프로필 · 상담 · 민원 · 보상</text><text class="small" x="94" y="974">책임: 최소 재평가 결과와 상담 판단</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="700" y="198" width="640" height="798" rx="28" fill="url(#appointmentFill)" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="730" y="224" width="220" height="32" rx="16" fill="#0f766e"/><text class="pill" x="840" y="245" text-anchor="middle">SOURCE OF TRUTH</text><text class="card-title" x="730" y="302">예약서비스가 소유하는 정보</text><text class="small" x="730" y="330">계획·약속·수용량·상태·이력의 기준정보</text>
    <rect x="730" y="366" width="580" height="108" rx="18" fill="#153a4a" stroke="#22d3ee" stroke-width="2"/><text class="code" x="760" y="406">AppointmentPlan</text><text class="body" x="760" y="436">PlannedTreatment · dependency/DAG · catalog snapshot</text><text class="small" x="760" y="460">구매별 예약 의무를 재현하는 계획</text>
    <rect x="730" y="498" width="580" height="108" rx="18" fill="#1a3150" stroke="#60a5fa" stroke-width="2"/><text class="code" x="760" y="538">AppointmentCommitment / Appointment</text><text class="body" x="760" y="568">AppointmentItem · ResourceAllocation · consent</text><text class="small" x="760" y="592">PROPOSED · HELD · CONFIRMED와 방문 약속</text>
    <rect x="730" y="630" width="580" height="108" rx="18" fill="#20264b" stroke="#818cf8" stroke-width="2"/><text class="code" x="760" y="670">Capacity · PolicySnapshot · History</text><text class="body" x="760" y="700">plan revision · capacity ceiling · state history</text><text class="small" x="760" y="724">다시 계산해도 이미 동의한 약속을 덮지 않음</text>
    <rect x="730" y="762" width="580" height="108" rx="18" fill="#292347" stroke="#c084fc" stroke-width="2"/><text class="code" x="760" y="802">Objective events + durable outbox</text><text class="body" x="760" y="832">AppointmentCreated · Rescheduled · StatusChanged</text><text class="small" x="760" y="856">알림·CRM·통계는 이 사실을 소비</text>
    <rect x="730" y="894" width="580" height="76" rx="18" fill="#332817" stroke="#fbbf24" stroke-width="2"/><text class="body" x="760" y="927">예약서비스의 책임 밖</text><text class="small" x="760" y="953">가격·환불 승인 · 임상 판단 · 상담 보상 · 채널 발송 · projection 소유권</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1540" y="318" width="410" height="210" rx="24" fill="url(#consumerFill)" stroke="#c084fc" stroke-width="2"/><rect x="1564" y="342" width="142" height="28" rx="14" fill="#581c87"/><text class="pill" x="1635" y="361" text-anchor="middle">CONSUMER</text><text class="card-title" x="1564" y="410">알림 adapter·채널</text><text class="body" x="1564" y="442">기준정보: 연락처 · 언어 · 동의 · 발송 이력</text><text class="small" x="1564" y="474">책임: outbox 선점·재시도·provider 전달</text><text class="small" x="1564" y="500">예약서비스가 SMS를 직접 호출하지 않음</text>
    <rect x="1540" y="650" width="410" height="210" rx="24" fill="url(#consumerFill)" stroke="#c084fc" stroke-width="2"/><rect x="1564" y="674" width="142" height="28" rx="14" fill="#581c87"/><text class="pill" x="1635" y="693" text-anchor="middle">CONSUMER</text><text class="card-title" x="1564" y="742">통계·외부 projection</text><text class="body" x="1564" y="774">기준정보: 자체 read model · SLA 지표</text><text class="small" x="1564" y="806">책임: schema 계약을 읽고 projection 생성</text><text class="small" x="1564" y="832">예약 원본 상태를 소유하지 않음</text>
  </g>

  <g>
    <path class="connector input-line" data-connector="product-input" d="M 490 282 H 620 Q 640 282 640 302 V 318 Q 640 330 660 330 H 700"/><text class="small" x="500" y="268">catalog version</text>
    <path class="connector input-line" data-connector="commerce-input" d="M 490 492 H 620 Q 640 492 640 512 V 518 Q 640 530 660 530 H 700"/><text class="small" x="500" y="478">PurchaseCompleted</text>
    <path class="connector input-line" data-connector="clinical-input" d="M 490 702 H 620 Q 640 702 640 722 V 738 Q 640 750 660 750 H 700"/><text class="small" x="500" y="688">fulfillment fact</text>
    <path class="connector input-line" data-connector="crm-input" d="M 490 900 H 700"/><text class="small" x="500" y="888">reassessment outcome</text>
    <path class="connector event-line" data-connector="notification-output" d="M 1340 810 H 1410 Q 1430 810 1430 790 V 434 Q 1430 422 1450 422 H 1540"/><text class="small" x="1350" y="786">event + outbox</text>
    <path class="connector event-line" data-connector="statistics-output" d="M 1340 842 H 1420 Q 1440 842 1440 822 V 766 Q 1440 754 1460 754 H 1540"/><text class="small" x="1350" y="874">schema event</text>
    <path class="connector event-line" data-connector="crm-output" d="M 700 930 H 490"/><text class="small" x="500" y="950">objective fact</text>
    <path class="connector boundary-line" data-connector="boundary-reminder" d="M 1310 930 H 1510"/><text class="small" x="1380" y="918">not owned</text>
  </g>

  <rect x="70" y="1030" width="1880" height="100" rx="22" fill="#0b1628" stroke="#2b4168" stroke-width="2"/><text class="small" x="98" y="1064">읽는 규칙</text><text class="body" x="98" y="1092">기준정보 원천 서비스가 원천 사실을 결정하고, 예약서비스는 필요한 snapshot과 objective event만 계약으로 연결합니다.</text><text class="body" x="98" y="1118">CRM·알림·통계는 예약 사실을 읽어 각자의 책임을 수행하지만, 예약 원본을 소유하지 않습니다.</text>
</svg>
