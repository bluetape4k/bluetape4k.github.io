<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="740" viewBox="0 0 1160 740" role="img" aria-label="Ktor 3 AWS 통합 동작 순서">
  <defs>
    <style>
      .title{font-family:'goorm Sans',cursive;font-size:34px;fill:#102033}
      .subtitle,.body,.small{font-family:'goorm Sans Code',monospace;fill:#334155}
      .subtitle{font-size:15px}.participant{font-family:'goorm Sans',cursive;font-size:19px;fill:#102033}
      .body{font-size:13px}.small{font-size:12px}.label,.detail,.num{font-family:'goorm Sans Code',monospace;font-size:12px;fill:#334155}
      .num{font-weight:700}.frame{fill:#fff;stroke:#d7e2ef;stroke-width:1.4;rx:18}.header{stroke-width:1.5;rx:10}
      .lifeline{stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:7 7}.call{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
      .return{fill:none;stroke:#64748b;stroke-width:1.6;stroke-dasharray:7 6;marker-end:url(#arrowMuted)}
      .labelPill{fill:#ffffff;stroke:#d7e2ef;stroke-width:1.1;rx:8}.activation{fill:#dbeafe;stroke:#60a5fa;stroke-width:1.1;rx:5}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/></marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="1160" height="740" fill="#ffffff"/>
  <text class="title" x="54" y="70">Ktor 3 동작 순서</text>
  <text class="subtitle" x="56" y="104">플러그인이 명시적 실행 환경을 설치하고, 라우트 코드는 도우미를 호출하며 생명주기 이벤트가 소유한 클라이언트를 시작하고 종료합니다.</text>
  <rect class="frame" x="54" y="136" width="1052" height="548"/>

  <rect class="header" x="86" y="170" width="150" height="64" fill="#dcfce7" stroke="#22c55e"/>
  <text class="participant" x="161" y="198" text-anchor="middle">애플리케이션</text>
  <text class="small" x="161" y="218" text-anchor="middle">플러그인 설치</text>
  <rect class="header" x="292" y="170" width="150" height="64" fill="#e0f2fe" stroke="#38bdf8"/>
  <text class="participant" x="367" y="198" text-anchor="middle">플러그인 실행 환경</text>
  <text class="small" x="367" y="218" text-anchor="middle">생명주기</text>
  <rect class="header" x="498" y="170" width="150" height="64" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="participant" x="573" y="198" text-anchor="middle">라우트 처리기</text>
  <text class="small" x="573" y="218" text-anchor="middle">도우미 호출</text>
  <rect class="header" x="704" y="170" width="150" height="64" fill="#fff7ed" stroke="#fb923c"/>
  <text class="participant" x="779" y="198" text-anchor="middle">AWS 도우미</text>
  <text class="small" x="779" y="218" text-anchor="middle">SigV4/SQS/DDB</text>
  <rect class="header" x="910" y="170" width="150" height="64" fill="#f3e8ff" stroke="#a855f7"/>
  <text class="participant" x="985" y="198" text-anchor="middle">AWS 실행 환경</text>
  <text class="small" x="985" y="218" text-anchor="middle">클라이언트/서비스</text>

  <path class="lifeline" d="M161 234 V638"/><path class="lifeline" d="M367 234 V638"/><path class="lifeline" d="M573 234 V638"/><path class="lifeline" d="M779 234 V638"/><path class="lifeline" d="M985 234 V638"/>
  <rect class="activation" x="359" y="266" width="16" height="322"/>
  <rect class="activation" x="565" y="410" width="16" height="84"/>
  <rect class="activation" x="771" y="410" width="16" height="110"/>
  <rect class="activation" x="977" y="338" width="16" height="182"/>


  <rect class="labelPill" x="126" y="244" width="276" height="24"/>
  <text class="num" x="144" y="260" text-anchor="middle">1</text>
  <text class="detail" x="274" y="260" text-anchor="middle">AwsKtorCore와 서비스 플러그인 설치</text>
  <path class="call" d="M173 278 H355"/>

  <rect class="labelPill" x="466" y="316" width="420" height="24"/>
  <text class="num" x="484" y="332" text-anchor="middle">2</text>
  <text class="detail" x="686" y="332" text-anchor="middle">ApplicationStarted가 플러그인 소유 클라이언트 시작</text>
  <path class="call" d="M379 350 H973"/>

  <rect class="labelPill" x="538" y="388" width="276" height="24"/>
  <text class="num" x="556" y="404" text-anchor="middle">3</text>
  <text class="detail" x="686" y="404" text-anchor="middle">라우트가 S3KtorClient 또는 저장소 호출</text>
  <path class="call" d="M585 422 H767"/>

  <rect class="labelPill" x="744" y="460" width="276" height="24"/>
  <text class="num" x="762" y="476" text-anchor="middle">4</text>
  <text class="detail" x="892" y="476" text-anchor="middle">요청 서명, SQS 폴링 또는 SDK 호출</text>
  <path class="call" d="M791 494 H973"/>

  <rect class="labelPill" x="416" y="532" width="520" height="24"/>
  <text class="num" x="434" y="548" text-anchor="middle">5</text>
  <text class="detail" x="686" y="548" text-anchor="middle">ApplicationStopping이 실행 환경을 비우고 종료</text>
  <path class="return" d="M973 566 H379"/>

  <rect x="86" y="646" width="974" height="36" rx="18" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="small" x="573" y="669" text-anchor="middle">Ktor는 시작, 종료, 라우트 도우미, 애플리케이션 소유 클라이언트를 명시적으로 유지합니다.</text>
</svg>