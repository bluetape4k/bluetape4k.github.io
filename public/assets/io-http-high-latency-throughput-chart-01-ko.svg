    <rect x="345" y="346" width="655" height="24" rx="6" fill="#fde68a" stroke="#f59e0b"/>
    <text class="value" x="1011" y="364">1,870.124</text>

    <text class="label" x="64" y="407">JDK Sync</text>
    <rect x="345" y="388" width="653" height="24" rx="6" fill="#fde68a" stroke="#f59e0b"/>
    <text class="value" x="1009" y="406">1,865.997</text>

    <text class="label" x="64" y="449">JDK Coroutines</text>
    <rect x="345" y="430" width="652" height="24" rx="6" fill="#bbf7d0" stroke="#4ade80"/>
    <text class="value" x="1008" y="448">1,863.948</text>

    <text class="label" x="64" y="491">HC5 Async Coroutines</text>
    <rect x="345" y="472" width="651" height="24" rx="6" fill="#bbf7d0" stroke="#4ade80"/>
    <text class="value" x="1007" y="490">1,860.655</text>

    <text class="label" x="64" y="533">Vert.x WebClient Coroutines</text>
    <rect x="345" y="514" width="651" height="24" rx="6" fill="#bbf7d0" stroke="#4ade80"/>
    <text class="value" x="1007" y="532">1,859.003</text>

    <text class="label" x="64" y="575">OkHttp3 Coroutines</text>
    <rect x="345" y="556" width="650" height="24" rx="6" fill="#bbf7d0" stroke="#4ade80"/>
    <text class="value" x="1006" y="574">1,856.895</text>

    <text class="label" x="64" y="617">Ktor CIO Coroutines</text>
    <rect x="345" y="598" width="530" height="24" rx="6" fill="#fbcfe8" stroke="#f472b6"/>
    <text class="value" x="886" y="616">1,515.026</text>

    <text class="label" x="64" y="659">HC5 Classic Coroutines</text>
    <rect x="345" y="640" width="426" height="24" rx="6" fill="#ddd6fe" stroke="#a78bfa"/>
    <text class="value" x="782" y="658">1,216.306</text>
  </g>

  <line class="grid" x1="345" y1="678" x2="1045" y2="678"/>
  <text class="axis" x="340" y="702">0</text>
  <text class="axis" x="500" y="702">500</text>
  <text class="axis" x="668" y="702">1,000</text>
  <text class="axis" x="842" y="702">1,500</text>
  <text class="axis" x="1012" y="702">2,000</text>
  <text class="note" x="64" y="704">Report snapshot: 2026-05-21</text>
</svg>
