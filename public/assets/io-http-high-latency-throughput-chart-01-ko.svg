    <rect x="345" y="178" width="666" height="24" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
    <text class="value" x="1022" y="196">1,902.171</text>

    <text class="label" x="64" y="239">HC5 Classic VirtualThread</text>
    <rect x="345" y="220" width="661" height="24" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
    <text class="value" x="1017" y="238">1,888.018</text>

