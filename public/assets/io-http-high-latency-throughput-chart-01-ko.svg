<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" role="img" aria-labelledby="title desc">
  <title id="title">HTTP client high-latency 처리량</title>
  <desc id="desc">Horizontal bar chart for GET /httpbin/delay/0.05. WebFlux fixture, 100 JMH threads, ops per second where higher is better. OkHttp3 virtual threads lead at 1902.171 ops/s and Ktor CIO coroutines record 1515.026 ops/s.</desc>
  <defs>
    <style>
      .canvas { fill: #f6f9fc; }
      .frame { fill: #ffffff; stroke: #d7e2ec; stroke-width: 2; }
      .title { font-family: "goorm Sans", "Comic Sans MS", "Comic Sans", cursive; font-size: 38px; font-weight: 400; fill: #102033; }
      .subtitle { font-family: "goorm Sans Code","goorm Sans", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 16px; fill: #536273; }
      .axis { font-family: "goorm Sans Code","goorm Sans", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; fill: #627184; }
      .label { font-family: "goorm Sans Code","goorm Sans", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; fill: #102033; }
      .value { font-family: "goorm Sans Code","goorm Sans", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14px; font-weight: 700; fill: #102033; }
      .chip { font-family: "goorm Sans Code","goorm Sans", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; fill: #334155; }
      .note { font-family: "goorm Sans Code","goorm Sans", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; fill: #536273; }
      .grid { stroke: #dbe5ef; stroke-width: 1; }
      .zero { stroke: #93a4b8; stroke-width: 2; }
    </style>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect class="canvas" width="1180" height="760"/>
  <rect class="frame" x="26" y="24" width="1128" height="710" rx="18" filter="url(#softShadow)"/>

  <text class="title" id="chart-title" x="62" y="82">HTTP client high-latency 처리량</text>
  <text class="subtitle" x="64" y="114">GET /httpbin/delay/0.05 · WebFlux fixture · @Threads(100) · ops/s, 높을수록 좋음</text>

  <rect x="64" y="134" width="156" height="28" rx="14" fill="#dbeafe" stroke="#93c5fd"/>
  <circle cx="82" cy="148" r="6" fill="#93c5fd"/>
  <text class="chip" x="96" y="153">virtual thread</text>
  <rect x="232" y="134" width="122" height="28" rx="14" fill="#fef3c7" stroke="#fbbf24"/>
  <circle cx="250" cy="148" r="6" fill="#fcd34d"/>
  <text class="chip" x="264" y="153">sync</text>
  <rect x="366" y="134" width="164" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
  <circle cx="384" cy="148" r="6" fill="#86efac"/>
  <text class="chip" x="398" y="153">coroutine/async</text>
  <rect x="542" y="134" width="154" height="28" rx="14" fill="#fce7f3" stroke="#f9a8d4"/>
  <circle cx="560" cy="148" r="6" fill="#f9a8d4"/>
  <text class="chip" x="574" y="153">Ktor CIO row</text>

  <text class="note" x="860" y="147">동일 thread 수 local snapshot</text>
  <text class="note" x="860" y="165">원본 표가 기준입니다</text>

  <line class="grid" x1="345" y1="178" x2="345" y2="660"/>
  <line class="grid" x1="520" y1="178" x2="520" y2="660"/>
  <line class="grid" x1="695" y1="178" x2="695" y2="660"/>
  <line class="grid" x1="870" y1="178" x2="870" y2="660"/>
  <line class="grid" x1="1045" y1="178" x2="1045" y2="660"/>
  <line class="zero" x1="345" y1="178" x2="345" y2="660"/>

