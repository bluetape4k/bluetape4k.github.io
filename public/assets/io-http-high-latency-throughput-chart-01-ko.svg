    <rect x="345" y="262" width="659" height="24" rx="6" fill="#bfdbfe" stroke="#60a5fa"/>
    <text class="value" x="1015" y="280">1,883.634</text>

    <text class="label" x="64" y="323">HC5 Classic</text>
    <rect x="345" y="304" width="658" height="24" rx="6" fill="#fde68a" stroke="#f59e0b"/>
    <text class="value" x="1014" y="322">1,880.023</text>

