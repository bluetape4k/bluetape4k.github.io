<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">Virtual Threads SPI 경계</title>
<desc id="desc">애플리케이션은 공통 API만 보고, ServiceLoader가 실행 JDK에 맞는 provider를 선택합니다.</desc>
<defs>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/></filter>

  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#60a5fa"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#86efac"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#fbbf24"/></marker>
  <marker id="arrow-red" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#f87171"/></marker>
  <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#c4b5fd"/></marker>
  <marker id="arrow-cyan" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#67e8f9"/></marker>
  <style>
    .title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:44px;font-weight:700;fill:#f8fafc}
    .subtitle{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:18px;fill:#cbd5e1}
    .lane-title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-title{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:24px;font-weight:700;fill:#f8fafc}
    .card-body{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:16px;fill:#cbd5e1}
    .small{font-family:"goorm Sans","Apple SD Gothic Neo",Arial,sans-serif;font-size:14px;fill:#94a3b8}
    .code{font-family:"goorm Sans Code","goorm Sans","Apple SD Gothic Neo",monospace;font-size:15px;fill:#cbd5e1}
    .panel{fill:#111827;stroke:#334155;stroke-width:2}
    .card{filter:url(#shadow);stroke-width:2}

    .connector{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    .line-blue{stroke:#60a5fa;marker-end:url(#arrow-blue)}
    .line-green{stroke:#86efac;marker-end:url(#arrow-green)}
    .line-amber{stroke:#fbbf24;marker-end:url(#arrow-amber)}
    .line-red{stroke:#f87171;marker-end:url(#arrow-red)}
    .line-purple{stroke:#c4b5fd;marker-end:url(#arrow-purple)}
    .line-cyan{stroke:#67e8f9;marker-end:url(#arrow-cyan)}
    .dash-blue{stroke:#60a5fa;stroke-dasharray:10 9;marker-end:url(#arrow-blue)}
    .dash-green{stroke:#86efac;stroke-dasharray:10 9;marker-end:url(#arrow-green)}
    .label-bg{fill:#0f172a;stroke:#475569;stroke-width:1.5}
  </style>
</defs>
<rect width="1440" height="820" fill="#0b1220"/>
<rect x="34" y="30" width="1372" height="760" rx="28" class="panel"/>
<text x="70" y="86" class="title">Virtual Threads SPI 경계</text>
<text x="72" y="122" class="subtitle">애플리케이션은 공통 API만 보고, ServiceLoader가 실행 JDK에 맞는 provider를 선택합니다.</text>
<g>
  <rect x="72" y="170" width="326" height="520" rx="24" fill="#172033" stroke="#26364f" stroke-width="2"/>
  <text x="96" y="208" class="lane-title">호출자</text>
</g>
<g>
  <rect x="446" y="170" width="452" height="520" rx="24" fill="#172033" stroke="#26364f" stroke-width="2"/>
  <text x="470" y="208" class="lane-title">공통 API</text>
</g>
<g>
  <rect x="946" y="170" width="422" height="600" rx="24" fill="#172033" stroke="#26364f" stroke-width="2"/>
  <text x="970" y="208" class="lane-title">런타임 provider</text>
</g>
<g>
  <rect x="116" y="300" width="238" height="112" rx="18" fill="#172554" stroke="#60a5fa" class="card"/>
  <text x="235" y="339" text-anchor="middle" dominant-baseline="middle" class="card-title">애플리케이션 코드</text>
<text x="235" y="373" text-anchor="middle" dominant-baseline="middle" class="card-body">JDK 분기를 알지 않음</text>
</g>
<g>
  <rect x="500" y="230" width="344" height="118" rx="18" fill="#261943" stroke="#c4b5fd" class="card"/>
  <text x="672" y="272" text-anchor="middle" dominant-baseline="middle" class="small">VirtualThreads</text>
<text x="672" y="306" text-anchor="middle" dominant-baseline="middle" class="card-body">facade · runtimeName()</text>
</g>
<g>
  <rect x="500" y="445" width="344" height="126" rx="18" fill="#12333b" stroke="#67e8f9" class="card"/>
  <text x="672" y="491" text-anchor="middle" dominant-baseline="middle" class="small">VirtualThreadRuntime</text>
<text x="672" y="525" text-anchor="middle" dominant-baseline="middle" class="small">threadFactory · executorService</text>
</g>
<g>
  <rect x="932" y="370" width="156" height="300" rx="18" fill="#261943" stroke="#c4b5fd" class="card"/>
  <text x="1010" y="503" text-anchor="middle" dominant-baseline="middle" class="small">ServiceLoader</text>
<text x="1010" y="537" text-anchor="middle" dominant-baseline="middle" class="small">priority 순서</text>
</g>
<g>
  <rect x="1160" y="330" width="178" height="78" rx="18" fill="#14351f" stroke="#86efac" class="card"/>
  <text x="1249" y="338" text-anchor="middle" dominant-baseline="middle" class="small">Jdk25</text>
<text x="1249" y="366" text-anchor="middle" dominant-baseline="middle" class="small">provider</text>
<text x="1249" y="400" text-anchor="middle" dominant-baseline="middle" class="small">priority = 25</text>
</g>
<g>
  <rect x="1160" y="475" width="178" height="78" rx="18" fill="#3b2a08" stroke="#fbbf24" class="card"/>
  <text x="1249" y="483" text-anchor="middle" dominant-baseline="middle" class="small">Jdk21</text>
<text x="1249" y="511" text-anchor="middle" dominant-baseline="middle" class="small">provider</text>
<text x="1249" y="545" text-anchor="middle" dominant-baseline="middle" class="small">priority = 21</text>
</g>
<g>
  <rect x="1160" y="620" width="178" height="78" rx="18" fill="#1e293b" stroke="#64748b" class="card"/>
  <text x="1249" y="642" text-anchor="middle" dominant-baseline="middle" class="card-title">Fallback</text>
<text x="1249" y="676" text-anchor="middle" dominant-baseline="middle" class="card-body">provider 없음</text>
</g>
<path class="connector line-blue" d="M354 356 H500"/><rect class="label-bg" x="365" y="320" width="126" height="30" rx="15"/><text class="small" x="428" y="339" text-anchor="middle">공통 API 호출</text>
<path class="connector line-cyan" d="M672 348 V445"/><rect class="label-bg" x="680" y="381" width="124" height="30" rx="15"/><text class="small" x="742" y="400" text-anchor="middle">ServiceLoader</text>
<path class="connector line-cyan" d="M844 508 H932"/><rect class="label-bg" x="850" y="471" width="76" height="30" rx="15"/><text class="small" x="888" y="490" text-anchor="middle">탐색</text>
<path class="connector line-green" d="M1088 369 H1160"/><rect class="label-bg" x="1087" y="331" width="74" height="30" rx="15"/><text class="small" x="1124" y="350" text-anchor="middle">1순위</text>
<path class="connector line-amber" d="M1088 514 H1160"/><rect class="label-bg" x="1083" y="476" width="82" height="30" rx="15"/><text class="small" x="1124" y="495" text-anchor="middle">2순위</text>
<path class="connector dash-blue" d="M1088 659 H1160"/><rect class="label-bg" x="1083" y="621" width="82" height="30" rx="15"/><text class="small" x="1124" y="640" text-anchor="middle">대체</text>
<text x="720" y="738" text-anchor="middle" class="small">소스: virtualthread/api, virtualthread/jdk21, virtualthread/jdk25</text>
</svg>
