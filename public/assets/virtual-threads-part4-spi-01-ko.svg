<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Java 21과 Java 25의 Virtual Threads SPI</title>
  <desc id="desc">공통 API, Java 25와 Java 21 provider, platform fallback을 ServiceLoader로 선택하는 module 구성.</desc>
  <defs>
    <marker id="arrow-vt3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#577789"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#f8fbfd"/>
  <rect x="64" y="62" width="1072" height="506" rx="24" fill="#ffffff" stroke="#c7d6df" stroke-width="2"/>
  <text x="96" y="122" font-family="goorm Sans, sans-serif" font-size="40" font-weight="700" fill="#18303f">Virtual Threads SPI/API</text>
  <text x="98" y="162" font-family="goorm Sans Code, monospace" font-size="22" fill="#526875">API 하나, JDK별 runtime module</text>

  <g font-family="goorm Sans Code, monospace" font-size="18" fill="#18303f">
    <rect x="98" y="258" width="214" height="118" rx="16" fill="#ffffff" stroke="#b6ccd8" stroke-width="2"/>
    <text x="205" y="302" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="24" font-weight="700">Application</text>
    <text x="205" y="336" text-anchor="middle">API dependency만 사용</text>

    <rect x="388" y="238" width="258" height="158" rx="18" fill="#eaf4ff" stroke="#b9cde0" stroke-width="2"/>
    <text x="517" y="286" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="24" font-weight="700">VirtualThreads API</text>
    <text x="517" y="322" text-anchor="middle">ServiceLoader selector</text>
    <text x="517" y="352" text-anchor="middle">지원 runtime을 정렬</text>

    <rect x="750" y="186" width="260" height="90" rx="16" fill="#e9f6ef" stroke="#b5d6c2"/>
    <text x="880" y="222" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="23" font-weight="700">JDK 25 provider</text>
    <text x="880" y="252" text-anchor="middle">우선순위 25</text>

    <rect x="750" y="310" width="260" height="90" rx="16" fill="#fff0df" stroke="#dfc6a6"/>
    <text x="880" y="346" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="23" font-weight="700">JDK 21 provider</text>
    <text x="880" y="376" text-anchor="middle">우선순위 21</text>

    <rect x="750" y="434" width="260" height="90" rx="16" fill="#f4f0ff" stroke="#c9bee6"/>
    <text x="880" y="470" text-anchor="middle" font-family="goorm Sans, sans-serif" font-size="23" font-weight="700">Platform fallback</text>
    <text x="880" y="500" text-anchor="middle">cached platform thread</text>
  </g>

  <g fill="none" stroke="#577789" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-vt3)">
    <path class="connector" d="M312 317 H388"/>
    <path class="connector" d="M646 285 H670 Q684 285 684 271 V245 Q684 231 698 231 H750"/>
    <path class="connector" d="M646 317 H690 Q704 317 704 331 V341 Q704 355 718 355 H750"/>
    <path class="connector" d="M646 349 H702 Q716 349 716 363 V465 Q716 479 730 479 H750"/>
  </g>

  <g font-family="goorm Sans Code, monospace" font-size="16" fill="#2b414d">
    <rect x="116" y="448" width="486" height="56" rx="14" fill="#f8fbfa" stroke="#d4dee5"/>
    <text x="359" y="482" text-anchor="middle">Application code는 공통 API만 가져옵니다.</text>
  </g>
</svg>
