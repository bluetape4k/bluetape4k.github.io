<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">StrategicLeaderElector 결정 흐름</title><desc id="desc">모든 후보를 먼저 같은 목록으로 보고, strategy가 실행할 노드를 고릅니다.</desc><defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#28343b" flood-opacity="0.13"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b98240" stroke="#b98240" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b86868" stroke="#b86868" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#78909c" stroke="#78909c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none!important"/></marker>
    <style>
      .canvas{fill:#fbfcf8}.frame{fill:#fff;stroke:#41545d;stroke-width:2.2}
      .title{font-family:"goorm Sans";font-size:38px;fill:#263238}
      .subtitle,.detail,.labelText,.footer,.axis,.tick,.legend,.role{font-family:"goorm Sans";fill:#4e6069}
      .subtitle{font-size:16px}.detail{font-size:14px}.footer{font-size:13px}.axis,.tick,.legend{font-size:13px}
      .role{font-family:"goorm Sans Code";font-size:12.5px}
      .bandTitle,.cardTitle,.participant{font-family:"goorm Sans";fill:#1f3138}
      .bandTitle{font-size:23px}.cardTitle{font-size:22px}.participant{font-size:19px}
      .mono,.code,.badgeText{font-family:"goorm Sans Code";fill:#33454e}
      .band{fill:#f5f9fb;stroke:#c8d7df;stroke-width:1.6}.bandAlt{fill:#fbfdf8;stroke:#d7e0d0;stroke-width:1.6}
      .card{filter:url(#shadow);stroke-width:2}.header{fill:#fff;stroke:#546e7a;stroke-width:2}
      .edge,.call,.return,.skip,.state{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
      .call{stroke:#3f7d9c;marker-end:url(#arrow-blue)}.state{stroke:#6e8f4f;marker-end:url(#arrow-green)}
      .return{stroke:#9b7d54;marker-end:url(#arrow-amber);stroke-dasharray:8 7}.skip{stroke:#b86868;marker-end:url(#arrow-red)}
      .pill,.label{fill:#fff;stroke-width:1.5}.labelText{font-size:12.5px}.badgeText{font-size:12px;font-weight:700}
      .lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#e6f2ec;stroke:#5b7e67;stroke-width:1.7}
      .branch{fill:none;stroke:#78909c;stroke-width:2.2;stroke-dasharray:12 8}.divider{stroke:#78909c;stroke-width:1.4;stroke-dasharray:8 7}
    </style>
  </defs>
  <rect class="canvas" width="1280" height="620"/><rect class="frame" x="28" y="26" width="1224" height="568" rx="14"/>
  <text x="640" y="82" class="title" text-anchor="middle">StrategicLeaderElector 결정 흐름</text><text x="640" y="114" class="subtitle" text-anchor="middle">모든 후보를 먼저 같은 목록으로 보고, strategy가 실행할 노드를 고릅니다.</text>
  <g><rect x="80" y="260" width="190" height="92" rx="8" class="card" fill="#eef7fb" stroke="#3f7d9c"/>
    <text x="175" y="294" class="cardTitle" text-anchor="middle">CandidateInfo</text>
    <text x="175" y="320" class="detail" text-anchor="middle">nodeId + metadata</text></g><g><rect x="330" y="260" width="190" height="92" rx="8" class="card" fill="#fff" stroke="#6e8f4f"/>
    <text x="425" y="294" class="cardTitle" text-anchor="middle">Registry</text>
    <text x="425" y="320" class="detail" text-anchor="middle">candidate registry</text></g><g><rect x="580" y="260" width="190" height="92" rx="8" class="card" fill="#fff" stroke="#6e8f4f"/>
    <text x="675" y="294" class="cardTitle" text-anchor="middle">ElectionStrategy</text>
    <text x="675" y="320" class="detail" text-anchor="middle">FIFO / Random / Scored</text></g><g><rect x="830" y="260" width="190" height="92" rx="8" class="card" fill="#fff" stroke="#6e8f4f"/>
    <text x="925" y="294" class="cardTitle" text-anchor="middle">선택된 노드</text>
    <text x="925" y="320" class="detail" text-anchor="middle">run action</text></g><g><rect x="1080" y="260" width="190" height="92" rx="8" class="card" fill="#fff5f5" stroke="#b86868"/>
    <text x="1175" y="294" class="cardTitle" text-anchor="middle">결과 기록</text>
    <text x="1175" y="320" class="detail" text-anchor="middle">success / failure</text></g>
  <path d="M 270 306 L 330 306" class="call"/>
  <path d="M 520 306 L 580 306" class="state"/>
  <path d="M 770 306 L 830 306" class="state"/>
  <path d="M 1020 306 L 1080 306" class="return"/>
  <path d="M 925 352 L 925 430 Q 925 452 947 452 L 1175 452 Q 1198 452 1198 430 L 1198 352" class="skip"/>
  <g><rect x="286" y="218" width="132" height="30" rx="15" class="pill" stroke="#78909c"/><circle cx="304" cy="233" r="11" fill="#fff" stroke="#78909c" stroke-width="1.4"/><text x="304" y="237" text-anchor="middle" class="badgeText">1</text><text x="322" y="238" class="labelText">candidate</text></g><g><rect x="536" y="218" width="132" height="30" rx="15" class="pill" stroke="#78909c"/><circle cx="554" cy="233" r="11" fill="#fff" stroke="#78909c" stroke-width="1.4"/><text x="554" y="237" text-anchor="middle" class="badgeText">2</text><text x="572" y="238" class="labelText">lease</text></g><g><rect x="786" y="218" width="132" height="30" rx="15" class="pill" stroke="#78909c"/><circle cx="804" cy="233" r="11" fill="#fff" stroke="#78909c" stroke-width="1.4"/><text x="804" y="237" text-anchor="middle" class="badgeText">3</text><text x="822" y="238" class="labelText">execute</text></g><g><rect x="1036" y="218" width="132" height="30" rx="15" class="pill" stroke="#78909c"/><circle cx="1054" cy="233" r="11" fill="#fff" stroke="#78909c" stroke-width="1.4"/><text x="1054" y="237" text-anchor="middle" class="badgeText">4</text><text x="1072" y="238" class="labelText">outcome</text></g>
  <text x="640" y="520" class="footer" text-anchor="middle">LeaderRunResult: Elected | Skipped | ActionFailed</text>
  </svg>