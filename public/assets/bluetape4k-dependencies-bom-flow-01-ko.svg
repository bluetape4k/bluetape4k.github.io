<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">중앙 BOM이 공개하는 호환 버전 조합</title><desc id="desc">저장소별 BOM은 모듈 목록을, 중앙 BOM은 함께 사용할 버전 조합을 책임집니다.</desc>
  <defs><marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#36C5F0"/></marker></defs>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0D1B2D;stroke:#36536F;stroke-width:2}.card{fill:#10243A;stroke:#36536F;stroke-width:2}
    .focus{fill:#0C3044;stroke:#5EEAD4;stroke-width:2.5}.warn{fill:#332B18;stroke:#FBBF24;stroke-width:2}
    .title{font:700 40px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}.subtitle{font:500 20px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
    .card-title{font:700 24px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}.body{font:600 18px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
    .chip{font:700 16px "goorm Sans Code","goorm Sans",monospace;fill:#5EEAD4}.label{font:700 16px "goorm Sans Code","goorm Sans",monospace;fill:#36C5F0}
    .connector{fill:none;stroke:#36C5F0;stroke-width:4;marker-end:url(#arrow)}.divider{stroke:#36536F;stroke-width:2}
    .footer{font:600 18px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
  </style>
  <rect width="1600" height="980" class="canvas"/><rect x="32" y="32" width="1536" height="916" rx="32" class="frame"/>
  <text x="80" y="98" class="title">중앙 BOM이 공개하는 호환 버전 조합</text><text x="80" y="138" class="subtitle">각 저장소의 BOM과 외부 호환선을 중앙 BOM이 조합하고, 소비자는 버전 없는 모듈 의존성을 선언합니다.</text>

    <rect x="80" y="270" width="400" height="220" rx="24" class="card"/>
  <text x="108" y="322" class="card-title">저장소별 BOM</text>
  <text x="108" y="368" class="body">projects / exposed / aws / image</text>
<text x="108" y="406" class="body">text / graph / leader / javers</text>
    <rect x="600" y="240" width="400" height="280" rx="24" class="focus"/>
  <text x="628" y="292" class="card-title">bluetape4k-dependencies</text>
  <text x="628" y="338" class="body">하위 BOM 조합</text>
<text x="628" y="376" class="body">외부 의존성 호환선</text>
    <rect x="1120" y="270" width="400" height="220" rx="24" class="card"/>
  <text x="1148" y="322" class="card-title">소비자 프로젝트</text>
  <text x="1148" y="368" class="body">애플리케이션 / 워크숍</text>
<text x="1148" y="406" class="body">필요한 모듈만 선언</text>
    <path d="M480 380 H580" class="connector"/><text x="530" y="350" text-anchor="middle" class="label">배포된 BOM 가져오기</text>
    <path d="M1000 380 H1100" class="connector"/><text x="1050" y="350" text-anchor="middle" class="label">중앙 BOM 적용</text>
    <rect x="600" y="600" width="400" height="94" rx="20" class="card"/>
    <text x="800" y="640" text-anchor="middle" class="chip">api(platform(...))</text>
    <text x="800" y="674" text-anchor="middle" class="body">Maven POM dependencyManagement</text><line x1="80" y1="830" x2="1520" y2="830" class="divider"/>
  <text x="800" y="884" text-anchor="middle" class="footer">저장소별 BOM은 모듈 목록을, 중앙 BOM은 함께 사용할 버전 조합을 책임집니다.</text>
</svg>