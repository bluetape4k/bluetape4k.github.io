 Z" fill="#a78bfa" data-solid-head="true"/></marker><style>.title{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:32px;font-weight:800;fill:#f4f8ff}.subtitle{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:16px;fill:#a9bad0}.badge{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:12px;font-weight:800;fill:#c9dcf3}.participant{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:14px;font-weight:800;fill:#f4f8ff}.role{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:11px;fill:#91a8c3}.label{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:12px;fill:#e7f0fb}.outcome{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:13px;font-weight:800;fill:#f8fbff}.outcomeCode{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:20px;font-weight:800;fill:#f8fbff}.outcomeDetail{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:17px;fill:#b7c7da}.phase{fill:#0b1729;fill-opacity:.3;stroke:#38506d;stroke-width:1.5}.phaseLabel{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:11px;font-weight:800;fill:#83a0bf}.lifeline{fill:none;stroke:#516985;stroke-width:2;stroke-dasharray:8 10}.header{fill:#13243b;stroke:#395675;stroke-width:2}.activation{fill:#17314e;stroke:#7898b7;stroke-width:2}.pill{fill:#0d1b2f;stroke-width:2}.call{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.blue-line{stroke:#60a5fa;marker-end:url(#blueArrow)}.cyan-line{stroke:#2dd4bf;marker-end:url(#cyanArrow)}.amber-line{stroke:#fbbf24;marker-end:url(#amberArrow)}.red-line{stroke:#fb7185;marker-end:url(#redArrow)}.purple-line{stroke:#a78bfa;marker-end:url(#purpleArrow)}.decision{fill:#151f38;stroke:#a78bfa;stroke-width:2}.decisionTitle{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:18px;font-weight:800;fill:#e5d9ff}.legend{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:11px;fill:#9fb3c8}</style></defs><rect width="1600" height="2110" fill="url(#flowCanvas)"/><rect class="frame" x="24" y="24" width="1552" height="2062" rx="32" fill="none" stroke="#2d4665" stroke-width="2"/><text class="title" x="62" y="76" >Attendance and Treatment Completion Are Different Facts</text><text class="subtitle" x="64" y="108" >Appointment states record the booking flow; external fulfillment facts record actual treatment results.</text><rect x="58" y="124" width="250" height="34" rx="17" fill="#12243a" stroke="#3a5877"/><text class="badge" x="183" y="147" text-anchor="middle">SCOPE / attendance + fulfillment</text><rect x="320" y="124" width="280" height="34" rx="17" fill="#12243a" stroke="#3a5877"/><text class="badge" x="460" y="147" text-anchor="middle">VERSION / immutable revision</text><rect x="612" y="124" width="270" height="34" rx="17" fill="#12243a" stroke="#3a5877"/><text class="badge" x="747" y="147" text-anchor="middle">ROLE / STAFF + services</text><rect x="894" y="124" width="205" height="34" rx="17" fill="#12243a" stroke="#3a5877"/><text class="badge" x="996.5" y="147" text-anchor="middle">DATA / synthetic mockup</text><rect class="phase" x="38" y="314" width="1524" height="350" rx="24"/><rect x="1150" y="328" width="330" height="28" rx="14" fill="#102239" stroke="#38506d"/><text class="phaseLabel" x="1315" y="347" text-anchor="middle">Appointment flow</text><rect class="phase" x="38" y="674" width="1524" height="390" rx="24"/><rect x="1150" y="688" width="330" height="28" rx="14" fill="#102239" stroke="#38506d"/><text class="phaseLabel" x="1315" y="707" text-anchor="middle">External fulfillment fact</text><rect class="phase" x="38" y="1074" width="1524" height="286" rx="24"/><rect x="1150" y="1088" width="330" height="28" rx="14" fill="#102239" stroke="#38506d"/><text class="phaseLabel" x="1315" y="1107" text-anchor="middle">Operational follow-up</text><g><rect class="header" x="22" y="188" width="216" height="94" rx="18"/><text class="participant" x="130" y="226" text-anchor="middle">STAFF</text><text class="role" x="130" y="255" text-anchor="middle">actions + operations queue</text></g><g><rect class="header" x="290" y="188" width="216" height="94" rx="18"/><text class="participant" x="398" y="226" text-anchor="middle">Appointment API</text><text class="role" x="398" y="255" text-anchor="middle">state + history</text></g><g><rect class="header" x="558" y="188" width="216" height="94" rx="18"/><text class="participant" x="666" y="226" text-anchor="middle">Clinical/Treatment</text><text class="role" x="666" y="255" text-anchor="middle">result owner</text></g><g><rect class="header" x="826" y="188" width="216" height="94" rx="18"/><text class="participant" x="934" y="226" text-anchor="middle">External fact ingress</text><text class="role" x="934" y="255" text-anchor="middle">trust + schema</text></g><g><rect class="header" x="1094" y="188" width="216" height="94" rx="18"/><text class="participant" x="1202" y="226" text-anchor="middle">Fulfillment handler</text><text class="role" x="1202" y="255" text-anchor="middle">Plan revision</text></g><g><rect class="header" x="1362" y="188" width="216" height="94" rx="18"/><text class="participant" x="1470" y="226" text-anchor="middle">Follow-up queue</text><text class="role" x="1470" y="255" text-anchor="middle">next action</text></g><path class="lifeline" d="M130 282 V1386"/><path class="lifeline" d="M398 282 V1386"/><path class="lifeline" d="M666 282 V1386"/><path class="lifeline" d="M934 282 V1386"/><path class="lifeline" d="M1202 282 V1386"/><path class="lifeline" d="M1470 282 V1386"/><rect class="activation" x="388" y="360" width="20" height="620" rx="8"/><rect class="activation" x="1192" y="900" width="20" height="190" rx="8"/><g><rect class="pill" x="113.5" y="382" width="301" height="38" rx="19" stroke="#60a5fa"/><circle cx="133.5" cy="401" r="13" fill="#60a5fa" fill-opacity=".2" stroke="#60a5fa"/><text class="outcome num" x="133.5" y="406" text-anchor="middle">1</text><text class="label" x="157.5" y="406" >CheckIn / attendance confirmed</text></g><path class="call blue-line" data-source-node="staff" data-target-node="appointmentApi" d="M130 432 H398"/><g><rect class="pill" x="102.25" y="512" width="323.5" height="38" rx="19" stroke="#2dd4bf"/><circle cx="122.25" cy="531" r="13" fill="#2dd4bf" fill-opacity=".2" stroke="#2dd4bf"/><text class="outcome num" x="122.25" y="536" text-anchor="middle">2</text><text class="label" x="146.25" y="536" >StartTreatment / treatment starts</text></g><path class="call cyan-line" data-source-node="staff" data-target-node="appointmentApi" d="M130 562 H398"/><g><rect class="pill" x="106" y="642" width="316" height="38" rx="19" stroke="#a78bfa"/><circle cx="126" cy="661" r="13" fill="#a78bfa" fill-opacity=".2" stroke="#a78bfa"/><text class="outcome num" x="126" y="666" text-anchor="middle">3</text><text class="label" x="150" y="666" >Complete / appointment flow ends</text></g><path class="call purple-line" data-source-node="staff" data-target-node="appointmentApi" d="M130 692 H398"/><g><rect class="pill" x="608.25" y="772" width="383.5" height="38" rx="19" stroke="#fbbf24"/><circle cx="628.25" cy="791" r="13" fill="#fbbf24" fill-opacity=".2" stroke="#fbbf24"/><text class="outcome num" x="628.25" y="796" text-anchor="middle">4</text><text class="label" x="652.25" y="796" >TreatmentFulfillmentEvent / actual result</text></g><path class="call amber-line" data-source-node="clinicalService" data-target-node="ingress" d="M666 822 H934"/><g><rect class="pill" x="846.25" y="902" width="443.5" height="38" rx="19" stroke="#a78bfa"/><circle cx="866.25" cy="921" r="13" fill="#a78bfa" fill-opacity=".2" stroke="#a78bfa"/><text class="outcome num" x="866.25" y="926" text-anchor="middle">5</text><text class="label" x="890.25" y="926" >verify payload, schema, signature, source version</text></g><path class="call purple-line" data-source-node="ingress" data-target-node="handler" d="M934 952 H1202"/><g><rect class="pill" x="1140.5" y="1032" width="391" height="38" rx="19" stroke="#2dd4bf"/><circle cx="1160.5" cy="1051" r="13" fill="#2dd4bf" fill-opacity=".2" stroke="#2dd4bf"/><text class="outcome num" x="1160.5" y="1056" text-anchor="middle">6</text><text class="label" x="1184.5" y="1056" >project new Plan revision + follow-up work</text></g><path class="call cyan-line" data-source-node="handler" data-target-node="operationsQueue" d="M1202 1082 H1470"/><g><rect class="pill" x="1160" y="1162" width="300" height="38" rx="19" stroke="#60a5fa"/><circle cx="1180" cy="1181" r="13" fill="#60a5fa" fill-opacity=".2" stroke="#60a5fa"/><text class="outcome num" x="1180" y="1186" text-anchor="middle">7</text><text class="label" x="1204" y="1186" >recheck state, policy, and revision</text></g><path class="call blue-line" data-source-node="operationsQueue" data-target-node="operationsQueue" d="M1460 1212 Q1412 1212 1392 1236 Q1392 1260 1460 1260"/><rect class="decision" x="44" y="1436" width="1512" height="540" rx="26"/><rect x="520" y="1404" width="560" height="76" rx="23" fill="#19223a" stroke="#a78bfa" stroke-width="2"/><text class="decisionTitle" x="800" y="1437" text-anchor="middle">Final State Decision</text><text class="legend" x="800" y="1463" text-anchor="middle">Record exactly one of the four external fulfillment outcomes.</text><rect id="outcome-0" x="76" y="1680" width="342" height="210" rx="20" fill="#101f34" stroke="#2dd4bf" stroke-width="2"/><text class="outcomeCode" x="247" y="1728" text-anchor="middle">COMPLETED</text><text class="outcomeDetail" x="247" y="1767" text-anchor="middle">all treatment items complete</text><text class="outcomeDetail" x="247" y="1804" text-anchor="middle">re-read Plan</text><path class="call cyan-line" data-source-node="finalDecision" data-target-node="outcome-0" d="M650 1480 V1524 Q650 1548 626 1548 H271 Q247 1548 247 1572 V1680"/><rect id="outcome-1" x="446" y="1680" width="342" height="210" rx="20" fill="#101f34" stroke="#fbbf24" stroke-width="2"/><text class="outcomeCode" x="617" y="1728" text-anchor="middle">PARTIALLY_FULFILLED</text><text class="outcomeDetail" x="617" y="1767" text-anchor="middle">preserve completed + remaining work</text><text class="outcomeDetail" x="617" y="1804" text-anchor="middle">review new treatment booking</text><path class="call amber-line" data-source-node="finalDecision" data-target-node="outcome-1" d="M720 1480 V1564 Q720 1588 696 1588 H641 Q617 1588 617 1612 V1680"/><rect id="outcome-2" x="816" y="1680" width="342" height="210" rx="20" fill="#101f34" stroke="#fb7185" stroke-width="2"/><text class="outcomeCode" x="987" y="1728" text-anchor="middle">RESOURCE_DISRUPTED</text><text class="outcomeDetail" x="987" y="1767" text-anchor="middle">resource issue + remaining definition</text><text class="outcomeDetail" x="987" y="1804" text-anchor="middle">review operational exception</text><path class="call red-line" data-source-node="finalDecision" data-target-node="outcome-2" d="M880 1480 V1564 Q880 1588 904 1588 H963 Q987 1588 987 1612 V1680"/><rect id="outcome-3" x="1186" y="1680" width="342" height="210" rx="20" fill="#101f34" stroke="#a78bfa" stroke-width="2"/><text class="outcomeCode" x="1357" y="1728" text-anchor="middle">REFUNDED</text><text class="outcomeDetail" x="1357" y="1767" text-anchor="middle">project refund fact</text><text class="outcomeDetail" x="1357" y="1804" text-anchor="middle">review BLOCKING follow-up only</text><path class="call purple-line" data-source-node="finalDecision" data-target-node="outcome-3" d="M950 1480 V1524 Q950 1548 974 1548 H1333 Q1357 1548 1357 1572 V1680"/><text class="legend" x="800" y="1942" text-anchor="middle">solid / request, verification, projection   ·   dashed / waiting boundary for external fact</text><path d="M70 1360 H1530" stroke="#516985" stroke-width="2" stroke-dasharray="8 10" opacity=".8"/><text class="legend" x="800" y="1392" text-anchor="middle">dashed / waiting boundary for external fact</text></svg>
