<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Spring AOP leader election sequence</title>
  <desc id="desc">Sequence diagram showing a Spring method call through LeaderElectionAspect, SpEL validation, factory cache, backend elector, method body, metrics, and failure mode handling.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .lane { fill: #ffffff; stroke: #d8e1ea; stroke-width: 2; }
      .lane-title { font: 700 24px "Architects Daughter", "Comic Sans MS", cursive; fill: #1f2a37; }
      .small { font: 600 17px "Comic Mono", "SFMono-Regular", monospace; fill: #334155; }
      .note-title { font: 700 20px "Architects Daughter", "Comic Sans MS", cursive; fill: #1f2a37; }
      .note-text { font: 600 16px "Comic Mono", "SFMono-Regular", monospace; fill: #475569; }
      .axis { stroke: #cbd5e1; stroke-width: 3; stroke-dasharray: 7 10; }
      .call { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowBlue); }
      .return { stroke: #64748b; stroke-width: 3; fill: none; stroke-dasharray: 9 8; marker-end: url(#arrowGray); }
      .ok { stroke: #059669; stroke-width: 4; fill: none; marker-end: url(#arrowGreen); }
      .warn { stroke: #d97706; stroke-width: 4; fill: none; marker-end: url(#arrowAmber); }
      .activation { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; rx: 10; }
      .activation-ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .activation-warn { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .panel-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 18; }
      .panel-green { fill: #ecfdf5; stroke: #86efac; stroke-width: 2; rx: 18; }
      .panel-amber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 2; rx: 18; }
      .badge { fill: #2563eb; }
      .badge-text { font: 700 14px "Comic Mono", "SFMono-Regular", monospace; fill: #ffffff; }
    </style>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <rect class="panel-blue" x="50" y="36" width="1500" height="90"/>
  <text class="lane-title" x="80" y="82">Spring @LeaderElection AOP runtime path</text>
  <text class="small" x="80" y="109">The annotation is small; the advice path still resolves names, validates options, selects a backend, executes the body, and records outcomes.</text>

  <g>
    <rect class="lane" x="70" y="170" width="190" height="60" rx="18"/>
    <text class="lane-title" x="104" y="207">Caller</text>
    <line class="axis" x1="165" y1="230" x2="165" y2="790"/>

    <rect class="lane" x="300" y="170" width="220" height="60" rx="18"/>
    <text class="lane-title" x="325" y="207">Spring Proxy</text>
    <line class="axis" x1="410" y1="230" x2="410" y2="790"/>

    <rect class="lane" x="570" y="170" width="250" height="60" rx="18"/>
    <text class="lane-title" x="590" y="207">LeaderElectionAspect</text>
    <line class="axis" x1="695" y1="230" x2="695" y2="790"/>

    <rect class="lane" x="870" y="170" width="220" height="60" rx="18"/>
    <text class="lane-title" x="888" y="207">Factory Cache</text>
    <line class="axis" x1="980" y1="230" x2="980" y2="790"/>

    <rect class="lane" x="1140" y="170" width="230" height="60" rx="18"/>
    <text class="lane-title" x="1160" y="207">Backend Elector</text>
    <line class="axis" x1="1255" y1="230" x2="1255" y2="790"/>

    <rect class="lane" x="1410" y="170" width="150" height="60" rx="18"/>
    <text class="lane-title" x="1442" y="207">Body</text>
    <line class="axis" x1="1485" y1="230" x2="1485" y2="790"/>
  </g>

  <rect class="activation" x="392" y="264" width="36" height="92"/>
  <path class="call" d="M165 285 H392"/>
  <text class="small" x="190" y="273">1. annotated method call</text>

  <rect class="activation" x="677" y="300" width="36" height="360"/>
  <path class="call" d="M428 320 H677"/>
  <text class="small" x="460" y="306">2. around advice</text>

  <rect class="panel" x="415" y="360" width="280" height="126"/>
  <text class="note-title" x="438" y="392">Resolve metadata</text>
  <text class="note-text" x="438" y="424">SpEL lock name</text>
  <text class="note-text" x="438" y="452">duration parsing</text>
  <text class="note-text" x="438" y="480">lock-name validation</text>

  <rect class="activation" x="962" y="392" width="36" height="96"/>
  <path class="call" d="M713 420 H962"/>
  <text class="small" x="744" y="407">3. select factory + options key</text>
  <path class="return" d="M962 470 H713"/>
  <text class="small" x="745" y="458">cached elector</text>

  <rect class="activation-ok" x="1237" y="515" width="36" height="112"/>
  <path class="ok" d="M713 545 H1237"/>
  <text class="small" x="792" y="532">4. runIfLeaderResult(lockName)</text>

  <rect class="activation-ok" x="1467" y="560" width="36" height="112"/>
  <path class="ok" d="M1273 585 H1467"/>
  <text class="small" x="1296" y="572">5a. elected: run body</text>
  <path class="return" d="M1467 650 H1273"/>
  <text class="small" x="1308" y="637">value / thrown body error</text>
  <path class="return" d="M1237 690 H713"/>
  <text class="small" x="820" y="678">Elected / Skipped / ActionFailed</text>

  <rect class="panel-green" x="540" y="705" width="430" height="110"/>
  <text class="note-title" x="566" y="737">Metrics callbacks</text>
  <text class="note-text" x="566" y="767">attempt, acquired, skipped</text>
  <text class="note-text" x="566" y="790">duration, failed, active</text>

  <rect class="panel-amber" x="1010" y="705" width="500" height="110"/>
  <text class="note-title" x="1036" y="737">Failure mode branch</text>
  <text class="note-text" x="1036" y="767">RETHROW, SKIP, or FAIL_OPEN_RUN for backend errors</text>

  <path class="return" d="M677 825 H165"/>
  <text class="small" x="225" y="812">6. return result or propagate body exception</text>

  <circle class="badge" cx="90" cy="856" r="22"/>
  <text class="badge-text" x="82" y="861">!</text>
  <text class="small" x="122" y="862">State inspection is not shown here: execution decisions stay on the atomic runIfLeader path.</text>
</svg>
