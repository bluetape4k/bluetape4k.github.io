<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">병상 배정과 학교 시간표의 계획 모델 비교</title>
  <desc id="desc">병상 배정의 Stay와 bed 변수, 학교 시간표의 Lesson과 timeslot 및 room 변수를 문제 정보와 점수 구조까지 나란히 비교한다.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/><stop offset="0.58" stop-color="#0c1730"/><stop offset="1" stop-color="#10142a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.55"/></filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#68a9ce"/></marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#d0a35f"/></marker>
    <style>
      .title{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:48px;font-weight:700;fill:#f8fafc}.subtitle{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:19px;fill:#a9b8d4}.lane{fill:#0f1d33;stroke-width:2}.laneBed{stroke:#5f9fc4}.laneSchool{stroke:#c99a58}.laneTitle{font-family:'goorm Sans','Architects Daughter',sans-serif;font-size:34px;font-weight:700}.laneDesc{font-family:'goorm Sans',sans-serif;font-size:17px;fill:#a9b8d4}.card{fill:#15243b;stroke-width:1.8;filter:url(#shadow)}.cardTitle{font-family:'goorm Sans',sans-serif;font-size:21px;font-weight:700;fill:#f8fafc}.code{font-family:'goorm Sans Code','Comic Mono','goorm Sans',monospace;font-size:17px}.body{font-family:'goorm Sans',sans-serif;font-size:17px;fill:#c7d3e7}.small{font-family:'goorm Sans',sans-serif;font-size:15px;fill:#a9b8d4}.pill{fill:#101b30;stroke-width:1.4}.footer{font-family:'goorm Sans',sans-serif;font-size:18px;fill:#c7d3e7}.flow{fill:none;stroke-width:3;stroke-linecap:round}
    </style>
  </defs>
  <rect width="1800" height="1120" rx="34" fill="url(#canvas)"/><rect x="28" y="28" width="1744" height="1064" rx="28" fill="none" stroke="#2b4168" stroke-width="2"/>
  <text class="title" x="900" y="82" text-anchor="middle">같은 Solver, 다른 계획 모델</text>
  <text class="subtitle" x="900" y="120" text-anchor="middle">계획 대상과 선택값, 문제 정보, 점수 계층은 업무 규칙에서 출발합니다.</text>
  <rect class="lane laneBed" x="70" y="165" width="800" height="830" rx="28"/>
  <rect class="lane laneSchool" x="930" y="165" width="800" height="830" rx="28"/>
  <text class="laneTitle" x="470" y="220" text-anchor="middle" fill="#a8d6ee">병상 배정</text><text class="laneDesc" x="470" y="253" text-anchor="middle">입원 기간 전체에 사용할 병상 하나를 선택</text>
  <text class="laneTitle" x="1330" y="220" text-anchor="middle" fill="#f1d6a7">학교 시간표</text><text class="laneDesc" x="1330" y="253" text-anchor="middle">각 수업에 시간과 교실을 함께 선택</text>

  <rect class="card" x="135" y="300" width="280" height="135" rx="20" stroke="#5f9fc4"/><text class="small" x="275" y="330" text-anchor="middle">계획 대상</text><text class="cardTitle" x="275" y="370" text-anchor="middle">입원 일정</text><text class="code" x="275" y="405" text-anchor="middle" fill="#a8d6ee">Stay</text>
  <path class="flow" d="M415 368 H535" stroke="#68a9ce" marker-end="url(#arrow-blue)"/>
  <rect class="card" x="545" y="300" width="260" height="135" rx="20" stroke="#5f9fc4"/><text class="small" x="675" y="330" text-anchor="middle">선택값</text><text class="cardTitle" x="675" y="370" text-anchor="middle">병상</text><text class="code" x="675" y="405" text-anchor="middle" fill="#a8d6ee">bed</text>
  <rect class="card" x="135" y="485" width="670" height="145" rx="20" stroke="#4e6b91"/><text class="small" x="470" y="518" text-anchor="middle">문제 정보</text><text class="cardTitle" x="470" y="558" text-anchor="middle">진료과 → 병실 → 병상</text><text class="code" x="470" y="594" text-anchor="middle" fill="#a8d6ee">departments · rooms · beds</text>
  <rect class="card" x="135" y="680" width="670" height="220" rx="20" stroke="#88a86b"/><text class="small" x="470" y="714" text-anchor="middle">제약과 점수</text><text class="code" x="470" y="755" text-anchor="middle" fill="#c9dda8">HardMediumSoftScore</text><text class="body" x="180" y="800">필수 · 같은 밤의 병상 충돌, 성별, 연령, 필수 장비</text><text class="body" x="180" y="838">중간 · 병상을 배정하지 못한 입원 일정</text><text class="body" x="180" y="876">선호 · 병실 정원, 진료과 우선순위</text>

  <rect class="card" x="995" y="300" width="280" height="135" rx="20" stroke="#c99a58"/><text class="small" x="1135" y="330" text-anchor="middle">계획 대상</text><text class="cardTitle" x="1135" y="370" text-anchor="middle">수업</text><text class="code" x="1135" y="405" text-anchor="middle" fill="#f1d6a7">Lesson</text>
  <path class="flow" d="M1275 368 H1395" stroke="#d0a35f" marker-end="url(#arrow-amber)"/>
  <rect class="card" x="1405" y="300" width="260" height="135" rx="20" stroke="#c99a58"/><text class="small" x="1535" y="330" text-anchor="middle">선택값</text><text class="cardTitle" x="1535" y="370" text-anchor="middle">시간 · 교실</text><text class="code" x="1535" y="405" text-anchor="middle" fill="#f1d6a7">timeslot + room</text>
  <rect class="card" x="995" y="485" width="670" height="145" rx="20" stroke="#9a7542"/><text class="small" x="1330" y="518" text-anchor="middle">문제 정보</text><text class="cardTitle" x="1330" y="558" text-anchor="middle">수업 가능 시간 · 교실</text><text class="code" x="1330" y="594" text-anchor="middle" fill="#f1d6a7">timeslots · rooms</text>
  <rect class="card" x="995" y="680" width="670" height="220" rx="20" stroke="#5ab3aa"/><text class="small" x="1330" y="714" text-anchor="middle">제약과 점수</text><text class="code" x="1330" y="755" text-anchor="middle" fill="#a9e4df">HardSoftScore</text><text class="body" x="1040" y="800">필수 · 교실, 교사, 학생 그룹의 시간 충돌</text><text class="body" x="1040" y="838">선호 · 교사의 교실 안정성, 빈 시간 줄이기</text><text class="body" x="1040" y="876">선호 · 학생 그룹의 같은 날 과목 다양성</text>
  <rect class="pill" x="300" y="940" width="1200" height="76" rx="24" stroke="#506989"/><text class="footer" x="900" y="971" text-anchor="middle">점수 계층은 기술 취향이 아니라 업무 우선순위를 표현하는 계약입니다.</text><text class="small" x="900" y="999" text-anchor="middle">먼저 계획 대상을 고정하고, 바꿀 값과 평가 규칙을 분리해야 합니다.</text>
</svg>
