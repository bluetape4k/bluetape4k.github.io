<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
<title id="title">Ktor 요청에서 테넌트 스키마를 선택하는 순서</title><desc id="desc">입력 검증은 권한 검증이 아닙니다. 인증 주체의 접근 권한과 테넌트 준비 상태는 별도 경계에서 확인합니다.</desc><defs><marker id="arrow-cyan" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#36C5F0"/></marker><marker id="arrow-mint" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5EEAD4"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FBBF24"/></marker><marker id="arrow-red" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#FB7185"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#A78BFA"/></marker></defs>
  <style>
  .bg{fill:#07111F}.panel{fill:#0D1B2D;stroke:#36536F;stroke-width:2}.card{fill:#10243A;stroke:#36536F;stroke-width:2}.card2{fill:#132B43;stroke:#36536F;stroke-width:2}
  .title{font:700 42px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}.sub{font:600 19px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}.h{font:700 24px "goorm Sans","Apple SD Gothic Neo",sans-serif;fill:#E6F2FF}
  .body{font:600 17px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}.mono{font:700 16px "goorm Sans Code","goorm Sans",monospace;fill:#E6F2FF}.small{font:600 14px "goorm Sans Code","goorm Sans",monospace;fill:#9CB4CC}
  .life{stroke:#36536F;stroke-width:2;stroke-dasharray:8 9}.act{fill:#123252;stroke:#36C5F0;stroke-width:2}
  .call{fill:none;stroke:#36C5F0;stroke-width:4;marker-end:url(#arrow-cyan)}.ok{fill:none;stroke:#5EEAD4;stroke-width:4;marker-end:url(#arrow-mint)}
  .warn{fill:none;stroke:#FBBF24;stroke-width:4;marker-end:url(#arrow-amber)}.err{fill:none;stroke:#FB7185;stroke-width:4;marker-end:url(#arrow-red)}
  .violet{fill:none;stroke:#A78BFA;stroke-width:4;marker-end:url(#arrow-violet)}.return{stroke-dasharray:10 8}
  .pill{fill:#10243A;stroke:#36536F;stroke-width:2}.frame{fill:none;stroke:#FB7185;stroke-width:2;stroke-dasharray:10 8}
  .axis{stroke:#36536F;stroke-width:2}.grid{stroke:#233B54;stroke-width:1}.footer{fill:#0B2238;stroke:#36536F;stroke-width:2}
  </style>
<rect width="1800" height="1200" class="bg"/><rect x="32" y="32" width="1736" height="1136" rx="30" class="panel frame"/>
<text x="78" y="98" class="title">Ktor 요청에서 테넌트 스키마를 선택하는 순서</text><text x="80" y="138" class="sub subtitle">원본 헤더는 플러그인에서 검증하고, 호출 속성과 트랜잭션에는 형식화된 값만 전달합니다.</text><rect x="30" y="210" width="270" height="100" rx="20" class="card"/>
<text x="54" y="254" class="h participant">클라이언트</text><text x="54" y="292" class="body">HTTP 요청</text><rect x="385" y="210" width="270" height="100" rx="20" class="card2"/>
<text x="409" y="254" class="h participant">TenantPlugin</text><text x="409" y="292" class="body">정규화·검증</text><rect x="740" y="210" width="270" height="100" rx="20" class="card"/>
<text x="764" y="254" class="h participant">호출 속성</text><text x="764" y="292" class="body">Tenants.Tenant</text><rect x="1095" y="210" width="270" height="100" rx="20" class="card"/>
<text x="1119" y="254" class="h participant">라우트 처리기</text><text x="1119" y="292" class="body">명시적 전달</text><rect x="1450" y="210" width="270" height="100" rx="20" class="card"/>
<text x="1474" y="254" class="h participant">R2DBC 트랜잭션</text><text x="1474" y="292" class="body">스키마·조회</text><path d="M165 310 V1040" class="life"/><path d="M520 310 V1040" class="life"/><path d="M875 310 V1040" class="life"/><path d="M1230 310 V1040" class="life"/><path d="M1585 310 V1040" class="life"/><rect x="511" y="345" width="18" height="555" rx="8" class="act"/><rect x="1576" y="760" width="18" height="180" rx="8" class="act"/><rect x="185" y="302" width="330" height="42" rx="16" class="pill"/>
<circle cx="207" cy="323" r="14" fill="#0D1B2D" stroke="#36C5F0" stroke-width="2"/><text x="207" y="329" text-anchor="middle" class="mono badgeText">1</text>
<text x="233" y="329" class="mono labelText">X-TENANT-ID 전달</text><path d="M165 360 H508" class="call"/><rect x="552" y="392" width="330" height="42" rx="16" class="pill"/>
<circle cx="574" cy="413" r="14" fill="#0D1B2D" stroke="#5EEAD4" stroke-width="2"/><text x="574" y="419" text-anchor="middle" class="mono badgeText">2</text>
<text x="600" y="419" class="mono labelText">헤더 정규화·테넌트 확인</text><path d="M532 450 H863" class="ok"/><rect x="552" y="482" width="330" height="42" rx="16" class="pill"/>
<circle cx="574" cy="503" r="14" fill="#0D1B2D" stroke="#5EEAD4" stroke-width="2"/><text x="574" y="509" text-anchor="middle" class="mono badgeText">3</text>
<text x="600" y="509" class="mono labelText">형식화된 테넌트 저장</text><path d="M532 540 H863" class="ok"/><rect x="907" y="572" width="330" height="42" rx="16" class="pill"/>
<circle cx="929" cy="593" r="14" fill="#0D1B2D" stroke="#A78BFA" stroke-width="2"/><text x="929" y="599" text-anchor="middle" class="mono badgeText">4</text>
<text x="955" y="599" class="mono labelText">테넌트 값 조회</text><path d="M1230 630 H887" class="call"/><rect x="1250" y="662" width="330" height="42" rx="16" class="pill"/>
<circle cx="1272" cy="683" r="14" fill="#0D1B2D" stroke="#A78BFA" stroke-width="2"/><text x="1272" y="689" text-anchor="middle" class="mono badgeText">5</text>
<text x="1298" y="689" class="mono labelText">트랜잭션 시작</text><path d="M1230 720 H1573" class="violet"/><rect x="1250" y="752" width="330" height="42" rx="16" class="pill"/>
<circle cx="1272" cy="773" r="14" fill="#0D1B2D" stroke="#FBBF24" stroke-width="2"/><text x="1272" y="779" text-anchor="middle" class="mono badgeText">6</text>
<text x="1298" y="779" class="mono labelText">현재 스키마 설정</text><path d="M1230 810 H1573" class="warn"/><rect x="704" y="857" width="330" height="42" rx="16" class="pill"/>
<circle cx="726" cy="878" r="14" fill="#0D1B2D" stroke="#5EEAD4" stroke-width="2"/><text x="726" y="884" text-anchor="middle" class="mono badgeText">7</text>
<text x="752" y="884" class="mono labelText">행 조회·응답</text><path d="M1573 915 H165" class="ok return"/><rect x="290" y="970" width="1180" height="72" rx="18" class="footer"/><text x="880" y="1014" text-anchor="middle" class="body">거부 경계: 누락·공백·충돌·미등록 테넌트 → DB 접근 전에 400 응답</text>
  <rect x="145" y="1080" width="1510" height="74" rx="20" class="footer"/><text x="900" y="1125" text-anchor="middle" class="body">입력 검증은 권한 검증이 아닙니다. 인증 주체의 접근 권한과 테넌트 준비 상태는 별도 경계에서 확인합니다.</text></svg>
