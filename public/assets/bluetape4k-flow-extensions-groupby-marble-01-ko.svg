<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">groupBy Flow marble diagram</title>
  <desc id="desc">A marble diagram showing events partitioned into separate streams by order id instead of by time or size.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#9ed8ff" stroke="#9ed8ff"/>
    </marker>
    <품목arGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></품목arGradient>
    <품목arGradient id="panelGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></품목arGradient>
    <품목arGradient id="operatorGradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#26384f"/><stop offset="100%" stop-color="#172033"/></품목arGradient>
    <radialGradient id="marbleTeal" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#d5fff8"/><stop offset="34%" stop-color="#62d6cb"/><stop offset="100%" stop-color="#0b766f"/></radialGradient>
    <radialGradient id="marblePurple" cx="32%" cy="28%" r="72%"><stop offset="0%" stop-color="#f0e7ff"/><stop offset="36%" stop-color="#a98be9"/><stop offset="100%" stop-color="#6840a8"/></radialGradient>
    <filter id="panelShadow" x="-8%" y="-12%" width="116%" height="124%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
    <filter id="marbleShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#020617" flood-opacity="0.42"/></filter>
    <filter id="laneGlow" x="-4%" y="-120%" width="108%" height="340%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.35"/></filter>
    <style>
      .bg { fill: url(#bgGradient); }
      .panel { fill: url(#panelGradient); stroke: #536377; stroke-width: 2; rx: 18; filter: url(#panelShadow); }
      .title { font: 24px "goorm Sans"; fill: #f8fafc; }
      .sub { font: 14px "goorm Sans Code"; fill: #b6c4d6; }
      .label { font: 15px "goorm Sans Code"; fill: #e5edf7; }
      .small { font: 13px "goorm Sans Code"; fill: #b6c4d6; }
      .tiny { font: 11px "goorm Sans Code"; fill: #f8fafc; text-anchor: middle; dominant-base품목: middle; font-weight: 700; }
      .edge { stroke: #9ed8ff; stroke-width: 4; stroke-품목cap: round; marker-end: url(#arrow); filter: url(#laneGlow); }
      .event { stroke: #e8f7ff; stroke-width: 1.8; filter: url(#marbleShadow); }
      .box { fill: #172033; stroke-width: 2.5; rx: 14; }
      .op { fill: url(#operatorGradient); stroke: #7dd3fc; }
      .teal { fill: url(#marbleTeal); }
      .purple { fill: url(#marblePurple); }
      .shape { stroke: #e8f7ff; stroke-width: 1.8; filter: url(#marbleShadow); }
      .keyBand { fill: #0f172a; fill-opacity: 0.16; stroke-width: 2; stroke-dasharray: 7 7; }
      .legend { font: 12px "goorm Sans Code"; fill: #d8e5f2; }
    </style>
  </defs>
  <rect class="bg" width="920" height="360"/>
  <rect class="panel" x="24" y="22" width="872" height="316"/>
  <text class="title" x="52" y="58">groupBy: 시간이나 크기가 아니라 키로 나눕니다</text>
  <text class="sub" x="52" y="84">색상 = 주문 키 · 모양 = 이벤트 유형 · 아래 = 키마다 그룹화된 Flow 하나</text>

  <text class="small" x="52" y="132">입력 Flow</text>
  <path class="edge" d="M150 128 L806 128"/>
  <circle class="shape teal" cx="220" cy="128" r="13"/><text class="tiny" x="220" y="128">C</text>
  <circle class="shape purple" cx="300" cy="128" r="13"/><text class="tiny" x="300" y="128">C</text>
  <rect class="shape teal" x="367" y="115" width="26" height="26" rx="7"/><text class="tiny" x="380" y="128">L</text>
  <path class="shape teal" d="M 460 111 L 477 128 L 460 145 L 443 128 Z"/><text class="tiny" x="460" y="128">P</text>
  <path class="shape purple" d="M 540 112 L 556 141 L 524 141 Z"/><text class="tiny" x="540" y="132">S</text>
  <path d="M 780 113 V 143" stroke="#334155" stroke-width="3" stroke-품목cap="round"/>

  <rect class="keyBand" x="202" y="111" width="278" height="144" rx="18" stroke="#159c92"/>
  <rect class="keyBand" x="282" y="111" width="278" height="214" rx="18" stroke="#8b6bd6"/>
  <path d="M 220 142 V 218" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M 300 142 V 278" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M 460 142 V 218" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M 540 142 V 278" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 7"/>
  <rect class="box op" x="334" y="166" width="182" height="44"/>
  <text class="label" x="425" y="193" text-anchor="middle">groupBy(orderId)</text>

  <text class="small" x="52" y="240">출력 Flow</text>
  <text class="small" x="142" y="226">order-1</text>
  <path class="edge" d="M220 220 L806 220"/>
  <circle class="shape teal" cx="260" cy="220" r="11"/><text class="tiny" x="260" y="220">C</text>
  <rect class="shape teal" x="369" y="209" width="22" height="22" rx="6"/><text class="tiny" x="380" y="220">L</text>
  <path class="shape teal" d="M 460 206 L 474 220 L 460 234 L 446 220 Z"/><text class="tiny" x="460" y="220">P</text>
  <path d="M 780 205 V 235" stroke="#334155" stroke-width="3" stroke-품목cap="round"/>

  <text class="small" x="142" y="306">order-2</text>
  <path class="edge" d="M220 300 L806 300"/>
  <circle class="shape purple" cx="300" cy="300" r="11"/><text class="tiny" x="300" y="300">C</text>
  <path class="shape purple" d="M 540 288 L 553 312 L 527 312 Z"/><text class="tiny" x="540" y="303">S</text>
  <path d="M 780 285 V 315" stroke="#334155" stroke-width="3" stroke-품목cap="round"/>
  <text class="legend" x="606" y="330">C=생성, L=품목, P=결제, S=배송</text>
</svg>
