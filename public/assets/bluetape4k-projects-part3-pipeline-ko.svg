<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="760" viewBox="0 0 1580 760" role="img">
<title>byte가 지나가는 경로</title>
<desc>변환, 전송, 저장, 보호 규칙은 service boundary에서 만납니다.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1D3148" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#4D6F9F"/></marker>
  <style>
    .bg{fill:#F7F9FC}.frame{fill:#fff;stroke:#D6E2ED;stroke-width:2}
    .title{font-family:"goorm Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:36px;fill:#21334A;font-weight:700}
    .subtitle,.body,.small{font-family:"goorm Sans Code","goorm Sans","D2Coding",monospace;fill:#34465B}
    .subtitle{font-size:16px}.body{font-size:15px}.small{font-size:12px;fill:#657386}
    .label{font-family:"goorm Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:20px;fill:#21334A;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke:#4D6F9F;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bar-label{font-family:"goorm Sans Code","goorm Sans","D2Coding",monospace;font-size:15px;fill:#26384F}.axis{stroke:#B8C7D9;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1580" height="760"/>
<rect class="frame" x="34" y="28" width="1512" height="704" rx="24"/>
<text class="title" x="70" y="82">byte가 지나가는 경로</text>
<text class="subtitle" x="72" y="114">변환, 전송, 저장, 보호 규칙은 service boundary에서 만납니다.</text>
<g data-card="Bytes">
  <rect class="card" x="50" y="315" width="170" height="116" rx="14" fill="#E8F1FF" stroke="#5A85D6"/>
  <text class="label" x="135" y="349" text-anchor="middle"><tspan x="135" dy="0">Bytes</tspan></text>
  <text class="body" x="135" y="383" text-anchor="middle"><tspan x="135" dy="0">file · buffer</tspan><tspan x="135" dy="20">payload</tspan></text>
</g>
<g data-card="I/O Utilities">
  <rect class="card" x="270" y="315" width="200" height="116" rx="14" fill="#EAF7ED" stroke="#58A978"/>
  <text class="label" x="370" y="349" text-anchor="middle"><tspan x="370" dy="0">I/O Utilities</tspan></text>
  <text class="body" x="370" y="383" text-anchor="middle"><tspan x="370" dy="0">compression · ZIP</tspan><tspan x="370" dy="20">binary serializer</tspan></text>
</g>
<g data-card="Okio Streams">
  <rect class="card" x="520" y="315" width="210" height="116" rx="14" fill="#E7F7F5" stroke="#3CA7A0"/>
  <text class="label" x="625" y="349" text-anchor="middle"><tspan x="625" dy="0">Okio Streams</tspan></text>
  <text class="body" x="625" y="383" text-anchor="middle"><tspan x="625" dy="0">Source · Sink · Buffer</tspan><tspan x="625" dy="20">NIO와 coroutine I/O</tspan></text>
</g>
<g data-card="Serializers">
  <rect class="card" x="780" y="315" width="220" height="116" rx="14" fill="#FFF3D8" stroke="#D6A441"/>
  <text class="label" x="890" y="349" text-anchor="middle"><tspan x="890" dy="0">Serializers</tspan></text>
  <text class="body" x="890" y="383" text-anchor="middle"><tspan x="890" dy="0">JSON · Avro · Protobuf</tspan><tspan x="890" dy="20">wire compatibility</tspan></text>
</g>
<g data-card="Transport">
  <rect class="card" x="1050" y="315" width="190" height="116" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="1145" y="349" text-anchor="middle"><tspan x="1145" dy="0">Transport</tspan></text>
  <text class="body" x="1145" y="383" text-anchor="middle"><tspan x="1145" dy="0">HTTP · gRPC</tspan><tspan x="1145" dy="20">timeout과 client</tspan></text>
</g>
<g data-card="Storage Boundary">
  <rect class="card" x="1290" y="315" width="190" height="116" rx="14" fill="#FCECEF" stroke="#DC6B82"/>
  <text class="label" x="1385" y="349" text-anchor="middle"><tspan x="1385" dy="0">Storage Boundary</tspan></text>
  <text class="body" x="1385" y="383" text-anchor="middle"><tspan x="1385" dy="0">cache · column · object</tspan></text>
</g>
<g data-card="Tink">
  <rect class="card" x="1290" y="500" width="190" height="116" rx="14" fill="#F5F7FA" stroke="#8FA1B3"/>
  <text class="label" x="1385" y="534" text-anchor="middle"><tspan x="1385" dy="0">Tink</tspan></text>
  <text class="body" x="1385" y="568" text-anchor="middle"><tspan x="1385" dy="0">encrypt · decrypt</tspan><tspan x="1385" dy="20">keyset boundary</tspan></text>
</g>
<path class="connector" data-connector="bytes-to-io-utilities" d="M220 373 H270"/>
<path class="connector" data-connector="io-utilities-to-okio-streams" d="M470 373 H520"/>
<path class="connector" data-connector="okio-streams-to-serializers" d="M730 373 H780"/>
<path class="connector" data-connector="serializers-to-transport" d="M1000 373 H1050"/>
<path class="connector" data-connector="transport-to-storage-boundary" d="M1240 373 H1290"/>
<path class="connector" data-connector="storage-boundary-to-tink" d="M1385 431 V500"/>
</svg>