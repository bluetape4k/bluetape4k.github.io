<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Clinic Appointment SaaS domain map</title>
  <desc id="desc">A tenant group owns multiple clinics. Each clinic has its own calendar, doctors, treatments, and equipment, which define clinic-scoped appointment decisions implemented across five backend modules.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f" />
      <stop offset="0.55" stop-color="#0c1730" />
      <stop offset="1" stop-color="#10142a" />
    </linearGradient>
    <linearGradient id="tenantFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c52" />
      <stop offset="1" stop-color="#172a4a" />
    </linearGradient>
    <linearGradient id="appointmentFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33245d" />
      <stop offset="1" stop-color="#17264b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.65" />
    </filter>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#39d9c7" />
    </marker>
    <marker id="arrowViolet" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#a78bfa" />
    </marker>
    <style>
      .title { font-family: 'Architects Daughter', cursive; font-size: 46px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Comic Mono', monospace; font-size: 21px; fill: #a9b8d4; }
      .lane-title { font-family: 'Architects Daughter', cursive; font-size: 27px; font-weight: 700; fill: #f8fafc; }
      .card-title { font-family: 'Architects Daughter', cursive; font-size: 25px; font-weight: 700; fill: #f8fafc; }
      .label { font-family: 'Comic Mono', monospace; font-size: 18px; fill: #d7e2f4; }
      .small { font-family: 'Comic Mono', monospace; font-size: 15px; fill: #9eb0cc; }
      .module { font-family: 'Comic Mono', monospace; font-size: 17px; font-weight: 700; fill: #f1f5f9; }
      .connector { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 4; }
      .ownership { stroke: #39d9c7; marker-end: url(#arrowTeal); }
      .input { stroke: #a78bfa; marker-end: url(#arrowViolet); }
    </style>
  </defs>

  <rect width="1600" height="1080" rx="32" fill="url(#canvas)" />
  <rect x="28" y="28" width="1544" height="1024" rx="28" fill="none" stroke="#263a5e" stroke-width="2" />

  <text class="title" x="800" y="72" text-anchor="middle">Clinic Appointment SaaS: One Platform, Different Clinics</text>
  <text class="subtitle" x="800" y="108" text-anchor="middle">A reservation is valid only inside the calendar and resource rules of its clinic.</text>

  <g filter="url(#shadow)">
    <rect class="card" id="tenant-group-card" x="610" y="145" width="380" height="108" rx="24" fill="url(#tenantFill)" stroke="#39d9c7" stroke-width="3" />
    <circle cx="665" cy="199" r="27" fill="#0b2134" stroke="#39d9c7" stroke-width="2" />
    <circle cx="655" cy="195" r="7" fill="#9ff3e7" />
    <circle cx="675" cy="195" r="7" fill="#9ff3e7" />
    <path d="M 647 216 Q 665 202 683 216" fill="none" stroke="#9ff3e7" stroke-width="5" stroke-linecap="round" />
    <text class="card-title" x="835" y="190" text-anchor="middle">TenantGroup</text>
    <text class="label" x="835" y="222" text-anchor="middle">SaaS ownership boundary</text>
  </g>

  <path class="connector ownership" data-connector="tenant-clinic-a" d="M 700 253 V 265 Q 700 279 686 279 H 314 Q 300 279 300 293 V 305" />
  <path class="connector ownership" data-connector="tenant-clinic-b" d="M 800 253 V 305" />
  <path class="connector ownership" data-connector="tenant-clinic-c" d="M 900 253 V 265 Q 900 279 914 279 H 1286 Q 1300 279 1300 293 V 305" />

  <g>
    <rect class="card" id="clinic-a-card" x="72" y="305" width="456" height="368" rx="26" fill="#0d1a30" stroke="#2a9dca" stroke-width="2" />
    <rect x="72" y="305" width="456" height="66" rx="26" fill="#102b43" />
    <path d="M 72 345 V 345" stroke="#102b43" />
    <text class="lane-title" x="300" y="347" text-anchor="middle">Clinic A</text>

    <rect x="100" y="395" width="400" height="70" rx="16" fill="#12243e" stroke="#38bdf8" stroke-width="2" />
    <circle cx="137" cy="430" r="18" fill="#0c4a6e" />
    <path d="M 127 430 H 147 M 137 420 V 440" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" />
    <text class="card-title" x="300" y="424" text-anchor="middle">Clinic Calendar</text>
    <text class="small" x="315" y="450" text-anchor="middle">weekday hours / breaks / closures</text>

    <rect x="100" y="485" width="400" height="70" rx="16" fill="#17213e" stroke="#818cf8" stroke-width="2" />
    <circle cx="137" cy="520" r="16" fill="#312e81" />
    <circle cx="137" cy="515" r="6" fill="#c7d2fe" />
    <path d="M 126 530 Q 137 520 148 530" fill="none" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" />
    <text class="card-title" x="300" y="514" text-anchor="middle">Doctors</text>
    <text class="small" x="315" y="540" text-anchor="middle">provider skills / schedules / absences</text>

    <rect x="100" y="575" width="400" height="70" rx="16" fill="#1c1d3a" stroke="#c084fc" stroke-width="2" />
    <circle cx="137" cy="610" r="16" fill="#581c87" />
    <rect x="128" y="601" width="18" height="18" rx="4" fill="none" stroke="#e9d5ff" stroke-width="3" />
    <text class="card-title" x="300" y="604" text-anchor="middle">Treatments &amp; Equipment</text>
    <text class="small" x="315" y="630" text-anchor="middle">duration / capability / availability</text>
  </g>

  <g>
    <rect class="card" id="clinic-b-card" x="572" y="305" width="456" height="368" rx="26" fill="#0d1a30" stroke="#7c6ee6" stroke-width="2" />
    <rect x="572" y="305" width="456" height="66" rx="26" fill="#24214c" />
    <text class="lane-title" x="800" y="347" text-anchor="middle">Clinic B</text>

    <rect x="600" y="395" width="400" height="70" rx="16" fill="#12243e" stroke="#38bdf8" stroke-width="2" />
    <circle cx="637" cy="430" r="18" fill="#0c4a6e" />
    <path d="M 627 430 H 647 M 637 420 V 440" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" />
    <text class="card-title" x="800" y="424" text-anchor="middle">Clinic Calendar</text>
    <text class="small" x="815" y="450" text-anchor="middle">late hours / holiday policy / breaks</text>

    <rect x="600" y="485" width="400" height="70" rx="16" fill="#17213e" stroke="#818cf8" stroke-width="2" />
    <circle cx="637" cy="520" r="16" fill="#312e81" />
    <circle cx="637" cy="515" r="6" fill="#c7d2fe" />
    <path d="M 626 530 Q 637 520 648 530" fill="none" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" />
    <text class="card-title" x="800" y="514" text-anchor="middle">Doctors</text>
    <text class="small" x="815" y="540" text-anchor="middle">specialist roster / capacity / leave</text>

    <rect x="600" y="575" width="400" height="70" rx="16" fill="#1c1d3a" stroke="#c084fc" stroke-width="2" />
    <circle cx="637" cy="610" r="16" fill="#581c87" />
    <rect x="628" y="601" width="18" height="18" rx="4" fill="none" stroke="#e9d5ff" stroke-width="3" />
    <text class="card-title" x="800" y="604" text-anchor="middle">Treatments &amp; Equipment</text>
    <text class="small" x="815" y="630" text-anchor="middle">different devices / quantities / downtime</text>
  </g>

  <g>
    <rect class="card" id="clinic-c-card" x="1072" y="305" width="456" height="368" rx="26" fill="#0d1a30" stroke="#ad67cf" stroke-width="2" />
    <rect x="1072" y="305" width="456" height="66" rx="26" fill="#352044" />
    <text class="lane-title" x="1300" y="347" text-anchor="middle">Clinic C</text>

    <rect x="1100" y="395" width="400" height="70" rx="16" fill="#12243e" stroke="#38bdf8" stroke-width="2" />
    <circle cx="1137" cy="430" r="18" fill="#0c4a6e" />
    <path d="M 1127 430 H 1147 M 1137 420 V 440" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" />
    <text class="card-title" x="1300" y="424" text-anchor="middle">Clinic Calendar</text>
    <text class="small" x="1315" y="450" text-anchor="middle">early hours / local holidays / closures</text>

    <rect x="1100" y="485" width="400" height="70" rx="16" fill="#17213e" stroke="#818cf8" stroke-width="2" />
    <circle cx="1137" cy="520" r="16" fill="#312e81" />
    <circle cx="1137" cy="515" r="6" fill="#c7d2fe" />
    <path d="M 1126 530 Q 1137 520 1148 530" fill="none" stroke="#c7d2fe" stroke-width="4" stroke-linecap="round" />
    <text class="card-title" x="1300" y="514" text-anchor="middle">Doctors</text>
    <text class="small" x="1315" y="540" text-anchor="middle">own schedules / absences / concurrency</text>

    <rect x="1100" y="575" width="400" height="70" rx="16" fill="#1c1d3a" stroke="#c084fc" stroke-width="2" />
    <circle cx="1137" cy="610" r="16" fill="#581c87" />
    <rect x="1128" y="601" width="18" height="18" rx="4" fill="none" stroke="#e9d5ff" stroke-width="3" />
    <text class="card-title" x="1300" y="604" text-anchor="middle">Treatments &amp; Equipment</text>
    <text class="small" x="1315" y="630" text-anchor="middle">own catalog / requirements / maintenance</text>
  </g>

  <path class="connector input" data-connector="clinic-a-appointment" d="M 300 673 V 686 Q 300 700 314 700 H 586 Q 600 700 600 714 V 728" />
  <path class="connector input" data-connector="clinic-b-appointment" d="M 800 673 V 728" />
  <path class="connector input" data-connector="clinic-c-appointment" d="M 1300 673 V 686 Q 1300 700 1286 700 H 1014 Q 1000 700 1000 714 V 728" />

  <g filter="url(#shadow)">
    <rect class="card" id="appointment-card" x="400" y="728" width="800" height="136" rx="24" fill="url(#appointmentFill)" stroke="#a78bfa" stroke-width="3" />
    <text class="card-title" x="800" y="770" text-anchor="middle">Clinic-scoped Appointment</text>
    <text class="label" x="800" y="802" text-anchor="middle">doctor + treatment + equipment + date/time + state</text>
    <text class="small" x="800" y="828" text-anchor="middle">The same request can be feasible in one clinic and impossible in another.</text>
  </g>

  <g>
    <rect x="72" y="890" width="1456" height="118" rx="24" fill="#0b1528" stroke="#2b4168" stroke-width="2" />
    <text class="lane-title" x="112" y="929">Implementation responsibilities</text>

    <rect x="100" y="950" width="240" height="38" rx="12" fill="#143b4c" stroke="#39d9c7" />
    <text class="module" x="220" y="976" text-anchor="middle">appointment-core</text>

    <rect x="375" y="950" width="215" height="38" rx="12" fill="#173457" stroke="#38bdf8" />
    <text class="module" x="482" y="976" text-anchor="middle">appointment-api</text>

    <rect x="625" y="950" width="240" height="38" rx="12" fill="#2a2859" stroke="#818cf8" />
    <text class="module" x="745" y="976" text-anchor="middle">appointment-solver</text>

    <rect x="900" y="950" width="230" height="38" rx="12" fill="#3a2452" stroke="#c084fc" />
    <text class="module" x="1015" y="976" text-anchor="middle">appointment-event</text>

    <rect x="1165" y="950" width="325" height="38" rx="12" fill="#41263d" stroke="#f472b6" />
    <text class="module" x="1327" y="976" text-anchor="middle">appointment-notification</text>
  </g>

  <g>
    <circle cx="575" cy="1034" r="7" fill="#39d9c7" />
    <text class="small" x="592" y="1040">tenant ownership</text>
    <circle cx="812" cy="1034" r="7" fill="#a78bfa" />
    <text class="small" x="829" y="1040">clinic rules shape appointment feasibility</text>
  </g>
</svg>
