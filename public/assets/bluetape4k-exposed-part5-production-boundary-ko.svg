<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img">
<title>운영 경계</title>
<desc>캐시, 멀티테넌시, 아웃박스, Spring 연결은 함께 설계하고 측정해야 합니다.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.42"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#78AFFF"/></marker>
  <style>
    .bg{fill:#0B1220}.frame{fill:#0F1E33;stroke:#284766;stroke-width:2}
    .title{font-family:"goorm Sans";font-size:42px;fill:#F5F9FF;font-weight:700}
    .subtitle,.body,.small,.tiny,.axisLabel{font-family:"goorm Sans Code","goorm Sans";fill:#D7E3F5}
    .subtitle{font-size:16px}.body{font-size:14px}.small{font-size:12px;fill:#B8C7DD}.tiny{font-size:11px;fill:#B8C7DD}
    .label{font-family:"goorm Sans";font-size:23px;fill:#F5F9FF;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.line{fill:none;stroke:#78AFFF;stroke-width:3.2;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .axis{stroke:#55718F;stroke-width:1.4}.grid{stroke:#2F4B67;stroke-width:1;stroke-dasharray:4 6}
  </style>
</defs>
<rect class="bg" width="1500" height="760"/>
<rect class="frame" x="34" y="28" width="1432" height="704" rx="26"/>
<text class="title" x="70" y="82">운영 경계</text>
<text class="subtitle" x="72" y="114">캐시, 멀티테넌시, 아웃박스, Spring 연결은 함께 설계하고 측정해야 합니다.</text>
<g transform="translate(80 170)">
  <g>
  <rect class="card" x="0" y="232" width="230" height="112" rx="16" fill="#163761" stroke="#5EA0FF"/>
  <text class="label" x="115" y="270" text-anchor="middle" dominant-baseline="middle">HTTP 요청</text>
  <text class="body" x="115" y="300" text-anchor="middle">tenant header</text>
<text class="body" x="115" y="320" text-anchor="middle">idempotency key</text>
</g>
  <g>
  <rect class="card" x="330" y="54" width="260" height="116" rx="16" fill="#173D27" stroke="#4BDB85"/>
  <text class="label" x="460" y="94" text-anchor="middle" dominant-baseline="middle">Spring Boot 연결</text>
  <text class="body" x="460" y="124" text-anchor="middle">JDBC/R2DBC auto-config</text>
<text class="body" x="460" y="144" text-anchor="middle">저장소 스캔</text>
</g>
  <g>
  <rect class="card" x="330" y="232" width="260" height="116" rx="16" fill="#4B3212" stroke="#F0B84D"/>
  <text class="label" x="460" y="272" text-anchor="middle" dominant-baseline="middle">캐시 전략</text>
  <text class="body" x="460" y="302" text-anchor="middle">read-through</text>
<text class="body" x="460" y="322" text-anchor="middle">write-through/behind</text>
</g>
  <g>
  <rect class="card" x="330" y="410" width="260" height="116" rx="16" fill="#2D2359" stroke="#A993FF"/>
  <text class="label" x="460" y="450" text-anchor="middle" dominant-baseline="middle">테넌트 컨텍스트</text>
  <text class="body" x="460" y="480" text-anchor="middle">ThreadLocal · ScopedValue</text>
<text class="body" x="460" y="500" text-anchor="middle">Reactor Context</text>
</g>
  <g>
  <rect class="card" x="730" y="54" width="260" height="116" rx="16" fill="#4A1E2B" stroke="#F07A9B"/>
  <text class="label" x="860" y="94" text-anchor="middle" dominant-baseline="middle">아웃박스 / 멱등성</text>
  <text class="body" x="860" y="124" text-anchor="middle">pending record 먼저</text>
<text class="body" x="860" y="144" text-anchor="middle">duplicate key boundary</text>
</g>
  <g>
  <rect class="card" x="730" y="232" width="260" height="116" rx="16" fill="#123F3C" stroke="#35D0C5"/>
  <text class="label" x="860" y="272" text-anchor="middle" dominant-baseline="middle">저장소 계층</text>
  <text class="body" x="860" y="302" text-anchor="middle">Exposed 트랜잭션</text>
<text class="body" x="860" y="322" text-anchor="middle">캐시 키에 테넌트 포함</text>
</g>
  <g>
  <rect class="card" x="730" y="410" width="260" height="116" rx="16" fill="#1E293B" stroke="#94A3B8"/>
  <text class="label" x="860" y="450" text-anchor="middle" dominant-baseline="middle">관측성</text>
  <text class="body" x="860" y="480" text-anchor="middle">적중/실패 횟수</text>
<text class="body" x="860" y="500" text-anchor="middle">테넌트 누출 테스트</text>
</g>
  <g>
  <rect class="card" x="1110" y="232" width="240" height="112" rx="16" fill="#173D27" stroke="#4BDB85"/>
  <text class="label" x="1230" y="270" text-anchor="middle" dominant-baseline="middle">측정된 서비스</text>
  <text class="body" x="1230" y="300" text-anchor="middle">charts + tests</text>
<text class="body" x="1230" y="320" text-anchor="middle">안전한 기본값</text>
</g>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M230 268 H272 Q282 268 282 258 V122 Q282 112 292 112 H330"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M230 288 H330"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M230 308 H272 Q282 308 282 318 V458 Q282 468 292 468 H330"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M590 112 H730"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M590 288 H730"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M590 468 H730"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M990 112 H1040 Q1050 112 1050 122 V262 Q1050 272 1060 272 H1110"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M990 288 H1110"/>
  <path class="line" fill="none" stroke="#78AFFF" stroke-width="3.2" marker-end="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" d="M990 468 H1040 Q1050 468 1050 458 V326 Q1050 316 1060 316 H1110"/>
</g></svg>