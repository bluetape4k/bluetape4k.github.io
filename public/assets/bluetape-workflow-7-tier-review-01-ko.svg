<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">7단계 검토의 수렴 과정</title>
  <desc id="desc">여섯 독립 검토 관점을 주 세션이 통합하고 P0와 P1 차단 문제가 없어질 때까지 반복하는 구조도입니다.</desc>
  <style>
    .title { font-family: 'goorm Sans', 'Apple SD Gothic Neo', cursive; fill: #f1f5f9; font-size: 36px; }
    .subtitle, .label, .small, .gate { font-family: 'goorm Sans Code', 'SFMono-Regular', Consolas, monospace; }
    .subtitle { fill: #c2cede; font-size: 15px; }
    .label { fill: #27364a; font-size: 15px; }
    .small { fill: #c2cede; font-size: 12px; }
    .gate { fill: #f1f5f9; font-size: 18px; font-weight: 700; }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#94a3b8" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 11 6 L 0 11 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 11 6 L 0 11 Z" fill="#fb7185"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 11 6 L 0 11 Z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0b1220"/>
  <rect x="24" y="24" width="1552" height="852" rx="28" fill="#111c2e" stroke="#33475f" stroke-width="2"/>
  <text x="58" y="78" class="title">하나의 7단계 검토가 2-R, 3-R, 6-R을 지킵니다</text>
  <text x="60" y="110" class="subtitle">여섯 독립 관점이 서로 다른 실패를 찾고, 주 세션이 통합해 검증 관문을 책임집니다.</text>

  <!-- top gates -->
  <g filter="url(#shadow)">
    <rect x="150" y="140" width="330" height="74" rx="15" fill="#14243a" stroke="#60a5fa" stroke-width="2"/>
    <rect x="635" y="140" width="330" height="74" rx="15" fill="#14243a" stroke="#60a5fa" stroke-width="2"/>
    <rect x="1120" y="140" width="330" height="74" rx="15" fill="#14243a" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="315" y="174" text-anchor="middle" class="gate">2-R / 명세</text>
  <text x="315" y="197" text-anchor="middle" class="small">설계와 인수 계약</text>
  <text x="800" y="174" text-anchor="middle" class="gate">3-R / 계획</text>
  <text x="800" y="197" text-anchor="middle" class="small">대응 관계, 순서, 증거, 위험</text>
  <text x="1285" y="174" text-anchor="middle" class="gate">6-R / PR 전</text>
  <text x="1285" y="197" text-anchor="middle" class="small">현재 변경과 새 증거</text>

  <!-- gates to launch -->
  <g fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)">
    <path class="connector" d="M 315 214 V 236 Q 315 248 327 248 H 708 Q 720 248 720 260 V 270"/>
    <path class="connector" d="M 800 214 V 270"/>
    <path class="connector" d="M 1285 214 V 236 Q 1285 248 1273 248 H 892 Q 880 248 880 260 V 270"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="270" width="360" height="64" rx="16" fill="#291f3b" stroke="#c084fc" stroke-width="2"/>
  </g>
  <text x="800" y="297" text-anchor="middle" class="gate">여섯 독립 관점 실행</text>
  <text x="800" y="319" text-anchor="middle" class="small">병렬 관점, 독립 판정</text>

  <!-- fan-out bus -->
  <g fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#arrow-blue)">
    <path class="connector" d="M 710 334 V 344 Q 710 356 698 356 H 272 Q 260 356 260 368 V 390"/>
    <path class="connector" d="M 746 334 V 352 Q 746 364 734 364 H 488 Q 476 364 476 376 V 390"/>
    <path class="connector" d="M 782 334 V 360 Q 782 372 770 372 H 704 Q 692 372 692 384 V 390"/>
    <path class="connector" d="M 818 334 V 360 Q 818 372 830 372 H 896 Q 908 372 908 384 V 390"/>
    <path class="connector" d="M 854 334 V 352 Q 854 364 866 364 H 1112 Q 1124 364 1124 376 V 390"/>
    <path class="connector" d="M 890 334 V 344 Q 890 356 902 356 H 1328 Q 1340 356 1340 368 V 390"/>
  </g>

  <!-- six lens cards -->
  <g filter="url(#shadow)">
    <rect x="160" y="390" width="200" height="84" rx="15" fill="#14243a" stroke="#7aa7e8"/>
    <rect x="376" y="390" width="200" height="84" rx="15" fill="#142b22" stroke="#6db88a"/>
    <rect x="592" y="390" width="200" height="84" rx="15" fill="#321c24" stroke="#fb7185"/>
    <rect x="808" y="390" width="200" height="84" rx="15" fill="#302317" stroke="#d89132"/>
    <rect x="1024" y="390" width="200" height="84" rx="15" fill="#122b29" stroke="#2b9c93"/>
    <rect x="1240" y="390" width="200" height="84" rx="15" fill="#291f3b" stroke="#c084fc"/>
  </g>
  <text x="260" y="426" text-anchor="middle" class="gate">성능</text><text x="260" y="451" text-anchor="middle" class="small">비용, 규모, 지연 시간</text>
  <text x="476" y="426" text-anchor="middle" class="gate">안정성</text><text x="476" y="451" text-anchor="middle" class="small">실패, 동시성</text>
  <text x="692" y="426" text-anchor="middle" class="gate">보안</text><text x="692" y="451" text-anchor="middle" class="small">신뢰 경계, 노출</text>
  <text x="908" y="426" text-anchor="middle" class="gate">운영자 / 운영</text><text x="908" y="451" text-anchor="middle" class="small">배포와 관측</text>
  <text x="1124" y="426" text-anchor="middle" class="gate">개발자 / API</text><text x="1124" y="451" text-anchor="middle" class="small">계약과 오용</text>
  <text x="1340" y="426" text-anchor="middle" class="gate">사용자 / 호출자</text><text x="1340" y="451" text-anchor="middle" class="small">결과와 명확성</text>

  <!-- lenses to integration -->
  <g fill="none" stroke="#60a5fa" stroke-width="2.2" marker-end="url(#arrow-blue)">
    <path class="connector" d="M 260 474 V 548 Q 260 560 272 560 H 585"/>
    <path class="connector" d="M 476 474 V 518 Q 476 530 488 530 H 585"/>
    <path class="connector" d="M 692 474 V 532"/>
    <path class="connector" d="M 908 474 V 532"/>
    <path class="connector" d="M 1124 474 V 518 Q 1124 530 1112 530 H 1015"/>
    <path class="connector" d="M 1340 474 V 548 Q 1340 560 1328 560 H 1015"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="585" y="532" width="430" height="82" rx="16" fill="#132945" stroke="#60a5fa" stroke-width="2.5"/>
  </g>
  <text x="800" y="565" text-anchor="middle" class="gate">주 세션 통합</text>
  <text x="800" y="590" text-anchor="middle" class="small">중복 제거, 충돌 해결, P0 / P1 / P2 / P3 정규화</text>

  <!-- decision and branches -->
  <path class="connector" d="M 800 614 V 644" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <g filter="url(#shadow)">
    <rect x="625" y="644" width="350" height="70" rx="28" fill="#302718" stroke="#d89132" stroke-width="2"/>
  </g>
  <text x="800" y="686" text-anchor="middle" class="gate">P0 = 0 그리고 P1 = 0?</text>

  <!-- pass branch -->
  <path class="connector" d="M 975 679 H 1090" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="1032" y="666" text-anchor="middle" class="small">예</text>
  <g filter="url(#shadow)">
    <rect x="1090" y="644" width="330" height="70" rx="16" fill="#142b22" stroke="#34d399" stroke-width="2"/>
  </g>
  <text x="1255" y="673" text-anchor="middle" class="gate">다음 검증 관문 열기</text>
  <text x="1255" y="696" text-anchor="middle" class="small">새 P0 = 0, P1 = 0 기록</text>

  <!-- blocker branch and feedback -->
  <path class="connector" d="M 625 679 H 510" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="567" y="666" text-anchor="middle" class="small">아니요</text>
  <g filter="url(#shadow)">
    <rect x="180" y="644" width="330" height="70" rx="16" fill="#321c24" stroke="#fb7185" stroke-width="2"/>
    <rect x="180" y="760" width="330" height="70" rx="16" fill="#321c24" stroke="#fb7185" stroke-width="2"/>
    <rect x="635" y="760" width="330" height="70" rx="16" fill="#291f3b" stroke="#c084fc" stroke-width="2"/>
  </g>
  <text x="345" y="673" text-anchor="middle" class="gate">차단 문제 수정</text>
  <text x="345" y="696" text-anchor="middle" class="small">P0 / P1은 다음 작업을 막음</text>
  <path class="connector" d="M 345 714 V 760" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="345" y="789" text-anchor="middle" class="gate">검증 재실행</text>
  <text x="345" y="812" text-anchor="middle" class="small">수정된 동작 증명</text>
  <path class="connector" d="M 510 795 H 635" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="800" y="789" text-anchor="middle" class="gate">영향받은 검토 관점</text>
  <text x="800" y="812" text-anchor="middle" class="small">바뀐 전제를 모두 다시 열기</text>
  <path class="connector" d="M 965 795 H 1498 Q 1510 795 1510 783 V 598 Q 1510 586 1498 586 H 1015" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="1490" y="690" text-anchor="middle" class="small" transform="rotate(-90 1490 690)">영향받은 관점 검토 후 재통합</text>

  <!-- legend -->
  <circle cx="1120" cy="838" r="7" fill="#60a5fa"/><text x="1136" y="843" class="small">검토 흐름</text>
  <circle cx="1240" cy="838" r="7" fill="#fb7185"/><text x="1256" y="843" class="small">차단 문제 반복</text>
  <circle cx="1372" cy="838" r="7" fill="#34d399"/><text x="1388" y="843" class="small">검증 관문 통과</text>
  <text x="800" y="862" text-anchor="middle" class="small">통합이 일곱 번째 단계이며, 별도 검토자가 아니라 주 세션이 책임집니다.</text>
</svg>
