<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1080" viewBox="0 0 1880 1080" role="img" aria-labelledby="title desc">
  <title id="title">OCR API production workflow</title>
  <desc id="desc">Vertical responsibility lanes for HTTP upload boundary, image preprocessing boundary, native OCR boundary, and response contract boundary.</desc>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#3b6ea8" stroke="#3b6ea8" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-teal" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#26847f" stroke="#26847f" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-amber" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#a36b15" stroke="#a36b15" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-red" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#b34a47" stroke="#b34a47" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#64748b" stroke="#64748b" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <filter id="soft-shadow" x="-12%" y="-18%" width="124%" height="146%">
      <feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#1f2f46" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg { fill: #f6f8fb; }
      .lane { stroke: #d4deea; stroke-width: 2; }
      .lane-a { fill: #edf5ff; }
      .lane-b { fill: #f1f8f4; }
      .lane-c { fill: #fff7e6; }
      .lane-d { fill: #f8f1f4; }
      .lane-title { font: 700 29px 'Architects Daughter', 'Comic Mono', 'Comic Sans MS', cursive; fill: #253449; }
      .lane-sub { font: 17px 'Comic Mono', 'SFMono-Regular', monospace; fill: #667085; }
      .card { fill: #ffffff; stroke-width: 3; filter: url(#soft-shadow); }
      .card-blue { stroke: #3b6ea8; }
      .card-teal { stroke: #26847f; }
      .card-amber { stroke: #a36b15; }
      .card-red { stroke: #b34a47; }
      .card-gray { stroke: #64748b; }
      .card-title { font: 700 27px 'Architects Daughter', 'Comic Mono', 'Comic Sans MS', cursive; fill: #1f2937; }
      .card-body { font: 18px 'Comic Mono', 'SFMono-Regular', monospace; fill: #4b5563; }
      .dot-blue { fill: #3b6ea8; }
      .dot-teal { fill: #26847f; }
      .dot-amber { fill: #a36b15; }
      .dot-red { fill: #b34a47; }
      .dot-gray { fill: #64748b; }
      .flow { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .flow-blue { stroke: #3b6ea8; marker-end: url(#arrow-blue); }
      .flow-teal { stroke: #26847f; marker-end: url(#arrow-teal); }
      .flow-amber { stroke: #a36b15; marker-end: url(#arrow-amber); }
      .flow-red { stroke: #b34a47; marker-end: url(#arrow-red); }
      .flow-gray { stroke: #64748b; marker-end: url(#arrow-gray); }
      .pill { fill: #ffffff; stroke-width: 2; }
      .pill-blue { stroke: #a8c7e8; }
      .pill-teal { stroke: #a8d7d2; }
      .pill-amber { stroke: #e8c27a; }
      .pill-red { stroke: #e5aaa7; }
      .pill-gray { stroke: #cbd5e1; }
      .pill-text { font: 700 17px 'Comic Mono', 'SFMono-Regular', monospace; fill: #344054; }
      .legend-text { font: 16px 'Comic Mono', 'SFMono-Regular', monospace; fill: #53606f; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1880" height="1080"/>
  <rect class="lane lane-a" x="40" y="78" width="420" height="932" rx="24"/>
  <rect class="lane lane-b" x="500" y="78" width="420" height="932" rx="24"/>
  <rect class="lane lane-c" x="960" y="78" width="420" height="932" rx="24"/>
  <rect class="lane lane-d" x="1420" y="78" width="420" height="932" rx="24"/>

  <text class="lane-title" x="82" y="126">HTTP Upload Boundary</text>
  <text class="lane-sub" x="82" y="154">adapter-level request contract</text>
  <text class="lane-title" x="542" y="126">Image Preprocessing</text>
  <text class="lane-sub" x="542" y="154">bytes, headers, decoded pixels</text>
  <text class="lane-title" x="1002" y="126">Native OCR Boundary</text>
  <text class="lane-sub" x="1002" y="154">host runtime and timeout lane</text>
  <text class="lane-title" x="1462" y="126">Response Contract</text>
  <text class="lane-sub" x="1462" y="154">client-readable result shape</text>

  <g id="card-client-upload" data-node="client-upload">
    <rect class="card card-blue" id="rect-client-upload" x="90" y="170" width="320" height="130" rx="16"/>
    <circle class="dot-blue" cx="124" cy="210" r="11"/>
    <text class="card-title" x="148" y="214">Client Upload</text>
    <text class="card-body" x="124" y="250">multipart file</text>
    <text class="card-body" x="124" y="274">language=eng</text>
  </g>

  <g id="card-http-adapter" data-node="http-adapter">
    <rect class="card card-blue" id="rect-http-adapter" x="90" y="380" width="320" height="130" rx="16"/>
    <circle class="dot-blue" cx="124" cy="420" r="11"/>
    <text class="card-title" x="148" y="424">HTTP Adapter</text>
    <text class="card-body" x="124" y="460">Spring or Ktor</text>
    <text class="card-body" x="124" y="484">builds service request</text>
  </g>

  <g id="card-upload-guard" data-node="upload-guard">
    <rect class="card card-blue" id="rect-upload-guard" x="550" y="170" width="320" height="130" rx="16"/>
    <circle class="dot-blue" cx="584" cy="210" r="11"/>
    <text class="card-title" x="608" y="214">Upload Guard</text>
    <text class="card-body" x="584" y="250">empty bytes, max bytes</text>
    <text class="card-body" x="584" y="274">type + magic bytes</text>
  </g>

  <g id="card-pixel-budget" data-node="pixel-budget">
    <rect class="card card-blue" id="rect-pixel-budget" x="550" y="380" width="320" height="130" rx="16"/>
    <circle class="dot-blue" cx="584" cy="420" r="11"/>
    <text class="card-title" x="608" y="424">Pixel Budget</text>
    <text class="card-body" x="584" y="460">width * height cap</text>
    <text class="card-body" x="584" y="484">decode only if bounded</text>
  </g>

  <g id="card-preprocess" data-node="preprocess">
    <rect class="card card-teal" id="rect-preprocess" x="550" y="590" width="320" height="130" rx="16"/>
    <circle class="dot-teal" cx="584" cy="630" r="11"/>
    <text class="card-title" x="608" y="634">Preprocess</text>
    <text class="card-body" x="584" y="670">resize / grayscale</text>
    <text class="card-body" x="584" y="694">lower OCR cost</text>
  </g>

  <g id="card-native-gate" data-node="native-gate">
    <rect class="card card-amber" id="rect-native-gate" x="1010" y="380" width="320" height="130" rx="16"/>
    <circle class="dot-amber" cx="1044" cy="420" r="11"/>
    <text class="card-title" x="1068" y="424">Native Gate</text>
    <text class="card-body" x="1044" y="460">enabled?</text>
    <text class="card-body" x="1044" y="484">tessdata ready?</text>
  </g>

  <g id="card-tesseract" data-node="tesseract">
    <rect class="card card-teal" id="rect-tesseract" x="1010" y="590" width="320" height="130" rx="16"/>
    <circle class="dot-teal" cx="1044" cy="630" r="11"/>
    <text class="card-title" x="1068" y="634">Tesseract OCR</text>
    <text class="card-body" x="1044" y="670">Semaphore(1)</text>
    <text class="card-body" x="1044" y="694">withTimeout + IO</text>
  </g>

  <g id="card-bad-request" data-node="bad-request">
    <rect class="card card-gray" id="rect-bad-request" x="1470" y="170" width="320" height="130" rx="16"/>
    <circle class="dot-gray" cx="1504" cy="210" r="11"/>
    <text class="card-title" x="1528" y="214">BAD_REQUEST</text>
    <text class="card-body" x="1504" y="250">not a fallback</text>
    <text class="card-body" x="1504" y="274">reject invalid input</text>
  </g>

  <g id="card-unavailable" data-node="unavailable">
    <rect class="card card-amber" id="rect-unavailable" x="1470" y="380" width="320" height="130" rx="16"/>
    <circle class="dot-amber" cx="1504" cy="420" r="11"/>
    <text class="card-title" x="1528" y="424">UNAVAILABLE</text>
    <text class="card-body" x="1504" y="460">valid image</text>
    <text class="card-body" x="1504" y="484">runtime not ready</text>
  </g>

  <g id="card-completed" data-node="completed">
    <rect class="card card-teal" id="rect-completed" x="1470" y="590" width="320" height="130" rx="16"/>
    <circle class="dot-teal" cx="1504" cy="630" r="11"/>
    <text class="card-title" x="1528" y="634">COMPLETED</text>
    <text class="card-body" x="1504" y="670">text + blocks</text>
    <text class="card-body" x="1504" y="694">same response shape</text>
  </g>

  <g id="card-failed" data-node="failed">
    <rect class="card card-red" id="rect-failed" x="1470" y="800" width="320" height="130" rx="16"/>
    <circle class="dot-red" cx="1504" cy="840" r="11"/>
    <text class="card-title" x="1528" y="844">FAILED</text>
    <text class="card-body" x="1504" y="880">timeout</text>
    <text class="card-body" x="1504" y="904">OCR exception</text>
  </g>

  <path id="flow-upload-adapter" class="flow flow-blue" data-connector="upload-to-adapter" d="M 250 300 L 250 380"/>
  <path id="flow-adapter-guard" class="flow flow-blue" data-connector="adapter-to-guard" d="M 410 445 L 550 445"/>
  <path id="flow-guard-pixel" class="flow flow-blue" data-connector="guard-to-pixel" d="M 710 300 L 710 380"/>
  <path id="flow-pixel-preprocess" class="flow flow-teal" data-connector="pixel-to-preprocess" d="M 710 510 L 710 590"/>
  <path id="flow-guard-bad-request" class="flow flow-gray" data-connector="guard-to-bad-request" d="M 870 235 L 1470 235"/>
  <path id="flow-preprocess-native" class="flow flow-teal" data-connector="preprocess-to-native-gate" d="M 870 655 L 930 655 Q 948 655 948 637 L 948 463 Q 948 445 966 445 L 1010 445"/>
  <path id="flow-native-unavailable" class="flow flow-amber" data-connector="native-gate-to-unavailable" d="M 1330 445 L 1470 445"/>
  <path id="flow-native-tesseract" class="flow flow-teal" data-connector="native-gate-to-tesseract" d="M 1170 510 L 1170 590"/>
  <path id="flow-tesseract-completed" class="flow flow-teal" data-connector="tesseract-to-completed" d="M 1330 655 L 1470 655"/>
  <path id="flow-tesseract-failed" class="flow flow-red" data-connector="tesseract-to-failed" d="M 1170 720 L 1170 768 Q 1170 786 1188 786 L 1414 786 Q 1432 786 1432 804 L 1432 847 Q 1432 865 1450 865 L 1470 865"/>

  <rect class="pill pill-blue" x="430" y="398" width="168" height="36" rx="18"/>
  <text class="pill-text" x="452" y="422">request bytes</text>
  <rect class="pill pill-gray" x="1112" y="190" width="214" height="36" rx="18"/>
  <text class="pill-text" x="1134" y="214">invalid input stops</text>
  <rect class="pill pill-teal" x="892" y="602" width="146" height="36" rx="18"/>
  <text class="pill-text" x="914" y="626">valid image</text>
  <rect class="pill pill-amber" x="1348" y="398" width="154" height="36" rx="18"/>
  <text class="pill-text" x="1370" y="422">runtime gap</text>
  <rect class="pill pill-red" x="1232" y="742" width="180" height="36" rx="18"/>
  <text class="pill-text" x="1254" y="766">OCR failed safely</text>

  <g id="legend">
    <circle class="dot-blue" cx="90" cy="1038" r="8"/>
    <text class="legend-text" x="108" y="1044">upload guard</text>
    <circle class="dot-teal" cx="260" cy="1038" r="8"/>
    <text class="legend-text" x="278" y="1044">valid OCR path</text>
    <circle class="dot-amber" cx="475" cy="1038" r="8"/>
    <text class="legend-text" x="493" y="1044">runtime unavailable</text>
    <circle class="dot-red" cx="745" cy="1038" r="8"/>
    <text class="legend-text" x="763" y="1044">runtime failure</text>
    <circle class="dot-gray" cx="970" cy="1038" r="8"/>
    <text class="legend-text" x="988" y="1044">bad request, not fallback</text>
  </g>
</svg>
