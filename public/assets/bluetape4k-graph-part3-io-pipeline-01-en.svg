<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"Architects Daughter","Comic Sans MS",cursive;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"Comic Mono","Comic Sans MS",sans-serif;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1800" height="820"/>
<rect class="frame" x="34" y="28" width="1732" height="764" rx="24"/>
<text class="title" x="900" y="82" text-anchor="middle">Graph I/O Pipeline</text>
<text class="subtitle" x="900" y="118" text-anchor="middle">Move graph data through format adapters without coupling services to a single file shape</text>
<path class="edge" data-connector="graph-to-core" d="M410 301 L480 301"/>
<path class="edge" data-connector="core-to-formats" d="M800 283 L815 283 Q829 283 829 292 L829 292 Q829 301 847 301 L870 301"/>
<path class="edge" data-connector="formats-to-uses" d="M1210 283 L1300 283"/>
<path class="edge" data-connector="core-to-bench" d="M659 372 L659 500"/>
<path class="edge" data-connector="formats-to-decorators" d="M1058 372 L1058 424 Q1058 442 1049 442 L1049 442 Q1040 442 1040 460 L1040 500"/>
<path class="edge" data-connector="decorators-to-uses" d="M1210 571 L1237 571 Q1255 571 1255 553 L1255 337 Q1255 319 1273 319 L1300 319"/>
<g id="graph">
  <rect x="90" y="230" width="320" height="142" rx="12" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="250" y="287.5" text-anchor="middle">GraphOperations</text>
  <text class="nodeBody" x="250" y="321.5" text-anchor="middle">read vertices and edges</text>
  <text class="nodeBody" x="250" y="344.5" text-anchor="middle">write imported batches</text>
</g>
<g id="core">
  <rect x="480" y="230" width="320" height="142" rx="12" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="640" y="287.5" text-anchor="middle">graph-io-core</text>
  <text class="nodeBody" x="640" y="321.5" text-anchor="middle">bulk contracts</text>
  <text class="nodeBody" x="640" y="344.5" text-anchor="middle">export/import options</text>
</g>
<g id="formats">
  <rect x="870" y="230" width="340" height="142" rx="12" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1040" y="287.5" text-anchor="middle">Data Formats</text>
  <text class="nodeBody" x="1040" y="321.5" text-anchor="middle">CSV</text>
  <text class="nodeBody" x="1040" y="344.5" text-anchor="middle">NDJSON, GraphML</text>
</g>
<g id="uses">
  <rect x="1300" y="230" width="360" height="142" rx="12" fill="#4C1D95" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1480" y="287.5" text-anchor="middle">Operational Uses</text>
  <text class="nodeBody" x="1480" y="321.5" text-anchor="middle">migration, snapshots</text>
  <text class="nodeBody" x="1480" y="344.5" text-anchor="middle">analytics, reproducible tests</text>
</g>
<g id="bench">
  <rect x="480" y="500" width="360" height="142" rx="12" fill="#134E4A" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="660" y="557.5" text-anchor="middle">Benchmark Gate</text>
  <text class="nodeBody" x="660" y="591.5" text-anchor="middle">mean latency numbers</text>
  <text class="nodeBody" x="660" y="614.5" text-anchor="middle">read caveats before claims</text>
</g>
<g id="decorators">
  <rect x="870" y="500" width="340" height="142" rx="12" fill="#7C2D12" stroke="#64748B" stroke-width="2"/>
  <text class="nodeTitle" x="1040" y="557.5" text-anchor="middle">I/O Decorators</text>
  <text class="nodeBody" x="1040" y="591.5" text-anchor="middle">OkIO, buffering</text>
  <text class="nodeBody" x="1040" y="614.5" text-anchor="middle">compression, async paths</text>
</g>
<rect x="88" y="724" width="1624" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="900" y="749" text-anchor="middle">CSV is easy to inspect, NDJSON fits service interchange, GraphML helps interoperability.</text>
<text class="footer" x="900" y="773" text-anchor="middle">Benchmark charts summarize current files; they are not a promise for every graph shape.</text>
</svg>
