<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-label="StorageService 프로필 전환 구조">
  <defs>
    <style>
      .title{font-family:'goorm Sans',cursive;font-size:34px;fill:#f8fafc}
      .subtitle,.body,.small{font-family:'goorm Sans Code',monospace;fill:#cbd5e1}
      .subtitle{font-size:15px}.label{font-family:'goorm Sans',cursive;font-size:22px;fill:#f8fafc}
      .body{font-size:14px}.small{font-size:12px}
      .panel{fill:#111827;stroke:#334155;stroke-width:1.4;rx:18}.card{stroke-width:1.6;rx:16}
      .arrow{fill:none;stroke:#94a3b8;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 14 14" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1160" height="720" fill="#0b1220"/>
  <text class="title" x="54" y="70">StorageService 프로필 전환</text>
  <text class="subtitle" x="56" y="104">애플리케이션 코드는 하나의 계약을 유지하고 Spring 프로필이 로컬 파일, S3, 사전 서명 URL 동작을 전환합니다.</text>
  <rect class="panel" x="54" y="136" width="1052" height="520"/>

  <rect class="card" x="360" y="174" width="440" height="84" fill="#123a43" stroke="#22d3ee"/>
  <text class="label" x="580" y="208" text-anchor="middle">애플리케이션 코드</text>
  <text class="body" x="580" y="234" text-anchor="middle">StorageService만 사용하며 활성 백엔드를 알지 못함</text>

  <rect class="card" x="260" y="318" width="640" height="92" fill="#453511" stroke="#fbbf24"/>
  <text class="label" x="580" y="352" text-anchor="middle">StorageService</text>
  <text class="body" x="580" y="379" text-anchor="middle">upload / download / getUrl / delete</text>

  <rect class="card" x="108" y="500" width="260" height="96" fill="#1f2937" stroke="#64748b"/>
  <text class="label" x="238" y="536" text-anchor="middle">local 프로필</text>
  <text class="body" x="238" y="566" text-anchor="middle">LocalStorageService</text>
  <text class="small" x="238" y="588" text-anchor="middle">java.nio.file.Files, Docker 불필요</text>

  <rect class="card" x="450" y="500" width="260" height="96" fill="#12344a" stroke="#38bdf8"/>
  <text class="label" x="580" y="536" text-anchor="middle">s3 프로필</text>
  <text class="body" x="580" y="566" text-anchor="middle">S3StorageService</text>
  <text class="small" x="580" y="588" text-anchor="middle">Floci 기반 S3Client</text>

  <rect class="card" x="792" y="500" width="260" height="96" fill="#163a2d" stroke="#4ade80"/>
  <text class="label" x="922" y="536" text-anchor="middle">s3-presigned 프로필</text>
  <text class="body" x="922" y="566" text-anchor="middle">S3PresignedStorageService</text>
  <text class="small" x="922" y="588" text-anchor="middle">S3Presigner, X-Amz-Expires</text>

  <polyline class="arrow" points="580,258 580,318"/>
  <polyline class="arrow" points="580,410 580,450 238,450 238,500"/>
  <polyline class="arrow" points="580,410 580,500"/>
  <polyline class="arrow" points="580,410 580,450 922,450 922,500"/>
  <path class="connector" d="M2 2 L3 2" fill="none" stroke="transparent"/>
</svg>