<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Language-specific tokenizer branches</title>
  <desc id="desc">Raw service text is validated, routed by language detection, and then sent to Korean tokenizer, Japanese tokenizer, or generic normalization paths.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#15314d" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#2f6eea" stroke="#2f6eea"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#20a66a" stroke="#20a66a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#7a52d8" stroke="#7a52d8"/>
    </marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="58%" stop-color="#eef7f3"/>
      <stop offset="100%" stop-color="#fff7ec"/>
    </linearGradient>
    <style>
      .canvas { fill: url(#canvas); }
      .title { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", cursive; fill: #18314f; font-size: 38px; font-weight: 700; letter-spacing: 0; }
      .subtitle { font-family: "Comic Mono", "Menlo", monospace; fill: #4e647e; font-size: 18px; letter-spacing: 0; }
      .card { filter: url(#shadow); }
      .card-bg { stroke-width: 2.5; rx: 22; }
      .card-title { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", cursive; fill: #16263c; font-size: 25px; font-weight: 700; letter-spacing: 0; }
      .card-sub { font-family: "Comic Mono", "Menlo", monospace; fill: #344b66; font-size: 16px; letter-spacing: 0; }
      .tag { font-family: "Comic Mono", "Menlo", monospace; fill: #1d3a59; font-size: 14px; letter-spacing: 0; }
      .small { font-family: "Comic Mono", "Menlo", monospace; fill: #536a83; font-size: 13px; letter-spacing: 0; }
      .line-blue { fill: none; stroke: #2f6eea; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .line-green { fill: none; stroke: #20a66a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .line-purple { fill: none; stroke: #7a52d8; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
      .guide { fill: #ffffff; stroke: #d9e5ef; stroke-width: 2; rx: 18; }
    </style>
  </defs>

  <rect class="canvas" width="1440" height="760"/>
  <text class="title" x="72" y="70">Language-specific tokenizer branches</text>
  <text class="subtitle" x="74" y="106">Validate first, detect language once, then choose the smallest useful text path.</text>

  <g class="card" transform="translate(70 282)">
    <rect class="card-bg" width="190" height="120" fill="#ffffff" stroke="#bfd2ea"/>
    <text class="card-title" x="28" y="42">Raw input</text>
    <text class="card-sub" x="28" y="72">user text</text>
    <text class="small" x="28" y="96">search, report, chat</text>
  </g>

  <g class="card" transform="translate(316 260)">
    <rect class="card-bg" width="210" height="164" fill="#fff6e7" stroke="#e3b96f"/>
    <text class="card-title" x="26" y="42">Boundary</text>
    <text class="card-sub" x="26" y="72">blank / size check</text>
    <rect class="guide" x="24" y="96" width="162" height="38"/>
    <text class="tag" x="42" y="120">400 or 413</text>
  </g>

  <g class="card" transform="translate(590 260)">
    <rect class="card-bg" width="230" height="164" fill="#edf7ff" stroke="#8fb7e9"/>
    <text class="card-title" x="28" y="42">Lingua detector</text>
    <text class="card-sub" x="28" y="72">shared instance</text>
    <rect class="guide" x="26" y="96" width="178" height="38"/>
    <text class="tag" x="43" y="120">Set&lt;Language&gt;</text>
  </g>

  <g class="card" transform="translate(928 96)">
    <rect class="card-bg" width="360" height="138" fill="#eefaf2" stroke="#8ed3a9"/>
    <text class="card-title" x="28" y="42">Korean tokenizer</text>
    <text class="card-sub" x="28" y="72">normalize, tokenize, stem</text>
    <text class="small" x="28" y="104">phrases, sentences, blockword mask</text>
  </g>

  <g class="card" transform="translate(928 282)">
    <rect class="card-bg" width="360" height="138" fill="#f1edff" stroke="#baa7ee"/>
    <text class="card-title" x="28" y="42">Japanese tokenizer</text>
    <text class="card-sub" x="28" y="72">Kuromoji IPAdic</text>
    <text class="small" x="28" y="104">noun filter, blockword mask</text>
  </g>

  <g class="card" transform="translate(928 468)">
    <rect class="card-bg" width="360" height="138" fill="#fff7eb" stroke="#e2bd7a"/>
    <text class="card-title" x="28" y="42">Generic path</text>
    <text class="card-sub" x="28" y="72">normalize, route, fallback</text>
    <text class="small" x="28" y="104">keep unknown input explicit</text>
  </g>

  <g transform="translate(910 650)">
    <rect width="448" height="54" fill="#ffffff" stroke="#cdd9e8" stroke-width="2" rx="18"/>
    <text class="small" x="28" y="33">Outputs stay explicit: tokens, nouns, language sets, fallback.</text>
  </g>

  <path class="line-blue" d="M 260 342 H 304"/>
  <path class="line-blue" d="M 526 342 H 578"/>
  <path class="line-green" d="M 820 342 H 866 Q 888 342 888 320 V 187 Q 888 165 910 165 H 916"/>
  <path class="line-purple" d="M 820 342 H 916"/>
  <path class="line-green" d="M 820 342 H 866 Q 888 342 888 364 V 515 Q 888 537 910 537 H 916"/>

  <text class="small" x="852" y="305">KOREAN</text>
  <text class="small" x="842" y="333">JAPANESE</text>
  <text class="small" x="852" y="391">UNKNOWN</text>
</svg>
