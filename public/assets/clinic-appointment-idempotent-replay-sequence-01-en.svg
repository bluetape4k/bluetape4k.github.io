      .call-label{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:12px;fill:#e7f0fb}
      .pill{fill:#0d1b2f;stroke-width:1.5}
      .pill-number{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:12px;font-weight:800;fill:#f8fbff}
