      .outcome-body{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:14px;fill:#b7c7da}
      .ui-eyebrow,.ui-label,.ui-mono,.ui-button{font-family:"Comic Mono", "SFMono-Regular", monospace}
      .ui-title,.ui-section,.ui-value,.ui-card-title{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-weight:800;fill:#f4f8ff}
