    </style>
  </defs>
<rect width="1880" height="2300" fill="url(#canvas)"/><rect class="frame" x="24" y="24" width="1832" height="2252" rx="32" fill="none" stroke="#2d4665" stroke-width="2"/>
<text class="title" x="64" y="76" >Retries and replay must change an appointment only once</text><text class="subtitle" x="66" y="108" >Connect HTTP idempotency, inbox deduplication, and quarantine replay to one outcome decision.</text><rect x="72" y="126" width="350" height="36" rx="18" fill="#12243a" stroke="#3a5877"/><text class="badge" x="247" y="150" text-anchor="middle">SCOPE / tenant + clinic</text>
<rect x="452" y="126" width="350" height="36" rx="18" fill="#12243a" stroke="#3a5877"/><text class="badge" x="627" y="150" text-anchor="middle">IDENTITY / commandId + requestId</text>
<rect x="832" y="126" width="350" height="36" rx="18" fill="#12243a" stroke="#3a5877"/><text class="badge" x="1007" y="150" text-anchor="middle">DATA / synthetic mockup</text><rect class="phase" x="42" y="328" width="1796" height="540" rx="24"/><rect x="1380" y="342" width="420" height="30" rx="15" fill="#102239" stroke="#38506d"/><text class="phase-label" x="1590" y="363" text-anchor="middle">First request and HTTP retry</text>
<rect class="phase" x="42" y="908" width="1796" height="520" rx="24"/><rect x="1380" y="922" width="420" height="30" rx="15" fill="#102239" stroke="#38506d"/><text class="phase-label" x="1590" y="943" text-anchor="middle">Relay redelivery and consumer duplicate</text>
<rect class="phase" x="42" y="1468" width="1796" height="430" rx="24"/><rect x="1380" y="1482" width="420" height="30" rx="15" fill="#102239" stroke="#38506d"/><text class="phase-label" x="1590" y="1503" text-anchor="middle">Quarantine replay and final outcome</text><g id="caller" data-node="true"><rect id="caller-card" x="25" y="190" width="290" height="104" rx="20" fill="#112139" stroke="#60a5fa" stroke-width="2"/><text class="participant" x="170" y="232" text-anchor="middle">Caller</text><text class="role" x="170" y="262" text-anchor="middle">client / retry</text></g>
<g id="api" data-node="true"><rect id="api-card" x="405" y="190" width="290" height="104" rx="20" fill="#112139" stroke="#2dd4bf" stroke-width="2"/><text class="participant" x="550" y="232" text-anchor="middle">Appointment API</text><text class="role" x="550" y="262" text-anchor="middle">HTTP boundary</text></g>
<g id="transaction" data-node="true"><rect id="transaction-card" x="785" y="190" width="290" height="104" rx="20" fill="#112139" stroke="#a78bfa" stroke-width="2"/><text class="participant" x="930" y="232" text-anchor="middle">Appointment tx</text><text class="role" x="930" y="262" text-anchor="middle">aggregate + outbox</text></g>
<g id="consumer" data-node="true"><rect id="consumer-card" x="1165" y="190" width="290" height="104" rx="20" fill="#112139" stroke="#fbbf24" stroke-width="2"/><text class="participant" x="1310" y="232" text-anchor="middle">Consumer runtime</text><text class="role" x="1310" y="262" text-anchor="middle">inbox + handler</text></g>
<g id="replay" data-node="true"><rect id="replay-card" x="1545" y="190" width="290" height="104" rx="20" fill="#112139" stroke="#fb7185" stroke-width="2"/><text class="participant" x="1690" y="232" text-anchor="middle">STAFF replay</text><text class="role" x="1690" y="262" text-anchor="middle">approval + audit</text></g><path class="lifeline" d="M170 294 V1810"/>
<path class="lifeline" d="M550 294 V1810"/>
<path class="lifeline" d="M930 294 V1810"/>
<path class="lifeline" d="M1310 294 V1810"/>
<path class="lifeline" d="M1690 294 V1810"/><rect class="activation" x="920" y="390" width="20" height="1410" rx="8"/><rect class="activation" x="1300" y="950" width="20" height="470" rx="8"/><g class="sequence-message"><rect class="pill" x="207.85000000000002" y="370" width="304.29999999999995" height="42" rx="21" stroke="#60a5fa"/><circle cx="228.85000000000002" cy="391" r="14" fill="#60a5fa" fill-opacity=".18" stroke="#60a5fa"/><text class="pill-number num" x="228.85000000000002" y="395" text-anchor="middle">1</text><text class="call-label" x="252.85000000000002" y="396">send commandId and request body</text></g><g data-from="caller" data-to="api"><path class="call" d="M170 430 H550" stroke="#60a5fa" marker-end="url(#sequence-blue-arrow)" data-connector="message-1" data-source-node="caller" data-target-node="api"/></g>
<g class="sequence-message"><rect class="pill" x="576.9" y="510" width="326.2" height="42" rx="21" stroke="#2dd4bf"/><circle cx="597.9" cy="531" r="14" fill="#2dd4bf" fill-opacity=".18" stroke="#2dd4bf"/><text class="pill-number num" x="597.9" y="535" text-anchor="middle">2</text><text class="call-label" x="621.9" y="536">check fingerprint and bounded wait</text></g><g data-from="api" data-to="transaction"><path class="call" d="M550 570 H930" stroke="#2dd4bf" marker-end="url(#sequence-cyan-arrow)" data-connector="message-2" data-source-node="api" data-target-node="transaction"/></g>
<g class="sequence-message"><rect class="pill" x="880.25" y="650" width="479.5" height="42" rx="21" stroke="#60a5fa"/><circle cx="901.25" cy="671" r="14" fill="#60a5fa" fill-opacity=".18" stroke="#60a5fa"/><text class="pill-number num" x="901.25" y="675" text-anchor="middle">3</text><text class="call-label" x="925.25" y="676">commit appointment change and outbox in one transaction</text></g><g data-from="transaction" data-to="consumer"><path class="call" d="M930 710 H1310" stroke="#60a5fa" marker-end="url(#sequence-blue-arrow)" data-connector="message-3" data-source-node="transaction" data-target-node="consumer"/></g>
<g class="sequence-message"><rect class="pill" x="544.05" y="790" width="391.9" height="42" rx="21" stroke="#fbbf24"/><circle cx="565.05" cy="811" r="14" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/><text class="pill-number num" x="565.05" y="815" text-anchor="middle">4</text><text class="call-label" x="589.05" y="816">same commandId retry → replay stored result</text></g><g data-from="api" data-to="transaction"><path class="call" d="M550 850 H930" stroke="#fbbf24" marker-end="url(#sequence-amber-arrow)" data-connector="message-4" data-source-node="api" data-target-node="transaction"/></g>
<g class="sequence-message"><rect class="pill" x="894.85" y="930" width="450.3" height="42" rx="21" stroke="#a78bfa"/><circle cx="915.85" cy="951" r="14" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa"/><text class="pill-number num" x="915.85" y="955" text-anchor="middle">5</text><text class="call-label" x="939.85" y="956">event redelivery → begin inbox by logicalConsumerId</text></g><g data-from="transaction" data-to="consumer"><path class="call" d="M930 990 H1310" stroke="#a78bfa" marker-end="url(#sequence-purple-arrow)" data-connector="message-5" data-source-node="transaction" data-target-node="consumer"/></g>
<g class="sequence-message"><rect class="pill" x="1274.85" y="1070" width="450.3" height="42" rx="21" stroke="#2dd4bf"/><circle cx="1295.85" cy="1091" r="14" fill="#2dd4bf" fill-opacity=".18" stroke="#2dd4bf"/><text class="pill-number num" x="1295.85" y="1095" text-anchor="middle">6</text><text class="call-label" x="1319.85" y="1096">if already PROCESSED, skip handler and side effects</text></g><g data-from="consumer" data-to="replay"><path class="call" d="M1310 1130 H1690" stroke="#2dd4bf" marker-end="url(#sequence-cyan-arrow)" data-connector="message-6" data-source-node="consumer" data-target-node="replay"/></g>
<g class="sequence-message"><rect class="pill" x="1231.05" y="1210" width="537.9" height="42" rx="21" stroke="#fb7185"/><circle cx="1252.05" cy="1231" r="14" fill="#fb7185" fill-opacity=".18" stroke="#fb7185"/><text class="pill-number num" x="1252.05" y="1235" text-anchor="middle">7</text><text class="call-label" x="1276.05" y="1236">failure becomes RETRYABLE → QUARANTINED after the attempt limit</text></g><g data-from="consumer" data-to="replay"><path class="call" d="M1310 1270 H1690" stroke="#fb7185" marker-end="url(#sequence-red-arrow)" data-connector="message-7" data-source-node="consumer" data-target-node="replay"/></g>
<g class="sequence-message"><rect class="pill" x="1242" y="1350" width="516" height="42" rx="21" stroke="#fbbf24"/><circle cx="1263" cy="1371" r="14" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24"/><text class="pill-number num" x="1263" y="1375" text-anchor="middle">8</text><text class="call-label" x="1287" y="1376">approve replay after requestId, scope, and provenance checks</text></g><g data-from="replay" data-to="consumer"><path class="call" d="M1690 1410 H1730 Q1748 1410 1748 1428 V1442 Q1748 1458 1732 1458 H1268 Q1252 1458 1252 1442 V1428 Q1252 1410 1270 1410 H1310" stroke="#fbbf24" marker-end="url(#sequence-amber-arrow)" data-connector="message-8" data-source-node="replay" data-target-node="consumer"/></g>
<g class="sequence-message"><rect class="pill" x="1252.95" y="1490" width="494.09999999999997" height="42" rx="21" stroke="#a78bfa"/><circle cx="1273.95" cy="1511" r="14" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa"/><text class="pill-number num" x="1273.95" y="1515" text-anchor="middle">9</text><text class="call-label" x="1297.95" y="1516">redrive the quarantine row with the same logical identity</text></g><g data-from="replay" data-to="consumer"><path class="call" d="M1690 1550 H1730 Q1748 1550 1748 1568 V1582 Q1748 1598 1732 1598 H1268 Q1252 1598 1252 1582 V1568 Q1252 1550 1270 1550 H1310" stroke="#a78bfa" marker-end="url(#sequence-purple-arrow)" data-connector="message-9" data-source-node="replay" data-target-node="consumer"/></g>
<g class="sequence-message"><rect class="pill" x="1263.9" y="1630" width="472.2" height="42" rx="21" stroke="#2dd4bf"/><circle cx="1284.9" cy="1651" r="14" fill="#2dd4bf" fill-opacity=".18" stroke="#2dd4bf"/><text class="pill-number num" x="1284.9" y="1655" text-anchor="middle">10</text><text class="call-label" x="1308.9" y="1656">record PROCESSED, DUPLICATE, RETRYABLE, or QUARANTINED</text></g><g data-from="consumer" data-to="replay"><path class="call" d="M1310 1690 H1690" stroke="#2dd4bf" marker-end="url(#sequence-cyan-arrow)" data-connector="message-10" data-source-node="consumer" data-target-node="replay"/></g>
<g id="final-decision" data-node="true"><rect id="final-decision-card" class="decision" x="560" y="1750" width="740" height="150" rx="24"/><text class="decision-title" x="930" y="1800" text-anchor="middle">Final State Decision</text><text class="decision-body" x="930" y="1835" text-anchor="middle"><tspan x="930" dy="0">For each command, logical consumer, and replay scope,</tspan><tspan x="930" dy="23">persist the state and next action as one outcome.</tspan></text></g><path class="call" d="M846 1910 V1912 Q846 1930 864 1930 H250 Q268 1930 268 1948 V2080" stroke="#2dd4bf" marker-end="url(#sequence-cyan-arrow)" data-connector="decision-outcome-0" data-source-node="final-decision" data-target-node="outcome-0"/>
<path class="call" d="M930 1910 V1928 Q930 1946 948 1946 H692 Q710 1946 710 1964 V2080" stroke="#60a5fa" marker-end="url(#sequence-blue-arrow)" data-connector="decision-outcome-1" data-source-node="final-decision" data-target-node="outcome-1"/>
<path class="call" d="M1014 1910 V1944 Q1014 1962 1032 1962 H1134 Q1152 1962 1152 1980 V2080" stroke="#fbbf24" marker-end="url(#sequence-amber-arrow)" data-connector="decision-outcome-2" data-source-node="final-decision" data-target-node="outcome-2"/><g id="outcome-0" data-node="true"><rect id="outcome-0-card" x="68" y="2080" width="400" height="132" rx="20" fill="#101f34" stroke="#2dd4bf" stroke-width="2"/><text class="outcome-code" x="268" y="2123" text-anchor="middle">PROCESSED</text><text class="outcome-body" x="268" y="2157" text-anchor="middle">appointment change and side effect complete</text><text class="role" x="268" y="2185" text-anchor="middle">visible in action queue</text></g>
<g id="outcome-1" data-node="true"><rect id="outcome-1-card" x="510" y="2080" width="400" height="132" rx="20" fill="#101f34" stroke="#60a5fa" stroke-width="2"/><text class="outcome-code" x="710" y="2123" text-anchor="middle">DUPLICATE</text><text class="outcome-body" x="710" y="2157" text-anchor="middle">reuse prior result · no second change</text><text class="role" x="710" y="2185" text-anchor="middle">visible in action queue</text></g>
<g id="outcome-2" data-node="true"><rect id="outcome-2-card" x="952" y="2080" width="400" height="132" rx="20" fill="#101f34" stroke="#fbbf24" stroke-width="2"/><text class="outcome-code" x="1152" y="2123" text-anchor="middle">RETRYABLE / QUARANTINED</text><text class="outcome-body" x="1152" y="2157" text-anchor="middle">next attempt or STAFF review</text><text class="role" x="1152" y="2185" text-anchor="middle">visible in action queue</text></g>
<text class="role" x="64" y="2240" >Solid lines are explicit record and call paths. Every outcome branch leaves the final state decision independently.</text>
</svg>
