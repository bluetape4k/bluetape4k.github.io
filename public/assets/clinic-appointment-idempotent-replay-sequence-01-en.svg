      .participant{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:18px;font-weight:800;fill:#f4f8ff}
      .role{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:13px;fill:#9fb3cb}
      .lifeline{stroke:#304964;stroke-width:2;stroke-dasharray:7 9}
      .activation{fill:#182c43;stroke:#50708e;stroke-width:1.5}
      .phase{fill:#0b192c;stroke:#263d59;stroke-width:1.5}
      .phase-label{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:13px;font-weight:800;fill:#7fc9ff}
