<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">예약 제어 플레인 권한 지도</title>
  <desc id="desc">클라이언트 요청은 예약 HTTP API와 node-local bulkhead를 지난다. Redis 세마포어와 suppression lock은 보조 제어다. PostgreSQL은 idempotency, capacity, hold, waitlist offer, audit, notification outbox 상태의 최종 권한을 가진다. Expiry와 notification worker도 PostgreSQL을 기준으로 동작한다.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.58" stop-color="#0c1730"/>
      <stop offset="1" stop-color="#10142a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15233a"/>
      <stop offset="1" stop-color="#101a2d"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5f9fc4" stroke="#5f9fc4" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c99a58" stroke="#c99a58" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5ab3aa" stroke="#5ab3aa" stroke-dasharray="none"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#88a86b" stroke="#88a86b" stroke-dasharray="none"/>
    </marker>
    <style>
      .outer { fill: none; stroke: #2b4168; stroke-width: 2; }
      .lane { fill: #0f172a; fill-opacity: 0.22; stroke: #435773; stroke-width: 2; }
      .authority { fill: #122335; stroke: #88a86b; stroke-width: 3; filter: url(#shadow); }
      .card { fill: url(#panel); stroke: #5b789d; stroke-width: 2.2; filter: url(#shadow); }
      .card-blue { stroke: #5f9fc4; }
      .card-purple { stroke: #9b83c9; }
      .card-amber { stroke: #c99a58; }
      .card-green { stroke: #88a86b; }
      .card-teal { stroke: #5ab3aa; }
      .title { font: 48px "goorm Sans", sans-serif; fill: #f8fafc; }
      .subtitle { font: 20px "goorm Sans Code", "goorm Sans", ui-monospace, monospace; fill: #a9b8d4; }
      .laneTitle { font: 26px "goorm Sans", sans-serif; fill: #e6edf7; }
      .cardTitle { font: 22px "goorm Sans", sans-serif; fill: #f8fafc; }
      .detail { font: 15px "goorm Sans Code", "goorm Sans", ui-monospace, monospace; fill: #b7c5da; }
      .small { font: 14px "goorm Sans Code", "goorm Sans", ui-monospace, monospace; fill: #cbd7e8; }
      .legend { font: 15px "goorm Sans Code", "goorm Sans", ui-monospace, monospace; fill: #dce7f5; }
      .required { fill: none; stroke: #5f9fc4; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .advisory { fill: none; stroke: #c99a58; stroke-width: 3; stroke-dasharray: 11 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
      .fallback { fill: none; stroke: #5ab3aa; stroke-width: 3; stroke-dasharray: 9 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-teal); }
      .worker { fill: none; stroke: #88a86b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .labelPill { fill: #101b30; stroke-width: 1.5; }
      .labelText { font: 14px "goorm Sans Code", "goorm Sans", ui-monospace, monospace; font-weight: 700; }
    </style>
  </defs>

  <rect width="1920" height="1200" rx="34" fill="url(#canvas)"/>
  <rect class="outer" x="28" y="26" width="1864" height="1148" rx="30"/>
  <text class="title" x="960" y="82" text-anchor="middle">예약 정합성의 최종 권한은 하나다</text>
  <text class="subtitle" x="960" y="120" text-anchor="middle">Redis는 경합을 줄이고 PostgreSQL은 영속 수량, 상태, 소유권, 재생 응답을 결정한다</text>

  <rect class="lane" x="68" y="170" width="340" height="780" rx="22"/>
  <text class="laneTitle" x="98" y="215">요청 진입 경계</text>

  <rect class="lane" x="458" y="170" width="420" height="780" rx="22"/>
  <text class="laneTitle" x="488" y="215">실행 보호 장치</text>

  <rect class="authority" x="928" y="170" width="570" height="780" rx="24"/>
  <text class="laneTitle" x="958" y="215">PostgreSQL 최종 권한</text>
  <text class="detail" x="958" y="246">영속 결과를 결정하는 하나의 트랜잭션 경계</text>

  <rect class="lane" x="1548" y="170" width="304" height="780" rx="22"/>
  <text class="laneTitle" x="1578" y="215">백그라운드 작업</text>

  <g id="clients">
    <rect class="card card-blue" x="108" y="290" width="260" height="132" rx="18"/>
    <text class="cardTitle" x="238" y="335" text-anchor="middle">클라이언트</text>
    <text class="detail" x="238" y="370" text-anchor="middle">Alice · Bob</text>
    <text class="detail" x="238" y="397" text-anchor="middle">Idempotency-Key · Owner</text>
  </g>

  <g id="http-api">
    <rect class="card card-blue" x="108" y="600" width="260" height="150" rx="18"/>
    <text class="cardTitle" x="238" y="647" text-anchor="middle">예약 HTTP API</text>
    <text class="detail" x="238" y="682" text-anchor="middle">임시 예약 · 취소 · 대기 목록</text>
    <text class="detail" x="238" y="710" text-anchor="middle">제안 수락</text>
  </g>

  <g id="local-bulkhead">
    <rect class="card card-purple" x="508" y="270" width="320" height="126" rx="18"/>
    <text class="cardTitle" x="668" y="316" text-anchor="middle">노드 로컬 벌크헤드</text>
    <text class="detail" x="668" y="351" text-anchor="middle">JDBC 동시성 보호</text>
    <text class="detail" x="668" y="378" text-anchor="middle">항상 먼저 평가</text>
  </g>

  <g id="redis-semaphore">
    <rect class="card card-amber" x="508" y="470" width="320" height="130" rx="18"/>
    <text class="cardTitle" x="668" y="515" text-anchor="middle">Redis 세마포어</text>
    <text class="detail" x="668" y="550" text-anchor="middle">보조 진입 제어</text>
    <text class="detail" x="668" y="578" text-anchor="middle">정상일 때 부하 차단</text>
  </g>

  <g id="redis-suppression">
    <rect class="card card-amber" x="508" y="680" width="320" height="130" rx="18"/>
    <text class="cardTitle" x="668" y="725" text-anchor="middle">Redis 중복 억제 잠금</text>
    <text class="detail" x="668" y="760" text-anchor="middle">짧은 실행 중 리스</text>
    <text class="detail" x="668" y="788" text-anchor="middle">명령 결과는 저장하지 않음</text>
  </g>

  <g id="idempotency">
    <rect class="card card-green" x="978" y="290" width="470" height="124" rx="18"/>
    <text class="cardTitle" x="1213" y="335" text-anchor="middle">HTTP 멱등성</text>
    <text class="detail" x="1213" y="369" text-anchor="middle">New · Takeover · Replay · Conflict · InProgress</text>
    <text class="detail" x="1213" y="395" text-anchor="middle">변경과 재생 응답 본문을 함께 커밋</text>
  </g>

  <g id="capacity-holds">
    <rect class="card card-green" x="978" y="475" width="220" height="150" rx="18"/>
    <text class="cardTitle" x="1088" y="520" text-anchor="middle">예약 수량 + 임시 예약</text>
    <text class="detail" x="1088" y="555" text-anchor="middle">상태 + 리비전 CAS</text>
    <text class="detail" x="1088" y="583" text-anchor="middle">occupied &lt; capacity</text>
    <text class="detail" x="1088" y="609" text-anchor="middle">소유자 + 만료 시각</text>
  </g>

  <g id="waitlist-offers">
    <rect class="card card-green" x="1228" y="475" width="220" height="150" rx="18"/>
    <text class="cardTitle" x="1338" y="520" text-anchor="middle">대기 목록 + 제안</text>
    <text class="detail" x="1338" y="555" text-anchor="middle">FIFO 순서</text>
    <text class="detail" x="1338" y="583" text-anchor="middle">소유자 + 리비전</text>
    <text class="detail" x="1338" y="609" text-anchor="middle">ACTIVE + 만료 시각</text>
  </g>

  <g id="audit-outbox">
    <rect class="card card-teal" x="978" y="700" width="470" height="140" rx="18"/>
    <text class="cardTitle" x="1213" y="746" text-anchor="middle">감사 + 알림 아웃박스</text>
    <text class="detail" x="1213" y="781" text-anchor="middle">안정적인 전송 ID · 작업자 선점 리스</text>
    <text class="detail" x="1213" y="809" text-anchor="middle">제한된 재시도 · 프로세스 중단 복구</text>
  </g>

  <g id="expiry-sweeper">
    <rect class="card card-amber" x="1590" y="350" width="220" height="150" rx="18"/>
    <text class="cardTitle" x="1700" y="397" text-anchor="middle">만료 정리 작업자</text>
    <text class="detail" x="1700" y="432" text-anchor="middle">제한된 배치</text>
    <text class="detail" x="1700" y="460" text-anchor="middle">자원 우선 잠금</text>
    <text class="detail" x="1700" y="486" text-anchor="middle">임시 예약 / 제안 만료</text>
  </g>

  <g id="notification-worker">
    <rect class="card card-teal" x="1590" y="650" width="220" height="150" rx="18"/>
    <text class="cardTitle" x="1700" y="697" text-anchor="middle">알림 작업자</text>
    <text class="detail" x="1700" y="732" text-anchor="middle">전송 작업 선점</text>
    <text class="detail" x="1700" y="760" text-anchor="middle">send · retry</text>
    <text class="detail" x="1700" y="786" text-anchor="middle">프로세스 중단 후 복구</text>
  </g>

  <path class="required" data-connector="clients-to-api" d="M 238 422 L 238 600"/>
  <path class="required" data-connector="api-to-local" d="M 368 675 L 438 675 Q 448 675 448 665 L 448 343 Q 448 333 458 333 L 508 333"/>
  <path class="required" data-connector="local-to-postgres" d="M 828 333 L 978 333"/>

  <path class="advisory" data-connector="local-to-redis-semaphore" d="M 668 396 L 668 470"/>
  <path class="advisory" data-connector="semaphore-to-suppression" d="M 668 600 L 668 680"/>
  <path class="advisory" data-connector="suppression-to-idempotency" d="M 828 745 L 918 745 Q 928 745 928 735 L 928 413 Q 928 403 938 403 L 978 403"/>
  <path class="fallback" data-connector="redis-fallback-to-postgres" d="M 828 535 L 878 535 Q 888 535 888 525 L 888 373 Q 888 363 898 363 L 978 363"/>

  <path class="worker" data-connector="sweeper-to-capacity" d="M 1590 425 L 1530 425 Q 1520 425 1520 435 L 1520 550 Q 1520 560 1510 560 L 1448 560"/>
  <path class="worker" data-connector="outbox-to-notification-worker" d="M 1448 770 L 1590 770"/>

  <g data-relationship-label="required-path">
    <rect class="labelPill" x="832" y="286" width="142" height="32" rx="16" stroke="#5f9fc4"/>
    <text class="labelText" x="903" y="307" text-anchor="middle" fill="#a8d6ee">필수 경로</text>
  </g>
  <g data-relationship-label="local-fallback">
    <rect class="labelPill" x="840" y="495" width="132" height="32" rx="16" stroke="#5ab3aa"/>
    <text class="labelText" x="906" y="516" text-anchor="middle" fill="#a9e4df">장애 시 우회</text>
  </g>

  <g id="legend">
    <rect x="190" y="1000" width="1540" height="120" rx="20" fill="#141f32" stroke="#536377" stroke-width="2"/>
    <text class="laneTitle" x="240" y="1044">범례</text>
    <path d="M 390 1037 H 500" class="required"/>
    <text class="legend" x="525" y="1043">필수 요청 경로</text>
    <path d="M 790 1037 H 900" class="advisory"/>
    <text class="legend" x="925" y="1043">보조 Redis 경로</text>
    <path d="M 1210 1037 H 1320" class="fallback"/>
    <text class="legend" x="1345" y="1043">Redis 오류 시 DB 경로 유지</text>
    <text class="small" x="960" y="1090" text-anchor="middle">커밋된 PostgreSQL 트랜잭션만 영속 예약 수량과 재생 상태를 바꿀 수 있다.</text>
  </g>
</svg>
