<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="804" viewBox="0 0 1320 804" role="img" aria-labelledby="title desc">
<title id="title">Lettuce Near Cache Benchmark Summary</title>
<desc id="desc">Throughput is ops/ms. Higher is better. L1 reads are intentionally shown on a separate scale.</desc>
<defs>
