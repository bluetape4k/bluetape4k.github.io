<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 10 10">
    <path d="M 0 0 L 10 5 L 0 10 Z" fill="#60A5FA"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0F172A;stroke:#334155;stroke-width:2}
    .title{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:42px;fill:#F8FAFC;font-weight:400}
    .subtitle,.footer,.axis{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:17px;fill:#CBD5E1;font-weight:400}
    .nodeTitle,.participant{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:16px;fill:#E2E8F0;font-weight:400}
    .tableTitle{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#F8FAFC;font-weight:400}
    .tableField,.edgeLabel{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:15px;fill:#E2E8F0;font-weight:400}
    .edge{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#64748B;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1600" height="780"/>
<rect class="frame" x="34" y="28" width="1532" height="724" rx="24"/>
<text class="title" x="800" y="82" text-anchor="middle">지식 그래프 엔터티 관계</text>
<text class="subtitle" x="800" y="118" text-anchor="middle">문서는 엔터티를 언급하고 엔터티는 개념과 다른 엔터티에 연결된다</text>
<g>
  <path class="edge" data-connector="document-to-entity" d="M420 437 L497 437 Q515 437 515 419 L515 345 Q515 327 533 327 L610 327"/>
  <rect x="455" y="355" width="120" height="28" rx="8" fill="#0F172A" stroke="#334155"/>
  <text class="edgeLabel" x="515" y="374" text-anchor="middle">MENTIONS</text>
</g>
<g>
  <path class="edge" data-connector="entity-to-concept" d="M900 311 L1090 311"/>
  <rect x="929" y="284" width="120" height="28" rx="8" fill="#0F172A" stroke="#334155"/>
  <text class="edgeLabel" x="989" y="303" text-anchor="middle">IS_A</text>
</g>
<g>
  <path class="edge" data-connector="entity-to-related" d="M900 345 L983 345 Q1001 345 1001 363 L1001 519 Q1001 537 1019 537 L1090 537"/>
  <rect x="941" y="414" width="120" height="28" rx="8" fill="#0F172A" stroke="#334155"/>
  <text class="edgeLabel" x="1001" y="433" text-anchor="middle">RELATED_TO</text>
</g>
<g id="document">
  <rect x="130" y="349" width="290" height="176" rx="8" fill="#0C4A6E" stroke="#64748B" stroke-width="2"/>
  <rect x="130" y="349" width="290" height="48" rx="8" fill="#0F172A" fill-opacity="0.58" stroke="#64748B" stroke-width="2"/>
  <line x1="130" y1="397" x2="420" y2="397" stroke="#64748B" stroke-width="2"/>
  <text class="tableTitle" x="275" y="380" text-anchor="middle">문서</text>
  <line x1="130" y1="397" x2="420" y2="397" stroke="#334155"/>
  <text class="tableField" x="148" y="418">documentId</text>
  <line x1="130" y1="427" x2="420" y2="427" stroke="#334155"/>
  <text class="tableField" x="148" y="448">title</text>
  <line x1="130" y1="457" x2="420" y2="457" stroke="#334155"/>
  <text class="tableField" x="148" y="478">source</text>
</g>
<g id="entity">
  <rect x="610" y="239" width="290" height="176" rx="8" fill="#14532D" stroke="#64748B" stroke-width="2"/>
  <rect x="610" y="239" width="290" height="48" rx="8" fill="#0F172A" fill-opacity="0.58" stroke="#64748B" stroke-width="2"/>
  <line x1="610" y1="287" x2="900" y2="287" stroke="#64748B" stroke-width="2"/>
  <text class="tableTitle" x="755" y="270" text-anchor="middle">엔터티</text>
  <line x1="610" y1="287" x2="900" y2="287" stroke="#334155"/>
  <text class="tableField" x="628" y="308">entityId</text>
  <line x1="610" y1="317" x2="900" y2="317" stroke="#334155"/>
  <text class="tableField" x="628" y="338">name</text>
  <line x1="610" y1="347" x2="900" y2="347" stroke="#334155"/>
  <text class="tableField" x="628" y="368">type</text>
</g>
<g id="concept">
  <rect x="1090" y="239" width="290" height="146" rx="8" fill="#78350F" stroke="#64748B" stroke-width="2"/>
  <rect x="1090" y="239" width="290" height="48" rx="8" fill="#0F172A" fill-opacity="0.58" stroke="#64748B" stroke-width="2"/>
  <line x1="1090" y1="287" x2="1380" y2="287" stroke="#64748B" stroke-width="2"/>
  <text class="tableTitle" x="1235" y="270" text-anchor="middle">개념</text>
  <line x1="1090" y1="287" x2="1380" y2="287" stroke="#334155"/>
  <text class="tableField" x="1108" y="308">conceptId</text>
  <line x1="1090" y1="317" x2="1380" y2="317" stroke="#334155"/>
  <text class="tableField" x="1108" y="338">name</text>
</g>
<g id="related">
  <rect x="1090" y="479" width="290" height="116" rx="8" fill="#4C1D95" stroke="#64748B" stroke-width="2"/>
  <rect x="1090" y="479" width="290" height="48" rx="8" fill="#0F172A" fill-opacity="0.58" stroke="#64748B" stroke-width="2"/>
  <line x1="1090" y1="527" x2="1380" y2="527" stroke="#64748B" stroke-width="2"/>
  <text class="tableTitle" x="1235" y="510" text-anchor="middle">관련 엔터티</text>
  <line x1="1090" y1="527" x2="1380" y2="527" stroke="#334155"/>
  <text class="tableField" x="1108" y="548">related entity</text>
</g>
<rect x="88" y="684" width="1424" height="62" rx="12" fill="#111827" stroke="#334155"/>
<text class="footer" x="800" y="709" text-anchor="middle">전문 검색이나 벡터 검색으로 후보를 찾고 그래프 경로로 연결 이유를 설명한다.</text>
<text class="footer" x="800" y="733" text-anchor="middle">탐색 깊이를 제한해 의미 관계 조회가 무제한 순회로 확장되지 않게 한다.</text>
</svg>
