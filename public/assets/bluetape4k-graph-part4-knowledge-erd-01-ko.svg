<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780">
<defs>
  <marker id="arrow" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 14 7 L 0 14 Z" fill="#496A8F" stroke="#496A8F"/>
  </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#22344A" flood-opacity="0.12"/>
  </filter>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:42px;fill:#22344A;font-weight:400}
    .subtitle,.footer,.axis{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:17px;fill:#536476;font-weight:400}
    .nodeTitle,.participant{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#22344A;font-weight:400}
    .nodeBody,.labelText,.num{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:16px;fill:#3F5269;font-weight:400}
    .tableTitle{font-family:"goorm Sans","Architects Daughter","Comic Sans MS",sans-serif;font-size:24px;fill:#22344A;font-weight:400}
    .tableField,.edgeLabel{font-family:"goorm Sans Code","goorm Sans","Comic Mono","Comic Sans MS",monospace;font-size:15px;fill:#3F5269;font-weight:400}
    .edge{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bus{fill:none;stroke:#496A8F;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .lifeline{stroke:#91A6BD;stroke-width:2;stroke-dasharray:8 8}
    g[id]{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1600" height="780"/>
<rect class="frame" x="34" y="28" width="1532" height="724" rx="24"/>
<text class="title" x="800" y="82" text-anchor="middle">Knowledge Graph 엔터티 그래프</text>
<text class="subtitle" x="800" y="118" text-anchor="middle">document는 entity를 mention하고 entity는 concept 및 다른 entity와 연결된다</text>
<g>
  <path class="edge" data-connector="document-to-entity" d="M420 437 L497 437 Q515 437 515 419 L515 345 Q515 327 533 327 L610 327"/>
  <rect x="455" y="355" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="515" y="374" text-anchor="middle">MENTIONS</text>
</g>
<g>
  <path class="edge" data-connector="entity-to-concept" d="M900 311 L1090 311"/>
  <rect x="929" y="284" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="989" y="303" text-anchor="middle">IS_A</text>
</g>
<g>
  <path class="edge" data-connector="entity-to-related" d="M900 345 L983 345 Q1001 345 1001 363 L1001 519 Q1001 537 1019 537 L1090 537"/>
  <rect x="941" y="414" width="120" height="28" rx="8" fill="#FFFFFF" stroke="#D7E2EC"/>
  <text class="edgeLabel" x="1001" y="433" text-anchor="middle">RELATED_TO</text>
</g>
<g id="document">
  <rect x="130" y="349" width="290" height="176" rx="8" fill="#EAF4FF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="130" y="349" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="130" y1="397" x2="420" y2="397" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="275" y="380" text-anchor="middle">Document</text>
  <line x1="130" y1="397" x2="420" y2="397" stroke="#D7E2EC"/>
  <text class="tableField" x="148" y="418">documentId</text>
  <line x1="130" y1="427" x2="420" y2="427" stroke="#D7E2EC"/>
  <text class="tableField" x="148" y="448">title</text>
  <line x1="130" y1="457" x2="420" y2="457" stroke="#D7E2EC"/>
  <text class="tableField" x="148" y="478">source</text>
</g>
<g id="entity">
  <rect x="610" y="239" width="290" height="176" rx="8" fill="#EAF8EF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="610" y="239" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="610" y1="287" x2="900" y2="287" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="755" y="270" text-anchor="middle">Entity</text>
  <line x1="610" y1="287" x2="900" y2="287" stroke="#D7E2EC"/>
  <text class="tableField" x="628" y="308">entityId</text>
  <line x1="610" y1="317" x2="900" y2="317" stroke="#D7E2EC"/>
  <text class="tableField" x="628" y="338">name</text>
  <line x1="610" y1="347" x2="900" y2="347" stroke="#D7E2EC"/>
  <text class="tableField" x="628" y="368">type</text>
</g>
<g id="concept">
  <rect x="1090" y="239" width="290" height="146" rx="8" fill="#FFF4D9" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="1090" y="239" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="1090" y1="287" x2="1380" y2="287" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="1235" y="270" text-anchor="middle">Concept</text>
  <line x1="1090" y1="287" x2="1380" y2="287" stroke="#D7E2EC"/>
  <text class="tableField" x="1108" y="308">conceptId</text>
  <line x1="1090" y1="317" x2="1380" y2="317" stroke="#D7E2EC"/>
  <text class="tableField" x="1108" y="338">name</text>
</g>
<g id="related">
  <rect x="1090" y="479" width="290" height="116" rx="8" fill="#F3ECFF" stroke="#7B8CA3" stroke-width="2"/>
  <rect x="1090" y="479" width="290" height="48" rx="8" fill="#FFFFFF" fill-opacity="0.45" stroke="#7B8CA3" stroke-width="2"/>
  <line x1="1090" y1="527" x2="1380" y2="527" stroke="#7B8CA3" stroke-width="2"/>
  <text class="tableTitle" x="1235" y="510" text-anchor="middle">Entity</text>
  <line x1="1090" y1="527" x2="1380" y2="527" stroke="#D7E2EC"/>
  <text class="tableField" x="1108" y="548">related entity</text>
</g>
<rect x="88" y="684" width="1424" height="62" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="800" y="709" text-anchor="middle">full-text 또는 vector search로 candidate를 찾고 graph path로 연결 이유를 설명한다.</text>
<text class="footer" x="800" y="733" text-anchor="middle">depth limit은 semantic traversal이 unbounded crawl로 변하지 않게 막아 준다.</text>
</svg>
