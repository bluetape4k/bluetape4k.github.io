<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">JDBC vs R2DBC batch benchmark chart</title>
  <desc id="desc">Grouped bar chart comparing JDBC plus virtual threads and R2DBC plus coroutines for large end-to-end batch jobs.</desc>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="64" y="62" width="1072" height="506" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="122" font-family="Architects Daughter" font-size="42" fill="#f8fafc">JDBC vs R2DBC Batch</text>
  <text x="98" y="162" font-family="Comic Mono" font-size="22" fill="#cbd5e1">Large E2E batch job | dataSize=100000 | parallelism=8</text>

  <g font-family="Comic Mono" font-size="15" fill="#cbd5e1">
    <line x1="122" y1="466" x2="1068" y2="466" stroke="#64748b" stroke-width="2"/>
    <line x1="122" y1="226" x2="122" y2="466" stroke="#64748b" stroke-width="2"/>
    <line x1="122" y1="346" x2="1068" y2="346" stroke="#1f2937" stroke-width="1.5"/>
    <line x1="122" y1="226" x2="1068" y2="226" stroke="#1f2937" stroke-width="1.5"/>
    <text x="102" y="471" text-anchor="end">0</text>
    <text x="102" y="351" text-anchor="end">0.9</text>
    <text x="102" y="231" text-anchor="end">1.8</text>
  </g>

  <g font-family="Comic Mono" font-size="15" fill="#e2e8f0">
    <rect x="154" y="253" width="34" height="213" rx="7" fill="#60a5fa" stroke="#93c5fd"/>
    <rect x="194" y="442" width="34" height="24" rx="7" fill="#f59e0b" stroke="#fbbf24"/>
    <text x="191" y="492" text-anchor="middle">MySQL</text>
    <text x="191" y="512" text-anchor="middle">pool 10</text>
    <text x="171" y="246" text-anchor="middle">1.596</text>
    <text x="211" y="435" text-anchor="middle">0.181</text>

    <rect x="294" y="258" width="34" height="208" rx="7" fill="#60a5fa" stroke="#93c5fd"/>
    <rect x="334" y="442" width="34" height="24" rx="7" fill="#f59e0b" stroke="#fbbf24"/>
    <text x="331" y="492" text-anchor="middle">MySQL</text>
    <text x="331" y="512" text-anchor="middle">pool 30</text>
    <text x="311" y="251" text-anchor="middle">1.561</text>
    <text x="351" y="435" text-anchor="middle">0.182</text>

    <rect x="434" y="263" width="34" height="203" rx="7" fill="#60a5fa" stroke="#93c5fd"/>
    <rect x="474" y="442" width="34" height="24" rx="7" fill="#f59e0b" stroke="#fbbf24"/>
    <text x="471" y="492" text-anchor="middle">MySQL</text>
    <text x="471" y="512" text-anchor="middle">pool 60</text>
    <text x="451" y="256" text-anchor="middle">1.525</text>
    <text x="491" y="435" text-anchor="middle">0.182</text>

    <rect x="638" y="336" width="34" height="130" rx="7" fill="#34d399" stroke="#86efac"/>
    <rect x="678" y="440" width="34" height="26" rx="7" fill="#f59e0b" stroke="#fbbf24"/>
    <text x="675" y="492" text-anchor="middle">Postgres</text>
    <text x="675" y="512" text-anchor="middle">pool 10</text>
    <text x="655" y="329" text-anchor="middle">0.972</text>
    <text x="695" y="433" text-anchor="middle">0.192</text>

    <rect x="778" y="334" width="34" height="132" rx="7" fill="#34d399" stroke="#86efac"/>
    <rect x="818" y="440" width="34" height="26" rx="7" fill="#f59e0b" stroke="#fbbf24"/>
    <text x="815" y="492" text-anchor="middle">Postgres</text>
    <text x="815" y="512" text-anchor="middle">pool 30</text>
    <text x="795" y="327" text-anchor="middle">0.990</text>
    <text x="835" y="433" text-anchor="middle">0.192</text>

    <rect x="918" y="339" width="34" height="127" rx="7" fill="#34d399" stroke="#86efac"/>
    <rect x="958" y="440" width="34" height="26" rx="7" fill="#f59e0b" stroke="#fbbf24"/>
    <text x="955" y="492" text-anchor="middle">Postgres</text>
    <text x="955" y="512" text-anchor="middle">pool 60</text>
    <text x="935" y="332" text-anchor="middle">0.951</text>
    <text x="975" y="433" text-anchor="middle">0.193</text>
  </g>

  <g font-family="Comic Mono" font-size="17" fill="#e2e8f0">
    <rect x="782" y="112" width="292" height="66" rx="14" fill="#172033" stroke="#334155"/>
    <rect x="806" y="126" width="22" height="18" rx="5" fill="#60a5fa" stroke="#93c5fd"/>
    <text x="838" y="142">JDBC + VT</text>
    <rect x="806" y="150" width="22" height="18" rx="5" fill="#f59e0b" stroke="#fbbf24"/>
    <text x="838" y="166">R2DBC + Coroutines</text>
  </g>

  <text x="96" y="548" font-family="Comic Mono" font-size="20" fill="#cbd5e1">JDBC wins here by 8.4-8.8x on MySQL and 4.9-5.2x on PostgreSQL for the same large batch workload.</text>
</svg>
