<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">리뷰와 운영이 다음 개발 주기를 만든다</title>
  <desc id="desc">요구사항, 설계, 구현, 테스트와 리뷰, 교훈, 새 요구사항이 운영 증거를 입력받는 순환 구조를 이룬다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#101936"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.48"/></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#67e8f9"/></marker>
    <marker id="violetArrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#c084fc"/></marker>
    <style>
      .title{font-family:"goorm Sans",sans-serif;font-size:46px;font-weight:700;fill:#f8fafc}.subtitle{font-family:"goorm Sans",sans-serif;font-size:19px;fill:#9fb2cc}.label{font-family:"goorm Sans",sans-serif;font-size:28px;font-weight:700;fill:#f8fafc}.body{font-family:"goorm Sans",sans-serif;font-size:18px;fill:#d7e3f3}.small{font-family:"goorm Sans",sans-serif;font-size:15px;fill:#aebed2}.tech{font-family:"goorm Sans Code",monospace}.card{filter:url(#shadow);stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" rx="34" fill="url(#bg)"/>
  <circle cx="1450" cy="110" r="200" fill="#7c3aed" opacity=".08"/><circle cx="130" cy="780" r="220" fill="#0891b2" opacity=".08"/>
  <text x="80" y="78" class="title">완료는 지속되는 개발 주기의 한 점검 지점이다</text>
  <text x="82" y="116" class="subtitle">리뷰 결과와 운영 환경을 닮은 증거는 다음의 작고 검증 가능한 요구사항이 된다.</text>

  <rect x="50" y="180" width="470" height="160" rx="24" fill="#153247" stroke="#22d3ee" class="card"/>
  <text x="80" y="226" class="small" fill="#67e8f9">01 · 요구사항</text><text x="80" y="272" class="label">관찰 가능한 필요를 설명</text><text x="80" y="307" class="body">동작 · 경계 · 검증 근거</text>
  <rect x="565" y="180" width="470" height="160" rx="24" fill="#202a4a" stroke="#818cf8" class="card"/>
  <text x="595" y="226" class="small" fill="#a5b4fc">02 · 설계 / 계획</text><text x="595" y="272" class="label">가장 작고 안전한 변경 선택</text><text x="595" y="307" class="body">데이터 · <tspan class="tech">API</tspan> · 마이그레이션 · 검증</text>
  <rect x="1080" y="180" width="470" height="160" rx="24" fill="#27213f" stroke="#c084fc" class="card"/>
  <text x="1110" y="226" class="small" fill="#d8b4fe">03 · 구현</text><text x="1110" y="272" class="label">경계를 명시적으로 유지</text><text x="1110" y="307" class="body">테넌트 · 트랜잭션 · 이벤트 · 의존성</text>

  <rect x="1080" y="580" width="470" height="160" rx="24" fill="#26213f" stroke="#c084fc" class="card"/>
  <text x="1110" y="626" class="small" fill="#d8b4fe">04 · 테스트 / 리뷰</text><text x="1110" y="672" class="label">발견 사항을 증거로 전환</text><text x="1110" y="707" class="body">실패 경로 · 호환성 · <tspan class="tech">P0/P1</tspan></text>
  <rect x="565" y="580" width="470" height="160" rx="24" fill="#15364a" stroke="#2dd4bf" class="card"/>
  <text x="595" y="626" class="small" fill="#5eead4">05 · 교훈</text><text x="595" y="672" class="label">수정 이유를 기록</text><text x="595" y="707" class="body">결정 · 거부한 경로 · 향후 방지 장치</text>
  <rect x="50" y="580" width="470" height="160" rx="24" fill="#183248" stroke="#38bdf8" class="card"/>
  <text x="80" y="626" class="small" fill="#7dd3fc">06 · 새 요구사항</text><text x="80" y="672" class="label">배운 내용을 다시 반영</text><text x="80" y="707" class="body">리뷰 공백 하나를 계약 하나로 전환</text>

  <path d="M 520 260 H 565" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)" data-connector="requirements-design"/>
  <path d="M 1035 260 H 1080" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)" data-connector="design-implementation"/>
  <path d="M 1315 340 V 580" fill="none" stroke="#c084fc" stroke-width="4" marker-end="url(#violetArrow)" data-connector="implementation-review"/>
  <path d="M 1080 660 H 1035" fill="none" stroke="#c084fc" stroke-width="4" marker-end="url(#violetArrow)" data-connector="review-lessons"/>
  <path d="M 565 660 H 520" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)" data-connector="lessons-new"/>
  <path d="M 285 580 V 340" fill="none" stroke="#67e8f9" stroke-width="4" marker-end="url(#arrow)" data-connector="new-requirements"/>

  <rect x="470" y="394" width="660" height="116" rx="24" fill="#0c1c31" stroke="#52657d" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="430" text-anchor="middle" class="small" fill="#fbbf24">운영 입력</text>
  <rect x="490" y="452" width="130" height="34" rx="17" fill="#123b4d"/><text x="555" y="475" text-anchor="middle" class="small">테넌트 격리</text>
  <rect x="635" y="452" width="100" height="34" rx="17" fill="#31244b"/><text x="685" y="475" text-anchor="middle" class="small">알림</text>
  <rect x="750" y="452" width="180" height="34" rx="17" fill="#18364a"/><text x="840" y="475" text-anchor="middle" class="small">데이터베이스 호환성</text>
  <rect x="945" y="452" width="150" height="34" rx="17" fill="#332817"/><text x="1020" y="475" text-anchor="middle" class="small">성능 / <tspan class="tech">SDK</tspan></text>

  <rect x="90" y="794" width="1420" height="60" rx="20" fill="#0b1628" stroke="#26364e"/>
  <text x="116" y="831" class="small">살아 있는 명세·계획·테스트·리뷰 결과·교훈은 구현이 운영에서 실제로 드러난 사실과 계속 일치하게 한다.</text>
</svg>
