<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-label="Strategic leader election candidate registry flow">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#426b8f"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#2f855a"/>
    </marker>
    <style>
      .bg { fill: #fbfdff; }
      .frame { fill: #ffffff; stroke: #c8d6e5; stroke-width: 1.6; }
      .title { font-family: 'Architects Daughter', cursive; font-size: 28px; fill: #1f2a37; }
      .subtitle { font-family: 'Comic Mono', monospace; font-size: 14px; fill: #52677c; }
      .label { font-family: 'Architects Daughter', cursive; font-size: 17px; fill: #26384a; }
      .detail { font-family: 'Comic Mono', monospace; font-size: 12px; fill: #43566a; }
      .small { font-family: 'Comic Mono', monospace; font-size: 10.5px; fill: #53677b; }
      .node { fill: #ffffff; stroke: #aec1d5; stroke-width: 1.4; }
      .candidate { fill: #eef8ff; stroke: #78a9d7; }
      .registry { fill: #edf7ff; stroke: #73a6d8; }
      .strategy { fill: #f4f0ff; stroke: #9b87d6; }
      .winner { fill: #e8f8ee; stroke: #61b57a; }
      .skip { fill: #fff7e6; stroke: #d8a84f; }
      .result { fill: #f2fae8; stroke: #91bb5b; }
      .link { stroke: #426b8f; stroke-width: 2.2; fill: none; marker-end: url(#arrow-blue); }
      .return { stroke: #2f855a; stroke-width: 2.2; fill: none; marker-end: url(#arrow-green); }
      .soft { stroke: #a9bed2; stroke-width: 1.4; fill: none; stroke-dasharray: 5 5; }
      .pill { fill: #ffffff; stroke: #cbd8e6; stroke-width: 1.1; }
      .crown { fill: #f5bd3d; stroke: #9a641a; stroke-width: 1.3; }
    </style>
  </defs>

  <rect class="bg" width="1080" height="620"/>
  <rect class="frame" x="18" y="18" width="1044" height="584" rx="18"/>

  <text class="title" x="540" y="58" text-anchor="middle">Strategic Election Flow</text>
  <text class="subtitle" x="540" y="82" text-anchor="middle">candidate registry plus deterministic strategy selects the single node to run</text>

  <rect class="candidate" x="64" y="148" width="192" height="58" rx="12"/>
  <text class="label" x="160" y="171" text-anchor="middle">node-a</text>
  <text class="detail" x="160" y="191" text-anchor="middle">CandidateInfo</text>

  <rect class="candidate" x="64" y="256" width="192" height="58" rx="12"/>
  <text class="label" x="160" y="279" text-anchor="middle">node-b</text>
  <text class="detail" x="160" y="299" text-anchor="middle">CandidateInfo</text>

  <rect class="candidate" x="64" y="364" width="192" height="58" rx="12"/>
  <text class="label" x="160" y="387" text-anchor="middle">node-c</text>
  <text class="detail" x="160" y="407" text-anchor="middle">CandidateInfo</text>

  <rect class="registry" x="346" y="198" width="228" height="172" rx="16"/>
  <text class="label" x="460" y="226" text-anchor="middle">candidate registry</text>
  <text class="detail" x="460" y="250" text-anchor="middle">nodeId + metadata</text>
  <text class="detail" x="460" y="270" text-anchor="middle">registeredAt</text>
  <text class="detail" x="460" y="290" text-anchor="middle">success / failure counts</text>
  <text class="detail" x="460" y="310" text-anchor="middle">per-node TTL heartbeat</text>
  <rect class="pill" x="384" y="326" width="152" height="26" rx="13"/>
  <text class="small" x="460" y="342" text-anchor="middle">listCandidates()</text>

  <path class="link" d="M 256 177 H 308 V 226 H 346"/>
  <path class="link" d="M 256 285 H 346"/>
  <path class="link" d="M 256 393 H 300 V 320 H 346"/>

  <rect class="strategy" x="650" y="188" width="238" height="192" rx="16"/>
  <text class="label" x="769" y="218" text-anchor="middle">ElectionStrategy</text>
  <rect class="pill" x="688" y="242" width="162" height="26" rx="13"/>
  <text class="small" x="769" y="258" text-anchor="middle">FIFO: earliest registered</text>
  <rect class="pill" x="688" y="278" width="162" height="26" rx="13"/>
  <text class="small" x="769" y="294" text-anchor="middle">Random: seeded pick</text>
  <rect class="pill" x="688" y="314" width="162" height="26" rx="13"/>
  <text class="small" x="769" y="330" text-anchor="middle">Scored: highest score</text>
  <text class="detail" x="769" y="360" text-anchor="middle">tie-break: registeredAt, nodeId</text>

  <path class="link" d="M 574 284 H 650"/>

  <rect class="winner" x="742" y="438" width="220" height="70" rx="14"/>
  <path class="crown" d="M 836 453 L 846 469 L 858 453 L 870 469 L 880 453 L 876 478 L 840 478 Z"/>
  <text class="label" x="852" y="489" text-anchor="middle">selected node executes</text>

  <rect class="skip" x="434" y="438" width="220" height="70" rx="14"/>
  <text class="label" x="544" y="465" text-anchor="middle">others skip</text>
  <text class="detail" x="544" y="488" text-anchor="middle">return null, no side effect</text>

  <path class="return" d="M 780 380 V 438"/>
  <path class="link" d="M 720 380 V 412 H 544 V 438"/>

  <rect class="result" x="742" y="112" width="220" height="54" rx="14"/>
  <text class="label" x="852" y="135" text-anchor="middle">updateResult()</text>
  <text class="detail" x="852" y="153" text-anchor="middle">success or failure history</text>

  <path class="return" d="M 852 438 V 416 H 1004 V 139 H 962"/>
  <path class="soft" d="M 742 139 H 604 V 226 H 574"/>

  <rect class="node" x="64" y="470" width="254" height="48" rx="12"/>
  <text class="detail" x="191" y="491" text-anchor="middle">Distributed backends need all nodes to</text>
  <text class="detail" x="191" y="509" text-anchor="middle">see the same candidate set for agreement.</text>

  <text class="small" x="540" y="558" text-anchor="middle">Use strategic election when the execution node should be chosen by history, capacity, health, or a custom scorer.</text>
</svg>
