<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1300" viewBox="0 0 2048 1300" role="img" aria-labelledby="title desc">
  <title id="title">Waitlist offer and claim sequence</title>
  <desc id="desc">A vacancy fence creates one durable offer, notification is attempted after commit, and an idempotent claim verifies the owner, revision, expiry, and slot before accepting.</desc>
  <defs>
    <style>
    text { font-family: "Comic Mono", "Noto Sans Mono", ui-monospace, monospace !important; }
      text.title, text.subtitle { font-family: "Architects Daughter", cursive !important; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071326"/><stop offset="1" stop-color="#0c1f3b"/></linearGradient>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#59a9ff" stroke="none" stroke-dasharray="none" data-arrowhead="true" data-solid-head="true"/></marker>
    <marker id="arrow-teal" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#58e3d0" stroke="none" stroke-dasharray="none" data-arrowhead="true" data-solid-head="true"/></marker>
    <marker id="arrow-amber" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ffbf4f" stroke="none" stroke-dasharray="none" data-arrowhead="true" data-solid-head="true"/></marker>
    <marker id="arrow-red" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" viewBox="0 0 10 10" refX="9" refY="5" orient="auto" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#e888a1" stroke="none" stroke-dasharray="none" data-arrowhead="true" data-solid-head="true"/></marker>
  </defs>
  <rect id="canvas" width="2048" height="1300" fill="url(#bg)"/>
  <rect class="frame" id="frame" x="24" y="24" width="2000" height="1252" rx="32" fill="none" stroke="#294b78" stroke-width="2"/>
  <text class="title" id="diagram-title" x="82" y="78" fill="#f4f7ff" font-family="Inter, Pretendard, Arial, sans-serif" font-size="43" font-weight="700">One vacancy, one offer, one replayable claim</text>
  <text class="subtitle" id="diagram-subtitle" x="86" y="116" fill="#a9bad7" font-family="Inter, Pretendard, Arial, sans-serif" font-size="21">The DB fence is authoritative; notification delivery is an after-commit side effect.</text>

  <g id="availability_db" transform="translate(70 170)"><rect class="header" width="315" height="120" rx="18" fill="#172e4b" stroke="#ffbf4f" stroke-width="3"/><text class="participant" x="157" y="51" text-anchor="middle" fill="#ffd27c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">AVAILABILITY DB</text><text class="role" x="157" y="84" text-anchor="middle" fill="#fff3d6" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18">holds / offers / versions</text></g>
  <g id="scheduler" transform="translate(465 170)"><rect class="header" width="315" height="120" rx="18" fill="#132b4a" stroke="#59a9ff" stroke-width="3"/><text class="participant" x="157" y="51" text-anchor="middle" fill="#8ec5ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">SCHEDULER</text><text class="role" x="157" y="84" text-anchor="middle" fill="#e8effc" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18">vacancy job / recovery</text></g>
  <g id="candidate" transform="translate(860 170)"><rect class="header" width="315" height="120" rx="18" fill="#18344b" stroke="#aab5d4" stroke-width="3"/><text class="participant" x="157" y="51" text-anchor="middle" fill="#d2dcf4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">CANDIDATE</text><text class="role" x="157" y="84" text-anchor="middle" fill="#d6deef" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18">opaque public ref</text></g>
  <g id="claim_api" transform="translate(1255 170)"><rect class="header" width="315" height="120" rx="18" fill="#153b45" stroke="#58e3d0" stroke-width="3"/><text class="participant" x="157" y="51" text-anchor="middle" fill="#82f2df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">CLAIM API</text><text class="role" x="157" y="84" text-anchor="middle" fill="#e2fff9" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18">owner / revision / expiry</text></g>
  <g id="notification" transform="translate(1650 170)"><rect class="header" width="315" height="120" rx="18" fill="#2b2832" stroke="#e888a1" stroke-width="3"/><text class="participant" x="157" y="51" text-anchor="middle" fill="#ffb4c5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">NOTIFICATION</text><text class="role" x="157" y="84" text-anchor="middle" fill="#e7c5cf" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18">delivery is not acceptance</text></g>

  <line class="lifeline" x1="227" y1="290" x2="227" y2="1130" stroke="#6e82a6" stroke-width="2" stroke-dasharray="9 11"/><line class="lifeline" x1="622" y1="290" x2="622" y2="1130" stroke="#6e82a6" stroke-width="2" stroke-dasharray="9 11"/><line class="lifeline" x1="1017" y1="290" x2="1017" y2="1130" stroke="#6e82a6" stroke-width="2" stroke-dasharray="9 11"/><line class="lifeline" x1="1412" y1="290" x2="1412" y2="1130" stroke="#6e82a6" stroke-width="2" stroke-dasharray="9 11"/><line class="lifeline" x1="1807" y1="290" x2="1807" y2="1130" stroke="#6e82a6" stroke-width="2" stroke-dasharray="9 11"/>
  <rect class="activation" x="211" y="330" width="32" height="700" rx="8" fill="#203b4d" stroke="#73a5bd" stroke-width="2"/><rect class="activation" x="1396" y="680" width="32" height="335" rx="8" fill="#203b4d" stroke="#73a5bd" stroke-width="2"/>

  <path id="vacancy_fence" class="message call" data-from="scheduler" data-to="availability_db" d="M 622 365 H 227" fill="none" stroke="#ffbf4f" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-amber)"/><rect class="pill pill-call" data-label-for="vacancy_fence" x="272" y="310" width="300" height="44" rx="22" fill="#172e4b" stroke="#ffbf4f" stroke-width="2"/><circle class="numBadge num-call" cx="300" cy="332" r="16" fill="#5a4520" stroke="#ffbf4f" stroke-width="2"/><text class="num" x="300" y="338" text-anchor="middle" fill="#fff7e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">1</text><text class="label" x="327" y="338" fill="#fff3d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">acquire vacancy fence</text>
  <path id="fence_won" class="message return" data-from="availability_db" data-to="scheduler" d="M 227 450 H 622" fill="none" stroke="#58e3d0" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 9" marker-end="url(#arrow-teal)"/><rect class="pill pill-return" data-label-for="fence_won" x="275" y="395" width="270" height="44" rx="22" fill="#153b45" stroke="#58e3d0" stroke-width="2"/><circle class="numBadge num-return" cx="303" cy="417" r="16" fill="#1b5b5a" stroke="#58e3d0" stroke-width="2"/><text class="num" x="303" y="423" text-anchor="middle" fill="#eafffb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">2</text><text class="label" x="330" y="423" fill="#e2fff9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">fence won</text>
  <path id="offer_hold_commit" class="message call" data-from="scheduler" data-to="availability_db" d="M 622 535 H 227" fill="none" stroke="#ffbf4f" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-amber)"/><rect class="pill pill-call" data-label-for="offer_hold_commit" x="252" y="480" width="410" height="44" rx="22" fill="#172e4b" stroke="#ffbf4f" stroke-width="2"/><circle class="numBadge num-call" cx="280" cy="502" r="16" fill="#5a4520" stroke="#ffbf4f" stroke-width="2"/><text class="num" x="280" y="508" text-anchor="middle" fill="#fff7e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">3</text><text class="label" x="307" y="508" fill="#fff3d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">eligible -&gt; OFFERED + hold</text>
  <path id="notification_attempt" class="message error" data-from="scheduler" data-to="notification" d="M 622 620 H 1807" fill="none" stroke="#e888a1" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-red)"/><rect class="pill pill-error" data-label-for="notification_attempt" x="1005" y="565" width="430" height="44" rx="22" fill="#2b2832" stroke="#e888a1" stroke-width="2"/><circle class="numBadge num-error" cx="1033" cy="587" r="16" fill="#5d3041" stroke="#e888a1" stroke-width="2"/><text class="num" x="1033" y="593" text-anchor="middle" fill="#ffe9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">4</text><text class="label" x="1060" y="593" fill="#ffe9ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">dispatch after commit</text>
  <text x="1195" y="665" text-anchor="middle" fill="#c79eab" font-family="Inter, Pretendard, Arial, sans-serif" font-size="17">delivery failure does not roll back OFFERED</text>

  <path id="claim_request" class="message call" data-from="candidate" data-to="claim_api" d="M 1017 740 H 1412" fill="none" stroke="#59a9ff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/><rect class="pill pill-call" data-label-for="claim_request" x="1068" y="685" width="360" height="44" rx="22" fill="#132b4a" stroke="#59a9ff" stroke-width="2"/><circle class="numBadge num-call" cx="1096" cy="707" r="16" fill="#1b4775" stroke="#59a9ff" stroke-width="2"/><text class="num" x="1096" y="713" text-anchor="middle" fill="#f4f7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">5</text><text class="label" x="1123" y="713" fill="#e8effc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">claim + idempotency key</text>
  <path id="claim_fence" class="message call" data-from="claim_api" data-to="availability_db" d="M 1412 825 H 227" fill="none" stroke="#ffbf4f" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-amber)"/><rect class="pill pill-call" data-label-for="claim_fence" x="560" y="770" width="575" height="44" rx="22" fill="#172e4b" stroke="#ffbf4f" stroke-width="2"/><circle class="numBadge num-call" cx="588" cy="792" r="16" fill="#5a4520" stroke="#ffbf4f" stroke-width="2"/><text class="num" x="588" y="798" text-anchor="middle" fill="#fff7e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">6</text><text class="label" x="615" y="798" fill="#fff3d6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">lock offer / owner / revision / expiry</text>
  <path id="accepted_command_commit" class="message return" data-from="availability_db" data-to="claim_api" d="M 227 910 H 1412" fill="none" stroke="#58e3d0" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 9" marker-end="url(#arrow-teal)"/><rect class="pill pill-return" data-label-for="accepted_command_commit" x="700" y="855" width="490" height="44" rx="22" fill="#153b45" stroke="#58e3d0" stroke-width="2"/><circle class="numBadge num-return" cx="728" cy="877" r="16" fill="#1b5b5a" stroke="#58e3d0" stroke-width="2"/><text class="num" x="728" y="883" text-anchor="middle" fill="#eafffb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">7</text><text class="label" x="755" y="883" fill="#e2fff9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">ACCEPTED + command receipt commit</text>
  <path id="replay_receipt" class="message return" data-from="claim_api" data-to="candidate" d="M 1412 995 H 1017" fill="none" stroke="#58e3d0" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 9" marker-end="url(#arrow-teal)"/><rect class="pill pill-return" data-label-for="replay_receipt" x="1085" y="940" width="355" height="44" rx="22" fill="#153b45" stroke="#58e3d0" stroke-width="2"/><circle class="numBadge num-return" cx="1113" cy="962" r="16" fill="#1b5b5a" stroke="#58e3d0" stroke-width="2"/><text class="num" x="1113" y="968" text-anchor="middle" fill="#eafffb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">8</text><text class="label" x="1140" y="968" fill="#e2fff9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">201 / replay same receipt</text>

  <rect id="recovery_reconcile" x="145" y="1025" width="1715" height="92" rx="20" fill="#302a20" stroke="#ffbf4f" stroke-width="2"/>
  <path class="message amber" data-from="scheduler" data-to="availability_db" d="M 622 1090 H 227" fill="none" stroke="#ffbf4f" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#arrow-amber)"/>
  <text class="num" x="620" y="1060" fill="#ffd27c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">9</text>
  <text class="label" x="1005" y="1060" text-anchor="middle" fill="#ffd27c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">reconcile stale / expired / occupied offers before retrying</text>
  <text x="1005" y="1110" text-anchor="middle" fill="#e8d6ae" font-family="Inter, Pretendard, Arial, sans-serif" font-size="17">A replay, restart, or rollout-off branch preserves expiry, suppression, and history.</text>
  <rect id="bottom-note" x="145" y="1160" width="1715" height="68" rx="18" fill="#0d1d35" stroke="#3d6797" stroke-width="2"/>
  <text x="1002" y="1203" text-anchor="middle" fill="#b4c5df" font-family="Inter, Pretendard, Arial, sans-serif" font-size="18">Redis may reduce scheduler duplicates. It never decides ownership, capacity, or the final state.</text>
</svg>
