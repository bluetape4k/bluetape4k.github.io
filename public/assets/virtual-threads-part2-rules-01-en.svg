<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Threads production rules</title>
  <desc id="desc">A Graphviz-derived flow of virtual thread usage rules from bluetape4k-workshop: blocking synchronous code, thread-per-task execution, semaphore limits, scoped values, and lock discipline.</desc>
  <defs>
    <marker id="arrow-vt2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L8,4.5 L1,8 Z" fill="#5eead4"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="64" y="62" width="1072" height="506" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="96" y="122" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="42" fill="#f8fafc">Virtual Threads Rules</text>
  <text x="98" y="162" font-family="Comic Mono, monospace" font-size="22" fill="#cbd5e1">rules from bluetape4k-workshop/virtualthreads/rules</text>

  <g font-family="Comic Mono, monospace" font-size="17" fill="#f8fafc">
    <rect class="card" x="96" y="246" width="182" height="112" rx="16" fill="#12372f" stroke="#2dd4bf"/>
    <text x="187" y="284" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Blocking sync</text>
    <text x="187" y="316" text-anchor="middle">OK for I/O waits</text>

    <rect class="card" x="338" y="246" width="188" height="112" rx="16" fill="#102a43" stroke="#60a5fa"/>
    <text x="432" y="284" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Thread per task</text>
    <text x="432" y="316" text-anchor="middle">do not pool VT</text>

    <rect class="card" x="586" y="246" width="188" height="112" rx="16" fill="#3b2814" stroke="#f59e0b"/>
    <text x="680" y="284" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Semaphore</text>
    <text x="680" y="316" text-anchor="middle">limit resources</text>

    <rect class="card" x="834" y="210" width="188" height="104" rx="16" fill="#2d2147" stroke="#a78bfa"/>
    <text x="928" y="248" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">ScopedValue</text>
    <text x="928" y="280" text-anchor="middle">context scope</text>

    <rect class="card" x="834" y="382" width="188" height="104" rx="16" fill="#123047" stroke="#38bdf8"/>
    <text x="928" y="420" text-anchor="middle" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Locks</text>
    <text x="928" y="452" text-anchor="middle">small scope</text>
  </g>

  <g fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-vt2)">
    <path class="connector" d="M278 302 H338"/>
    <path class="connector" d="M526 302 H586"/>
    <path class="connector" d="M774 286 H796 Q810 286 810 272 V262 Q810 248 824 248 H834"/>
    <path class="connector" d="M774 318 H796 Q810 318 810 332 V420 Q810 434 824 434 H834"/>
  </g>

  <g font-family="Comic Mono, monospace" font-size="17" fill="#cbd5e1">
    <rect class="card" x="126" y="424" width="592" height="72" rx="16" fill="#172033" stroke="#334155"/>
    <text x="154" y="456" font-family="Architects Daughter, Comic Mono, sans-serif" font-size="23">Practical rule</text>
    <text x="154" y="484">Virtual threads remove thread pressure, not downstream limits.</text>
  </g>
</svg>
