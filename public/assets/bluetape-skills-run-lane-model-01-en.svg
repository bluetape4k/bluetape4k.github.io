<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 900" width="1800" height="900">
  <style>
    .title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; fill: #f2f7ff; font-size: 38px; }
    .panel-title { font-family: 'Architects Daughter', 'Comic Sans MS', cursive; fill: #f2f7ff; font-size: 23px; }
    .subtitle, .label, .small, .tiny, .legend { font-family: 'Comic Mono', 'SFMono-Regular', Consolas, monospace; }
    .subtitle { fill: #9fb5cc; font-size: 15px; }
    .label { fill: #dce9f7; font-size: 15px; }
    .small { fill: #9fb5cc; font-size: 12px; }
    .tiny { fill: #9fb5cc; font-size: 10px; }
    .legend { fill: #b7c8da; font-size: 11px; }
    .connector { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .secondary { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020817" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow-cyan" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 13 7 L 0 13 Z" fill="#6ee7ff"/>
    </marker>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 13 7 L 0 13 Z" fill="#4f8cff"/>
    </marker>
    <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 13 7 L 0 13 Z" fill="#f5b942"/>
    </marker>
    <marker id="arrow-amber-small" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#f5b942"/>
    </marker>
    <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 13 7 L 0 13 Z" fill="#4fd18b"/>
    </marker>
  </defs>

  <rect width="1800" height="900" fill="#07111f"/>
  <rect x="24" y="24" width="1752" height="852" rx="34" fill="#0a1728" stroke="#203a56" stroke-width="2.5"/>

  <g id="title">
    <text x="62" y="76" class="title">Run owns the outcome. Lanes own bounded work.</text>
    <text x="64" y="110" class="subtitle">One approved run can contain many lanes, but completion still converges through shared proof.</text>
  </g>

  <g id="run-panel">
    <rect x="58" y="142" width="824" height="552" rx="26" fill="#10243a" stroke="#6ee7ff" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="86" y="181" class="panel-title">ONE RUN, MULTIPLE LANES</text>
    <text x="88" y="205" class="small">static ownership + completion topology</text>

    <rect x="84" y="220" width="772" height="450" rx="20" fill="#0d1d31" stroke="#2f5878" stroke-width="1.7"/>
    <text x="108" y="250" class="label">RUN</text>
    <text x="154" y="250" class="small">approved whole outcome</text>

    <rect x="106" y="276" width="190" height="310" rx="16" fill="#15304b" stroke="#3e7593" stroke-width="1.5"/>
    <text x="201" y="315" text-anchor="middle" class="label">Approved objective</text>
    <text x="201" y="340" text-anchor="middle" class="small">one bounded result</text>
    <line x1="132" y1="364" x2="270" y2="364" stroke="#3e7593" stroke-width="1"/>
    <text x="201" y="397" text-anchor="middle" class="label">Owner epoch</text>
    <text x="201" y="422" text-anchor="middle" class="small">current authority</text>
    <line x1="132" y1="446" x2="270" y2="446" stroke="#3e7593" stroke-width="1"/>
    <text x="201" y="479" text-anchor="middle" class="label">Required topology</text>
    <text x="201" y="504" text-anchor="middle" class="small">components + checks</text>
  </g>

  <g id="lane-write-ko" filter="url(#shadow)">
    <rect x="360" y="276" width="192" height="82" rx="14" fill="#15304b" stroke="#6ee7ff" stroke-width="1.8"/>
    <text x="456" y="309" text-anchor="middle" class="label">write-ko</text>
    <text x="456" y="333" text-anchor="middle" class="small">bounded assignment</text>
    <text x="456" y="349" text-anchor="middle" class="tiny">owner + state</text>
  </g>
  <g id="lane-write-en" filter="url(#shadow)">
    <rect x="360" y="390" width="192" height="82" rx="14" fill="#15304b" stroke="#6ee7ff" stroke-width="1.8"/>
    <text x="456" y="423" text-anchor="middle" class="label">write-en</text>
    <text x="456" y="447" text-anchor="middle" class="small">bounded assignment</text>
    <text x="456" y="463" text-anchor="middle" class="tiny">owner + state</text>
  </g>
  <g id="lane-verify-site" filter="url(#shadow)">
    <rect x="360" y="504" width="192" height="82" rx="14" fill="#15304b" stroke="#6ee7ff" stroke-width="1.8"/>
    <text x="456" y="537" text-anchor="middle" class="label">verify-site</text>
    <text x="456" y="561" text-anchor="middle" class="small">bounded assignment</text>
    <text x="456" y="577" text-anchor="middle" class="tiny">owner + state</text>
  </g>

  <path class="connector" d="M 296 317 H 360" stroke="#6ee7ff" marker-end="url(#arrow-cyan)"/>
  <path class="connector" d="M 296 431 H 360" stroke="#6ee7ff" marker-end="url(#arrow-cyan)"/>
  <path class="connector" d="M 296 545 H 360" stroke="#6ee7ff" marker-end="url(#arrow-cyan)"/>

  <g id="completion-gate" filter="url(#shadow)">
    <rect x="630" y="276" width="190" height="282" rx="16" fill="#152b4c" stroke="#4f8cff" stroke-width="1.8"/>
    <text x="725" y="344" text-anchor="middle" class="label">Required components</text>
    <text x="725" y="370" text-anchor="middle" class="small">checks + evidence</text>
    <line x1="654" y1="397" x2="796" y2="397" stroke="#365f97" stroke-width="1"/>
    <text x="725" y="430" text-anchor="middle" class="small">weakest required</text>
    <text x="725" y="450" text-anchor="middle" class="small">component gates all</text>
    <text x="725" y="475" text-anchor="middle" class="tiny">weakest_required_component</text>

    <rect x="630" y="590" width="190" height="62" rx="14" fill="#163a35" stroke="#4fd18b" stroke-width="2"/>
    <text x="725" y="617" text-anchor="middle" class="label">Main verification</text>
    <text x="725" y="640" text-anchor="middle" class="small">re-read all proof</text>
  </g>

  <path class="connector" d="M 552 317 H 630" stroke="#4f8cff" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 552 431 H 630" stroke="#4f8cff" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 552 545 H 630" stroke="#4f8cff" marker-end="url(#arrow-blue)"/>
  <path class="connector" d="M 725 558 V 590" stroke="#4fd18b" marker-end="url(#arrow-green)"/>

  <g id="lane-panel">
    <rect x="918" y="142" width="824" height="552" rx="26" fill="#10243a" stroke="#4f8cff" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="946" y="181" class="panel-title">ONE LANE, RECOVERY + REPLACEMENT</text>
    <text x="948" y="205" class="small">time-ordered state + explicit lineage</text>
  </g>

  <g id="happy-path">
    <rect x="946" y="236" width="138" height="78" rx="14" fill="#15304b" stroke="#6ee7ff" stroke-width="1.7" filter="url(#shadow)"/>
    <rect x="1136" y="236" width="138" height="78" rx="14" fill="#15304b" stroke="#6ee7ff" stroke-width="1.7" filter="url(#shadow)"/>
    <rect x="1326" y="236" width="138" height="78" rx="14" fill="#152b4c" stroke="#4f8cff" stroke-width="1.7" filter="url(#shadow)"/>
    <rect x="1516" y="236" width="138" height="78" rx="14" fill="#163a35" stroke="#4fd18b" stroke-width="2" filter="url(#shadow)"/>
    <text x="1015" y="282" text-anchor="middle" class="label">pending</text>
    <text x="1205" y="282" text-anchor="middle" class="label">starting</text>
    <text x="1395" y="282" text-anchor="middle" class="label">running</text>
    <text x="1585" y="282" text-anchor="middle" class="label">completed</text>

    <path class="connector" d="M 1084 275 H 1136" stroke="#6ee7ff" marker-end="url(#arrow-cyan)"/>
    <path class="connector" d="M 1274 275 H 1326" stroke="#4f8cff" marker-end="url(#arrow-blue)"/>
    <path class="connector" d="M 1464 275 H 1516" stroke="#4fd18b" marker-end="url(#arrow-green)"/>
  </g>

  <g id="native-ack-note">
    <rect x="946" y="334" width="280" height="48" rx="12" fill="#0d1d31" stroke="#3e7593" stroke-width="1.3"/>
    <text x="1086" y="355" text-anchor="middle" class="small">Main session: native spawn</text>
    <text x="1086" y="373" text-anchor="middle" class="tiny">then observed startup-ack</text>
  </g>

  <g id="recovery-path">
    <rect x="1490" y="436" width="154" height="78" rx="14" fill="#253044" stroke="#f5b942" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="1240" y="436" width="154" height="78" rx="14" fill="#253044" stroke="#f5b942" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="990" y="436" width="154" height="78" rx="14" fill="#2b2f3d" stroke="#f5b942" stroke-width="1.8" filter="url(#shadow)"/>
    <text x="1567" y="469" text-anchor="middle" class="small">suspected_stall</text>
    <text x="1567" y="493" text-anchor="middle" class="tiny">probe required</text>
    <text x="1317" y="480" text-anchor="middle" class="label">recovering</text>
    <text x="1067" y="480" text-anchor="middle" class="label">replaced</text>

    <path id="stall-route" class="connector" d="M 1395 314 V 382 Q 1395 394 1407 394 H 1555 Q 1567 394 1567 406 V 436" stroke="#f5b942" marker-end="url(#arrow-amber)"/>
    <path class="connector" d="M 1490 475 H 1394" stroke="#f5b942" marker-end="url(#arrow-amber)"/>
    <path class="connector" d="M 1240 475 H 1144" stroke="#f5b942" marker-end="url(#arrow-amber)"/>
    <path id="probe-ack-route" class="secondary" d="M 1317 436 V 370 Q 1317 358 1329 358 H 1358 Q 1370 358 1370 346 V 314" stroke="#4f8cff" marker-end="url(#arrow-blue)"/>
    <text x="1344" y="351" text-anchor="middle" class="tiny">probe ack</text>
  </g>

  <g id="replacement-lane" filter="url(#shadow)">
    <rect x="970" y="568" width="230" height="92" rx="15" fill="#15304b" stroke="#6ee7ff" stroke-width="1.8"/>
    <text x="1085" y="594" text-anchor="middle" class="label">replacement lane</text>
    <text x="1085" y="617" text-anchor="middle" class="small">new lane id + new agent id</text>
    <text x="1085" y="644" text-anchor="middle" class="label">pending</text>
  </g>
  <path class="connector" d="M 1067 514 V 568" stroke="#6ee7ff" marker-end="url(#arrow-cyan)"/>

  <g id="lineage">
    <rect x="1320" y="570" width="250" height="62" rx="12" fill="#0d1d31" stroke="#7f6734" stroke-width="1.2"/>
    <text x="1445" y="595" text-anchor="middle" class="small">late result fenced</text>
    <text x="1445" y="616" text-anchor="middle" class="tiny">reference only until re-verified</text>
    <path id="lineage-route" class="secondary" d="M 1567 514 V 548 Q 1567 560 1555 560 H 1097 Q 1085 560 1085 548 V 568" stroke="#f5b942" stroke-dasharray="9 8" marker-end="url(#arrow-amber-small)"/>
    <text x="1330" y="530" text-anchor="middle" class="tiny">parent lineage</text>
  </g>

  <path class="connector" d="M 725 652 V 728" stroke="#4fd18b" marker-end="url(#arrow-green)"/>
  <path id="run-complete-route" class="connector" d="M 1585 314 V 334 Q 1585 352 1603 352 H 1692 Q 1710 352 1710 370 V 650 Q 1710 668 1692 668 H 1583 Q 1565 668 1565 686 V 728" stroke="#4fd18b" marker-end="url(#arrow-green)"/>

  <g id="completion-strip">
    <rect x="58" y="728" width="1684" height="96" rx="22" fill="#0d1d31" stroke="#365f97" stroke-width="1.8"/>
    <text x="88" y="764" class="panel-title">Lane complete != Run complete</text>
    <text x="90" y="792" class="small">A terminal lane is one input to the final decision.</text>

    <rect x="560" y="748" width="650" height="56" rx="14" fill="#152b4c" stroke="#4f8cff" stroke-width="1.5"/>
    <text x="885" y="773" text-anchor="middle" class="small">terminal lanes + required checks + component evidence</text>
    <text x="885" y="794" text-anchor="middle" class="small">+ main verification</text>

    <rect x="1370" y="748" width="320" height="56" rx="14" fill="#163a35" stroke="#4fd18b" stroke-width="2"/>
    <text x="1530" y="783" text-anchor="middle" class="label">RUN COMPLETED</text>
    <path class="connector" d="M 1210 776 H 1370" stroke="#4fd18b" marker-end="url(#arrow-green)"/>
  </g>

  <g id="legend">
    <line x1="84" y1="851" x2="124" y2="851" stroke="#6ee7ff" stroke-width="4" stroke-linecap="round"/>
    <text x="138" y="855" class="legend">assignment</text>
    <line x1="286" y1="851" x2="326" y2="851" stroke="#4f8cff" stroke-width="4" stroke-linecap="round"/>
    <text x="340" y="855" class="legend">evidence / state</text>
    <line x1="548" y1="851" x2="588" y2="851" stroke="#f5b942" stroke-width="4" stroke-linecap="round"/>
    <text x="602" y="855" class="legend">recovery / lineage</text>
    <line x1="842" y1="851" x2="882" y2="851" stroke="#4fd18b" stroke-width="4" stroke-linecap="round"/>
    <text x="896" y="855" class="legend">verified completion</text>
  </g>
</svg>
