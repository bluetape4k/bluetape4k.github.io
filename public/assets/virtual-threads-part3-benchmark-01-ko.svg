<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">JDBC와 R2DBC batch benchmark</title>
  <desc id="desc">대규모 end-to-end batch job에서 JDBC와 virtual thread, R2DBC와 coroutine을 비교한 묶음 막대 차트.</desc>
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <rect x="64" y="62" width="1072" height="506" rx="24" fill="#ffffff" stroke="#d2d8d5" stroke-width="2"/>
  <text x="96" y="122" font-family="goorm Sans" font-size="40" font-weight="700" fill="#222f3a">JDBC와 R2DBC Batch</text>
  <text x="98" y="162" font-family="goorm Sans Code" font-size="21" fill="#52616c">대규모 E2E batch job · dataSize=100000 · parallelism=8</text>

  <g font-family="goorm Sans Code" font-size="15" fill="#52616c">
    <line x1="122" y1="466" x2="1068" y2="466" stroke="#9eaaa5" stroke-width="2"/>
    <line x1="122" y1="226" x2="122" y2="466" stroke="#9eaaa5" stroke-width="2"/>
    <line x1="122" y1="346" x2="1068" y2="346" stroke="#e5ebe8" stroke-width="1.5"/>
    <line x1="122" y1="226" x2="1068" y2="226" stroke="#e5ebe8" stroke-width="1.5"/>
    <text x="102" y="471" text-anchor="end">0</text>
    <text x="102" y="351" text-anchor="end">0.9</text>
    <text x="102" y="231" text-anchor="end">1.8</text>
  </g>

  <g font-family="goorm Sans Code" font-size="15" fill="#273846">
    <rect x="154" y="253" width="34" height="213" rx="7" fill="#9fc3ee" stroke="#6a9bd1"/>
    <rect x="194" y="442" width="34" height="24" rx="7" fill="#ffc98f" stroke="#d8a05e"/>
    <text x="191" y="492" text-anchor="middle">MySQL</text>
    <text x="191" y="512" text-anchor="middle">pool 10</text>
    <text x="171" y="246" text-anchor="middle">1.596</text>
    <text x="211" y="435" text-anchor="middle">0.181</text>

    <rect x="294" y="258" width="34" height="208" rx="7" fill="#9fc3ee" stroke="#6a9bd1"/>
    <rect x="334" y="442" width="34" height="24" rx="7" fill="#ffc98f" stroke="#d8a05e"/>
    <text x="331" y="492" text-anchor="middle">MySQL</text>
    <text x="331" y="512" text-anchor="middle">pool 30</text>
    <text x="311" y="251" text-anchor="middle">1.561</text>
    <text x="351" y="435" text-anchor="middle">0.182</text>

    <rect x="434" y="263" width="34" height="203" rx="7" fill="#9fc3ee" stroke="#6a9bd1"/>
    <rect x="474" y="442" width="34" height="24" rx="7" fill="#ffc98f" stroke="#d8a05e"/>
    <text x="471" y="492" text-anchor="middle">MySQL</text>
    <text x="471" y="512" text-anchor="middle">pool 60</text>
    <text x="451" y="256" text-anchor="middle">1.525</text>
    <text x="491" y="435" text-anchor="middle">0.182</text>

    <rect x="638" y="336" width="34" height="130" rx="7" fill="#a7d8b6" stroke="#74ad86"/>
    <rect x="678" y="440" width="34" height="26" rx="7" fill="#ffc98f" stroke="#d8a05e"/>
    <text x="675" y="492" text-anchor="middle">Postgres</text>
    <text x="675" y="512" text-anchor="middle">pool 10</text>
    <text x="655" y="329" text-anchor="middle">0.972</text>
    <text x="695" y="433" text-anchor="middle">0.192</text>

    <rect x="778" y="334" width="34" height="132" rx="7" fill="#a7d8b6" stroke="#74ad86"/>
    <rect x="818" y="440" width="34" height="26" rx="7" fill="#ffc98f" stroke="#d8a05e"/>
    <text x="815" y="492" text-anchor="middle">Postgres</text>
    <text x="815" y="512" text-anchor="middle">pool 30</text>
    <text x="795" y="327" text-anchor="middle">0.990</text>
    <text x="835" y="433" text-anchor="middle">0.192</text>

    <rect x="918" y="339" width="34" height="127" rx="7" fill="#a7d8b6" stroke="#74ad86"/>
    <rect x="958" y="440" width="34" height="26" rx="7" fill="#ffc98f" stroke="#d8a05e"/>
    <text x="955" y="492" text-anchor="middle">Postgres</text>
    <text x="955" y="512" text-anchor="middle">pool 60</text>
    <text x="935" y="332" text-anchor="middle">0.951</text>
    <text x="975" y="433" text-anchor="middle">0.193</text>
  </g>

  <g font-family="goorm Sans Code" font-size="17" fill="#273846">
    <rect x="782" y="112" width="292" height="66" rx="14" fill="#f8fbfa" stroke="#d6e2dc"/>
    <rect x="806" y="126" width="22" height="18" rx="5" fill="#9fc3ee" stroke="#6a9bd1"/>
    <text x="838" y="142">JDBC + VT</text>
    <rect x="806" y="150" width="22" height="18" rx="5" fill="#ffc98f" stroke="#d8a05e"/>
    <text x="838" y="166">R2DBC + Coroutines</text>
  </g>

  <text x="96" y="548" font-family="goorm Sans Code" font-size="17" fill="#2c3e48">같은 대규모 batch에서 JDBC가 MySQL은 8.4–8.8배, PostgreSQL은 4.9–5.2배 빠릅니다.</text>
</svg>
