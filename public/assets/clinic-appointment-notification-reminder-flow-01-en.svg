<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1710" viewBox="0 0 1800 1710" role="img" aria-labelledby="title desc" data-locale="en">
<title id="title">Separate Appointment Confirmation from Notification Delivery</title><desc id="desc">The appointment transaction records intent; the notification service records delivery outcomes and next actions.</desc>
<defs>
  <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071323"/><stop offset="1" stop-color="#101a31"/></linearGradient>
  <linearGradient id="screenCanvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#13243a"/></linearGradient>
  <marker id="blueArrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#60a5fa" data-solid-head="true"/></marker>
  <marker id="cyanArrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2dd4bf" data-solid-head="true"/></marker>
  <marker id="amberArrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fbbf24" data-solid-head="true"/></marker>
  <marker id="redArrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fb7185" data-solid-head="true"/></marker>
  <marker id="purpleArrow" viewBox="0 0 10 10" markerWidth="16" markerHeight="16" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse" data-role="sequence" data-size="16x16" data-tip-direction="positive-x"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#a78bfa" data-solid-head="true"/></marker>
  <style>
    .title{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:34px;font-weight:800;fill:#f4f8ff}
    .subtitle{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:17px;fill:#a9bad0}
    .badge{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:13px;font-weight:800;fill:#c9dcf3}
    .card-title{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:18px;font-weight:800;fill:#f4f8ff}
    .card-body{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:13px;fill:#b9cbe0}
    .card-code{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:12px;font-weight:800;fill:#7fc9ff}
    .call-label{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:12px;fill:#e7f0fb}
    .route{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .blue-line{stroke:#60a5fa;marker-end:url(#blueArrow)}
    .cyan-line{stroke:#2dd4bf;marker-end:url(#cyanArrow)}
    .amber-line{stroke:#fbbf24;marker-end:url(#amberArrow)}
    .red-line{stroke:#fb7185;marker-end:url(#redArrow)}
    .purple-line{stroke:#a78bfa;marker-end:url(#purpleArrow)}
    .label-bg{fill:#0d1b2f;stroke:#2d4665;stroke-width:1.5}
    .decision-title{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:22px;font-weight:800;fill:#e5d9ff}
    .decision-body{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:14px;fill:#d2c4f4}
    .outcome-code{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:18px;font-weight:800;fill:#f8fbff}
    .outcome-body{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-size:15px;fill:#b7c7da}
    .ui-eyebrow,.ui-label,.ui-mono,.ui-button{font-family:"Comic Mono", "SFMono-Regular", monospace}
    .ui-title,.ui-section,.ui-value,.ui-card-title{font-family:"Architects Daughter", "Comic Sans MS", cursive;font-weight:800;fill:#f4f8ff}
    .ui-eyebrow{font-size:12px;font-weight:800;fill:#7fc9ff}
    .ui-title{font-size:34px}.ui-section{font-size:18px}.ui-card-title{font-size:22px}
    .ui-label,.ui-mono{font-size:13px;fill:#dce8f5}.ui-mono{font-size:12px}.ui-value{font-size:40px}
    .ui-button{font-size:12px;font-weight:800}
    .ui-muted{font-family:"Comic Mono", "SFMono-Regular", monospace;font-size:12px;fill:#91a8c3}
    .divider{stroke:#263d59;stroke-width:1}
  </style>
</defs>
<rect width="1800" height="1710" fill="url(#canvas)"/><rect x="24" y="24" width="1752" height="1662" rx="32" fill="none" stroke="#2d4665" stroke-width="2"/>
<text class="title" x="64" y="76" >Separate Appointment Confirmation from Notification Delivery</text><text class="subtitle" x="66" y="108" >The appointment transaction records intent; the notification service records delivery outcomes and next actions.</text>
<rect x="72" y="130" width="300" height="34" rx="17" fill="#12243a" stroke="#3a5877"/><text class="badge" x="222" y="152" text-anchor="middle">SCOPE / selected clinic</text><rect x="402" y="130" width="300" height="34" rx="17" fill="#12243a" stroke="#3a5877"/><text class="badge" x="552" y="152" text-anchor="middle">VERSION / f0c7614</text><rect x="732" y="130" width="300" height="34" rx="17" fill="#12243a" stroke="#3a5877"/><text class="badge" x="882" y="152" text-anchor="middle">DATA / synthetic mockup</text>
<g id="appointmentCommand"><rect id="appointmentCommand-card" class="card" x="80" y="230" width="320" height="150" rx="22" fill="#112139" stroke="#60a5fa" stroke-width="2"/><rect x="100" y="248" width="8" height="114" rx="4" fill="#60a5fa" opacity=".8"/><text class="card-code" x="126" y="256" >COMMAND</text><text class="card-title" x="126" y="276" >Appointment command transaction</text><text class="card-body" x="126" y="312" ><tspan x="126" dy="0">notification intent + idempotency key</tspan><tspan x="126" dy="23">no provider call</tspan></text></g>
<g id="outbox"><rect id="outbox-card" class="card" x="500" y="230" width="320" height="150" rx="22" fill="#112139" stroke="#60a5fa" stroke-width="2"/><rect x="520" y="248" width="8" height="114" rx="4" fill="#60a5fa" opacity=".8"/><text class="card-code" x="546" y="256" >DURABLE</text><text class="card-title" x="546" y="276" >Notification outbox</text><text class="card-body" x="546" y="312" ><tspan x="546" dy="0">store the minimum row durably</tspan><tspan x="546" dy="23">separate from booking transaction</tspan></text></g>
<g id="routeGate"><rect id="routeGate-card" class="card" x="920" y="230" width="320" height="150" rx="22" fill="#112139" stroke="#60a5fa" stroke-width="2"/><rect x="940" y="248" width="8" height="114" rx="4" fill="#60a5fa" opacity=".8"/><text class="card-code" x="966" y="256" >ROUTE</text><text class="card-title" x="966" y="276" >Delivery route gate</text><text class="card-body" x="966" y="312" ><tspan x="966" dy="0">SHADOW · CANARY · ACTIVE</tspan><tspan x="966" dy="23">PAUSED bypasses provider</tspan></text></g>
<g id="leaseClaim"><rect id="leaseClaim-card" class="card" x="1340" y="230" width="320" height="150" rx="22" fill="#112139" stroke="#60a5fa" stroke-width="2"/><rect x="1360" y="248" width="8" height="114" rx="4" fill="#60a5fa" opacity=".8"/><text class="card-code" x="1386" y="256" >CLAIM</text><text class="card-title" x="1386" y="276" >Lease and fencing claim</text><text class="card-body" x="1386" y="312" ><tspan x="1386" dy="0">claim work with a DB lease</tspan><tspan x="1386" dy="23">fence duplicate workers</tspan></text></g>
<g id="profileResolver"><rect id="profileResolver-card" class="card" x="1340" y="620" width="320" height="150" rx="22" fill="#112139" stroke="#60a5fa" stroke-width="2"/><rect x="1360" y="638" width="8" height="114" rx="4" fill="#60a5fa" opacity=".8"/><text class="card-code" x="1386" y="646" >READ AT SEND</text><text class="card-title" x="1386" y="666" >Member notification profile resolver</text><text class="card-body" x="1386" y="702" ><tspan x="1386" dy="0">read at send time</tspan><tspan x="1386" dy="23">contact · language · consent</tspan></text></g>
<g id="templateRenderer"><rect id="templateRenderer-card" class="card" x="920" y="620" width="320" height="150" rx="22" fill="#112139" stroke="#60a5fa" stroke-width="2"/><rect x="940" y="638" width="8" height="114" rx="4" fill="#60a5fa" opacity=".8"/><text class="card-code" x="966" y="646" >TYPED</text><text class="card-title" x="966" y="666" >Typed template renderer</text><text class="card-body" x="966" y="702" ><tspan x="966" dy="0">validate consent and destination</tspan><tspan x="966" dy="23">build channel payload</tspan></text></g>
<g id="provider"><rect id="provider-card" class="card" x="500" y="620" width="320" height="150" rx="22" fill="#112139" stroke="#fb7185" stroke-width="2"/><rect x="520" y="638" width="8" height="114" rx="4" fill="#fb7185" opacity=".8"/><text class="card-code" x="546" y="646" >BOUNDARY</text><text class="card-title" x="546" y="666" >Provider channel</text><text class="card-body" x="546" y="702" ><tspan x="546" dy="0">SMS and email call boundary</tspan><tspan x="546" dy="23">do not store raw payload</tspan></text></g>
<g id="durableOutcome"><rect id="durableOutcome-card" class="card" x="80" y="620" width="320" height="150" rx="22" fill="#112139" stroke="#60a5fa" stroke-width="2"/><rect x="100" y="638" width="8" height="114" rx="4" fill="#60a5fa" opacity=".8"/><text class="card-code" x="126" y="646" >QUERY</text><text class="card-title" x="126" y="666" >Durable outcome and STAFF status query</text><text class="card-body" x="126" y="702" ><tspan x="126" dy="0">status + reason code</tspan><tspan x="126" dy="23">next action + next time</tspan></text></g>
<g id="recoveryScanner"><rect id="recoveryScanner-card" class="card" x="80" y="930" width="420" height="150" rx="22" fill="#112139" stroke="#fbbf24" stroke-width="2"/><rect x="100" y="948" width="8" height="114" rx="4" fill="#fbbf24" opacity=".8"/><text class="card-code" x="126" y="956" >RECOVERY</text><text class="card-title" x="126" y="976" >Reminder recovery scanner</text><text class="card-body" x="126" y="1012" ><tspan x="126" dy="0">future · due · missed</tspan><tspan x="126" dy="23">converge on already exists</tspan></text></g>

<g data-from="appointmentCommand" data-to="outbox"><path id="command-outbox" class="route blue-line" data-connector="command-outbox" data-source-node="appointmentCommand" data-target-node="outbox" d="M400 305 H500"/><g class="relationshiplabel"><rect class="label-bg" x="390" y="185" width="200" height="28" rx="14"/><text class="call-label" x="490" y="204" text-anchor="middle">record notification intent</text></g></g>
<g data-from="outbox" data-to="routeGate"><path id="outbox-route" class="route purple-line" data-connector="outbox-route" data-source-node="outbox" data-target-node="routeGate" d="M820 305 H920"/><g class="relationshiplabel"><rect class="label-bg" x="810" y="185" width="200" height="28" rx="14"/><text class="call-label" x="910" y="204" text-anchor="middle">check route gate</text></g></g>
<g data-from="routeGate" data-to="leaseClaim"><path id="route-lease" class="route blue-line" data-connector="route-lease" data-source-node="routeGate" data-target-node="leaseClaim" d="M1240 305 H1340"/><g class="relationshiplabel"><rect class="label-bg" x="1230" y="185" width="200" height="28" rx="14"/><text class="call-label" x="1330" y="204" text-anchor="middle">claim work</text></g></g>
<g data-from="leaseClaim" data-to="profileResolver"><path id="lease-profile" class="route cyan-line" data-connector="lease-profile" data-source-node="leaseClaim" data-target-node="profileResolver" d="M1500 380 V620"/><g class="relationshiplabel"><rect class="label-bg" x="1515" y="475" width="240" height="28" rx="14"/><text class="call-label" x="1635" y="494" text-anchor="middle">profile at send time</text></g></g>
<g data-from="profileResolver" data-to="templateRenderer"><path id="profile-template" class="route cyan-line" data-connector="profile-template" data-source-node="profileResolver" data-target-node="templateRenderer" d="M1340 695 H1240"/><g class="relationshiplabel"><rect class="label-bg" x="1170" y="575" width="240" height="28" rx="14"/><text class="call-label" x="1290" y="594" text-anchor="middle">typed payload</text></g></g>
<g data-from="templateRenderer" data-to="provider"><path id="template-provider" class="route amber-line" data-connector="template-provider" data-source-node="templateRenderer" data-target-node="provider" d="M920 695 H820"/><g class="relationshiplabel"><rect class="label-bg" x="770" y="575" width="200" height="28" rx="14"/><text class="call-label" x="870" y="594" text-anchor="middle">call provider</text></g></g>
<g data-from="provider" data-to="durableOutcome"><path id="provider-outcome" class="route cyan-line" data-connector="provider-outcome" data-source-node="provider" data-target-node="durableOutcome" d="M500 695 H400"/><g class="relationshiplabel"><rect class="label-bg" x="310" y="575" width="230" height="28" rx="14"/><text class="call-label" x="425" y="594" text-anchor="middle">store outcome</text></g></g>
<g data-from="durableOutcome" data-to="finalDecision"><path id="durable-decision" class="route blue-line" data-connector="durable-decision" data-source-node="durableOutcome" data-target-node="finalDecision" d="M240 770 V850 Q240 880 270 880 H570 Q600 880 600 910 V930"/><g class="relationshiplabel"><rect class="label-bg" x="300" y="820" width="280" height="28" rx="14"/><text class="call-label" x="440" y="839" text-anchor="middle">check outcome and policy</text></g></g>
<g data-from="recoveryScanner" data-to="finalDecision"><path id="recovery-decision" class="route amber-line" data-connector="recovery-decision" data-source-node="recoveryScanner" data-target-node="finalDecision" d="M500 1005 H600"/></g>
<g data-from="recoveryScanner" data-to="durableOutcome"><path id="recovery-status" class="route blue-line" data-connector="recovery-status" data-source-node="recoveryScanner" data-target-node="durableOutcome" d="M160 930 V770"/><g class="relationshiplabel"><rect class="label-bg" x="10" y="820" width="200" height="28" rx="14"/><text class="call-label" x="110" y="839" text-anchor="middle">query checkpoint</text></g></g>
<rect class="card" id="finalDecision-card" x="600" y="930" width="560" height="190" rx="22" fill="#171b36" stroke="#a78bfa" stroke-width="2" opacity=".96"/>
<text class="decision-title" x="880" y="1000" text-anchor="middle">Final State Decision</text><text class="decision-body" x="880" y="1040" text-anchor="middle"><tspan x="880" dy="0">SENT · SUPPRESSED</tspan><tspan x="880" dy="26">RETRY_WAIT · EXHAUSTED</tspan></text>
<path id="decision-outcome-0" class="route cyan-line" data-connector="decision-outcome-0" data-source-node="finalDecision" data-target-node="outcome-0" d="M720 1120 V1160 Q720 1190 690 1190 H280 Q250 1190 250 1220 V1340"/>
<path id="decision-outcome-1" class="route purple-line" data-connector="decision-outcome-1" data-source-node="finalDecision" data-target-node="outcome-1" d="M820 1120 V1200 Q820 1230 790 1230 H700 Q670 1230 670 1260 V1340"/>
<path id="decision-outcome-2" class="route amber-line" data-connector="decision-outcome-2" data-source-node="finalDecision" data-target-node="outcome-2" d="M940 1120 V1240 Q940 1270 970 1270 H1060 Q1090 1270 1090 1300 V1340"/>
<path id="decision-outcome-3" class="route red-line" data-connector="decision-outcome-3" data-source-node="finalDecision" data-target-node="outcome-3" d="M1040 1120 V1140 Q1040 1170 1070 1170 H1480 Q1510 1170 1510 1200 V1340"/><g id="outcome-0"><rect id="outcome-0-card" class="card" x="72" y="1340" width="360" height="190" rx="22" fill="#101f34" stroke="#2dd4bf" stroke-width="2"/><text class="outcome-code" x="252" y="1398" text-anchor="middle">SENT</text><text class="outcome-body" x="252" y="1440" text-anchor="middle">Re-read status to confirm</text><text class="outcome-body" x="252" y="1492" text-anchor="middle">visible in the action queue</text></g>
<g id="outcome-1"><rect id="outcome-1-card" class="card" x="492" y="1340" width="360" height="190" rx="22" fill="#101f34" stroke="#a78bfa" stroke-width="2"/><text class="outcome-code" x="672" y="1398" text-anchor="middle">SUPPRESSED</text><text class="outcome-body" x="672" y="1440" text-anchor="middle">Check consent or destination</text><text class="outcome-body" x="672" y="1492" text-anchor="middle">visible in the action queue</text></g>
<g id="outcome-2"><rect id="outcome-2-card" class="card" x="912" y="1340" width="360" height="190" rx="22" fill="#101f34" stroke="#fbbf24" stroke-width="2"/><text class="outcome-code" x="1092" y="1398" text-anchor="middle">RETRY_WAIT</text><text class="outcome-body" x="1092" y="1440" text-anchor="middle">Wait for the next time</text><text class="outcome-body" x="1092" y="1492" text-anchor="middle">visible in the action queue</text></g>
<g id="outcome-3"><rect id="outcome-3-card" class="card" x="1332" y="1340" width="360" height="190" rx="22" fill="#101f34" stroke="#fb7185" stroke-width="2"/><text class="outcome-code" x="1512" y="1398" text-anchor="middle">EXHAUSTED</text><text class="outcome-body" x="1512" y="1440" text-anchor="middle">Contact notification support</text><text class="outcome-body" x="1512" y="1492" text-anchor="middle">visible in the action queue</text></g><text class="ui-muted" x="72" y="1630" >Solid lines are explicit record and call paths. Every outcome branch is an independent rounded orthogonal route.</text>
</svg>
