<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">Dictionary update quality gate</title>
  <desc id="desc">A horizontal flow from resource dictionary files through normalization and focused tests to release notes and application rollout.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font-family: "Architects Daughter", "Comic Mono", ui-monospace, monospace; font-size: 38px; fill: #0f172a; }
      .body { font-family: "Comic Mono", ui-monospace, monospace; font-size: 24px; fill: #334155; }
      .small { font-family: "Comic Mono", ui-monospace, monospace; font-size: 20px; fill: #475569; }
      .light { font-family: "Comic Mono", ui-monospace, monospace; font-size: 20px; fill: #f8fafc; }
      .panel { fill: url(#panel); stroke: #0f172a; stroke-width: 4; }
      .arrow { stroke: #2563eb; stroke-width: 7; stroke-linecap: round; }
    </style>
  </defs>
  <rect width="1600" height="680" rx="0" fill="#f8fafc"/>
  <rect x="70" y="60" width="1460" height="560" rx="36" fill="#dbeafe" opacity="0.42"/>
  <text class="title" x="110" y="115">Dictionary update quality gate</text>
  <text class="body" x="110" y="158">Treat dictionary files as behavior changes, not as harmless text edits.</text>

  <g transform="translate(110 235)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="260" height="210" rx="28"/>
    <rect x="34" y="38" width="70" height="82" rx="10" fill="#bfdbfe" stroke="#0f172a" stroke-width="4"/>
    <rect x="80" y="52" width="70" height="82" rx="10" fill="#dbeafe" stroke="#0f172a" stroke-width="4"/>
    <rect x="126" y="66" width="70" height="82" rx="10" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <text class="body" x="32" y="169">Resource files</text>
  </g>

  <line class="arrow" x1="385" y1="340" x2="500" y2="340"/>
  <path d="M500 340 l-26 -20 M500 340 l-26 20" fill="none" class="arrow"/>

  <g transform="translate(520 235)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="300" height="210" rx="28"/>
    <circle cx="70" cy="74" r="28" fill="#22c55e" stroke="#0f172a" stroke-width="4"/>
    <path d="M55 74 l12 12 l28 -31" fill="none" stroke="#052e16" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="small" x="120" y="61">trim</text>
    <text class="small" x="120" y="91">dedupe</text>
    <text class="small" x="120" y="121">sort when safe</text>
    <text class="body" x="38" y="169">Normalize input</text>
  </g>

  <line class="arrow" x1="835" y1="340" x2="950" y2="340"/>
  <path d="M950 340 l-26 -20 M950 340 l-26 20" fill="none" class="arrow"/>

  <g transform="translate(970 235)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="300" height="210" rx="28"/>
    <rect x="42" y="42" width="216" height="86" rx="18" fill="#0f172a"/>
    <text class="small" x="64" y="80" fill="#93c5fd">./gradlew test</text>
    <text class="small" x="64" y="111" fill="#93c5fd">fixture PASS</text>
    <text class="body" x="48" y="169">Focused tests</text>
  </g>

  <line class="arrow" x1="1285" y1="340" x2="1365" y2="340"/>
  <path d="M1365 340 l-26 -20 M1365 340 l-26 20" fill="none" class="arrow"/>

  <g transform="translate(1385 235)" filter="url(#shadow)">
    <rect class="panel" x="0" y="0" width="125" height="210" rx="28"/>
    <circle cx="62" cy="76" r="34" fill="#dcfce7" stroke="#0f172a" stroke-width="4"/>
    <path d="M47 75 l14 14 l32 -38" fill="none" stroke="#166534" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="small" x="21" y="151">notes</text>
    <text class="small" x="29" y="181">ship</text>
  </g>

  <text class="small" x="112" y="565">Core loader: DictionaryProvider | Korean: KoreanDictionaryProvider | Japanese: JapaneseDictionaryProvider</text>
</svg>
