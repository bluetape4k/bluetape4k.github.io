<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200" role="img" aria-labelledby="title desc">
  <title id="title">실시간 예약 가능 시간 조회와 전체 일정 최적화의 선택 기준</title>
  <desc id="desc">처리 범위, 응답 시점, 판단 기준에 따라 SlotCalculationService의 실시간 예약 가능 시간 조회와 SolverService의 전체 일정 최적화를 구분한다. 휴진 재배정에서는 후보 생성과 전체 일정 최적화를 별도 진입점으로 선택할 수 있다.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f" />
      <stop offset="0.55" stop-color="#0c1730" />
      <stop offset="1" stop-color="#10142a" />
    </linearGradient>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b3e" />
      <stop offset="1" stop-color="#111d35" />
    </linearGradient>
    <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241d45" />
      <stop offset="1" stop-color="#151a34" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.58" />
    </filter>
    <marker id="arrowCyan" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#58a6c9" />
    </marker>
    <marker id="arrowPurple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#a78bfa" />
    </marker>
    <style>
      .title { font-family: 'goorm Sans', sans-serif; font-size: 42px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'goorm Sans', sans-serif; font-size: 20px; fill: #a9b8d4; }
      .panel-title { font-family: 'goorm Sans', sans-serif; font-size: 30px; font-weight: 700; fill: #f8fafc; }
      .card-title { font-family: 'goorm Sans', sans-serif; font-size: 21px; font-weight: 700; fill: #f8fafc; }
      .body { font-family: 'goorm Sans', sans-serif; font-size: 17px; fill: #c7d3e7; }
      .small { font-family: 'goorm Sans', sans-serif; font-size: 15px; fill: #a9b8d4; }
      .mono { font-family: 'goorm Sans Code', 'goorm Sans', monospace; font-size: 17px; font-weight: 700; fill: #f8fafc; }
      .question { font-family: 'goorm Sans', sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; }
      .connector { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 4; }
      .cyan { stroke: #58a6c9; marker-end: url(#arrowCyan); }
      .purple { stroke: #a78bfa; marker-end: url(#arrowPurple); }
    </style>
  </defs>

  <rect width="2000" height="1200" rx="32" fill="url(#canvas)" />
  <rect x="28" y="28" width="1944" height="1144" rx="28" fill="none" stroke="#263a5e" stroke-width="2" />

  <text class="title" x="1000" y="70" text-anchor="middle">한 건의 조회와 전체 일정 최적화는 서로 다른 요청이다</text>
  <text class="subtitle" x="1000" y="108" text-anchor="middle">복잡도가 아니라 처리 범위 · 응답 시점 · 비교할 일정 수로 구분합니다.</text>

  <g aria-label="선택 질문">
    <rect x="60" y="140" width="1880" height="190" rx="28" fill="#0f1d32" stroke="#2b4168" stroke-width="2" />
    <text class="card-title" x="100" y="184">먼저 확인할 세 가지</text>

    <g filter="url(#shadow)">
      <rect x="100" y="210" width="530" height="86" rx="18" fill="#14283a" stroke="#4f6f91" stroke-width="2" />
      <text class="question" x="365" y="242" text-anchor="middle">처리 범위</text>
      <text class="small" x="365" y="271" text-anchor="middle">한 요청의 후보인가, 여러 예약의 조합인가?</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="735" y="210" width="530" height="86" rx="18" fill="#14283a" stroke="#4f6f91" stroke-width="2" />
      <text class="question" x="1000" y="242" text-anchor="middle">응답 시점</text>
      <text class="small" x="1000" y="271" text-anchor="middle">API 응답 안에 끝내야 하는가, 별도 실행 시간을 둘 수 있는가?</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1370" y="210" width="530" height="86" rx="18" fill="#14283a" stroke="#4f6f91" stroke-width="2" />
      <text class="question" x="1635" y="242" text-anchor="middle">판단 기준</text>
      <text class="small" x="1635" y="271" text-anchor="middle">가능한 후보인가, 전체 점수가 더 좋은 배치인가?</text>
    </g>
  </g>

  <g aria-label="실시간 예약 가능 시간 조회">
    <rect x="60" y="370" width="900" height="620" rx="28" fill="url(#leftPanel)" stroke="#58a6c9" stroke-width="2" />
    <rect x="90" y="400" width="310" height="44" rx="14" fill="#15344b" stroke="#58a6c9" />
    <text class="mono" x="245" y="428" text-anchor="middle">SlotCalculationService</text>
    <text class="panel-title" x="100" y="488">실시간 예약 가능 시간 조회</text>
    <text class="subtitle" x="100" y="522">한 환자가 선택할 수 있는 시간을 계산</text>

    <path class="connector cyan" data-connector="left-input-filter" d="M 510 640 V 678" />
    <path class="connector cyan" data-connector="left-filter-result" d="M 510 800 V 838" />

    <g filter="url(#shadow)">
      <rect x="110" y="560" width="800" height="80" rx="18" fill="#15344b" stroke="#58a6c9" stroke-width="2" />
      <text class="card-title" x="150" y="592">입력 범위</text>
      <text class="body" x="150" y="620">병원 · 날짜 · 의사 · 진료 유형으로 계산 범위를 좁힌다</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="110" y="680" width="800" height="120" rx="18" fill="#142d40" stroke="#58a6c9" stroke-width="2" />
      <text class="card-title" x="150" y="714">계산 방식</text>
      <text class="body" x="150" y="744">업무시간의 교집합에서 휴식 · 휴진 · 부재를 제외하고</text>
      <text class="body" x="150" y="773">정해진 시간 범위의 후보를 동시 진료 수와 장비 조건으로 거른다</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="110" y="840" width="800" height="100" rx="18" fill="#203744" stroke="#8da66b" stroke-width="2" />
      <text class="card-title" x="150" y="875">반환값과 호출 시점</text>
      <text class="body" x="150" y="905">가능한 시간 목록 · 남은 수용 인원 · 사용 가능한 장비</text>
      <text class="small" x="150" y="930">환자 화면의 API 요청 · 휴진 재배정 후보 생성</text>
    </g>
  </g>

  <g aria-label="전체 일정 최적화">
    <rect x="1040" y="370" width="900" height="620" rx="28" fill="url(#rightPanel)" stroke="#a78bfa" stroke-width="2" />
    <rect x="1070" y="400" width="250" height="44" rx="14" fill="#30245b" stroke="#a78bfa" />
    <text class="mono" x="1195" y="428" text-anchor="middle">SolverService</text>
    <text class="panel-title" x="1080" y="488">전체 일정 최적화</text>
    <text class="subtitle" x="1080" y="522">여러 예약과 자원의 조합을 점수로 비교</text>

    <path class="connector purple" data-connector="right-input-search" d="M 1490 640 V 678" />
    <path class="connector purple" data-connector="right-search-result" d="M 1490 800 V 838" />

    <g filter="url(#shadow)">
      <rect x="1090" y="560" width="800" height="80" rx="18" fill="#30245b" stroke="#a78bfa" stroke-width="2" />
      <text class="card-title" x="1130" y="592">입력 범위</text>
      <text class="body" x="1130" y="620">한 병원의 날짜 범위 · 여러 예약 · 의사 · 장비 · 운영 규칙</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1090" y="680" width="800" height="120" rx="18" fill="#2b244f" stroke="#a78bfa" stroke-width="2" />
      <text class="card-title" x="1130" y="714">탐색 방식</text>
      <text class="body" x="1130" y="744">담당 의사 · 날짜 · 시작 시각을 바꾼 여러 일정 후보를 만들고</text>
      <text class="body" x="1130" y="773">필수 제약의 위반 여부와 선호 목표의 점수를 반복해서 비교한다</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1090" y="840" width="800" height="100" rx="18" fill="#312c54" stroke="#c4b5fd" stroke-width="2" />
      <text class="card-title" x="1130" y="875">반환값과 호출 시점</text>
      <text class="body" x="1130" y="905">예약별 배정 결과 · 제약 점수 · 실행 시간 · 필수 제약 충족 여부</text>
      <text class="small" x="1130" y="930">관리자 배치 작업 · 휴진 범위의 전체 재배치 검토</text>
    </g>
  </g>

  <g aria-label="휴진 재배정에서의 선택">
    <path class="connector cyan" data-connector="left-reschedule" d="M 510 990 V 1016 Q 510 1030 524 1030 H 686 Q 700 1030 700 1044 V 1055" />
    <path class="connector purple" data-connector="right-reschedule" d="M 1490 990 V 1016 Q 1490 1030 1476 1030 H 1314 Q 1300 1030 1300 1044 V 1055" />
    <rect x="260" y="1055" width="1480" height="90" rx="22" fill="#121f35" stroke="#4f6f91" stroke-width="2" />
    <text class="card-title" x="1000" y="1090" text-anchor="middle">휴진 재배정에서는 업무 단계에 맞춰 두 경로를 선택한다</text>
    <text class="small" x="1000" y="1121" text-anchor="middle">현재 구현은 후보를 저장하는 Greedy 경로와 날짜 범위를 다시 계산하는 Solver 경로를 별도 진입점으로 제공합니다.</text>
  </g>

  <circle cx="690" cy="1168" r="7" fill="#58a6c9" /><text class="small" x="708" y="1174">빠른 예약 가능 여부 계산</text>
  <circle cx="1010" cy="1168" r="7" fill="#a78bfa" /><text class="small" x="1028" y="1174">점수 기반 전체 탐색</text>
  <text class="small" x="1900" y="1174" text-anchor="end">Greedy는 열등한 방식이 아니라 다른 업무 요청에 맞는 경로입니다.</text>
</svg>
