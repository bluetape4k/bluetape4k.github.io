<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Authorization inheritance latency comparison for GraphDB adoption</title>
  <desc id="desc">Large authorization inheritance benchmark comparison of Neo4j Cypher, PostgreSQL CTE, and PostgreSQL iterative traversal in milliseconds per operation. Lower is better.</desc>
  <defs>
    <style>
      .title { font-family: "goorm Sans", Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: "goorm Sans Code", "SFMono-Regular", monospace; font-size: 17px; fill: #cbd5e1; }
      .panel-title { font-family: "goorm Sans", Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #f8fafc; }
      .winner { font-family: "goorm Sans", Arial, sans-serif; font-size: 16px; fill: #a7f3d0; }
      .label { font-family: "goorm Sans Code", "SFMono-Regular", monospace; font-size: 16px; fill: #e2e8f0; }
      .value { font-family: "goorm Sans Code", "SFMono-Regular", monospace; font-size: 16px; font-weight: 700; fill: #f8fafc; }
      .small { font-family: "goorm Sans", Arial, sans-serif; font-size: 15px; fill: #cbd5e1; }
      .axis { stroke: #475569; stroke-width: 1.5; }
      .tick { font-family: "goorm Sans Code", "SFMono-Regular", monospace; font-size: 13px; fill: #94a3b8; }
    </style>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="740" rx="28" fill="url(#canvas)"/>
  <rect x="24" y="24" width="1152" height="692" rx="22" fill="none" stroke="#334155" stroke-width="2"/>
  <text class="title" x="64" y="83">Authorization inheritance latency comparison for GraphDB adoption</text>
  <text class="subtitle" x="64" y="115">large fixture · resolveResources · ms/op · lower is better</text>
  <text class="small" x="64" y="143">Bar lengths are scaled to the maximum value inside each scenario panel.</text>

  <g transform="translate(64 180)">
    <rect width="512" height="414" rx="18" fill="#172033" stroke="#334155" stroke-width="2"/>
    <text class="panel-title" x="32" y="47">long-chain (10 hops)</text>
    <text class="winner" x="32" y="75">Winner · Neo4j Cypher</text>
    <line class="axis" x1="250" y1="322" x2="464" y2="322"/>
    <text class="tick" x="250" y="346">0</text>
    <text class="tick" x="410" y="346">55.364</text>
    <text class="label" x="32" y="138">Neo4j Cypher</text>
    <rect x="250" y="117" width="49" height="32" rx="7" fill="#60a5fa"/>
    <text class="value" x="315" y="139">12.731</text>
    <text class="label" x="32" y="210">PostgreSQL CTE</text>
    <rect x="250" y="189" width="214" height="32" rx="7" fill="#34d399"/>
    <text class="value" x="378" y="211">55.364</text>
    <text class="label" x="32" y="282">PostgreSQL iterative</text>
    <rect x="250" y="261" width="184" height="32" rx="7" fill="#fbbf24"/>
    <text class="value" x="446" y="283">47.568</text>
  </g>

  <g transform="translate(624 180)">
    <rect width="512" height="414" rx="18" fill="#172033" stroke="#334155" stroke-width="2"/>
    <text class="panel-title" x="32" y="47">deep-wide (12 hops)</text>
    <text class="winner" x="32" y="75">Winner · PostgreSQL CTE</text>
    <line class="axis" x1="250" y1="322" x2="464" y2="322"/>
    <text class="tick" x="250" y="346">0</text>
    <text class="tick" x="410" y="346">56.467</text>
    <text class="label" x="32" y="138">Neo4j Cypher</text>
    <rect x="250" y="117" width="214" height="32" rx="7" fill="#60a5fa"/>
    <text class="value" x="378" y="139">56.467</text>
    <text class="label" x="32" y="210">PostgreSQL CTE</text>
    <rect x="250" y="189" width="44" height="32" rx="7" fill="#34d399"/>
    <text class="value" x="310" y="211">11.596</text>
    <text class="label" x="32" y="282">PostgreSQL iterative</text>
    <rect x="250" y="261" width="106" height="32" rx="7" fill="#fbbf24"/>
    <text class="value" x="372" y="283">27.836</text>
  </g>

  <g transform="translate(64 646)">
    <rect x="0" y="-14" width="22" height="14" rx="4" fill="#60a5fa"/>
    <text class="small" x="32" y="-2">Neo4j Cypher</text>
    <rect x="188" y="-14" width="22" height="14" rx="4" fill="#34d399"/>
    <text class="small" x="220" y="-2">PostgreSQL CTE</text>
    <rect x="394" y="-14" width="22" height="14" rx="4" fill="#fbbf24"/>
    <text class="small" x="426" y="-2">PostgreSQL iterative</text>
    <text class="small" x="690" y="-2">AGE: timeout &gt;75s · Memgraph: local large-fixture load failed</text>
  </g>
</svg>
