<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="780" viewBox="0 0 1580 780" role="img">
<title>Spring Boot 4 and Ktor Application Layer</title>
<desc>Application 모듈은 shared foundation 위에서 wiring을 명시적으로 유지합니다.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1D3148" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#4D6F9F"/></marker>
  <style>
    .bg{fill:#F7F9FC}.frame{fill:#fff;stroke:#D6E2ED;stroke-width:2}
    .title{font-family:"goorm Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:36px;fill:#21334A;font-weight:700}
    .subtitle,.body,.small{font-family:"goorm Sans Code","goorm Sans","D2Coding",monospace;fill:#34465B}
    .subtitle{font-size:16px}.body{font-size:15px}.small{font-size:12px;fill:#657386}
    .label{font-family:"goorm Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-size:20px;fill:#21334A;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke:#4D6F9F;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .bar-label{font-family:"goorm Sans Code","goorm Sans","D2Coding",monospace;font-size:15px;fill:#26384F}.axis{stroke:#B8C7D9;stroke-width:2}
  </style>
</defs>
<rect class="bg" width="1580" height="780"/>
<rect class="frame" x="34" y="28" width="1512" height="724" rx="24"/>
<text class="title" x="70" y="82">Spring Boot 4 and Ktor Application Layer</text>
<text class="subtitle" x="72" y="114">Application 모듈은 shared foundation 위에서 wiring을 명시적으로 유지합니다.</text>
<g data-card="Shared Foundation">
  <rect class="card" x="60" y="210" width="260" height="126" rx="14" fill="#E8F1FF" stroke="#5A85D6"/>
  <text class="label" x="190" y="244" text-anchor="middle"><tspan x="190" dy="0">Shared Foundation</tspan></text>
  <text class="body" x="190" y="278" text-anchor="middle"><tspan x="190" dy="0">BOM · core · coroutines</tspan><tspan x="190" dy="20">I/O · data · infra · utils</tspan></text>
</g>
<g data-card="Spring Boot 4">
  <rect class="card" x="420" y="210" width="300" height="126" rx="14" fill="#EAF7ED" stroke="#58A978"/>
  <text class="label" x="570" y="244" text-anchor="middle"><tspan x="570" dy="0">Spring Boot 4</tspan></text>
  <text class="body" x="570" y="278" text-anchor="middle"><tspan x="570" dy="0">WebFlux + coroutines</tspan><tspan x="570" dy="20">Redis · R2DBC · MongoDB</tspan><tspan x="570" dy="20">Hibernate Lettuce</tspan></text>
</g>
<g data-card="Configuration">
  <rect class="card" x="820" y="210" width="300" height="126" rx="14" fill="#E7F7F5" stroke="#3CA7A0"/>
  <text class="label" x="970" y="244" text-anchor="middle"><tspan x="970" dy="0">Configuration</tspan></text>
  <text class="body" x="970" y="278" text-anchor="middle"><tspan x="970" dy="0">BOM platform import</tspan><tspan x="970" dy="20">명시적인 bean/plugin</tspan></text>
</g>
<g data-card="Running Service">
  <rect class="card" x="1220" y="210" width="250" height="126" rx="14" fill="#FFF3D8" stroke="#D6A441"/>
  <text class="label" x="1345" y="244" text-anchor="middle"><tspan x="1345" dy="0">Running Service</tspan></text>
  <text class="body" x="1345" y="278" text-anchor="middle"><tspan x="1345" dy="0">API boundary</tspan><tspan x="1345" dy="20">관측하고 검증한 runtime</tspan></text>
</g>
<g data-card="Shared Foundation">
  <rect class="card" x="60" y="470" width="260" height="126" rx="14" fill="#E8F1FF" stroke="#5A85D6"/>
  <text class="label" x="190" y="504" text-anchor="middle"><tspan x="190" dy="0">Shared Foundation</tspan></text>
  <text class="body" x="190" y="538" text-anchor="middle"><tspan x="190" dy="0">BOM · core · coroutines</tspan><tspan x="190" dy="20">I/O · data · infra · utils</tspan></text>
</g>
<g data-card="Ktor 3">
  <rect class="card" x="420" y="470" width="300" height="126" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="label" x="570" y="504" text-anchor="middle"><tspan x="570" dy="0">Ktor 3</tspan></text>
  <text class="body" x="570" y="538" text-anchor="middle"><tspan x="570" dy="0">core · observability</tspan><tspan x="570" dy="20">OpenAPI · resilience4j</tspan><tspan x="570" dy="20">testing helpers</tspan></text>
</g>
<g data-card="Tests">
  <rect class="card" x="820" y="470" width="300" height="126" rx="14" fill="#FCECEF" stroke="#DC6B82"/>
  <text class="label" x="970" y="504" text-anchor="middle"><tspan x="970" dy="0">Tests</tspan></text>
  <text class="body" x="970" y="538" text-anchor="middle"><tspan x="970" dy="0">WebTestClient</tspan><tspan x="970" dy="20">testApplication</tspan><tspan x="970" dy="20">Testcontainers</tspan></text>
</g>
<g data-card="Running Service">
  <rect class="card" x="1220" y="470" width="250" height="126" rx="14" fill="#FFF3D8" stroke="#D6A441"/>
  <text class="label" x="1345" y="504" text-anchor="middle"><tspan x="1345" dy="0">Running Service</tspan></text>
  <text class="body" x="1345" y="538" text-anchor="middle"><tspan x="1345" dy="0">API boundary</tspan><tspan x="1345" dy="20">관측하고 검증한 runtime</tspan></text>
</g>
<path class="connector" data-connector="foundation-to-spring-boot-4" d="M320 273 H420"/>
<path class="connector" data-connector="spring-boot-4-to-configuration" d="M720 273 H820"/>
<path class="connector" data-connector="configuration-to-running-service" d="M1120 273 H1220"/>
<path class="connector" data-connector="foundation-to-ktor-3" d="M320 533 H420"/>
<path class="connector" data-connector="ktor-3-to-tests" d="M720 533 H820"/>
