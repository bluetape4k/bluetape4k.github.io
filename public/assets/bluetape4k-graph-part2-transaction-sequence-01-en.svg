<rect x="88" y="655" width="1324" height="62" rx="12" fill="#F8FBFE" stroke="#D7E2EC"/>
<text class="footer" x="750" y="680" text-anchor="middle">Transaction blocks avoid lifecycle commands so DDL and auto-commit rules stay storage-specific.</text>
<text class="footer" x="750" y="704" text-anchor="middle">Batch defaults are portable; adapters can override them for native all-or-fail behavior.</text>
</svg>
