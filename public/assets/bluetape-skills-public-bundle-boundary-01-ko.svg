<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">공개 스킬 묶음의 배포 경계</title>
  <desc id="desc">정식 스킬 원본은 재사용 가능한 실행 자료만 공개 묶음으로 내보내고 개인 런타임 상태는 배포 대상에서 제외합니다.</desc>
  <style>
    .title { font-family: 'goorm Sans'; fill: #f1f5f9; font-size: 34px; }
    .region-title { font-family: 'goorm Sans'; fill: #f1f5f9; font-size: 23px; }
    .subtitle, .label, .small { font-family: 'goorm Sans Code'; fill: #c2cede; }
    .subtitle { font-size: 15px; }
    .label { font-size: 15px; }
    .small { font-size: 14px; }
    .connector { fill: none; stroke: #60a5fa; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#94a3b8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 13 7 L 0 13 Z" fill="#60a5fa"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#0b1220"/>
  <rect x="24" y="24" width="1152" height="672" rx="28" fill="#111c2e" stroke="#33475f" stroke-width="2"/>

  <text x="56" y="76" class="title">실행 계약은 공유하고 개인 런타임은 분리하기</text>
  <text x="58" y="108" class="subtitle">이식 가능한 스킬 묶음에는 지침 실행에 필요한 자료만 넣고 개인 환경은 제외합니다.</text>

  <path class="connector" d="M 300 365 H 380" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="50" y="150" width="250" height="430" rx="28" fill="#241d3b" stroke="#c084fc" stroke-width="2.5"/>
    <rect x="380" y="130" width="440" height="500" rx="32" fill="#101f35" stroke="#60a5fa" stroke-width="3"/>
    <rect x="900" y="150" width="250" height="430" rx="28" fill="#2b1b23" stroke="#fb7185" stroke-width="2.5"/>
  </g>

  <text x="175" y="187" text-anchor="middle" class="region-title">정식 스킬</text>
  <text x="175" y="213" text-anchor="middle" class="region-title">원본</text>
  <text x="175" y="239" text-anchor="middle" class="small">관리·검토 대상</text>

  <g filter="url(#shadow)">
    <rect x="78" y="255" width="194" height="70" rx="14" fill="#30264a" stroke="#c084fc" stroke-width="2"/>
    <rect x="78" y="345" width="194" height="70" rx="14" fill="#30264a" stroke="#c084fc" stroke-width="2"/>
    <rect x="78" y="435" width="194" height="70" rx="14" fill="#30264a" stroke="#c084fc" stroke-width="2"/>
  </g>
  <text x="175" y="284" text-anchor="middle" class="label">관리 원본</text>
  <text x="175" y="307" text-anchor="middle" class="small">단일 기준점</text>
  <text x="175" y="374" text-anchor="middle" class="label">정식 스킬 14개</text>
  <text x="175" y="397" text-anchor="middle" class="small">허용 목록</text>
  <text x="175" y="464" text-anchor="middle" class="label">원본 우선 내보내기</text>
  <text x="175" y="487" text-anchor="middle" class="small">공유 전 검증</text>

  <text x="600" y="172" text-anchor="middle" class="region-title">공개 묶음</text>
  <text x="600" y="197" text-anchor="middle" class="small">완전한 실행 계약</text>

  <g filter="url(#shadow)">
    <rect x="420" y="220" width="360" height="58" rx="14" fill="#132945" stroke="#60a5fa" stroke-width="2"/>
    <rect x="420" y="294" width="360" height="58" rx="14" fill="#132945" stroke="#60a5fa" stroke-width="2"/>
    <rect x="420" y="368" width="360" height="58" rx="14" fill="#132945" stroke="#60a5fa" stroke-width="2"/>
    <rect x="420" y="442" width="360" height="58" rx="14" fill="#132945" stroke="#60a5fa" stroke-width="2"/>
    <rect x="420" y="516" width="360" height="58" rx="14" fill="#132945" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="600" y="256" text-anchor="middle" class="label">SKILL.md</text>
  <text x="600" y="330" text-anchor="middle" class="label">참조 자료/</text>
  <text x="600" y="404" text-anchor="middle" class="label">템플릿/</text>
  <text x="600" y="478" text-anchor="middle" class="label">스크립트/</text>
  <text x="600" y="552" text-anchor="middle" class="label">manifest.json</text>

  <text x="1025" y="194" text-anchor="middle" class="region-title">개인 런타임</text>
  <text x="1025" y="221" text-anchor="middle" class="small">배포 대상에서 제외</text>

  <g filter="url(#shadow)">
    <rect x="928" y="250" width="194" height="44" rx="12" fill="#3a2027" stroke="#fb7185" stroke-width="2"/>
    <rect x="928" y="305" width="194" height="44" rx="12" fill="#3a2027" stroke="#fb7185" stroke-width="2"/>
    <rect x="928" y="360" width="194" height="44" rx="12" fill="#3a2027" stroke="#fb7185" stroke-width="2"/>
    <rect x="928" y="415" width="194" height="44" rx="12" fill="#3a2027" stroke="#fb7185" stroke-width="2"/>
    <rect x="928" y="470" width="194" height="44" rx="12" fill="#3a2027" stroke="#fb7185" stroke-width="2"/>
    <rect x="928" y="525" width="194" height="44" rx="12" fill="#3a2027" stroke="#fb7185" stroke-width="2"/>
  </g>
  <text x="1025" y="278" text-anchor="middle" class="label">메모리</text>
  <text x="1025" y="333" text-anchor="middle" class="label">규칙과 훅</text>
  <text x="1025" y="388" text-anchor="middle" class="label">설정</text>
  <text x="1025" y="443" text-anchor="middle" class="label">플러그인 캐시</text>
  <text x="1025" y="498" text-anchor="middle" class="label">비밀 정보</text>
  <text x="1025" y="553" text-anchor="middle" class="label">폐기된 별칭</text>

  <g transform="translate(450 650)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#60a5fa" stroke-width="4" stroke-linecap="round"/>
    <text x="54" y="5" class="small">배포</text>
    <rect x="166" y="-10" width="24" height="20" rx="5" fill="#3a2027" stroke="#fb7185" stroke-width="2"/>
    <text x="202" y="5" class="small">개인 환경 유지</text>
  </g>
</svg>
