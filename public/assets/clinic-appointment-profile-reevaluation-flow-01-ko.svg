<rect id="branch-2" x="734" y="1570" width="306" height="118" rx="20" fill="#101f34" stroke="#a78bfa" stroke-width="2"/><text class="outcome" x="887" y="1610" text-anchor="middle">CONFIRMED</text><text class="role" x="887" y="1644" text-anchor="middle">확정 예약 보호</text><path class="call purple-line" data-source-node="decision" data-target-node="branch-2" d="M887 1490 V1570"/>
<rect id="branch-3" x="1064" y="1570" width="306" height="118" rx="20" fill="#101f34" stroke="#fb7185" stroke-width="2"/><text class="outcome" x="1217" y="1610" text-anchor="middle">실패</text><text class="role" x="1217" y="1644" text-anchor="middle">RETRY_WAIT / QUARANTINE</text><path class="call red-line" data-source-node="decision" data-target-node="branch-3" d="M1217 1490 V1570"/>
<text class="role" x="720" y="1832" text-anchor="middle">실패는 재시도와 격리를 구분하고, 확정 예약은 보호합니다.</text>
