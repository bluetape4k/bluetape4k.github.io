<rect width="1440" height="1900" fill="url(#canvas)"/><rect class="frame" x="24" y="24" width="1392" height="1852" rx="32"/>
<text class="title" x="62" y="76">CRM 프로필 변경과 예약 재평가의 경계</text><text class="subtitle" x="64" y="108">PROPOSED·HELD만 다시 평가하고, CONFIRMED 예약은 보호합니다.</text>
<rect x="58" y="126" width="248" height="34" rx="17" fill="#12243a" stroke="#3a5877"/><text class="badge" x="182" y="148" text-anchor="middle">SCOPE · 프로필 재평가</text>
