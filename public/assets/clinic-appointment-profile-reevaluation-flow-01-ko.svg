<g><rect class="pill" x="659.4" y="820" width="391.20000000000005" height="38" rx="19" stroke="#2dd4bf"/><circle cx="679.4" cy="839" r="13" fill="#2dd4bf" fill-opacity=".2" stroke="#2dd4bf"/><text class="num" x="679.4" y="844" text-anchor="middle">5</text><text class="labelText" x="702.4" y="844">결과와 policy generation 반환</text></g><path class="call cyan-line" data-source-node="assessment" data-target-node="worker" d="M1000 870 H710"/>
<g><rect class="pill" x="791.1" y="940" width="417.8" height="38" rx="19" stroke="#a78bfa"/><circle cx="811.1" cy="959" r="13" fill="#a78bfa" fill-opacity=".2" stroke="#a78bfa"/><text class="num" x="811.1" y="964" text-anchor="middle">6</text><text class="labelText" x="834.1" y="964">상태 · 아웃박스(outbox) · 메트릭 저장</text></g><path class="call purple-line" data-source-node="worker" data-target-node="store" d="M710 990 H1290"/>
<g><rect class="pill" x="592.5" y="1060" width="525" height="38" rx="19" stroke="#60a5fa"/><circle cx="612.5" cy="1079" r="13" fill="#60a5fa" fill-opacity=".2" stroke="#60a5fa"/><text class="num" x="612.5" y="1084" text-anchor="middle">7</text><text class="labelText" x="635.5" y="1084">운영 기준 데이터 · backlog · drainState 갱신</text></g><path class="call blue-line" data-source-node="store" data-target-node="api" d="M1290 1110 H420"/>
<g><rect class="pill" x="322.85" y="1180" width="484.3" height="38" rx="19" stroke="#fbbf24"/><circle cx="342.85" cy="1199" r="13" fill="#fbbf24" fill-opacity=".2" stroke="#fbbf24"/><text class="num" x="342.85" y="1204" text-anchor="middle">8</text><text class="labelText" x="365.85" y="1204">PREVIEW 또는 ADMIN scoped redrive</text></g><path class="call amber-line" data-source-node="api" data-target-node="worker" d="M420 1230 H710"/>
<g><rect class="pill" x="862.5" y="1300" width="275" height="38" rx="19" stroke="#fb7185"/><circle cx="882.5" cy="1319" r="13" fill="#fb7185" fill-opacity=".2" stroke="#fb7185"/><text class="num" x="882.5" y="1324" text-anchor="middle">9</text><text class="labelText" x="905.5" y="1324">대상 revision 재확인</text></g><path class="call red-line" data-source-node="worker" data-target-node="store" d="M710 1350 H1290"/>
