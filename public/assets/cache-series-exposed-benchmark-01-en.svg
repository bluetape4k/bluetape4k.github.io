<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="804" viewBox="0 0 1320 804" role="img" aria-labelledby="title desc">
<title id="title">Exposed Cache Benchmark Snapshot</title>
<desc id="desc">Average latency from exposed-workshop chapter 11 benchmark. Lower is better.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#4E7FC2"/></marker>
  <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#3C9B72"/></marker>
  <marker id="arrowAmber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#C98A22"/></marker>
  <marker id="arrowRose" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L14,7 L0,14 Z" fill="#C85A73"/></marker>
  <style>
    .canvas{fill:#F7F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:42px;fill:#22344A;font-weight:700}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:16px;fill:#536476;font-weight:400}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:24px;fill:#22344A;font-weight:700}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:20px;fill:#22344A;font-weight:700}
    .body{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:14px;fill:#34465B;font-weight:400}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:12px;fill:#627184;font-weight:400}
    .num{font-family:"Comic Mono","Comic Sans MS","Comic Sans",Arial,sans-serif;font-size:16px;fill:#22344A;font-weight:700}
    .card{filter:url(#shadow);stroke-width:2}.soft{stroke-width:1.6}
    .lineBlue{fill:none;stroke:#4E7FC2;stroke-width:2.4;marker-end:url(#arrowBlue)}
    .lineGreen{fill:none;stroke:#3C9B72;stroke-width:2.4;marker-end:url(#arrowGreen)}
    .lineAmber{fill:none;stroke:#C98A22;stroke-width:2.4;marker-end:url(#arrowAmber)}
    .lineRose{fill:none;stroke:#C85A73;stroke-width:2.4;marker-end:url(#arrowRose)}
    .dashBlue{fill:none;stroke:#4E7FC2;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#arrowBlue)}
    .dashGreen{fill:none;stroke:#3C9B72;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#arrowGreen)}
    .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.2}
  </style>
</defs>
<rect class="canvas" width="1320" height="804"/>
<rect class="frame" x="34" y="28" width="1252" height="748" rx="26"/>
<text class="title" x="70" y="82">Exposed Cache Benchmark Snapshot</text>
<text class="subtitle" x="72" y="115">Average latency from exposed-workshop chapter 11 benchmark. Lower is better.</text><g transform="translate(0 44)">
<g>
  <rect class="card" x="84" y="164" width="250" height="92" rx="16" fill="#F5F7FB" stroke="#93A4B7"/>
  <text class="smallLabel" x="209" y="187" text-anchor="middle" dominant-baseline="middle">NO_CACHE</text>
<text class="body" x="209" y="215" text-anchor="middle" dominant-baseline="middle">READ_HEAVY</text>
<text class="body" x="209" y="233" text-anchor="middle" dominant-baseline="middle">517.5 us/op</text>
</g>
<g>
  <rect class="card" x="84" y="296" width="250" height="92" rx="16" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="209" y="319" text-anchor="middle" dominant-baseline="middle">READ_THROUGH</text>
<text class="body" x="209" y="347" text-anchor="middle" dominant-baseline="middle">READ_HEAVY</text>
<text class="body" x="209" y="365" text-anchor="middle" dominant-baseline="middle">94.3 us/op</text>
</g>
<g>
  <rect class="card" x="84" y="428" width="250" height="92" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="209" y="451" text-anchor="middle" dominant-baseline="middle">WRITE_THROUGH</text>
<text class="body" x="209" y="479" text-anchor="middle" dominant-baseline="middle">READ_HEAVY</text>
<text class="body" x="209" y="497" text-anchor="middle" dominant-baseline="middle">52.1 us/op</text>
</g>
<g>
  <rect class="card" x="84" y="560" width="250" height="92" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="209" y="583" text-anchor="middle" dominant-baseline="middle">WRITE_HEAVY</text>
<text class="body" x="209" y="611" text-anchor="middle" dominant-baseline="middle">445-508 us/op</text>
<text class="body" x="209" y="629" text-anchor="middle" dominant-baseline="middle">strategy effect small</text>
</g>
<g><rect x="430" y="190" width="720" height="42" rx="12" fill="#F5F7FB" stroke="#93A4B7" stroke-width="2"/><rect x="430" y="190" width="720" height="42" rx="12" fill="#93A4B7" opacity="0.24"/></g>
<g><rect x="430" y="322" width="720" height="42" rx="12" fill="#EAF7EF" stroke="#58A978" stroke-width="2"/><rect x="430" y="322" width="131" height="42" rx="12" fill="#58A978" opacity="0.28"/></g>
<g><rect x="430" y="454" width="720" height="42" rx="12" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="2"/><rect x="430" y="454" width="72" height="42" rx="12" fill="#5B8DEF" opacity="0.30"/></g>
<g><rect x="430" y="586" width="720" height="42" rx="12" fill="#FFF3D9" stroke="#D6A441" stroke-width="2"/><rect x="430" y="586" width="620" height="42" rx="12" fill="#D6A441" opacity="0.24"/></g>
<g>
  <rect class="card" x="830" y="326" width="320" height="116" rx="16" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="990" y="352" text-anchor="middle" dominant-baseline="middle">Reading</text>
<text class="body" x="990" y="380" text-anchor="middle" dominant-baseline="middle">READ_THROUGH 5.5x faster</text>
<text class="body" x="990" y="398" text-anchor="middle" dominant-baseline="middle">WRITE_THROUGH 9.9x faster</text>
<text class="body" x="990" y="416" text-anchor="middle" dominant-baseline="middle">when reads dominate</text>
</g>
<path class="connector lineBlue" d="M334 210 H430"/>
<path class="connector lineGreen" d="M334 342 H430"/><rect class="pill" x="334" y="310" width="96" height="24" rx="12"/><text class="small" x="382" y="326" text-anchor="middle">5.5x faster</text>
<path class="connector lineBlue" d="M334 474 H430"/><rect class="pill" x="334" y="442" width="96" height="24" rx="12"/><text class="small" x="382" y="458" text-anchor="middle">9.9x faster</text>
<path class="connector lineAmber" d="M334 606 H430"/><rect class="pill" x="336" y="574" width="92" height="24" rx="12"/><text class="small" x="382" y="590" text-anchor="middle">write-heavy</text>
</g></svg>
