<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Service Text-Processing Boundaries and Quality Evidence</title>
  <desc id="desc">Five-stage flow from HTTP body limits through service validation, normalization and routing, text analysis, service decisions, and quality gates</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#60A5FA"/>
    </marker>
  </defs>
  <style>
    .canvas{fill:#07111F}.frame{fill:#0D1B2D;stroke:#38506A;stroke-width:2}
    .card{fill:#10243A;stroke:#38506A;stroke-width:2}
    .title{font:700 30px "Architects Daughter","Comic Sans MS",cursive;fill:#E6F2FF}
    .subtitle{font:500 16px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#A9BDD1}
    .step{font:800 16px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#07111F}
    .card-title{font:700 17px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#E6F2FF}
    .body{font:500 15px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#A9BDD1}
    .connector{fill:none;stroke:#60A5FA;stroke-width:5;stroke-linecap:round}
    .note-title{font:700 16px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#E6F2FF}
    .note{font:500 14px "Comic Mono","SFMono-Regular",Menlo,monospace;fill:#A9BDD1}
  </style>
  <rect width="1600" height="900" class="canvas"/>
  <rect x="32" y="32" width="1536" height="836" rx="32" class="frame"/>
  <text x="70" y="104" class="title">Service Text-Processing Boundaries and Quality Evidence</text>
  <text x="70" y="146" class="subtitle">Apply low-cost boundary checks first, run only the analysis that is needed, and protect outcomes with reproducible tests</text>
  <rect x="70" y="192" width="1460" height="400" rx="28" fill="#0A1727" stroke="#38506A" stroke-width="2"/>
  <path d="M 330 398 H 360" class="connector" marker-end="url(#arrow)"/>
<path d="M 630 398 H 660" class="connector" marker-end="url(#arrow)"/>
<path d="M 930 398 H 960" class="connector" marker-end="url(#arrow)"/>
<path d="M 1230 398 H 1260" class="connector" marker-end="url(#arrow)"/>
  <g data-card="1">
        <rect x="70" y="248" width="260" height="300" rx="24" class="card"/>
        <circle cx="104" cy="282" r="17" fill="#60A5FA"/>
        <text x="104" y="289" text-anchor="middle" class="step">1</text>
        <text x="94" y="344" class="card-title">Transport boundary</text>
        <rect x="94" y="370" width="70" height="4" rx="2" fill="#60A5FA"/>
        <text x="94" y="422" class="body"><tspan x="94" dy="0">Cap the HTTP request body</tspan><tspan x="94" dy="36">Reject before String allocation</tspan></text>
      </g>
<g data-card="2">
        <rect x="370" y="248" width="260" height="300" rx="24" class="card"/>
        <circle cx="404" cy="282" r="17" fill="#36C5F0"/>
        <text x="404" y="289" text-anchor="middle" class="step">2</text>
        <text x="394" y="344" class="card-title">Service validation</text>
        <rect x="394" y="370" width="70" height="4" rx="2" fill="#36C5F0"/>
        <text x="394" y="422" class="body"><tspan x="394" dy="0">Check length and blank input</tspan><tspan x="394" dy="36">Do not echo raw text</tspan></text>
      </g>
<g data-card="3">
        <rect x="670" y="248" width="260" height="300" rx="24" class="card"/>
        <circle cx="704" cy="282" r="17" fill="#5EEAD4"/>
        <text x="704" y="289" text-anchor="middle" class="step">3</text>
        <text x="694" y="344" class="card-title">Normalize and route</text>
        <rect x="694" y="370" width="70" height="4" rx="2" fill="#5EEAD4"/>
        <text x="694" y="422" class="body"><tspan x="694" dy="0">Normalize representation</tspan><tspan x="694" dy="36">Detect language and route</tspan></text>
      </g>
<g data-card="4">
        <rect x="970" y="248" width="260" height="300" rx="24" class="card"/>
        <circle cx="1004" cy="282" r="17" fill="#B794F4"/>
        <text x="1004" y="289" text-anchor="middle" class="step">4</text>
        <text x="994" y="344" class="card-title">Analyze text</text>
        <rect x="994" y="370" width="70" height="4" rx="2" fill="#B794F4"/>
        <text x="994" y="422" class="body"><tspan x="994" dy="0">Tokenize Korean/Japanese</tspan><tspan x="994" dy="36">Aho-Corasick keyword search</tspan></text>
      </g>
<g data-card="5">
        <rect x="1270" y="248" width="260" height="300" rx="24" class="card"/>
        <circle cx="1304" cy="282" r="17" fill="#FBBF24"/>
        <text x="1304" y="289" text-anchor="middle" class="step">5</text>
        <text x="1294" y="344" class="card-title">Decide and verify</text>
        <rect x="1294" y="370" width="70" height="4" rx="2" fill="#FBBF24"/>
        <text x="1294" y="422" class="body"><tspan x="1294" dy="0">Filter, index, or route</tspan><tspan x="1294" dy="36">Verify with stable fixtures</tspan></text>
      </g>
  <g>
    <rect x="70" y="628" width="710" height="174" rx="22" fill="#0A1727" stroke="#36C5F0" stroke-width="2"/>
    <circle cx="104" cy="670" r="8" fill="#36C5F0"/>
    <text x="126" y="678" class="note-title">Input memory boundary</text>
    <text x="104" y="728" class="note"><tspan x="104" dy="0">A String-length guard protects an already materialized value.</tspan><tspan x="104" dy="30">The transport must cap the HTTP body before that point.</tspan></text>
  </g>
  <g>
    <rect x="820" y="628" width="710" height="174" rx="22" fill="#0A1727" stroke="#FBBF24" stroke-width="2"/>
    <circle cx="854" cy="670" r="8" fill="#FBBF24"/>
    <text x="876" y="678" class="note-title">Quality claim boundary</text>
    <text x="854" y="728" class="note"><tspan x="854" dy="0">The gate fixes representative repository behavior.</tspan><tspan x="854" dy="30">It does not claim statistical accuracy on a large external corpus.</tspan></text>
  </g>
</svg>