name: Deploy Website

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test generators
        run: npm test
      - name: Validate manual snapshot
        run: npm run check:manual -- --report "$RUNNER_TEMP/manual-validation.json"
      - name: Build site
        run: npm run build
      - name: Publish manual validation summary
        if: always()
        run: node scripts/manual/write-job-summary.mjs "$RUNNER_TEMP/manual-validation.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload manual validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/manual-validation.json
          retention-days: 14
      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
