<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k Layer Flow</title>
  <desc id="desc">Layered overview showing how Spring Boot and Ktor applications use foundation, domain, data, and infrastructure modules.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "Architects Daughter", "Comic Sans MS", "Trebuchet MS", sans-serif; font-size: 42px; font-weight: 700; fill: #263238; }
      .subtitle { font-family: "Trebuchet MS", "Comic Sans MS", sans-serif; font-size: 18px; fill: #52616b; }
      .label { font-family: "Architects Daughter", "Comic Sans MS", "Trebuchet MS", sans-serif; font-size: 25px; font-weight: 700; fill: #22313f; }
      .detail { font-family: "Trebuchet MS", "Comic Sans MS", sans-serif; font-size: 17px; fill: #41515f; }
      .small { font-family: "Trebuchet MS", "Comic Sans MS", sans-serif; font-size: 15px; fill: #52616b; }
      .badge { font-family: "Trebuchet MS", "Comic Sans MS", sans-serif; font-size: 16px; font-weight: 700; fill: #263238; }
      .card { stroke-width: 2; rx: 18; ry: 18; }
      .soft-shadow { filter: drop-shadow(0 10px 16px rgba(30, 41, 59, 0.10)); }
      .arrow { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowhead); }
      .support-arrow { fill: none; stroke: #7c8a99; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 8; marker-end: url(#arrowhead-soft); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b" />
    </marker>
    <marker id="arrowhead-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c8a99" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="820" />
  <rect x="36" y="32" width="1208" height="756" rx="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <text x="640" y="92" text-anchor="middle" class="title">Bluetape4k Layer Flow</text>
  <text x="640" y="126" text-anchor="middle" class="subtitle">Application entrypoints compose domain capabilities, data access, infrastructure, and shared JVM foundations.</text>

  <g class="soft-shadow">
    <rect class="card" x="360" y="158" width="560" height="116" fill="#e0f2fe" stroke="#7dd3fc" />
    <text x="640" y="204" text-anchor="middle" class="label">Application Layer</text>
    <text x="640" y="236" text-anchor="middle" class="detail">Spring Boot 4  |  Ktor 3</text>
    <text x="640" y="258" text-anchor="middle" class="small">Service boundary, API runtime, framework integration</text>
  </g>

  <g class="soft-shadow">
    <rect class="card" x="96" y="334" width="324" height="142" fill="#fef3c7" stroke="#fbbf24" />
    <text x="258" y="382" text-anchor="middle" class="label">Domain Capabilities</text>
    <text x="258" y="415" text-anchor="middle" class="detail">Leader  |  JaVers</text>
    <text x="258" y="440" text-anchor="middle" class="detail">Image  |  Text</text>
    <text x="258" y="463" text-anchor="middle" class="small">Optional domain services</text>
  </g>

  <g class="soft-shadow">
    <rect class="card" x="478" y="334" width="324" height="142" fill="#dcfce7" stroke="#86efac" />
    <text x="640" y="382" text-anchor="middle" class="label">Data Layer</text>
    <text x="640" y="415" text-anchor="middle" class="detail">Exposed  |  R2DBC</text>
    <text x="640" y="440" text-anchor="middle" class="detail">JDBC  |  GraphDB</text>
    <text x="640" y="463" text-anchor="middle" class="small">Persistence, query, cache, graph access</text>
  </g>

  <g class="soft-shadow">
    <rect class="card" x="860" y="334" width="324" height="142" fill="#fae8ff" stroke="#d8b4fe" />
    <text x="1022" y="382" text-anchor="middle" class="label">Infrastructure</text>
    <text x="1022" y="415" text-anchor="middle" class="detail">AWS  |  Messaging  |  Cache</text>
    <text x="1022" y="440" text-anchor="middle" class="detail">Observability  |  Resilience</text>
    <text x="1022" y="463" text-anchor="middle" class="small">Cloud, events, operations</text>
  </g>

  <g class="soft-shadow">
    <rect class="card" x="168" y="566" width="944" height="122" fill="#ede9fe" stroke="#a78bfa" />
    <text x="640" y="612" text-anchor="middle" class="label">Foundation Layer</text>
    <text x="640" y="646" text-anchor="middle" class="detail">Core  |  Coroutines  |  Virtual Threads  |  Testing  |  BOM</text>
    <text x="640" y="670" text-anchor="middle" class="small">Shared Kotlin/JVM utilities, execution models, test support, version governance</text>
  </g>

  <g>
    <rect x="218" y="716" width="844" height="44" rx="22" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <text x="640" y="744" text-anchor="middle" class="badge">External systems: RDBMS, Redis, Kafka, NATS, AWS, Graph DB, Observability backends</text>
  </g>

  <path class="arrow" d="M530 274 C450 298, 350 308, 286 334" />
  <path class="arrow" d="M640 274 L640 334" />
  <path class="arrow" d="M750 274 C830 298, 930 308, 994 334" />

  <path class="support-arrow" d="M410 566 C350 540, 296 516, 270 476" />
  <path class="support-arrow" d="M640 566 L640 476" />
  <path class="support-arrow" d="M870 566 C930 540, 984 516, 1010 476" />

  <path class="support-arrow" d="M640 688 L640 716" />

  <g>
    <rect x="88" y="180" width="170" height="58" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <text x="173" y="205" text-anchor="middle" class="small">Choose the runtime</text>
    <text x="173" y="227" text-anchor="middle" class="small">then add layers</text>
  </g>
  <path class="support-arrow" d="M258 209 C292 210, 322 214, 360 216" />
</svg>
