<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-label="Class diagram UML infographic style sample">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#8a97a8" stroke-width="1.7"/>
  </marker>
  <marker id="dependency" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#8a97a8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .canvas { fill: #f7f9fc; }
    .frame { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1.5; }
    .title { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 54px; font-weight: 400; fill: #102033; }
    .subtitle { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 18px; fill: #536273; }
    .className { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 30px; font-weight: 400; fill: #102033; }
    .stereo { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14px; fill: #536273; }
    .member { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; fill: #102033; }
    .small { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; fill: #536273; }
    .noteTitle { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 30px; fill: #102033; }
    .footerTitle { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 30px; fill: #ffffff; }
    .footerText { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14px; fill: #dbeafe; }
    .uml { stroke-width: 2.2; filter: url(#shadow); }
    .compartment { stroke-width: 1.6; fill: none; }
    .inheritLine { stroke: #8a97a8; stroke-width: 2.2; fill: none; marker-end: url(#inherit); }
    .implLine { stroke: #8a97a8; stroke-width: 2.2; stroke-dasharray: 8 7; fill: none; marker-end: url(#inherit); }
    .depLine { stroke: #8a97a8; stroke-width: 2; stroke-dasharray: 6 6; fill: none; marker-end: url(#dependency); }
    .chip { stroke-width: 1.5; rx: 16; }
    .chipText { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #102033; }
  </style>
</defs>

<rect class="canvas" width="1600" height="1050"/>
<rect class="frame" x="46" y="34" width="1508" height="982" rx="32"/>
<text class="title" x="86" y="98">Class Diagram Style v3</text>
<text class="subtitle" x="90" y="132">UML compartments, vertical inheritance, and larger handwritten headings</text>

<g transform="translate(1012,64)">
  <rect class="chip" x="0" y="0" width="130" height="36" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="chipText" x="65" y="24" text-anchor="middle">class</text>
  <rect class="chip" x="146" y="0" width="130" height="36" fill="#fff3d9" stroke="#d6a441"/>
  <text class="chipText" x="211" y="24" text-anchor="middle">interface</text>
  <rect class="chip" x="292" y="0" width="130" height="36" fill="#fdecef" stroke="#dc6b82"/>
  <text class="chipText" x="357" y="24" text-anchor="middle">object</text>
  <rect class="chip" x="438" y="0" width="130" height="36" fill="#eaf7ef" stroke="#58a978"/>
  <text class="chipText" x="503" y="24" text-anchor="middle">entity</text>
</g>

<!-- Interface at the top: implemented vertically by entities below -->
<g transform="translate(612,184)">
  <rect class="uml" x="0" y="0" width="376" height="178" rx="4" fill="#fff3d9" stroke="#d6a441"/>
  <line class="compartment" x1="0" y1="78" x2="376" y2="78" stroke="#d6a441"/>
  <line class="compartment" x1="0" y1="126" x2="376" y2="126" stroke="#d6a441"/>
  <text class="stereo" x="188" y="28" text-anchor="middle">«interface»</text>
  <text class="className" x="188" y="62" text-anchor="middle">HasIdentifier&lt;ID&gt;</text>
  <text class="member" x="24" y="108">+ id: ID</text>
  <text class="member" x="24" y="154">+ stable identity contract</text>
</g>

<!-- Support table: dependency, not inheritance -->
<g transform="translate(112,508)">
  <rect class="uml" x="0" y="0" width="366" height="248" rx="4" fill="#e8f3ff" stroke="#5b8def"/>
  <line class="compartment" x1="0" y1="84" x2="366" y2="84" stroke="#5b8def"/>
  <line class="compartment" x1="0" y1="192" x2="366" y2="192" stroke="#5b8def"/>
  <text class="stereo" x="183" y="30" text-anchor="middle">«abstract class»</text>
  <text class="className" x="183" y="66" text-anchor="middle">AuditableLongIdTable</text>
  <text class="member" x="24" y="116">+ createdBy: Column&lt;String&gt;</text>
  <text class="member" x="24" y="146">+ createdAt: Column&lt;Instant&gt;</text>
  <text class="member" x="24" y="176">+ updatedAt: Column&lt;Instant&gt;</text>
  <text class="member" x="24" y="224"># audit columns</text>
</g>

<!-- Concrete entities vertically below interface -->
<g transform="translate(612,430)">
  <rect class="uml" x="0" y="0" width="376" height="244" rx="4" fill="#eaf7ef" stroke="#58a978"/>
  <line class="compartment" x1="0" y1="78" x2="376" y2="78" stroke="#58a978"/>
  <line class="compartment" x1="0" y1="160" x2="376" y2="160" stroke="#58a978"/>
  <text class="stereo" x="188" y="28" text-anchor="middle">«entity base»</text>
  <text class="className" x="188" y="62" text-anchor="middle">AuditableEntity&lt;ID&gt;</text>
  <text class="member" x="24" y="108">+ id: EntityID&lt;ID&gt;</text>
  <text class="member" x="24" y="138">+ audit state</text>
  <text class="member" x="24" y="194">+ beforeInsert()</text>
  <text class="member" x="24" y="224">+ beforeUpdate()</text>
</g>

<g transform="translate(526,792)">
  <rect class="uml" x="0" y="0" width="264" height="122" rx="4" fill="#eaf7ef" stroke="#58a978"/>
  <line class="compartment" x1="0" y1="74" x2="264" y2="74" stroke="#58a978"/>
  <text class="stereo" x="132" y="28" text-anchor="middle">«domain entity»</text>
  <text class="className" x="132" y="62" text-anchor="middle">UserEntity</text>
  <text class="member" x="24" y="100">+ domain behavior</text>
</g>

<g transform="translate(814,792)">
  <rect class="uml" x="0" y="0" width="264" height="122" rx="4" fill="#eaf7ef" stroke="#58a978"/>
  <line class="compartment" x1="0" y1="74" x2="264" y2="74" stroke="#58a978"/>
  <text class="stereo" x="132" y="28" text-anchor="middle">«domain entity»</text>
  <text class="className" x="132" y="62" text-anchor="middle">OrderEntity</text>
  <text class="member" x="24" y="100">+ domain behavior</text>
</g>

<!-- Context object on side -->
<g transform="translate(1110,508)">
  <rect class="uml" x="0" y="0" width="386" height="244" rx="4" fill="#fdecef" stroke="#dc6b82"/>
  <line class="compartment" x1="0" y1="78" x2="386" y2="78" stroke="#dc6b82"/>
  <line class="compartment" x1="0" y1="156" x2="386" y2="156" stroke="#dc6b82"/>
  <text class="stereo" x="193" y="28" text-anchor="middle">«object»</text>
  <text class="className" x="193" y="62" text-anchor="middle">UserContext</text>
  <text class="member" x="24" y="110">+ currentUser(): String?</text>
  <text class="member" x="24" y="190">+ withUser(name) { block }</text>
  <text class="small" x="24" y="220">scoped principal for audit writes</text>
</g>

<!-- Vertical relationships -->
<path class="implLine" d="M800 430 L800 378"/>
<text class="small" x="820" y="404">implements</text>
<path class="inheritLine" d="M658 792 L658 734 L800 734 L800 690"/>
<path class="inheritLine" d="M946 792 L946 734 L800 734 L800 690"/>
<rect x="772" y="700" width="78" height="30" rx="15" fill="#ffffff" opacity="0.94"/>
<text class="small" x="786" y="720">extends</text>
<path class="depLine" d="M612 590 C558 590 540 632 478 632"/>
<rect x="502" y="590" width="96" height="30" rx="15" fill="#ffffff" opacity="0.94"/>
<text class="small" x="516" y="610">uses table</text>
<path class="depLine" d="M988 598 C1038 598 1062 604 1110 616"/>
<rect x="1008" y="566" width="164" height="30" rx="15" fill="#ffffff" opacity="0.94"/>
<text class="small" x="1022" y="586">uses UserContext</text>

<!-- Legend / reading rule -->
<g transform="translate(1110,784)">
  <rect class="uml" x="0" y="0" width="386" height="172" rx="18" fill="#e9f7f6" stroke="#45a7a1"/>
  <text class="noteTitle" x="28" y="48">Reading rule</text>
  <text class="member" x="30" y="86">Triangle = inheritance / implementation</text>
  <text class="member" x="30" y="120">Compartments preserve UML class shape</text>
  <text class="member" x="30" y="154">Large labels use Architects Daughter</text>
</g>
</svg>
