<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-label="Sequence diagram style sample">

<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a97a8"/>
  </marker>
  <style>
    .canvas { fill: #f7f9fc; }
    .frame { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1.5; }
    .title { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 54px; font-weight: 400; fill: #102033; }
    .subtitle { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 18px; fill: #536273; }
    .label { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 30px; font-weight: 400; fill: #102033; }
    .section { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 17px; font-weight: 700; fill: #102033; }
    .item { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 15px; fill: #102033; }
    .small { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; fill: #536273; }
    .tiny { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; fill: #536273; }
    .chipText { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #102033; }
    .footerTitle { font-family: "Architects Daughter", "Comic Mono", cursive; font-size: 30px; font-weight: 400; fill: #ffffff; }
    .footerText { font-family: "Comic Mono", "SFMono-Regular", Menlo, Consolas, monospace; font-size: 14px; fill: #dbeafe; }
    .card { stroke-width: 2; rx: 20; filter: url(#shadow); }
    .inner { stroke-width: 1.5; rx: 14; fill: #ffffff; }
    .line { stroke: #8a97a8; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #8a97a8; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
    .lifeline { stroke: #b7c2cf; stroke-width: 2; stroke-dasharray: 9 9; }
  </style>
</defs>
<rect class="canvas" width="1600" height="1050"/>
<rect class="frame" x="46" y="34" width="1508" height="982" rx="32"/>
<text class="title" x="86" y="96">Sequence Diagram Style</text>
<text class="subtitle" x="88" y="128">Lifelines remain, but messages are grouped into readable pastel interaction bands</text>

<g transform="translate(1040,64)">
  <rect x="0" y="0" width="132" height="36" rx="18" fill="#e8f3ff" stroke="#5b8def" stroke-width="1.5"/>
  <text class="chipText" x="66" y="24" text-anchor="middle">Request</text>
  <rect x="148" y="0" width="132" height="36" rx="18" fill="#eaf7ef" stroke="#58a978" stroke-width="1.5"/>
  <text class="chipText" x="214" y="24" text-anchor="middle">Suspend</text>
  <rect x="296" y="0" width="132" height="36" rx="18" fill="#fff3d9" stroke="#d6a441" stroke-width="1.5"/>
  <text class="chipText" x="362" y="24" text-anchor="middle">Response</text>
</g>

<g transform="translate(124,190)">
  <rect class="card" width="236" height="70" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="label" x="42" y="46">Controller</text>
  <line class="lifeline" x1="118" y1="86" x2="118" y2="650"/>
</g>
<g transform="translate(474,190)">
  <rect class="card" width="236" height="70" fill="#eaf7ef" stroke="#58a978"/>
  <text class="label" x="70" y="46">Service</text>
  <line class="lifeline" x1="118" y1="86" x2="118" y2="650"/>
</g>
<g transform="translate(824,190)">
  <rect class="card" width="236" height="70" fill="#fff3d9" stroke="#d6a441"/>
  <text class="label" x="50" y="46">Repository</text>
  <line class="lifeline" x1="118" y1="86" x2="118" y2="650"/>
</g>
<g transform="translate(1174,190)">
  <rect class="card" width="236" height="70" fill="#f3eeff" stroke="#8b75d7"/>
  <text class="label" x="72" y="46">Redis</text>
  <line class="lifeline" x1="118" y1="86" x2="118" y2="650"/>
</g>

<g transform="translate(190,322)">
  <rect class="card" width="1038" height="76" fill="#e8f3ff" stroke="#5b8def"/>
  <text class="chipText" x="26" y="30">1</text>
  <text class="item" x="66" y="32">GET /users/{id}</text>
  <text class="small" x="66" y="56">Controller validates path variables and enters suspend handler</text>
  <path class="line" d="M180 38 H370"/>
</g>

<g transform="translate(548,432)">
  <rect class="card" width="680" height="76" fill="#eaf7ef" stroke="#58a978"/>
  <text class="chipText" x="26" y="30">2</text>
  <text class="item" x="66" y="32">service.findUser(id)</text>
  <text class="small" x="66" y="56">Cancellation propagates through coroutine scope</text>
  <path class="line" d="M164 38 H370"/>
</g>

<g transform="translate(892,542)">
  <rect class="card" width="494" height="76" fill="#fff3d9" stroke="#d6a441"/>
  <text class="chipText" x="26" y="30">3</text>
  <text class="item" x="66" y="32">cache lookup or DB query</text>
  <text class="small" x="66" y="56">Repository decides Redis hit vs fallback access</text>
  <path class="line" d="M164 38 H300"/>
</g>

<g transform="translate(350,662)">
  <rect class="card" width="900" height="86" fill="#f3eeff" stroke="#8b75d7"/>
  <text class="chipText" x="26" y="34">4</text>
  <text class="item" x="66" y="36">User DTO response</text>
  <text class="small" x="66" y="62">Return path is shown as one compact response band to reduce visual noise</text>
  <path class="dash" d="M740 42 H124"/>
  <polygon class="arrow" points="122,35 108,42 122,49"/>
</g>

<g transform="translate(124,810)">
  <rect class="card" width="1286" height="132" fill="#102033" stroke="#102033"/>
  <text class="footerTitle" x="28" y="44">Reading rule</text>
  <text class="footerText" x="28" y="76">Keep actors as lifelines, but make each interaction a numbered band with intent and cancellation/cache notes.</text>
  <text class="footerText" x="28" y="102">Use dashed return only once unless the response path carries important behavior.</text>
</g>
</svg>
